# 生产部署只认 release 分支（Cloudflare Pages 的 production_branch = release）。
# 真实 push 到 main 时，把 release 快进到同一个 commit，触发一次生产构建。
# 这样 main 依旧是日常开发分支，而 GitHub 侧重放的「历史 main push webhook」
# 不会再把旧 commit 构建成生产版本。
name: Promote main to release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward release to main
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          # release 只作为部署指针，正常情况是快进；若被意外改动则强制对齐到 main
          git push origin "HEAD:refs/heads/release" || git push --force origin "HEAD:refs/heads/release"
