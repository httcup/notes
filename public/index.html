<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>小胡小胡的笔记</title>
<style>
/* ============ tokens（取自 ivyNote 真实配色） ============ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  --shelf-w:296px;
  --spring:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-hover:31 104 69; --ivy-soft:229 243 235; --on-ivy:255 255 255; --ivy-ink:27 92 60;
  --warn:190 134 48; --warn-ink:110 78 26; --warn-soft:252 244 228;
  --danger:176 62 54; --danger-soft:252 235 233;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
  --shadow-float:0 0 0 .5px rgb(16 24 32 / .06),0 2px 6px rgb(16 24 32 / .05),0 12px 28px -10px rgb(16 24 32 / .14);
  --shadow-lift:0 0 0 .5px rgb(16 24 32 / .07),0 8px 16px -6px rgb(16 24 32 / .08),0 32px 64px -16px rgb(16 24 32 / .22);
  --tag-green-fg:#3f7a5b; --tag-blue-fg:#4f6a9a; --tag-amber-fg:#a0702c; --tag-pink-fg:#a65a7c; --tag-gray-fg:#6f767d; --tag-purple-fg:#7a62a8;
  --hl-green-bg:229 243 235; --hl-green-fg:27 92 60;
  --hl-yellow-bg:253 240 197; --hl-yellow-fg:122 88 12;
  --hl-pink-bg:252 226 229; --hl-pink-fg:154 44 60;
  --hl-blue-bg:219 234 250; --hl-blue-fg:28 78 132;
  --hl-purple-bg:235 226 248; --hl-purple-fg:94 58 148;
  --hl-gray-bg:233 236 239; --hl-gray-fg:71 78 85;
}
[data-theme=dark]{
  color-scheme:dark;
  --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
  --ink:232 235 238; --ink-2:190 195 200; --muted:138 144 150; --faint:96 101 107;
  --line:44 48 52; --hover:38 41 45;
  --ivy:86 180 130; --ivy-hover:110 196 150; --ivy-soft:28 50 39; --on-ivy:10 28 18; --ivy-ink:150 224 182;
  --warn:214 170 98; --warn-ink:232 205 158; --warn-soft:48 40 26;
  --danger:226 128 116; --danger-soft:58 33 31;
  --code-bg:31 34 38;
  --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  --shadow-float:0 0 0 .5px rgb(255 255 255 / .07),0 12px 28px -10px rgb(0 0 0 / .6);
  --shadow-lift:0 0 0 .5px rgb(255 255 255 / .08),0 32px 64px -16px rgb(0 0 0 / .7);
  --tag-green-fg:#92c4a6; --tag-blue-fg:#9db2dc; --tag-amber-fg:#d9b77e; --tag-pink-fg:#dba6bf; --tag-gray-fg:#a3a9af; --tag-purple-fg:#bcaae0;
  --hl-green-bg:28 50 39; --hl-green-fg:150 224 182;
  --hl-yellow-bg:58 47 20; --hl-yellow-fg:240 214 128;
  --hl-pink-bg:58 30 34; --hl-pink-fg:240 168 176;
  --hl-blue-bg:24 42 64; --hl-blue-fg:150 196 240;
  --hl-purple-bg:44 34 60; --hl-purple-fg:196 176 240;
  --hl-gray-bg:44 47 51; --hl-gray-fg:190 195 200;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgb(var(--ivy) / .18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgb(var(--ink) / .13);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--ink) / .22);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.shell{display:flex;height:100dvh;overflow:hidden}

/* ============ shelf ============ */
.shelf{
  width:var(--shelf-w);flex:0 0 var(--shelf-w);display:flex;flex-direction:column;
  padding:14px 12px 12px;position:relative;transition:margin-left .34s var(--spring),opacity .2s;
}
.shelf.collapsed{margin-left:calc(var(--shelf-w) * -1);opacity:0;pointer-events:none}
.shelf-open{
  position:fixed;left:12px;top:12px;z-index:40;width:32px;height:32px;display:none;place-items:center;
  border-radius:8px;color:rgb(var(--muted));background:rgb(var(--surface)/.9);
  box-shadow:var(--shadow-float);backdrop-filter:blur(8px);
}
.shelf-open:hover{color:rgb(var(--ink))}
.shelf-open.show{display:grid}
.shelf-open svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.shelf-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand-name{
  font-family:var(--font-serif);font-size:17.5px;font-weight:700;letter-spacing:0;
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.head-actions{display:flex;align-items:center;gap:0;flex:0 0 auto}
/* 日程视图：不要「新建笔记」，换成使用说明与「显示今天已完成」 */
.head-actions .todo-only{display:none}
body.view-todo .head-actions .todo-only{display:flex}
body.view-todo .head-actions .notes-only{display:none}
.head-sw{align-items:center;gap:5px;margin-left:6px;font-size:10.5px;color:rgb(var(--faint));cursor:pointer;user-select:none}
.head-sw input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.head-sw i{width:22px;height:13px;border-radius:8px;background:rgb(var(--line));position:relative;transition:background .18s;flex:0 0 auto}
.head-sw i::after{content:'';position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.head-sw input:checked + i{background:rgb(var(--ivy))}
.head-sw input:checked + i::after{transform:translateX(9px)}
.head-sw span{white-space:nowrap}
.icon-btn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--muted));transition:background .15s,color .15s;
}
.icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.shelf-body{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px 64px;scrollbar-gutter:stable}
.sec-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));
  margin:10px 8px 6px;
}
.sec-label .count{font-weight:500;color:rgb(var(--faint))}
.shelf-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));
  transition:background .14s,color .14s;position:relative;
}
.shelf-row:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.shelf-row svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.shelf-row .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.shelf-row .meta{font-size:11px;color:rgb(var(--faint));flex:0 0 auto}
.shelf-row.new-nb{color:rgb(var(--ivy));font-size:13px;padding:6px 8px}
.shelf-row.new-nb:hover{background:rgb(var(--ivy-soft))}
.shelf-row.new-nb svg{color:currentColor}

.nb-group{margin-top:2px}
.nb-row{display:flex;align-items:center;gap:0;border-radius:7px}
.nb-row:hover{background:rgb(var(--hover))}
.nb-more{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--faint));opacity:.28;transition:opacity .12s,background .12s;margin-right:4px;
}
.nb-row:hover .nb-more{opacity:1}
.nb-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.nb-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb-head{
  display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:7px;
  color:rgb(var(--muted));font-size:12px;font-weight:600;letter-spacing:.02em;
}
.nb-row:hover .nb-head{color:rgb(var(--ink-2))}
.nb-head svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb-head.open svg.chev{transform:rotate(90deg)}
.nb-head .t{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-notes{padding-left:8px}
.nb-notes.hidden{display:none}

.note-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px;color:rgb(var(--ink-2));font-size:13.5px;
  transition:background .14s,color .14s;
}
.note-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.note-item.active{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.note-item svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.note-item.active svg{color:rgb(var(--ivy))}
.note-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .tags{display:flex;gap:3px;flex:0 0 auto}
.dot-tag{width:5px;height:5px;border-radius:50%}

/* 左侧标签分类（可折叠树：标签 → 该标签下的笔记） */
.tag-sec{margin-top:12px}
.tag-sec-head{
  display:flex;align-items:center;gap:6px;width:calc(100% - 16px);text-align:left;
  margin:10px 8px 6px;padding:2px 0;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));
}
.tag-sec-head:hover{color:rgb(var(--ink-2))}
.tag-sec-head .caret,.tag-caret{
  flex:0 0 auto;width:9px;text-align:center;font-size:8px;line-height:1;
  color:rgb(var(--faint));transition:transform .18s;
}
.tag-sec-head.open .caret,.tag-row.open .tag-caret{transform:rotate(90deg)}
.tag-sec-head svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tag-sec-head .count{margin-left:auto;font-weight:500;color:rgb(var(--faint))}
.tag-group{margin:1px 0}
.tag-line{position:relative;border-radius:7px}
.tag-line:hover{background:rgb(var(--hover))}
.shelf-row.tag-row{padding:5px 8px;padding-right:30px;gap:7px;color:rgb(var(--ink-2))}
.shelf-row.tag-row:hover{background:transparent;color:rgb(var(--ink))}
.tag-row .meta{transition:opacity .12s}
.tag-line:hover .tag-row .meta{opacity:0}
.tag-more{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:rgb(var(--muted));opacity:0;pointer-events:none;
  transition:opacity .12s,background .12s,color .12s;
}
.tag-line:hover .tag-more{opacity:1;pointer-events:auto}
.tag-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.tag-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.po-note{font-size:11.5px;line-height:1.55;color:rgb(var(--faint));padding:4px 8px 6px;max-width:230px}
.tag-hash{font-size:12.5px;line-height:1;flex:0 0 auto;font-weight:500}
.tag-dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.tag-notes{margin-left:17px;padding-left:10px;border-left:1px solid rgb(var(--line))}
.tag-notes .note-item{padding:5px 8px;font-size:12.8px}
.tag-empty{font-size:11.5px;color:rgb(var(--faint));padding:4px 8px 6px;line-height:1.6}

/* 单篇笔记的标签选择器 */
.tag-pick{width:238px;padding:6px}
.tp-search{padding:0 2px 6px}
.tp-search input{
  width:100%;height:28px;border:0;border-radius:7px;outline:none;
  background:rgb(var(--ink)/.05);padding:0 9px;font-size:12.5px;color:rgb(var(--ink));
}
.tp-search input::placeholder{color:rgb(var(--faint))}
.tp-list{max-height:230px;overflow-y:auto;scrollbar-width:thin}
.tp-list::-webkit-scrollbar{width:6px}
.tp-list::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px}
.tp-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));font-size:12.5px;
}
.tp-row:hover{background:rgb(var(--hover))}
.tp-row .tp-dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.tp-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-row .n{font-size:10.5px;color:rgb(var(--faint))}
.tp-row .ck{width:14px;text-align:center;color:rgb(var(--ivy));font-size:12px}
.tp-row.on .t{color:rgb(var(--ink));font-weight:500}
.tp-row.tp-create{color:rgb(var(--ivy))}
.tp-plus{width:14px;text-align:center;font-size:15px;line-height:1}
.tp-none{font-size:11.5px;color:rgb(var(--faint));padding:10px 8px;text-align:center}
.chip{cursor:pointer}

.shelf-foot{margin-top:auto;padding:10px 2px 52px}
/* 版本水印：平时是书架底部一行极淡小字，只有检测到线上版本落后才变色提示 */
.build-tag{
  display:flex;align-items:center;gap:6px;
  font-size:10px;line-height:1.4;letter-spacing:.02em;
  color:rgb(var(--faint) / .5);cursor:pointer;user-select:none;
  transition:color .15s;
}
.build-tag:hover{color:rgb(var(--muted))}
.build-tag .bd{font-variant-numeric:tabular-nums}
.build-tag.warn{color:#c2611b}
[data-theme=dark] .build-tag.warn{color:#e8a15c}
.build-tag .rf{font-size:10px;padding:1px 6px;border-radius:5px;background:rgb(var(--hover));color:inherit;white-space:nowrap}
.build-tag .rf:hover{background:rgb(var(--ivy-soft))}

/* dock */
.dock{
  position:absolute;left:12px;right:12px;bottom:12px;height:46px;
  display:flex;align-items:center;gap:2px;padding:5px 6px;
  background:rgb(var(--surface)/.86);backdrop-filter:blur(14px) saturate(1.4);
  border-radius:13px;box-shadow:var(--shadow-float);
}
.dock-item{
  height:34px;min-width:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto;
  transition:background .16s,color .16s;
}
.dock-item svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.dock-item.active{background:rgb(var(--ink) / .06);color:rgb(var(--ink));font-weight:500}
.dock-item .lbl{white-space:nowrap}
.dock-spacer{flex:1}
/* 待办逾期红点 */
.dock-item .todo-dot{
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:rgb(var(--danger));
  color:#fff;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;flex:0 0 auto;
}
/* 从待办跳过去时，闪一下那一块 */
@keyframes todoFlash{0%{background:rgb(var(--ivy)/.16)}100%{background:transparent}}
.blk.todo-flash{animation:todoFlash 1.3s ease-out;border-radius:8px}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:13px;font-weight:700;
  background:#f3ddd6;color:#8a4a34;flex:0 0 auto;transition:transform .18s var(--spring);
}
[data-theme=dark] .avatar{background:#4a3229;color:#e8c2b2}
.avatar:hover{transform:scale(1.06)}

/* ============ paper ============ */
.main-wrap{flex:1;min-width:0;display:flex;padding:8px 12px 8px 0}.paper{
  flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:rgb(var(--surface));border:1px solid #e9ecef;border-radius:14px;
  box-shadow:var(--shadow-paper);
}
[data-theme=dark] .paper{border-color:#2b3035}
.tabbar{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;flex:0 0 auto;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;max-width:180px;height:28px;padding:0 8px 0 10px;
  border-radius:7px;font-size:12.5px;color:rgb(var(--muted));white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.tab.active{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab .t{overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tab .x{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;opacity:0;transition:opacity .14s,background .14s}
.tab:hover .x,.tab.active .x{opacity:.7}
.tab .x:hover{background:rgb(var(--ink)/.08);opacity:1}
.tab .x svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.tab-new{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:rgb(var(--faint))}
.tab-new:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab-new svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

/* 右上角操作图标与标题栏（标签 + 新建）同一行、垂直居中：44px 行高里对称留白 */
.paper-actions{position:absolute;top:7px;right:12px;display:flex;align-items:center;gap:2px;z-index:6}
/* 顶部「大纲」按钮：桌面 / 窄屏 / 触屏全部显示（.pa-btn 有 display:grid，用双类名保持一致权重） */
.pa-btn.pa-ol{display:grid}
body.ol-open .pa-ol{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
/* 所有触屏设备（含 iPad Safari 桌面模式）放大关闭按钮与条目点击区 */
body.ol-touch .ol-close{display:grid}
body.ol-touch .ol-item{padding-top:6px;padding-bottom:6px}
/* 书架收起时左上角有折叠按钮，标签栏让出它的位置，避免压住第一个标签 */
.shelf-open.show ~ .paper .tabbar{padding-left:48px}
.pa-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:rgb(var(--muted));transition:background .15s,color .15s}
.pa-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
/* 触屏（iPad/手机）没有 hover：按下的瞬间给同样的颜色反馈 */
.pa-btn:active{background:rgb(var(--hover));color:rgb(var(--ink))}
.pa-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pa-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

.content-row{flex:1;display:flex;min-height:0;position:relative}

/* ============ doc ============ */
.scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0}
/* 正文居中排布：宽度按可用空间的百分比自适应（留白随屏幕缩放） */
.doc{
  /* v37: 留白不再写死像素，改成百分比——正文恒占可用宽度的 93%，两侧各留 3.5%，
     窗口一变宽度就按比例跟着缩放（大屏留白略宽、小屏略窄，观感一致）；
     - 840px 保底：iPad 横屏这类中等宽度不会比之前更窄；
     - 1500px 上限：超宽屏（2K/4K）挡住行长，否则一行会拉到 80+ 字难以阅读 */
  max-width:min(1500px, max(93%, 840px));
  margin:0 auto;
  padding:52px clamp(16px, 2.4vw, 40px) 140px;
}
/* 宽屏：右侧常驻一条 250px 的「大纲通道」，正文宽度固定不变。
   卡片展开时正好落在这条空位里 —— 既压不到字，也不会让正文突然变窄 */
@media (min-width:1200px){
  .doc{
    max-width:min(1340px, calc(100% - 264px));
    margin:0 auto 0 clamp(20px, 2.6vw, 48px);
  }
}
.doc-title{
  display:block;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:34px;font-weight:600;line-height:1.28;letter-spacing:-.012em;
  color:rgb(var(--ink));padding:0;margin:0 0 2px;
}
.doc-title::placeholder{color:rgb(var(--faint));opacity:.75}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0 24px;font-size:12.5px;color:rgb(var(--faint))}
.doc-meta .sep{opacity:.6}
.meta-btn{padding:2px 4px;border-radius:5px;color:rgb(var(--faint));transition:background .14s,color .14s;font-size:12.5px}
.meta-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.meta-btn.add{color:rgb(var(--faint))}
/* 回收站头部：窄屏要能换行，否则「清空回收站」会被挤出屏幕 */
.trash-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.trash-hint{color:rgb(var(--faint));font-size:12.5px;margin:0;flex:1 1 auto;min-width:0}
.trash-head #trashEmpty{margin-left:auto;flex:0 0 auto}
@media (max-width:560px){
  .trash-head{gap:4px;margin-bottom:16px}
  .trash-hint{flex:1 1 100%}
  .trash-head #trashEmpty{margin-left:0;padding:4px 0}
}
/* 标题下的 Markdown 工具条 */
.fmt-bar{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:12px 0 0;user-select:none}
.fmt-bar button{
  height:26px;min-width:24px;padding:0 6px;border-radius:6px;font-size:12px;color:rgb(var(--muted));
  transition:background .14s,color .14s,transform .1s;
}
.fmt-bar button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.fmt-bar button:active{transform:scale(.95)}
.fmt-bar button b,.fmt-bar button i,.fmt-bar button s{font-size:13px;font-weight:700}
.fmt-bar button i{font-style:italic;font-family:var(--font-serif)}
.fmt-sep{width:1px;height:12px;background:rgb(var(--line));margin:0 5px;flex:0 0 auto}

/* ---- 斜杠插入菜单（正文里输入 /） ---- */
.slash{
  position:fixed;z-index:78;width:256px;max-height:312px;overflow:auto;padding:5px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:11px;
  box-shadow:var(--shadow-lift);opacity:0;transform:translateY(-4px) scale(.985);
  pointer-events:none;transition:opacity .13s,transform .16s var(--spring);
  overscroll-behavior:contain;
}
.slash.open{opacity:1;transform:none;pointer-events:auto}
.slash-hd{padding:5px 8px 6px;font-size:11px;color:rgb(var(--faint));line-height:1.4}
.slash-hd b{font-weight:600;color:rgb(var(--muted))}
.sl-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;border-radius:7px;text-align:left}
.sl-item.on,.sl-item:hover{background:rgb(var(--hover))}
.sl-ic{
  width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;border-radius:6px;
  background:rgb(var(--sunken));color:rgb(var(--muted));
  font-size:11px;font-weight:600;font-family:var(--font-mono);line-height:1;
}
.sl-item.on .sl-ic,.sl-item:hover .sl-ic{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.sl-ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sl-tx{min-width:0;flex:1}
.sl-tx b{display:block;font-size:13px;font-weight:450;color:rgb(var(--ink-2))}
.sl-tx i{display:block;font-size:10.5px;font-style:normal;color:rgb(var(--faint));margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-key{font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--faint))}
.sl-key em{font-style:normal;margin-left:5px;color:rgb(var(--ivy-ink))}
.sl-date{margin-left:auto;font-size:10.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---- 编辑中把「- [ ] 」显示成真勾选框：一块不透明小牌子盖住原文，文本本身不动 ---- */
.blk-tchk{
  display:none;position:absolute;left:0;top:0;z-index:2;pointer-events:none;
  background:rgb(var(--surface));border-radius:3px;align-items:center;
}
.blk.show-tchk .blk-tchk{display:flex}
.blk-tchk i{
  display:block;width:14px;height:14px;margin-left:1px;box-sizing:border-box;
  border:1.5px solid rgb(var(--faint));border-radius:4px;background:rgb(var(--surface));position:relative;
}
.blk-tchk.on i{background:rgb(var(--ivy));border-color:rgb(var(--ivy))}
.blk-tchk.on i::after{
  content:'';position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border:1.6px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
}

/* ---- 提醒设置卡片 ---- */
.due-ov{
  position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;
  background:rgb(16 24 32 / .16);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.due-ov.open{display:flex}
.due-card{
  width:min(372px,92vw);background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  border-radius:14px;box-shadow:var(--shadow-lift);padding:15px 16px 13px;
  animation:dueIn .18s var(--spring);
}
@keyframes dueIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.due-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.due-cb{
  height:27px;padding:0 11px;border-radius:8px;background:rgb(var(--sunken));
  font-size:12.5px;color:rgb(var(--ink-2));transition:background .12s,color .12s;
}
.due-cb:hover{background:rgb(var(--hover))}
.due-cb.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-weight:500}
.due-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.due-row>label{width:34px;flex:0 0 auto;font-size:12.5px;color:rgb(var(--muted))}
.due-row input[type=date],.due-row input[type=time],.due-row select{
  flex:1;min-width:0;height:33px;padding:0 10px;border:1px solid rgb(var(--line));border-radius:8px;
  background:rgb(var(--surface));font-size:13px;color:rgb(var(--ink));font-family:inherit;
}
.due-row input:focus,.due-row select:focus{
  outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09);
}
.due-tip{font-size:11.5px;line-height:1.6;color:rgb(var(--faint));margin:3px 0 13px;padding-left:44px}
.due-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.due-del{margin-right:auto;font-size:12.5px;color:rgb(var(--danger));padding:5px 9px;border-radius:7px;transition:background .12s,color .12s}
.due-del:hover{background:rgb(var(--danger-soft))}
.due-del[disabled]{color:rgb(var(--faint));opacity:.62;cursor:default}
.due-del[disabled]:hover{background:none}
.due-ok{height:33px;padding:0 18px;border-radius:9px;background:rgb(var(--ivy));color:#fff;font-size:13px;font-weight:500}
.due-ok:hover{background:rgb(var(--ivy-hover))}

/* ---- 提醒中心：浏览器通知 + 日历订阅 ---- */
.rc-card{
  width:min(432px,93vw);max-height:86vh;overflow:auto;background:rgb(var(--surface));
  border:.5px solid rgb(var(--line));border-radius:14px;box-shadow:var(--shadow-lift);
  padding:16px 17px 14px;animation:dueIn .18s var(--spring);
}
.rc-title{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:3px}
.rc-title svg{width:16px;height:16px;stroke:rgb(var(--ivy));fill:none;stroke-width:1.7}
.rc-sub{font-size:11.5px;line-height:1.65;color:rgb(var(--faint));margin-bottom:13px}
.rc-box{
  border:.5px solid rgb(var(--line));border-radius:11px;padding:11px 12px;margin-bottom:10px;
  background:rgb(var(--sunken)/.55);
}
.rc-box-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.rc-box-h b{font-size:12.5px;font-weight:600;color:rgb(var(--ink))}
.rc-badge{
  margin-left:auto;font-size:11px;padding:1.5px 7px;border-radius:20px;
  background:rgb(var(--hover));color:rgb(var(--muted));
}
.rc-badge.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.rc-badge.no{background:rgb(var(--warn-soft));color:rgb(var(--warn-ink))}
.rc-p{font-size:11.5px;line-height:1.7;color:rgb(var(--muted));margin-bottom:8px}
.rc-link{
  display:block;font-family:var(--font-mono);font-size:11px;line-height:1.55;color:rgb(var(--ink-2));
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:8px;
  padding:7px 8px;margin-bottom:8px;word-break:break-all;user-select:all;
}
.rc-acts{display:flex;flex-wrap:wrap;gap:6px}
.rc-btn{
  height:29px;padding:0 11px;border-radius:8px;background:rgb(var(--surface));
  border:.5px solid rgb(var(--line));font-size:12.5px;color:rgb(var(--ink-2));
  display:inline-flex;align-items:center;gap:5px;
}
.rc-btn:hover{background:rgb(var(--hover))}
.rc-btn.primary{background:rgb(var(--ivy));border-color:transparent;color:#fff;font-weight:500}
.rc-btn.primary:hover{background:rgb(var(--ivy-hover))}
.rc-btn.danger{color:rgb(var(--danger))}
.rc-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.rc-foot{display:flex;justify-content:flex-end;margin-top:11px}
.rc-close{height:31px;padding:0 15px;border-radius:9px;background:rgb(var(--sunken));font-size:13px;color:rgb(var(--ink-2))}
.rc-close:hover{background:rgb(var(--hover))}
.rc-switch{
  margin-left:auto;width:38px;height:22px;border-radius:12px;background:rgb(var(--hover));
  position:relative;transition:background .16s var(--spring);flex:0 0 auto;
}
.rc-switch i{
  position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgb(16 24 32 / .22);transition:transform .18s var(--spring);
}
.rc-switch.on{background:rgb(var(--ivy))}
.rc-switch.on i{transform:translateX(16px)}
.rc-perm{display:flex;align-items:center;gap:8px;font-size:12px;color:rgb(var(--muted))}
.rc-perm b{font-weight:600}
.rc-ok{color:rgb(var(--ivy-ink))}
.rc-no{color:rgb(var(--warn-ink))}
.rc-mini{
  margin-left:auto;font-size:11.5px;color:rgb(var(--ivy-ink));padding:3px 8px;border-radius:7px;
  background:rgb(var(--ivy-soft));
}
.rc-mini:hover{background:rgb(var(--ivy-soft)/.7)}
.rc-select{
  width:100%;height:33px;padding:0 10px;border:1px solid rgb(var(--line));border-radius:8px;
  background:rgb(var(--surface));font-size:13px;color:rgb(var(--ink));font-family:inherit;
}
.rc-select:focus{outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09)}
.rc-note{font-size:11px;line-height:1.6;color:rgb(var(--faint));margin-top:7px}
.rc-note a{color:rgb(var(--ivy-ink));cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rc-src{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;background:rgb(var(--sunken));margin-top:7px}
.rc-src-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc-src-m b{font-size:12px;font-weight:500;color:rgb(var(--ink))}
.rc-src-m span{font-size:10.5px;color:rgb(var(--faint));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-add{display:flex;gap:6px;margin-top:8px}
.rc-input{
  flex:1;min-width:0;height:33px;padding:0 10px;border-radius:9px;font-size:12px;
  border:.5px solid rgb(var(--line));background:rgb(var(--sunken));color:rgb(var(--ink));
}
.rc-input:focus{outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09)}
.rc-link{position:relative;padding-right:30px}
.rc-copy{
  position:absolute;right:5px;top:6px;width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:rgb(var(--muted));
}
.rc-copy:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.rc-copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.rc-card .rc-box-h svg{width:14px;height:14px;stroke:rgb(var(--muted));fill:none;stroke-width:1.8;flex:0 0 auto}

.sl-empty{padding:11px 9px;font-size:12px;color:rgb(var(--faint));line-height:1.6}

/* ---- 选中文字后的浮动工具条 ---- */
.selbar{
  position:fixed;z-index:82;display:flex;align-items:center;gap:1px;padding:3px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:9px;
  box-shadow:var(--shadow-lift);opacity:0;transform:translateY(4px) scale(.97);
  pointer-events:none;transition:opacity .12s,transform .14s var(--spring);
}
.selbar.open{opacity:1;transform:none;pointer-events:auto}
.selbar button{
  height:26px;min-width:26px;padding:0 7px;border-radius:6px;font-size:12px;color:rgb(var(--muted));
  display:flex;align-items:center;gap:4px;transition:background .12s,color .12s;
}
.selbar button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.selbar button b{font-size:13px;font-weight:700}
.selbar button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.selbar button b.sb-sl{font-size:15px;font-weight:600;line-height:1}
.selbar button b.sb-br{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:-.5px}
.selbar .sb-sep{width:1px;height:14px;background:rgb(var(--line));margin:0 3px;flex:0 0 auto}
@media (max-width:640px){
  .selbar button{height:30px;min-width:30px;padding:0 9px;font-size:13px}
  .slash{width:min(258px,86vw)}
  /* 手机上顶部图标已经很挤：插入入口用工具栏里的 +，右上角不再重复放一个 */
  .paper-actions #paInsert{display:none}
  .paper .tabbar{padding-right:200px}
}

/* ---- 表格尺寸选择器（工具栏「表格」下拉） ---- */
.tbl-pick{padding:5px 3px 0;user-select:none;touch-action:none}
.tbl-grid{display:grid;grid-template-columns:repeat(10,17px);gap:3px}
.tbl-grid i{width:17px;height:17px;border-radius:4px;background:rgb(var(--hover));transition:background .1s,box-shadow .1s}
.tbl-grid i.on{background:rgb(var(--ivy)/.2);box-shadow:inset 0 0 0 1px rgb(var(--ivy)/.55)}
.tbl-info{margin-top:10px;text-align:center;font-size:11.5px;color:rgb(var(--muted));font-variant-numeric:tabular-nums}

/* ---- 待办提醒时间小标签 ---- */
.prose .due-chip{
  display:inline-flex;align-items:center;gap:4px;font-size:.8em;line-height:1.55;
  padding:0 8px 0 5px;border-radius:20px;background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));
  vertical-align:1px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background .12s,color .12s;
}
.prose .due-chip:hover{background:rgb(var(--ivy)/.16)}
.prose .due-chip.late{background:rgb(var(--danger-soft));color:rgb(var(--danger))}
.prose .due-chip .dc-ic{
  width:13px;height:13px;border-radius:3px;background:rgb(var(--ivy));color:#fff;
  display:grid;place-items:center;flex:0 0 auto;
}
.prose .due-chip.late .dc-ic{background:rgb(var(--danger))}
.prose .rep-chip{
  display:inline-flex;align-items:center;gap:3px;font-size:.78em;line-height:1.55;
  padding:0 7px;border-radius:20px;background:rgb(var(--sunken));color:rgb(var(--muted));
  vertical-align:1px;white-space:nowrap;margin-left:3px;
}
.prose .due-chip .dc-ic svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- Mermaid 图表块 ---- */
.mb{margin:1.35em 0;padding:16px 10px;border-radius:12px;background:rgb(var(--sunken));text-align:center;overflow:auto;min-height:44px}
.mb svg{max-width:100%;height:auto;display:inline-block}
.mb-hint{font-size:12.5px;color:rgb(var(--faint));padding:8px 0}
.mb-err{font-size:12.5px;color:rgb(var(--danger));padding:4px;text-align:left}
.mb-src{margin:8px 0 0;padding:10px 12px;border-radius:8px;background:rgb(var(--hover));font-family:var(--font-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:rgb(var(--muted));text-align:left}
.blk .mb{margin:.2em 0}

/* ---- Markdown / 快捷键帮助面板 ---- */
.help-ov{
  position:fixed;inset:0;z-index:130;background:rgb(16 24 32 / .34);
  display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.help-ov.open{opacity:1;pointer-events:auto}
.help-card{
  width:min(720px,100%);max-height:min(82vh,780px);display:flex;flex-direction:column;
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-lift);overflow:hidden;
  transform:translateY(10px) scale(.995);transition:transform .22s var(--spring);
}
.help-ov.open .help-card{transform:none}
.help-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px}
.help-hd h3{font-family:var(--font-serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.help-hd p{font-size:12.5px;color:rgb(var(--faint));margin-top:5px}
.help-x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:rgb(var(--faint));flex:0 0 auto}
.help-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.help-x svg{width:15px;height:15px}
.help-tabs{display:flex;gap:4px;padding:0 18px 10px;border-bottom:1px solid rgb(var(--line))}
.help-tab{padding:6px 11px;border-radius:8px;font-size:13px;color:rgb(var(--muted))}
.help-tab.on{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.help-body{overflow:auto;padding:6px 22px 24px;overscroll-behavior:contain}
.help-p{font-size:13px;line-height:1.9;color:rgb(var(--ink-2));padding:6px 2px 2px}
.help-p code{font-family:var(--font-mono);font-size:11.5px;padding:1px 5px;border-radius:4px;background:rgb(var(--code-bg));color:rgb(var(--ivy-ink))}
.help-code{margin:8px 0 0;padding:12px 14px;border-radius:9px;background:rgb(var(--code-bg));font-family:var(--font-mono);font-size:12px;line-height:1.95;color:rgb(var(--ink-2));white-space:pre-wrap;overflow:auto}
.help-sec{margin-top:20px}
.help-sec>h4{font-size:11.5px;font-weight:600;color:rgb(var(--faint));letter-spacing:.06em;margin-bottom:4px}
.help-row{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid rgb(var(--line)/.55);font-size:13.5px;color:rgb(var(--ink-2))}
.help-row:last-child{border-bottom:0}
.help-row .syn{
  font-family:var(--font-mono);font-size:11.5px;line-height:1.5;padding:3px 7px;border-radius:6px;
  background:rgb(var(--code-bg));color:rgb(var(--ivy-ink));flex:0 0 auto;max-width:210px;
  white-space:pre-wrap;word-break:break-all;
}
.help-row .di{margin-left:auto;text-align:right;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto}
.help-row .kbd{margin-left:auto;flex:0 0 auto}

/* 帮助面板第一页：上面三张「怎么用」，下面一张四列速查表 */
.help-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 0 2px}
.hh{background:rgb(var(--sunken));border-radius:11px;padding:11px 12px}
.hh.hl{background:rgb(var(--ivy-soft))}
.hh-t{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:5px}
.hh-t i{
  font-style:normal;font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 6px;border-radius:5px;
  background:rgb(var(--surface));color:rgb(var(--ivy-ink));box-shadow:0 0 0 .5px rgb(var(--line));
}
.hh.hl .hh-t{color:rgb(var(--ivy-ink))}
.hh-p{font-size:11.5px;line-height:1.72;color:rgb(var(--muted))}
.hh.hl .hh-p{color:rgb(var(--ink-2))}
.help-table{width:100%;border-collapse:collapse;margin-top:14px;table-layout:fixed}
.help-table th{
  font-size:11px;font-weight:600;color:rgb(var(--faint));text-align:left;
  padding:0 8px 7px;border-bottom:1px solid rgb(var(--line));letter-spacing:.02em;
}
.help-table td{
  padding:9px 8px;border-bottom:1px solid rgb(var(--line)/.55);
  font-size:12.5px;color:rgb(var(--ink-2));vertical-align:middle;
}
.help-table tr:last-child td{border-bottom:0}
.help-table th:nth-child(1),.help-table td:nth-child(1){width:23%}
.help-table th:nth-child(2),.help-table td:nth-child(2){width:36%}
.help-table th:nth-child(3),.help-table td:nth-child(3){width:19%}
.help-table th:nth-child(4),.help-table td:nth-child(4){width:22%}
.help-table td.ht-n{color:rgb(var(--ink));font-weight:500;white-space:nowrap}
.help-table code{
  font-family:var(--font-mono);font-size:11px;padding:1.5px 5px;border-radius:4px;
  background:rgb(var(--code-bg));color:rgb(var(--ivy-ink));white-space:nowrap;
}
.help-table .ht-k span{
  display:inline-block;font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--muted));
  background:rgb(var(--sunken));padding:2px 6px;border-radius:5px;margin-right:2px;white-space:nowrap;
}
.help-table .ht-eff{color:rgb(var(--muted));font-size:12px}
.help-table .ht-hl{background:rgb(var(--hl-yellow-bg));color:rgb(var(--hl-yellow-fg));padding:0 3px;border-radius:4px}
@media (max-width:640px){
  .help-hero{grid-template-columns:1fr}
  .help-table{table-layout:auto}
  .help-table th:nth-child(3),.help-table td:nth-child(3){display:none}
  .help-table th:nth-child(1),.help-table td:nth-child(1){width:28%}
}

/* ---- 日程（左侧书架里的分组列表） ---- */
.todo-shelf{display:flex;flex-direction:column;min-height:100%}
.tsh-t{font-size:15px;font-weight:600;letter-spacing:-.01em;color:rgb(var(--ink));padding:2px 0;border-radius:6px}
.tsh-t.on{color:rgb(var(--ivy))}
.tsh-meta{padding:2px 6px 10px;font-size:11px;color:rgb(var(--faint))}
.tsg{position:relative}
.tsg-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px;border-radius:7px;font-size:12px;color:rgb(var(--ink-2));font-weight:500}
.tsg-h:hover{background:rgb(var(--hover))}
.tsg-h .gchev{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(0);transition:transform .16s;flex:0 0 auto}
.tsg-h .gchev.open{transform:rotate(90deg)}
.tsg-h .ttl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsg-h .n{font-size:10.5px;color:rgb(var(--faint));font-weight:400;flex:0 0 auto}
.tsi{display:flex;align-items:flex-start;gap:7px;padding:4px 6px 6px 19px;border-radius:7px;cursor:pointer;transition:background .12s}
.tsi:hover{background:rgb(var(--hover))}
.tsi.sel{background:rgb(var(--ivy-soft))}
.tsi input{width:13px;height:13px;margin-top:2px;accent-color:rgb(var(--ivy));flex:0 0 auto;cursor:pointer}
.tsi .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tsi .t{font-size:12.5px;line-height:1.5;color:rgb(var(--ink-2));word-break:break-word}
.tsi.done .t{color:rgb(var(--faint));text-decoration:line-through}
.tsi .src{font-size:10px;color:rgb(var(--faint));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsi .tm{font-size:10.5px;color:rgb(var(--faint));flex:0 0 auto;font-variant-numeric:tabular-nums;margin-top:1px}
.tsi .tm.late{color:rgb(var(--danger))}
.tsi .rep{color:rgb(var(--ivy));font-size:10.5px}
.tsi-bell{flex:0 0 auto;width:20px;height:20px;margin-top:-2px;border-radius:5px;display:grid;place-items:center;
  color:rgb(var(--faint));opacity:0;transition:opacity .12s,background .12s,color .12s}
.tsi:hover .tsi-bell{opacity:1}
.tsi-bell.on{opacity:.85;color:rgb(var(--ivy))}
.tsi-bell:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tsi-bell svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:none){ .tsi-bell{opacity:.6} }
.tsh-empty{padding:26px 10px;text-align:center;font-size:12px;color:rgb(var(--faint));line-height:1.9}
/* 苹果日历那一组：条目同样可以勾掉（只在本应用记，不回写日历） */
.ics-row{padding-left:19px}
.ics-row .t{transition:color .12s}
.ics-pop{min-width:190px;max-width:260px;padding:2px 2px 4px}
.ics-pop-t{font-size:13px;font-weight:600;color:rgb(var(--ink));margin-bottom:6px;line-height:1.45;word-break:break-word}
.ics-pop-r{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:rgb(var(--muted));line-height:1.6;margin-top:3px}
.ics-pop-r svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto;margin-top:2px}
.ics-pop-n{margin-top:8px;font-size:10.5px;color:rgb(var(--faint));line-height:1.6}
.tsh-sub{display:flex;align-items:center;gap:7px;margin:10px 6px 0;padding:8px;border-radius:8px;font-size:12px;color:rgb(var(--muted));text-align:left}
.tsh-sub:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tsh-sub svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}
/* 右侧空状态 */
.todo-blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:rgb(var(--faint))}
.todo-blank svg{width:40px;height:40px;opacity:.5}
.todo-blank p{font-size:13px}

/* ---- 历史版本 ---- */
.hist-ov{
  position:fixed;inset:0;z-index:135;background:rgb(16 24 32 / .34);
  display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.hist-ov.open{opacity:1;pointer-events:auto}
.hist-card{
  width:min(880px,100%);height:min(640px,86vh);display:flex;flex-direction:column;
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-lift);overflow:hidden;
  transform:translateY(10px) scale(.995);transition:transform .22s var(--spring);
}
.hist-ov.open .hist-card{transform:none}
.hist-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 14px}
.hist-hd h3{font-family:var(--font-serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.hist-hd p{margin-top:7px;font-size:12px;line-height:1.75;color:rgb(var(--faint));max-width:600px}
.hist-body{flex:1;display:grid;grid-template-columns:238px 1fr;min-height:0;border-top:1px solid rgb(var(--line))}
.hist-list{overflow:auto;border-right:1px solid rgb(var(--line));padding:8px 6px;overscroll-behavior:contain}
.hist-day{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:rgb(var(--faint));padding:10px 10px 4px}
.hist-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;transition:background .12s}
.hist-item:hover{background:rgb(var(--hover))}
.hist-item.on{background:rgb(var(--ivy-soft))}
.hist-item .t{font-size:12.5px;color:rgb(var(--ink-2));font-weight:500}
.hist-item.on .t{color:rgb(var(--ivy-ink))}
.hist-item .d{font-size:11px;color:rgb(var(--faint));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.hist-item .m{font-size:10.5px;color:rgb(var(--faint));display:flex;gap:6px;align-items:center}
.hist-item .m .cloud{opacity:.75}
.hist-preview{overflow:auto;padding:24px 30px;overscroll-behavior:contain}
.hist-pv-title{font-family:var(--font-serif);font-size:22px;font-weight:700;line-height:1.4;margin-bottom:16px;color:rgb(var(--ink))}
.hist-pv-body{font-size:14.5px;line-height:1.85;color:rgb(var(--ink-2))}
.hist-pv-body h1,.hist-pv-body h2,.hist-pv-body h3,.hist-pv-body h4{font-weight:600;line-height:1.6;margin:1.4em 0 .5em;color:rgb(var(--ink))}
.hist-pv-body h1{font-size:1.4em}.hist-pv-body h2{font-size:1.24em}.hist-pv-body h3{font-size:1.1em}
.hist-pv-body ul,.hist-pv-body ol{padding-left:1.3em;margin:.7em 0}
.hist-pv-body li.task{list-style:none;margin-left:-1.1em}
.hist-pv-body li.task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.hist-pv-body pre{background:rgb(var(--code-bg));border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;margin:.9em 0}
.hist-pv-body code{font-family:var(--font-mono);font-size:.9em;background:rgb(var(--code-bg));padding:1px 4px;border-radius:4px}
.hist-pv-body pre code{background:none;padding:0}
.hist-pv-body table{border-collapse:collapse;width:100%;margin:.9em 0;font-size:.92em}
.hist-pv-body th,.hist-pv-body td{border:1px solid rgb(var(--line));padding:6px 9px}
.hist-pv-body blockquote{border-left:2px solid rgb(var(--line));padding-left:12px;color:rgb(var(--muted));margin:.8em 0}
.hist-empty{height:100%;display:grid;place-items:center;text-align:center;color:rgb(var(--faint));font-size:13px;line-height:2}
.hist-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid rgb(var(--line))}
.hist-tip{font-size:11.5px;color:rgb(var(--faint))}
.hist-actions{display:flex;gap:8px;flex:0 0 auto}
.hist-btn{height:34px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:500;transition:filter .15s,background .15s}
.hist-btn.ghost{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.hist-btn.ghost:hover{color:rgb(var(--ink))}
.hist-btn.primary{background:rgb(var(--ivy));color:#fff}
.hist-btn.primary:hover{filter:brightness(1.06)}
.hist-btn:disabled{opacity:.4;pointer-events:none}
@media (max-width:640px){
  .hist-card{height:min(700px,90vh)}
  .hist-body{grid-template-columns:1fr;grid-template-rows:minmax(0,180px) 1fr}
  .hist-list{border-right:0;border-bottom:1px solid rgb(var(--line))}
  .hist-preview{padding:18px 20px}
  .hist-hd{padding:16px 18px 12px}
  .hist-hd p{font-size:11.5px}
}

/* ---- 待办视图 ---- */
.todo-wrap{max-width:880px;margin:0 auto;padding:40px 26px 130px}
.todo-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.todo-hd h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.todo-hd .sub{font-size:12.5px;color:rgb(var(--faint))}
.todo-stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
.todo-stat{padding:9px 13px;border-radius:11px;background:rgb(var(--sunken));font-size:12.5px;color:rgb(var(--muted))}
.todo-stat b{font-size:16px;font-weight:600;color:rgb(var(--ink));margin-right:5px;font-variant-numeric:tabular-nums}
.todo-stat.alert{background:rgb(var(--danger-soft));color:rgb(var(--danger))}
.todo-stat.alert b{color:rgb(var(--danger))}
.todo-group{margin-bottom:24px}
.todo-group>h3{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:rgb(var(--faint));margin:0 0 8px;padding-left:2px}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;transition:background .14s}
.todo-item:hover{background:rgb(var(--hover))}
.todo-item .cb{width:15px;height:15px;margin-top:3px;flex:0 0 auto;accent-color:rgb(var(--ivy));cursor:pointer}
.todo-item .mid{flex:1;min-width:0}
.todo-item .tx{font-size:14px;line-height:1.6;color:rgb(var(--ink-2));cursor:pointer;word-break:break-word}
.todo-item .tx:hover{color:rgb(var(--ink))}
.todo-item.done .tx{color:rgb(var(--faint));text-decoration:line-through}
.todo-item .src{font-size:11.5px;color:rgb(var(--faint));margin-top:2px;display:flex;align-items:center;gap:6px}
.todo-item .src svg{width:11px;height:11px;flex:0 0 auto}
.todo-item .due{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1.5px 7px;border-radius:5px;background:rgb(var(--sunken));color:rgb(var(--muted));white-space:nowrap}
.todo-item .due.late{background:rgb(var(--danger-soft));color:rgb(var(--danger))}
.todo-item .due.soon{background:rgb(var(--warn-soft));color:rgb(var(--warn-ink))}
.todo-item .bell{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:rgb(var(--faint));flex:0 0 auto;opacity:0;transition:opacity .14s,background .14s}
.todo-item:hover .bell,.todo-item .due+.bell{opacity:1}
.todo-item .bell svg{width:14px;height:14px}
.todo-item .bell:hover{background:rgb(var(--sunken));color:rgb(var(--ink))}
.todo-empty{padding:38px 10px;text-align:center;color:rgb(var(--faint));font-size:13px;line-height:1.9}
.todo-empty svg{width:34px;height:34px;margin:0 auto 10px;display:block;opacity:.5}
/* 待办浮层（右上角按钮） */
.todo-pop{padding:2px 0;width:280px;max-height:min(60vh,420px);overflow:auto}
.todo-pop .tp-hd{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;font-size:11.5px;color:rgb(var(--faint))}
.todo-pop .tp-i{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:7px;font-size:13px;line-height:1.55;color:rgb(var(--ink-2));cursor:pointer}
.todo-pop .tp-i:hover{background:rgb(var(--hover))}
.todo-pop .tp-i input{width:14px;height:14px;margin-top:2px;accent-color:rgb(var(--ivy));flex:0 0 auto}
.todo-pop .tp-i .tpt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-pop .tp-i .due{font-size:10.5px;padding:0 5px;border-radius:4px;background:rgb(var(--sunken));color:rgb(var(--muted));white-space:nowrap;flex:0 0 auto;margin-top:2px}
.todo-pop .tp-i .due.late{background:rgb(var(--danger-soft));color:rgb(var(--danger))}
.todo-pop .tp-i.done span{color:rgb(var(--faint));text-decoration:line-through}
.todo-pop .tp-empty{padding:14px 8px;font-size:12.5px;color:rgb(var(--faint))}
.meta-sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgb(var(--faint))}
.meta-sync .sd{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45}
.meta-sync .sd.ok{background:rgb(var(--ivy));opacity:1}
.meta-sync .sd.busy{background:rgb(var(--ivy));opacity:1;animation:pulse 1s ease-in-out infinite}
.meta-sync .sd.error{background:rgb(var(--warn));opacity:1}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  font-size:11.5px;font-weight:500;background:rgb(var(--ink)/.05);color:rgb(var(--tag-gray-fg));
}
.chip .rm{opacity:.5;font-size:13px;line-height:1}
.chip:hover .rm{opacity:1}
.tag-input{
  height:22px;width:86px;border:0;outline:none;background:none;font-size:12.5px;
  border-bottom:1px solid rgb(var(--ivy)/.5);
}

.doc-body{position:relative}
.prose{
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));
  word-break:break-word;
}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose h1,.prose h2,.prose h3,.prose h4{font-weight:600;line-height:1.6;margin:1.7em 0 .62em;letter-spacing:-.005em;scroll-margin-top:80px}
.prose h1{font-size:1.62em}
.prose h2{font-size:1.34em}
.prose h3{font-size:1.14em}
.prose h4{font-size:1em}
.prose h5{font-size:.94em;color:rgb(var(--ink-2))}
.prose h6{font-size:.9em;color:rgb(var(--muted))}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em}
.prose li{margin:.3em 0}
.prose li::marker{color:rgb(var(--faint))}
.prose blockquote{
  margin:1.2em 0;padding:2px 0 2px 16px;border-left:2px solid rgb(var(--ivy)/.35);
  color:rgb(var(--ink-2));
}
.prose blockquote p:last-child{margin-bottom:0}
.prose code{
  font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));
  padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line));
}
.prose pre{
  background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:1.2em 0;
}
.prose pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.prose hr{border:0;border-top:1px solid rgb(var(--line));margin:2.2em 0}
.prose img{max-width:100%;border-radius:9px;display:block;margin:1.2em 0}
.prose a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.prose mark{background:rgb(var(--hl-green-bg));color:rgb(var(--hl-green-fg));padding:1px 3px;border-radius:4px}
.prose mark.hl-yellow{background:rgb(var(--hl-yellow-bg));color:rgb(var(--hl-yellow-fg))}
.prose mark.hl-pink{background:rgb(var(--hl-pink-bg));color:rgb(var(--hl-pink-fg))}
.prose mark.hl-blue{background:rgb(var(--hl-blue-bg));color:rgb(var(--hl-blue-fg))}
.prose mark.hl-purple{background:rgb(var(--hl-purple-bg));color:rgb(var(--hl-purple-fg))}
.prose mark.hl-gray{background:rgb(var(--hl-gray-bg));color:rgb(var(--hl-gray-fg))}
.prose del{color:rgb(var(--muted))}
.wiki-pop{
  position:fixed;z-index:86;width:290px;max-height:236px;overflow:auto;padding:5px;display:none;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:11px;
  box-shadow:var(--shadow-lift);
}
.wiki-pop.open{display:block}
.wiki-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:default}
.wiki-item.on{background:rgb(var(--hover));color:rgb(var(--ink))}
.wiki-ico{flex:0 0 auto;color:rgb(var(--ivy));font-size:11px;line-height:1}
.wiki-new{flex:0 0 auto;font-size:10.5px;color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));padding:1px 5px;border-radius:4px}
.wiki-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiki-empty{padding:10px;font-size:12px;color:rgb(var(--faint))}
.prose .wikilink{
  color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));text-decoration:none;
  padding:1.5px 5px;border-radius:5px;font-size:.94em;white-space:nowrap;
}
/* 统一垂直节奏：块与块之间只留一个间距，标题不再叠加 1.7em 的上边距 */
.prose > *, .blk-view > *{margin-top:0 !important;margin-bottom:0 !important}
.prose > * + *, .blk + .blk, .blk-view > * + *{margin-top:0 !important}
.prose > hr, .blk-view > hr{margin-top:1.15em !important;margin-bottom:1.15em !important}
/* 有边框/底色的块（代码块、表格、引用）留一点呼吸，否则会和相邻文字粘在一起 */
.prose > pre, .prose > table, .prose > blockquote,
.blk-view > pre, .blk-view > table, .blk-view > blockquote{margin-top:.34em !important;margin-bottom:.34em !important}
.prose > ul, .prose > ol, .blk-view > ul, .blk-view > ol{margin-top:.16em !important;margin-bottom:.16em !important}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.94em}
.prose th,.prose td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.prose th{background:rgb(var(--sunken));font-weight:600}
.prose .task{list-style:none;margin-left:-1.1em}
.prose .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.prose .empty{color:rgb(var(--faint));font-size:15px}
.source{
  display:none;width:100%;min-height:360px;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));padding:0;
}
.doc.mode-edit .prose{display:none}
.doc.mode-edit .source{display:block}
.doc.mode-preview .prose{cursor:text}
/* 双栏：左边源码，右边即时预览，两栏等高、各自滚动并联动 */
.doc.mode-split{max-width:1180px;padding-bottom:28px}
.doc.mode-split .doc-body{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;
  align-items:stretch;height:max(360px, calc(100vh - 232px));min-height:360px;
}
.doc.mode-split .source{
  display:block;grid-column:1;grid-row:1;padding-right:28px;
  border-right:1px solid #edf0f2;
  font-family:var(--font-mono);font-size:13.5px;line-height:1.8;
  height:100%;min-height:0;overflow-y:auto;
}
.doc.mode-split #live{display:none}
.doc.mode-split .prose{
  grid-column:2;grid-row:1;padding-left:28px;
  height:100%;min-height:0;max-height:none;overflow-y:auto;position:static;
}
.doc.mode-split .source::-webkit-scrollbar,
.doc.mode-split .prose::-webkit-scrollbar{width:8px}
.doc.mode-split .source::-webkit-scrollbar-thumb,
.doc.mode-split .prose::-webkit-scrollbar-thumb{background:rgb(var(--line));border-radius:8px}
[data-theme=dark] .doc.mode-split .source{border-right-color:#2b3035}
@media (max-width:900px){
  .doc.mode-split .doc-body{grid-template-columns:1fr;height:auto}
  .doc.mode-split .source{height:auto;max-height:none;border-right:0;padding-right:0;min-height:240px}
  .doc.mode-split .prose{
    height:auto;max-height:none;padding-left:0;margin-top:14px;padding-top:14px;
    border-top:1px solid #edf0f2;
  }
}

/* ===== 所见即所得（块级） ===== */
.live{display:none}
.doc.mode-live #prose{display:none}
.doc.mode-live .source{display:none}
.doc.mode-live .live{display:block;min-height:360px;cursor:text}
.blk{position:relative}
.blk-src{
  display:none;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));
  padding:0;margin:0;field-sizing:content;caret-color:rgb(var(--ivy));
}
.blk.editing .blk-src{display:block}
.blk.editing .blk-view{display:none}
/* 空块刚套上标题/列表时，用灰字提示该写什么，一输入就消失 */
.blk-hint{
  display:none;position:absolute;left:0;top:0;width:100%;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;
  color:rgb(var(--faint));pointer-events:none;white-space:pre-wrap;overflow:hidden;
}
.blk-hint .hp{color:rgb(var(--faint))}
.blk-hint .ht{color:rgb(var(--faint));opacity:.72}
/* 有占位提示时正文透明、由 .blk-hint 显示灰字；
   但 color:transparent 会让 caret 一起变透明（光标看不见），所以单独把光标颜色要回来 */
.blk-src.has-hint{color:transparent;caret-color:rgb(var(--ink))}
.blk-view{min-height:1.2em}
.blk-view input[type=checkbox]{cursor:pointer}
.blk-view img{cursor:default}
.lv-tail{height:180px}
.lv-hint{color:rgb(var(--faint));font-size:15px;line-height:1.95}

/* empty state */
.blank{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgb(var(--faint));text-align:center}
.blank .kbd{font-family:var(--font-mono);font-size:11.5px;padding:3px 7px;border-radius:5px;background:rgb(var(--sunken));border:.5px solid rgb(var(--line))}
.blank p{margin:0;font-size:13.5px}

/* ============ outline（无边框透明悬浮 + 右边缘刻度） ============ */
/* 收起时：右边缘一列随笔记长度变化的短刻度，一根对应一个标题，当前位置高亮 */
.outline-zone{position:fixed;right:0;top:58px;bottom:0;width:26px;z-index:45}
.ol-mini{position:absolute;right:12px;top:34px;width:16px;transition:opacity .18s}
.ol-tick{
  position:absolute;right:0;height:1px;padding:0;border:0;border-radius:1px;
  background:rgb(var(--ink)/.22);
  transition:background .16s,height .16s,transform .16s;
}
[data-theme=dark] .ol-tick{background:rgb(255 255 255 / .22)}
.ol-tick.on{background:rgb(var(--ivy));height:2px;transform:scaleX(1.3);transform-origin:right center}
/* 卡片展开/固定时，刻度让位给卡片自己的短横线 */
.outline-zone:hover .ol-mini,
body.ol-peek .ol-mini,
body.outline-pinned .ol-mini,
body.ol-hidden .ol-mini{opacity:0;pointer-events:none}
body.ol-hidden .outline-zone{display:none}
.outline{
  /* right 仍是 4px：保持和右边缘刻度连续的鼠标热区，否则鼠标从边缘移进卡片会闪回去；
     视觉上的间距靠 padding-right 让内容左移实现 */
  position:fixed;right:4px;top:66px;z-index:56;
  width:210px;max-height:min(620px,calc(100vh - 116px));
  display:flex;flex-direction:column;
  padding:5px 17px 7px 9px;border:0;border-radius:14px;
  /* 底色与笔记纸面一致（--surface），浮在正文上时加一层柔和阴影分离 */
  background:rgb(var(--surface));
  box-shadow:0 10px 34px rgb(var(--ink)/.13),0 2px 8px rgb(var(--ink)/.07);
  transform:translateX(10px);transform-origin:right top;
  opacity:0;pointer-events:none;
  transition:transform .26s var(--spring),opacity .16s;
}
[data-theme=dark] .outline{box-shadow:0 10px 34px rgb(0 0 0/.5),0 2px 8px rgb(0 0 0/.35)}
.outline-zone:hover ~ .outline,
.outline:hover,
.outline.pinned,
body.ol-hover .outline{transform:none;opacity:1;pointer-events:auto}
.outline.hidden{display:none}
/* Chrome 会把「可滚动/可聚焦」的浮层当成可聚焦控件，画一圈原生焦点环（黑框），Safari 不画。
   大纲是纯浮层，不需要这圈；键盘焦点改用下面的内描边，仍然可见。 */
.outline,.outline-body{outline:none!important}
.outline-body:focus-visible,.ol-item:focus-visible{outline:none!important;box-shadow:inset 0 0 0 1.5px rgb(var(--ivy)/.55);border-radius:6px}
.outline-head{display:flex;align-items:center;justify-content:flex-end;gap:1px;padding:3px 3px 5px;flex:0 0 auto}
.ol-btn{
  width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--faint));transition:background .14s,color .14s;
}
.ol-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.ol-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.ol-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.outline-body{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:1px 1px 2px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.outline-body::-webkit-scrollbar{width:7px}
.outline-body::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.12);border-radius:7px;border:2px solid transparent;background-clip:content-box}
.ol-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-size:12.8px;line-height:1.55;color:rgb(var(--ink-2));
  padding:5px 8px;border-radius:7px;margin:0;
  transition:background .16s,color .16s,transform .2s var(--spring),padding-left .2s var(--spring);
}
.ol-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .dash{flex:0 0 auto;width:9px;height:1px;border-radius:1px;background:rgb(var(--ink)/.17);transition:width .18s,background .18s,height .18s}
/* 悬停：加粗加黑 + 轻微右移动效，松手回弹（选择器要压过 .ol-item.l1~l6 的字重/颜色） */
.outline .ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:600;transform:translateX(3px)}
.ol-item.l1{font-weight:500;color:rgb(var(--ink))}
.ol-item.l2{padding-left:21px}
.ol-item.l3{padding-left:34px;font-size:12.3px}
.ol-item.l4,.ol-item.l5,.ol-item.l6{padding-left:47px;font-size:12.3px;color:rgb(var(--muted))}
.ol-item.on{color:rgb(var(--ink));font-weight:600}
.ol-item.on .dash{width:18px;height:1.5px;background:rgb(var(--ivy))}
.ol-empty{font-size:12px;color:rgb(var(--faint));padding:8px 9px}

/* ============ media ============ */
.view-pad{padding:44px 32px 40px}
.media-search{
  display:flex;align-items:center;gap:8px;max-width:320px;height:32px;padding:0 10px;
  border-radius:8px;background:rgb(var(--sunken));color:rgb(var(--muted));
}
.media-search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.media-search input{flex:1;border:0;outline:none;background:none;font-size:13px}
.media-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:rgb(var(--muted));font-size:13.5px;padding-bottom:60px;
}
.media-empty svg{width:32px;height:32px;stroke:rgb(var(--faint));fill:none;stroke-width:1.4;opacity:.7}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.media-card{position:relative;border-radius:10px;overflow:hidden;border:.5px solid rgb(var(--line));background:rgb(var(--sunken));transition:transform .2s var(--spring),box-shadow .2s;cursor:pointer}
.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.media-thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:11px;color:rgb(var(--faint))}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-name{padding:7px 26px 7px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgb(var(--surface))}
.media-del{
  position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;background:rgb(var(--surface)/.92);color:rgb(var(--muted));
  box-shadow:0 1px 4px rgb(0 0 0 / .16);opacity:0;transform:scale(.9);
  transition:opacity .14s,transform .14s var(--spring),background .14s,color .14s;
}
.media-del svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.media-card:hover .media-del,.media-card:focus-within .media-del{opacity:1;transform:none}
.media-del:hover{background:rgb(var(--danger));color:#fff}
@media (hover:none){ .media-del{opacity:1;transform:none} }

/* ============ graph ============ */
#graphWrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#graphWrap.dragging{cursor:grabbing}
#graphCanvas{width:100%;height:100%;display:block}
.graph-zoom{
  position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;
  background:rgb(var(--surface)/.9);backdrop-filter:blur(12px);border-radius:11px;
  box-shadow:var(--shadow-float);overflow:hidden;
}
.graph-zoom button{width:36px;height:34px;display:grid;place-items:center;color:rgb(var(--muted))}
.graph-zoom button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.graph-zoom svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.legend{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;color:rgb(var(--ink-2))}
.legend .sq{width:8px;height:8px;border-radius:2px;background:rgb(var(--warn))}
.legend .rd{width:8px;height:8px;border-radius:50%;background:rgb(var(--faint))}

/* ============ overlay / palette ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;
  padding-top:14vh;background:rgb(10 12 14 / .22);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.open{opacity:1;pointer-events:auto}
.palette{
  width:min(620px,90vw);background:rgb(var(--surface));border-radius:13px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  overflow:hidden;transform:translateY(-8px) scale(.985);transition:transform .22s var(--spring);
}
.overlay.open .palette{transform:none}
.palette-in{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid rgb(var(--line));color:rgb(var(--muted))}
.palette-in svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.palette-in input{flex:1;border:0;outline:none;background:none;font-size:14.5px}
.palette-list{max-height:46vh;overflow-y:auto;padding:6px}
.p-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;
  border-radius:8px;font-size:13.5px;color:rgb(var(--ink-2));
}
.p-row svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.p-row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .h{font-size:11px;color:rgb(var(--faint));font-family:var(--font-mono)}
.p-row.sel{background:rgb(var(--hover));color:rgb(var(--ink))}
.p-group{font-size:11px;font-weight:600;letter-spacing:.05em;color:rgb(var(--faint));padding:8px 10px 4px}
.p-empty{padding:18px;text-align:center;color:rgb(var(--faint));font-size:13px}

/* popover */
.popover{
  position:fixed;z-index:70;min-width:196px;max-width:300px;padding:5px;background:rgb(var(--surface));
  border-radius:10px;box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .14s,transform .16s var(--spring);
}
.popover.open{opacity:1;transform:none;pointer-events:auto}
.po-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;font-size:13px;color:rgb(var(--ink-2));text-align:left}
.po-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.po-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.po-item.danger{color:rgb(var(--danger))}
.po-item.danger svg{color:rgb(var(--danger))}
.po-item.muted{color:rgb(var(--faint));pointer-events:none}
.po-item>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.po-sep{height:1px;margin:4px 6px;background:rgb(var(--line))}
.po-key{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--faint))}
.hl-row{display:flex;align-items:center;gap:7px;padding:6px 8px 5px}
.hl-grid{display:grid;grid-template-columns:repeat(7,20px);gap:6px;padding:8px 9px 7px}
.hl-sw{width:20px;height:20px;border-radius:6px;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(var(--ink) / .10);transition:transform .12s var(--spring)}
.hl-sw:hover{transform:scale(1.14)}
.hl-sw:active{transform:scale(.96)}
.hl-add{
  display:grid;place-items:center;background:none;box-shadow:inset 0 0 0 1px rgb(var(--line));
  color:rgb(var(--muted));font-size:14px;line-height:1;
}
.hl-add:hover{color:rgb(var(--ink));box-shadow:inset 0 0 0 1px rgb(var(--ink)/.2)}
.hl-color-in{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.emoji-grid{display:grid;grid-template-columns:repeat(8,34px);gap:1px;padding:6px 4px;max-height:210px;overflow-y:auto;scrollbar-width:thin}
.emoji-grid::-webkit-scrollbar{width:6px}
.emoji-grid::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px;border:1px solid transparent;background-clip:content-box}
.emo{width:34px;height:32px;border-radius:6px;font-size:18px;line-height:1;display:grid;place-items:center;transition:background .12s}
.emo:hover{background:rgb(var(--hover))}
.emo:active{transform:scale(.92)}
.emo-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px 3px 5px;border-bottom:1px solid rgb(var(--line))}
.emo-tab{font-size:11.5px;padding:4px 2px;border-radius:5px;color:rgb(var(--muted));line-height:1.25;text-align:center;transition:background .12s,color .12s}
.emo-tab:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.emo-tab.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

/* toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;font-size:12.5px;
  background:rgb(var(--ink));color:rgb(var(--canvas));box-shadow:var(--shadow-float);
  animation:toastIn .3s var(--spring);max-width:70vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.hint{position:fixed;bottom:14px;right:16px;font-size:11px;color:rgb(var(--faint));z-index:5}
/* ============ 云同步面板 ============ */
.dock-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;margin-left:1px;transition:opacity .2s,background .2s}
.dock-item.sync-ok{color:rgb(var(--ivy))}
.dock-item.sync-ok .dot{opacity:1}
.dock-item.sync-busy .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-pending{color:rgb(var(--ivy))}
.dock-item.sync-pending .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-error{color:rgb(var(--warn))}
.dock-item.sync-error .dot{opacity:1}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.sheet{
  width:min(470px,92vw);padding:20px 22px 18px;background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  transform:translateY(-6px) scale(.99);transition:transform .22s var(--spring);
}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.sheet-sub{margin:0 0 16px;font-size:12.5px;line-height:1.75;color:rgb(var(--muted))}
.reg-hint{
  margin:0 0 16px;padding:11px 13px;border-radius:10px;
  background:rgb(var(--ivy-soft));border:1px solid rgb(var(--ivy)/.24);
}
.reg-hint-t{font-size:12.5px;line-height:1.72;color:rgb(var(--ink-2))}
.reg-hint-t b{color:rgb(var(--ivy-ink));font-weight:600}
.reg-hint-s{margin-top:6px;font-size:11.5px;line-height:1.7;color:rgb(var(--muted))}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));margin-bottom:6px}
.field input{
  width:100%;height:34px;padding:0 10px;border-radius:8px;border:.5px solid rgb(var(--line));
  background:rgb(var(--sunken));outline:none;font-size:13px;font-family:var(--font-mono);letter-spacing:.02em;
}
.field input:focus{border-color:rgb(var(--ivy)/.6);background:rgb(var(--surface))}
.sheet-row{display:flex;gap:8px;align-items:center}
.btn-primary{
  height:32px;padding:0 14px;border-radius:8px;background:rgb(var(--ivy));color:rgb(var(--on-ivy));
  font-size:12.5px;font-weight:600;transition:background .15s,opacity .15s;
}
.btn-primary:hover{background:rgb(var(--ivy-hover))}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{height:32px;padding:0 12px;border-radius:8px;color:rgb(var(--muted));font-size:12.5px;border:.5px solid rgb(var(--line))}
.btn-ghost:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.sheet-status{margin-top:14px;padding-top:11px;border-top:1px solid rgb(var(--line));font-size:11.5px;line-height:1.75;color:rgb(var(--faint))}
.sheet-status b{color:rgb(var(--ink-2));font-weight:600}

/* ============ 导出面板 ============ */
.export-pop{
  position:fixed;z-index:75;padding:15px 17px 17px;width:430px;max-width:calc(100vw - 24px);
  background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  opacity:0;pointer-events:none;transform:translateY(-4px) scale(.985);
  transition:opacity .16s,transform .2s var(--spring);
}
.export-pop.open{opacity:1;pointer-events:auto;transform:none}
.ex-head{font-size:13.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:6px}
.ex-desc{font-size:12px;line-height:1.65;color:rgb(var(--faint));margin:0 0 13px}
.ex-row{display:flex;gap:8px}
.ex-row button{
  height:34px;padding:0 15px;border-radius:17px;background:rgb(var(--hover));
  font-size:13px;font-weight:600;color:rgb(var(--ink));white-space:nowrap;
  transition:background .15s,transform .12s;
}
.ex-row button:hover{background:rgb(var(--sunken))}
.ex-row button:active{transform:scale(.97)}

/* 窄屏（含 iPad 竖屏、手机）不再隐藏大纲：卡片改成可读的浮层，点大纲按钮或右边缘刻度展开 */
@media (max-width:900px){
  /* 窄屏（iPad 竖屏 / 手机）维持铺满，不要两侧 44px 的空隙 */
  .doc{max-width:none;padding:40px 20px 120px}
  /* 浮层盖在正文上，手机上看不清透明底，这里给一层毛玻璃底（仍无边框）；
     v35: 手机上卡片收窄（64vw、右缘 8px），条目文字离右侧短横线不再空一大片 */
  .outline{
    width:min(212px,60vw);right:8px;top:60px;
    max-height:min(72vh,calc(100dvh - 150px));
    padding:6px 6px 8px 8px;border-radius:14px;
    background:rgb(var(--surface)/.97);
    -webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:var(--shadow-float);
  }
  /* 右上角图标缩小一点，并给标签栏留出它的宽度，别互相压 */
  .paper-actions{top:8px;right:8px;gap:0}
  .pa-btn{width:28px;height:28px}
  /* 右上角 7 个图标（含插入）占 196px，标签栏要让出这段，别压着标签 */
  .tabbar{padding-right:206px}
  .outline-head{padding:2px 2px 6px}
  .ol-item{padding-top:6px;padding-bottom:6px}
}
/* 只在手机（<=640px）去掉右边缘的刻度悬浮图标，大纲只从顶部按钮进出；
   iPad 竖屏（744px 起）不能落进这个区间，否则边缘悬浮图标会被误杀（v33 修复） */
@media (max-width:640px){
  .outline-zone{display:none}
  /* 手机上书架改成抽屉：展开时盖在笔记上，而不是把正文挤成一条 */
  .shelf{
    position:fixed;left:0;top:0;bottom:0;z-index:80;
    width:min(88vw,330px);flex:0 0 auto;margin-left:0;
    background:rgb(var(--canvas));
    box-shadow:24px 0 60px -22px rgb(16 24 32 / .22);
  }
  .shelf.collapsed{margin-left:calc(min(88vw,330px) * -1)}
}
.ol-close{display:none;margin-right:auto}
/* 触屏设备：没有稳定 hover，改用显式展开状态，并放大刻度点击热区 */
@media (hover:none){
  .outline-zone{width:30px}
  .ol-mini{right:11px}
  .ol-tick{height:2px}
  .ol-tick::after{content:'';position:absolute;left:-8px;right:0;top:-10px;bottom:-10px}
  /* iPad Safari 的 tap 只模拟一次 hover，点完就撤销，会把面板闪回去；
     而且粘滞的 :hover 会盖掉 body.ol-open，所以展开态要写得更具体 */
  .outline-zone:hover ~ .outline,
  .outline:hover{transform:translateX(10px);opacity:0;pointer-events:none}
  body .outline.pinned,
  body.ol-open .outline,
  body.ol-open .outline-zone:hover ~ .outline{transform:none;opacity:1;pointer-events:auto}
  .ol-close{display:grid}
}
body.ol-open .outline{transform:none;opacity:1;pointer-events:auto}
body.ol-open .ol-mini{opacity:0;pointer-events:none}

/* 分享二维码悬浮卡片 */
.share-ov{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgb(var(--ink)/.34);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .18s}
.share-ov.show{opacity:1}
.share-card{
  width:min(320px,86vw);background:rgb(var(--surface));border-radius:18px;
  box-shadow:0 24px 64px rgb(var(--ink)/.28);padding:22px 22px 18px;text-align:center;
  transform:translateY(14px) scale(.97);transition:transform .22s var(--spring, cubic-bezier(.34,1.4,.64,1));
}
.share-ov.show .share-card{transform:none}
.share-card .sc-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:rgb(var(--ink))}
.share-card .sc-x{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;cursor:pointer;
  color:rgb(var(--muted));font-size:18px;line-height:1;transition:background .14s}
.share-card .sc-x:hover{background:rgb(var(--hover))}
.share-card .sc-qr{width:184px;height:184px;margin:16px auto 10px;display:block;border-radius:12px;
  background:#fff;padding:10px;box-shadow:0 1px 6px rgb(var(--ink)/.1)}
.share-card .sc-hint{font-size:12px;color:rgb(var(--muted));margin:0 0 12px}
.share-card .sc-url{
  font-size:12px;color:rgb(var(--ink-2,var(--ink)));background:rgb(var(--sunken));
  border-radius:9px;padding:9px 11px;word-break:break-all;line-height:1.5;margin:0 0 14px;max-height:64px;overflow:auto;
}
.share-card .sc-btns{display:flex;gap:8px}
.share-card .sc-btns button{
  flex:1;height:38px;border-radius:10px;border:0;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:filter .15s,background .15s;
}
.share-card .sc-copy{background:rgb(var(--ivy));color:#fff}
.share-card .sc-copy:hover{filter:brightness(1.06)}
.share-card .sc-unshare{background:rgb(var(--hover));color:rgb(var(--danger,var(--ink)))}
.share-card .sc-unshare:hover{background:rgb(var(--danger)/.1)}
