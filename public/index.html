/* ============ 导出面板 ============ */
.export-pop{
  position:fixed;z-index:155;padding:15px 17px 17px;width:430px;max-width:calc(100vw - 24px);
  background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  opacity:0;pointer-events:none;transform:translateY(-4px) scale(.985);
  transition:opacity .16s,transform .2s var(--spring);
}
.export-pop.open{opacity:1;pointer-events:auto;transform:none}
.ex-head{font-size:13.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:6px}
.ex-desc{font-size:12px;line-height:1.65;color:rgb(var(--faint));margin:0 0 13px}
.ex-row{display:flex;gap:8px}
.ex-row button{
  height:34px;padding:0 15px;border-radius:17px;background:rgb(var(--hover));
  font-size:13px;font-weight:600;color:rgb(var(--ink));white-space:nowrap;
  transition:background .15s,transform .12s;
}
.ex-row button:hover{background:rgb(var(--sunken))}
.ex-row button:active{transform:scale(.97)}

/* 窄屏（含 iPad 竖屏、手机）不再隐藏大纲：卡片改成可读的浮层，点大纲按钮或右边缘刻度展开 */
@media (max-width:900px){
  /* 窄屏（iPad 竖屏 / 手机）维持铺满，不要两侧 44px 的空隙 */
  .doc{max-width:none;padding:var(--doc-pad-t, 40px) 20px var(--doc-pad-b, 30vh)}
  /* 浮层盖在正文上，手机上看不清透明底，这里给一层毛玻璃底（仍无边框）；
     v35: 手机上卡片收窄（64vw、右缘 8px），条目文字离右侧短横线不再空一大片 */
  .outline{
    width:min(212px,60vw);right:8px;top:60px;
    max-height:min(72vh,calc(100dvh - 150px));
    padding:6px 6px 8px 8px;border-radius:14px;
    background:rgb(var(--surface)/.97);
    -webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:var(--shadow-float);
  }
  /* 右上角图标缩小一点，并给标签栏留出它的宽度，别互相压 */
  /* right 收到 2px：书架抽屉宽 330px，让番茄钟和「⋯」在抽屉打开时也点得到 */
  .paper-actions{top:8px;right:2px;gap:0}
  .pa-btn{width:34px;height:34px}
  /* 右上角只剩番茄钟与「⋯」两个图标（34px 各一枚），标签栏留出这段就够 */
  .tabbar{padding-right:84px}
  .outline-head{padding:2px 2px 6px}
  .ol-item{padding-top:6px;padding-bottom:6px}
}
/* 手机（<=640px）：右边缘换成一颗常驻的「悬浮条」，
   比一列看不见的刻度好点，也不会和正文的滑动手势打架。
   iPad 竖屏（744px 起）不落进这个区间，仍是电脑那套刻度。 */
@media (max-width:640px){
  .outline-zone{
    display:block;pointer-events:none;width:30px;z-index:56;
    top:calc(92px + env(safe-area-inset-top));   /* 让开标签栏 50 + Markdown 工具条 38 */
    bottom:calc(10px + env(safe-area-inset-bottom));
  }
  /* 手机上不用刻度列：只留悬浮条 */
  .outline-zone .ol-mini{display:none}
  .ol-handle{
    position:fixed;right:0;top:42%;transform:translateY(-50%);z-index:56;
    display:grid;place-items:center;pointer-events:auto;
    width:21px;height:62px;padding:0;border:0;border-radius:11px 0 0 11px;
    background:rgb(var(--surface) / .92);color:rgb(var(--ink-2));
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    backdrop-filter:blur(14px) saturate(150%);
    box-shadow:-3px 0 14px rgb(16 24 32 / .12), inset 1px 1px 0 rgb(255 255 255 / .7), inset 0 0 0 .5px rgb(var(--ink) / .07);
    transition:opacity .16s,transform .16s;
  }
  [data-theme=dark] .ol-handle{
    background:rgb(var(--surface) / .92);
    box-shadow:-3px 0 16px rgb(0 0 0 / .4), inset 1px 1px 0 rgb(255 255 255 / .08), inset 0 0 0 .5px rgb(255 255 255 / .12);
  }
  .ol-handle svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  /* 视觉上很窄，但热区往外扩一圈，手指还是好点 */
  .ol-handle::after{content:'';position:absolute;left:-14px;top:-10px;bottom:-10px;right:0}
  .ol-handle:active{transform:translateY(-50%) scale(.94)}
  /* 卡片展开时悬浮条让位 */
  body.ol-open .ol-handle{opacity:0;pointer-events:none}
  body.ol-hidden .ol-handle{display:none}
  /* 展开时卡片从右边滑出：顶部避开标签栏与工具条，底部避开 Home 手势条 */
  .outline{
    right:6px;top:calc(94px + env(safe-area-inset-top));
    width:min(236px,78vw);
    max-height:calc(100dvh - 118px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  /* 抽屉头部：设置（底部浮条有齿轮）和「收起工作区」（点 Home 或点外面就能收）在手机上多余 */
  #btnSettings, #btnShelf{display:none}
  /* 手机上书架改成抽屉：展开时盖在笔记上，而不是把正文挤成一条 */
  .shelf{
    position:fixed;left:0;top:0;bottom:0;z-index:80;
    width:var(--shelf-w-drawer);flex:0 0 auto;margin-left:0;
    background:rgb(var(--canvas));
    box-shadow:24px 0 60px -22px rgb(16 24 32 / .22);
  }
  .shelf.collapsed{margin-left:calc(var(--shelf-w-drawer) * -1)}
}
.ol-close{display:none;margin-right:auto}
/* 桌面端也给出关闭按钮：靠边缘滑出的悬停态也能一键收起，不必先把鼠标挪远 */
body.ol-hover .ol-close,
body.ol-open .ol-close,
.outline:hover .ol-close{display:grid}
/* 触屏设备：没有稳定 hover，改用显式展开状态，并放大刻度点击热区 */
@media (hover:none){
  .outline-zone{width:30px}
  .ol-mini{right:11px}
  .ol-tick{height:2px}
  .ol-tick::after{content:'';position:absolute;left:-8px;right:0;top:-10px;bottom:-10px}
  /* iPad Safari 的 tap 只模拟一次 hover，点完就撤销，会把面板闪回去；
     而且粘滞的 :hover 会盖掉 body.ol-open，所以展开态要写得更具体 */
  .outline-zone:hover ~ .outline,
  .outline:hover{transform:translateX(10px);opacity:0;pointer-events:none}
  body .outline.pinned,
  body.ol-open .outline,
  body.ol-open .outline-zone:hover ~ .outline{transform:none;opacity:1;pointer-events:auto}
  .ol-close{display:grid}
}
body.ol-open .outline{transform:none;opacity:1;pointer-events:auto}
body.ol-open .ol-mini{opacity:0;pointer-events:none}

/* 分享二维码悬浮卡片 */
.share-ov{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgb(var(--ink)/.34);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .18s}
.share-ov.show{opacity:1}
.share-card{
  width:min(320px,86vw);background:rgb(var(--surface));border-radius:18px;
  box-shadow:0 24px 64px rgb(var(--ink)/.28);padding:22px 22px 18px;text-align:center;
  transform:translateY(14px) scale(.97);transition:transform .22s var(--spring, cubic-bezier(.34,1.4,.64,1));
}
.share-ov.show .share-card{transform:none}
.share-card .sc-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:rgb(var(--ink))}
.share-card .sc-x{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;cursor:pointer;
  color:rgb(var(--muted));font-size:18px;line-height:1;transition:background .14s}
.share-card .sc-x:hover{background:rgb(var(--hover))}
.share-card .sc-qr{width:184px;height:184px;margin:16px auto 10px;display:block;border-radius:12px;
  background:#fff;padding:10px;box-shadow:0 1px 6px rgb(var(--ink)/.1)}
.share-card .sc-hint{font-size:12px;color:rgb(var(--muted));margin:0 0 12px}
.share-card .sc-url{
  font-size:12px;color:rgb(var(--ink-2,var(--ink)));background:rgb(var(--sunken));
  border-radius:9px;padding:9px 11px;word-break:break-all;line-height:1.5;margin:0 0 14px;max-height:64px;overflow:auto;
}
.share-card .sc-btns{display:flex;gap:8px}
.share-card .sc-btns button{
  flex:1;height:38px;border-radius:10px;border:0;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:filter .15s,background .15s;
}
.share-card .sc-copy{background:rgb(var(--ivy));color:#fff}
.share-card .sc-copy:hover{filter:brightness(1.06)}
.share-card .sc-unshare{background:rgb(var(--hover));color:rgb(var(--danger,var(--ink)))}
.share-card .sc-unshare:hover{background:rgb(var(--danger)/.1)}
.share-card .sc-refresh{background:rgb(var(--hover));color:rgb(var(--ink))}
.share-card .sc-refresh:hover{background:rgb(var(--sunken))}
.share-card .sc-refresh:disabled{opacity:.6;cursor:default}
.share-card .sc-note{margin:10px 2px 0;font-size:11.5px;line-height:1.6;color:rgb(var(--faint))}

/* ---- 手机：列表页 ↔ 笔记页 两级，侧栏仍是抽屉 ---- */
.m-back{
  display:none;align-items:center;gap:5px;flex:0 0 auto;
  height:30px;padding:0 9px 0 0;margin-left:-4px;border-radius:8px;
  color:rgb(var(--ink));font-size:13px;line-height:1;
}
.m-back:hover{background:rgb(var(--hover))}
.m-back .mb-ar{font-size:20px;line-height:1;color:rgb(var(--muted));margin-top:-2px;margin-left:-1px}
.m-back .mb-t{font-weight:600;white-space:nowrap;letter-spacing:-.01em;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.m-back .mb-n{font-size:11.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .notelist{display:flex!important;flex:1 1 auto;width:auto;flex-basis:auto;border-left:0;background:rgb(var(--canvas))}
  .nl-hd{height:54px;padding:0 8px 0 6px;gap:6px}
  .nl-hd b{font-size:15px}
  .nl-back.show{display:inline-flex}
  .nl-open{display:grid}
  .nl-new{width:34px;height:34px}
  .tab-new{width:34px;height:34px;border-radius:9px}
  .tab-new svg{width:18px;height:18px}
  .nl-rows{padding:2px 8px 28px}
  .nl-row{padding:11px 10px 12px;border-radius:10px}
  .nl-row .nl-more,.nl-row .nl-del{top:9px}
  .nl-row .nl-t{font-size:14.5px}
  .nl-row .nl-s{font-size:12.5px;margin-top:4px}
  .nl-row .nl-d{font-size:11.5px}
  .tabbar{padding-left:10px}
  .main-wrap{position:fixed;inset:0;z-index:60;padding:0;background:rgb(var(--canvas));display:none}
  body.m-read .main-wrap{display:flex}
  body.m-read .notelist{display:none!important}
  /* 上面那行 .notelist{display:flex!important} 会把 renderList 加的 .hidden 顶掉，
     切到待办 / 媒体库 / 关系图时列表页一直盖在上面。这里把 .hidden 提回来 */
  .notelist.hidden{display:none!important}
  .main-wrap .paper{border:0;border-radius:0;box-shadow:none;width:100%;margin:0;padding-top:env(safe-area-inset-top)}
  body.m-read .m-back{display:inline-flex}
  #shelfOpen{display:none!important}
  .help-wrap{display:block}
  .help-ol{display:none!important}
  /* 使用说明顶部这排栏目：原来 5 个挤成一行，每个字被迫竖排；改成横向可滑动 */
  .help-tabs{padding:0 14px 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .help-tabs::-webkit-scrollbar{display:none}
  .help-tab{flex:0 0 auto;white-space:nowrap}
  /* 手机上待办视图直接把列表画进主区（手机没有左侧栏） */
  .todo-mobile{padding:6px 8px calc(24px + env(safe-area-inset-bottom))}
  .todo-mobile .tsh-meta{padding:2px 6px 12px;font-size:12px}
  .todo-mobile .tsg-h{padding:9px 8px;font-size:14.5px}
  .todo-mobile .tsg-h .gchev{width:12px;height:12px}
  .todo-mobile .tsi{padding:9px 10px 10px 8px;border-radius:10px;gap:9px}
  .todo-mobile .tsi .t{font-size:14.5px;line-height:1.55}
  .todo-mobile .tsi .src{font-size:11.5px}
  .todo-mobile .tsi input{width:17px;height:17px;margin-top:1px}
  .todo-mobile .tsi-bell{width:34px;height:34px}
  .todo-mobile .tsi-arch,.todo-mobile .tsi-arch-restore{width:34px;height:34px}
  .todo-mobile .tsh-sub{margin-top:14px}
  /* 手机没有 esc 键，命令面板不必提示 */
  .esc-hint{display:none}
  /* 新建笔记本：颜色点与快捷名称按手指尺寸放大 */
  .nb-sw{gap:12px}
  .nb-sw button{width:30px;height:30px}
  .nb-quick button{height:32px}
}
/* iOS：手指点一下就放大，是因为被点的输入框字号小于 16px，或系统把连击当双击缩放。
   这里禁掉双击缩放（捏合仍可用），并把手机上的输入框统一抬到 16px。 */
html{touch-action:manipulation}
button,a,[role=button]{-webkit-tap-highlight-color:transparent}
@media (max-width:900px){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
  textarea,select{font-size:16px !important}
  /* 正文字号用户可能调到 14，手机上兜底到 16，避免一聚焦就整屏放大 */
  .prose{font-size:max(16px,var(--doc-fs,16px))}
}
/* ---- 导出长图的预览浮层 ---- */
.lp-ov{
  position:fixed;inset:0;z-index:142;background:rgb(16 24 32 / .48);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.lp-ov.open{opacity:1;pointer-events:auto}
.lp-card{
  width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-lift);
  overflow:hidden;transform:translateY(8px);transition:transform .2s var(--spring);
}
.lp-ov.open .lp-card{transform:none}
.lp-hd{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid rgb(var(--line))}
.lp-hd-t{flex:1;min-width:0}
.lp-hd h3{font-size:14.5px;font-weight:600;color:rgb(var(--ink))}
.lp-hd p{font-size:11.5px;color:rgb(var(--faint));margin-top:4px;line-height:1.6}
.lp-body{
  flex:1;min-height:0;overflow:auto;background:rgb(var(--sunken));
  padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;
  overscroll-behavior:contain;
}
.lp-body img{max-width:100%;border-radius:10px;box-shadow:0 2px 12px rgb(16 24 32 / .14);display:block}
.lp-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid rgb(var(--line))}
.lp-btn{height:33px;padding:0 15px;border-radius:9px;background:rgb(var(--ink)/.06);font-size:12.5px;color:rgb(var(--ink-2));transition:background .14s,color .14s}
.lp-btn:hover{background:rgb(var(--ink)/.11);color:rgb(var(--ink))}
.lp-btn.primary{background:rgb(var(--ivy));color:rgb(var(--on-ivy))}
.lp-btn.primary:hover{background:rgb(var(--ivy-hover));color:rgb(var(--on-ivy))}


/* ===== 手机底部浮条（≤640px）=====
   玻璃配方：blur(28px) saturate(170%) + 10% 白 + inset 1px 1px #fff8，
   另加外圈细亮环、斜向反光；折射用 #mGlassDistort（Chrome 生效，Safari 退回纯模糊） */
.m-bar{display:none}
/* 浮条底下垫一层「渐隐遮罩」：列表滚到这儿时文字淡进背景色，
   不会和玻璃按钮糊在一起（本身就是 canvas 色，看不出边界） */
.m-scrim{display:none}
.m-bar .m-glass{
  background-color:rgb(255 255 255 / 46%);
  background-image:
    linear-gradient(142deg, rgb(255 255 255 / 55%) 0%, rgb(255 255 255 / 18%) 26%, rgb(255 255 255 / 0%) 56%),
    radial-gradient(95% 75% at 6% 0%, rgb(255 255 255 / 45%), rgb(255 255 255 / 0%) 64%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  backdrop-filter:blur(28px) saturate(170%);
  box-shadow:
    inset 1px 1px 0 rgb(255 255 255 / 95%),
    inset -1px -1px 0 rgb(255 255 255 / 55%),
    inset 0 0 0 1px rgb(255 255 255 / 62%),
    inset 0 0 0 1.5px rgb(17 20 26 / 6%),
    0 10px 26px rgb(16 24 32 / 14%);
}
/* Safari 的 backdrop-filter 不认 url() 滤镜函数：写成 blur() + url() 时整条声明会被丢掉，
   连模糊也一起没了（底下的笔记正文就直接透出来）。所以基础模糊单独声明，
   折射位移只给认得这个语法的浏览器（Chrome）加。 */
@supports (backdrop-filter: url(#mGlassDistort)){
  .m-bar .m-glass{backdrop-filter:blur(28px) saturate(170%) url(#mGlassDistort)}
}
[data-theme=dark] .m-bar .m-glass{
  background-color:rgb(255 255 255 / 16%);
  background-image:
    linear-gradient(142deg, rgb(255 255 255 / 18%) 0%, rgb(255 255 255 / 5%) 26%, rgb(255 255 255 / 0%) 54%),
    radial-gradient(95% 75% at 6% 0%, rgb(255 255 255 / 14%), rgb(255 255 255 / 0%) 64%);
  box-shadow:
    inset 1px 1px 0 rgb(255 255 255 / 55%),
    inset -1px -1px 0 rgb(255 255 255 / 14%),
    inset 0 0 0 1px rgb(255 255 255 / 22%),
    inset 0 -10px 22px rgb(255 255 255 / 5%),
    0 10px 28px rgb(0 0 0 / 30%);
}
@media (max-width:640px){
  .m-bar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:85;
    padding:0 16px calc(14px + env(safe-area-inset-bottom));
    align-items:center;justify-content:space-between;pointer-events:none;
    transition:transform .26s cubic-bezier(.32,.72,0,1), opacity .2s;
  }
  .m-bar > *{pointer-events:auto}
  .m-scrim{
    --sc:var(--canvas);
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:84;pointer-events:none;
    height:calc(128px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,
      rgb(var(--sc) / .68) 0 50%,
      rgb(var(--sc) / .5) 66%,
      rgb(var(--sc) / .18) 84%,
      rgb(var(--sc) / 0) 100%);
  }
  /* 进了笔记页就收起，别挡正文 */
  body.m-read .m-bar{transform:translateY(150%);opacity:0;pointer-events:none}
  /* 设置是整屏浮层（z-index:150），这里把三键抬到浮层之上，设置页里也能一键回列表 / 新建 */
  /* 媒体库 / 关系图整屏页：底部三键也保留（Home / 设置 / 新建） */
  body.m-view .m-bar{transform:none;opacity:1;pointer-events:auto}
  body.set-open .m-bar, body.set-open.m-read .m-bar{
    z-index:152;transform:none;opacity:1;pointer-events:auto;
  }
  body.m-read .m-scrim{display:none}
  /* 媒体库 / 关系图也是白底整屏：底部同样垫一层同色渐隐 */
  body.m-view .m-scrim{display:block;--sc:var(--surface)}
  /* 设置页铺的是 --surface（纯白），遮罩换成同色才不会看得出灰带；
     浮层本身 z-index:150，遮罩得抬到它上面（仍在三键之下）才盖得住正文 */
  body.set-open .m-scrim{display:block;--sc:var(--surface);z-index:151}
  .m-pill{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px}
  .m-btn{
    appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;
    width:46px;height:46px;border-radius:999px;display:grid;place-items:center;
    color:rgb(var(--ink-2));touch-action:manipulation;
    transition:background .16s,color .16s,transform .12s;
  }
  .m-btn:active{transform:scale(.94)}
  .m-btn.on{color:rgb(var(--ink));background:rgb(var(--ink) / .08)}
  .m-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .m-fab{
    appearance:none;border:0;padding:0;cursor:pointer;
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    color:rgb(var(--ink));touch-action:manipulation;transition:transform .14s;
  }
  .m-fab:active{transform:scale(.94)}
  .m-fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round}
  /* 待办日程页：底部只留 Home（＋ 在右），设置齿轮在这里不出现 */
  body.m-todo #mSet{display:none}
  /* 媒体库 / 关系图：底部三键压在上面，内容给自己留出位置 */
  body.m-view .view-pad{padding-bottom:calc(124px + env(safe-area-inset-bottom))}
  body.m-view .graph-zoom{bottom:calc(96px + env(safe-area-inset-bottom))}
  /* 底部三键已经承担了「展开书架 / 新建」，列表头这两颗就收起来，标题也更宽 */
  .nl-hd .nl-open, .nl-hd .nl-new,
  body.shelf-collapsed .nl-hd .nl-open, body.shelf-collapsed .nl-hd .nl-new{display:none}
  /* 标题整块可点：展开主目录（笔记本栏），热区放大一点，手指好按 */
  .nl-hd #nlTitle, .nl-hd #nlCount{cursor:pointer}
  .nl-hd #nlTitle{padding:5px 3px;margin:-5px -3px}
  /* 列表与抽屉底部留出浮条高度 + 渐隐区，最后一条不被压住也不被遮罩吃掉 */
  .nl-rows{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  .shelf{padding-bottom:calc(116px + env(safe-area-inset-bottom))}
  .todo-mobile{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  /* 首次打开那条「添加到主屏幕」别和浮条打架 */
  .ios-hint{bottom:calc(84px + env(safe-area-inset-bottom))}
  /* 提示条也抬到浮条上面，否则「已归档」「再点一下」会被三个按钮压住 */
  .toasts{bottom:calc(86px + env(safe-area-inset-bottom))}
}

<body>
<div class="shell">
  <aside class="shelf" id="shelf">
    <header class="shelf-head">
      <div class="brand">
        <h1 class="brand-name" id="brandName">随手笔记</h1>
      </div>
      <div class="head-actions" id="headActions">
        <button class="icon-btn" id="btnHome" title="主目录" aria-label="回到主目录"></button>
        <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置"></button>
        <button class="icon-btn" id="btnShelf" title="收起工作区 (⌘\)" aria-label="收起工作区"></button>
      </div>
    </header>
    <div class="shelf-body" id="shelfBody"></div>
    <div class="shelf-foot">
      <span class="sync-pip off" id="syncPip" role="img" aria-label="云同步状态"></span>
      <div class="build-tag" id="buildTag" title="点击查看版本信息"></div>
    </div>
    <nav class="dock" id="dock"></nav>
  </aside>
  <section class="notelist" id="noteList">
    <div class="nl-hd">
      <button class="icon-btn nl-open" id="nlOpen" title="展开工作区 (⌘\)" aria-label="展开工作区"></button>
      <button class="nl-new" id="nlNew" title="新建笔记 (⌘N)" aria-label="新建笔记"></button>
      <button class="nl-back" id="nlBack" title="回到全部笔记" aria-label="回到全部笔记"><span class="nb-ar">‹</span>全部</button>
      <b id="nlTitle">全部笔记</b><em id="nlCount">0</em>
      <span class="nl-r">
        <button class="icon-btn" id="nlSearch" title="搜索笔记 (⌘K)" aria-label="搜索笔记"></button>
        <button class="icon-btn" id="nlMore" title="更多" aria-label="更多"></button>
      </span>
    </div>
    <div class="nl-rows" id="nlRows"></div>
  </section>
  <main class="main-wrap">
    <button class="shelf-open" id="shelfOpen" title="展开书架 (⌘\)"></button>
    <button class="home-float" id="homeFloat" title="主目录" aria-label="回到主目录"></button>
    <section class="paper">
      <div class="tabbar" id="tabbar"></div>
      <div class="paper-actions" id="paperActions"></div>
      <div class="content-row">
        <div class="scroll" id="scroll"></div>
        <div class="outline-zone" id="outlineZone" title="大纲：靠近查看，点击固定">
          <div class="ol-mini" id="olMini"></div>
        </div>
        <!-- 手机右边缘的悬浮条：独立按钮，不继承 .outline-zone 的 pointer-events:none -->
        <button class="ol-handle" id="olHandle" type="button" title="大纲" aria-label="展开大纲">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
        <aside class="outline" id="outline"></aside>
      </div>
    </section>
  </main>
</div>

<!-- 手机底部浮条（≤640px 才显示）：Home 折叠笔记本栏 / 设置 / 新建笔记 -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="mGlassDistort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="2" seed="17" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.6" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="m-scrim" id="mScrim" aria-hidden="true"></div>
<div class="m-bar" id="mBar">
  <div class="m-pill m-glass">
    <button class="m-btn" id="mHome" title="笔记本栏" aria-label="展开或收起笔记本栏">
      <svg viewBox="0 0 24 24"><rect x="3.8" y="4.8" width="16.4" height="14.4" rx="3.4"/><path d="M7.6 14.6h8.8"/></svg>
    </button>
    <button class="m-btn" id="mSet" title="设置" aria-label="打开设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <button class="m-fab m-glass" id="mNew" title="新建笔记" aria-label="新建笔记">
    <svg viewBox="0 0 24 24"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="palette">
    <div class="palette-in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="paletteInput" placeholder="搜索笔记，或输入命令…" spellcheck="false" autocomplete="off" />
      <span class="h esc-hint" style="font-family:var(--font-mono);font-size:11px;color:var(--faint)">esc</span>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>
<div class="popover" id="popover" popover="manual"></div>
<div class="nb-ov" id="nbOv">
  <div class="nb-dlg" role="dialog" aria-modal="true" aria-labelledby="nbTitle">
    <div class="nb-top">
      <div class="nb-ico" id="nbIco"></div>
      <div class="nb-tt"><h3 id="nbTitle">新建笔记本</h3><p id="nbDesc"></p></div>
      <button class="nb-x" id="nbX" aria-label="关闭">×</button>
    </div>
    <div class="nb-preview">
      <div class="nb-pv-cover" id="nbPvCover"></div>
      <div style="min-width:0;flex:1">
        <div class="nb-pv-name" id="nbPvName">新笔记本</div>
        <div class="nb-pv-sub" id="nbPvSub">0 篇笔记</div>
      </div>

const VER_KEY = 'ivy.versions.v1';
const VER_HOUR = 3600000, VER_WEEK = 7 * 86400000;

let VERSIONS = {};                 // { noteId: [ {id, at, title, body} ] } 时间倒序
let HIST = { noteId:null, local:[], remote:[], sel:null, loading:false };

function loadVersions(){
  try{
    const raw = localStorage.getItem(VER_KEY);
    VERSIONS = raw ? (JSON.parse(raw) || {}) : {};
    if(!VERSIONS || typeof VERSIONS !== 'object') VERSIONS = {};
  }catch(e){ VERSIONS = {}; }
}
function saveVersions(){
  try{
    let raw = JSON.stringify(VERSIONS);
    // localStorage 只有 5MB 左右，超了就按时间从最旧的丢 35%
    if(raw.length > 3.2e6){
      const flat = [];
      Object.keys(VERSIONS).forEach(k=>VERSIONS[k].forEach(v=>flat.push({ k, v })));
      flat.sort((a,b)=>a.v.at - b.v.at);
      const dropN = Math.ceil(flat.length * 0.35);
      const kill = new Set(flat.slice(0, dropN).map(x=>x.k + '|' + x.v.id));
      Object.keys(VERSIONS).forEach(k=>{
        VERSIONS[k] = VERSIONS[k].filter(v=>!kill.has(k + '|' + v.id));
      });
      raw = JSON.stringify(VERSIONS);
    }
    localStorage.setItem(VER_KEY, raw);
  }catch(e){ /* 存不下就算了，别影响正文保存 */ }
}
/* 保留策略（list 必须按时间倒序） */
function pruneVersions(list){
  const now = Date.now();
  const out = [];
  let weekBucket = null, dayBucket = null;
  for(const v of list){
    const age = now - v.at;
    if(age < VER_HOUR){ out.push(v); continue; }
    if(age < VER_WEEK){
      const b = Math.floor(v.at / 600000);          // 10 分钟一个桶
      if(b !== weekBucket){ out.push(v); weekBucket = b; }
      continue;
    }
    const b = new Date(v.at).toDateString();        // 每天一个
    if(b !== dayBucket){ out.push(v); dayBucket = b; }
  }
  return out.slice(0, VER_MAX_LOCAL);
}
/* 内容有变化才记；默认一分钟最多一条，force 用于「恢复前存档」这种关键节点 */
function recordVersion(n, force){
  if(!n || !n.id) return;
  const now = Date.now();
  if(!VERSIONS[n.id]) VERSIONS[n.id] = [];
  const bucket = VERSIONS[n.id];
  const head = bucket[0];
  const body = n.body || '', title = n.title || '';
  if(head && head.title === title && head.body === body) return;
  if(!force && head && now - head.at < 60000) return;   // 一分钟一个
  if(!force && !body.trim() && !title.trim()) return;   // 空笔记不占空间
  const v = { id:'v' + now.toString(36) + Math.random().toString(36).slice(2,5), at:now, title, body };
  bucket.unshift(v);
  VERSIONS[n.id] = pruneVersions(bucket);
  saveVersions();
  if(isConnected()) pushVersionRemote(n.id, v);
}
async function pushVersionRemote(noteId, v){

  }catch(e){ /* 离线就只留本地版本 */ }
}

function verTime(at){
  const d = new Date(at), now = new Date();
  const same = (a,b)=>a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if(same(d, now)) return '今天 ' + hm;
  if(same(d, new Date(now.getTime() - 86400000))) return '昨天 ' + hm;
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;

function verAgo(at){
  const s = Math.max(0, Math.round((Date.now() - at) / 1000));
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.round(s/60) + ' 分钟前';
  if(s < 86400) return Math.round(s/3600) + ' 小时前';
  return Math.round(s/86400) + ' 天前';

function histList(){

function devId(){

function devLabel(){
  if(DEV_LABEL) return DEV_LABEL;

  let os = 'Web';
  if(/iPhone/.test(ua)) os = 'iPhone';
  else if(/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) os = 'iPad';
  else if(/Android/.test(ua)) os = 'Android';
  else if(/Macintosh|Mac OS X/.test(ua)) os = 'macOS';
  else if(/Windows/.test(ua)) os = 'Windows';

  let br = '浏览器';

  else if(/Chrome\//.test(ua)) br = 'Chrome';

  DEV_LABEL = br + ' · ' + os;

/* 同一台设备 2 分钟内只打一次点，避免每敲一个字就写盘 */
function noteTouchDevice(n){

  if(!Array.isArray(n.devices)) n.devices = [];
  const hit = n.devices.find(d=>d && d.id === id);

    else { hit.at = now; hit.label = devLabel(); }
  }else{
    n.devices.push({ id:id, label:devLabel(), at:now });

/* 把连续多个空行收成一个（不动代码块内部）。
   早先这里会把「块级语法前的空行」整行删掉，结果把「无序列表 + 空行 + 有序列表」
   粘成一块，有序列表的序号直接丢了 —— 空行是列表的边界，不能删。 */
function normalizeBlockSpacing(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  let inFence = false;
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^\s*```/.test(ln)){ inFence = !inFence; out.push(ln); continue; }
    if(!inFence && !ln.trim()){
      // 一串空行只留一个：块与块之间的分隔还在，不会让相邻列表粘在一起
      while(i+1 < lines.length && !lines[i+1].trim()) i++;
      out.push('');
      continue;
    }
    out.push(ln);
  }
  return out.join('\n');
}

/* 颜色按标签名取，保证同一个标签在书架、笔记胶囊、选择器里颜色一致 */
function tagColor(t){
  let h = 0;
  for(const c of String(t||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return TAG_COLORS[h % TAG_COLORS.length];
}
function tagOf(n){ return Array.isArray(n.tags) ? n.tags : []; }
/* 历史标签 = 所有笔记（含回收站）用过的 + 本机记住的新建标签。
   笔记本身的 tags 会随云同步走，所以其它设备建过的标签也会出现在这里。 */
function allTags(){
  const set = new Set();
  (S.tagLibrary||[]).forEach(t=>{ if(t) set.add(t); });
  S.notes.forEach(n=>{ if(!n.deleted) tagOf(n).forEach(t=>{ if(t) set.add(t); }); });
  return [...set];
}
function tagCount(t){
  return S.notes.filter(n=>!n.trashed && !n.deleted && tagOf(n).includes(t)).length;
}
/* 左侧标签树只列「当前确实有笔记在用」的标签；
   单篇笔记的选择器仍用 allTags()，能翻出摘掉过的历史标签 */
function usedTags(notes){
  const set = new Set();
  notes.forEach(n=>tagOf(n).forEach(t=>{ if(t) set.add(t); }));
  return [...set];
}
/* 删除标签 = 把它从所有笔记上摘掉，笔记本身保留 */
function deleteTag(t){
  if(!t || t === NO_TAG) return;
  const affected = S.notes.filter(n=>tagOf(n).includes(t));
  if(!confirm('删除标签「'+t+'」？\n\n会从 '+affected.length+' 篇笔记上移除这个标签，笔记本身不会删除。')) return;
  const now = Date.now();
  affected.forEach(n=>{ n.tags = tagOf(n).filter(x=>x!==t); n.updatedAt = now; });
  S.tagLibrary = (S.tagLibrary||[]).filter(x=>x!==t);
  if(S.tagClosed) delete S.tagClosed[t];
  renderAll(); save();
  toast('已删除标签「'+t+'」，'+affected.length+' 篇笔记已更新');
}

/* ---------- 笔记本树：支持把笔记本收进另一个笔记本（二级 / 更深） ---------- */
function nbLive(){ return S.notebooks.filter(x=>!x.deleted); }
function nbById(id){ return S.notebooks.find(x=>x.id===id && !x.deleted); }
function nbKids(pid){
  const want = pid || null;
  return nbLive().filter(x=>(x.parentId||null) === want)
    .sort((a,b)=> (a.order||0)-(b.order||0) || (a.updatedAt||0)-(b.updatedAt||0));
}
function nbDescIds(id, out){
  out = out || [];
  nbKids(id).forEach(k=>{
    if(out.indexOf(k.id) < 0){ out.push(k.id); nbDescIds(k.id, out); }
  });
  return out;
}
function nbFlat(){                       // 按树顺序铺平，菜单里用缩进表示层级
  const out = [];
  (function walk(pid, lv){
    if(lv > 8) return;
    nbKids(pid).forEach(nb=>{ out.push({ nb, lv }); walk(nb.id, lv + 1); });
  })(null, 0);
  return out;
}
function nbNoteCount(id){                // 含子笔记本的笔记总数
  let c = S.notes.filter(n=>n.notebookId===id && !n.trashed).length;
  nbDescIds(id).forEach(k=>{ c += S.notes.filter(n=>n.notebookId===k && !n.trashed).length; });
  return c;
}
function nbOpenChain(id){                // 把祖先依次展开，移完能立刻看见
  let cur = id ? nbById(id) : null, guard = 0;
  while(cur && guard++ < 10){
    if(cur.open === false) cur.open = true;
    cur = cur.parentId ? nbById(cur.parentId) : null;
  }
}
function nbSetParent(id, parentId){
  const nb = S.notebooks.find(x=>x.id===id); if(!nb) return false;
  const target = parentId || null;
  if(target === (nb.parentId||null)) return false;
  if(target && (target === id || nbDescIds(id).includes(target))){ toast('不能放进它自己的子笔记本里'); return false; }
  const sibs = nbKids(target);
  nb.parentId = target;
  nb.order = sibs.length ? Math.max(...sibs.map(s=>s.order||0)) + 1 : 0;
  nb.updatedAt = Date.now();
  if(target) nbOpenChain(target);
  renderAll(); save();
  const p = target ? nbById(target) : null;
  toast(p ? '已收进「' + p.name + '」' : '已移到顶层');
  return true;
}
function nbReorder(id, dir){
  const nb = S.notebooks.find(x=>x.id===id); if(!nb) return;
  const sibs = nbKids(nb.parentId || null);
  const i = sibs.findIndex(x=>x.id===id), j = i + dir;
  if(i < 0 || j < 0 || j >= sibs.length) return;
  const arr = sibs.slice();
  arr.splice(i, 1);
  arr.splice(j, 0, nb);
  const now = Date.now();
  arr.forEach((s, k)=>{ s.order = k; s.updatedAt = now; });
  renderAll(); save();
  toast(dir < 0 ? '已上移' : '已下移');
}

/* ============ 中栏：笔记列表（侧栏只放工作区，笔记在这里列） ============ */

   原来手机上只能点某个笔记本进去，没有回全部笔记的入口。 */

/* 选中的那篇刚好在回收站里（预览过它）→ 回普通浏览时把它放掉，别让右栏顶着一篇已删的笔记 */
function dropTrashedActive(){

  if(n && n.trashed) S.active = S.tabs.map(noteById).find(x=>x && !x.trashed)?.id || null;

/* 打开「日程」：不再是整屏的独立视图，而是把中栏换成待办列表（和笔记本 / 标签同一个位置），
   点其中一条才在右边打开那篇笔记。scope='todo' 就是「中栏正在显示日程」这个状态。 */
function openTodoList(){
  S.scope = 'todo';
  S.listQuery = '';
  trashView = false;
  S.view = 'notes';
  dropTrashedActive();
  if(window.innerWidth <= 640){

    shelfCloseIfDrawer();
  } else if(document.documentElement.clientWidth <= 900 && !S.shelfOpen){

  }
  renderAll(); save();
  const rows = $('#nlRows'); if(rows) rows.scrollTop = 0;
}
function listScopeNotes(){
  const notes = liveNotes();
  const sc = S.scope || 'all';
  if(sc === 'todo'){
    // 日程列表里其实只关心「有未完成待办的那几篇」，这里给返回键 / 计数一个口径
    const ids = new Set(collectTodos().map(t=>t.noteId));
    return notes.filter(n=>ids.has(n.id));
  }
  if(sc === 'loose') return notes.filter(n=>!n.notebookId);
  if(sc.indexOf('tag:') === 0){
    const k = sc.slice(4);
    return k === NO_TAG ? notes.filter(n=>!tagOf(n).length) : notes.filter(n=>tagOf(n).includes(k));
  }
  if(sc.indexOf('nb:') === 0){
    const id = sc.slice(3);
    const ids = [id].concat(nbDescIds(id));
    return notes.filter(n=>ids.indexOf(n.notebookId) >= 0);
  }
  return notes;
}
function listScopeTitle(){
  const sc = S.scope || 'all';
  if(sc === 'todo') return '待办日程';
  if(sc === 'loose') return '未归类笔记';
  if(sc.indexOf('tag:') === 0){
    const k = sc.slice(4);
    return k === NO_TAG ? NO_TAG_LABEL : '#' + k;
  }
  if(sc.indexOf('nb:') === 0){
    const nb = nbById(sc.slice(3));
    return nb ? nb.name : '笔记本';
  }
  return '全部笔记';
}
function listWhen(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  if(d.toDateString() === now.toDateString()) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if(d.toDateString() === new Date(now.getTime() - 864e5).toDateString()) return '昨天';
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
}
function listSnippet(n){
  return String(n.body||'')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s*([-*+]|\d+\.)\s+\[[ xX]\]\s+/gm, '')   // 待办的「- [ ]」别原样露在摘要里
    .replace(/^\s*([-*+]|\d+\.)\s+/gm, '')               // 列表符号也去掉，只留文字
    .replace(/[*_`~>#|]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 90);
}
/* 删除按钮：桌面上双击才删，避免误点；触屏没有双击，保留单击 */
/* 通用「点两下才执行」：桌面双击、手机双击都走这里。
   第一次点亮按钮并提示，DEL_TAP_GAP 内再点一次才真正执行。 */
function bindDoubleTap(el, run, hint){
  if(!el) return;
  el.onclick = e=>{
    e.stopPropagation(); e.preventDefault();
    const now = Date.now();
    if(el._dtOn && now - el._dtAt < DEL_TAP_GAP){
      clearTimeout(el._dtT); el._dtOn = false; el.classList.remove('del-armed');
      run();
      return;
    }
    el._dtOn = true; el._dtAt = now;
    el.classList.add('del-armed');
    clearTimeout(el._dtT);
    el._dtT = setTimeout(()=>{ el._dtOn = false; el.classList.remove('del-armed'); }, DEL_TAP_GAP);
    if(hint && !el._hinted){ el._hinted = true; toast(hint); }
  };
}

/* 垃圾桶统一「点两下才删」：桌面双击、手机双击，避免误触。
   iOS 的 dblclick 不稳、还会连带双击缩放，所以自己数两次点击（420ms 内），
   第一次先亮红并提示，第二次才真正移入回收站。 */
const DEL_TAP_GAP = 420;
function bindDeleteButton(b, id){
  if(!b) return;
  const run = e=>{
    e.stopPropagation(); e.preventDefault();
    clearTimeout(b._dtT); b._dtOn = false; b.classList.remove('del-armed');
    toggleTrash(id);
  };
  b.onclick = e=>{
    e.stopPropagation(); e.preventDefault();
    const now = Date.now();
    if(b._dtOn && now - b._dtAt < DEL_TAP_GAP){ run(e); return; }
    b._dtOn = true; b._dtAt = now;
    b.classList.add('del-armed');
    clearTimeout(b._dtT);
    b._dtT = setTimeout(()=>{ b._dtOn = false; b.classList.remove('del-armed'); }, DEL_TAP_GAP);
    if(!b._hinted){ b._hinted = true; toast('再点一下删除'); }
  };
  b.oncontextmenu = e=>{ e.preventDefault(); e.stopPropagation(); };
}
function listRowHtml(n){
  const snip = listSnippet(n);
  return `<div class="nl-row${n.id===S.active?' on':''}" data-open="${n.id}" role="button" tabindex="0">
    ${n.pinned?'<span class="nl-pin"></span>':''}
    <span class="nl-t1"><span class="nl-t">${esc(n.title||'无标题')}</span><span class="nl-d">${listWhen(n.updatedAt)}</span></span>
    <span class="nl-s">${snip ? esc(snip) : '&nbsp;'}</span>
    <span class="nl-del" data-nldel="${n.id}" role="button" title="双击删除">${ic('trash')}</span>
    <span class="nl-more" data-nlmenu="${n.id}" role="button" title="更多">${ic('more')}</span>
  </div>`;
}
/* 正在编辑的那篇：中栏那一行的标题 / 摘要 / 时间要跟着动。
   整表重绘会在每敲一个字时闪一下，所以只改这一行；按标题排序时才延迟重排。 */
let _rowSyncT = 0;
function syncListRow(n){
  const rows = $('#nlRows');
  if(!rows || !n || !n.id) return;
  let row = null;
  try{ row = rows.querySelector('.nl-row[data-open="' + (window.CSS && CSS.escape ? CSS.escape(String(n.id)) : String(n.id)) + '"]'); }
  catch(e){ return; }
  if(!row) return;
  const t = row.querySelector('.nl-t'); if(t) t.textContent = n.title || '无标题';
  const s = row.querySelector('.nl-s');

  const d = row.querySelector('.nl-d'); if(d) d.textContent = listWhen(n.updatedAt);
  if(S.listSort === 'title'){
    clearTimeout(_rowSyncT);
    _rowSyncT = setTimeout(()=>{ try{ renderList(); }catch(e){} }, 460);

}
function openNoteRowMenu(anchor, id){

/* 顶部那颗「主目录」按钮替代了原来的视图菜单；
   媒体库 / 关系图收进 设置 → 外观 → 其他视图（见 setAppearanceHtml） */
function renderList(){
  const host = $('#noteList'); if(!host) return;
  const sc = S.scope || 'all';
  const inTodo = sc === 'todo';
  const inTags = sc === 'tags';
  // 手机上待办日程页要更干净：底部浮条只留 Home，设置齿轮在这页收起来
  document.body.classList.toggle('m-todo', !!inTodo && !trashView && S.view === 'notes');
  host.classList.toggle('nl-todo', inTodo || inTags || trashView);
  // 日历在桌面上也用中栏（我的日历 / 待办），只有窄屏才整屏铺开
  const calHere = S.view === 'calendar' && window.innerWidth > 900;
  const hide = S.view !== 'notes' && !calHere;
  host.classList.toggle('hidden', hide);
  if(hide) return;
  if(calHere){ renderCalList(); return; }
  if(trashView){ renderTrashList(); return; }
  if(inTodo){ renderTodoList(); return; }
  if(inTags){ renderTagList(); return; }
  const rows = $('#nlRows');
  const raw = String(S.listQuery||'').trim();
  const q = raw.toLowerCase();
  let notes = listScopeNotes();
  let title = listScopeTitle();
  if(q){
    notes = liveNotes().filter(n=>{
      const t = String(n.title||'').toLowerCase();
      const b = String(n.body||'').toLowerCase();
      return t.indexOf(q) >= 0 || b.indexOf(q) >= 0;
    });
    title = '搜索「' + raw + '」';
  }
  if(S.listSort === 'title'){
    // 按标题排也要置顶优先：先分组，再在「置顶组 / 普通组」内部按标题排。
    // 之前这里直接按标题重排，把 liveNotes() 做好的置顶顺序冲掉了。
    notes = notes.slice().sort((a,b)=>{
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      if(a.pinned && b.pinned) return (b.pinnedAt||0)-(a.pinnedAt||0);
      return String(a.title||'无标题').localeCompare(String(b.title||'无标题'), 'zh-CN');
    });
  }
  const tEl = $('#nlTitle'), cEl = $('#nlCount');
  if(tEl) tEl.textContent = title;
  if(cEl) cEl.textContent = String(notes.length);
  // 不在「全部笔记」时，中栏头部给一枚「‹ 全部」，手机上一点就回去
  const bkEl = $('#nlBack');
  if(bkEl){
    const offAll = !!((S.scope && S.scope !== 'all') || raw);
    bkEl.classList.toggle('show', offAll);
    // 从某个标签的笔记返回 → 回到标签列表；其它情况回「全部笔记」
    bkEl.onclick = ()=>{ if((S.scope || '').indexOf('tag:') === 0) setScope('tags'); else goAllNotes(); };
  }
  const lockedId = scopeLockedNb();
  if(lockedId){
    const lnb = nbById(lockedId);
    if(tEl) tEl.textContent = lnb ? lnb.name : '已加密的笔记本';
    if(cEl) cEl.textContent = '—';
    rows.innerHTML = `<div class="lock-mini">
        <div class="ls-ico">${ic('lock')}</div>
        <div class="lm-t">这个笔记本已加密</div>
        <div class="lm-d">输入密码后才能看到里面的笔记${(nbLockOf(lnb)||{}).hint ? ' · 提示：' + esc(nbLockOf(lnb).hint) : ''}</div>
        <button class="lm-btn" data-lock-open>输入密码</button>
        <span class="lm-forgot" data-lock-forgot>忘记密码？</span>
      </div>`;
    const lb = rows.querySelector('[data-lock-open]');
    if(lb) lb.onclick = ()=>openLockDlg('unlock', lockedId);
    const lf = rows.querySelector('[data-lock-forgot]');
    if(lf) lf.onclick = ()=>openLockDlg('reset', lockedId);
    return;
  }
  const keepTop = rows.scrollTop;
  const emptyHtml = q
    ? `<div class="nl-empty nl-empty-search">
         <div class="ne-t">没有匹配的笔记</div>
         <div class="ne-d">换个关键词，或者清空搜索看全部。</div>
         <button class="btn-ghost ne-btn" data-empty-clear>清空搜索</button>
       </div>`
    : `<div class="nl-empty nl-empty-first">
         <div class="ne-ico">${ic('compose')}</div>
         <div class="ne-t">还没有笔记</div>
         <div class="ne-d">写下的内容先存在这台设备，登录后会同步到云端。</div>
         <button class="btn-primary ne-btn" data-empty-new>新建第一篇笔记</button>
         <button class="btn-ghost ne-btn" data-empty-help>看看使用说明</button>
       </div>`;
  rows.innerHTML = notes.length ? notes.map(listRowHtml).join('') : emptyHtml;
  rows.scrollTop = keepTop;                 // 重画后别把列表滚回顶部
  rows.querySelectorAll('[data-empty-new]').forEach(b=>{
    b.onclick = ()=>newNote(S.scope && S.scope.indexOf('nb:')===0 ? S.scope.slice(3) : null);
  });
  rows.querySelectorAll('[data-empty-clear]').forEach(b=>{
    b.onclick = ()=>{ S.listQuery = ''; renderList(); };
  });
  rows.querySelectorAll('[data-empty-help]').forEach(b=>{
    b.onclick = ()=>{ try{ openHelpPanel(); }catch(e){} };
  });
  rows.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-nlmenu]')) return;
      openNote(el.dataset.open);
    };
    el.oncontextmenu = (e)=>{ e.preventDefault(); openListMenu(el, el.dataset.open); };
  });
  rows.querySelectorAll('[data-nlmenu]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openNoteRowMenu(b, b.dataset.nlmenu); };
  });
  rows.querySelectorAll('[data-nldel]').forEach(b=>bindDeleteButton(b, b.dataset.nldel));
}

/* 中栏的日程列表：和笔记列表同一个位置、同一套行距。
   点一行 → 右边打开那篇笔记并滚到那一条（jumpToTodo） */
function renderTodoList(){

  const c = todoCounts();
  const tEl = $('#nlTitle'), cEl = $('#nlCount');
  if(tEl) tEl.textContent = '待办日程';
  if(cEl) cEl.textContent = String(c.open || 0);
  // 「‹ 全部」只在电脑/平板上给：手机上去掉这颗按钮，回全部笔记走底部 Home → 笔记本栏
  const bkEl = $('#nlBack');
  if(bkEl){
    const showBack = window.innerWidth > 640;
    bkEl.classList.toggle('show', showBack);
    bkEl.onclick = showBack ? ()=>goAllNotes() : null;
  }
  const keepTop = rows.scrollTop;
  rows.innerHTML = todoShelf();

  if(window.innerWidth <= 640){

      const done = todoGroups(collectTodos()).done.length;
      if(done && !localStorage.getItem('ivy.archHint')){

      }

}

/* ---------- 中栏：标签列表 ----------
   「标签」和「全部笔记 / 日程 / 回收站」一样，点开先在中栏列出来，再点某个标签才筛笔记 */
function tagsListHtml(){

function bindTagRows(root){

function renderTagList(){

  rows.scrollTop = keepTop;

/* ---------- 中栏：回收站列表 ----------
   回收站也是「先在中栏列出来」，点一篇 → 右边只读预览，可恢复 / 彻底删除 */
function trashListHtml(){
  const list = S.notes.filter(n=>n.trashed && !n.deleted);
  if(!list.length){
    return `<div class="nl-empty nl-empty-first">
      <div class="ne-ico">${ic('trash')}</div>
      <div class="ne-t">回收站是空的</div>
      <div class="ne-d">删掉的笔记会先放在这里，可以随时恢复。</div>
    </div>`;
  }
  const rows = list.map(n=>`<div class="nl-row td-row${n.id === S.active ? ' on' : ''}" data-trashopen="${n.id}" role="button" tabindex="0">
      <span class="nl-t1"><span class="nl-t">${esc(n.title || '无标题')}</span><span class="nl-d">${listWhen(n.updatedAt)}</span></span>
      <span class="nl-s">${esc(listSnippet(n)) || '&nbsp;'}</span>
      <span class="nl-more" data-restore="${n.id}" role="button" title="恢复这篇">${ic('restore')}</span>
    </div>`).join('');
  return `<div class="nl-cap">${list.length} 篇 · 点一篇看内容，还能恢复</div>${rows}
    <button class="nl-cap-btn" data-trashclear="1">${ic('trash')}<span>清空回收站</span></button>`;
}
function bindTrashRows(root){
  root.querySelectorAll('[data-trashopen]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-restore]')) return;
      openTrashNote(el.dataset.trashopen);
    };
    el.oncontextmenu = (e)=>{ e.preventDefault(); openTrashRowMenu(el, el.dataset.trashopen); };
  });
  root.querySelectorAll('[data-restore]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); S.active = null; toggleTrash(b.dataset.restore); };
  });
  const clr = root.querySelector('[data-trashclear]');
  if(clr) clr.onclick = ()=>emptyTrash();
}
function openTrashRowMenu(anchor, id){
  popover(anchor, [
    ['恢复这篇', '', '', 'restore', ()=>{ S.active = null; toggleTrash(id); }],
    '-',
    ['彻底删除', '', 'danger', 'trash', ()=>{ purgeNote(id); }]
  ]);
}
function emptyTrash(){
  const ids = S.notes.filter(n=>n.trashed && !n.deleted).map(n=>n.id);
  if(!ids.length) return;
  if(!confirm('清空回收站？这 ' + ids.length + ' 篇笔记将被彻底删除，不可恢复。')) return;
  S.active = null;
  ids.forEach(id=>purgeNote(id, true));
  renderAll(); save(); toast('回收站已清空');
  kickSync();                      // 清空是不可逆操作：立刻把墓碑送上去，别等 800ms 节流
}
function renderTrashList(){
  const rows = $('#nlRows'); if(!rows) return;
  const list = S.notes.filter(n=>n.trashed && !n.deleted);
  const tEl = $('#nlTitle'), cEl = $('#nlCount');
  if(tEl) tEl.textContent = '回收站';
  if(cEl) cEl.textContent = String(list.length);
  const bkEl = $('#nlBack');
  if(bkEl){ bkEl.classList.add('show'); bkEl.onclick = ()=>goAllNotes(); }
  const keepTop = rows.scrollTop;
  rows.innerHTML = trashListHtml();
  rows.scrollTop = keepTop;
  bindTrashRows(rows);
}
/* 回收站里点开一篇：右边只读预览（要改就恢复回去改） */
function openTrashNote(id){
  const n = noteById(id); if(!n) return;
  S.active = id;
  S.view = 'notes';
  renderAll(); save();
  if(window.innerWidth <= 640) document.body.classList.add('m-read');
}

function renderShelf(){
  // 日程已经并进笔记侧栏，牌子就还挂着「随手笔记」（媒体库/关系图仍是自己的侧栏）
  brandName.textContent = ({media:'媒体库', graph:'关系图', calendar:'日程待办'})[S.view] || '随手笔记';
  document.body.classList.remove('view-todo');
  // 「主目录」只在别的视图里才出现：已经在笔记里就没必要摆一颗回笔记的按钮
  const hmBtns = $('#btnHome');
  if(hmBtns) hmBtns.style.display = ((S.view || 'notes') === 'notes') ? 'none' : '';

  if(S.view==='media'){ shelfBody.innerHTML = mediaShelf(); bindShelf(); return; }
  if(S.view==='graph'){ shelfBody.innerHTML = graphShelf(); bindShelf(); return; }
  // 桌面：日程待办和「标签 / 回收站」一样，左栏只留那行导航，内容画在中栏；
  // 窄屏没有中栏，仍旧把日历内容铺在抽屉里
  if(S.view==='calendar' && window.innerWidth <= 900){ shelfBody.innerHTML = calShelf(); bindShelf(); bindCalShelf(); return; }

  const inlineNotes = window.innerWidth > 640 && window.innerWidth <= 900;   // 平板竖屏：侧栏内联列笔记；手机走列表页
  const notes = liveNotes();
  const trash = S.notes.filter(n=>n.trashed);
  // 「全部笔记」这个标题也能点：只收笔记本这一块，标签和日程各占一行、不受影响
  const nClosed = !!S.notesClosed;
  let html = `<button class="side-hd has-new${nClosed ? ' closed' : ''}${((S.scope||'all')==='all' && !trashView && (S.view||'notes')==='notes') ? ' on' : ''}" data-act="scope-all"
      title="回到全部笔记">
      <span class="lb"><i class="caret" data-fold-notes aria-expanded="${nClosed ? 'false' : 'true'}"
        title="${nClosed ? '展开笔记本列表' : '收起笔记本列表'}">&#9654;</i><span class="t">全部笔记</span></span>
      <span class="n">${notes.length}</span>
      <span class="side-new" data-nbnew="1" role="button" tabindex="0" title="新建笔记本" aria-label="新建笔记本">${ic('folderPlus')}</span>
    </button>`;
  let body = '';
  // 置顶笔记单独列在书架最上面（只在小屏内联模式下需要；桌面在中栏里置顶优先）
  const pinnedNotes = notes.filter(n=>n.pinned);
  if(inlineNotes && pinnedNotes.length){
    const pOpen = S.pinOpen !== false;
    body += `<div class="nb-group pin-group">
      <div class="nb-row">
        <button class="nb-head ${pOpen?'open':''}" data-nb="__pin" title="置顶的笔记">
          <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
          <span class="pin-ico">${ic('pin')}</span>
          <span class="t">置顶</span><span class="meta">${pinnedNotes.length}</span>
        </button>
      </div>
      <div class="nb-notes pin-notes ${pOpen?'':'hidden'}">${pinnedNotes.map(noteRow).join('')}</div>
    </div>`;
  }

  const byNb = {};
  notes.filter(n=>n.notebookId).forEach(n=>{ (byNb[n.notebookId] = byNb[n.notebookId]||[]).push(n); });
  const loose = notes.filter(n=>!n.notebookId);

  const noteRow = noteItemHtml;   // 行模板提到顶层，标签筛选视图也用它

  function nbGroupHtml(nb, lv){
    const own = byNb[nb.id] || [];
    const kids = nbKids(nb.id);
    const open = nb.open !== false;
    const on = S.scope === 'nb:' + nb.id;
    const dot = /^#[\da-fA-F]{3,8}$/.test(nb.color || '') ? nb.color : '#287a52';
    const kidHtml = kids.length ? `<div class="nb-kids">${kids.map(k=>nbGroupHtml(k, lv+1)).join('')}</div>` : '';
    const noteHtml = (inlineNotes && own.length) ? `<div class="nb-notes">${own.map(noteRow).join('')}</div>` : '';
    const inner = (kidHtml || noteHtml) ? `<div class="nb-body ${open?'':'hidden'}">${kidHtml}${noteHtml}</div>` : '';
    /* 锁按钮：锁着显示闭合锁，点一下输密码；已经解锁显示开锁，点一下立即锁上；
       还没设过密码的笔记本平时不露，悬停时才出现（点一下去设密码） */
    const lkOwn = nbLockOf(nb);
    const lkShut = nbLocked(nb.id);
    const lkShow = !!(lkOwn || lkShut);
    const lkTip = lkShut ? '已加密 · 点一下输入密码解锁'
      : lkOwn ? '已解锁 · 点一下立即锁定'
      : '点一下给这个笔记本设密码';
    return `<div class="nb-group${lv?' nb-sub':''}">
      <div class="nb-row has-more${open?' open':''}">
        <button class="nb-head ${open?'open':''}${on?' on':''}" data-nb="${nb.id}" title="${esc(nb.name)}">
          <span class="nb-fold" data-nbfold="${nb.id}"><svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
          <span class="nb-dot" style="background:${dot}"></span>
          <span class="t">${esc(nb.name)}</span><span class="meta">${nbNoteCount(nb.id)}</span>
        </button>
        <button class="nb-lockbtn${lkShow?' has-lock':''}${lkShut?' shut':' open'}" data-nblock="${nb.id}"
          title="${lkTip}" aria-label="${lkTip}">${ic(lkShut ? 'lock' : (lkOwn ? 'lockOpen' : 'lock'))}</button>
        <button class="nb-more" data-nbmenu="${nb.id}" title="重命名 / 收纳 / 排序">${ic('more')}</button>
      </div>
      ${inner}
    </div>`;
  }
  body += nbKids(null).map(nb=>nbGroupHtml(nb, 0)).join('');

  if(loose.length){
    const lopen = S.looseOpen !== false;          // 未归类默认展开
    const on = S.scope === 'loose';
    body += `<div class="nb-group">
      <div class="nb-row">
        <button class="nb-head ${lopen?'open':''}${on?' on':''}" data-nb="__loose" title="未归类笔记">
          <span class="nb-fold" data-nbfold="__loose"${inlineNotes?'':' style="visibility:hidden"'}><svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
          <span class="t">未归类笔记</span><span class="meta">${loose.length}</span>
        </button>
      </div>
      ${inlineNotes ? `<div class="nb-notes ${lopen?'':'hidden'}">${loose.map(noteRow).join('')}</div>` : ''}
    </div>`;
  }

  // 平板竖屏没有中栏（641–900 时 .notelist 是隐藏的）：日程 / 标签 / 回收站这几张
  // 「二级页面」改成就地铺在侧栏里；桌面和手机都是「中栏列表 + 右边正文」
  const scNow = S.scope || 'all';
  const inlineMode = !inlineNotes ? '' : (trashView ? 'trash' : (scNow === 'todo' ? 'todo' : (scNow === 'tags' ? 'tags' : '')));
  const inlineBody = h => `<div class="sec-body sched-inline">${h}</div>`;

  // 进二级列表时，笔记本那棵树让位，免得两块挤在一起
  if(!inlineMode) html += `<div class="sec-body${nClosed ? ' hidden' : ''}">${body}</div>`;

  // 待办日程不再占一行导航：没写日期的待办挪到「日程待办」（日历）左栏，
  // 写了日期的直接落在日历格子里，底部 Dock 仍可进完整待办列表

  // 标签：点开在中栏列出所有标签
  html += tagNavHtml(notes);
  if(inlineMode === 'tags') html += inlineBody(tagsListHtml());

  // 回收站：点开在中栏列出被删的笔记
  html += `<button class="side-hd sep${trashView ? ' on' : ''}" data-act="trash"><span class="ico">${ic('trash')}</span><span class="t">回收站</span><span class="n">${trash.length}</span></button>`;
  html += `<button class="side-hd sep${S.view==='calendar' ? ' on' : ''}" data-act="calendar"><span class="ico">${ic('calendar')}</span><span class="t">日程待办</span></button>`;
  if(inlineMode === 'trash') html += inlineBody(trashListHtml());
  shelfBody.innerHTML = html;
  bindShelf();
}

function bindShelf(){
  const inlineNotes = window.innerWidth > 640 && window.innerWidth <= 900;   // 与 renderShelf 保持同一判定
  shelfBody.querySelectorAll('[data-back-notes]').forEach(b=>{
    b.onclick = ()=>{ if(typeof closeSettings === 'function') closeSettings(); switchView('notes'); };
  });
  shelfBody.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openNote(b.dataset.open));
  shelfBody.querySelectorAll('[data-move]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation(); e.preventDefault();
      openMoveMenu(b, b.dataset.move);
    };
    b.oncontextmenu = e=>{ e.preventDefault(); e.stopPropagation(); };
  });
  shelfBody.querySelectorAll('[data-pin]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation(); e.preventDefault();
      togglePin(b.dataset.pin);
    };
    b.oncontextmenu = e=>{ e.preventDefault(); e.stopPropagation(); };
  });
  shelfBody.querySelectorAll('[data-del]').forEach(b=>bindDeleteButton(b, b.dataset.del));
  shelfBody.querySelectorAll('[data-tagpill]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const k = b.dataset.tagpill;
      setScope(S.scope === 'tag:'+k ? 'all' : 'tag:'+k);
    };
    b.oncontextmenu = e=>{
      e.preventDefault(); e.stopPropagation();
      if(b.dataset.tagpill !== NO_TAG) openTagMenu(b, b.dataset.tagpill);
    };
  });
  shelfBody.querySelectorAll('[data-tagall]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); openAllTags(b); };
  });
  shelfBody.querySelectorAll('[data-nb]').forEach(b=>{
    const key = b.dataset.nb;
    if(key === '__loose'){
      if(inlineNotes){
        b.onclick = ()=>{ S.looseOpen = !(S.looseOpen !== false); save(); renderShelf(); };
      }else{
        b.onclick = ()=>setScope('loose');
      }
      return;
    }
    if(key === '__pin'){
      b.onclick = ()=>{ S.pinOpen = !(S.pinOpen !== false); save(); renderShelf(); };
      return;
    }
    const nb = S.notebooks.find(x=>x.id===key);
    if(!nb) return;
    b.onclick = (e)=>{
      if(e.target.closest('[data-nbfold]')){                 // 点小三角：只折叠 / 展开
        nb.open = !(nb.open !== false); nb.updatedAt = Date.now();
        renderShelf(); save(); return;
      }
      if(nbLocked(nb.id)){                                   // 锁着的先要密码，别直接展开
        LK_PENDING_SCOPE = 'nb:' + nb.id;
        openLockDlg('unlock', nb.id);
        return;
      }
      nb.open = true;                                        // 点名字：在中间列表里打开这个笔记本
      setScope('nb:' + nb.id);
    };
    b.oncontextmenu = e=>{ e.preventDefault(); openNotebookMenu(b, nb.id); };
  });
  shelfBody.querySelectorAll('[data-nbmenu]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); openNotebookMenu(b, b.dataset.nbmenu); };
  });
  /* 行尾的锁按钮：锁着→输密码，已解锁→立刻锁上，没设过→去设密码 */
  shelfBody.querySelectorAll('[data-nblock]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const id = b.dataset.nblock, nb = nbById(id);
      if(!nb) return;
      const shutId = lockedNbIdOf(id);           // 可能是它自己，也可能是上面那层
      if(shutId){ LK_PENDING_SCOPE = null; openLockDlg('unlock', shutId); return; }
      if(nbLockOf(nb)){ lockNow(id); return; }
      openLockDlg('set', id);
    };
  });
  /* 「全部笔记」标题行尾那颗新建笔记本：别让它冒泡到标题（否则会顺手切回全部笔记） */
  shelfBody.querySelectorAll('[data-nbnew]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); e.preventDefault(); newNotebook(); };
  });
  shelfBody.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a = b.dataset.act;
    if(a==='new-nb') newNotebook();
    if(a==='trash'){ openTrashView(); }
    if(a==='calendar'){ switchView('calendar'); }
    if(a==='goto-tags'){ openTagList(); }
    if(a==='toggle-tag-sec'){ S.tagSectionClosed = !S.tagSectionClosed; renderShelf(); save(); }
    if(a==='goto-todo'){ openTodoList(); }
    if(a==='clear-tag'){ setScope('all'); }
    if(a==='toggle-tag-pills'){ S.tagPillsClosed = !S.tagPillsClosed; renderShelf(); save(); }
    if(a==='scope-all'){
      // 已经在「全部笔记」里时，点标题本来什么都不会变（等于死点），
      // 这里就顺势当成折叠开关；窄屏还是老实回全部笔记，别打乱手机的返回路径
      const already = (S.scope||'all')==='all' && !S.listQuery && !trashView && S.view==='notes';
      if(already && window.innerWidth > 900){
        S.notesClosed = !S.notesClosed; renderShelf(); save();
      } else goAllNotes();                                   // 任何宽度：点标题 = 看全部笔记
    }
  });
  /* 小三角单独管折叠：标题本身用来切「全部笔记」，所以折叠只能落在三角上。
     桌面/窄屏都要绑，否则桌面上点三角只会冒泡到标题，看着像「按钮坏了」 */
  shelfBody.querySelectorAll('[data-fold-notes]').forEach(c=>{
    c.onclick = e=>{
      e.stopPropagation(); e.preventDefault();
      S.notesClosed = !S.notesClosed; renderShelf(); save();
    };
  });
  /* 平板竖屏（641–900）没有中栏：日程 / 标签 / 回收站列表就画在侧栏里，交互和桌面中栏那份一致 */
  const tInline = shelfBody.querySelector('.sched-inline');
  if(tInline){
    const sc = S.scope || 'all';
    const mode = trashView ? 'trash' : (sc === 'todo' ? 'todo' : (sc === 'tags' ? 'tags' : ''));
    if(mode === 'todo') bindTodoBlock(tInline, ()=>{ renderShelf(); });
    else if(mode === 'tags') bindTagRows(tInline);
    else if(mode === 'trash') bindTrashRows(tInline);
  }
  shelfBody.querySelectorAll('[data-media-cat]').forEach(b=>b.onclick=()=>{ mediaCat = b.dataset.mediaCat; renderShelf(); renderMain(); });
  shelfBody.querySelectorAll('[data-todo-filter]').forEach(b=>b.onclick=()=>{
    todoFilter = b.dataset.todoFilter; renderShelf(); renderMain();
  });
  /* ---- 日程侧栏 ---- */
  bindTodoBlock(shelfBody);
}
/* 待办列表的交互（勾选、分组折叠、铃铛、点条目跳转、日历订阅）：
   左侧栏和手机主区共用一份，别写两套 */
function bindTodoBlock(root, repaint){
  if(!root) return;
  const re = typeof repaint === 'function' ? repaint : ()=>renderShelf();
  root.querySelectorAll('[data-tsg]').forEach(b=>b.onclick=()=>{
    const k = 's' + b.dataset.tsg;
    S.todoFolded[k] = !S.todoFolded[k]; save(); re();
  });
  root.querySelectorAll('.tsi[data-tsi]').forEach(el=>{
    let t; try{ t = JSON.parse(el.dataset.tsi); }catch(e){ return; }
    const cb = el.querySelector('[data-tsi-cb]');
    if(cb){
      cb.onclick = ev=>ev.stopPropagation();
      cb.onchange = ()=>{ setTodoDone(t, cb.checked); updateTodoBadge(); re(); };
    }
    const bell = el.querySelector('[data-tsi-bell]');
    if(bell) bell.onclick = (ev)=>{
      ev.stopPropagation();
      openRemindDialog({todo:t, date:t.due || 0, repeat:t.repeat || ''});
    };
    const archBtn = el.querySelector('[data-tsi-arch]');
    if(archBtn) bindDoubleTap(archBtn, ()=>archiveTodo(t), '再点一下归档');
    el.onclick = (ev)=>{
      if(ev.target === cb) return;
      if(ev.target.closest && ev.target.closest('[data-tsi-bell],[data-tsi-arch]')) return;
      jumpToTodo(t);
      if(window.innerWidth > 640) re();      // 手机上跳走会换成笔记页，别再把待办列表重画回来
    };
  });
  root.querySelectorAll('[data-arch-restore]').forEach(b=>{
    b.onclick = ev=>{ ev.stopPropagation(); ev.preventDefault(); unarchiveTodo(b.dataset.archRestore); };
  });
  root.querySelectorAll('[data-arch]').forEach(el=>{
    el.onclick = ev=>{
      if(ev.target.closest && ev.target.closest('[data-arch-restore]')) return;
      const a = (S.todoArchived || []).find(x => x && x.k === el.dataset.arch);
      if(!a || !noteById(a.noteId)) return;
      jumpToTodo({ noteId:a.noteId, line:0, text:a.text });
    };
  });
  root.querySelectorAll('[data-icsg]').forEach(b=>b.onclick=()=>{
    S.icsFolded = !S.icsFolded; save(); re();
  });
  root.querySelectorAll('[data-icsev]').forEach(el=>{
    const ices = icsAllEvents()[+el.dataset.icsev];
    const cb = el.querySelector('[data-icscb]');
    if(cb){
      cb.onclick = ev2=>ev2.stopPropagation();
      cb.onchange = ()=>{ if(ices) setIcsDone(ices, cb.checked); };
    }
    el.onclick = (ev2)=>{
      if(ev2.target === cb) return;
      if(ices) openIcsPop(el, ices);
    };
  });
}
/* ---- 把带日期的待办拼成一份 .ics：导出文件、日历订阅共用同一份内容 ---- */
const ICS_RRULE = {
  day:'FREQ=DAILY', weekday:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
  week:'FREQ=WEEKLY', month:'FREQ=MONTHLY', year:'FREQ=YEARLY'
};
function icsPad(n){ return String(n).padStart(2, '0'); }
function icsStamp(ts){
  const d = new Date(ts);
  return d.getUTCFullYear() + icsPad(d.getUTCMonth()+1) + icsPad(d.getUTCDate()) + 'T'
    + icsPad(d.getUTCHours()) + icsPad(d.getUTCMinutes()) + icsPad(d.getUTCSeconds()) + 'Z';
}
function icsEsc(s){
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\r?\n/g, '\\n');
}
/* 内容指纹：同一件事刷新多次 UID 不变，日历里不会长出重复条目 */
function icsHash(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return ('0000000' + h.toString(16)).slice(-8);
}
/* ICS 单行不能超过 75 字节，中文一个字 3 字节，按字符折 */
function icsFold(line){
  const enc = new TextEncoder();
  if(enc.encode(line).length <= 73) return line;
  const parts = []; let cur = '', len = 0;
  for(const ch of line){
    const n = enc.encode(ch).length;

}

/* ========== 待办与提醒 ==========
   写法与 Obsidian Tasks 插件一致，日期就是普通文字：
     - [ ] 交房租 ⏰ 2026-11-15 18:00 🔁 every month
     - [ ] 体检预约 @明天 9点
     - [x] 报税 ⏰ 2026-11-07 ✅ 2026-11-08                                  */
const TODO_RE = /^(\s*)([-*+]|\d+\.)\s+\[([ xX])\]\s+(.*)$/;
/* ⏰ 显式时间（年月日 可选 时:分） */
const DUE_TIME_RE = /⏰\s*(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/;
/* @今天 / @明天 9点 / @周五下午3点 / @11月20日 / @3天后 / @2026-11-20 */
const DUE_AT_RE = /@\s*(今天|今晚|明晚|明天|后天|大后天|周末|本周末|today|tonight|tomorrow|下周[一二三四五六日天]|周[一二三四五六日天]|\d{1,2}月\d{1,2}日|\d{4}-\d{1,2}-\d{1,2}|\d{1,3}\s*天后)(?:\s*(上午|下午|晚上|中午)?\s*(\d{1,2})(?::(\d{2})|点|时)?\s*(am|pm)?)?/i;
/* 🔁 / 📅 后面跟重复规则 */
const REPEAT_RE = /(?:🔁|📅)\s*(every\s+day|every\s+weekday|every\s+week|every\s+month|every\s+year|每天|每个工作日|每周|每月|每年|工作日)/i;
const DONE_DATE_RE = /✅\s*(\d{4})-(\d{1,2})-(\d{1,2})/;
/* 待办里写的是「日期」还是「日期 + 钟点」：日历里前者当全天、后者当定时 */
function todoHasTime(raw){
  const s = String(raw || '');
  const a = s.match(DUE_TIME_RE);
  if(a) return !!a[4];
  const b = s.match(DUE_AT_RE);
  if(b) return !!(b[3] || /今晚|明晚|tonight/i.test(b[1] || ''));
  return false;
}
const TODO_REMIND_STORE = 'ivy.todo.reminded';
let todoFilter = 'open';

const WEEK_CN = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '日':0, '天':0 };
/* 把 @今天 / @周五 / @3天后 这类自然语言算成时间戳 */
function parseAtDue(text){
  const m = String(text || '').match(DUE_AT_RE);
  if(!m) return 0;
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const w = m[1];
  const wl = w.toLowerCase();
  let night = false;
  if(wl === 'tomorrow' || w === '明天') d.setDate(d.getDate() + 1);
  else if(w === '今晚' || wl === 'tonight') night = true;
  else if(w === '明晚'){ night = true; d.setDate(d.getDate() + 1); }
  else if(w === '周末' || w === '本周末'){
    // 指最近的那个周六（今天就是周六就顺延到下周的周六）
    const delta = ((6 - d.getDay() + 7) % 7) || 7;
    d.setDate(d.getDate() + delta);
  }
  else if(w === '后天') d.setDate(d.getDate() + 2);
  else if(w === '大后天') d.setDate(d.getDate() + 3);
  else if(/^下周/.test(w)){
    const target = WEEK_CN[w.slice(2)];
    const delta = ((target - d.getDay() + 7) % 7) + 7;
    d.setDate(d.getDate() + delta);
  } else if(/^周/.test(w)){
    const target = WEEK_CN[w.slice(1)];
    let delta = (target - d.getDay() + 7) % 7;
    if(delta === 0) delta = 7;              // 说「周五」但今天就是周五 → 指下周
    d.setDate(d.getDate() + delta);
  } else if(/\d+\s*天后/.test(w)){
    d.setDate(d.getDate() + parseInt(w, 10));
  } else if(/^\d{1,2}月\d{1,2}日$/.test(w)){
    const mm = w.match(/^(\d{1,2})月(\d{1,2})日$/);
    d.setMonth(+mm[1] - 1, +mm[2]);
    if(d.getTime() < now.getTime()) d.setFullYear(d.getFullYear() + 1);
  } else if(/^\d{4}-/.test(w)){
    const p = w.split('-');
    d.setFullYear(+p[0], +p[1] - 1, +p[2]);
  }
  const dt = dayRemindTime();
  let hh = night ? 20 : dt.h, mi = dt.m;
  if(m[3]){
    hh = +m[3];
    if(m[2] === '下午' || m[2] === '晚上') hh = hh < 12 ? hh + 12 : hh;
    else if(m[2] === '中午') hh = 12;
    else if(m[2] === '上午' && hh === 12) hh = 0;
    mi = m[4] ? +m[4] : 0;
  }
  if(m[5]){
    const ap = m[5].toLowerCase();
    if(ap === 'pm' && hh < 12) hh += 12;
    if(ap === 'am' && hh === 12) hh = 0;
  }
  d.setHours(hh, mi, 0, 0);
  return d.getTime();
}
function parseDue(s){
  const m = String(s || '').match(DUE_TIME_RE);
  if(m){
    const d = new Date(+m[1], +m[2]-1, +m[3], m[4] ? +m[4] : 9, m[5] ? +m[5] : 0, 0, 0);
    if(!isNaN(d.getTime())) return d.getTime();
  }
  return parseAtDue(s);
}
/* 重复规则归一化：day / weekday / week / month / year */
function parseRepeat(s){
  const m = String(s || '').match(REPEAT_RE);
  if(!m) return '';
  const k = m[1].toLowerCase().replace(/\s+/g, ' ');
  if(k === '每天' || k === 'every day') return 'day';
  if(k === '工作日' || k === '每个工作日' || k === 'every weekday') return 'weekday';
  if(k === '每周' || k === 'every week') return 'week';
  if(k === '每月' || k === 'every month') return 'month';
  if(k === '每年' || k === 'every year') return 'year';
  return '';
}
const REPEAT_LABEL = { day:'每天', weekday:'每个工作日', week:'每周', month:'每月', year:'每年' };
function parseDoneDate(s){
  const m = String(s || '').match(DONE_DATE_RE);
  if(!m) return 0;
  return new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0, 0).getTime();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dueLabel(ts){
  const d = new Date(ts), now = new Date();
  const same = (a,b)=>a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const tomorrow = new Date(now.getTime() + 86400000);
  const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if(same(d, now)) return '今天 ' + hm;
  if(same(d, tomorrow)) return '明天 ' + hm;
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + hm;
}
/* 把全库（或某一篇）的待办扫出来 */
/* ========== 待办归档 ==========
   归档 = 从列表里收起来，不动笔记正文。键用「笔记 id + 待办文字」，
   因为行号会随编辑漂移，文字相对稳定。 */
function todoKey(t){ return String(t.noteId || '') + '|' + String(t.text || '').trim(); }
function todoArchivedList(){
  if(!Array.isArray(S.todoArchived)) S.todoArchived = [];
  // 修历史数据：早先日历那套哈希函数顶掉了 todoKey，归档键全被算成同一个，
  // 于是「归档一条 → 所有待办都被当成已归档」。这里按 noteId|text 重算一遍。
  let fixed = false;
  S.todoArchived.forEach(a=>{
    if(!a) return;
    const k = todoKey(a);
    if(a.k !== k){ a.k = k; fixed = true; }
  });
  if(fixed){ S.todoArchivedAt = Date.now(); save(); }
  return S.todoArchived.slice().sort((a,b)=> (b.at||0) - (a.at||0));
}
function isTodoArchived(t){
  const k = todoKey(t);
  // 两边的键都现算：早期存下来的 a.k 可能是错的（见 todoArchivedList 里的说明）
  return (S.todoArchived || []).some(a => a && todoKey(a) === k);
}
function archiveTodo(t){
  if(!t || !t.done){ toast('只有已完成的待办才能归档'); return; }
  const k = todoKey(t);
  if(isTodoArchived(t)) return;
  if(!Array.isArray(S.todoArchived)) S.todoArchived = [];
  S.todoArchived.push({
    k,
    noteId: t.noteId || '',
    noteTitle: t.noteTitle || '',
    text: t.text || '',
    due: t.due || 0,
    doneDate: t.doneDate || 0,
    at: Date.now()
  });
  S.todoArchivedAt = Date.now();      // 版本号：同步时整块覆盖，别的设备也能看到
  save();
  paintTodoSurfaces();
  toast('已归档');
}
function unarchiveTodo(k){
  S.todoArchived = (S.todoArchived || []).filter(a => a && a.k !== k && todoKey(a) !== k);
  S.todoArchivedAt = Date.now();
  save();
  paintTodoSurfaces();
  toast('已恢复到待办');
}

function collectTodos(noteId){
  const list = [];
  (S.notes || []).forEach(n=>{
    if(n.trashed) return;
    if(noteLocked(n)) return;                 // 锁着的笔记本不参与待办汇总
    if(noteId && n.id !== noteId) return;
    const lines = String(n.body || '').split('\n');
    let inFence = false;
    lines.forEach((ln, idx)=>{
      if(/^\s*```/.test(ln)){ inFence = !inFence; return; }
      if(inFence) return;                       // 代码块里的示例不算待办
      const m = ln.match(TODO_RE);
      if(!m) return;
      const raw = m[4];
      const due = parseDue(raw);
      const text = raw
        .replace(new RegExp(DUE_TIME_RE.source, 'g'), '')
        .replace(new RegExp(DUE_AT_RE.source, 'g'), '')
        .replace(new RegExp(REPEAT_RE.source, 'gi'), '')
        .replace(new RegExp(DONE_DATE_RE.source, 'g'), '')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
      list.push({
        noteId: n.id,
        noteTitle: n.title || '无标题',
        line: idx,
        indent: m[1].length,
        done: /[xX]/.test(m[3]),
        text,
        due,
        hasTime: todoHasTime(raw),          // 写没写具体钟点：日历里决定是全天还是定时
        repeat: parseRepeat(raw),
        doneDate: parseDoneDate(raw)
      });
      // 已归档的从各处列表里隐去（归档区单独展示）
      if(list[list.length-1] && isTodoArchived(list[list.length-1])) list.pop();
    });
  });
  return list;
}
/* 按 逾期 / 今天 / 明天 / 本周每天 / 更远按月 分组 */
function todoGroups(list){
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 86400000;
  const g = { late:[], byDay:{}, byMonth:{}, none:[], done:[] };
  list.forEach(t=>{
    if(t.done) return g.done.push(t);
    if(!t.due) return g.none.push(t);
    if(t.due < Date.now()) return g.late.push(t);
    const dayIdx = Math.floor((new Date(t.due).setHours(0,0,0,0) - startToday) / DAY);
    if(dayIdx <= 6){
      const k = String(dayIdx);
      (g.byDay[k] = g.byDay[k] || []).push(t);
    } else {
      const d = new Date(t.due);
      const k = d.getFullYear() + '-' + pad2(d.getMonth()+1);
      (g.byMonth[k] = g.byMonth[k] || []).push(t);
    }
  });
  const byDue = (a,b)=> a.due - b.due;
  g.late.sort(byDue); g.none.sort((a,b)=> (a.noteId+a.line).localeCompare(b.noteId+b.line));
  g.done.sort((a,b)=> (b.doneDate||b.due) - (a.doneDate||a.due));
  Object.keys(g.byDay).forEach(k=>g.byDay[k].sort(byDue));
  Object.keys(g.byMonth).forEach(k=>g.byMonth[k].sort(byDue));
  g.startToday = startToday;
  g.open = g.late.length + g.none.length + g.done.length * 0 +
    Object.keys(g.byDay).reduce((a,k)=>a+g.byDay[k].length, 0) +
    Object.keys(g.byMonth).reduce((a,k)=>a+g.byMonth[k].length, 0);
  return g;
}
function todoCounts(){
  const g = todoGroups(collectTodos());
  const dayKeys = Object.keys(g.byDay);
  const today = (g.byDay['0'] || []).length;
  const tomorrow = (g.byDay['1'] || []).length;
  const week = dayKeys.filter(k=>+k > 1).reduce((a,k)=>a + g.byDay[k].length, 0);
  const later = Object.keys(g.byMonth).reduce((a,k)=>a + g.byMonth[k].length, 0);
  return {
    late: g.late.length, today, tomorrow, week, later,
    none: g.none.length, done: g.done.length, open: g.open
  };
}
/* 分组标题：今天 / 明天 / 后天 / 11月14日 周五 / 2026年12月 */
function dayGroupTitle(idx, baseTs){
  const d = new Date(baseTs + idx * 86400000);
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  if(idx === 0) return '今天 · ' + wd;
  if(idx === 1) return '明天 · ' + wd;
  if(idx === 2) return '后天 · ' + wd;
  return (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + wd;
}

/* 重复规则：把下一次时间算出来 */
function nextRepeat(ts, rule){
  const d = new Date(ts || Date.now());
  if(rule === 'day') d.setDate(d.getDate() + 1);
  else if(rule === 'weekday'){
    d.setDate(d.getDate() + 1);
    while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  }
  else if(rule === 'week') d.setDate(d.getDate() + 7);
  else if(rule === 'month') d.setMonth(d.getMonth() + 1);
  else if(rule === 'year') d.setFullYear(d.getFullYear() + 1);
  return d.getTime();
}
/* 正文改动后，如果这篇正开着，把块即时同步过去 */
function syncLiveAfterTodo(n){
  if(S.active === n.id && (S.mode || 'live') === 'live'){
    const blocks = parseBlocks(n.body);
    LIVE.raws = blocks.length ? blocks.map(b=>b.lines.join('\n')) : [''];
    LIVE.gaps = blocks.length ? blocks.map((b,i)=> i===0 ? 0 : Math.max(0, b.start - blocks[i-1].end)) : [0];
    paintLive();
  }
  save();
}
/* 勾选写回正文：完成时补 ✅ 日期；带 🔁 的自动生成下一次 */
function setTodoDone(t, next){
  const n = noteById(t.noteId); if(!n) return;
  const lines = String(n.body || '').split('\n');
  const ln = lines[t.line];
  if(!ln || !TODO_RE.test(ln)) return;
  if(next){
    const now = new Date();
    const stamp = `✅ ${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
    lines[t.line] = ln
      .replace(/\[[ ]\]/, '[x]')
      .replace(new RegExp(DONE_DATE_RE.source, 'g'), ' ')
      .replace(/[ \t]{2,}/g, ' ')
      .replace(/\s+$/, '') + ' ' + stamp;
    if(t.repeat){
      // 生成下一次：同一行去掉勾和完成日期，时间换成下一次
      const nextTs = nextRepeat(t.due || Date.now(), t.repeat);
      const d = new Date(nextTs);
      const dueTxt = `⏰ ${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      let tpl = lines[t.line]
        .replace(/\[[xX]\]/, '[ ]')
        .replace(new RegExp(DONE_DATE_RE.source, 'g'), ' ')
        .replace(new RegExp(DUE_TIME_RE.source, 'g'), ' ')
        .replace(new RegExp(DUE_AT_RE.source, 'g'), ' ')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/\s+$/, '');
      lines.splice(t.line + 1, 0, tpl + ' ' + dueTxt);
    }
  } else {
    lines[t.line] = ln
      .replace(/\[[xX]\]/, '[ ]')
      .replace(new RegExp(DONE_DATE_RE.source, 'g'), '')
      .replace(/[ \t]{2,}/g, ' ')
      .replace(/\s+$/, '');
  }
  n.body = lines.join('\n');

  syncLiveAfterTodo(n);
}
/* 给待办加/改提醒时间 */
/* 把一行里已有的时间标记摘干净：⏰2026-11-12 09:00 或 @今天 9点 / @今晚 20:00 都算 */
function stripDueMarks(line){
  return String(line)
    .replace(/⏰\s*\d{4}-\d{1,2}-\d{1,2}(?:[ T]\d{1,2}:\d{2})?/g, ' ')
    .replace(new RegExp(DUE_AT_RE.source, 'gi'), ' ')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/\s+$/, '');
}
function setTodoDue(t, ts, quiet, allDay){
  const n = noteById(t.noteId); if(!n) return;
  const lines = String(n.body || '').split('\n');
  const ln = lines[t.line];
  if(!ln || !TODO_RE.test(ln)) return;
  const bare = stripDueMarks(ln);
  const d = ts ? new Date(ts) : null;
  // 全天只写日期，不带钟点 —— 日历那边也就按整天显示
  const tail = d
    ? (allDay ? ` ⏰${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`
              : ` ⏰${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`)
    : '';
  lines[t.line] = bare + tail;
  n.body = lines.join('\n');
  n.updatedAt = Date.now();
  if(S.active === n.id && (S.mode || 'live') === 'live'){
    const blocks = parseBlocks(n.body);
    LIVE.raws = blocks.length ? blocks.map(b=>b.lines.join('\n')) : [''];
    LIVE.gaps = blocks.length ? blocks.map((b,i)=> i===0 ? 0 : Math.max(0, b.start - blocks[i-1].end)) : [0];
    paintLive();
  }
  save();
  if(!quiet) toast(d ? '提醒已设为 ' + (allDay ? (d.getMonth()+1) + '月' + d.getDate() + '日 全天' : dueLabel(ts)) : '已取消提醒');
}

/* 点待办 → 打开那篇笔记并滚到该条（日程视图下右侧开笔记，左侧仍是日程） */
function jumpToTodo(t){

  if(!S.tabs.includes(n.id)) S.tabs.push(n.id);

    // 手机：中栏是整页列表，点条目 = 进到笔记页；返回键回到的仍是日程列表
    S.view = 'notes';
    S.todoNote = n.id;
    renderAll();
    document.body.classList.add('m-read');
    M_READ_BACK = true;
  } else {
    S.view = 'notes';
    // 窄屏书架是满屏的，点完待办得收起书架才看得到笔记
    if(document.documentElement.clientWidth <= 900 && S.shelfOpen) S.shelfOpen = false;
    renderAll();
  }
  save();
  setTimeout(()=>{
    if((S.mode || 'live') === 'live'){
      const host = liveHost();
      if(!host) return;
      const blocks = [...host.querySelectorAll('.blk')];
      const hit = blocks.find(b=>{
        const raw = LIVE.raws[+b.dataset.i] || '';
        return raw.includes(t.text);
      }) || blocks[Math.min(blocks.length-1, t.line)];
      if(hit) hit.scrollIntoView({ block:'center', behavior: OL_TOUCH ? 'auto' : 'smooth' });
      if(hit && hit.classList) hit.classList.add('todo-flash');
      setTimeout(()=>{ if(hit) hit.classList.remove('todo-flash'); }, 1400);
    } else {
      const sc = document.getElementById('scroll');
      if(sc){
        const total = Math.max(1, String(noteById(t.noteId)?.body || '').split('\n').length);
        sc.scrollTop = Math.max(0, (t.line / total) * sc.scrollHeight - 120);
      }
    }
  }, 280);
}

/* 侧边栏筛选 */
function todoShelf(){
  const list = collectTodos();
  const g = todoGroups(list);
  const c = todoCounts();
  if(!S.todoFolded || typeof S.todoFolded !== 'object') S.todoFolded = {};

  const item = todoRowHtml;
  const group = (key, title, arr)=>{
    const rows = arr.slice();
    if(!rows.length) return '';
    const folded = !!S.todoFolded['s' + key];
    return `<div class="tsg">
      <button class="tsg-h" data-tsg="${key}"><svg class="gchev${folded?'':' open'}" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
        <span class="ttl">${title}</span><span class="n">${rows.length}</span></button>
      ${folded ? '' : `<div class="tsg-body">${rows.map(item).join('')}</div>`}
    </div>`;
  };

  let body = group('late', '已逾期', g.late);
  for(let i=0;i<7;i++){
    const k = String(i);
    body += group('d'+i, dayTitleShort(i, g.startToday), g.byDay[k] || []);
  }
  Object.keys(g.byMonth).sort().forEach(k=>{
    const [y,m] = k.split('-');
    body += group('m'+k, y + '年' + (+m) + '月', g.byMonth[k]);
  });
  body += group('none', '待办', g.none);
  // 已完成单独成组，常驻显示：不再依赖「显示今天已完成」开关，也不限今天。
  // 这里只来自笔记里的 `- [x]`，苹果日历事件走下面的 icsShelfHtml()，不会混进来。
  body += group('done', '已完成待办', g.done);
  body += archGroupHtml();
  body += icsShelfHtml();

  return `<div class="todo-shelf">
    <div class="tsh-meta">${c.open} 项待办 · 今天 ${c.today} 项 · 逾期 ${c.late} 项</div>
    <div class="tsg-list">${body || `<div class="tsh-empty">还没有待办。<br>在笔记里写「- [ ] 事项」试试。</div>`}</div>
  </div>`;
}
/* 侧边栏用的短标题：今天 · 11月10日 周二 */
function dayTitleShort(idx, baseTs){
  const d = new Date(baseTs + idx * 86400000);
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const md = (d.getMonth()+1) + '月' + d.getDate() + '日';
  if(idx === 0) return '今天 · ' + md + ' ' + wd;
  if(idx === 1) return '明天 · ' + md + ' ' + wd;
  return md + ' ' + wd;
}
