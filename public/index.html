/* ========== 图床：粘贴 / 拖入图片 → 自动上传 → 插入 Markdown 地址 ==========
   登录用户：传到本站图床（/api/media，KV 或 R2），插入完整公开地址，
             复制到别处（Typora、公众号、别的 Markdown 编辑器）都能直接显示。
   未登录：不走网络，压缩后内嵌成本机图片（data URL），刷新、关掉再开都还在。 */
function absUrl(u){
  if(!u) return u;
  return /^(https?:|data:|blob:)/i.test(u) ? u : location.origin + u;
}
function isImageFile(f){ return !!(f && f.type && f.type.indexOf('image/') === 0); }

// 大图先缩一缩再传，省流量也快；小图原样传，避免重新编码掉清晰度
async function shrinkImage(file, maxSide, quality, forceJpeg){
  const type = file.type || '';
  if(/svg|gif/i.test(type)) return file;                 // 矢量/动图不重编码
  const needBySize = file.size > 1200 * 1024;
  const objUrl = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej)=>{
      const im = new Image();
      im.onload = ()=>res(im);
      im.onerror = ()=>rej(new Error('decode'));
      im.src = objUrl;
    });
    const w = img.naturalWidth || img.width || 0;
    const h = img.naturalHeight || img.height || 0;
    if(!w || !h) return file;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    if(!forceJpeg && !needBySize && scale === 1) return file;
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    if(!ctx) return file;
    const outType = (!forceJpeg && /png/i.test(type)) ? 'image/png' : 'image/jpeg';
    if(outType === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); }  // 透明底转 JPEG 会发黑，先铺白
    ctx.drawImage(img, 0, 0, cw, ch);
    const blob = await new Promise(res=>cv.toBlob(res, outType, quality));
    if(!blob) return file;
    if(!forceJpeg && scale === 1 && blob.size >= file.size) return file;   // 压完反而更大，用原图
    return blob;
  }catch(e){
    return file;
  }finally{
    URL.revokeObjectURL(objUrl);
  }
}
function blobToDataUrl(blob){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(String(fr.result || ''));
    fr.onerror = ()=>rej(new Error('read'));
    fr.readAsDataURL(blob);
  });
}
// 上传时的浮层提示，图片大也不会「点了没反应」
function uploadPill(text){
  let el = document.getElementById('uploadPill');
  if(!el){
    el = document.createElement('div');
    el.id = 'uploadPill';
    el.className = 'upload-pill';
    document.body.appendChild(el);
  }
  el.innerHTML = ic('cloud') + '<span>' + esc(text) + '</span>';
  el.classList.add('on');
  return el;
}
function uploadPillDone(){
  const el = document.getElementById('uploadPill');
  if(el) el.classList.remove('on');
}

async function insertFiles(files, target){
  const src = target || (curMode()==='live' ? ensureLiveInput() : document.getElementById('source'));
  const list = [...(files || [])];
  if(!src || !list.length) return null;

  const online = isConnected();
  const parts = [];
  let uploaded = 0, local = 0, skipped = 0, big = false;
  list.forEach(f=>{ if(f && f.size > 300 * 1024) big = true; });
  if(list.length > 1 || big) uploadPill((online ? '正在上传到图床 ' : '正在存到本机 ') + '1/' + list.length);

  for(let i = 0; i < list.length; i++){
    const f = list[i];
    if(list.length > 1) uploadPill((online ? '正在上传到图床 ' : '正在存到本机 ') + (i + 1) + '/' + list.length);
    if(!f || !f.size){ skipped++; continue; }
    const img = isImageFile(f);
    const name = f.name || (img ? 'image.jpg' : 'file');

    if(online){
      try{
        const send = img ? await shrinkImage(f, 2200, 0.9, false) : f;
        const up = await uploadMediaFile(send, name);
        if(up && up.url){
          parts.push(mdForFile(up.name || name, absUrl(up.url), up.type || f.type));
          uploaded++;
          continue;
        }
      }catch(err){
        // 图床没通（未绑定存储、网络抖动、超大文件…）→ 图片退回本机内嵌，先别丢
        if(!img){ skipped++; toast('上传失败：' + (err.message || '网络错误')); continue; }
      }
    }

    if(img){
      try{
        const small = await shrinkImage(f, 1600, 0.82, true);   // 内嵌图强制 JPEG，控制体积
        const dataUrl = await blobToDataUrl(small);
        if(!dataUrl){ skipped++; continue; }
        parts.push(`\n![${name.replace(/[\[\]]/g, '')}](${dataUrl})\n`);
        local++;
      }catch(e){
        skipped++;
      }
    }else{
      skipped++;
      if(!online) toast('未登录只能插入图片，其他文件请登录后再传');
      else if(CLOUD_UPLOAD === false) toast('当前账号未开通云端文件上传，只能插入图片');
    }
  }
  uploadPillDone();
  if(!parts.length) return { uploaded, local, skipped, empty: true };

  const text = parts.join('');
  const p = typeof src.selectionStart === 'number' ? src.selectionStart : src.value.length;
  src.setRangeText(text, p, src.selectionEnd, 'end');
  src.dispatchEvent(new Event('input', {bubbles:true}));
  if(src.classList && src.classList.contains('blk-src')){
    const i = parseInt(src.dataset.i, 10) || 0;
    LIVE.raws[i] = src.value;
    syncBody();
    commitBlock(i);            // 立刻渲染，图片当场可见
  } else {
    const n = noteById(S.active);
    if(n){ n.body = src.value; n.updatedAt = Date.now(); save(); renderMeta(); }
  }
  if(S.view === 'media') renderMedia();
  return { uploaded, local, skipped, empty: false };
}

// 插完给一句人话，别让用户猜图到哪去了
function insertToast(r){
  if(!r || r.empty) return;
  if(r.uploaded && !r.local){
    toast(r.uploaded + ' 张图片已上传图床，已插入 Markdown 地址');
  }else if(r.uploaded && r.local){
    toast(r.uploaded + ' 张已上传图床，' + r.local + ' 张上传失败已存本机');
  }else if(r.local){
    toast(isConnected()
      ? r.local + ' 张图片上传失败，已先存到本机（不影响查看，稍后可再试）'
      : (CLOUD_UPLOAD === false
          ? r.local + ' 张图片已存本机（当前账号未开通云图床）'
          : r.local + ' 张图片上传失败，已先存到本机（不影响查看，稍后可再试）'));
  }
}

/* 登录后，把以前没登录时内嵌在本机的图片补传到图床，正文换成图床地址 */
let INLINE_MIGRATING = false;
async function migrateInlineImages(){
  if(INLINE_MIGRATING || !isConnected() || CLOUD_UPLOAD === false) return 0;
  const targets = (S.notes || []).filter(n=>!n.trashed && !n.deleted && /!\[[^\]]*\]\(data:image\//.test(n.body || ''));
  if(!targets.length) return 0;
  const srcEl = document.getElementById('source');
  INLINE_MIGRATING = true;
  let done = 0, i = 0, changed = false;
  try{
    for(const n of targets){
      // 正在打字的这篇先跳过，别把光标底下的内容换掉
      const typing = n.id === S.active && ((typeof LIVE !== 'undefined' && LIVE && LIVE.editing >= 0) || (srcEl && document.activeElement === srcEl));
      if(typing) continue;
      i++;
      uploadPill('正在把本机图片传到图床 ' + i + '/' + targets.length);
      let body = String(n.body || '');
      const re = /!\[([^\]]*)\]\((data:image\/[a-z0-9.+-]+;base64,[^)]+)\)/gi;
      const hits = [];
      let m;
      while((m = re.exec(body))) hits.push([m[0], m[1] || 'image', m[2]]);
      for(const [all, alt, data] of hits){
        try{
          const blob = await (await fetch(data)).blob();
          const up = await uploadMediaFile(blob, alt.slice(0, 40));
          if(up && up.url){ body = body.split(all).join('![' + alt + '](' + absUrl(up.url) + ')'); done++; }
        }catch(e){}
      }
      if(body !== n.body){ n.body = body; n.updatedAt = Date.now(); changed = true; }
    }
  }finally{
    uploadPillDone();
    INLINE_MIGRATING = false;
  }
  if(changed){
    save();
    try{ if(S.view === 'notes'){ renderMain(); renderMeta(); renderShelf(); } }catch(e){}
    if(done) toast(done + ' 张本机图片已传到图床');
  }
  return done;
}

function paintSyncPip(){
  const el = document.getElementById('syncPip');
  if(!el) return;
  const on = isConnected();
  const st = !on ? 'off'
    : (SYNC.state === 'ok' ? 'ok' : SYNC.state === 'error' ? 'error' : 'busy');
  el.className = 'sync-pip ' + st;
  el.innerHTML = ic(st === 'off' ? 'cloud' : 'cloudCheck') + '<span class="sp-dot"></span>';
  el.title = !on ? '未开启云同步 · 在「设置 → 账户 / 同步」里登录'
    : st === 'error' ? '同步失败：' + (SYNC.error || '网络错误')
    : st === 'busy' ? (SYNC.state === 'pending' ? '有改动，正在保存…' : '正在同步…')
    : (SYNC.last ? '已同步 · ' + syncStamp(SYNC.last) : '已连接，等待首次同步');
}
function updateSyncBadge(){
  paintSyncPip();
  const el = document.getElementById('metaSync');
  if(!el) return;
  el.style.display = '';
  if(isConnected()){
    const st = SYNC.state==='ok' ? 'ok' : (SYNC.state==='error' ? 'error' : 'busy');
    const label = st==='ok' ? '已云同步保存' : (st==='error' ? '云同步未保存' : '云同步中');
    el.innerHTML = `<span class="sd ${st}"></span>${label}`;
    el.title = syncTip();
  } else {
    el.innerHTML = `${ic('localSave')}已本地保存`;
    el.title = '笔记已保存到本机浏览器 · 想多设备同步可注册云同步';
  }
  // AI 面板开着时，登录状态一变就把「额度」那行改口（未登录 20 次 / 登录不限）
  if(document.getElementById('aiProvBar')) paintProvTip();
}

const REG_HINT_NEW = `<div class="reg-hint-t">第一次使用？填「用户名 + 自设密码」后点<b>注册新账号</b>，就能开出独立空间，别人看不到你的笔记。</div>
  <div class="reg-hint-s">密码是唯一的钥匙，服务端只存加密哈希，忘了找不回，请一定记好。</div>`;
const REG_HINT_ON = `<div class="reg-hint-t">已连接云端，编辑会自动保存到你的空间。</div>
  <div class="reg-hint-s">要换账号，改上面的用户名和密码后点「立即同步」即可切换。</div>`;
const REG_HINT_OFF = `<div class="reg-hint-t">暂时关闭注册，可使用本地保存功能。</div>
  <div class="reg-hint-s">如需注册云同步，请联系 <b>201965</b>。</div>`;
let REG_OPEN = true;   // 服务端是否开放注册，打开面板时异步刷新

function refreshRegState(){
  return fetch('/api/auth', { headers: { accept: 'application/json' } })
    .then(r=>r.json())
    .then(d=>{
      if(d && typeof d.regOpen === 'boolean' && d.regOpen !== REG_OPEN){
        REG_OPEN = d.regOpen;
        paintSyncPanel();
      }
    })
    .catch(()=>{});
}

function paintSyncPanel(){
  const line = $('#syncStatusLine');
  const hint = $('#regHint');
  if(hint) hint.innerHTML = isConnected() ? REG_HINT_ON : (REG_OPEN ? REG_HINT_NEW : REG_HINT_OFF);
  const reg = $('#syncRegister');
  if(reg){
    reg.disabled = !REG_OPEN;
    reg.title = REG_OPEN ? '' : '注册已关闭，如需注册请联系 201965';
  }
  if(!line) return;
  const n = S.notes.filter(x=>!x.trashed).length;
  const m = allMedia().length;
  if(SYNC.state==='ok'){
    line.innerHTML = `已登录 <b>${esc(accountLabel())}</b> · 自动同步已开启<br>上次同步 <b>${new Date(SYNC.last).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b> · 本机 ${n} 篇笔记 · ${m} 个文件`;
  } else if(SYNC.state==='busy'){
    line.innerHTML = '正在同步…';
  } else if(SYNC.state==='error'){
    line.innerHTML = `<b style="color:rgb(var(--warn))">同步失败</b> · ${esc(SYNC.error)}`;
  } else if(isConnected()){
    line.innerHTML = `已保存账号 <b>${esc(accountLabel())}</b>，点「登录并同步」开始。`;
  } else {
    line.innerHTML = '尚未登录。填好用户名和密码后点「登录并同步」，之后编辑会自动上传到云端。';
  }
  const login = $('#syncLogin'); if(login) login.textContent = isConnected() ? '立即同步' : '登录并同步';
  const out = $('#syncLogout'); if(out) out.disabled = !isConnected();
  // 没登录就没有云端账号可注销，整块收起，避免用户对着灰按钮发愣
  const aw = $('#acctWrap');
  if(aw){
    aw.hidden = !isConnected();
    if(aw.hidden){ const box = $('#acctBox'); if(box) box.hidden = true; }
  }
}

    <label class="field"><span>密码</span>

      <button class="btn-primary" id="syncLogin">登录并同步</button>

    <div class="pw-box" id="acctBox" hidden>

      <label class="field"><span>当前密码</span>
        <input id="acctKey" type="password" placeholder="确认是你本人" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>确认文字</span>
        <input id="acctConfirm" type="text" placeholder="输入 DELETE" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      <div class="sheet-row"><button class="btn-danger" id="acctDo">注销账号</button></div>
      <div class="acct-tip">注销后云端的笔记、笔记本、历史版本、分享和图片会一并删除，<b>无法恢复</b>。本机这份笔记会保留，可继续本地使用或先导出备份。</div>
    </div>
    </div>
    <div class="sheet-status" id="syncStatusLine"></div>
  </div>`;
  ov.classList.add('open'); syncPanelOpen = true;
  paintSyncPanel();
  refreshRegState();

  const readForm = ()=>({
    name: ($('#syncNameInput').value||'').trim(),
    key: ($('#syncKeyInput').value||'').trim()
  });
  const run = async (create)=>{
    const {name, key} = readForm();
    if(create && !REG_OPEN){ toast('注册已关闭，如需注册请联系 201965'); return; }
    if(!key){ toast('请先填写密码'); return; }
    if(create && !name){ toast('注册新账号需要填写用户名'); return; }
    const btn = create ? $('#syncRegister') : $('#syncLogin');
    btn.disabled = true;
    try{
      await doAuth(name, key, create);
      SYNC.state = 'busy'; paintSyncPanel(); renderDock();
      await syncNow({rerender:true});
      paintSyncPanel();
      if(SYNC.state==='ok') toast((create?'已创建账号「':'已登录「')+ (name||'默认账号') +'」');
    }catch(e){
      SYNC.state = 'off'; SYNC.error = '';
      if(/关闭注册|暂时关闭/.test(e.message||'')) REG_OPEN = false;
      toast(e.message || '登录失败');
      paintSyncPanel();
    }finally{ btn.disabled = create && !REG_OPEN; }
  };

  $('#syncClose').onclick = closeSyncPanel;
  $('#syncLogin').onclick = ()=>run(false);
  $('#syncRegister').onclick = ()=>run(true);
  $('#syncLogout').onclick = ()=>{
    SYNC.token=''; SYNC.key=''; SYNC.account=''; SYNC.state='off'; SYNC.last=0; SYNC.error='';
    syncSave(); paintSyncPanel(); renderDock(); updateSyncBadge();
    toast('已退出账号，本机数据保留');

  /* ---- 修改密码 ---- */

    const nk = ($('#pwNew').value || '').trim();
    const nk2 = ($('#pwNew2').value || '').trim();
    if(!isConnected()){ toast('请先登录再改密码'); return; }
    if(!oldK){ toast('请输入当前密码'); return; }
    if(nk.length < 4){ toast('新密码至少 4 位'); return; }
    if(nk !== nk2){ toast('两次输入的新密码不一致'); return; }
    const btn = $('#pwSave'); btn.disabled = true;
    try{
      const r = await fetch('/api/auth', {
        method:'POST', headers: authHeaders(true),
        body: JSON.stringify({ action:'passwd', key: oldK, newKey: nk })
      });

      if(!r.ok) throw new Error(d.error || '修改失败');

      $('#pwBox').hidden = true;
      const inp = $('#syncKeyInput'); if(inp) inp.value = nk;
      toast('密码已改好，其他设备下次登录用新密码');
    }catch(e){ toast(e.message || '修改失败'); }
    finally{ btn.disabled = false; }
  };
  if(!isConnected()) setTimeout(()=>{ const i=$('#syncNameInput'); if(i) i.focus(); }, 60);

  /* ---- 注销账号：删的是云端数据（/api/account），本机笔记不动 ---- */
  let acctArmed = false, acctTimer = 0, acctInfo = null;
  const resetArm = ()=>{
    acctArmed = false; clearTimeout(acctTimer);
    const b = $('#acctDo');
    if(b){ b.textContent = '注销账号'; b.classList.remove('armed'); }
  };
  const paintAcct = ()=>{
    const box = $('#acctInfo'); if(!box) return;
    if(!acctInfo){ box.textContent = '正在读取账号信息…'; return; }
    if(!acctInfo.canDelete){
      box.innerHTML = esc(acctInfo.reason || '这个账号不能自助注销');
      ['acctDo','acctKey','acctConfirm'].forEach(id=>{ const el = $('#'+id); if(el) el.disabled = true; });
      return;
    }
    ['acctDo','acctKey','acctConfirm'].forEach(id=>{ const el = $('#'+id); if(el) el.disabled = false; });
    const c = acctInfo.counts || {};
    const parts = [];
    if(c.notes) parts.push(`<b>${c.notes}</b> 篇笔记`);
    if(c.trashed) parts.push(`回收站 <b>${c.trashed}</b> 篇`);
    if(c.notebooks) parts.push(`<b>${c.notebooks}</b> 个笔记本`);
    if(c.versions) parts.push(`<b>${c.versions}</b> 条历史版本`);
    if(c.shares) parts.push(`<b>${c.shares}</b> 个公开分享`);
    box.innerHTML = `账号 <b>${esc(acctInfo.name || accountLabel())}</b> ${parts.length ? '将删除 ' + parts.join('、') : '云端暂无笔记'}`
      + `，连同上传的图片一起永久删除，<b>无法恢复</b>。本机这份笔记不受影响。`;
  };

  $('#acctToggle').onclick = async ()=>{
    const box = $('#acctBox');
    if(!box) return;
    box.hidden = !box.hidden;
    if(box.hidden) return;
    resetArm();
    if(!isConnected()){
      acctInfo = { canDelete:false, reason:'还没有登录云端账号，本机数据可直接删除，不需要注销。' };
      paintAcct();
      return;
    }
    acctInfo = null; paintAcct();
    try{ acctInfo = await apiCall('/api/account'); }
    catch(e){ acctInfo = { canDelete:false, reason: e.message || '读取账号信息失败' }; }
    paintAcct();
  };

  $('#acctDo').onclick = async ()=>{
    if(!acctInfo || !acctInfo.canDelete) return;
    const key = ($('#acctKey').value || '').trim();
    const cf = ($('#acctConfirm').value || '').trim();
    if(key.length < 4){ toast('请输入当前密码'); $('#acctKey').focus(); return; }
    if(cf.toUpperCase() !== 'DELETE'){ toast('请在确认框里输入 DELETE'); $('#acctConfirm').focus(); return; }
    const btn = $('#acctDo');
    if(!acctArmed){                     // 两段式确认，不用原生 confirm（客户端 WebView 里不一定支持）
      acctArmed = true;
      btn.textContent = '再点一次，永久删除';
      btn.classList.add('armed');
      acctTimer = setTimeout(resetArm, 8000);
      toast('删除后云端数据无法恢复，再点一次确认');
      return;
    }
    clearTimeout(acctTimer); acctArmed = false;
    btn.disabled = true; btn.textContent = '正在注销…';
    try{
      const d = await apiCall('/api/account', {
        method:'POST', body:{ action:'delete', key, confirm:'DELETE' }
      });
      // 云端已删干净：清掉本机登录态，本机笔记保留，可继续离线使用
      SYNC.token=''; SYNC.key=''; SYNC.account=''; SYNC.state='off'; SYNC.last=0; SYNC.error='';
      syncSave(); renderDock(); updateSyncBadge(); closeSyncPanel();
      const c = (d && d.counts) || {};
      toast(`账号已注销，云端 ${c.notes||0} 篇笔记已删除；本机这份还在，可继续本地使用`);
    }catch(e){
      btn.disabled = false;
      resetArm();
      toast(e.message || '注销失败');
    }
  };
  ['acctKey','acctConfirm'].forEach(id=>{
    const el = $('#'+id);
    if(el) el.oninput = ()=>{ if(acctArmed) resetArm(); };
  });
}

function paintSettings(keepScroll){

  if(!SET_TABS.some(t=>t[0] === SET_TAB)) SET_TAB = 'account';   // 旧版本停在已删掉的页时兜底

  nav.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('on', b.dataset.st === SET_TAB));

/* 右侧目录：一级 = 栏目（手风琴，当前栏目展开），二级 = 章节，三级 = 章节里的要点。
   原来那排「导入/导出、Markdown 写法…」按钮已收进这里，正文只剩文章本身。 */
function renderHelpOutline(){
  const pane = $('#setPane'), doc = $('#setHelpDoc'), ol = $('#setHelpOl');
  if(!pane || !doc || !ol) return;
  const TABS = [['io','导入 / 导出'],['acct','账户与安全'],['ai','AI 与导图'],
                ['md','Markdown 写法'],['key','快捷键'],['todo','日程怎么用']];
  const secs = Array.from(doc.querySelectorAll('.help-sec'));

  // 四个栏目始终排在目录最上面，当前栏目下面再展开它的章节
  let html = `<div class="ol-t">栏目</div>`;
  TABS.forEach(([id, name])=>{
    const on = helpTab === id;
    html += `<button type="button" class="ol-l1${on ? ' on' : ''}" data-htab2="${id}" title="${esc(name)}">`
      + `<i class="ol-caret">${on ? '▾' : '▸'}</i><span>${esc(name)}</span></button>`;
  });
  html += `<div class="ol-t">本节</div>`;
  const seenSub = new Set();
  secs.forEach((sec, si)=>{
    const h = sec.querySelector('h4');
    if(!h) return;
    const full = h.textContent.trim();
    const short = full.split('·')[0].trim() || full;          // 目录里只留短名，正文里还是完整标题
    const label = short.length > 18 ? short.slice(0, 18) + '…' : short;
    html += `<button type="button" class="ol-l2" data-hi="${si}" title="${esc(full)}">${esc(label)}</button>`;
    // 三级：本节里挑一条最短也最有指向性的 <b> 短语，全局不重复，多了反而看不清层级
    let pick = null;
    sec.querySelectorAll('.help-p').forEach((p, pi)=>{
      if(pick) return;
      const b = p.querySelector('b');
      if(!b) return;
      const t = b.textContent.trim().replace(/[，。；：、,.;:]+$/, '');
      if(!t || t.length < 4 || t.length > 10 || seenSub.has(t)) return;
      pick = [pi, t];
    });
    if(pick){
      seenSub.add(pick[1]);
      html += `<button type="button" class="ol-l3" data-hj="${si}:${pick[0]}" title="${esc(pick[1])}">${esc(pick[1])}</button>`;
    }
  });
  ol.innerHTML = html;
  ol.style.display = '';

  const toTop = (el, pad)=>{
    const top = pane.scrollTop + (el.getBoundingClientRect().top - pane.getBoundingClientRect().top) - pad;
    pane.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  };
  ol.querySelectorAll('[data-htab2]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.htab2;
      if(helpTab === id) return;
      helpTab = id;
      paintSettings(true);
      pane.scrollTop = 0;
      renderHelpOutline();
    };
  });
  ol.querySelectorAll('.ol-l2').forEach(b=>{
    b.onclick = ()=>{ const h = secs[+b.dataset.hi]?.querySelector('h4'); if(h) toTop(h, 14); };
  });
  ol.querySelectorAll('.ol-l3').forEach(b=>{
    b.onclick = ()=>{
      const [si, pi] = b.dataset.hj.split(':').map(Number);
      const p = secs[si]?.querySelectorAll('.help-p')[pi];
      if(p) toTop(p, 14);
    };
  });

  const l2btns = Array.from(ol.querySelectorAll('.ol-l2'));
  const mark = ()=>{
    if(!l2btns.length){ l2btns.forEach(b=>b.classList.remove('on')); return; }
    const base = pane.getBoundingClientRect().top + 46;
    let cur = 0;
    secs.forEach((sec, i)=>{
      const h = sec.querySelector('h4');
      if(h && h.getBoundingClientRect().top <= base) cur = i;
    });
    l2btns.forEach(b=>b.classList.toggle('on', +b.dataset.hi === cur));
  };
  pane.onscroll = mark;
  mark();
}

/* 只删这台设备上的笔记数据：IDB 主存 + localStorage 镜像 + 历史版本 */
async function wipeLocalNotes(){
  try{
    const db = await idb();
    await new Promise(res=>{
      try{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').delete('state');
        tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); tx.onabort = ()=>res();
      }catch(e){ res(); }
    });
  }catch(e){}
  [LS_KEY, VER_KEY].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
}
async function doLogout(keepLocal){
  if(LO_BUSY) return;
  LO_BUSY = true;
  const go = $('#loGo');
  if(go){ go.disabled = true; go.textContent = keepLocal ? '正在退出…' : '正在清空…'; }
  SYNC.token = ''; SYNC.key = ''; SYNC.account = ''; SYNC.state = 'off'; SYNC.last = 0; SYNC.error = '';
  syncSave();
  if(!keepLocal){
    LOGOUT_WIPING = true;             // 清空后别再被迟到的 save() 写回去
    await wipeLocalNotes();
    closeLogoutSheet(); closeSettings();
    toast('已退出，本机笔记已清空');
    setTimeout(()=>location.reload(), 650);
    return;
  }
  closeLogoutSheet(); closeSettings();
  renderDock(); updateSyncBadge();
  toast('已退出账号，本机笔记保留');
  LO_BUSY = false;
}

/* ---- 清理本地笔记：三次确认，第一步先问要不要下载备份 ---- */
let WIPE_STEP = 0, WIPE_BUSY = false;
function closeWipeSheet(){
  const ov = $('#wipeOv');
  if(ov) ov.classList.remove('open');
}
function openWipeSheet(){
  let ov = $('#wipeOv');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'wipeOv'; ov.className = 'lo-ov';
    ov.addEventListener('mousedown', e => { if(e.target === ov) closeWipeSheet(); });
    document.body.appendChild(ov);
  }
  WIPE_STEP = 1; WIPE_BUSY = false;
  paintWipeSheet();
  ov.classList.add('open');
}
function paintWipeSheet(){
  const ov = $('#wipeOv'); if(!ov) return;
  const live = (S.notes || []).filter(x => !x.trashed && !x.deleted).length;
  const nb = (S.notebooks || []).filter(x => !x.deleted).length;
  const logged = !!SYNC.token;
  const step = WIPE_STEP;
  const title = step === 1 ? '清空本机数据' : (step === 2 ? '再确认一次' : '最后确认');
  const lead = step === 1
    ? `<p class="lo-lead">将删除这台设备上的<b>全部数据</b>：<b>${nb}</b> 个笔记本 · <b>${live}</b> 篇笔记，回收站和历史版本一起清掉，<b>无法恢复</b>。${
        logged ? '云端和其它设备不受影响，清空后会重新从云端拉下来。'
               : '你没登录，本机就是唯一一份，删掉就真没了。'}</p>
       <p class="lo-lead">删之前要不要先<b>下载一份备份</b>？备份是一个 .json 文件，以后能原样导入回来。</p>`
    : step === 2
    ? `<p class="lo-lead">第二步：确认删除这台设备上的<b>全部笔记本（${nb} 个）和全部笔记（${live} 篇）</b>。删完没有回收站，<b>无法恢复</b>。</p>`
    : `<p class="lo-lead">第三步：点「清空并重启」立刻执行，不再询问，<b>无法恢复</b>。</p>`;
  const foot = step === 1
    ? `<button class="btn-ghost" id="wipeCancel">取消</button>
       <div class="lo-acts">
         <button class="btn-ghost" id="wipeBackup">先下载备份</button>
         <button class="btn-danger" id="wipeNext">继续</button>
       </div>`
    : step === 2
    ? `<button class="btn-ghost" id="wipeBack">返回</button>
       <div class="lo-acts">
         <button class="btn-ghost" id="wipeCancel">取消</button>
         <button class="btn-danger" id="wipeNext">仍要删除</button>
       </div>`
    : `<button class="btn-ghost" id="wipeBack">返回</button>
       <div class="lo-acts">
         <button class="btn-ghost" id="wipeCancel">取消</button>
         <button class="btn-danger armed" id="wipeGo">清空并重启</button>
       </div>`;
  ov.innerHTML = `<div class="lo-card" role="dialog" aria-label="清理本地笔记">
      <div class="lo-hd"><h3>${title}</h3>
        <button class="info-x" id="wipeX" title="关闭">${ic('x')}</button></div>
      <div class="lo-body">
        ${lead}
        ${step >= 2 ? `<div class="lo-warn on">第 ${step} / 3 步 · 这是一次不可撤销的删除</div>` : ''}
      </div>
      <div class="lo-foot">${foot}</div>
    </div>`;
  const q = id => ov.querySelector('#' + id);
  const on = (id, fn) => { const b = q(id); if(b) b.onclick = fn; };
  on('wipeX', closeWipeSheet);
  on('wipeCancel', closeWipeSheet);
  on('wipeBackup', () => { exportBackup(); toast('备份开始下载，确认后再点「继续」'); });
  on('wipeBack', () => { WIPE_STEP = Math.max(1, WIPE_STEP - 1); paintWipeSheet(); });
  on('wipeNext', () => { WIPE_STEP = Math.min(3, WIPE_STEP + 1); paintWipeSheet(); });
  on('wipeGo', async () => {
    if(WIPE_BUSY) return;
    WIPE_BUSY = true;
    const go = q('wipeGo');
    if(go){ go.disabled = true; go.textContent = '正在清空…'; }
    LOGOUT_WIPING = true;             // 清完别被迟到的 save() 写回去
    await wipeLocalNotes();
    closeWipeSheet();
    toast('本机数据已清空');
    setTimeout(() => location.reload(), 700);
  });
}

/* 把本机存储的真实状态摆在设置里：到底是 IDB 在存、存了多少、镜像有没有写满 */
async function paintStoreInfo(){
  const el = $('#setStoreInfo'); if(!el) return;
  try{
    const st = await idbGet('state');
    const notes = (st && Array.isArray(st.notes)) ? st.notes.length : (S.notes || []).length;
    let bytes = 0;
    try{ bytes = new Blob([JSON.stringify(st || {})]).size; }
    catch(e){ bytes = JSON.stringify(st || {}).length; }
    let quota = '';
    try{
      if(navigator.storage && navigator.storage.estimate){
        const est = await navigator.storage.estimate();
        quota = ' · 浏览器已用 ' + fmtSize(est.usage || 0) + ' / 配额 ' + fmtSize(est.quota || 0);
      }
    }catch(e){}
    let mirror = '正常';
    try{
      localStorage.setItem('__ivy_mirror_probe__', '1');
      localStorage.removeItem('__ivy_mirror_probe__');
    }catch(e){ mirror = '写满或被禁用（不影响笔记：IndexedDB 才是主存储）'; }
    el.innerHTML = 'IndexedDB · 已存 ' + notes + ' 篇 · 约 ' + fmtSize(bytes) + quota
      + '<br>localStorage 镜像：' + mirror;
  }catch(e){
    el.textContent = '读取失败：' + ((e && e.message) || '未知错误');
  }
}

/* ---- 交互绑定 ---- */
function bindPane(tab){
  const pane = $('#setPane'); if(!pane) return;
  if(tab === 'account'){
    const login = $('#setLogin');
    if(login){
      const run = async (create)=>{
        const name = ($('#setName').value || '').trim();
        const key = ($('#setKey').value || '').trim();
        if(create && !REG_OPEN){ toast('注册已关闭，如需注册请联系 201965'); return; }
        if(!key){ toast('请先填写密码'); return; }
        if(create && !name){ toast('注册新账号需要填写用户名'); return; }
        login.disabled = true;
        try{
          await doAuth(name, key, create);
          SYNC.state = 'busy';
          await syncNow({ rerender:true });
          paintSettings();
          if(SYNC.state === 'ok') toast((create ? '已创建账号「' : '已登录「') + (name || '默认账号') + '」');
        }catch(e){
          SYNC.state = 'off';
          if(/关闭注册|暂时关闭/.test(e.message || '')) REG_OPEN = false;
          toast(e.message || '登录失败');
        }finally{ login.disabled = false; }
      };
      login.onclick = ()=>run(false);
      const reg = $('#setReg');
      if(reg) reg.onclick = ()=>run(true);
      const key = $('#setKey');
      if(key) key.onkeydown = e=>{ if(e.key === 'Enter') login.click(); };
    }
    const now = $('#setSyncNow') || $('#setSyncNow2');
    if(now) now.onclick = async ()=>{
      if(!SYNC.token){ SET_TAB = 'account'; paintSettings(); return; }
      try{ await syncNow({ rerender:true }); toast('已同步'); paintSettings(); }
      catch(e){ toast('同步失败：' + (e.message || '网络错误')); }
    };
    const out = $('#setLogout');
    if(out) out.onclick = ()=>openLogoutSheet();
    const pw = $('#setPw');
    if(pw) pw.onclick = ()=>{ closeSettings(); openSyncPanel(); setTimeout(()=>{ const b = $('#pwToggle'); if(b) b.click(); }, 80); };
    const del = $('#setDel');
    if(del) del.onclick = ()=>{ closeSettings(); openSyncPanel(); setTimeout(()=>{ const b = $('#acctToggle'); if(b) b.click(); }, 80); };
  }

  if(tab === 'appearance'){
    pane.querySelectorAll('[data-theme]').forEach(b=>{
      b.onclick = ()=>{ setThemeMode(b.dataset.theme); paintSettings(); };
    });
    const fsInput = pane.querySelector('#setFontSize');
    if(fsInput){
      const sync = (commit)=>{
        const v = Math.min(22, Math.max(14, Math.round(+fsInput.value || 16)));
        S.fontSize = v;
        fsInput.style.setProperty('--p', Math.round((v - 14) / 8 * 100) + '%');
        fsInput.setAttribute('aria-valuenow', v);
        const lab = pane.querySelector('#setFsVal'); if(lab) lab.textContent = v + 'px';
        applyDocFont();
        if(commit) save();
      };
      fsInput.oninput = ()=>sync(false);
      fsInput.onchange = ()=>sync(true);
    }
    // 顶部留白：px，直接量；底部留空：vh，跟着窗口高度走
    const padTInput = pane.querySelector('#setPadTop');
    if(padTInput){
      const syncPad = (commit)=>{
        S.padTop = Math.min(240, Math.max(0, Math.round(+padTInput.value || 0)));
        padTInput.style.setProperty('--p', Math.round(S.padTop / 200 * 100) + '%');
        padTInput.setAttribute('aria-valuenow', S.padTop);
        const lab = pane.querySelector('#setPadTVal'); if(lab) lab.textContent = S.padTop + 'px';
        applyDocPad();
        if(commit) save();
      };
      padTInput.oninput = ()=>syncPad(false);
      padTInput.onchange = ()=>syncPad(true);
    }
    const padBInput = pane.querySelector('#setPadB');
    if(padBInput){
      const syncPad = (commit)=>{
        S.padBottom = Math.min(90, Math.max(0, Math.round(+padBInput.value || 0)));
        padBInput.style.setProperty('--p', Math.round(S.padBottom / 80 * 100) + '%');
        padBInput.setAttribute('aria-valuenow', S.padBottom);
        const lab = pane.querySelector('#setPadBVal'); if(lab) lab.textContent = S.padBottom + '%';
        applyDocPad();
        if(commit) save();
      };
      padBInput.oninput = ()=>syncPad(false);
      padBInput.onchange = ()=>syncPad(true);
    }
    pane.querySelectorAll('[data-mode]').forEach(b=>{
      b.onclick = ()=>{ setMode(b.dataset.mode); paintSettings(); };
    });
  }

  if(tab === 'remind'){
    // 内容和「提醒与日历」弹窗是同一套，控件直接绑在这一页上
    const repaint = ()=>paintSettings(true);
    remindRepaintHook = repaint;
    bindRemindBody(pane, repaint);
    bindNpfBody(pane, repaint);
    if(!setRemindReady){
      setRemindReady = true;
      icsPullSources();     // 别的设备加的订阅源，这里也能看到
      icsPullDone();
      if(isConnected()){
        feedRefresh().then(()=>{ if(SET_TAB === 'remind') paintSettings(true); });
        npfApi().then(()=>{ if(SET_TAB === 'remind') paintSettings(true); });
      }
    }
  }

  if(tab === 'mcp'){
    const c = $('#tokCreate'); if(c) c.onclick = createToken;
    loadTokens();
  }

  if(tab === 'sync'){
    const b = $('#setExpBackup'); if(b) b.onclick = ()=>exportBackup();
    const c = $('#setExpMd'); if(c) c.onclick = ()=>exportAllMd();
    const i = $('#setImportBtn'); if(i) i.onclick = ()=>importDoc();
    const k = $('#setImportBackup'); if(k) k.onclick = ()=>importDoc(true);
  }

  if(tab === 'share'){
    pane.querySelectorAll('[data-unshare]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('取消分享后，这个链接立刻失效，确定吗？')) return;
        await unshareById(b.dataset.unshare);
      };
    });

let TOK_BUSY = false;
async function tokFetch(method, body, id){
  const url = '/api/tokens' + (id ? '?id=' + encodeURIComponent(id) : '');
  let r = await fetch(url, { method, headers: authHeaders(true), body: body ? JSON.stringify(body) : undefined });
  let d = await r.json().catch(()=>({}));
  if(r.status === 401 && SYNC.token && SYNC.key){
    if(await relogin()){
      r = await fetch(url, { method, headers: authHeaders(true), body: body ? JSON.stringify(body) : undefined });
      d = await r.json().catch(()=>({}));
    }
  }
  if(!r.ok){ const e = new Error(d.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return d;
}
function tokCopyText(btn, text, done){
  if(!btn) return;
  btn.onclick = async ()=>{
    let ok = true;
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      ok = false;
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta); ta.select();
      try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
      ta.remove();
    }
    if(!ok){ toast('复制失败，请手动选中'); return; }
    const old = btn.textContent;
    btn.textContent = done || '已复制';
    setTimeout(()=>{ btn.textContent = old; }, 1500);
  };
}

/* ========== AI：每个账号自己的接口 ========== */
/* 站点不内置任何 key。用户在「AI 接口设置」里填自己的 OpenAI 兼容接口，
   密钥由服务端加密后存进账号，前端只拿得到掩码（见 functions/api/ai-config.js）。*/
const AI = { cfg:null, mode:'rewrite', ctx:null, text:'', task:'', chat:[], ref:true, busy:false, abort:null, last:'',
  sites:null, provider:'', limits:null };

async function aiConfig(force){
  if(AI.cfg && !force) return AI.cfg;
  if(!isConnected()) throw new Error('登录后才能用 AI');
  const r = await fetch('/api/ai-config', { headers: authHeaders(false) });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  AI.cfg = d;
  return d;
}

/* 读纯文本流：服务端把上游 SSE 转成了裸文字，这里只需要拼接 */
async function aiStream(payload, onText){
  AI.abort = new AbortController();
  const r = await fetch('/api/ai', {
    method:'POST', headers: authHeaders(true),
    body: JSON.stringify(Object.assign({ provider: AI.provider || undefined }, payload)),
    signal: AI.abort.signal
  });
  const ctype = String(r.headers.get('content-type') || '');
  if(!r.ok || ctype.indexOf('application/json') >= 0){
    const d = await r.json().catch(()=>({}));
    const e = new Error(d.error || ('HTTP ' + r.status));
    e.code = d.code;
    throw e;
  }
  if(!r.body) throw new Error('这个浏览器不支持流式读取');
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let all = '';
  for(;;){
    const { value, done } = await reader.read();
    if(done) break;
    all += dec.decode(value, { stream:true });
    if(onText) onText(all);
  }
  return all;
}

async function aiBoot(){

  if(!AI.sites){

      AI.sites = Array.isArray(d.providers) ? d.providers : [];
      AI.limits = d.limits || null;
    }catch(e){ AI.sites = []; }
  }
  if(!AI.provider){
    let saved = '';
    try{ saved = localStorage.getItem('ivy.ai.provider') || ''; }catch(e){}
    AI.provider = (AI.sites.some(s=>s.id===saved) ? saved : '')
      || (AI.sites[0] && AI.sites[0].id) || 'custom';
  }
  if(AI.provider !== 'custom' && !AI.sites.some(s=>s.id===AI.provider)){
    AI.provider = (AI.sites[0] && AI.sites[0].id) || 'custom';
  }
  paintProvBar();

  if(AI.provider === 'custom'){
    if(!isConnected()){
      body.innerHTML = `<div class="ai-empty"><b>用自己的接口要先登录。</b><br>
        登录后在「AI 接口设置」里填服务地址、密钥和模型；密钥加密存在账号里，页面读不回原值。<br>

  const chips = [['polish','润色'],['shorten','精简'],['expand','扩写'],['fix','纠错'],

  foot.innerHTML = `<button class="btn-primary" id="aiApply" disabled>${isFmt?'替换全文':'替换原文'}</button>
    <button class="btn-ghost" id="aiCopy">复制</button>
    <button class="btn-ghost" id="aiRetry" disabled>重试</button>
    <span class="ai-hint" id="aiHint"></span>`;

  body.querySelectorAll('[data-ai-task]').forEach(b=>{
    b.onclick = ()=>{
      body.querySelectorAll('[data-ai-task]').forEach(x=>x.classList.toggle('on', x === b));
      runAiTask(b.dataset.aiTask);
    };
  });
  $('#aiApply').onclick = applyAiResult;
  $('#aiRetry').onclick = ()=>runAiTask(AI.task || (isFmt ? 'format' : 'polish'));
  $('#aiCopy').onclick = ()=>{
    const v = ($('#aiRes') || {}).value || '';
    if(!v.trim()){ toast('还没有结果'); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject())
      .then(()=>toast('已复制')).catch(()=>toast('复制失败，手动选一下'));
  };
  if(isFmt) runAiTask('format');
}

async function runAiTask(task){
  if(AI.busy) return;
  const res = $('#aiRes'), hint = $('#aiHint'), apply = $('#aiApply'), retry = $('#aiRetry');
  if(!res) return;
  if(!AI.text.trim()){ toast('没有可处理的内容'); return; }
  AI.task = task;
  AI.busy = true;
  AI.last = '';
  res.value = '';
  res.readOnly = true;
  if(apply) apply.disabled = true;
  if(hint){ hint.className = 'ai-hint'; hint.textContent = '正在生成…'; }
  try{
    const text = await aiStream({ task, text: AI.text }, (all)=>{
      AI.last = all;
      res.value = all;
      res.scrollTop = res.scrollHeight;
    });
    AI.last = text;
    if(!text.trim()){
      if(hint){ hint.className = 'ai-hint err'; hint.textContent = '模型没有返回内容'; }
    }else{
      if(hint){ hint.className = 'ai-hint'; hint.textContent = ''; }
      if(apply) apply.disabled = false;
      if(retry) retry.disabled = false;
    }
  }catch(e){
    if(e.name === 'AbortError'){
      if(hint){ hint.className = 'ai-hint'; hint.textContent = '已停止'; }
    }else{
      if(hint){ hint.className = 'ai-hint err'; hint.textContent = e.message || '生成失败'; }
      if(e.code === 'ai-config-missing') AI.cfg = null;
      if(e.code === 'login'){ closeAI(); openSyncPanel(); return; }
    }
    if(AI.last){ if(apply) apply.disabled = false; if(retry) retry.disabled = false; }
  }finally{
    AI.busy = false;
    res.readOnly = false;
    AI.abort = null;
  }
}

function applyAiResult(){
  const text = (($('#aiRes') || {}).value || '').trim();
  if(!text) return;
  if(AI.mode === 'format'){
    if(!aiReplaceBody(text)){ toast('没有打开的笔记'); return; }
    closeAI();
    toast('已替换整篇笔记');
    return;
  }
  if(!aiReplaceSelection(text, AI.ctx)){ toast('定位不到刚才选中的文字，请重新选中再试'); return; }
  closeAI();
  toast('已替换选中的文字');
}

/* ---------- 把结果写回笔记 ---------- */
function aiReplaceSelection(text, ctx){
  const n = noteById(S.active);
  if(!n) return false;
  // 1) 源码框 / 块输入框还在：直接按原区间替换
  if(ctx && ctx.kind === 'ta' && ctx.ta && ctx.ta.isConnected){
    const ta = ctx.ta;
    ta.focus();
    try{ ta.setSelectionRange(ctx.s, ctx.e); }catch(e){}
    ta.setRangeText(text, ctx.s, ctx.e, 'end');
    ta.dispatchEvent(new Event('input', { bubbles:true }));
    if(ta.classList && ta.classList.contains('blk-src')){
      const blk = ta.closest('.blk');
      commitBlock(blk ? (parseInt(blk.dataset.i, 10) || 0) : 0);
    }else{
      n.body = ta.value; n.updatedAt = Date.now();
      renderMeta(); renderOutline(); save();
    }
    return true;
  }
  // 2) 渲染区选区：映射回源码区间
  if(ctx && ctx.kind === 'dom' && ctx.host && ctx.host.isConnected){
    const blk = ctx.host.classList.contains('blk-view') ? ctx.host.closest('.blk') : null;
    if(blk){
      const i = +blk.dataset.i;
      const raw = LIVE.raws[i] || '';
      const rg = mapSelToRaw(raw, ctx.text);
      if(rg){
        LIVE.raws[i] = raw.slice(0, rg.start) + text + raw.slice(rg.end);
        paintLive(); syncBody();
        return true;
      }
      return false;
    }
    const rg = mapSelToRaw(n.body || '', ctx.text);
    if(rg){
      n.body = (n.body || '').slice(0, rg.start) + text + (n.body || '').slice(rg.end);
      n.updatedAt = Date.now();
      const src = document.getElementById('source');
      if(src) src.value = n.body;
      syncLiveAfterTodo(n);
      renderProse(); renderOutline(); renderMeta();
      return true;
    }
    return false;
  }
  // 3) 兜底：按原文在当前正文里找一次
  if(ctx && ctx.text){
    const raw = n.body || '';
    const rg = mapSelToRaw(raw, ctx.text);
    if(rg){
      n.body = raw.slice(0, rg.start) + text + raw.slice(rg.end);
      n.updatedAt = Date.now();
      const src = document.getElementById('source');
      if(src) src.value = n.body;
      syncLiveAfterTodo(n);
      renderProse(); renderOutline(); renderMeta();
      return true;
    }
  }
  return false;
}

function aiReplaceBody(text){
  const n = noteById(S.active);
  if(!n) return false;
  const clean = String(text).replace(/\r\n/g, '\n').replace(/^```(?:markdown|md)?\s*\n/i, '').replace(/\n```\s*$/, '')
    .replace(/\n{4,}/g, '\n\n\n').replace(/\s+$/, '');
  n.body = clean;
  n.updatedAt = Date.now();
  const src = document.getElementById('source');
  if(src) src.value = clean;
  syncLiveAfterTodo(n);
  renderProse(); renderOutline(); renderMeta();
  save();
  return true;
}

/* 插入到光标处；没有焦点就接到正文末尾 */
function aiInsertText(text){
  if(!text) return false;
  const ae = document.activeElement;
  const ta = (ae && ae.tagName === 'TEXTAREA'
    && (ae.id === 'source' || (ae.classList && ae.classList.contains('blk-src'))))
    ? ae : (LIVE.ta && LIVE.ta.isConnected ? LIVE.ta : null);
  if(ta){
    const s = typeof ta.selectionStart === 'number' ? ta.selectionStart : ta.value.length;
    const e = typeof ta.selectionEnd === 'number' ? ta.selectionEnd : s;
    ta.focus();
    ta.setRangeText(text, s, e, 'end');
    ta.dispatchEvent(new Event('input', { bubbles:true }));
    if(ta.classList && ta.classList.contains('blk-src')){
      const blk = ta.closest('.blk');
      commitBlock(blk ? (parseInt(blk.dataset.i, 10) || 0) : 0);
    }
    return true;
  }
  const n = noteById(S.active);
  if(!n) return false;
  n.body = (n.body ? String(n.body).replace(/\s+$/, '') + '\n\n' : '') + text;
  n.updatedAt = Date.now();
  const src = document.getElementById('source');
  if(src) src.value = n.body;
  syncLiveAfterTodo(n);
  renderProse(); renderOutline(); renderMeta();
  save();
  return true;
}

/* ---------- 对话 ---------- */
function paintAiChat(){
  const body = $('#aiBody'), foot = $('#aiFoot');
  if(!body) return;
  body.innerHTML = `<div class="ai-msgs" id="aiMsgs"></div>`;
  const msgs = $('#aiMsgs');
  if(!AI.chat.length){
    msgs.innerHTML = `<div class="ai-empty" id="aiEmpty"><b>和 AI 聊几句。</b><br>
      例如：把这段改得更简洁 / 给这篇文章起五个标题 / 把今天的记录整理成周报 / 解释这个报错。<br>
      勾上「参考当前笔记」，它会读这篇笔记的正文来回答。</div>`;
  }else{
    AI.chat.forEach(m=>aiAddMsg(m.role, m.content));
  }
  foot.innerHTML = `
    <label class="ai-ref"><input type="checkbox" id="aiRef"${AI.ref?' checked':''}>参考当前笔记</label>
    <button class="btn-ghost" id="aiClearChat">清空对话</button>
    <div class="ai-composer">
      <textarea id="aiInput" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="btn-primary" id="aiSend">发送</button>
    </div>`;
  $('#aiRef').onchange = (e)=>{ AI.ref = e.target.checked; };
  $('#aiClearChat').onclick = ()=>{ AI.chat = []; paintAiChat(); };
  $('#aiSend').onclick = aiSendChat;
  $('#aiInput').onkeydown = (e)=>{
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); aiSendChat(); }
  };
  if(window.innerWidth > 560) setTimeout(()=>{ const i = $('#aiInput'); if(i) i.focus(); }, 60);
}

function aiAddMsg(role, text){
  const msgs = $('#aiMsgs');
  if(!msgs) return null;
  const wrap = document.createElement('div');
  wrap.className = 'ai-msg ' + (role === 'assistant' ? 'bot' : 'user');
  const bubble = document.createElement('div');
  bubble.className = 'ai-bubble';
  bubble.textContent = text || '';
  wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  const body = $('#aiBody'); if(body) body.scrollTop = body.scrollHeight;
  return bubble;
}

function aiMsgActions(bubble, text){
  const wrap = bubble.parentElement;
  if(!wrap || !text) return;
  let acts = wrap.querySelector('.ai-msg-acts');
  if(!acts){
    acts = document.createElement('div');
    acts.className = 'ai-msg-acts';
    wrap.appendChild(acts);
  }
  acts.innerHTML = `<button data-ai-act="copy">复制</button><button data-ai-act="insert">插入到笔记</button>`;
  acts.querySelector('[data-ai-act="copy"]').onclick = ()=>{
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(()=>toast('已复制')).catch(()=>toast('复制失败，手动选一下'));
  };
  acts.querySelector('[data-ai-act="insert"]').onclick = ()=>{
    closeAI();
    setTimeout(()=>{
      if(aiInsertText(text)) toast('已插入笔记');
      else toast('没有打开的笔记');
    }, 80);
  };
}

async function aiSendChat(){
  const inp = $('#aiInput');
  if(!inp || AI.busy) return;
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  inp.style.height = '';
  AI.chat.push({ role:'user', content:q });
  const empty = $('#aiEmpty'); if(empty) empty.remove();
  aiAddMsg('user', q);
  AI.busy = true;
  const bubble = aiAddMsg('assistant', '…');
  const body = $('#aiBody');
  try{
    const n = noteById(S.active);
    const note = AI.ref && n ? String(n.body || '') : '';
    const text = await aiStream({ task:'chat', messages: AI.chat.slice(-12), note }, (all)=>{
      if(bubble) bubble.textContent = all || '…';
      if(body) body.scrollTop = body.scrollHeight;
    });
    const finalText = String(text || '').trim();
    if(bubble) bubble.textContent = finalText || '（模型没有返回内容）';
    if(finalText){
      AI.chat.push({ role:'assistant', content:finalText });
      aiMsgActions(bubble, finalText);
    }
  }catch(e){
    if(e.name === 'AbortError'){ if(bubble) bubble.textContent = '已停止'; }
    else{
      if(bubble){ bubble.textContent = e.message || '生成失败'; bubble.classList.add('err'); }
      if(e.code === 'login'){ closeAI(); openSyncPanel(); return; }
    }
  }finally{
    AI.busy = false;
    if(body) body.scrollTop = body.scrollHeight;
  }
}

/* ============ 思维导图：把 Markdown 大纲渲染成脑图 ============
   只读视图——标题（#）与缩进列表（- / 1.）当作层级，不改一个字，
   笔记本身仍然是纯 Markdown，导出、同步、导入全都不受影响。 */
const MM = { noteId:null, root:null, lay:null, s:1, tx:0, ty:0, withList:true,
             ptrs:new Map(), pinch:0, moved:0, byId:new Map(), c:{}, bg:'#fff',
             sel:0, seq:0, style:null, canEdit:false, undo:[], styleId:'', dir:'', uiTab:'dir', kpIdx:null };
const MM_NH = 32, MM_VGAP = 12, MM_HGAP = 56, MM_PAD = 26;
/* 节点文字：13px 一行高 18；一行最多 248px 就换行，超长的宁可把方框撑高，也不让字跑出框 */
const MM_LH = 18, MM_TXT_MAX = 248, MM_NW_MAX = 274, MM_NW_MIN = 62;
const MM_FONT = "-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif";
let _mmCtx = null;
function mmCtx(){
  if(!_mmCtx){
    const c = document.createElement('canvas');
    _mmCtx = c.getContext('2d');
  }
  _mmCtx.font = '13px ' + MM_FONT.replace(/'/g, '');
  return _mmCtx;
}
function mmXml(t){
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* 去掉行内 Markdown 记号，只留可读文字 */
function mmClean(t){
  return String(t || '')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/\[\[([^\]]+)\]\]/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/(\*\*|__)(.*?)\1/g,'$2')
    .replace(/~~(.*?)~~/g,'$1')
    .replace(/<[^>]+>/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
/* 解析：root = 笔记标题；# 决定层级；列表按缩进分叉 */
function mmBuildTree(note, withList){
  const root = { i:0, label: note.title || '未命名', text:'', depth:0, children:[], collapsed:false, kind:'root', w:0, x:0, y:0 };
  const parents = [root];
  const indents = [];
  let base = 0, count = 0, cut = false, seq = 0, firstHeading = true, minH = 0;
  const lines = String(note.body || '').replace(/\r/g,'').split('\n');
  let fence = false, extra = false, headMax = 0;
  const push = (parent, node, depth) => {
    node.i = ++seq; node.depth = depth;
    parent.children.push(node);
    parents.length = depth + 1;
    parents[depth] = node;
    count++;
  };
  for(const raw of lines){
    if(count > 600){ cut = true; break; }
    if(/^\s*(```|~~~)/.test(raw)){ fence = !fence; extra = true; continue; }   // 代码块写回会丢，标为不可编辑
    if(fence){ extra = true; continue; }
    if(!raw.trim()) continue;
    const h = raw.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(h){
      const lv = Math.min(6, h[1].length);
      const label = mmClean(h[2]);
      if(!label) continue;
      // 开头的一级标题如果就是笔记标题，别重复画一层
      if(firstHeading && lv === 1 && label === mmClean(note.title || '')){
        firstHeading = false; parents.length = 1; base = 0; indents.length = 0; continue;
      }
      firstHeading = false;
      // 归一化：# 不一定从一级开始，很多人用 ## 当章节。以最小的标题级别作为第一层
      if(!minH || lv < minH) minH = lv;
      const depth = Math.max(1, Math.min(lv - minH + 1, parents.length));
      const parent = parents[depth - 1] || root;
      const node = { i:0, label, raw: String(h[2]).trim(), text:'', depth:0, children:[], collapsed:false, kind:'h', w:0, x:0, y:0 };
      push(parent, node, depth);
      base = depth;
      headMax = Math.max(headMax, depth);
      indents.length = 0;
      continue;
    }
    if(!withList) continue;
    const li = raw.match(/^(\s*)(?:[-*+]|\d{1,3}[.)])\s+(.+)$/);
    if(!li){ extra = true; continue; }        // 普通段落 / 引用 / 表格：不在树里，写回会覆盖
    const indent = li[1].replace(/\t/g,'  ').length;
    const cb = li[2].match(/^\[([ xX])\]\s*/);        // - [ ] / - [x] 待办标记
    const rawLabel = (cb ? li[2].slice(cb[0].length) : li[2]).trim();
    const label = mmClean(rawLabel);
    if(!label) continue;

function mmWrap(label, maxW){

  if(!s) return [''];
  if(ctx.measureText(s).width <= maxW) return [s];
  const out = [];
  let line = '';
  const flush = () => { if(line) out.push(line.replace(/\s+$/,'')); line = ''; };
  const tokens = s.match(/[A-Za-z0-9]+[’'\-]?[A-Za-z0-9]*|\s+|[\s\S]/g) || [];

    if(line && ctx.measureText(line + tk).width > maxW){
      if(ctx.measureText(tk).width > maxW){          // 单个词就超宽：逐字硬切
        flush();
        for(const ch of tk){
          if(line && ctx.measureText(line + ch).width > maxW) flush();
          line += ch;
        }
        continue;
      }
      flush();
      line = /^\s+$/.test(tk) ? '' : tk;
    }else{
      line += tk;
    }
  }
  flush();
  return out.length ? out : [s];

function mmMeasureTree(root, lay){

    // 以前是超过 46 个字硬截断（中文 46 字远超框宽，于是文字直接溢出去）：

    n.lines = mmWrap(n.label, MM_TXT_MAX);
    n.text = n.lines.join(' ');
    let tw = 0;
    for(const ln of n.lines) tw = Math.max(tw, ctx.measureText(ln).width);
    n.w = Math.max(n.depth === 0 ? 108 : MM_NW_MIN, Math.min(MM_NW_MAX, Math.ceil(tw) + 26));

      if(!n.collapsed) n.children.forEach(c=>walk(c, d + 1));

function mmLinkD(style, x1, y1, x2, y2){

  const sign = x2 >= x1 ? 1 : -1;
  const dx = Math.max(18, Math.abs(x2 - x1) * 0.45) * sign;
  if(style === 'straight') return 'M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2;
  if(style === 'elbow'){
    if(Math.abs(y2 - y1) < 1) return 'M' + x1 + ' ' + y1 + 'H' + x2;
    const mx = x1 + (x2 - x1) / 2, up = y2 < y1 ? -1 : 1;
    const r = Math.max(0, Math.min(9, Math.abs(y2 - y1) / 2, Math.abs(mx - x1), Math.abs(x2 - mx)));
    return 'M' + x1 + ' ' + y1
      + 'H' + (mx - r) + 'Q' + mx + ' ' + y1 + ' ' + mx + ' ' + (y1 + up * r)
      + 'V' + (y2 - up * r) + 'Q' + mx + ' ' + y2 + ' ' + (mx + r) + ' ' + y2 + 'H' + x2;
  }

  if(style === 'elbow'){
    const my = (y1 + y2) / 2;
    return 'M' + x1 + ' ' + y1 + 'V' + my + 'H' + x2 + 'V' + y2;
  }

      nodes.push('<text x="' + (l + 13) + '" y="' + mTop + '" dy="0.34em" font-family="' + MM_FONT + '" font-size="13" fill="' + txt + '">' + mTspans(l + 13) + '</text>');

/* 样式缩略图：拿同一套配色画一棵小三节点树 */
function mmPrevSvg(id){
  const p = mmPreset(id), c = mmPalette(id), dark = mmDark();
  const W = 112, H = 64, o = [];
  o.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" preserveAspectRatio="xMidYMid meet">');

  o.push('<rect width="' + W + '" height="' + H + '" fill="' + c.bg + '"/>');
  const R = { x:5, y:25, w:26, h:14 };
  const kids = [ { x:47, y:5, w:56, h:13 }, { x:47, y:25.5, w:60, h:13 }, { x:47, y:46, w:48, h:13 } ];
  const hueAt = i => (c.hues ? c.hues[(i + 2) % c.hues.length] : c.accent);
  // 连线
  kids.forEach((k, i) => {
    const x1 = R.x + R.w, y1 = R.y + R.h / 2, x2 = k.x, y2 = k.y + k.h / 2;
    const hue = hueAt(i);
    if(p.link === 'taper'){
      const dx = (x2 - x1) * .5, half = 3.2;
      o.push('<path d="M' + x1 + ' ' + (y1 - half) + 'C' + (x1 + dx) + ' ' + (y1 - half * .8) + ' ' + (x2 - dx) + ' ' + (y2 - half * .3) + ' ' + x2 + ' ' + (y2 - .7)
        + 'L' + x2 + ' ' + (y2 + .7) + 'C' + (x2 - dx) + ' ' + (y2 + half * .3) + ' ' + (x1 + dx) + ' ' + (y1 + half * .8) + ' ' + x1 + ' ' + (y1 + half) + 'Z" fill="' + hue + '" opacity=".8"/>');
    }else{
      o.push('<path d="' + mmLinkD(p.link, x1, y1, x2, y2) + '" fill="none" stroke="' + ((c.hues || p.shape === 'glow') ? hue : c.link) + '" stroke-width="1.2" stroke-linecap="round"' + (p.shape === 'glow' ? ' opacity=".6"' : '') + '/>');
    }
  });
  const bar = (x, y, w, h, fill) => w > 0 ? '<rect x="' + x + '" y="' + y + '" width="' + Math.max(2, w) + '" height="' + h + '" rx="' + (h / 2) + '" fill="' + fill + '"/>' : '';
  const draw = (n, fill, stroke, txt, rx, shadow) => {
    const s = [];
    if(p.shape === 'plain'){
      s.push(bar(n.x + 1, n.y + n.h / 2 - 1.6, n.w * .58, 3.2, txt));
      s.push(bar(n.x + 1, n.y + n.h - 2, n.w * .82, 1.4, txt));
    }else{
      s.push('<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="' + rx + '" fill="' + fill + '"'
        + (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') + (shadow ? ' filter="url(#mmPS)"' : '') + '/>');
      if(p.shape === 'card') s.push(bar(n.x + 3.5, n.y + 4.5, 2, n.h - 9, txt === c.rootTxt ? c.rootTxt : (c.hues ? hueAt(0) : c.accent)));
      s.push(bar(n.x + 8, n.y + n.h / 2 - 1.7, n.w * .42, 3.4, txt));
    }
    return s.join('');
  };
  o.push(draw(R, c.root, '', c.rootTxt, p.shape === 'square' ? 2 : (p.shape === 'pill' ? R.h / 2 : 8), !!p.shadow));
  kids.forEach((k, i) => {
    const hue = hueAt(i);
    let fill = c.node, txt = c.ink, stroke = c.stroke;
    if(p.shape === 'pill'){
      fill = mmRgba(hue, dark ? .3 : .15);
      txt = dark ? mmMix(hue, '#ffffff', .3) : mmMix(hue, '#101820', .4);
      stroke = mmRgba(hue, .45);
    }else if(p.shape === 'card'){ fill = i === 0 ? c.soft : c.node; txt = i === 0 ? c.softTxt : c.ink; stroke = i === 0 ? '' : c.stroke; }
    else if(p.shape === 'square'){ fill = i === 0 ? c.soft : c.node; txt = i === 0 ? c.softTxt : c.ink; stroke = i === 0 ? '' : c.stroke; }
    else if(p.shape === 'glow'){ fill = mmRgba(hue, .18); txt = hue; stroke = mmRgba(hue, .5); }
    else if(p.shape === 'plain'){ txt = hue; fill = 'none'; stroke = ''; }
    else { fill = i === 0 ? c.soft : c.node; txt = i === 0 ? c.softTxt : c.ink; stroke = i === 0 ? '' : c.stroke; }
    const rx = p.shape === 'square' ? 2 : (p.shape === 'pill' ? k.h / 2 : 7);
    o.push(draw(k, fill, stroke, txt, rx, !!p.shadow));
  });
  o.push('</svg>');
  return o.join('');
}
/* 结构缩略图：静态几何，够表达方向就行 */
function mmDirPrevSvg(id){
  const c = mmPalette();
  const dir = id || 'right';
  const root = { x:44, y:24, w:24, h:14 };
  let kids = [], links = [];
  const L = (x1,y1,x2,y2)=>links.push([x1,y1,x2,y2]);
  if(dir === 'both'){
    kids = [{x:76,y:6,w:32,h:11},{x:76,y:29,w:32,h:11},{x:4,y:9,w:32,h:11},{x:4,y:32,w:32,h:11}];
    L(68,31,76,11.5); L(68,31,76,34.5); L(44,31,36,14.5); L(44,31,36,37.5);
  }else if(dir === 'left'){
    root.x = 82;
    kids = [{x:16,y:4,w:56,h:12},{x:12,y:25,w:60,h:12},{x:24,y:46,w:48,h:12}];
    L(82,31,72,10); L(82,31,72,31); L(82,31,72,52);
  }else if(dir === 'down' || dir === 'up'){
    root.y = dir === 'down' ? 3 : 48;
    const ky = dir === 'down' ? 44 : 7;
    kids = [{x:2,y:ky,w:32,h:13},{x:40,y:ky,w:34,h:13},{x:80,y:ky,w:28,h:13}];
    const ry = dir === 'down' ? 17 : 48, kEdge = dir === 'down' ? 44 : 20;
    L(56,ry,18,kEdge); L(56,ry,57,kEdge); L(56,ry,94,kEdge);
  }else{
    root.x = 4;
    kids = [{x:40,y:4,w:56,h:12},{x:40,y:25,w:60,h:12},{x:40,y:46,w:48,h:12}];
    L(30,31,40,10); L(30,31,40,31); L(30,31,40,52);
  }
  const vertical = dir === 'down' || dir === 'up';
  const o = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 64" width="112" height="64">',
             '<rect width="112" height="64" fill="' + c.bg + '"/>'];
  links.forEach(pt => {
    const x1 = pt[0], y1 = pt[1], x2 = pt[2], y2 = pt[3];
    let d;
    if(vertical){
      const dy = (y2 - y1) * 0.5;
      d = 'M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + (y1 + dy) + ' ' + x2 + ' ' + (y2 - dy) + ' ' + x2 + ' ' + y2;
    }else{
      const dx = (x2 - x1) * 0.5;
      d = 'M' + x1 + ' ' + y1 + 'C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2;
    }
    o.push('<path d="' + d + '" fill="none" stroke="' + c.link + '" stroke-width="1.2" stroke-linecap="round"/>');
  });
  const bar = (x,y,w,h,f) => '<rect x="' + x + '" y="' + y + '" width="' + Math.max(2, w) + '" height="' + h + '" rx="' + (h/2) + '" fill="' + f + '"/>';
  o.push('<rect x="' + root.x + '" y="' + root.y + '" width="' + root.w + '" height="' + root.h + '" rx="7" fill="' + c.root + '"/>');
  o.push(bar(root.x + 8, root.y + root.h/2 - 1.7, root.w * 0.42, 3.4, c.rootTxt));
  kids.forEach(k=>{
    o.push('<rect x="' + k.x + '" y="' + k.y + '" width="' + k.w + '" height="' + k.h + '" rx="6" fill="' + c.soft + '" stroke="' + c.stroke + '" stroke-width="1"/>');
    o.push(bar(k.x + 7, k.y + k.h/2 - 1.7, k.w * 0.4, 3.4, c.softTxt));
  });
  o.push('</svg>');
  return o.join('');
}
/* ---------- 结构与外观选择面板 ---------- */

function mmApply(){

function mmZoomAt(f, cx, cy){
  const ns = Math.min(2.6, Math.max(0.18, MM.s * f));
  const k = ns / MM.s;
  MM.tx = cx - (cx - MM.tx) * k;
  MM.ty = cy - (cy - MM.ty) * k;

function mmFit(){
  const box = $('#mmCanvas');
  if(!box || !MM.lay) return;
  const bw = box.clientWidth, bh = box.clientHeight;
  let s = Math.min((bw - 24) / MM.lay.width, (bh - 24) / MM.lay.height, 1.35);
  // 手机屏窄，硬塞进一屏会小到看不清：保底缩放，超出的部分让用户拖/缩。
  // 双侧布局天生两倍宽，保底值给低一档，否则只能看到半棵树
  const both = MM.lay.dir === 'both';
  const floor = bw < 760 ? (both ? 0.56 : 0.78) : 0.18;
  s = Math.max(floor, Math.min(2.6, s));
  MM.s = s;
  const w = MM.lay.width * s, h = MM.lay.height * s;
  // 装得下就居中；装不下就以根节点为中心（不然一打开根节点可能被推到屏幕外）
  if(w <= bw - 24) MM.tx = (bw - w) / 2;
  else {
    const rx = (MM.root.x + MM.root.w / 2) * s;
    MM.tx = Math.min(24, Math.max(bw - w - 24, bw / 2 - rx));
  }
  if(h <= bh - 24) MM.ty = (bh - h) / 2;
  else {
    const ry = MM.root.y * s;
    MM.ty = Math.min(24, Math.max(bh - h - 24, bh / 2 - ry));
  }
  mmApply();
}
function mmSetAll(n, v){

function mmToggle(idx){

/* 结构没变、只是折叠/展开变了：重排 + 重画，不重新解析笔记 */
