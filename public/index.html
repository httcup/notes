    else src = ensureLiveInput();
  }
  if(!src) return;
  const v = src.value;
  const s = (typeof src.selectionStart === 'number') ? src.selectionStart : v.length;
  const e = (typeof src.selectionEnd === 'number') ? src.selectionEnd : s;
  src.value = v.slice(0, s) + text + v.slice(e);
  const p = s + text.length;

/* 选区落在哪一段 ==高亮== 里？返回整段区间，否则 null。
   用整篇扫描而不是看相邻字符，才能正确处理「整段连标记一起选中」的情况。 */
function markSpan(v, s, e){
  const re = /==([^=\n]+)==(?:\{(?:\.[a-z]+|c:#[0-9a-fA-F]{3,8})\})?/g;
  let m;
  while((m = re.exec(v))){
    const st = m.index, en = m.index + m[0].length;
    if(s >= st && e <= en) return { start: st, end: en, text: m[1] };
  }
  return null;
}

function applyFormat(kind, opt){
  const n = S.active ? noteById(S.active) : null;
  if(!n) return;
  const doc = document.getElementById('doc');
  if(!doc) return;

  let src = document.activeElement;
  if(!(src && src.classList && src.classList.contains('blk-src'))){
    src = curMode()==='live' ? ensureLiveInput() : document.getElementById('source');
  }
  if(!src) return;
  const inLive = src.classList.contains('blk-src');
  const prevMode = curMode();
  if(!inLive && prevMode!=='source'){ /* 源码气泡里本来就能插 */ }

  let v = src.value;
  let s = src.selectionStart, e = src.selectionEnd;
  if(typeof s !== 'number'){ s = e = v.length; }
  // 只有「文本框没被聚焦」时才插到末尾；双栏/源码里要尊重光标位置
  if(!inLive && document.activeElement !== src){ s = e = v.length; }
  const sel = v.slice(s, e);
  let wantWiki = false;
  let ns = s, ne = e;
  const setRange = (a,b)=>{ ns = a; ne = b; };
  const wrapSel = (before, after, ph)=>{
    const text = sel || ph || '';
    v = v.slice(0,s) + before + text + after + v.slice(e);
    setRange(s + before.length, s + before.length + text.length);
  };
  const prefixLines = (prefix)=>{
    const lineStart = v.lastIndexOf('\n', s-1) + 1;
    const tail = Math.max(s, e);
    let blockEnd = v.indexOf('\n', tail);
    if(blockEnd === -1) blockEnd = v.length;
    const block = v.slice(lineStart, blockEnd);
    const nb = block.split('\n').map(line=>{
      const bare = line.replace(/^\s*(#{1,6}\s+|-\s\[[ xX]\]\s+|[-*+]\s+|\d+\.\s+|>\s+)?/, '');
      return prefix + bare;
    }).join('\n');
    v = v.slice(0, lineStart) + nb + v.slice(blockEnd);
    // 空块只加了前缀：光标停在标记后面（别把前缀一起选中，否则一打字就被覆盖）
    if(!block.trim()) setRange(lineStart + nb.length, lineStart + nb.length);
    else setRange(lineStart, lineStart + nb.length);
  };

  switch(kind){
    case 'h1': prefixLines('# '); break;
    case 'h2': prefixLines('## '); break;
    case 'h3': prefixLines('### '); break;
    case 'h4': prefixLines('#### '); break;
    case 'h5': prefixLines('##### '); break;
    case 'h6': prefixLines('###### '); break;
    case 'p': prefixLines(''); break;
    case 'b': wrapSel('**','**','加粗文字'); break;
    case 'i': wrapSel('*','*','斜体文字'); break;
    case 's': wrapSel('~~','~~','删除线'); break;
    case 'mark': {
      const c = opt || '';
      const tail = c ? (c.charAt(0) === '#' ? `=={c:${c}}` : `=={.${c}}`) : '==';
      const sp = markSpan(v, s, e);
      if(sp){
        // 已经在高亮里（选区包含标记 / 标记紧贴选区两端）→ 只换颜色或去色，绝不再套一层
        v = v.slice(0, sp.start) + '==' + sp.text + tail + v.slice(sp.end);
        setRange(sp.start + 2, sp.start + 2 + sp.text.length);
      } else {
        wrapSel('==', tail, '高亮文字');
      }
      break;
    }
    case 'mark-clear': {
      const sp = markSpan(v, s, e);
      if(sp){
        v = v.slice(0, sp.start) + sp.text + v.slice(sp.end);
        setRange(sp.start, sp.start + sp.text.length);
      } else {
        const cleaned = sel.replace(/==([^=]+)==(?:\{(?:\.[a-z]+|c:#[0-9a-fA-F]{3,8})\})?/g, '$1');
        v = v.slice(0,s) + cleaned + v.slice(e);
        setRange(s, s + cleaned.length);
      }
      break;
    }
    case 'code': wrapSel('`','`','代码'); break;
    case 'due': {
      // 日期与提醒：插一个今天 9 点的提醒标记，用户接着改成想要的时间
      const ins = '@今天 9点';
      v = v.slice(0,s) + ins + v.slice(e);
      setRange(s, s + ins.length);
      break;
    }
    case 'ul': prefixLines('- '); break;
    case 'ol': prefixLines('1. '); break;
    case 'todo': prefixLines('- [ ] '); break;
    case 'quote': prefixLines('> '); break;
    case 'wiki': {
      if(sel){
        // 选中了文字 → 直接包成 [[文字]]，不弹面板
        v = v.slice(0,s) + '[[' + sel + ']]' + v.slice(e);
        setRange(s + 2, s + 2 + sel.length);
      } else {
        v = v.slice(0,s) + '[[' + v.slice(e);
        setRange(s + 2, s + 2);
        wantWiki = true;
      }
      break;
    }
    case 'link': {
      const text = sel || '链接文字';
      const url = 'https://';
      const ins = '[' + text + '](' + url + ')';
      v = v.slice(0,s) + ins + v.slice(e);
      const a = s + 1 + text.length + 2;
      setRange(a, a + url.length);
      break;
    }
    case 'table': {
      const rows = Math.max(1, Math.min(50, (opt && opt.rows) || 3));
      const cols = Math.max(1, Math.min(12, (opt && opt.cols) || 3));
      const line = arr => '| ' + arr.join(' | ') + ' |';
      const head = line(Array.from({length:cols}, (_,i)=>'列 '+(i+1)));
      const sep  = line(Array.from({length:cols}, ()=>'---'));
      const body = [];
      for(let r=1;r<rows;r++) body.push(line(Array.from({length:cols}, ()=>'内容')));
      const tpl = '\n' + [head, sep, ...body].join('\n') + '\n';
      v = v.slice(0,s) + tpl + v.slice(e);
      // 光标停到第一个单元格里，方便直接开写
      const at = s + 1 + 3;
      setRange(at, at + ('列 1'.length));
      break;
    }
    case 'mermaid': {
      const code = (opt && opt.code) || 'graph TD\n  A[开始] --> B[结束]';
      const head = '\n```mermaid\n';
      v = v.slice(0,s) + head + code + '\n```\n' + v.slice(e);
      const a = s + head.length;
      setRange(a, a + code.length);
      break;
    }
    case 'pre': {
      const body = sel || '代码';
      const head = '\n```\n';
      v = v.slice(0,s) + head + body + '\n```\n' + v.slice(e);
      const a = s + head.length;
      setRange(a, a + body.length);
      break;
    }
    case 'hr': {
      const ins = '\n\n---\n\n';
      v = v.slice(0,s) + ins + v.slice(e);
      setRange(s + ins.length, s + ins.length);
      break;
    }
    default: return;
  }

  src.value = v;
  try{ src.setSelectionRange(ns, ne); }catch(e2){}
  src.focus();
  if(wantWiki && inLive) detectWiki(src);

  if(inLive){
    const i = parseInt(src.dataset.i, 10) || 0;
    LIVE.raws[i] = v;
    growTa(src);
    syncBody();
    // 只加了前缀、还没写正文 → 留在编辑态，用灰字提示该写什么；写过了就立刻渲染
    const barePrefix = /^(?:#{1,6}|- \[ \]|[-*+]|\d+\.|>)\s*$/.test(v);
    if(barePrefix){
      // 让输入框（和提示）直接用这类块渲染后的字号，写起来所见即所得
      const st = probeBlockStyle(kind);
      if(st){
        src.style.fontSize = st.fontSize;
        src.style.lineHeight = st.lineHeight;
        src.style.fontWeight = st.fontWeight;
        src.style.fontFamily = st.fontFamily;
        growTa(src);
      }
      updateBlockHint(src);
    }else if(['h1','h2','h3','h4','h5','h6','ul','ol','todo','quote','table','hr','pre'].includes(kind)){
      commitBlock(i);
    }
  } else {
    src.style.height = 'auto';
    src.style.height = Math.max(src.scrollHeight, 240) + 'px';
    n.body = v; n.updatedAt = Date.now();
    renderMeta(); renderOutline(); save();
    if(curMode()==='split') livePreviewSoon();
  }
}

/* 一键复制大纲：标题 + 所有分支，按层级缩进；不带 markdown 记号，贴到哪儿都是一棵干净的树 */
async function copyOutline(){
  const n = S.active ? noteById(S.active) : null;
  if(!n){ toast('没有打开的笔记'); return; }
  const list = (mdToHtml(n.body).outline || []).filter(e => (e.text || '').trim());

async function copyRich(){

      'text/plain': new Blob([plain], {type:'text/plain'})
    })]);
    toast('已复制富文本');
  }catch(e){

    sel.removeAllRanges(); sel.addRange(range);

    try{ ok = document.execCommand('copy'); }catch(err){}

/* ========== 所见即所得编辑（块级 Markdown） ========== */
/* ========== 正文撤销 / 重做 ==========
   块编辑器每次拆块、合并、失焦提交都会重建 textarea，浏览器原生的撤销栈就断了
   （commitBlock 里给 ta.value 重新赋值也会清空它）。所以正文自己记快照：
   内容 + 块划分 + 光标位置，按「输入停顿」切成一步，栈里最多留 150 步。 */
var UNDO = null;
function histState(){
  if(!UNDO) UNDO = { note:null, stack:[], idx:-1, timer:0, quiet:false, touching:false,
                     byNote:{}, resumed:null, MAX:150 };
  return UNDO;
}
function histCancelTimer(){ const H = histState(); if(H.timer){ clearTimeout(H.timer); H.timer = 0; } }
function histSnapNow(){
  const n = noteById(S.active); if(!n) return null;
  const m = curMode();
  let body = n.body || '';
  const src = document.getElementById('source');
  if((m === 'source' || m === 'split') && src) body = src.value;
  if(m === 'live'){
    // 正在编辑的那一块以 textarea 里的实时内容为准，别把刚敲的字丢了
    const host = liveHost();
    if(host && LIVE.editing >= 0){
      const ta = host.querySelector('.blk[data-i="' + LIVE.editing + '"] .blk-src');
      if(ta && LIVE.raws[LIVE.editing] !== ta.value) LIVE.raws[LIVE.editing] = ta.value;
    }
  }
  const at = (LIVE.editing >= 0 && LIVE.ta)
    ? { i:LIVE.editing, pos:(LIVE.ta.selectionStart || 0) }
    : { i:Math.max(0, LIVE.raws.length - 1), pos:-1 };
  return { body:body, raws:LIVE.raws.slice(), gaps:(LIVE.gaps || []).slice(), at:at };
}
function histReset(){
  const H = histState();
  histCancelTimer();
  H.touching = false;
  H.stack = []; H.idx = -1; H.note = (S && S.active) || null;
  const s = histSnapNow();
  if(s){ H.stack = [s]; H.idx = 0; }
}
/* 换笔记时把撤销记录按笔记存一份（30 分钟内切回来还能接着撤） */
function histPark(){
  const H = histState();
  if(!H.note || !H.stack.length) return;
  H.byNote[H.note] = { stack:H.stack.slice(), idx:H.idx, at:Date.now() };
  const ids = Object.keys(H.byNote);
  if(ids.length > 8){
    ids.sort((a,b)=>(H.byNote[a].at||0)-(H.byNote[b].at||0));
    ids.slice(0, ids.length - 8).forEach(k=>{ delete H.byNote[k]; });
  }
}
function histSyncNote(){
  const H = histState();
  const id = (S && S.active) || null;
  if(H.note === id && H.stack.length) return;
  if(H.note && H.note !== id) histPark();
  histCancelTimer();
  H.touching = false;
  H.note = id;
  H.resumed = null;
  const saved = id ? H.byNote[id] : null;
  const fresh = saved && saved.stack && saved.stack.length && (Date.now() - (saved.at || 0)) < 30 * 60 * 1000;
  const s = histSnapNow();
  if(fresh){
    H.stack = saved.stack.slice();
    H.idx = Math.min(saved.idx, H.stack.length - 1);
    // 离开期间在别处改过内容：把现状补成新的一格，撤销才不会跳回旧内容
    if(s && H.stack[H.idx] && s.body !== H.stack[H.idx].body){
      H.stack = H.stack.slice(0, H.idx + 1);
      H.stack.push(s);
      H.idx = H.stack.length - 1;
    }
    H.resumed = { at: saved.at, steps: Math.max(0, H.idx) };
    setTimeout(()=>{ try{ renderMeta(); }catch(e){} }, 0);
  }else{
    H.stack = s ? [s] : [];
    H.idx = s ? 0 : -1;
  }
}
function histPush(){
  const H = histState();
  histCancelTimer();
  const s = histSnapNow(); if(!s) return;
  if(H.note !== ((S && S.active) || null)){ histReset(); return; }
  const top = H.stack[H.idx];
  if(top && top.body === s.body) return;          // 内容没变，不占一格
  if(H.idx < H.stack.length - 1) H.stack.length = H.idx + 1;   // 撤销后又改：截断「未来」
  H.stack.push(s);
  if(H.stack.length > H.MAX) H.stack.shift();
  H.idx = H.stack.length - 1;
  H.touching = false;
}
/* 输入过程中频繁调用：只在停顿后落一格，避免一个字一步 */
function histTouch(){
  const H = histState();
  if(H.quiet) return;
  if(H.note !== ((S && S.active) || null) || !H.stack.length){ histReset(); return; }
  histCancelTimer();
  H.touching = true;
  H.timer = setTimeout(function(){ H.timer = 0; histPush(); }, 340);
}
function histApply(i){
  const H = histState();
  const s = H.stack[i]; if(!s) return false;
  const n = noteById(S.active); if(!n) return false;
  const m = curMode();
  H.quiet = true; H.idx = i; H.touching = false;
  n.body = s.body; n.updatedAt = Date.now();
  const src = document.getElementById('source');
  if(m === 'source' || m === 'split'){
    if(src){
      src.value = s.body;
      if(m === 'source'){
        const p = (s.at && s.at.pos >= 0) ? Math.min(s.at.pos, s.body.length) : s.body.length;
        try{ src.focus(); src.setSelectionRange(p, p); }catch(e){}
      }
    }
    if(m === 'split') renderProse();
  }else{
    const host0 = liveHost();
    const old = host0 && host0.querySelector('.blk.editing');
    if(old) old.classList.remove('editing');
    LIVE.editing = -1; LIVE.ta = null;
    HOLD_BLUR = true;
    LIVE.raws = (s.raws && s.raws.length) ? s.raws.slice() : [''];
    const g = (s.gaps || []).slice();
    while(g.length < LIVE.raws.length) g.push(0);
    LIVE.gaps = g;
    paintLive();
    const at = s.at || { i:0, pos:-1 };
    const bi = Math.max(0, Math.min(LIVE.raws.length - 1, at.i | 0));
    setTimeout(function(){
      HOLD_BLUR = false;
      try{ focusBlock(bi, at.pos >= 0 ? at.pos : 'end'); }catch(e){}
    }, 0);
  }
  H.resumed = null;
  renderMeta(); renderOutline(); save();
  H.quiet = false;
  return true;
}
function histUndo(){
  const H = histState();
  if(!S.active || !noteById(S.active)) return false;
  histSyncNote();
  histCancelTimer();
  const cur = histSnapNow();
  const top = H.stack[H.idx];
  if(cur && (!top || cur.body !== top.body)) histPush();   // 还没落格的改动先记下来，才退得回「改动前」
  if(H.idx <= 0){ toast('已经退到这篇笔记最早的状态了'); return true; }
  return histApply(H.idx - 1);
}
function histRedo(){
  const H = histState();
  if(!S.active || !noteById(S.active)) return false;
  histSyncNote();
  histCancelTimer();
  if(H.idx >= H.stack.length - 1){ toast('没有更新的改动了'); return true; }
  return histApply(H.idx + 1);
}
document.addEventListener('keydown', function(e){
  if(e.isComposing || e.keyCode === 229) return;              // 输入法组字时别抢
  if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
  const k = String(e.key || '').toLowerCase();
  const undo = k === 'z' && !e.shiftKey;
  const redo = (k === 'z' && e.shiftKey) || (k === 'y' && !e.shiftKey);
  if(!undo && !redo) return;
  const ae = document.activeElement;
  if(ae && ae.id === 'docTitle') return;                      // 标题交给浏览器原生
  const inDoc = ae && ae.closest && ae.closest('#doc');
  // AI 输入框、搜索框、导图改名框等：走它们自己的撤销
  if(!inDoc && ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if(!S.active || !noteById(S.active)) return;
  if(undo){ if(histUndo()) e.preventDefault(); }
  else if(histRedo()) e.preventDefault();
}, true);

const LIVE = { raws: [], gaps: [], editing: -1, ta: null };
/* 打开系统取色器等外部窗口时，先别把正在编辑的块提交掉 */
let HOLD_BLUR = false;

function modeClass(m){
  if(m==='source') return 'mode-edit';
  if(m==='split') return 'mode-split';
  if(m==='preview') return 'mode-preview';
  return 'mode-live';
}
function curMode(){
  const doc = document.getElementById('doc');
  if(!doc) return 'live';
  if(doc.classList.contains('mode-edit')) return 'source';
  if(doc.classList.contains('mode-split')) return 'split';
  if(doc.classList.contains('mode-preview')) return 'preview';
  return 'live';
}
function liveHost(){ return document.getElementById('live'); }

/* 切块规则与 mdToHtml 完全一致，保证「所见」与「渲染」不打架 */
function parseBlocks(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }
    const start = i;
    if(/^```/.test(line)){
      i++;
      while(i<lines.length && !/^```/.test(lines[i])) i++;
      if(i<lines.length) i++;
    } else if(/^(#{1,6})\s+/.test(line)){
      i++;
    } else if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)){
      i++;
    } else if(/^>\s?/.test(line)){
      while(i<lines.length && /^>\s?/.test(lines[i])) i++;
    } else if(line.includes('|') && i+1<lines.length && isSep(lines[i+1])){
      i += 2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()) i++;
    } else if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) i++;
    } else {
      i++;
      while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isSep(lines[i])) i++;
    }
    out.push({lines: lines.slice(start, i), start:start, end:i});
  }
  return out;
}

function blockType(raw){
  const ls = String(raw||'').split('\n');
  const first = ls[0] || '';
  if(/^```/.test(first)) return 'fence';
  if(/^(#{1,6})\s+/.test(first)) return 'heading';
  if(/^>\s?/.test(first)) return 'quote';
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  if(first.includes('|') && ls.length>1 && isSep(ls[1])) return 'table';
  if(/^\s*([-*+]|\d+\.)\s+/.test(first)) return 'list';
  if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(first)) return 'hr';
  return 'para';
}

function mdBlock(raw){
  return mdToHtml(raw).html
    .replace(/ id="h\d+"/g,'')
    .replace(/ id="li\d+"/g,'')     // 每块都从 li0 开始，id 由 paintHeadings 整篇重编
    .replace(/<input type="checkbox" disabled/g,'<input type="checkbox"');
}

function paintHeadings(host){
  if(!host) return;
  let k = 0;
  host.querySelectorAll('.blk-view h1,.blk-view h2,.blk-view h3,.blk-view h4,.blk-view h5,.blk-view h6')
    .forEach(h=>{ h.id = 'h'+(k++); });
  // 列表项也要 id：大纲面板里点「- 分支」能直接跳到那一行
  let j = 0;
  host.querySelectorAll('.blk-view li').forEach(li=>{ li.id = 'li'+(j++); });
}

/* 空块只被加了前缀（# / - / > / 1. …）却一直没写字：收起编辑态时顺手清掉，
   否则正文里会一直挂着一行「# 一级标题」这样的灰色提示 */
function isBarePrefix(raw){
  const v = String(raw||'').trim();
  if(!v) return true;
  return BLOCK_HINTS.some(([re])=>re.test(v)) || /^(#{1,6}|[-*+]|1\.|>|- \[ \])$/.test(v);
}
function dropBarePrefixBlock(i){
  const host = liveHost(); if(!host) return;
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  if(el.classList.contains('editing')) return;          // 又回到编辑了，别打扰
  if(document.getElementById('popover')?.classList.contains('open')) return;
  const raw = LIVE.raws[i];
  // 有真实正文就别动；空块 / 只剩前缀的块都要把占位提示收起来
  if(raw && raw.trim() && !isBarePrefix(raw)) return;
  LIVE.raws[i] = '';
  const view = el.querySelector('.blk-view');
  if(view) view.innerHTML = '<p class="lv-hint" style="margin:0">&nbsp;</p>';
  const ta = el.querySelector('.blk-src');
  if(ta){ ta.value = ''; ta.classList.remove('has-hint'); }
  // 占位提示（「# 一级标题」等）也要一起收掉，否则失焦后会一直留在页面上
  const hint = el.querySelector('.blk-hint');
  if(hint){ hint.style.display = 'none'; hint.innerHTML = ''; }
  syncBody(); save();
}

function growTa(ta){
  if(!ta) return;
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
/* 空块加了标题/列表前缀后，用灰字提示该写什么；一旦输入就消失 */
const BLOCK_HINTS = [
  [/^######\s?$/, '六级标题', '###### '],
  [/^#####\s?$/,  '五级标题', '##### '],
  [/^####\s?$/,   '四级标题', '#### '],
  [/^###\s?$/,    '三级标题', '### '],
  [/^##\s?$/,     '二级标题', '## '],
  [/^#\s?$/,      '一级标题', '# '],
  [/^- \[ \]\s?$/, '待办事项', '- [ ] '],
  [/^[-*+]\s?$/,  '列表项', '- '],
  [/^\d+\.\s?$/,  '编号列表', '1. '],
  [/^>\s?$/,      '引用', '> ']
];
// 量一下这类块渲染后真实的字号/字重（判断用，不写进正文）
function probeBlockStyle(kind){
  const map = {
    h1:'<h1>x</h1>', h2:'<h2>x</h2>', h3:'<h3>x</h3>', h4:'<h4>x</h4>', h5:'<h5>x</h5>', h6:'<h6>x</h6>',
    ul:'<ul><li>x</li></ul>', ol:'<ol><li>x</li></ol>', todo:'<ul><li>x</li></ul>',
    quote:'<blockquote><p>x</p></blockquote>'
  };
  const html = map[kind]; if(!html) return null;
  const box = document.createElement('div');
  box.className = 'prose';
  box.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none';
  box.innerHTML = html;
  document.body.appendChild(box);
  const el = box.querySelector('li, p, h1, h2, h3, h4, h5, h6') || box.firstElementChild;
  const cs = getComputedStyle(el);
  const out = { fontSize:cs.fontSize, lineHeight:cs.lineHeight, fontWeight:cs.fontWeight, fontFamily:cs.fontFamily };
  box.remove();
  return out;
}
function updateBlockHint(ta){
  if(!ta || !ta.closest) return;
  const el = ta.closest('.blk');
  const hint = el && el.querySelector('.blk-hint');
  if(!hint) return;
  const hit = BLOCK_HINTS.find(([re])=>re.test(ta.value));
  if(hit){
    hint.innerHTML = `<span class="hp">${esc(hit[2])}</span><span class="ht">${esc(hit[1])}</span>`;
    hint.style.fontSize = ta.style.fontSize || '';
    hint.style.lineHeight = ta.style.lineHeight || '';
    hint.style.fontWeight = ta.style.fontWeight || '';
    hint.style.fontFamily = ta.style.fontFamily || '';
    hint.style.display = 'block';
    ta.classList.add('has-hint');
  }else{
    hint.style.display = 'none';
    hint.innerHTML = '';
    ta.classList.remove('has-hint');
  }
  if(ta.classList.contains('blk-src')) syncTodoChk(el, ta);
}

/* ---- 渲染 ---- */
function renderLive(){
  const n = noteById(S.active); const host = liveHost();
  if(!n || !host) return;
  commitAnyEditing();
  const blocks = parseBlocks(n.body);
  LIVE.raws = blocks.length ? blocks.map(b=>b.lines.join('\n')) : [''];
  // 记住块之间原本隔了几个空行，保存时原样还原，绝不擅自把单换行改成空行
  LIVE.gaps = blocks.length ? blocks.map((b,i)=> i===0 ? 0 : Math.max(0, b.start - blocks[i-1].end)) : [0];
  paintLive();
  histSyncNote();
}

let SELDOWN = null;
document.addEventListener('mouseup', e=>{
  const d = SELDOWN; SELDOWN = null;
  if(!d) return;
  // 拖过（选文字）或双击（选词）都不进编辑；只有"点一下没挪"才算要改这一块
  if(Math.abs(e.clientX - d.x) > 4 || Math.abs(e.clientY - d.y) > 4) return;
  if(e.detail > 1) return;
  editBlock(d.i, d.x, d.y);
});

/* 跨块复制：给富文本 + markdown 两种格式 */
document.addEventListener('copy', e=>{
  const r = liveSelRange();
  if(!r) return;
  const host = liveHost();
  if(!host) return;
  const blocks = [...host.querySelectorAll('.blk')];
  const a = blocks.findIndex(b=>b.contains(r.startContainer));
  const b = blocks.findIndex(b=>b.contains(r.endContainer));
  if(a < 0 || b < 0) return;
  const grabHtml = ()=>{
    try{
      const wrap = document.createElement('div');
      wrap.appendChild(r.cloneContents());
      return wrap.innerHTML;
    }catch(err){ return ''; }
  };
  if(a === b){
    // 单块内：额外塞一份 markdown 源，粘回本编辑器时加粗/链接不会丢
    const raw = LIVE.raws[a] || '';
    const rg = mapSelToRaw(raw, r.toString());
    if(!rg) return;                      // 映射不出来就让浏览器按默认来
    // 选区正好落在 **加粗** 这种标记里面时，把成对标记一起带上，粘回去格式才不会丢
    let s0 = rg.start, e0 = rg.end;
    ['**','~~','==','*','`'].forEach(t=>{
      if(raw.slice(s0 - t.length, s0) === t && raw.slice(e0, e0 + t.length) === t){ s0 -= t.length; e0 += t.length; }
    });
    e.clipboardData.setData('text/plain', r.toString());
    const html = grabHtml(); if(html) e.clipboardData.setData('text/html', html);
    try{ e.clipboardData.setData('text/x-ivy-md', raw.slice(s0, e0)); }catch(err){}
    e.preventDefault();
    return;
  }
  const md = LIVE.raws.slice(a, b+1).join('\n');
  // 纯文本按块拼接，用换行隔开：直接 sel.toString() 在块级元素之间常常一根换行都没有
  const plain = blocksSelText(blocks, r, a, b) || window.getSelection().toString() || md;
  e.clipboardData.setData('text/plain', plain);
  // 富文本也只取渲染层，别把 textarea / 占位提示这些编辑器零件粘到别人那儿去
  const parts = [];
  for(let i = a; i <= b; i++){
    const v = blocks[i].querySelector('.blk-view');
    if(v) parts.push('<div>' + v.innerHTML + '</div>');
  }
  if(parts.length) e.clipboardData.setData('text/html', parts.join(''));
  try{ e.clipboardData.setData('text/x-ivy-md', md); }catch(err){}
  e.preventDefault();
});

/* 预览态的块是只读 div，浏览器没有可编辑目标：
   ⌘C 能复制、⌘X 删不掉、⌘V 什么都不发生。这里补上剪贴板三件套。 */
function liveSelRange(){
  if((S.mode || 'live') !== 'live') return null;
  const host = liveHost(); if(!host) return null;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if(!host.contains(r.startContainer) || !host.contains(r.endContainer)) return null;
  return r;
}
/* 只有「焦点在输入框里并且已经选了字」才算是真的在编辑：
   预览态的块是只读 div，光标常常停在某个隐藏 textarea 上，那种情况要自己接管 */
function inRealEditor(){
  const ae = document.activeElement;
  if(!ae) return false;
  if(ae.isContentEditable) return true;
  if(ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT'){
    // 预览块里的输入框即使没有选中文字（光标停在空块里）也是在编辑，
    // 旧逻辑把它当成「不在编辑器」，于是 ⌘V 被全局捕获、粘到最后一节去了
    if(ae.classList && ae.classList.contains('blk-src')) return true;
    try{ return typeof ae.selectionStart === 'number' && ae.selectionStart !== ae.selectionEnd; }catch(e){ return true; }
  }
  return false;
}
function focusInField(){
  const ae = document.activeElement;
  return !!(ae && (ae.isContentEditable || ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT'));
}
/* 真正「看得见」的输入焦点：预览态里那个隐藏的块输入框有时还留着焦点，
   把粘贴丢进去等于什么都没发生 —— 用户看到的就是「粘贴为空」 */
function focusedVisibleField(){
  const ae = document.activeElement;
  if(!ae) return false;
  if(!(ae.isContentEditable || ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')) return false;
  const r = ae.getBoundingClientRect();
  return r.width > 4 && r.height > 4;
}
/* 预览态的块是只读 div：以前只有 cut/paste 的接管，漏了 copy。
   浏览器对非可编辑元素里的选区不保证写进剪贴板，于是「复制后粘贴为空」。
   这里和剪切用同一套取文本逻辑，只写剪贴板、不动正文。 */
document.addEventListener('copy', e=>{
  if((S.mode || 'live') !== 'live') return;
  const r = liveSelRange();
  if(!r || inRealEditor()) return;
  const host = liveHost();
  const blocks = host ? [...host.querySelectorAll('.blk')] : [];
  const a = blocks.findIndex(b=>b.contains(r.startContainer));
  const b = blocks.findIndex(b=>b.contains(r.endContainer));
  const p = copyPayload(r);
  if(!p) return;
  let done = false;
  try{
    if(e.clipboardData){
      e.clipboardData.setData('text/plain', p.plain);
      if(p.html) e.clipboardData.setData('text/html', p.html);
      e.clipboardData.setData('text/x-ivy-md', p.md);
      LAST_COPY = p;
      done = true;
    }
  }catch(err){}
  if(done) e.preventDefault();
  else writeClipRich(p.plain, p.md, p.html);
});
document.addEventListener('cut', e=>{
  const r = liveSelRange();
  if(!r || inRealEditor()) return;
  const host = liveHost();
  const blocks = host ? [...host.querySelectorAll('.blk')] : [];
  const a = blocks.findIndex(b=>b.contains(r.startContainer));
  const b = blocks.findIndex(b=>b.contains(r.endContainer));
  const txt = (a >= 0 && b >= 0 && a !== b) ? blocksSelText(blocks, r, a, b) : window.getSelection().toString();
  if(!txt) return;
  try{
    e.clipboardData.setData('text/plain', txt);
    const md = liveSelMd(r);
    if(md) e.clipboardData.setData('text/x-ivy-md', md);
  }catch(err){}
  e.preventDefault();
  if(deleteLiveSelection()) toast('已剪切');
});
document.addEventListener('paste', e=>{
  /* 隐形捕获框：预览态没有可编辑元素，⌘V 原本什么都不会发生。
     这里临时放一个聚焦的 textarea 接住原生粘贴 —— 原生粘贴不需要任何剪贴板权限，
     比 navigator.clipboard.readText() 稳得多（后者被拒就什么都不粘）。 */
  if(PASTE_CATCH && e.target === PASTE_CATCH.ta){
    const at = PASTE_CATCH.at;
    const cd = e.clipboardData;
    e.preventDefault();
    const files = [...((cd && cd.files) || [])];
    const text = (cd && (cd.getData('text/x-ivy-md') || cd.getData('text/plain'))) || '';
    endPasteCatcher();
    if(files.length){ insertFiles(files, null).then(insertToast); return; }
    if(text){
      const md = (LAST_COPY && text === LAST_COPY.plain) ? LAST_COPY.md : text;
      pasteIntoLive(md, at || null);
    }
    else toast('剪贴板里没有文字');
    return;
  }
  if((S.mode || 'live') !== 'live') return;
  // 焦点在「看不见的块输入框」里不算在编辑：那种情况粘贴会被吞掉，得我们自己接管
  if(inRealEditor() && focusedVisibleField()) return;
  const host = liveHost(); if(!host) return;
  const cd = e.clipboardData;
  if(!cd) return;
  const files = [...(cd.files || [])];
  if(files.length){ e.preventDefault(); insertFiles(files, null).then(insertToast); return; }
  const text = cd.getData('text/x-ivy-md') || cd.getData('text/plain') || '';
  if(!text) return;
  e.preventDefault();
  pasteIntoLive(text);
}, true);
let CLIP_AT = null;                     // 剪切时记住位置，⌘V 才能粘回原处
let PASTE_CATCH = null;                 // 隐形捕获框（见上面的 paste 监听）
function startPasteCatcher(at){
  endPasteCatcher();
  const ta = document.createElement('textarea');
  ta.setAttribute('aria-hidden', 'true');
  ta.setAttribute('tabindex', '-1');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  PASTE_CATCH = { ta, at: at || null, t: 0 };
  // 有的浏览器不派发 paste 事件但照样插进文本框，input 兜一层，别漏
  ta.addEventListener('input', ()=>{
    if(!PASTE_CATCH || PASTE_CATCH.ta !== ta) return;
    const txt = ta.value, keep = PASTE_CATCH.at;
    if(!txt) return;
    endPasteCatcher();
    pasteIntoLive(txt, keep || null);
  });
  try{ ta.focus({ preventScroll:true }); }catch(e){ try{ ta.focus(); }catch(err){} }
  // 1.4 秒还没等到 paste（剪贴板空的 / 浏览器拦了）就退回收粘贴框
  PASTE_CATCH.t = setTimeout(()=>{
    if(!PASTE_CATCH || PASTE_CATCH.ta !== ta) return;
    const keep = PASTE_CATCH.at;
    endPasteCatcher();
    openPasteDlg({ kind:'live', at: keep });
  }, 1400);
}
function endPasteCatcher(){
  if(!PASTE_CATCH) return;
  clearTimeout(PASTE_CATCH.t);
  try{ PASTE_CATCH.ta.remove(); }catch(e){}
  PASTE_CATCH = null;
}
/* ===== 剪贴板三件套（预览态的块是只读 div，⌘C/⌘X/⌘V 都得自己接管） =====
   取「按块拼出来的纯文本」而不是 sel.toString()：块与块之间那个换行不能丢。 */
function blocksSelText(blocks, r, a, b){
  if(a === b) return r.toString();
  const out = [];
  for(let i = a; i <= b; i++){
    const view = blocks[i].querySelector('.blk-view');
    if(!view) continue;
    const rr = document.createRange();
    if(i === a){ rr.setStart(r.startContainer, r.startOffset); rr.setEnd(view, view.childNodes.length); }
    else if(i === b){ rr.setStart(view, 0); rr.setEnd(r.endContainer, r.endOffset); }
    else rr.selectNodeContents(view);
    out.push(rr.toString());
  }
  return out.join('\n');
}
function liveSelText(){
  const r = liveSelRange();
  if(!r) return '';
  const host = liveHost(); if(!host) return window.getSelection().toString();
  const blocks = [...host.querySelectorAll('.blk')];
  const a = blocks.findIndex(b=>b.contains(r.startContainer));
  const b = blocks.findIndex(b=>b.contains(r.endContainer));
  if(a < 0 || b < 0) return window.getSelection().toString();
  return blocksSelText(blocks, r, a, b);
}
function selPlainText(){
  const c = SELBAR.ctx;
  if(c && c.kind === 'ta'){
    try{ return c.ta.value.slice(c.s, c.e); }catch(e){ return ''; }
  }
  return liveSelText();
}
function writeClip(text){
  const fallback = ()=>{
    // 用临时 textarea 兜底会抢走选区，复制完把原来的选区放回去，不然紧接着的「剪切」就没目标了
    const sel = window.getSelection();
    const saved = [];
    try{ for(let i=0;i<sel.rangeCount;i++) saved.push(sel.getRangeAt(i).cloneRange()); }catch(e){}
    let ok = false;
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }catch(e){ ok = false; }
    try{
      if(saved.length){ sel.removeAllRanges(); saved.forEach(r=>sel.addRange(r)); }
    }catch(e){}
    return ok;
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true, ()=>fallback());
  }
  return Promise.resolve(fallback());
}
/* 最近一次复制的三种格式。自定义 MIME 在很多浏览器写不进系统剪贴板，
   但同一页内粘贴可以靠它把 Markdown 源找回来，不至于掉格式。 */
let LAST_COPY = null;
async function writeClipRich(plain, md, html){
  LAST_COPY = { plain: plain, md: md || plain, html: html || '' };
  if(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
    const base = { 'text/plain': new Blob([plain], { type:'text/plain' }) };
    if(html) base['text/html'] = new Blob([html], { type:'text/html' });
    try{
      const all = Object.assign({}, base, { 'text/x-ivy-md': new Blob([LAST_COPY.md], { type:'text/x-ivy-md' }) });
      await navigator.clipboard.write([new ClipboardItem(all)]);
      return true;
    }catch(e){}
    try{
      await navigator.clipboard.write([new ClipboardItem(base)]);
      return true;
    }catch(e){}
  }
  return writeClip(plain);
}
function copyPayload(r){
  const plain = liveSelText() || window.getSelection().toString();
  if(!plain) return null;
  const md = (r && liveSelMd(r)) || plain;
  const html = r ? liveSelHtml(r) : '';
  return { plain, md, html };
}
function clipCopySel(){
  const text = selPlainText();
  if(!text) return toast('先选中要复制的内容');
  writeClip(text).then(ok=>toast(ok ? '已复制' : '浏览器不让写剪贴板'));
}
function clipCutSel(){
  const c = SELBAR.ctx;
  const text = selPlainText();
  if(!text) return toast('先选中要剪切的内容');
  hideSelBar();
  if(c && c.kind === 'ta'){
    const ta = c.ta, v = ta.value;
    ta.value = v.slice(0, c.s) + v.slice(c.e);
    ta.focus();
    try{ ta.setSelectionRange(c.s, c.s); }catch(e){}
    ta.dispatchEvent(new Event('input', { bubbles:true }));
    writeClip(text).then(ok=>toast(ok ? '已剪切' : '已剪切，但浏览器不让写剪贴板'));
    return;
  }
  // 先删再写：删的是当前 DOM 选区，写剪贴板有可能把选区抢走
  const r = liveSelRange();
  const at = r ? liveSelStart(r) : null;
  if(deleteLiveSelection()){
    CLIP_AT = at;
    writeClip(text).then(ok=>toast(ok ? '已剪切' : '已剪切，但浏览器不让写剪贴板'));
  }
}
/* 粘贴目标：优先当前选区/光标所在的输入框，其次预览区，最后源码框。
   noSel=true 时不认浮动条里残留的选区（从菜单进来的场景）。 */
function pasteTarget(noSel){
  const bar = document.getElementById('selBar');
  const c = (!noSel && bar && bar.classList.contains('open')) ? SELBAR.ctx : null;
  const ae = document.activeElement;
  if(c && c.kind === 'ta' && c.ta) return { kind:'ta', ta:c.ta, s:c.s, e:c.e };
  if(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')){
    const s = typeof ae.selectionStart === 'number' ? ae.selectionStart : ae.value.length;
    const e = typeof ae.selectionEnd === 'number' ? ae.selectionEnd : s;
    return { kind:'ta', ta:ae, s, e };
  }
  if((S.mode || 'live') === 'live'){
    const r = liveSelRange();
    return { kind:'live', at: r ? liveSelStart(r) : null };
  }
  const src = document.getElementById('source');
  if(src) return { kind:'ta', ta:src, s:src.selectionStart || 0, e:src.selectionEnd || 0 };
  return null;
}
function applyPaste(text, tgt){
  const t = tgt || pasteTarget();
  if(!t) return false;
  if(t.kind === 'ta'){
    const ta = t.ta, s = Math.min(t.s, ta.value.length), e = Math.min(t.e, ta.value.length);
    ta.focus();
    try{ ta.setSelectionRange(s, e); }catch(err){}
    if(typeof ta.setRangeText === 'function'){
      ta.setRangeText(text, s, e, 'end');
    }else{
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
      try{ ta.setSelectionRange(s + text.length, s + text.length); }catch(err){}
    }
    ta.dispatchEvent(new Event('input', { bubbles:true }));
    return true;
  }
  pasteIntoLive(text, t.at || null);
  return true;
}
let PST_TGT = null;
function openPasteDlg(tgt){
  const ov = document.getElementById('pasteOv'); if(!ov) return;
  PST_TGT = tgt || pasteTarget();
  const ta = document.getElementById('pstTa');
  if(ta) ta.value = '';
  const err = document.getElementById('pstErr'); if(err) err.textContent = '';
  const desc = document.getElementById('pstDesc');
  if(desc) desc.innerHTML = OL_TOUCH
    ? '光标放进下面的框，<b>长按</b>选「粘贴」，粘上就自动插入。'
    : '浏览器不给读剪贴板，换个稳妥办法：光标放进下面的框，按 <b>⌘V</b> / <b>Ctrl+V</b>，粘上就自动插入。';
  ov.classList.add('open');
  setTimeout(()=>{ try{ ta.focus(); }catch(e){} }, 40);
}
function closePasteDlg(){
  const ov = document.getElementById('pasteOv'); if(ov) ov.classList.remove('open');
  PST_TGT = null;
}
/* 剪贴板读不出来时走这里：粘贴框里是真正的输入框，原生 ⌘V 一定好使 */
function clipPasteSel(){
  const tgt = pasteTarget();
  hideSelBar();
  if(!navigator.clipboard || !navigator.clipboard.readText) return openPasteDlg(tgt);
  navigator.clipboard.readText().then(t=>{
    if(t) applyPaste(t, tgt);
    else openPasteDlg(tgt);
  }, ()=>openPasteDlg(tgt));
}
document.addEventListener('keydown', e=>{
  if(!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || e.isComposing) return;
  const k = String(e.key || '').toLowerCase();
  if(k !== 'c' && k !== 'x' && k !== 'v') return;
  if((S.mode || 'live') !== 'live' || (inRealEditor() && focusedVisibleField())) return;
  if(!S.active) return;
  const sel = liveSelRange();
  // ⌘C：只读预览里浏览器不一定把选区写进剪贴板，自己写一份（含跨块换行）
  if(k === 'c'){
    const p = copyPayload(sel);
    if(!p) return;
    e.preventDefault();
    writeClipRich(p.plain, p.md, p.html);
    return;
  }
  if(k === 'x'){
    if(!sel) return;
    e.preventDefault();
    const txt = liveSelText() || window.getSelection().toString();
    const at = liveSelStart(sel);
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(err){}
    if(!ok && txt) writeClip(txt);                  // execCommand 被拒时补一次写剪贴板
    if(deleteLiveSelection()){ CLIP_AT = at; toast('已剪切'); }
    return;
  }
  // ⌘V：预览态的块不是可编辑元素，浏览器不会派发 paste 事件
  if(focusedVisibleField() && !sel && !CLIP_AT) return;      // 标题 / 块内输入框里粘贴，交给浏览器
  const at = CLIP_AT || (sel ? liveSelStart(sel) : null);
  CLIP_AT = null;
  /* 这里千万不能 preventDefault：要放行原生粘贴，让它落进刚聚焦的隐形框。
     （之前靠 navigator.clipboard.readText()，权限一被拒就什么都不粘，看起来就是"粘贴为空"）*/
  startPasteCatcher(at);
  tryClipboardPaste(at);
}, true);
/* 有的浏览器（尤其 PWA / WKWebView）不给隐藏捕获框派发 paste 事件，
   光标停在只读 div 上就什么都粘不进去。再开一路：直接读剪贴板。
   两条路谁先拿到谁生效，另一条通过 PASTE_CATCH 是否还在来判断。 */
async function tryClipboardPaste(at){
  if(!navigator.clipboard || !navigator.clipboard.readText) return;
  try{
    const txt = await Promise.race([
      navigator.clipboard.readText(),
      new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), 800))
    ]);
    if(!txt || !PASTE_CATCH) return;          // 原生 paste 已经处理掉了
    const keep = PASTE_CATCH.at || at || null;
    endPasteCatcher();
    const md = (LAST_COPY && txt === LAST_COPY.plain) ? LAST_COPY.md : txt;
    pasteIntoLive(md, keep);
  }catch(e){ /* 权限被拒就交给原来的隐形框 / 粘贴弹窗兜底 */ }
}
function liveSelStart(r){
  const host = liveHost();
  if(!host || !r) return null;
  const p = blockPoint(r.startContainer, r.startOffset, false);
  if(!p) return null;
  const view = host.querySelector('.blk[data-i="' + p.i + '"] .blk-view');
  const plain = view ? view.textContent : '';
  return { i:p.i, pos:cutBefore(LIVE.raws[p.i] || '', plain.slice(0, Math.min(p.off, plain.length))) };
}

/* 选区跨块时给出 markdown 源，粘回编辑器不丢加粗/链接 */
/* 选中区对应的 Markdown 源码（同一个块里也要按可见文字偏移切出来，
   不能只在跨块时才给源，否则复制加粗/链接再粘贴就掉格式） */
function liveSelMd(r){
  const host = liveHost(); if(!host) return '';
  const blocks = [...host.querySelectorAll('.blk')];
  const p1 = blockPoint(r.startContainer, r.startOffset, false);
  const p2 = blockPoint(r.endContainer, r.endOffset, true);
  if(!p1 || !p2) return '';
  const raw1 = String(LIVE.raws[p1.i] || ''), raw2 = String(LIVE.raws[p2.i] || '');
  const v1 = blocks[p1.i] && blocks[p1.i].querySelector('.blk-view');
  const v2 = blocks[p2.i] && blocks[p2.i].querySelector('.blk-view');
  // 用统一的「可见偏移 → Markdown 偏移」映射：cutBefore/cutAfter 依赖整段纯文本
  // 能在 raw 里原样找到，一旦有 ** 加粗、链接、标题前缀就找不到，会把选区截成空。
  const pos1 = visToRaw(raw1, p1.off);
  const pos2 = visToRaw(raw2, p2.off);
  if(p1.i === p2.i) return healInline(raw1.slice(pos1, Math.max(pos1, pos2)));
  const mid = LIVE.raws.slice(p1.i + 1, p2.i);
  return healInline([raw1.slice(pos1), ...mid, raw2.slice(0, pos2)].join('\n'));
}
/* 选区的富文本 HTML：贴到微信 / 备忘录 / Word 时保留加粗、标题、列表样式 */
function liveSelHtml(r){
  try{
    const frag = r.cloneContents();
    const div = document.createElement('div');
    div.appendChild(frag);
    div.removeAttribute('id');
    return div.innerHTML;
  }catch(e){ return ''; }
}
function pasteIntoLive(text, at0){
  let at = at0 || null;
  const r = liveSelRange();
  if(r){
    const host = liveHost();
    const p = blockPoint(r.startContainer, r.startOffset, false);
    if(p){
      const view = host.querySelector('.blk[data-i="' + p.i + '"] .blk-view');
      const plain = view ? view.textContent : '';
      at = { i:p.i, pos:cutBefore(LIVE.raws[p.i] || '', plain.slice(0, Math.min(p.off, plain.length))) };
    }
    deleteLiveSelection();
  }
  if(!LIVE.raws.length) LIVE.raws = [''];
  if(!at) at = { i:LIVE.raws.length - 1, pos:(LIVE.raws[LIVE.raws.length - 1] || '').length };
  if(at.i >= LIVE.raws.length) at = { i:LIVE.raws.length - 1, pos:1e9 };
  const i = Math.max(0, Math.min(LIVE.raws.length - 1, at.i));
  const raw = LIVE.raws[i] || '';
  const pos = Math.max(0, Math.min(at.pos, raw.length));
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  if(lines.length === 1){
    LIVE.raws[i] = raw.slice(0, pos) + lines[0] + raw.slice(pos);
  }else{
    const head = raw.slice(0, pos) + lines[0];
    const tail = lines[lines.length - 1] + raw.slice(pos);
    const mid = lines.slice(1, -1);
    LIVE.raws.splice(i, 1, head, ...mid, tail);
    const g = LIVE.gaps || []; g.splice(i, 1, ...new Array(mid.length + 2).fill(0));
    LIVE.gaps = g;
  }
  syncBody();
  renderLive();
  toast('已粘贴');
}

/* 预览态里的块是只读 div，原生选区按删除没反应 → 手动按 markdown 源删 */
function viewOffset(view, node, offset){
  try{
    const r = document.createRange();
    r.selectNodeContents(view);
    r.setEnd(node, offset);
    return r.toString().length;
  }catch(e){ return 0; }
}
function blockPoint(node, offset, isEnd){
  const host = liveHost(); if(!host) return null;
  const blocks = [...host.querySelectorAll('.blk')];
  if(!blocks.length) return null;
  if(node === host){
    return isEnd ? { i: blocks.length - 1, off: 1e9 } : { i: 0, off: 0 };
  }
  const i = blocks.findIndex(b=>b.contains(node));
  if(i < 0) return null;
  const view = blocks[i].querySelector('.blk-view');
  if(!view || node === blocks[i] || !view.contains(node)){
    const len = view ? view.textContent.length : 0;
    return { i, off: isEnd ? len : 0 };
  }
  return { i, off: viewOffset(view, node, offset) };
}
// 把「渲染后的文本」对齐回 markdown 源，返回应截断的源位置
function cutBefore(raw, plain){
  if(!plain) return 0;
  const at = raw.indexOf(plain);
  if(at >= 0) return at + plain.length;
  for(let k = plain.length - 1; k > 1; k--){
    const at2 = raw.indexOf(plain.slice(-k));
    if(at2 >= 0) return at2 + k;
  }
  return 0;
}
function cutAfter(raw, plain){
  if(!plain) return raw.length;
  const at = raw.lastIndexOf(plain);
  if(at >= 0) return at;
  for(let k = plain.length - 1; k > 1; k--){
    const at2 = raw.lastIndexOf(plain.slice(0, k));
    if(at2 >= 0) return at2;
  }
  return raw.length;
}
// 截断可能切坏成对的 ** == ~~ ` ，补一下
function healInline(s){
  ['**','~~','==','`'].forEach(tok=>{
    const cnt = s.split(tok).length - 1;
    if(cnt % 2 === 1){
      const at = s.lastIndexOf(tok);
      if(at >= 0) s = s.slice(0, at) + s.slice(at + tok.length);
    }
  });
  return s;
}
function deleteLiveSelection(){
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.isContentEditable)) return false;
  if((S.mode || 'live') !== 'live') return false;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const host = liveHost();
  if(!host) return false;
  const range = sel.getRangeAt(0);
  if(!host.contains(range.startContainer) || !host.contains(range.endContainer)) return false;
  const p1 = blockPoint(range.startContainer, range.startOffset, false);
  const p2 = blockPoint(range.endContainer, range.endOffset, true);
  if(!p1 || !p2) return false;
  let a = p1.i, b = p2.i, offA = p1.off, offB = p2.off;
  if(a > b || (a === b && offA > offB)){ const t = a; a = b; b = t; const u = offA; offA = offB; offB = u; }
  if(!LIVE.raws.length || LIVE.raws[a] == null || LIVE.raws[b] == null) return false;

  const viewA = host.querySelector('.blk[data-i="'+a+'"] .blk-view');
  const viewB = host.querySelector('.blk[data-i="'+b+'"] .blk-view');
  const textA = viewA ? viewA.textContent : '';
  const textB = viewB ? viewB.textContent : '';
  const headPlain = textA.slice(0, Math.min(offA, textA.length));
  const tailPlain = textB.slice(Math.min(offB, textB.length));

  const rawA = LIVE.raws[a], rawB = LIVE.raws[b];
  const cut0 = cutBefore(rawA, headPlain);
  const cut1 = cutAfter(rawB, tailPlain);
  if(a === b && cut1 < cut0) return false;

  const merged = healInline(
    a === b ? rawA.slice(0, cut0) + rawA.slice(cut1)
            : rawA.slice(0, cut0) + rawB.slice(cut1)
  );

  const restAfter = LIVE.raws.slice(b + 1);
  const gapsAfter = (LIVE.gaps || []).slice(b + 1);
  const gapA = (LIVE.gaps && LIVE.gaps[a]) || 0;
  const raws = LIVE.raws.slice(0, a);
  const gaps = (LIVE.gaps || []).slice(0, a);
  if(a === b || merged !== ''){ raws.push(merged); gaps.push(gapA); }
  else if(raws.length === 0 && restAfter.length === 0){ raws.push(''); gaps.push(0); }
  restAfter.forEach((r,k)=>{ raws.push(r); gaps.push(gapsAfter[k]); });

  LIVE.raws = raws; LIVE.gaps = gaps;
  syncBody();
  renderLive();
  const idx = Math.max(0, Math.min(a, LIVE.raws.length - 1));
  const caret = Math.min(cut0, LIVE.raws[idx] ? LIVE.raws[idx].length : 0);
  sel.removeAllRanges();
  focusBlock(idx, caret);
  return true;
}
document.addEventListener('keydown', e=>{

function paintLive(){

function rebuild(focusIdx, caret){

function blockEl(raw, i, only){

  });
  ta.addEventListener('input', ()=>{

    slashMaybe(ta); dueMaybe(ta); syncTodoChk(el, ta);

/* ---- 进入 / 离开编辑 ---- */
function editBlock(i, x, y, caret){
  const host = liveHost(); if(!host) return;
  if(LIVE.editing>=0 && LIVE.editing!==i) closeEditing();
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  const ta = el.querySelector('.blk-src');
  // 必须先算光标位置：加了 editing 后 .blk-view 就 display:none 了，量不到
  let off;
  if(caret==='end') off = ta.value.length;
  else if(typeof caret === 'number') off = caret;
  else off = offsetFromPoint(el.querySelector('.blk-view'), ta.value, x, y);
  // 换源码态时沿用这一块渲染后的字号/行高/字重，视觉上不跳
  const ref = el.querySelector('.blk-view').firstElementChild;
  if(ref){
    try{
      const cs = getComputedStyle(ref);
      ta.style.fontSize = cs.fontSize;
      ta.style.lineHeight = cs.lineHeight;
      ta.style.fontWeight = cs.fontWeight;
      ta.style.fontFamily = cs.fontFamily;
    }catch(e){}
  }
  el.classList.add('editing');
  LIVE.editing = i; LIVE.ta = ta;
  growTa(ta);
  ta.focus();
  off = Math.max(0, Math.min(off, ta.value.length));
  try{ ta.setSelectionRange(off, off); }catch(e){}
  updateBlockHint(ta);
}

function closeEditing(){
  if(LIVE.editing<0) return;
  const i = LIVE.editing;
  LIVE.editing = -1; LIVE.ta = null;
  commitBlock(i);
}

function commitAnyEditing(){
  if(LIVE.editing>=0 && LIVE.ta && LIVE.ta.isConnected){
    LIVE.ta.value = trimRaw(LIVE.ta.value);
    LIVE.raws[LIVE.editing] = LIVE.ta.value;
    LIVE.editing = -1; LIVE.ta = null;
    syncBody();
  }
  LIVE.editing = -1; LIVE.ta = null;
}

function trimRaw(raw){
  const lines = String(raw).split('\n');
  const isEmptyItem = l => /^\s*([-*+]|\d+\.)\s*(\[[ xX]\]\s*)?$/.test(l);
  if(!lines.every(isEmptyItem)) {
    while(lines.length > 1 && isEmptyItem(lines[lines.length-1])) lines.pop();
  } else if(lines.length){
    return '';
  }
  return lines.join('\n');
}

function commitBlock(i){
  const host = liveHost(); if(!host) return;
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  const ta = el.querySelector('.blk-src');
  ta.value = trimRaw(ta.value);
  // 只有前缀没有正文（点了标题/列表却没写）→ 当成空块，别在正文里留下 "#" 这种残渣
  if(ta.value.trim() && isBarePrefix(ta.value)) ta.value = '';
  updateBlockHint(ta);                 // 收掉「# 一级标题」这类占位文字
  LIVE.raws[i] = ta.value;
  el.classList.remove('editing', 'show-tchk');
  const view = el.querySelector('.blk-view');
  view.innerHTML = ta.value.trim()
    ? mdBlock(ta.value)
    : '<p class="lv-hint" style="margin:0">&nbsp;</p>';
  if(LIVE.editing===i){ LIVE.editing = -1; LIVE.ta = null; }
  paintHeadings(host);
  syncBody();
}

function openWikiPop(ta, query, from){
  const q = String(query||'').trim().toLowerCase();
  const pool = S.notes
    .filter(n=>!n.trashed && !n.deleted && n.id!==S.active && (n.title||'').trim())
    .filter(n=> !q || (n.title||'').toLowerCase().includes(q));
  // 前缀命中的排前面，其余按最近编辑
  const byRecent = (a,b)=>(b.updatedAt||0)-(a.updatedAt||0);
  const head = pool.filter(n=>(n.title||'').toLowerCase().startsWith(q)).sort(byRecent);
  const rest = pool.filter(n=>!(n.title||'').toLowerCase().startsWith(q)).sort(byRecent);
  WIKI.items = head.concat(rest).slice(0, 6).map(n=>({title:n.title, id:n.id, create:false}));
  // 「新建」永远排在最后，回车默认选已有笔记
  if(q && !WIKI.items.some(it=>it.title.toLowerCase()===q)) WIKI.items.push({title:q, create:true});
  WIKI.open = true; WIKI.idx = 0; WIKI.ta = ta; WIKI.from = from;
  paintWikiPop();
}

function detectWiki(ta){
  const caret = ta.selectionStart;
  const before = ta.value.slice(0, caret);
  const m = before.match(/\[\[([^\[\]\n]{0,40})$/);
  if(m) openWikiPop(ta, m[1], caret - m[0].length);
  else closeWikiPop();
}

function pickWiki(){
  const ta = WIKI.ta;
  if(!ta) { closeWikiPop(); return; }
  const it = WIKI.items[WIKI.idx] || {title:''};
  const title = (it.title||'').trim();
  if(!title){ closeWikiPop(); return; }
  const caret = ta.selectionStart;
  ta.setRangeText('[[' + title + ']]', WIKI.from, caret, 'end');
  const i = parseInt(ta.dataset.i, 10) || 0;
  LIVE.raws[i] = ta.value;
  closeWikiPop();
  growTa(ta); syncBody(); ta.focus();
}

function onBlockKey(e, i, ta, el){
  if(e.isComposing || e.keyCode===229) return;

  if(slashKey(e, ta)) return;

  if(WIKI.open && WIKI.ta === ta){
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const n = WIKI.items.length || 1;
      WIKI.idx = (WIKI.idx + (e.key==='ArrowDown' ? 1 : n-1)) % n;
      paintWikiPop(); return;
    }
    if(e.key==='Enter' || e.key==='Tab'){
      e.preventDefault(); pickWiki(); return;
    }
    if(e.key==='Escape'){ e.preventDefault(); closeWikiPop(); return; }
  }

  if(e.key==='Enter' && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey){
    // ⌘Enter / Ctrl+Enter：在当前行下面直接开一条更深的子条目
    e.preventDefault();
    if(insertSubItem(ta)){ LIVE.raws[i] = ta.value; growTa(ta); syncBody(); }
    return;
  }
  if(e.key==='Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    handleEnter(i, ta);
    return;
  }
  if(e.key==='Tab'){
    e.preventDefault();
    if(e.shiftKey){
      if(!dedentCurLine(ta)) return;            // 已经在最外层，什么都不做
    }else if(!indentCurLine(ta)){
      ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');   // 普通段落：光标处补两个空格
    }
    LIVE.raws[i] = ta.value; growTa(ta); syncBody();
    return;
  }
  if(e.key==='Escape'){ e.preventDefault(); closeEditing(); return; }

  if(e.key==='Backspace' && ta.selectionStart===0 && ta.selectionEnd===0){
    if(!ta.value){
      if(LIVE.raws.length<=1) return;
      e.preventDefault();
      LIVE.raws.splice(i,1); LIVE.gaps.splice(i,1);
      rebuild(i > 0 ? i-1 : 0, 'end');
      return;
    }
    if(i===0) return;
    e.preventDefault();
    const prev = LIVE.raws[i-1];
    LIVE.raws[i-1] = prev + (prev.endsWith('\n') ? '' : '\n') + ta.value;
    LIVE.raws.splice(i,1); LIVE.gaps.splice(i,1);
    rebuild(i-1, prev.length);
    return;
  }

  if(e.key==='ArrowDown' && !ta.value.includes('\n') && ta.selectionStart===ta.value.length){
    e.preventDefault(); closeEditing(); focusBlock(i+1, 0); return;
  }
  if(e.key==='ArrowUp' && !ta.value.includes('\n') && ta.selectionStart===0){
    e.preventDefault(); closeEditing(); focusBlock(i-1, 'end'); return;
  }
}

/* Tab：列表行整行缩进（空格加在行首，不是光标处，否则会变成行尾两个空格） */
function indentCurLine(ta){
  const v = ta.value, s = ta.selectionStart;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  let le = v.indexOf('\n', s); if(le < 0) le = v.length;
  if(!/^\s*([-*+]|\d+\.)\s+/.test(v.slice(ls, le))) return false;
  ta.setRangeText('  ', ls, ls, 'preserve');   // 行首补两个空格，光标跟着文字走
  return true;
}
/* ⇧Tab：当前行退一级（最多两个空格），列表项就退回上一层 */
function dedentCurLine(ta){
  const v = ta.value, s = ta.selectionStart;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  const m = v.slice(ls).match(/^( {1,2}|\t)/);
  if(!m) return false;
  ta.setRangeText('', ls, ls + m[0].length, 'preserve');
  return true;
}
/* ⌘Enter / Ctrl+Enter：在当前行下面直接开一条更深的子条目（列表标记、待办、序号都继承） */
function insertSubItem(ta){
  const v = ta.value, s = ta.selectionStart;
  let le = v.indexOf('\n', s); if(le < 0) le = v.length;
  const line = v.slice(v.lastIndexOf('\n', s - 1) + 1, le);
  const m = line.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?/);
  let ins;
  if(m){
    const marker = /^\d+\.$/.test(m[2]) ? '1.' : m[2];
    ins = '\n' + m[1] + '  ' + marker + ' ' + (m[4] ? '[ ] ' : '');
  }else{
    ins = '\n- ';
  }
  ta.setRangeText(ins, le, le, 'end');
  const pos = le + ins.length;
  try{ ta.setSelectionRange(pos, pos); }catch(err){ }
  return true;
}

/* 源码区：⌘⇧Enter 在当前行下面插入同级列表项（编号自动 +1，待办继承 [ ]） */
function insertSiblingItem(ta){
  const v = ta.value, s = ta.selectionStart;
  let le = v.indexOf('\n', s); if(le < 0) le = v.length;
  const line = v.slice(v.lastIndexOf('\n', s - 1) + 1, le);
  const m = line.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?/);
  let ins;
  if(m){
    const marker = /^\d+\.$/.test(m[2]) ? (parseInt(m[2], 10) + 1) + '.' : m[2];
    ins = '\n' + m[1] + marker + ' ' + (m[4] ? '[ ] ' : '');
  }else{
    ins = '\n- ';
  }
  ta.setRangeText(ins, le, le, 'end');
  const pos = le + ins.length;
  try{ ta.setSelectionRange(pos, pos); }catch(err){}
  return true;
}

function handleEnter(i, ta){
  const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
  const before = v.slice(0, s), after = v.slice(en);
  const t = blockType(v);
  const lineStart = before.lastIndexOf('\n') + 1;
  const curLine = before.slice(lineStart);

  if(t==='fence' || t==='table'){
    ta.setRangeText('\n', s, en, 'end');
    LIVE.raws[i] = ta.value; growTa(ta); syncBody();
    return;
  }
  if(t==='heading'){
    LIVE.raws[i] = before.trimEnd();
    LIVE.raws.splice(i+1, 0, after.replace(/^\n+/,'')); LIVE.gaps.splice(i+1, 0, 0);
    rebuild(i+1, 0);
    return;
  }
  if(t==='list'){
    const m = curLine.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?(.*)$/);
    if(m){
      const indent = m[1], marker = m[2], task = m[4] || '', text = m[5];
      if(!text.trim()){
        const headRaw = v.slice(0, lineStart).replace(/\n$/,'');
        LIVE.raws[i] = headRaw;
        LIVE.raws.splice(i+1, 0, after.replace(/^\n/,'')); LIVE.gaps.splice(i+1, 0, 0);
        rebuild(i+1, 0);
        return;
      }
      const nextMarker = /^\d+\.$/.test(marker) ? (parseInt(marker,10)+1)+'.' : marker;
      /* 待办在末尾回车：先把这一条提交（时间胶囊、勾选框才会渲染出来），再开一条新的 */
      if(task && !after.trim()){
        ta.value = v.slice(0, s);
        LIVE.raws[i] = ta.value;
        commitBlock(i);
        LIVE.raws.splice(i+1, 0, indent + nextMarker + ' [ ] ');
        LIVE.gaps.splice(i+1, 0, 0);
        rebuild(i+1, 'end');
        return;
      }
      const ins = '\n' + indent + nextMarker + ' ' + (task ? '[ ] ' : '');
      ta.setRangeText(ins, s, en, 'end');
      LIVE.raws[i] = ta.value; growTa(ta); syncBody();
      return;
    }
  }
  const headRaw = before.replace(/\n$/,'');
  let tailRaw = after.replace(/^\n/,'');
  if(t==='quote' && tailRaw) tailRaw = '> ' + tailRaw;
  LIVE.raws[i] = headRaw;
  LIVE.raws.splice(i+1, 0, tailRaw); LIVE.gaps.splice(i+1, 0, 0);
  rebuild(i+1, t==='quote' ? 2 : 0);
}

function toggleTask(i, cb){
  const host = liveHost(); if(!host) return;
  const view = host.querySelector('.blk[data-i="'+i+'"] .blk-view');
  if(!view) return;
  const boxes = [...view.querySelectorAll('li.task')];
  const li = cb.closest('li');
  const k = boxes.indexOf(li);
  if(k < 0) return;
  const lines = String(LIVE.raws[i]).split('\n');
  let n = 0;
  for(let j=0;j<lines.length;j++){
    if(/^\s*([-*+]|\d+\.)\s+\[[ xX]\]/.test(lines[j])){
      if(n===k){
        const done = /\[[xX]\]/.test(lines[j]);
        lines[j] = lines[j].replace(/\[[ xX]\]/, done ? '[ ]' : '[x]');
        break;
      }
      n++;
    }
  }
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  const ta = el && el.querySelector('.blk-src');
  const next = lines.join('\n');
  LIVE.raws[i] = next;
  if(ta) ta.value = next;
  commitBlock(i);
}

function onBlockPaste(e){
  const cd = e.clipboardData;
  const files = [...((cd && cd.items)||[])]
    .filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);
  if(files.length){
    e.preventDefault();
    insertFiles(files, e.currentTarget).then(insertToast);
    return;
  }
  // 从预览区复制来的内容：粘进块编辑框时也走 Markdown 源，别掉格式
  if(!cd || !document.body.contains(e.currentTarget)) return;
  let md = '';
  try{ md = cd.getData('text/x-ivy-md') || ''; }catch(err){}
  const plain = (()=>{ try{ return cd.getData('text/plain') || ''; }catch(err){ return ''; } })();
  if(!md && LAST_COPY && plain && plain === LAST_COPY.plain) md = LAST_COPY.md;
  if(!md) return;                       // 外部复制的普通文字走浏览器默认
  e.preventDefault();
  const ta = e.currentTarget, i = +ta.dataset.i;
  const s = ta.selectionStart, en = ta.selectionEnd;
  ta.setRangeText(md, s, en, 'end');
  LIVE.raws[i] = ta.value; growTa(ta); syncBody();
}

/* ---- 光标定位：点哪儿就从哪儿开始改 ---- */
function offsetFromPoint(view, raw, x, y){
  if(!view) return String(raw).length;
  let range = null;
  try{
    if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if(document.caretPositionFromPoint){
      const p = document.caretPositionFromPoint(x, y);
      if(p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
    }
  }catch(e){}
  if(!range || !view.contains(range.startContainer)) return String(raw).length;
  const r = document.createRange();
  r.selectNodeContents(view);
  try{ r.setEnd(range.startContainer, range.startOffset); }catch(e){ return String(raw).length; }
  return visToRaw(String(raw), r.toString().length);
}

function stripVis(s){
  return String(s)
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function(m,t,a){ return a || t; })
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/[*_~`]/g,'');
}

function rawOffsetInLine(body, vis){
  let seen = 0, i = 0;
  while(i < body.length && seen < vis){
    const ch = body[i];
    if(ch==='!' && body[i+1]==='['){ i += 2; continue; }
    if(ch==='['){ i++; continue; }
    if(ch===']'){
      i++;
      if(body[i]==='('){ while(i<body.length && body[i]!==')') i++; i++; }
      continue;
    }
    if(ch==='*'||ch==='_'||ch==='~'||ch==='`'){ i++; continue; }
    if(ch==='=' && (body[i+1]==='=' || (i>0 && body[i-1]==='='))){ i++; continue; }
    if(ch==='|' && i===0){ i++; continue; }
    seen++; i++;
  }
  return i;
}

function visToRaw(raw, vis){
  const lines = raw.split('\n');
  let left = vis, consumed = 0;
  for(let li=0; li<lines.length; li++){
    const line = lines[li];
    const p = line.match(/^(\s*)(#{1,6}\s+|[-*+]\s+(\[[ xX]\]\s+)?|\d+\.\s+|>\s?)?/);
    const prefix = p ? p[0] : '';
    const body = line.slice(prefix.length);
    const visLen = stripVis(body).length;
    if(left <= visLen || li===lines.length-1){
      return Math.min(raw.length, consumed + prefix.length + rawOffsetInLine(body, left));
    }
    left -= visLen;
    consumed += line.length + 1;
  }
  return raw.length;
}

/* ---- 模式切换 ---- */
function setMode(m){
  const doc = document.getElementById('doc'); if(!doc) return;
  commitAnyEditing();
  // 切模式前记下「读到哪里」：预览和源码的高度不一样，用比例映射回去才不会跳
  const sc = document.getElementById('scroll');
  const maxBefore = sc ? Math.max(0, sc.scrollHeight - sc.clientHeight) : 0;
  const ratio = (sc && maxBefore > 0) ? Math.min(1, Math.max(0, sc.scrollTop / maxBefore)) : 0;
  const keepScroll = ()=>{
    const el = document.getElementById('scroll');
    if(!el) return;
    const max = Math.max(0, el.scrollHeight - el.clientHeight);
    el.scrollTop = max * ratio;
  };
  S.mode = m;
  doc.classList.remove('mode-live','mode-preview','mode-edit','mode-split');
  doc.classList.add(modeClass(m));
  document.body.classList.toggle('split-mode', m==='split');
  const n = noteById(S.active);
  const src = document.getElementById('source');
  if(src && n) src.value = n.body;
  if(m==='preview'){ renderProse(); renderOutline(); keepScroll(); }
  else if(m==='live'){ renderLive(); }
  else if(m==='split'){
    if(src){ src.style.height='auto'; src.style.height = src.scrollHeight + 'px'; }   // 左栏按内容撑高，滚动交给 .src-wrap
    renderProse(); renderOutline();
    SPLIT_ANCH = null;
    wireSplitSync();
    requestAnimationFrame(fitSplitSource);
  }
  else if(m==='source'){
    if(src){
      src.style.height='auto';
      src.style.height = Math.max(src.scrollHeight, 360) + 'px';
      // 赋值 .value 会把光标推到文末，直接 focus() 就会把页面拽到最底部；
      // 这里把光标放到「当前看着的那一段」附近，并禁止 focus 自带滚动
      const at = Math.round(src.value.length * ratio);
      try{ src.setSelectionRange(at, at); }catch(e){}
      try{ src.focus({ preventScroll:true }); }catch(e){ src.focus(); }
      keepScroll();
    }
  }
  save();
}
function enterEdit(){ setMode('source'); }
function enterPreview(){ setMode('preview'); }
/* ⌘E 在 预览 → 双栏 → Markdown 之间轮转 */
function toggleMode(){
  const m = curMode();
  setMode(m==='live' ? 'split' : (m==='split' ? 'source' : 'live'));
}

/* 源码模式写到底部时，别让光标死死贴着窗口下沿：再往下推一点，
   按「底部留空」的比例留出手感合适的余量（双栏时推的是左栏自己的滚动）。
   用户往上翻着看的时候光标在屏幕上方，这里不会插手抢滚动。 */
function easeCaretBottom(){
  const mode = curMode();
  if(mode !== 'source' && mode !== 'split') return;
  const src = document.getElementById('source');
  if(!src || !src.isConnected) return;
  // 超大文档不做镜像测量，别拖慢输入（那点舒适度不值得每敲一个字排一次版）
  if((src.value || '').length > 80000) return;
  const pos = src.selectionStart;
  if(typeof pos !== 'number') return;

  const split = mode === 'split';
  const sc = split ? (document.getElementById('srcWrap') || src) : document.getElementById('scroll');   // 真正的滚动容器
  const max = sc.scrollHeight - sc.clientHeight;
  if(max <= 0 || max - sc.scrollTop < 2) return;

  let c;
  try{ c = caretXY(src, pos); }catch(e){ return; }
  const bottom = split ? sc.getBoundingClientRect().bottom : window.innerHeight;
  const pct = docPadBottom();
  const comfort = window.innerHeight * pct / 100 * (split ? 0.4 : 0.8);
  const room = split ? Math.min(96, Math.max(40, comfort)) : Math.min(320, Math.max(60, comfort));
  const gap = bottom - c.y;
  if(gap >= room) return;
  const prev = sc.style.scrollBehavior;
  sc.style.scrollBehavior = 'auto';
  sc.scrollTop = Math.min(max, sc.scrollTop + (room - gap));
  sc.style.scrollBehavior = prev;
}

function wireEditor(n){
  const title = $('#docTitle');
  const src = $('#source');
  const doc = $('#doc');
  src.value = n.body;

  const grow = (el)=>{
    // 源码框一律按内容撑高：源码模式和双栏共用一条路。
    // 双栏时滚动交给外层 .src-wrap（它才有底部留白），textarea 自己不再滚。
    // 先把 height 设回 auto 量高度的那一瞬，滚动容器的高度会塌下来，
    // 浏览器会把 scrollTop 夹到 0，光标一打字就弹回顶部。所以量之前记下位置、量完立刻还回去。
    if(el && el.id === 'source'){
      // 双栏：只往上加高、绝不塌一下重量。塌那一下左边滚动位置会被夹到 0，
      // 浏览器接着又会按错乱的行位置去「让光标可见」，整页乱跳（源码模式没这问题，见下）
      if(curMode() === 'split'){
        const need = el.scrollHeight;
        if(need > el.offsetHeight + 1) el.style.height = need + 'px';
        return;
      }
      // 谁在滚就保谁的位置：源码模式滚 #scroll
      const sc = document.getElementById('scroll');
      const keep = sc ? sc.scrollTop : 0;
      // #scroll 带 scroll-behavior:smooth，写 scrollTop 会变成一段动画；量高度时先关掉，
      // 否则每敲一个字页面就慢慢滑一次，看起来像被弹回顶部
      const prevB = sc ? sc.style.scrollBehavior : '';
      if(sc) sc.style.scrollBehavior = 'auto';
      el.style.height='auto'; el.style.height = el.scrollHeight+'px';
      if(sc){
        sc.scrollTop = Math.min(keep, Math.max(0, sc.scrollHeight - sc.clientHeight));
        sc.style.scrollBehavior = prevB;
      }
      return;
    }
    el.style.height='auto'; el.style.height = el.scrollHeight+'px';
  };
  const growTitle = ()=>{ title.style.height='auto'; title.style.height = title.scrollHeight+'px'; };
  growTitle();

  title.addEventListener('input', ()=>{
    n.title = title.value; n.updatedAt = Date.now();
    renderTabs(); renderShelf(); syncListRow(n); save(); growTitle(); renderMeta();
  });
  title.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); src.focus(); }
  });
  title.addEventListener('blur', ()=>{ if(!n.title.trim() && n._auto){ n._auto=false; } });

  src.addEventListener('input', ()=>{
    n.body = src.value; n.updatedAt = Date.now();
    grow(src); renderMeta(); save(); syncListRow(n);
    // 排版落定后再把「贴底的光标」往下推一点，写完最后一行也不至于卡在窗口边缘
    requestAnimationFrame(()=>{ try{ easeCaretBottom(); }catch(e){} });
    histTouch();
    if(curMode()==='split'){ livePreviewSoon(); }
    slashMaybe(src); dueMaybe(src);
  });
  src.addEventListener('keydown', e=>{
    if(slashKey(e, src)) return;
    if(e.key==='Enter' && (e.metaKey || e.ctrlKey) && e.shiftKey && !e.altKey){
      e.preventDefault(); insertSiblingItem(src); n.body = src.value; save(); grow(src); return;
    }
    if(e.key==='Enter' && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey){
      e.preventDefault(); insertSubItem(src); n.body = src.value; save(); grow(src); return;
    }
    if(e.key==='Tab'){
      e.preventDefault();
      if(e.shiftKey){
        if(!dedentCurLine(src)) return;
      }else if(!indentCurLine(src)){
        const s=src.selectionStart,en=src.selectionEnd;
        src.setRangeText('  ', s, en, 'end');
      }
      n.body = src.value; save(); grow(src);
    }
  });
  src.addEventListener('blur', ()=>closeSlashMenu());
  src.addEventListener('paste', handlePaste);
  doc.addEventListener('dragover', e=>e.preventDefault());
  doc.addEventListener('drop', handleDrop);
  grow(src);

  // 预览区双击空白 → 直接开始写
  $('#prose').addEventListener('dblclick', ()=>{
    if(!n.body.trim()){ if(curMode()!=='live') setMode('live'); setTimeout(()=>focusBlock(0, 0), 20); }
  });

  // 切换编辑/预览
  doc.dataset.note = n.id;
}


/* ---- 大纲 + 右边缘刻度 ---- */
let outlineItems = [];
/* 每个标题在正文里的字符偏移，用来把刻度按文档位置铺开（笔记越长，刻度越多、铺得越开） */
function headingOffsets(body){
  const out = []; let ch = 0;
  String(body||'').split('\n').forEach(ln=>{
    if(/^#{1,6}\s+/.test(ln)) out.push(ch);
    ch += ln.length + 1;
  });
  return out;
}
/* 标题 + 二级（列表项）在正文里的字符位置，按文档顺序排好；
   代码块里的 # 和 - 不算，免得刻度被代码带偏 */
function outlineTickMarks(body){
  const marks = []; let ch = 0, fence = false;
  String(body||'').split('\n').forEach(ln=>{
    if(/^\s*```/.test(ln)){ fence = !fence; ch += ln.length + 1; return; }
    if(!fence){
      const mH = ln.match(/^(#{1,6})\s+/);
      if(mH) marks.push({ kind:'h', level: mH[1].length, off: ch });
      else{
        const mL = ln.match(/^(\s*)([-*+]|\d+[.、)])\s+/);
        if(mL) marks.push({ kind:'li', level: Math.min(3, 1 + Math.floor(mL[1].replace(/\t/g,'  ').length / 2)), off: ch });
      }
    }
    ch += ln.length + 1;
  });
  return marks;
}
/* 把大纲条目（标题 / 列表项）对上正文字符位置，给刻度用。
   条目和大纲是同一套过滤规则，所以条数一致时直接按顺序对齐最稳；
   万一对不上（解析细节有出入）再按「同类找下一个」兜底。 */
function outlineTickData(entries, body, mode){
  let marks = outlineTickMarks(body);
  if(mode === 'lv2') marks = marks.filter(m=>m.level <= 2);
  else if(mode === 'h1'){
    const hs = marks.filter(m=>m.kind === 'h');
    if(!hs.length) return [];
    const top = Math.min.apply(null, hs.map(m=>m.level || 1));
    marks = hs.filter(m=>(m.level || 1) === top);
  }
  const list = entries || [];
  const out = [];
  if(marks.length === list.length){
    list.forEach((e,i)=>{
      const m = marks[i];
      out.push({ id: e.id, level: e.level || m.level || 1, kind: m.kind, off: m.off });
    });
    return out;
  }
  let mi = 0;
  list.forEach(e=>{
    const kind = e.kind === 'li' ? 'li' : 'h';
    while(mi < marks.length && marks[mi].kind !== kind) mi++;
    const m = marks[mi];
    if(!m) return;                       // 对不上的条目跳过，别画到错误位置
    out.push({ id: e.id, level: e.level || m.level || 1, kind, off: m.off });
    mi++;
  });
  return out;
}
function renderMiniTicks(ticks, body){
  const mini = document.getElementById('olMini'); if(!mini) return;
  if(!ticks || !ticks.length){ mini.innerHTML = ''; mini.style.height = ''; return; }
  const text = String(body||'');
  const total = Math.max(1, text.length);
  /* 刻度条的高度跟着「笔记有多长」走，标题/列表项多的时候也要全部摆得下：
     几百字就短短一截（两三根线），长文才铺得开，长文短文一眼能分出长短。 */
  const lenH = 46 + 314 * Math.pow(Math.min(1, total / 9000), 0.6);
  // 一根刻度≈一行：间距按展开后大纲那种「一条一条」的密度来排，看得清也点得准
  const cntH = 16 + ticks.length * 14;
  const maxH = Math.min(560, Math.max(180, window.innerHeight - 150));
  const H = Math.round(Math.min(maxH, Math.max(46, Math.max(lenH, cntH))));
  mini.style.height = H + 'px';
  // 刻度太多时自动收小间距，保证全部落在条子里，不堆成一坨
  const gap = ticks.length > 1 ? Math.max(3, Math.min(14, Math.floor((H - 6) / (ticks.length - 1)))) : 14;
  let last = -gap;
  mini.innerHTML = ticks.map(t=>{
    let y = Math.round((t.off != null ? t.off : 0) / total * (H - 4));
    y = Math.max(y, last + gap); last = y;        // 相邻刻度别叠在一起
    y = Math.min(y, H - 2);
    const li = t.kind === 'li';
    // 长度跟展开大纲里那一列短横线一个量级（9px 起），不再细得看不见
    const w = li ? 9 : (t.level === 1 ? 14 : t.level === 2 ? 11 : 9);
    return `<button class="ol-tick${li?' li':''}" style="top:${y}px;width:${w}px" data-y="${y}" data-off="${t.off != null ? t.off : 0}" data-h="${t.id}" title=""></button>`;
  }).join('');
}
/* 当前读到哪个标题：取滚动容器里最后一个已经越过顶部的可见标题 */
function currentHeadingId(){
  const sc = document.getElementById('scroll'); if(!sc) return null;
  const box = sc.getBoundingClientRect();
  let cur = null, first = null;
  sc.querySelectorAll('h1[id],h2[id],h3[id],h4[id],h5[id],h6[id]').forEach(el=>{
    if(!el.getClientRects().length) return;    // 过滤隐藏的预览副本
    if(!first) first = el.id;
    if(el.getBoundingClientRect().top - box.top <= 72) cur = el.id;
  });
  // 文档刚打开、第一个标题还在 72px 线下面时，也得有一根亮着，不能一根都不亮
  return cur || first;
}
/* 光标当前在正文的第几个字符：有光标就按光标定位刻度，没有才退回按滚动位置 */
function caretOffsetForTicks(){
  const m = S.mode || 'live';
  const ae = document.activeElement;
  if(m === 'source' || m === 'split'){
    const src = document.getElementById('source');
    if(src && ae === src && typeof src.selectionStart === 'number') return src.selectionStart;
    return null;
  }
  if(m !== 'live') return null;
  const rawAt = i =>{
    let off = 0;
    for(let k = 0; k < i; k++) off += ((LIVE.raws[k] || '').length + 1 + ((LIVE.gaps && LIVE.gaps[k + 1]) || 0));
    return off;
  };
  if(ae && ae.classList && ae.classList.contains('blk-src') && typeof ae.selectionStart === 'number'){
    const i = +ae.dataset.i || 0;
    return rawAt(i) + Math.min(ae.selectionStart, (LIVE.raws[i] || '').length);
  }
  const r = liveSelRange();
  if(r){
    const p = blockPoint(r.startContainer, r.startOffset, false);
    if(p) return rawAt(p.i) + Math.min(p.off || 0, (LIVE.raws[p.i] || '').length);
  }
  return null;
}
function updateOutlineActive(){
  const mini = document.getElementById('olMini');
  const ticks = mini ? [...mini.querySelectorAll('.ol-tick')] : [];
  // 光标刚动过就以光标为准；过几秒（或用户去滚页面）再回到按滚动位置算
  const caret = (CARET_PRIORITY_UNTIL && Date.now() < CARET_PRIORITY_UNTIL) ? caretOffsetForTicks() : null;
  let cur = null, hit = null;
  if(caret != null && ticks.length){
    // 取「位置在光标之前、且最靠后」的那根刻度 —— 光标走到哪，高亮就跟到哪
    ticks.forEach(t=>{
      const off = +t.dataset.off || 0;
      if(off <= caret + 1) hit = t;
    });
    if(!hit) hit = ticks[0];
    cur = hit.dataset.h;
  }else{
    cur = currentHeadingId();
    hit = ticks.find(t=>t.dataset.h === cur) || null;
  }
  outlineEl.querySelectorAll('.ol-item').forEach(b=>{
    b.classList.toggle('on', (b.dataset.h === cur) || (b.dataset.j === cur));
  });
  ticks.forEach(t=>t.classList.toggle('on', t === hit));
}
/* 光标一动（打字、方向键、点一下、改选区）就把刻度/大纲的高亮挪过去 */
var CARET_RAF = 0;
var CARET_PRIORITY_UNTIL = 0;
function pingOutlineForCaret(){
  CARET_PRIORITY_UNTIL = Date.now() + 3000;
  if(CARET_RAF) return;
  CARET_RAF = requestAnimationFrame(()=>{ CARET_RAF = 0; try{ updateOutlineActive(); }catch(e){} });
}
['keyup','click','input','focusin'].forEach(ev=>document.addEventListener(ev, pingOutlineForCaret, true));
document.addEventListener('selectionchange', pingOutlineForCaret);
/* 图钉 = 「大纲」菜单里那一项：同一个开关。
   开着时点它收起（面板连同固定一起撤掉），关着时点它打开。 */
function toggleOutlinePin(){
  setOutlinePanel(!document.body.classList.contains('ol-open'));
}
/* 大纲顶栏那一个图标点一下换一档：全部分支 → 二级分支 → 一级标题 → 回到全部 */
const OUTLINE_MODES = [
  { id:'all', tip:'全部分支' },
  { id:'lv2', tip:'二级分支' },
  { id:'h1',  tip:'一级标题' }
];
function outlineModeEntries(mode, list){
  if(mode === 'lv2') return list.filter(e => (e.level || 1) <= 2);
  if(mode === 'h1'){
    const h1 = list.filter(e => e.kind === 'h' && (e.level || 1) === 1);
    if(h1.length) return h1;
    // 整篇都用 ## 打头时，「一级」就是最高那一级，别让大纲空掉
    const hs = list.filter(e => e.kind === 'h');
    if(!hs.length) return [];
    const top = Math.min.apply(null, hs.map(e => e.level || 1));
    return hs.filter(e => (e.level || 1) === top);
  }
  return list;
}
/* ========== AI 大纲 / AI 总结 ==========
   大纲按钮：把整篇压成一份层级大纲，直接显示在大纲面板里（不写进笔记）。
   AI 总结：同一份内容给一段可读摘要，可复制或插到文末。 */
var AI_OL = { id:'', snap:'', entries:null, show:false, busy:false };

// 和 aiStream 一样是裸文本流，但不碰 AI.abort，免得跟 AI 面板互相打断
async function aiRunOnce(payload, onText){
  const r = await fetch('/api/ai', {
    method:'POST', headers: authHeaders(true),
    body: JSON.stringify(Object.assign({ provider: AI.provider || undefined }, payload))
  });
  const ctype = String(r.headers.get('content-type') || '');
  if(!r.ok || ctype.indexOf('application/json') >= 0){
    const d = await r.json().catch(()=>({}));
    const e = new Error(d.error || ('HTTP ' + r.status));
    e.code = d.code;
    throw e;
  }
  if(!r.body) throw new Error('这个浏览器不支持流式读取');
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let all = '';
  for(;;){
    const { value, done } = await reader.read();
    if(done) break;
    all += dec.decode(value, { stream:true });
    if(onText) onText(all);
  }
  return all;
}
function aiErrToast(e){
  if(!e) return;
  if(e.code === 'ai-config-missing'){
    toast('先填一下自己的 AI 接口');
    if(typeof openAIConfig === 'function') openAIConfig(()=>{ AI.cfg = null; });
    return;
  }
  if(e.code === 'login'){ toast('登录后才能用 AI'); if(typeof openSyncPanel === 'function') openSyncPanel(); return; }
  toast(e.message || 'AI 没跑起来');
}
// 模型爱把 - / * / 1. 混着写，这里统一成一棵树
function parseAiOutline(text){
  const out = [];
  String(text || '').split('\n').forEach(raw=>{
    const line = raw.replace(/\t/g, '  ');
    const m = line.match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
    if(!m) return;
    const lead = m[1].replace(/\t/g, '  ');
    const depth = Math.min(2, Math.floor(lead.length / 2));
    const t = m[3].replace(/^\[[ xX]\]\s*/, '').replace(/[*_`]/g, '').trim();
    if(!t) return;
    out.push({ level: 1 + depth, text: t });
  });
  if(!out.length){
    // 没用列表就按行兜底，别让用户看到一片空白
    String(text || '').split('\n').map(x=>x.replace(/^[-*+\d.、)#\s]+/, '').trim())
      .filter(Boolean).slice(0, 12).forEach(x=>out.push({ level:1, text:x }));
  }
  return out.slice(0, 16);
}

/* AI 大纲落成正文：按分支层级缩进成嵌套列表，插到文末 */
function outlineToMarkdown(entries){
  const list = (entries || []).filter(e => e && String(e.text || '').trim());
  if(!list.length) return '';
  const base = Math.min.apply(null, list.map(e => Number(e.level) || 1));
  return list.map(e => {
    const lv = Math.max(0, Math.min(5, (Number(e.level) || base) - base));
    return '  '.repeat(lv) + '- ' + String(e.text).replace(/\s+/g, ' ').trim();
  }).join('\n');
}
function insertOutlineAtEnd(entries){
  const n = noteById(S.active);
  if(noteLocked(n)){ toast('先解锁这个笔记本'); return false; }
  const md = outlineToMarkdown(entries);
  if(!n){ toast('先打开一篇笔记'); return false; }
  if(!md){ toast('这次没生成出可用的条目'); return false; }
  // 格式：分割线 → 一级标题 → 层级大纲原文（不用引用块）
  n.body = String(n.body || '').replace(/\s+$/, '') + '\n\n---\n\n# AI 大纲\n' + md + '\n';
  n.updatedAt = Date.now();
  save(); renderAll(); kickSync();
  toast('AI 大纲已插到文末');
  return true;
}
/* 工具栏 / 命令面板直接「生成大纲并插入」：不用先看面板，生成完就落到文末 */
async function aiOutlineToEnd(){
  const n = noteById(S.active);
  if(noteLocked(n)){ toast('先解锁这个笔记本'); return; }
  if(!n || !String(n.body || '').trim()){ toast('这篇还没内容'); return; }
  const snap = String(n.body || '');
  // 「插入文末」是一次独立生成：只把结果写进正文，
  // 不碰 AI_OL / 悬浮大纲，免得右侧大纲面板跟着一起变成 AI 大纲。
  try{
    const text = await aiRunOnce({ task:'outline', text:snap });
    const entries = parseAiOutline(text);
    if(!entries.length) throw new Error('模型没给出可用的大纲，再试一次');
    insertOutlineAtEnd(entries);
  }catch(e){
    aiErrToast(e);
  }
}

async function aiOutline(force){
  const n = noteById(S.active);
  if(noteLocked(n)){ toast('先解锁这个笔记本'); return; }
  if(!n || !String(n.body || '').trim()){ toast('这篇还没内容'); return; }
  const snap = String(n.body || '');
  // 生成过、笔记也没改 → 点一下在「AI 大纲 / 原文大纲」之间切换
  if(!force && AI_OL.id === n.id && AI_OL.snap === snap && AI_OL.entries){
    AI_OL.show = !AI_OL.show;
    renderOutline();
    return;
  }
  /* 不再顺手把「固定大纲」点亮（图钉不该被 AI 联动）。
     如果卡片本来没露出来（从菜单 / 命令面板触发的），就临时亮一下让人看到结果，几秒后自己收。 */
  const needFlash = !S.outlineOpen && !document.body.classList.contains('ol-hover');
  if(needFlash) document.body.classList.add('ol-flash');
  const endFlash = ()=>{ if(needFlash) setTimeout(()=>document.body.classList.remove('ol-flash'), 6000); };
  AI_OL.id = n.id; AI_OL.snap = snap; AI_OL.entries = null;
  AI_OL.show = true; AI_OL.busy = true;
  renderOutline();
  try{
    const text = await aiRunOnce({ task:'outline', text:snap });
    const entries = parseAiOutline(text);
    if(!entries.length) throw new Error('模型没给出可用的大纲，再试一次');
    AI_OL.entries = entries;
    AI_OL.busy = false;
    renderOutline();
    endFlash();
  }catch(e){
    AI_OL.busy = false; AI_OL.entries = null; AI_OL.show = false;
    renderOutline();
    document.body.classList.remove('ol-flash');
    aiErrToast(e);
  }
}

// 把模型返回的总结转成引用块：每行前加「> 」，列表符号原样留着（预览里还是要点列表）
function summaryQuote(text){
  return String(text || '')
    .replace(/\r\n?/g, '\n')
    .trim()
    .split('\n')
    .map(l => l.replace(/^(\s*)#+\s*/, '$1'))      // 模型偶尔给个 ### 小标题，引用里用不上
    .map(l => l.replace(/^\s*>\s?/, ''))           // 已经带 > 的别叠成 >>
    .filter(l => l.trim())
    .map(l => '> ' + l.trim())
    .join('\n');
}

  $('#sumClose').onclick = close;

    if(dead) return;
    body.innerHTML = text.trim()
      ? mdToHtml(text).html
      : '<div class="ol-ai-load"><i></i>正在通读全文，提炼要点…</div>';
  };
  const enable = on=>{ $('#sumCopy').disabled = !on; $('#sumInsert').disabled = !on; };
  const run = async ()=>{
    if(busy) return;
    busy = true; text = ''; enable(false);
    body.innerHTML = '<div class="ol-ai-load"><i></i>正在通读全文，提炼要点…</div>';
    try{
      text = await aiRunOnce({ task:'summary', text:String(n.body || '') }, all=>{ text = all; paint(); });
      paint();
      if(!text.trim()) toast('模型没有返回内容');
      else enable(true);

      if(dead) return;
      body.innerHTML = '<div class="ol-ai-load">没能生成，再试一次吧</div>';

    // 前面先一条分割线，跟正文明确隔开
    cur.body = String(cur.body || '').replace(/\s+$/, '') + '\n\n---\n\n# AI 总结\n' + summaryQuote(text) + '\n';
    cur.updatedAt = Date.now();
    save(); renderAll();
    toast('已插入到文末');
    close();
  };
  run();
}
