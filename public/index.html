      paint();
      if(!entries.length) toast('模型没有给出可用的大纲');
      else enable(true);
    }catch(e){
      if(dead) return;
      body.innerHTML = '<div class="ol-ai-load">没能生成，再试一次吧</div>';
      aiErrToast(e);
    }finally{ busy = false; }
  };
  enable(false);
  $('#olAiRetry').onclick = run;
  $('#olAiCopy').onclick = ()=>{
    const t = md(); if(!t) return;
    navigator.clipboard.writeText(t).then(()=>toast('已复制'), ()=>toast('复制失败'));
  };
  $('#olAiInsert').onclick = ()=>{
    if(!entries.length) return;
    insertOutlineAtEnd(entries);
    close();
  };
  run();
}

function renderOutline(){
  const n = noteById(S.active);
  const mini = document.getElementById('olMini');
  if(!n){
    outlineEl.innerHTML=''; outlineEl.classList.add('hidden');
    document.body.classList.remove('outline-pinned');
    document.body.classList.add('ol-hidden');
    if(mini){ mini.innerHTML=''; mini.style.height=''; }
    return;
  }
  document.body.classList.remove('ol-hidden');
  outlineEl.classList.remove('hidden');
  outlineEl.classList.toggle('pinned', !!S.outlineOpen);
  document.body.classList.toggle('outline-pinned', !!S.outlineOpen);
  const mdOut = mdToHtml(n.body);
  const all = mdOut.headings;
  const offs = headingOffsets(n.body);
  const pairs = all.map((h,i)=>Object.assign({}, h, {off: offs[i] != null ? offs[i] : 0}));
  const heads = pairs;
  // 大纲 = 标题 + 列表项（和思维导图里的分支一一对应）。
  // 顶栏一个图标循环三种粒度：全部分支 → 二级分支 → 一级标题
  const mode = OUTLINE_MODES.some(m => m.id === S.outlineMode)
    ? S.outlineMode
    : (S.outlineTop ? 'lv2' : 'all');       // 兼容老版本存的 outlineTop
  const snap = String(n.body || '');
  const aiFresh = AI_OL.id === n.id && !!AI_OL.entries && AI_OL.snap === snap;
  const aiOn = aiFresh && AI_OL.show;
  const aiBusy = AI_OL.busy && AI_OL.id === n.id;
  const entries = aiOn ? AI_OL.entries : outlineModeEntries(mode, mdOut.outline || all);
  const aiItem = e => `<div class="ol-item ol-ai-item l${Math.max(1, Math.min(6, e.level || 1))}" title="${esc(e.text)}"><span class="t">${esc(e.text)}</span></div>`;
  const mi = OUTLINE_MODES.findIndex(m => m.id === mode);
  // 气泡写成「当前 → 点一下会切到哪」，一眼知道现在看的是哪档、下一步是什么
  const modeTip = OUTLINE_MODES[mi].tip + ' → ' + OUTLINE_MODES[(mi + 1) % OUTLINE_MODES.length].tip;
  outlineItems = entries;
  outlineEl.innerHTML = `<div class="outline-head">
      <button class="ol-btn ol-close" id="olClose" data-tip="关闭大纲" aria-label="关闭大纲">${ic('x')}</button>
      <button class="ol-btn" id="olMode" data-tip="${modeTip}" aria-label="${modeTip}">${ic('treeTop')}</button>
      <button class="ol-btn ol-ai ${aiOn?'on':''} ${aiBusy?'busy':''}" id="olAi" data-tip="${aiBusy?'正在生成 AI 大纲…':(aiOn?'切回原文大纲':'AI 总结成大纲')}" aria-label="AI 总结成大纲">${ic('spark')}</button>
      <button class="ol-btn ${S.outlineOpen?'on':''}" id="olPin" data-tip="固定显示大纲" aria-label="固定显示大纲">${ic('pin')}</button>
      <div class="ol-tip" id="olTip"></div>
    </div>
    <div class="outline-body">`
    + (aiBusy
        ? `<div class="ol-ai-load"><i></i>正在读这篇，整理大纲…</div>`
        : (aiOn
            ? `<div class="ol-ai-tag">${ic('spark')}AI 大纲 · 点星形切回原文<button class="ol-ai-ins" id="olAiIns" type="button" title="按分支缩进插入到文末">插入文末</button></div>`
              + (entries.length ? entries.map(aiItem).join('') : `<div class="ol-empty">这次没生成出条目</div>`)
            : (entries.length ? entries.map(e=>{
                const lv = Math.max(1, Math.min(6, e.level || 1));
                const t = esc(e.text);
                if(e.kind === 'li')
                  return `<button class="ol-item ol-li l${lv}${e.task === 'done' ? ' ol-done' : ''}" data-j="${e.id}" title="${t}">`
                    + `<span class="ol-bullet"></span><span class="t">${t}</span><span class="dash"></span></button>`;
                return `<button class="ol-item l${lv}" data-h="${e.id}" data-j="${e.id}" title="${t}"><span class="t">${t}</span><span class="dash"></span></button>`;
              }).join('')
              : `<div class="ol-empty">标题、列表项会出现在这里</div>`)))
    + `</div>`;
  /* 刻度跟着「当前这档大纲」走：全部分支时标题和列表项都有刻度，一屏能看出文章结构 */
  const tickData = aiOn
    ? heads.map(h=>({ id:h.id, level:h.level || 1, kind:'h', off:h.off }))
    : outlineTickData(entries, n.body, mode);
  renderMiniTicks(tickData, n.body);

  const pin = outlineEl.querySelector('#olPin');
  if(pin) pin.onclick = toggleOutlinePin;
  const aiBtn = outlineEl.querySelector('#olAi');
  if(aiBtn) aiBtn.onclick = ()=>aiOutline();
  const aiIns = outlineEl.querySelector('#olAiIns');
  if(aiIns) aiIns.onclick = ()=>{ if(AI_OL.entries) insertOutlineAtEnd(AI_OL.entries); };
  const modeBtn = outlineEl.querySelector('#olMode');
  if(modeBtn) modeBtn.onclick = ()=>{
    const i = OUTLINE_MODES.findIndex(m => m.id === mode);
    S.outlineMode = OUTLINE_MODES[(i + 1) % OUTLINE_MODES.length].id;
    // 手动选档位就是要看原文大纲：AI 结果先让开，不用先点星星把它关掉
    if(aiOn) AI_OL.show = false;
    renderOutline(); save();
  };
  const close = outlineEl.querySelector('#olClose');
  if(close) close.onclick = ()=>closeOutlinePanel();
  // 悬停/聚焦时在按钮正下方出一枚气泡，宽度超出卡片就贴边收住（不会被裁）
  const tipEl = outlineEl.querySelector('#olTip');
  if(tipEl && !matchMedia('(hover:none)').matches){
    const headEl = outlineEl.querySelector('.outline-head');
    const showTip = (btn)=>{
      tipEl.textContent = btn.dataset.tip || '';
      tipEl.classList.add('show');
      const hr = headEl.getBoundingClientRect(), br = btn.getBoundingClientRect();
      const maxL = Math.max(4, hr.width - tipEl.offsetWidth - 4);
      const want = br.left - hr.left + br.width / 2 - tipEl.offsetWidth / 2;
      tipEl.style.left = Math.round(Math.min(maxL, Math.max(4, want))) + 'px';
    };
    const hideTip = ()=>tipEl.classList.remove('show');
    outlineEl.querySelectorAll('.ol-btn[data-tip]').forEach(b=>{
      b.addEventListener('pointerenter', ()=>showTip(b));
      b.addEventListener('pointerleave', hideTip);
      b.addEventListener('focus', ()=>showTip(b));
      b.addEventListener('blur', hideTip);
    });
  }
  outlineEl.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{
    jumpToHeading(b.dataset.j);
    updateOutlineActive();
    // 触屏 / 手机上跳完把面板收起，别挡住正文（固定状态下保持展开）
    if(OL_TOUCH || window.innerWidth <= 640) setOutlinePanel(false);
  });
  updateOutlineActive();
}

/* 手机 / iPad：点右上角「大纲」按钮或右边缘空白处展开、收起浮层 */
function setOutlinePanel(on, opts){
  on = !!on;
  /* pin:false = 只是「滑出来看一眼」（手机上点悬浮条走这条），不点亮图钉、不存成固定态，
     否则下次打开 App 大纲会自己弹在那儿 */
  const keep = !(opts && opts.pin === false);
  if(on) document.body.classList.remove('ol-force-close');
  document.body.classList.toggle('ol-open', on);
  S.outlineOpen = keep ? on : false;        // 图钉亮不亮跟着走，两处永远一致
  outlineEl.classList.toggle('pinned', keep && on);
  document.body.classList.toggle('outline-pinned', keep && on);
  const pin = outlineEl.querySelector('#olPin');
  if(pin) pin.classList.toggle('on', keep && on);
  const btn = document.getElementById('paOutline');
  if(btn) btn.classList.toggle('on', on);
  save();
  if(on){ renderOutline(); updateOutlineActive(); }
}
function toggleOutlinePanel(){ setOutlinePanel(!document.body.classList.contains('ol-open')); }
/* × 和图钉一样，只是「关掉」，不保留任何固定态。
   桌面端大纲还会被「鼠标靠右边缘」点亮，光关固定态没用 —— 这里顺手压掉悬停态，
   直到鼠标真正离开右边区域才重新允许滑出，否则点了 × 卡片还赖在眼前。 */
let olHoverSuppressed = false;
function closeOutlinePanel(){
  setOutlinePanel(false);
  olHoverSuppressed = true;
  document.body.classList.add('ol-force-close');
  document.body.classList.remove('ol-hover');
  try{ if(typeof olHover !== 'undefined') olHover = false; }catch(e){}
}
/* 点正文也算关掉悬停出来的大纲 */
document.addEventListener('pointerdown', e=>{
  if(!document.body.classList.contains('ol-hover')) return;
  if(e.target.closest && (e.target.closest('#outline') || e.target.closest('#outlineZone'))) return;
  closeOutlinePanel();
}, true);

/* 右边缘刻度：桌面点某根跳标题、点空白处固定；触屏（含 iPad）点边缘一律弹出/收起大纲，
   不做刻度跳转——触摸很难精确落在某根刻度上，点了没反应像「坏了」 */
document.getElementById('outlineZone').addEventListener('click', e=>{
  // 手机（窄屏）也按触屏处理：点边缘一律展开/收起，不做刻度跳转
  if(OL_TOUCH || window.innerWidth <= 640){
    // 触屏点边缘：开着就彻底收起（含图钉固定），没开才展开
    if(document.body.classList.contains('ol-open') || S.outlineOpen) closeOutlinePanel();
    else toggleOutlinePanel();
    return;
  }
  const mini = document.getElementById('olMini'); if(!mini) return;
  const y = e.clientY - mini.getBoundingClientRect().top;
  let best = null, bd = Infinity;
  mini.querySelectorAll('.ol-tick').forEach(t=>{
    const d = Math.abs((+t.dataset.y || 0) - y);
    if(d < bd){ bd = d; best = t; }
  });
  if(best && bd <= 9){ jumpToHeading(best.dataset.h); updateOutlineActive(); }
  else toggleOutlinePin();
});
/* 手机右边缘的悬浮条：点一下把大纲滑出来，再点一下 / 点正文收回。
   不走图钉固定（pin:false），否则下次打开 App 大纲会自己弹在那儿。 */
function toggleOutlinePeek(){
  if(document.body.classList.contains('ol-open')) closeOutlinePanel();
  else setOutlinePanel(true, { pin:false });
}
(function(){
  const h = document.getElementById('olHandle');
  if(!h) return;
  let last = 0;
  const tap = ()=>{
    const t = Date.now();
    if(t - last < 320) return;      // touchend 已经处理过就别再让 click 来一遍
    last = t;
    toggleOutlinePeek();
  };
  h.addEventListener('touchend', e=>{ e.preventDefault(); e.stopPropagation(); tap(); }, { passive:false });
  h.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); tap(); });
  // 触屏点完把残留的 hover 态清掉（iOS 的合成 mouseenter 会把刻度永久藏起来）
  document.addEventListener('touchend', ()=>{ document.body.classList.remove('ol-peek'); }, { passive:true });
})();

/* 触屏：点面板外面收起，避免一直盖住正文 */
{
  const closeIfOutside = (target)=>{
    if(!document.body.classList.contains('ol-open')) return;
    if(!(OL_TOUCH || window.innerWidth <= 640)) return;
    if(target && target.closest && (target.closest('#outline') || target.closest('#outlineZone') || target.closest('#paOutline'))) return;
    setOutlinePanel(false);
  };
  document.addEventListener('pointerdown', e=>closeIfOutside(e.target), true);
  // iOS 上点正文（尤其落在可编辑区）时 pointerdown 不一定来，补一个 touchend：
  // 点正文就把大纲收回去，和用户预期一致
  document.addEventListener('touchend', e=>closeIfOutside(e.target), true);
}
/* 鼠标移到卡片上时，刻度也让位；滚动时同步高亮当前标题 */
outlineEl.addEventListener('mouseenter', ()=>document.body.classList.add('ol-peek'));
outlineEl.addEventListener('mouseleave', ()=>document.body.classList.remove('ol-peek'));
/* 「靠边滑出」的展开态交给鼠标位置判断（mousemove 只对真实鼠标触发，纯触摸设备不会误开）：
   不限定 !OL_TOUCH —— iPad 接鼠标/触控板时 hover:hover 媒体查询也成立，需要同样的驱动 */
{
  let olHover = false;
  /* 触摸抬起后浏览器会合成一次 mousemove（位置就在指尖）——指尖常落在大纲卡片/正文里，
     会把卡片重新点亮，看起来就像「× 点了没反应」。600ms 内的合成移动一律不算 hover */
  let lastTouchAt = 0;
  document.addEventListener('touchstart', ()=>{ lastTouchAt = Date.now(); }, { passive:true, capture:true });
  document.addEventListener('touchend',   ()=>{ lastTouchAt = Date.now(); }, { passive:true, capture:true });
  document.addEventListener('mousemove', e=>{
    if(Date.now() - lastTouchAt < 600) return;
    // 刚点过 ×：在鼠标离开右侧区域之前不再自动滑出
    if(olHoverSuppressed){
      if(e.clientX > window.innerWidth - 120) return;
      olHoverSuppressed = false;
      olHover = false;
      document.body.classList.remove('ol-hover', 'ol-force-close');
    }
    const mini = document.getElementById('olMini');
    const tickN = mini ? mini.querySelectorAll('.ol-tick').length : 0;
    let near = false;
    if(mini && tickN){
      // 只认「刻度那一条」：鼠标真的移到刻度附近才展开卡片，靠边的空白处不再弹
      const r = mini.getBoundingClientRect();
      near = e.clientX >= r.left - 8 && e.clientY >= r.top - 12 && e.clientY <= r.bottom + 12;
    }else{
      near = e.clientX >= window.innerWidth - 34;   // 整篇没有标题时，靠边仍能把卡片叫出来
    }
    const inCard = outlineEl.contains(e.target);           // 已在大纲卡片里
    const want = near || inCard;
    if(want !== olHover){ olHover = want; document.body.classList.toggle('ol-hover', want); }
  }, { passive:true });
  document.addEventListener('mouseleave', ()=>{ olHover = false; document.body.classList.remove('ol-hover'); });
}
let olScrollRaf = 0;
document.getElementById('scroll').addEventListener('scroll', ()=>{
  if(olScrollRaf) return;
  olScrollRaf = requestAnimationFrame(()=>{ olScrollRaf = 0; updateOutlineActive(); });
}, { passive:true });

/* 把某个滚动容器滚到 y：触屏瞬时（iOS 会把触摸事件里触发的 smooth 静默丢弃），
   桌面平滑滚，180ms 没动再兜底直赋 */
function setScrollTo(el, y){
  y = Math.max(0, Math.round(y));
  if(OL_TOUCH){
    const prev = el.style.scrollBehavior; el.style.scrollBehavior = 'auto';
    el.scrollTop = y;
    setTimeout(()=>{ el.style.scrollBehavior = prev || ''; }, 60);
    return;
  }
  try{ el.scrollTo({ top:y, behavior:'smooth' }); }catch(_){ el.scrollTop = y; }
  const y0 = el.scrollTop;
  setTimeout(()=>{ if(Math.abs(el.scrollTop - y0) < 1) el.scrollTop = y; }, 180);
}
/* 标题元素真正在哪个容器里滚：双栏模式 .prose / .source 各自 overflow-y:auto，
   不是外层 #scroll —— 跳转必须滚对容器，否则点了没反应（v34 修复） */
function scrollableAncestor(el){
  let p = el.parentElement;
  while(p && p !== document.body){
    const cs = getComputedStyle(p);
    if((cs.overflowY === 'auto' || cs.overflowY === 'scroll') && p.scrollHeight > p.clientHeight + 2) return p;
    p = p.parentElement;
  }
  return document.getElementById('scroll');
}

/* 点大纲跳转：页面里可能有多个同名 id（即时预览副本是隐藏的），要挑真正可见的那个 */
/* 跳过去之后闪一下目标位置：短暂灰底，像飞书文档那样告诉你落在了哪 */
function flashJump(el){
  if(!el || !el.classList) return;
  el.classList.remove('jump-flash');
  void el.offsetWidth;                       // 强制重排，动画才会重放
  el.classList.add('jump-flash');
  clearTimeout(el._jfT);
  el._jfT = setTimeout(()=>el.classList.remove('jump-flash'), 1700);
}
/* 目标要停在吸顶工具条下面：.fmt-bar 是 position:sticky，只让 28px 会被它盖住 */
function jumpTopPad(){
  let pad = 28;
  const fb = document.querySelector('.fmt-bar');
  if(!fb || !fb.getBoundingClientRect) return pad;
  try{
    const cs = getComputedStyle(fb);
    // 手机上是 static（dock 在标签栏下，不占滚动区），只有 sticky 才需要让位
    if(cs.position === 'sticky'){
      const h = Math.round(fb.getBoundingClientRect().height);
      if(h > 8) pad += h + 6;
    }
  }catch(e){}
  return pad;
}
function jumpToHeading(id){
  if(S.mode === 'source'){
    // 源码模式没有标题元素，按行号估算位置（滚的是外层 #scroll，textarea 本身 overflow:hidden）
    const n = noteById(S.active); const src = document.getElementById('source');
    const sc = document.getElementById('scroll');
    if(!n || !src || !sc) return;
    const list = mdToHtml(n.body).outline || [];
    const idx = list.findIndex(x=>x.id===id);
    if(idx < 0) return;
    const ratio = (idx + 1) / (list.length + 1);
    const srcTop = src.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
    setScrollTo(sc, srcTop + src.scrollHeight * ratio - 90);
    return;
  }
  const all = [...document.querySelectorAll('[id="'+String(id).replace(/"/g,'\\"')+'"]')];
  const t = all.find(el=>el.getClientRects().length);
  if(!t) return;
  const sc = scrollableAncestor(t);
  const top = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - jumpTopPad();
  setScrollTo(sc, top);
  setTimeout(()=>flashJump(t), 40);
}

/* ---- 回收站 ---- */
function kickSync(){
  try{ if(typeof isConnected==='function' && !isConnected()) return; }catch(e){ return; }
  if(syncBusy){ queueSync(); return; }
  syncNow();
}
function purgeNote(id, quiet){
  const n = noteById(id);
  if(!n) return;
  if(!quiet && !confirm('彻底删除「'+(n.title||'无标题')+'」？删除后不可恢复。')) return;
  // 关键：留一个墓碑并排队上传，否则服务端那条还在，下次同步会被拉回来
  S.pendingDeletes = (S.pendingDeletes||[]).filter(x=>x!==id).concat([id]).slice(-500);
  S.notes = S.notes.filter(x=>x.id!==id);
  S.tabs = (S.tabs||[]).filter(t=>t!==id);
  if(S.active===id) S.active = S.tabs[0] || null;
  if(!quiet){ renderAll(); save(); toast('已彻底删除'); kickSync(); }
}

/* 回收站右侧：只读预览 + 恢复 / 彻底删除。真要看列表，在中栏（renderTrashList） */
function renderTrashPane(){
  paperActions.innerHTML = '';
  // 手机上 Markdown 工具条被 dock 到 .paper 顶部（不在 #scroll 里），
  // 重画时它不会被清掉，会一直挂在预览上面 —— 这里先摘掉
  const dockedBar = document.getElementById('fmtBar');
  if(dockedBar && !scrollEl.contains(dockedBar)) dockedBar.remove();
  const n = S.active ? noteById(S.active) : null;
  if(!n || !n.trashed){
    scrollEl.style.display = 'flex';
    scrollEl.innerHTML = `<div class="blank">
      <p>选择左侧的笔记看看</p>
      <p>回收站里的笔记可以随时恢复</p>
    </div>`;
    return;
  }
  scrollEl.style.display = '';
  const nb = n.notebookId ? nbById(n.notebookId) : null;
  const out = mdToHtml(n.body || '');
  scrollEl.innerHTML = `<div class="view-pad trash-pane">
    <div class="trash-bar">
      <span class="trash-flag">${ic('trash')}在回收站里</span>
      <button class="meta-btn" data-restore="${n.id}">恢复</button>
      <button class="meta-btn" data-purge="${n.id}">彻底删除</button>
    </div>
    <h1 class="trash-title">${esc(n.title || '无标题')}</h1>
    <div class="trash-meta">删除于 ${esc(listWhen(n.updatedAt))} · 原位置：${esc(nb ? nb.name : '未归类')}</div>
    <div class="prose">${out.html || '<p style="color:rgb(var(--faint))">（这篇还没有正文）</p>'}</div>
  </div>`;
  const rb = scrollEl.querySelector('[data-restore]');
  if(rb) rb.onclick = ()=>{ S.active = null; toggleTrash(n.id); };
  const pb = scrollEl.querySelector('[data-purge]');
  if(pb) pb.onclick = ()=>{ S.active = null; purgeNote(n.id); };
  try{ renderMermaidBlocks(scrollEl); }catch(e){}
}

/* ========== Markdown ========== */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,alias)=>
    `<a href="#" class="wikilink" data-wiki="${t}">${alias||t}</a>`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=\n]+)==(?:\{(?:\.([a-z]+)|c:(#[0-9a-fA-F]{3,8}))\})?/g, (m,t,named,hex)=>{
    if(hex) return `<mark style="${hlInline(hex)}">${t}</mark>`;
    const k = String(named||'').toLowerCase();
    const cls = ['yellow','pink','blue','purple','gray'].includes(k) ? ` class="hl-${k}"` : '';
    return `<mark${cls}>${t}</mark>`;
  });
  // 先把行内代码抽出来，避免下面的「时间胶囊」把 `@今天` 这种示例也渲染掉
  const codes = [];
  s = s.replace(/<code>[\s\S]*?<\/code>/g, m=>{ codes.push(m); return '\u0001' + (codes.length - 1) + '\u0001'; });
  // 待办提醒时间：渲染成「今天 20:00」这样的绿色胶囊，别让 ⏰2026-11-12 09:00 这串裸文本抢戏
  s = s.replace(/⏰\s*(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/g, (m)=>dueChipHtml(parseDue(m)));
  // @今天 / @明天 9点 / @今晚 20:00 这类自然语言日期也做成同样的胶囊
  s = s.replace(new RegExp(DUE_AT_RE.source, 'g'), (m)=>dueChipHtml(parseAtDue(m)));
  // 重复规则也做成小胶囊：🔁 every month → 「↻ 每月」
  s = s.replace(new RegExp(REPEAT_RE.source, 'gi'), (m)=>{
    const key = parseRepeat(m);
    return `<span class="rep-chip">↻ ${REPEAT_LABEL[key] || m.replace(/^\S+\s*/, '')}</span>`;
  });
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i)=>codes[+i] || '');
  return s;
}
/* 把连续列表项按缩进拼成真正嵌套的 ul/ol。
   以前全部拍平成一层兄弟 li，缩进的子项和父项长得一模一样，插进来的分支大纲看不出层级 */
function nestedList(items, ordered){
  if(!items.length) return '';
  const tag = ordered ? 'ol' : 'ul';
  let html = '', depth = -1;
  items.forEach(it=>{
    // 一次最多往下走一层，跳级的缩进（0 → 2）也按下一层算，结构不会错乱
    const d = Math.max(0, Math.min(it.d || 0, 3, depth < 0 ? 0 : depth + 1));
    if(depth < 0){ html += `<${tag}><li${it.attrs}>${it.inner}`; depth = d; return; }
    if(d === depth){ html += `</li><li${it.attrs}>${it.inner}`; return; }
    if(d > depth){ html += `<${tag}><li${it.attrs}>${it.inner}`; depth = d; return; }
    for(let k = depth; k > d; k--) html += `</li></${tag}>`;
    html += `</li><li${it.attrs}>${it.inner}`;
    depth = d;
  });
  for(let k = depth; k >= 0; k--) html += `</li></${tag}>`;
  return html;
}
function mdToHtml(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const headings = []; let hIdx = 0;
  // outline：标题 + 列表项混排的一份「真大纲」，顺序与渲染出来的 DOM 完全一致，
  // 大纲面板靠它显示、靠 id 跳转（列表项的 id 是 li0、li1…，标题还是 h0、h1…）
  const outline = []; let liIdx = 0, curH = 0;
  const liStack = [];
  let out = []; let i = 0;
  const isTableSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');

  while(i < lines.length){
    const line = lines[i];

    // code fence
    if(/^```/.test(line)){
      const lang = line.slice(3).trim();
      let buf = []; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      if(/^mermaid$/i.test(lang)){
        // 图表：先留个占位，等 mermaid 加载完再渲染成 SVG
        out.push(`<div class="mb" data-mb="${encodeURIComponent(buf.join('\n'))}"><div class="mb-hint">正在渲染图表…</div></div>`);
      } else {
        out.push(`<pre><code${lang?` class="lang-${esc(lang)}"`:''}>${esc(buf.join('\n'))}</code></pre>`);
      }
      continue;
    }
    // heading
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lv = m[1].length; const id = 'h'+(hIdx++);
      const hText = m[2].replace(/[*_`]/g,'').trim();
      headings.push({level:lv, text:hText, id});
      outline.push({kind:'h', level:lv, text:hText, id});
      curH = lv; liStack.length = 0;
      out.push(`<h${lv} id="${id}">${inlineMd(m[2])}</h${lv}>`);
      i++; continue;
    }
    // hr
    if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)){ out.push('<hr>'); i++; continue; }
    // blockquote
    if(/^>\s?/.test(line)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      // 引用块里也常有列表（「AI 总结」插进来的就是这种），按列表渲染，别把「- 」当正文
      let inner = '', list = null, listOrdered = false;
      const flush = ()=>{ if(list){ inner += `<${listOrdered?'ol':'ul'}>${list.join('')}</${listOrdered?'ol':'ul'}>`; list = null; } };
      buf.forEach(b=>{
        const lm = b.match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
        if(lm){
          if(!list) listOrdered = /\d/.test(lm[1]);
          list = list || [];
          list.push(`<li>${inlineMd(lm[2])}</li>`);
          return;
        }
        flush();
        if(!b.trim()) return;                    // 引用里的空行不生成空段落
        inner += `<p>${inlineMd(b)}</p>`;
      });
      flush();
      out.push(`<blockquote>${inner}</blockquote>`);
      continue;
    }
    // table
    if(line.includes('|') && i+1<lines.length && isTableSep(lines[i+1])){
      const rows = []; let head = line;
      i += 2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){ rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      out.push(`<table><thead><tr>${cells(head).map(c=>`<th>${inlineMd(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${cells(r).map(c=>`<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    // lists
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        const rawLine = lines[i];
        const ind = (rawLine.match(/^\s*/)[0] || '').replace(/\t/g,'  ').length;
        let l = rawLine.replace(/^\s*([-*+]|\d+\.)\s+/,'');
        let cls='', task='';
        let pure = l;
        if(/^\[[ xX]\]\s/.test(l)){
          const chk = /^\[[xX]\]/.test(l);
          l = l.replace(/^\[[ xX]\]\s/,'');
          cls=' class="task"';
          task = chk ? 'done' : 'todo';
          pure = l;
        }
        // 缩进栈：同级进栈、退回上一级出栈，得到这一项在第几层
        while(liStack.length && ind <= liStack[liStack.length - 1]) liStack.pop();
        if(!liStack.length || ind > liStack[liStack.length - 1]) liStack.push(ind);
        const depth = Math.min(liStack.length - 1, 3);
        const id = 'li' + liIdx;
        const inner = task
          ? `<input type="checkbox" disabled ${task === 'done' ? 'checked' : ''}>${inlineMd(l)}`
          : inlineMd(l);
        items.push({ d: depth, attrs: `${cls} id="${id}"`, inner });
        const plain = pure
          .replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1')
          .replace(/\[\[([^\]]+)\]\]/g,'$1')
          .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
          .replace(/[*_`~]/g,'').trim();
        if(plain) outline.push({
          kind:'li', text:plain, task, depth,
          level: Math.min(6, (curH || 0) + 1 + depth),
          id
        });
        liIdx++;
        i++;
      }
      out.push(nestedList(items, ordered));
      continue;
    }
    // blank：按源码里空行的行数撑开留白。一个空行≈一行高，两个空行就翻倍，
    // 否则源码里按了几次回车、预览永远只有一个段距，看着像被吃掉了
    if(!line.trim()){
      const at = i; let n = 0;
      while(i<lines.length && !lines[i].trim()){ n++; i++; }
      const prev = out[out.length-1] || '';
      const afterHeading = /^<h[1-6][\s>]/.test(prev);   // 标题下的空行照旧收紧，别把标题和正文拽开
      // 首尾的空行不占高度（文档开头/结尾多几个回车不该顶出一片空白）
      if(at > 0 && i < lines.length && n >= 1 && !afterHeading){
        const extra = n * 1.2 - 0.78;                   // .78em 是相邻块自带的段距，这里只补差额
        if(extra > 0.05) out.push(`<div class="md-blank" aria-hidden="true" style="height:${extra.toFixed(2)}em"></div>`);
      }
      continue;
    }
    // paragraph
    let buf=[line]; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isTableSep(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push(`<p>${buf.map(inlineMd).join('<br>')}</p>`);
  }
  return {html: out.join('\n'), headings, outline};
}

/* ========== Mermaid 图表 ========== */
/* 按需加载：只有正文里真的出现 ```mermaid 才去下载 2.5MB 的库，首屏不受影响 */
const MB_CACHE = new Map();
let MB_LOADING = null, MB_INITED = false;
function mbTheme(){ return (S && S.theme === 'dark') ? 'dark' : 'default'; }
function ensureMermaid(){
  if(window.mermaid){
    if(!MB_INITED) initMermaidEngine();
    return Promise.resolve();
  }
  if(MB_LOADING) return MB_LOADING;
  MB_LOADING = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = '/vendor/mermaid.min.js';
    sc.async = true;
    sc.onload = ()=>{ initMermaidEngine(); res(); };
    sc.onerror = ()=>{ MB_LOADING = null; rej(new Error('mermaid load failed')); };
    document.head.appendChild(sc);
  });
  return MB_LOADING;
}
function initMermaidEngine(){
  if(!window.mermaid || MB_INITED) return;
  try{
    window.mermaid.initialize(mbConfig());
    MB_INITED = true;
  }catch(e){ /* 初始化失败就让单块渲染时各自报错 */ }
}
/* 图表跟着笔记的绿色调走，别默认那套紫蓝色 */
function mbConfig(){
  const dark = (S && S.theme === 'dark');
  return {
    startOnLoad: false,
    securityLevel: 'loose',
    theme: dark ? 'dark' : 'base',
    fontFamily: 'inherit',
    themeVariables: dark ? {
      fontSize: '14px',
      primaryColor: '#25352d', primaryTextColor: '#e4ebe7', primaryBorderColor: '#4c8f6e',
      secondaryColor: '#2c3a34', tertiaryColor: '#1f2a25',
      lineColor: '#7d8f86', textColor: '#d6ded9', mainBkg: '#25352d',
      nodeBorder: '#4c8f6e', clusterBkg: '#1f2a25', clusterBorder: '#3a4a43',
      titleColor: '#e4ebe7', background: '#171d1a'
    } : {
      fontSize: '14px',
      primaryColor: '#e5f3eb', primaryTextColor: '#1b5c3c', primaryBorderColor: '#5aa17e',
      secondaryColor: '#f1f6f3', tertiaryColor: '#fbfdfc',
      lineColor: '#8c9a93', textColor: '#2c3330', mainBkg: '#e5f3eb',
      nodeBorder: '#5aa17e', clusterBkg: '#f4f9f6', clusterBorder: '#d6e6dd',
      titleColor: '#1c1f22', background: '#ffffff'
    },
    flowchart: { curve: 'basis', useMaxWidth: false, htmlLabels: true, padding: 12 },
    sequence: { useMaxWidth: false },
    gantt: { useMaxWidth: false },
    pie: { useMaxWidth: false },
    er: { useMaxWidth: false },
    class: { useMaxWidth: false },
    state: { useMaxWidth: false }
  };
}
/* 把容器里所有未渲染的图表画出来（已经画过的有 data-done 标记，不会重复） */
async function renderMermaidBlocks(root){
  const scope = root || document;
  const boxes = [...scope.querySelectorAll('.mb[data-mb]')].filter(b=>!b.dataset.done && !b.dataset.busy);
  if(!boxes.length) return;
  try{
    await ensureMermaid();
  }catch(e){
    boxes.forEach(b=>{
      b.dataset.done = '1';
      b.innerHTML = '<div class="mb-err">图表库没加载出来，检查下网络再刷新页面</div>';
    });
    return;
  }
  if(!window.mermaid) return;
  for(const box of boxes){
    if(box.dataset.done || !box.isConnected) continue;
    box.dataset.busy = '1';
    let code = '';
    try{ code = decodeURIComponent(box.dataset.mb); }catch(e){ code = box.dataset.mb || ''; }
    const key = mbTheme() + '::' + code;
    if(MB_CACHE.has(key)){
      box.innerHTML = MB_CACHE.get(key);
      box.dataset.done = '1'; delete box.dataset.busy;
      continue;
    }
    const id = 'mbx' + Math.random().toString(36).slice(2, 9);
    try{
      const out = await window.mermaid.render(id, code);
      MB_CACHE.set(key, out.svg);
      box.innerHTML = out.svg;
      box.dataset.done = '1';
    }catch(err){
      const msg = String((err && err.message) || err).split('\n')[0];
      box.innerHTML = `<div class="mb-err">图表语法有误：${esc(msg)}</div>
        <pre class="mb-src">${esc(code)}</pre>`;
      box.dataset.done = '1';
    }finally{
      delete box.dataset.busy;
      const junk = document.getElementById('d' + id);
      if(junk && junk.parentNode) junk.parentNode.removeChild(junk);
    }
  }
}
/* 换主题后清缓存重画 */
function refreshMermaid(){
  MB_CACHE.clear();
  if(window.mermaid && MB_INITED){
    try{ window.mermaid.initialize({ theme: mbTheme(), startOnLoad:false, securityLevel:'loose', fontFamily:'inherit' }); }catch(e){}
  }
  document.querySelectorAll('.mb[data-mb]').forEach(b=>{
    delete b.dataset.done; delete b.dataset.busy;
    b.innerHTML = '<div class="mb-hint">正在渲染图表…</div>';
  });
  renderMermaidBlocks(document);
}

/* ========== 媒体库 ========== */
let mediaCat = 'all';
let mediaList = [];          // 当前这屏渲染出来的媒体（搜索框还会再过滤一层）
const CATS = [
  {k:'all', label:'全部'}, {k:'pic', label:'图床图片'}, {k:'image', label:'图片'}, {k:'video', label:'视频'},
  {k:'audio', label:'音频'}, {k:'file', label:'文件'}, {k:'unused', label:'未引用'}, {k:'trash', label:'回收站'}
];
function kindOf(f){ if(f.type.startsWith('image')) return 'image'; if(f.type.startsWith('video')) return 'video'; if(f.type.startsWith('audio')) return 'audio'; return 'file'; }
// 一次渲染内复用：判断某个媒体文件是否被某篇笔记引用（图床图片没有 noteId，只能看正文）
function buildUsedIndex(){
  const bodies = (S.notes||[]).filter(n=>!n.trashed && !n.deleted && n.body).map(n=>n.body);
  return function isUsed(m){
    if(!m) return false;
    if(m.noteId) return true;
    const u = m.url;
    if(!u) return false;
    for(const body of bodies){ if(body.indexOf(u) >= 0) return true; }
    return false;
  };
}
function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function mediaShelf(){
  const all = allMedia();
  const isUsed = buildUsedIndex();
  const fixed = {
    all: all.length,
    pic: all.filter(m=>m.pic).length,
    unused: all.filter(m=>!isUsed(m)).length,
    trash: 0
  };
  const countOf = k => (k in fixed) ? fixed[k] : all.filter(m=>kindOf(m)===k).length;
  let h = `<button class="shelf-row" data-back-notes style="margin-bottom:6px">
      <span class="t" style="color:rgb(var(--ink-2));font-size:13px">‹ 返回笔记</span></button>`;
  h += CATS.map(c=>`<button class="shelf-row" data-media-cat="${c.k}" style="${mediaCat===c.k?'background:rgb(var(--hover));color:rgb(var(--ink))':''}">
      <span class="t" style="font-weight:${mediaCat===c.k?500:400}">${c.label}</span>
      <span class="meta">${countOf(c.k)}</span></button>`).join('');
  const used = all.filter(m=>isUsed(m)).length;
  const bytes = all.reduce((a,m)=>a+(m.size||0),0);
  h += `<div style="position:absolute;left:20px;right:20px;bottom:78px;font-size:11px;line-height:1.7;color:rgb(var(--faint))">
      ${all.length} 个文件 · ${fmtSize(bytes)} · 被 ${used} 篇引用<br>${CLOUD_UPLOAD === false
        ? '当前账号未开通 VIP · 图片只存本机'
        : (mediaCat==='pic'
            ? '图床 pic.139t.cn · 存 R2，读图 img.139t.cn'
            : (isConnected()?'图床 + Cloudflare KV · 跨设备可见':'仅本机会话可见 · 去「账号」里登录'))}</div>`;
  return h;
}

function renderMedia(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  const isUsed = buildUsedIndex();
  const list = allMedia().filter(m=>{
    if(mediaCat==='all') return true;
    if(mediaCat==='pic') return !!m.pic;
    if(mediaCat==='unused') return !isUsed(m);
    return kindOf(m)===mediaCat;
  });
  scrollEl.style.display='';
  mediaList = list;
  scrollEl.innerHTML = `<div class="view-pad" style="position:relative;height:100%">
      <div class="media-bar">
        <div class="media-search">${ic('search')}
          <input id="mediaSearch" placeholder="搜索文件名" spellcheck="false"></div>
        ${list.length ? `<button class="media-danger" data-mdall${mediaCat==='unused' ? ' title="把所有没被笔记引用的图片一次删掉"' : ''}>${
          mediaCat==='unused' ? '删除全部未引用' : '全部删除'}（${list.length}）</button>` : ''}
      </div>
      ${list.length? `<div class="media-grid" id="mediaGrid">${list.map((m,i)=>`
        <div class="media-card" data-name="${esc(m.name.toLowerCase())}" data-mi="${i}">
          <div class="media-thumb">${m.type.startsWith('image')?`<img src="${m.url}" alt="" loading="lazy">`:kindOf(m).toUpperCase()}</div>
          <div class="media-name" title="${esc(m.name)}">${esc(m.name)}</div>
          <button class="media-del" data-mdel="${i}" title="删除这个文件" aria-label="删除">${ic('trash')}</button>
        </div>`).join('')}</div>`
      : `<div class="media-empty">
          ${ic('image')}<span>${mediaCat==='pic'
            ? (CLOUD_UPLOAD === false
                ? '当前账号未开通云图床，粘贴的图片只存在本机笔记里。'
                : (isConnected() ? '图床里还没有图片。在笔记里粘贴或拖入图片就会传到这里。' : '登录后粘贴或拖入的图片才会传到图床。'))
            : (mediaCat==='unused'
                ? '没有未被引用的图片：现在图库里的图片都还被笔记用着。'
                : '还没有文件。在笔记中粘贴或拖入图片即可自动加入媒体库。')}</span>
        </div>`}
    </div>`;
  const ms = $('#mediaSearch');
  if(ms) ms.oninput = ()=>{
    const q = ms.value.trim().toLowerCase();
    document.querySelectorAll('#mediaGrid .media-card').forEach(c=>{
      c.style.display = !q || c.dataset.name.includes(q) ? '' : 'none';
    });
  };
  const delAll = scrollEl.querySelector('[data-mdall]');
  if(delAll) delAll.onclick = ()=>deleteMediaBatch();
  scrollEl.querySelectorAll('[data-media-cat]').forEach(b=>b.onclick=()=>{ mediaCat=b.dataset.mediaCat; renderShelf(); renderMain(); });
  scrollEl.querySelectorAll('[data-mdel]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); deleteMedia(list[+b.dataset.mdel]); };
  });
  scrollEl.querySelectorAll('.media-card').forEach(c=>{
    c.onclick = ()=>{ const m = list[+c.dataset.mi]; if(m) window.open(m.url, '_blank', 'noopener'); };
  });
  // 首次进入异步拉一次云端列表（图床 + 旧媒体库并取）
  if(isConnected()){
    const jobs = [];
    if(!remoteMedia && !mediaLoading) jobs.push(loadRemoteMedia(true));
    if(!picMedia && !picLoading) jobs.push(loadPicMedia(true));
    if(jobs.length) Promise.all(jobs).then(()=>{ if(S.view==='media'){ renderShelf(); renderMedia(); } });
  }
}

/* 删除媒体文件：云端走 DELETE /api/media/:uid/:id，本机 blob 直接从 S.media 摘掉 */
function mediaRefs(m){
  const key = m.url;
  return (S.notes || []).filter(n=>!n.trashed && n.body && n.body.indexOf(key) >= 0);

async function deleteMedia(m){

/* 真正干活的那一层：本地 blob、云端文件、图床图片各走各的，不弹确认、不重画 */
async function deleteMediaOne(m){
  if(!m) return false;
  try{
    if(m.pic){
      if(!isConnected()) return false;
      const r = await fetch('/api/pic?key=' + encodeURIComponent(m.key), { method:'DELETE', headers: authHeaders(false) });
      return !!r.ok;
    }
    if(m.remote){
      if(!isConnected()) return false;
      const r = await fetch(m.url, { method:'DELETE', headers: authHeaders(false) });
      return !!r.ok;
    }
    const i = (S.media || []).findIndex(x=>x.id === m.id || x.url === m.url);
    if(i >= 0){
      try{ URL.revokeObjectURL(S.media[i].url); }catch(e){}
      S.media.splice(i, 1);
    }
    return true;
  }catch(e){ return false; }
}

  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',

function lLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lLeapDays(y){ return lLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function lMonthDays(y, m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function lYearDays(y){
  let sum = 348;
  for(let i=0x8000; i>0x8; i>>=1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
  return sum + lLeapDays(y);
}
/* 公历 → 农历。只用于格子里标个日子，不做节气。 */
function solar2lunar(y, m, d){
  let offset = Math.floor((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  if(offset < 0) return null;
  let i, temp = 0;
  for(i=1900; i<2101 && offset>0; i++){ temp = lYearDays(i); offset -= temp; }
  if(offset < 0){ offset += temp; i--; }
  const year = i;
  const leap = lLeapMonth(year);
  let isLeap = false;
  for(i=1; i<13 && offset>0; i++){
    if(leap>0 && i === leap+1 && !isLeap){ --i; isLeap = true; temp = lLeapDays(year); }
    else temp = lMonthDays(year, i);
    if(isLeap && i === leap+1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap>0 && i === leap+1){
    if(isLeap) isLeap = false; else { isLeap = true; --i; }
  }
  if(offset < 0){ offset += temp; --i; }
  return { y: year, m: i, d: offset + 1, leap: isLeap };
}
function lunarLabel(y, m, d){
  try{
    const l = solar2lunar(y, m, d);
    if(!l) return '';
    if(l.d === 1) return (l.leap ? '闰' : '') + LUNAR_MON[l.m];   // 初一写月名，和日历 App 一致
    return LUNAR_DAY[l.d];
  }catch(e){ return ''; }
}

const S_TERM = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,
  263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];

  '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
function calTermDay(y, n){
  const ms = 31556925974.7 * (y - 1900) + S_TERM[n] * 60000 + Date.UTC(1900, 0, 6, 2, 5);
  return new Date(ms).getUTCDate();
}

const FEST_SOLAR = {
  '1-1':'元旦','2-14':'情人节','3-8':'妇女节','3-12':'植树节','4-1':'愚人节',
  '5-1':'劳动节','5-4':'青年节','6-1':'儿童节','7-1':'建党节','8-1':'建军节',
  '9-10':'教师节','10-1':'国庆节','11-11':'双十一','12-24':'平安夜','12-25':'圣诞节'
};
const FEST_LUNAR = {
  '1-1':'春节','1-15':'元宵','2-2':'龙抬头','5-5':'端午','7-7':'七夕',
  '7-15':'中元','8-15':'中秋','9-9':'重阳','12-8':'腊八','12-23':'小年'
};
function calFestival(y, m, d){
  const base = (m - 1) * 2;                 // 每个月两个节气
  for(let k=0; k<2; k++){
    const n = base + k;
    if(calTermDay(y, n) === d) return S_NAME[n];
  }
  const l = solar2lunar(y, m, d);
  if(l && !l.leap && FEST_LUNAR[l.m + '-' + l.d]) return FEST_LUNAR[l.m + '-' + l.d];
  return FEST_SOLAR[m + '-' + d] || '';
}

const CAL_COLORS = ['#3b82f6','#e0453a','#16a34a','#8b5cf6','#f59e0b','#0ea5e9','#ec4899','#14b8a6'];
function calColor(name, own){
  if(/^#([\da-f]{3}|[\da-f]{6})$/i.test(own || '')) return own;
  let h = 0;
  for(const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) | 0;

}
function hexA(hex, a){
  let h = String(hex || '').replace('#', '');
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.slice(0,2),16) || 0, g = parseInt(h.slice(2,4),16) || 0, b = parseInt(h.slice(4,6),16) || 0;

}
const calKeyOf = (y, m, d) => y * 10000 + m * 100 + d;

function calCells(y, m){
  const lead = (new Date(y, m-1, 1).getDay() + 6) % 7;     // 周一开头
  const cells = [];
  for(let i=0; i<42; i++){
    const d = new Date(y, m-1, 1 - lead + i);
    cells.push({

      out: d.getMonth()+1 !== m,

const DAYMS = 86400000;

/* 全天事件的「第几天」用 UTC 日期算：CalDAV 里的 DTSTART;VALUE=DATE 就是当天 UTC 零点，
   用本地时区算会整体挪 8 小时，end 那侧就多出一格（23 号建的日程 24 号也跟着出现）。
   苹果旧脚本给的是本地零点的全天事件，这时退回本地日期。
   end 有两种写法：CalDAV 是次日零点的排他边界，旧脚本是当天 23:59 —— 减 1 秒两种都能落到同一天。 */
function calAllDayOrds(ev){
  const d0 = new Date(ev.start);
  const utcMode = d0.getTime() % DAYMS === 0;
  const ord = ts => {
    const d = new Date(ts);
    return utcMode
      ? Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / DAYMS)
      : Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAYMS);
  };
  const a = ord(ev.start);
  const b = ord(Math.max(ev.start, ev.end - 1000));
  return [a, Math.max(a, b)];
}
const ordToKey = o => {
  const d = new Date(o * DAYMS);
  return calKeyOf(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate());
};

/* 待办在苹果日历里的「文件名」：用 笔记 id + 文字 做稳定 key，
   这样上方插入新行不会让下面的待办换身份（行号会变，文字不会）。
   注意别叫 todoKey：待办归档那套（第 5544 行）已经占了这个名字，
   同名函数后定义的会顶掉前一个，曾导致归档 key 全撞成同一个哈希。 */
function calTodoHash(noteId, text){
  let h = 2166136261;
  const s = String(noteId || '') + '|' + String(text || '');
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}

/* 笔记里带日期的待办也一并铺到日历上：只读展示，点开能跳回那条待办 */
function calTodoEvents(){
  if(typeof collectTodos !== 'function') return [];
  const out = [];
  try{
    for(const t of collectTodos()){
      if(!t.due) continue;
      const hasTime = !!t.hasTime;
      const dt = new Date(t.due);
      // 全天用 UTC 午夜（和 CalDAV 的 DTSTART;VALUE=DATE 一致），写回苹果才是同一天
      const start = hasTime ? t.due : Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
      out.push({
        uid: 'todo:' + t.noteId + ':' + t.line,
        key: calTodoHash(t.noteId, t.text),
        cal: '待办', color: '#8b5cf6',
        title: t.text || '待办',
        start,
        end: hasTime ? t.due + 1800000 : start + DAYMS,
        allDay: !hasTime,
        location: '', notes: '', href: '', etag: '',
        todo: { noteId: t.noteId, line: t.line, done: !!t.done, repeat: t.repeat || '' }
      });
    }
  }catch(e){}
  return out;
}
/* 要推给苹果日历的待办：全部推（做完的不撤，只在标题前打 [已完成]）；
   只有笔记里这条待办真的删掉了，苹果日历里那条才会跟着删（后端按 key 差集处理） */
function calTodoPushList(){
  return calTodoEvents().map(e => ({
    key: e.key,
    title: e.todo.done ? '[已完成] ' + e.title : e.title,
    start: e.start, end: e.end, allDay: e.allDay
  }));
}
/* 日历用的全量事件 = iCloud 同步来的 + 笔记里带日期的待办 */
function calAllEvents(){
  return (CAL.events || []).concat(calTodoEvents());

/* 事件按天摊开：跨天的（假期、出差）每一格都要出现 */
function calGroup(events){
  const map = new Map();
  const push = (k, ev) => { if(!map.has(k)) map.set(k, []); map.get(k).push(ev); };
  for(const ev of events){
    if(!ev || CAL.hidden[ev.cal]) continue;
    const s = new Date(ev.start);
    if(isNaN(s)) continue;
    let a, b;
    if(ev.allDay){
      [a, b] = calAllDayOrds(ev);
    }else{
      a = Math.floor(Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()) / DAYMS);
      const e = new Date(ev.end);
      b = Math.floor(Date.UTC(e.getFullYear(), e.getMonth(), e.getDate()) / DAYMS);
      if(isNaN(b) || b < a) b = a;
    }
    if(b - a > 120) b = a + 120;               // 跑飞的长事件兜一下
    for(let o = a; o <= b; o++) push(ordToKey(o), ev);
  }
  for(const arr of map.values()){
    arr.sort((a,b)=>{
      if(!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
      return a.start - b.start;
    });
  }
  return map;
}

const calHm = ts => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};

function calShelf(){
  // 连了 CalDAV 就按「同步哪些日历」来列（点一下就是开关，会真的影响拉取）；
  // 没连的时候只有本地快照，点了只是当前视图里隐藏
  const linked = !!(CAL.dav && CAL.dav.connected);
  const list = linked
    ? (CAL.dav.calendars || []).map(c => ({ cal: c.name, count: '', color: c.color, href: c.href, on: c.on !== false }))
    : ((CAL.meta && CAL.meta.calendars) || []);
  const y = CAL.y || new Date().getFullYear();
  const m = CAL.m || (new Date().getMonth()+1);
  // 日历列表默认折叠（手机抽屉里没有折叠头，直接展开）
  const mobile = window.innerWidth <= 640;
  const open = mobile || CAL.calOpen === true;
  const onCount = list.filter(c => linked ? c.on : !CAL.hidden[c.cal]).length;
  let html = `<button class="cal-shelf-hd" data-calcalft="1" aria-expanded="${open?'true':'false'}"
      title="${open?'收起日历列表':'展开日历列表'}">
      <svg class="chev${open?' open':''}" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      <span class="t">我的日历</span><span class="n">${onCount||''}</span>
    </button>`;
  if(linked && CAL.authBad){
    html += `<button class="cal-warn" data-calreauth="1">登录已失效 · 点此重连</button>`;
  }
  if(open){
    if(!list.length){
      html += `<div class="ol-empty" style="padding:6px 9px">${CAL.loading ? '读取中…' : '还没有同步的日历'}</div>`;
    }else{
      html += list.map(c=>{
        const on = linked ? c.on : !CAL.hidden[c.cal];
        const src = linked ? `data-calhref="${esc(c.href)}"` : `data-calsrc="${esc(c.cal)}"`;
        return `<button class="cal-src${on?'':' off'}" ${src} title="${on?'点击隐藏':'点击显示'}">
          <i style="background:${calColor(c.cal, c.color)}"></i><span class="t">${esc(c.cal)}</span><span class="n">${c.count||''}</span>
        </button>`;
      }).join('');
    }
  }
  /* 迷你月历 */
  const cells = calCells(y, m);
  const tk = (()=>{ const t = new Date(); return calKeyOf(t.getFullYear(), t.getMonth()+1, t.getDate()); })();
  const evDays = new Set([...calGroup(calAllEvents()).keys()]);
  html += `<div class="cal-mini">
    <div class="cal-mini-hd">
      <button data-calprev="1" aria-label="上个月">${'<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>'}</button>
      <b>${y}年${m}月</b>
      <button data-calnext="1" aria-label="下个月">${'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'}</button>
    </div>
    <div class="cal-mini-grid">
      ${['一','二','三','四','五','六','日'].map(d=>`<span class="h">${d}</span>`).join('')}
      ${cells.map(c=>{
        const cls = c.out ? 'o' : (c.key===tk ? 't' : (evDays.has(c.key) ? 's' : ''));
        return `<span class="${cls}" data-calday="${c.key}">${c.d}</span>`;
      }).join('')}
    </div>
  </div>`;
  /* 没写日期的待办 + 归档：写了日期的已经在格子里了，不在这儿重复 */
  html += calTodoPanelHtml();
  return html;
}

/* 左栏三个标签：待办（未完成）/ 完成 / 归档。
   待办里没写日期的排在前面——它们不会出现在右边的格子，只能在这儿看到 */
/* 日程一行（左栏「待办」里混排用）：点开和日历格子里点事件是同一个卡片 */
function calTodoEvRow(ev){
  const col = calColor(ev.cal, ev.color);
  const d = new Date(Number(ev.start) || 0);
  const t = new Date();
  const same = d.toDateString() === t.toDateString();
  const md = same ? '今天' : ((d.getMonth() + 1) + '/' + d.getDate());
  const hm = ev.allDay ? '' : ' ' + calHm(ev.start);
  return `<div class="tsi evrow" data-calevrow="${esc(ev.uid)}" title="${esc(ev.title || '')}">
    <i class="evd" style="background:${col}"></i>
    <div class="m"><span class="t">${esc(ev.title || '（无标题）')}</span><span class="src">${esc(ev.cal || '日历')}</span></div>
    <span class="tm">${md}${hm}</span>
  </div>`;
}
function calTodoPanelHtml(){
  const tab = (CAL.todoTab === 'arch' || CAL.todoTab === 'done') ? CAL.todoTab : 'todo';
  let all = [], arch = [];
  try{ all = collectTodos(); }catch(e){}
  try{ arch = todoArchivedList(); }catch(e){}
  // 未完成：无日期在前（按笔记顺序），有日期的按时间排后面
  const open = all.filter(t => !t.done).sort((a, b)=>{
    if(!a.due && !b.due) return 0;
    if(!a.due) return -1;
    if(!b.due) return 1;
    return a.due - b.due;
  });
  // 完成：最近做完的在前
  const done = all.filter(t => t.done).sort((a, b)=> (b.doneDate || b.due || 0) - (a.doneDate || a.due || 0));
  // 「待办」里也带上日历里的日程：没日期的待办在前，其余（日程 / 有日期的待办）按日期往后排
  const mixed = [];
  open.forEach(t => mixed.push({ ts: Number(t.due) || 0, html: todoRowHtml(t, { withDate:true }) }));
  if(tab === 'todo'){
    (CAL.events || []).forEach(ev => {
      if(!ev || CAL.hidden[ev.cal]) return;
      let ts = Number(ev.start) || 0;
      if(ev.allDay){                       // 全天事件是 UTC 午夜，换算成本地当天 0 点再排序
        const d = new Date(ts);
        ts = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()).getTime();
      }
      mixed.push({ ts, html: calTodoEvRow(ev) });
    });
  }
  mixed.sort((a, b)=>{
    if(!a.ts && !b.ts) return 0;
    if(!a.ts) return -1;
    if(!b.ts) return 1;
    return a.ts - b.ts;
  });
  const rows = tab === 'arch' ? arch.map(archRowHtml).join('')
    : tab === 'done' ? done.map(t => todoRowHtml(t, { withDate:true })).join('')
    : mixed.map(x => x.html).join('');
  const empty = tab === 'arch'
    ? '还没有归档的待办。<br>「完成」里那条右边的方框，双击即可归档。'
    : tab === 'done'
      ? '还没有完成的待办。<br>勾掉一条就会出现在这里。'
      : '没有待办。<br>在笔记里写「- [ ] 事项」就会出现在这儿。';
  const tabHtml = (k, label, n)=>`<button class="cal-tab${tab===k?' on':''}" data-caltab="${k}">${label}${n?`<i>${n}</i>`:''}</button>`;
  return `<div class="cal-todos">
    <div class="cal-tabs">
      ${tabHtml('todo', '待办', open.length)}
      ${tabHtml('done', '完成', done.length)}
      ${tabHtml('arch', '归档', arch.length)}
    </div>
    <div class="cal-todo-body">${rows || `<div class="cal-todo-empty">${empty}</div>`}</div>
  </div>`;
}

/* 日历这块的内容画在哪儿，跟「标签 / 回收站」一个套路：
   桌面（>900）画在中栏，窄屏手机 / 平板竖屏没有中栏，仍旧画在抽屉里 */
function paintCalShell(){
  if(S.view !== 'calendar') return;
  if(window.innerWidth > 900) renderCalList(); else renderShelf();
}
/* 中栏：我的日历 + 迷你月历 + 待办 / 完成 / 归档 */
function renderCalList(){
  if(window.innerWidth <= 900) return;      // 窄屏没有中栏，日历内容画在抽屉里
  const rows = $('#nlRows'); if(!rows) return;
  const host = $('#noteList'); if(!host) return;
  host.classList.remove('hidden');
  const tEl = $('#nlTitle'), cEl = $('#nlCount');
  if(tEl) tEl.textContent = '日程待办';
  const bkEl = $('#nlBack');
  if(bkEl){ bkEl.classList.remove('show'); bkEl.onclick = null; }
  if(cEl){
    const n = (CAL.dav && CAL.dav.connected) ? (CAL.dav.calendars || []).length : ((CAL.meta && CAL.meta.calendars) || []).length;
    cEl.textContent = n ? String(n) : '';
  }
  const keepTop = rows.scrollTop;
  rows.innerHTML = calShelf();
  rows.scrollTop = keepTop;
  bindCalShelf(rows);
}

function bindCalShelf(root){
  const el = root || shelfBody;
  const repaint = ()=>{ paintCalShell(); paintCalendar(); };
  const rw = el.querySelector('[data-calreauth]');
  if(rw) rw.onclick = ()=>openCalSetup({ reauth:true });
  const cfold = el.querySelector('[data-calcalft]');
  if(cfold) cfold.onclick = ()=>{ CAL.calOpen = !(CAL.calOpen === true); paintCalShell(); };
  el.querySelectorAll('[data-caltab]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.caltab;
      CAL.todoTab = (k === 'arch' || k === 'done') ? k : 'todo';
      paintCalShell();
    };
  });
  // 列表里混排的日程：点开和日历格子里点事件是同一张卡片
  el.querySelectorAll('[data-calevrow]').forEach(r=>{
    r.onclick = e=>{ e.stopPropagation(); calShowEvent(r.dataset.calevrow, r); };
  });
  // 左栏的待办和「待办日程」页共用一套交互：勾选 / 设提醒 / 归档 / 点开原笔记
  if(typeof bindTodoBlock === 'function' && el.querySelector('.cal-todos')){
    bindTodoBlock(el, repaint);
  }
  el.querySelectorAll('[data-calsrc]').forEach(b=>{
    b.onclick = ()=>{
      const name = b.dataset.calsrc;
      CAL.hidden[name] = !CAL.hidden[name];
      repaint();
    };
  });
  el.querySelectorAll('[data-calhref]').forEach(b=>{
    b.onclick = async ()=>{
      const href = b.dataset.calhref;
      const cur = (CAL.dav.calendars || []).find(c => c.href === href);
      if(!cur) return;
      const turningOn = cur.on === false;
      try{
        await apiCall('/api/caldav', { method:'POST', body:{ action:'toggle', href, on: turningOn } });
        await loadCalDav();
        CAL.key = '';
        paintCalShell();
        // 刚打开的日历库里还没有事件，顺手拉一次，否则点了像没反应
        if(turningOn){ await calSync(null, true); }
        await ensureCalData(true);
      }catch(e){ toast(e.message || '改不了'); }
    };
  });
  el.querySelectorAll('[data-calprev]').forEach(b=>b.onclick = ()=>calShift(-1));
  el.querySelectorAll('[data-calnext]').forEach(b=>b.onclick = ()=>calShift(1));
  el.querySelectorAll('[data-calday]').forEach(b=>{
    b.onclick = ()=>{
      const k = Number(b.dataset.calday);
      const y = Math.floor(k/10000), m = Math.floor(k%10000/100), d = k%100;
      CAL.y = y; CAL.m = m;
      renderCalendar();
    };
  });
}

function calShift(delta){
  let y = CAL.y, m = CAL.m + delta;
  if(m < 1){ m = 12; y--; }
  if(m > 12){ m = 1; y++; }
  CAL.y = y; CAL.m = m;
  renderCalendar();
}
function calToday(){
  const t = new Date();
  CAL.y = t.getFullYear(); CAL.m = t.getMonth()+1;
  renderCalendar();
}

function paintCalendar(){
  if(S.view !== 'calendar') return;   // 不在日历页时别去动正文容器（下面会整体重写 scrollEl）
  if(!CAL.y){ const t = new Date(); CAL.y = t.getFullYear(); CAL.m = t.getMonth()+1; }
  const y = CAL.y, m = CAL.m;
  const cells = calCells(y, m);
  const groups = calGroup(calAllEvents());
  const t = new Date();
  const todayKey = calKeyOf(t.getFullYear(), t.getMonth()+1, t.getDate());

  const body = cells.map(c=>{
    const evs = groups.get(c.key) || [];
    const shown = evs.slice(0, 3);
    const more = evs.length - shown.length;
    const narrow = window.innerWidth <= 640;   // 手机格子窄，时间前缀会把标题挤掉，点开再看
    const evHtml = shown.map(ev=>{
      const col = calColor(ev.cal, ev.color);
      const label = (ev.allDay || narrow ? '' : calHm(ev.start) + ' ') + ev.title;
      const cls = 'cal-ev' + (ev.todo ? ' todo' : '') + (ev.todo && ev.todo.done ? ' done' : '');
      return `<button class="${cls}" data-calev="${esc(ev.uid)}" style="--evc:${col};--evbg:${hexA(col,.13)}" title="${esc(label)}">
        <i class="dot"></i><b>${esc(label)}</b></button>`;
    }).join('');
    const fest = calFestival(c.y, c.m, c.d);
    const sub = fest || lunarLabel(c.y, c.m, c.d);
    return `<div class="cal-cell${c.out?' out':''}${c.key===todayKey?' today':''}" data-day="${c.key}">
      <div class="cal-cl"><span class="cal-d">${c.d}</span><span class="cal-l${fest?' fest':''}">${sub}</span></div>
      <div class="cal-evs">${evHtml}${more>0?`<div class="cal-more">还有 ${more} 项</div>`:''}</div>
    </div>`;
  }).join('');

  const dav = CAL.dav || {};
  const linked = !!dav.connected;
  let note = '';
  if(CAL.err){
    note = `<div class="cal-note">${esc(CAL.err)}</div>`;
  }

  scrollEl.innerHTML = `<div class="cal-wrap">
    <div class="cal-bar">
      <div class="cal-month">${y} 年 ${m} 月${CAL.loading?' <i>同步中…</i>':''}</div>
      <div class="cal-tools">
        ${linked
          ? `<button class="cal-syncbtn${CAL.authBad ? ' bad' : ''}${CAL.syncing ? ' on' : ''}${CAL.writing > 0 ? ' busy' : ''}" id="calSyncBtn" data-calsync="1" title="从 iCloud 拉一次"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/></svg><b class="cal-sync-t">${calSyncLabel()}</b></button>`
          : `<button class="cal-syncbtn login" data-callogin="1" title="用 Apple ID 连接 iCloud 日历，之后两边自动一致"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/></svg>同步苹果日历</button>`}
        <div class="cal-seg"><button class="on" disabled>月</button></div>
        <div class="cal-step">
          <button data-calprev="1" aria-label="上个月"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="cal-today" data-caltoday="1">今天</button>
          <button data-calnext="1" aria-label="下个月"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
    ${note}
    <div class="cal-dows">${['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-body">${body}</div>
  </div>`;

  const wrap = scrollEl.querySelector('.cal-wrap');
  if(wrap){
    wrap.querySelectorAll('[data-calprev]').forEach(b=>b.onclick = ()=>calShift(-1));
    wrap.querySelectorAll('[data-calnext]').forEach(b=>b.onclick = ()=>calShift(1));
    wrap.querySelectorAll('[data-caltoday]').forEach(b=>b.onclick = calToday);
    wrap.querySelectorAll('[data-calev]').forEach(b=>{
      b.onclick = e=>{ e.stopPropagation(); calShowEvent(b.dataset.calev, b); };
    });
    wrap.querySelectorAll('[data-day]').forEach(c=>{
      c.onclick = ()=>{
        const k = Number(c.dataset.day);
        const now = Date.now();
        // 双击 = 新建（第一次点击先等 300ms，看是不是双击的起手）
        if(CAL_TAP.k === k && now - CAL_TAP.at < 420){
          CAL_TAP = { k: 0, at: 0 };
          if(CAL.dav && CAL.dav.connected) openCalEventForm(null, k);
          else openCalSetup();
          return;
        }
        CAL_TAP = { k, at: now };
        setTimeout(()=>{
          if(CAL_TAP.k !== k) return;
          CAL_TAP = { k: 0, at: 0 };
          if((calGroup(calAllEvents()).get(k) || []).length) calShowDay(k, c);
        }, 300);
      };
    });
    wrap.querySelectorAll('[data-calsync]').forEach(b=>{
      b.onclick = e=>{
        e.stopPropagation();
        if(CAL.authBad){ openCalSetup({ reauth:true }); return; }
        calSync(b);
      };
    });
    wrap.querySelectorAll('[data-callogin]').forEach(b=>{
      b.onclick = e=>{ e.stopPropagation(); openCalSetup(); };
    });
    wrap.querySelectorAll('[data-calopen]').forEach(a=>{
      a.onclick = e=>{ e.preventDefault(); openCalSetup(); };
    });
  }
}

function calShowEvent(uid, anchor){
  document.querySelectorAll('.cal-pop').forEach(e=>e.remove());
  const ev = calAllEvents().find(x=>x.uid === uid);
  if(!ev) return;
  const col = calColor(ev.cal, ev.color);
  const d1 = new Date(ev.start), d2 = new Date(ev.end);
  const sameDay = d1.toDateString() === d2.toDateString();
  const when = ev.allDay
    ? `${d1.getMonth()+1}月${d1.getDate()}日 全天`
    : `${d1.getMonth()+1}月${d1.getDate()}日 ${calHm(ev.start)} – ${sameDay ? calHm(ev.end) : (d2.getMonth()+1)+'月'+d2.getDate()+'日 '+calHm(ev.end)}`;
  const isTodo = !!ev.todo;
  const pop = document.createElement('div');
  pop.className = 'cal-pop';
  pop.innerHTML = `<div class="cal-pop-t${isTodo && ev.todo.done ? ' done' : ''}">${esc(ev.title)}</div>
    <div class="cal-pop-r"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 1.8"/></svg><span>${when}</span></div>
    ${ev.location?`<div class="cal-pop-r"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>${esc(ev.location)}</span></div>`:''}
    <div class="cal-pop-cal"><i style="background:${col}"></i>${esc(ev.cal || '日历')}${isTodo && ev.todo.done ? ' · 已完成' : ''}</div>
    ${ev.notes?`<div class="cal-pop-n">${esc(ev.notes)}</div>`:''}
    ${isTodo
      ? `<div class="cal-pop-btns"><button class="ed" data-evtodo="1">打开这条待办</button></div>`
      : ((ev.pending && !ev.href) ? `<div class="cal-pop-wait">正在同步到苹果日历…</div>`
        : (ev.href ? `<div class="cal-pop-btns"><button class="ed" data-evedit="1">编辑</button><button class="dl" data-evdely="1">删除</button></div>
      <div class="cal-pop-cf" data-cf hidden><span>苹果日历上也会一起删掉</span><button class="cf-no">取消</button><button class="cf-yes">删除</button></div>` : ''))}`;
  document.body.appendChild(pop);
  const tb = pop.querySelector('[data-evtodo]');
  if(tb) tb.onclick = ()=>{
    pop.remove();
    if(typeof openNote === 'function') openNote(ev.todo.noteId);
    toast('待办在「' + (noteById(ev.todo.noteId) || {}).title + '」里，改日期也去那边改');
  };
  const eb = pop.querySelector('[data-evedit]');
  if(eb) eb.onclick = ()=>{ pop.remove(); openCalEventForm(ev, 0); };
  const cf = pop.querySelector('[data-cf]');
  const btnRow = pop.querySelector('.cal-pop-btns');
  const db = pop.querySelector('[data-evdely]');
  if(db) db.onclick = ()=>{
    // 用页面里的确认条，别弹系统对话框（原来那个 confirm 会跳出当前上下文）
    btnRow.hidden = true; cf.hidden = false;
    pop.querySelector('.cf-no').onclick = ()=>{ cf.hidden = true; btnRow.hidden = false; };
    pop.querySelector('.cf-yes').onclick = (e)=>{
      const i0 = CAL.events.indexOf(ev);
      if(i0 >= 0) CAL.events.splice(i0, 1);
      pop.remove();
      calRepaint();
      calWriteStart();
      toast('已删除，正在同步到苹果日历');
      apiCall('/api/caldav', { method:'POST', body:{ action:'remove', href: ev.href, etag: ev.etag } })
        .then(()=>{ if(CAL.dav) CAL.dav.lastSync = Date.now(); })
        .catch(e2=>{
          if(i0 >= 0) CAL.events.splice(i0, 0, ev);
          toast('删除失败：' + (e2.message || '未知错误'));
        })
        .finally(()=>{ calWriteEnd(); calRepaint(); });
    };
  };
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - pw - 12);
  let yy = r.bottom + 6;
  if(yy + ph > window.innerHeight - 12) yy = Math.max(12, r.top - ph - 6);
  pop.style.left = Math.max(8, x) + 'px';
  pop.style.top = yy + 'px';
  setTimeout(()=>{
    const off = e=>{ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('pointerdown', off, true); } };
    document.addEventListener('pointerdown', off, true);
  }, 0);
}

/* 点格子看当天：手机上事件只剩圆点，得有个地方看清楚是什么 */
function calShowDay(key, anchor){
  document.querySelectorAll('.cal-pop').forEach(e=>e.remove());
  const list = calGroup(calAllEvents()).get(key) || [];
  if(!list.length) return;
  const m = Math.floor(key % 10000 / 100), d = key % 100;
  const pop = document.createElement('div');
  pop.className = 'cal-pop';
  pop.innerHTML = `<div class="cal-pop-t">${m} 月 ${d} 日 · ${list.length} 项</div>
    ${list.map(ev=>{
      const col = calColor(ev.cal, ev.color);
      const tm = ev.allDay ? '全天' : calHm(ev.start) + (ev.end>ev.start ? '–' + calHm(ev.end) : '');
      return `<div class="cal-day-item"><i style="background:${col}"></i><div>
        <div class="t">${esc(ev.title)}</div>
        <div class="m">${tm}${ev.cal ? ' · ' + esc(ev.cal) : ''}</div>
      </div></div>`;
    }).join('')}`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - pw - 10);
  let yy = r.bottom + 6;
  if(yy + ph > window.innerHeight - 12) yy = Math.max(10, window.innerHeight - ph - 12);
  pop.style.left = Math.max(8, x) + 'px';
  pop.style.top = yy + 'px';
  setTimeout(()=>{
    const off = e=>{ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('pointerdown', off, true); } };
    document.addEventListener('pointerdown', off, true);
  }, 0);
}

/* ---------- CalDAV：连接 / 同步 / 编辑（写回 iCloud） ---------- */
function calAgo(ts){
  if(!ts) return '还没同步过';
  const d = Date.now() - ts;
  if(d < 60000) return '刚刚';
  if(d < 3600000) return Math.floor(d/60000) + ' 分钟前';
  if(d < 86400000) return Math.floor(d/3600000) + ' 小时前';
  return Math.floor(d/86400000) + ' 天前';
}
/* ---------- 同步状态：顶部按钮上直接显示「同步中 / 保存中 / 几分钟前」 ---------- */
function calSyncLabel(){
  if(CAL.authBad) return '重新连接';
  if(CAL.syncing) return '同步中';
  if(CAL.writing > 0) return '保存中';
  const d = CAL.dav || {};
  return d.lastSync ? calAgo(d.lastSync) : '还没同步';
}
function paintCalSyncBtn(){
  const b = document.querySelector('#calSyncBtn');
  if(!b) return;
  b.classList.toggle('on', !!CAL.syncing);
  b.classList.toggle('busy', CAL.writing > 0);
  b.classList.toggle('bad', !!CAL.authBad);
  const t = b.querySelector('.cal-sync-t');
  if(t) t.textContent = calSyncLabel();
  const d = CAL.dav || {};
  b.title = CAL.authBad ? 'iCloud 登录失效，点一下重新连接'
    : (d.lastSync ? '上次同步 ' + new Date(d.lastSync).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) + '，点一下立即同步'
      : '点一下从 iCloud 拉取');
}
function calWriteStart(){ CAL.writing = (CAL.writing || 0) + 1; paintCalSyncBtn(); }
function calWriteEnd(){ CAL.writing = Math.max(0, (CAL.writing || 0) - 1); paintCalSyncBtn(); }
/* 只在日历页重画：paintCalendar 会改写主区，别的视图下调用会把正文冲掉 */
function calRepaint(){
  if(S.view !== 'calendar') return;
  paintCalendar();
  paintCalShell();
}
const CAL_X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
let CAL_TAP = { k: 0, at: 0 };   // 日期格双击判定

const CAL_STORE = 'ivy.caldav';
/* 连接状态在本机留一份快照：换设备/刷新时先按「已连接」画出来，
   再去服务器核对。真正的凭据在账号库里（D1），所以别的设备登录同一个
   笔记账号时不用再填一次 Apple 密码。 */
function calCacheSave(d){
  try{
    if(d && d.connected) localStorage.setItem(CAL_STORE, JSON.stringify({
      connected: true, appleId: d.appleId || '', appleIdRaw: d.appleIdRaw || '',
      calendars: d.calendars || [], lastSync: d.lastSync || 0, synced: d.synced || 0
    }));
    else localStorage.removeItem(CAL_STORE);
  }catch(e){}
}
function calCacheLoad(){
  try{
    const raw = localStorage.getItem(CAL_STORE);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return d && d.connected ? d : null;
  }catch(e){ return null; }
}

async function loadCalDav(){
  if(!isConnected()){ CAL.dav = null; calCacheSave(null); return; }
  try{
    const d = await apiCall('/api/caldav');
    CAL.dav = d && d.connected ? d : { connected:false };
    calCacheSave(CAL.dav);                 // 服务器说没连才算没连
    if(CAL.dav.connected) icsPurgeLegacy();
  }catch(e){
    // 网络抖一下就保留上次的快照，别把「已连接」误画成要重新登录
    if(!CAL.dav || !CAL.dav.connected) CAL.dav = calCacheLoad() || { connected:false };
  }
  CAL.davAt = Date.now();
}

function calMaskOpen(html, mount){
  document.querySelectorAll('.cal-mask').forEach(e=>e.remove());
  const m = document.createElement('div');
  m.className = 'cal-mask';
  m.innerHTML = `<div class="cal-set">${html}</div>`;
  m.addEventListener('pointerdown', e=>{ if(e.target === m) m.remove(); });
  document.body.appendChild(m);
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick = ()=>m.remove());
  const onEsc = e=>{ if(e.key === 'Escape'){ m.remove(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  if(mount) mount(m);
  return m;
}

function openCalSetup(opts){
  if(!isConnected()){ toast('先在「设置 → 账户」里登录账号'); return; }
  const d = CAL.dav || {};
  const reauth = !!(opts && opts.reauth);          // 已连上，但密码失效 / 想换密码
  if(!d.connected || reauth){
    const back = d && d.connected
      ? `<p class="cal-set-p cal-set-warn">iCloud 拒绝了现在的密码：改过 Apple ID 密码、或撤销过 App 专用密码，旧的就会失效。去 appleid.apple.com 重新生成一个填进来即可，日历本身不会动。</p>`
      : `<p class="cal-set-p">用 Apple ID 和「App 专用密码」直连 iCloud。连上之后，在这里新建、修改、删除的事件都会写回苹果日历，手机和 Mac 上立刻能看到。</p>`;
    const preId = esc((d && d.appleIdRaw) || '');

      <div class="cal-set-hd"><h3>${d && d.connected ? '重新连接苹果日历' : '连接苹果日历'}</h3><button data-x>${CAL_X}</button></div>
      ${back}
      <div class="cal-fld"><label>Apple ID</label><input id="cdId" type="text" placeholder="you@icloud.com" value="${preId}" autocomplete="username" spellcheck="false"></div>
      <div class="cal-fld"><label>App 专用密码</label><input id="cdPass" type="password" placeholder="abcd-efgh-ijkl-mnop" autocomplete="off" spellcheck="false"></div>
      <p class="cal-set-p">这不是登录密码。去 <a href="https://appleid.apple.com/account/manage" target="_blank" rel="noopener">appleid.apple.com</a> → 登录与安全 → App 专用密码 → 生成，复制过来（16 位，中间有横线也行）。密码只加密存在你自己的账号下，不会回传到页面。</p>
      <div class="cal-err" id="cdErr"></div>
      <div class="cal-btns"><button class="primary" id="cdGo">连接</button></div>
    `, m=>{
      const go = m.querySelector('#cdGo'), err = m.querySelector('#cdErr');
      const submit = async ()=>{
        const appleId = m.querySelector('#cdId').value.trim();
        const appPassword = m.querySelector('#cdPass').value.trim();
        if(!appleId || !appPassword){ err.textContent = '两个都要填'; return; }
        go.disabled = true; go.textContent = '连接中…'; err.textContent = '';
        m.querySelectorAll('.cal-dbg').forEach(x=>x.remove());
        try{
          // 这里不用 apiCall：失败时要拿到 debug 原文，apiCall 会把它丢掉
          const res = await fetch('/api/caldav', {
            method:'POST', headers: authHeaders(true),
            body: JSON.stringify({ action:'connect', appleId, appPassword })
          });
          const d = await res.json().catch(()=>({}));
          if(!res.ok){
            err.textContent = d.error || ('HTTP ' + res.status);
            if(d.debug){
              const box = document.createElement('div');
              box.className = 'cal-dbg';
              box.innerHTML = '<div class="cal-dbg-t">诊断信息（复制后发我）</div>';
              const ta = document.createElement('textarea');
              ta.readOnly = true;
              ta.value = d.debug;
              box.appendChild(ta);
              err.parentNode.insertBefore(box, err.nextSibling);
            }
            go.disabled = false; go.textContent = '连接';
            return;
          }
          CAL.dav = { connected:true, appleId:d.appleId, calendars:d.calendars || [], lastSync:0 };
          m.remove();
          toast('已连接，正在拉取事件…');
          await loadCalDav();              // 再读一次状态，拿到完整字段（重新连接要用）
          await calSync(null, true);
        }catch(e){
          err.textContent = e.message || '连接失败';
          go.disabled = false; go.textContent = '连接';
        }
      };
      go.onclick = submit;
      m.querySelectorAll('input').forEach(i=>{
        i.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
      });
      setTimeout(()=>{ const i = m.querySelector('#cdId'); if(i) i.focus(); }, 60);
    });
    return;
  }

  const cals = d.calendars || [];
  calMaskOpen(`
    <div class="cal-set-hd"><h3>苹果日历</h3><button data-x>${CAL_X}</button></div>
    <p class="cal-set-p">${esc(d.appleId||'')}　·　${calAgo(d.lastSync)}　·　${d.synced||0} 条在库里</p>
    <div class="cal-cals">${cals.map(c=>`<label>
      <input type="checkbox" data-cal="${esc(c.href)}" ${c.on!==false?'checked':''}>
      <i style="background:${calColor(c.name, c.color)}"></i><span class="n">${esc(c.name)}</span>
    </label>`).join('') || '<div class="ol-empty">没有可用的日历</div>'}</div>
    <div class="cal-err" id="cdErr"></div>
    <div class="cal-btns">
      <button class="primary" id="cdSync">立即同步</button>
      <button class="ghost" id="cdRe">换密码</button>
      <button class="danger" id="cdOff">断开</button>
    </div>
  `, m=>{
    m.querySelectorAll('[data-cal]').forEach(cb=>{
      cb.onchange = async ()=>{
        try{
          await apiCall('/api/caldav', { method:'POST', body:{ action:'toggle', href:cb.dataset.cal, on:cb.checked } });
          await loadCalDav();
          paintCalShell();
          if(cb.checked) await calSync(null, true);   // 新打开的日历得先拉一次才有事件
        }catch(e){ toast(e.message || '改不了'); cb.checked = !cb.checked; }
      };
    });
    m.querySelector('#cdSync').onclick = async (ev)=>{
      const b = ev.currentTarget;
      b.disabled = true; b.textContent = '同步中…';
      await calSync(null, false);
      b.disabled = false; b.textContent = '立即同步';
      m.remove();
    };
    m.querySelector('#cdRe').onclick = ()=>{ m.remove(); openCalSetup({ reauth:true }); };
    m.querySelector('#cdOff').onclick = async ()=>{
      if(!confirm('断开后，同步来的事件会从网页里移除，苹果日历本身不受影响。确定断开？')) return;
      try{
        await apiCall('/api/caldav', { method:'POST', body:{ action:'disconnect' } });
        CAL.dav = { connected:false };
        CAL.davAt = 0;
        CAL.authBad = false;
        calCacheSave(null);
        CAL.key = '';
        m.remove();
        await ensureCalData(true);
        paintCalShell(); paintCalendar();
        toast('已断开');
      }catch(e){ toast(e.message || '断开失败'); }
    };
  });
}

/* 笔记里的待办一改，隔两秒把变更推给苹果日历（只推待办，不拉全天事件）。
   先算签名比对，内容没变就不发请求。 */
let calTodoTimer = null, calTodoSig = '';
function calTodoSigNow(list){
  return (list || calTodoPushList()).map(t => t.key + ':' + t.title + ':' + t.start + ':' + (t.allDay ? 1 : 0)).sort().join('|');
}
function calTodoPushSoon(){
  if(!isConnected()) return;
  if(calTodoTimer) clearTimeout(calTodoTimer);
  calTodoTimer = setTimeout(calTodoPushNow, 2500);
}
async function calTodoPushNow(){
  calTodoTimer = null;
  const dav = CAL.dav || calCacheLoad();
  if(!dav || !dav.connected) return;
  let list;
  try{ list = calTodoPushList(); }catch(e){ return; }
  const sig = calTodoSigNow(list);
  if(sig === calTodoSig) return;
  calTodoSig = sig;
  try{
    await fetch('/api/caldav', { method:'POST', headers: authHeaders(true), keepalive: true,
      body: JSON.stringify({ action:'pushtodos', todos: list }) });
  }catch(e){}
}

async function calSync(btn, silent, opts){
  if(!CAL.dav || !CAL.dav.connected){ openCalSetup(); return; }
  CAL.syncing = true;
  if(btn) btn.classList.add('on');
  paintCalSyncBtn();
  try{
    const from = new Date(CAL.y, CAL.m-2, 1).getTime();
    const to = new Date(CAL.y, CAL.m+1, 1).getTime();
    // 不用 apiCall：失败时要拿到 authBad，好把人直接带到「重新连接」
    const res = await fetch('/api/caldav', {
      method:'POST', headers: authHeaders(true),
      body: JSON.stringify({ action:'sync', from, to, todos: calTodoPushList() })
    });
    const r = await res.json().catch(()=>({}));
    if(!res.ok){
      // 会话过期和 iCloud 密码失效都是 401，靠 authBad 区分：前者续一下会话再试
      if(res.status === 401 && !r.authBad && SYNC.token && SYNC.key && !(opts && opts.retried)){
        const okLogin = await relogin();
        if(okLogin) return calSync(btn, silent, { retried:true });
      }
      if(r.authBad){
        // 静默同步（进页面时自动跑的）不要弹窗打断，改成侧栏一条提示
        if(silent){ CAL.authBad = true; paintCalShell(); }
        else{
          toast('iCloud 登录失效了，重新填一次 App 专用密码');
          openCalSetup({ reauth:true });
        }
      }else{
        toast(r.error || ('同步失败 HTTP ' + res.status));
      }
      return;
    }
    CAL.authBad = false;
    CAL.key = '';
    try{ calTodoSig = calTodoSigNow(); }catch(e){}   // 这次同步里已经推过待办了，别再推一遍
    await ensureCalData(true);
    await loadCalDav();
    if(S.view === 'calendar'){ paintCalShell(); paintCalendar(); }
    if(!silent){
      const bad = (r.errors || []).length;
      if(r.authBad){
        toast('iCloud 登录失效了，重新填一次 App 专用密码');
        openCalSetup({ reauth:true });
      }else{
        toast(bad ? `同步了 ${r.pulled} 条，${bad} 个日历失败` : `已同步 ${r.pulled} 条`);
      }
    }
  }catch(e){
    toast(e.message || '同步失败');
  }finally{
    CAL.syncing = false;
    paintCalSyncBtn();
    if(btn) btn.classList.remove('on');
  }
}

/* 新建 / 编辑事件 */
function openCalEventForm(ev, dayKey){
  const d = CAL.dav || {};
  if(!d.connected){ openCalSetup(); return; }
  const cals = (d.calendars || []).filter(c=>c.on !== false);
  if(!cals.length){ toast('先打开一个日历'); return; }
  const isNew = !ev;
  const pad = n => String(n).padStart(2, '0');
  const dstr = ts => { const t = new Date(ts); return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate()); };
  const tstr = ts => { const t = new Date(ts); return pad(t.getHours()) + ':' + pad(t.getMinutes()); };

  let start = ev ? ev.start : 0, end = ev ? ev.end : 0, allDay = ev ? !!ev.allDay : false, calHref = '';
  if(isNew){
    const y = Math.floor(dayKey/10000), mo = Math.floor(dayKey%10000/100), da = dayKey%100;
    start = new Date(y, mo-1, da, 9, 0).getTime();
    end = start + 3600000;
    calHref = cals[0].href;
  }else{
    calHref = (cals.find(c => String(ev.href||'').startsWith(c.href.replace(/\/$/, ''))) || {}).href || cals[0].href;
  }

  calMaskOpen(`
    <div class="cal-set-hd"><h3>${isNew ? '新建日程' : '编辑日程'}</h3><button data-x>${CAL_X}</button></div>
    <div class="cal-fld"><label>标题</label><input id="ceTitle" type="text" maxlength="200" placeholder="要做什么" value="${esc(ev ? ev.title : '')}"></div>
    <div class="cal-fld" style="margin-bottom:8px">
      <label class="cal-chk"><input type="checkbox" id="ceAllDay" ${allDay?'checked':''}> 全天</label>
    </div>
    <div class="cal-fld"><label>日期</label><input id="ceDate" type="date" value="${dstr(start)}"></div>
    <div class="cal-row2 cal-fld" id="ceTimes" style="${allDay?'display:none':''}">
      <div><label>开始</label><input id="ceStart" type="time" value="${tstr(start)}"></div>
      <div><label>结束</label><input id="ceEnd" type="time" value="${tstr(end)}"></div>
    </div>
    <div class="cal-fld"><label>日历</label><select id="ceCal">${cals.map(c=>`<option value="${esc(c.href)}" ${c.href===calHref?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="cal-fld"><label>地点</label><input id="ceLoc" type="text" maxlength="200" value="${esc(ev ? ev.location : '')}"></div>
    <div class="cal-fld"><label>备注</label><textarea id="ceNote" maxlength="2000">${esc(ev ? ev.notes : '')}</textarea></div>
    <div class="cal-err" id="ceErr"></div>
    <div class="cal-btns" id="ceBtns">
      <button class="primary" id="ceSave">${isNew?'创建':'保存'}</button>
      ${isNew?'':'<button class="danger" id="ceDel">删除</button>'}
    </div>
    ${isNew?'':`<div class="cal-pop-cf" id="ceCf" hidden><span>苹果日历上也会一起删掉</span><button class="cf-no" id="ceNo">取消</button><button class="cf-yes" id="ceYes">删除</button></div>`}
  `, m=>{
    const all = m.querySelector('#ceAllDay'), times = m.querySelector('#ceTimes');
    all.onchange = ()=>{ times.style.display = all.checked ? 'none' : ''; };
    const err = m.querySelector('#ceErr');

    m.querySelector('#ceSave').onclick = (e)=>{
      const btn = e.currentTarget;
      const title = m.querySelector('#ceTitle').value.trim();
      if(!title){ err.textContent = '标题不能为空'; return; }
      const dv = m.querySelector('#ceDate').value;
      if(!dv){ err.textContent = '选个日期'; return; }
      const [Y, Mo, Da] = dv.split('-').map(Number);
      let s, en;
      if(all.checked){
        // 全天用 UTC 午夜表示，写回 iCloud 时才是同一天（本地 00:00 会差 8 小时）
        s = Date.UTC(Y, Mo-1, Da);
        en = s + 86400000;
      }else{
        const [H, Mi] = (m.querySelector('#ceStart').value || '09:00').split(':').map(Number);
        s = new Date(Y, Mo-1, Da, H, Mi).getTime();
        const [H2, Mi2] = (m.querySelector('#ceEnd').value || '10:00').split(':').map(Number);
        en = new Date(Y, Mo-1, Da, H2, Mi2).getTime();
        if(en <= s) en = s + 3600000;
      }
      const calHref = m.querySelector('#ceCal').value;
      const calObj = cals.find(c => c.href === calHref) || {};
      const loc = m.querySelector('#ceLoc').value.trim();
      const note = m.querySelector('#ceNote').value.trim();
      const allDay = all.checked;

      /* 先把改动落到本地并立刻重画，写 iCloud 放后台 —— 不用干等几秒 */
      const before = ev ? { ...ev } : null;
      let tmp = ev;
      if(isNew){
        tmp = { uid: 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          cal: calObj.name || '', color: calObj.color || '', title, start: s, end: en,
          allDay, location: loc, notes: note, href: '', etag: '', pending: true };
        CAL.events.push(tmp);
      }else{
        Object.assign(ev, { cal: calObj.name || ev.cal, title, start: s, end: en, allDay, location: loc, notes: note, pending: true });
      }
      m.remove();
      CAL.key = '';
      calRepaint();
      calWriteStart();
      toast(isNew ? '已创建，正在同步到苹果日历' : '已保存，正在同步');

      // keepalive：写 iCloud 要几秒，中途切走/关掉页面也让这次请求跑完
      fetch('/api/caldav', { method:'POST', headers: authHeaders(true), keepalive: true,
        body: JSON.stringify({ action:'save', event: {
          uid: before ? before.uid : '', href: before ? before.href : '', etag: before ? before.etag : '',
          calHref, title, start: s, end: en, allDay, location: loc, notes: note
        } }) })
      .then(async res=>{
        const out = await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(out.error || ('HTTP ' + res.status));
        return out;
      }).then(r=>{
        if(isNew){
          const hit = CAL.events.find(x => x.uid === tmp.uid);
          if(hit){ hit.uid = r.uid || hit.uid; hit.href = r.href || ''; hit.etag = r.etag || ''; hit.pending = false; }
        }else if(ev){
          ev.uid = r.uid || ev.uid; ev.href = r.href || ev.href; ev.etag = r.etag || ev.etag; ev.pending = false;
        }
        if(CAL.dav) CAL.dav.lastSync = Date.now();     // 写成功也算同步过，按钮上的时间跟着走
        CAL.key = '';
        toast(isNew ? '已写入苹果日历' : '已保存到苹果日历');
      }).catch(e2=>{
        // 写失败就回滚，别让界面显示一条其实没存上的日程
        if(isNew){ CAL.events = CAL.events.filter(x => x.uid !== tmp.uid); }
        else if(ev && before){ Object.assign(ev, before); }
        toast('没写进苹果日历：' + (e2.message || '失败'));
      }).finally(()=>{
        calWriteEnd();
        calRepaint();
      });
    };

    const del = m.querySelector('#ceDel');
    if(del) del.onclick = ()=>{

      m.querySelector('#ceNo').onclick = ()=>{ cf2.hidden = true; m.querySelector('#ceBtns').hidden = false; };
      m.querySelector('#ceYes').onclick = (e)=>{

          const out = await res.json().catch(()=>({}));
          if(!res.ok) throw new Error(out.error || ('HTTP ' + res.status));

          toast('删除失败：' + (e2.message || '未知错误'));
