/* ========== 所见即所得编辑（块级 Markdown） ========== */
const LIVE = { raws: [], gaps: [], editing: -1, ta: null };
/* 打开系统取色器等外部窗口时，先别把正在编辑的块提交掉 */
let HOLD_BLUR = false;

function modeClass(m){
  if(m==='source') return 'mode-edit';
  if(m==='split') return 'mode-split';
  if(m==='preview') return 'mode-preview';
  return 'mode-live';
}
function curMode(){
  const doc = document.getElementById('doc');
  if(!doc) return 'live';
  if(doc.classList.contains('mode-edit')) return 'source';
  if(doc.classList.contains('mode-split')) return 'split';
  if(doc.classList.contains('mode-preview')) return 'preview';
  return 'live';
}
function liveHost(){ return document.getElementById('live'); }

/* 切块规则与 mdToHtml 完全一致，保证「所见」与「渲染」不打架 */
function parseBlocks(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }
    const start = i;
    if(/^```/.test(line)){
      i++;
      while(i<lines.length && !/^```/.test(lines[i])) i++;
      if(i<lines.length) i++;
    } else if(/^(#{1,6})\s+/.test(line)){
      i++;
    } else if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)){
      i++;
    } else if(/^>\s?/.test(line)){
      while(i<lines.length && /^>\s?/.test(lines[i])) i++;
    } else if(line.includes('|') && i+1<lines.length && isSep(lines[i+1])){
      i += 2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()) i++;
    } else if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) i++;
    } else {
      i++;
      while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isSep(lines[i])) i++;
    }
    out.push({lines: lines.slice(start, i), start:start, end:i});
  }
  return out;
}

function blockType(raw){
  const ls = String(raw||'').split('\n');
  const first = ls[0] || '';
  if(/^```/.test(first)) return 'fence';
  if(/^(#{1,6})\s+/.test(first)) return 'heading';
  if(/^>\s?/.test(first)) return 'quote';
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  if(first.includes('|') && ls.length>1 && isSep(ls[1])) return 'table';
  if(/^\s*([-*+]|\d+\.)\s+/.test(first)) return 'list';
  if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(first)) return 'hr';
  return 'para';
}

function mdBlock(raw){
  return mdToHtml(raw).html
    .replace(/ id="h\d+"/g,'')
    .replace(/<input type="checkbox" disabled/g,'<input type="checkbox"');
}

function paintHeadings(host){
  if(!host) return;
  let k = 0;
  host.querySelectorAll('.blk-view h1,.blk-view h2,.blk-view h3,.blk-view h4,.blk-view h5,.blk-view h6')
    .forEach(h=>{ h.id = 'h'+(k++); });
}

/* 空块只被加了前缀（# / - / > / 1. …）却一直没写字：收起编辑态时顺手清掉，
   否则正文里会一直挂着一行「# 一级标题」这样的灰色提示 */
function isBarePrefix(raw){
  const v = String(raw||'').trim();
  if(!v) return true;
  return BLOCK_HINTS.some(([re])=>re.test(v)) || /^(#{1,6}|[-*+]|1\.|>|- \[ \])$/.test(v);
}
function dropBarePrefixBlock(i){
  const host = liveHost(); if(!host) return;
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  if(el.classList.contains('editing')) return;          // 又回到编辑了，别打扰
  if(document.getElementById('popover')?.classList.contains('open')) return;
  const raw = LIVE.raws[i];
  // 有真实正文就别动；空块 / 只剩前缀的块都要把占位提示收起来
  if(raw && raw.trim() && !isBarePrefix(raw)) return;
  LIVE.raws[i] = '';
  const view = el.querySelector('.blk-view');
  if(view) view.innerHTML = '<p class="lv-hint" style="margin:0">&nbsp;</p>';
  const ta = el.querySelector('.blk-src');
  if(ta){ ta.value = ''; ta.classList.remove('has-hint'); }
  // 占位提示（「# 一级标题」等）也要一起收掉，否则失焦后会一直留在页面上
  const hint = el.querySelector('.blk-hint');
  if(hint){ hint.style.display = 'none'; hint.innerHTML = ''; }
  syncBody(); save();
}

function growTa(ta){
  if(!ta) return;
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
/* 空块加了标题/列表前缀后，用灰字提示该写什么；一旦输入就消失 */
const BLOCK_HINTS = [
  [/^######\s?$/, '六级标题', '###### '],
  [/^#####\s?$/,  '五级标题', '##### '],
  [/^####\s?$/,   '四级标题', '#### '],
  [/^###\s?$/,    '三级标题', '### '],
  [/^##\s?$/,     '二级标题', '## '],
  [/^#\s?$/,      '一级标题', '# '],
  [/^- \[ \]\s?$/, '待办事项', '- [ ] '],
  [/^[-*+]\s?$/,  '列表项', '- '],
  [/^\d+\.\s?$/,  '编号列表', '1. '],
  [/^>\s?$/,      '引用', '> ']
];
// 量一下这类块渲染后真实的字号/字重（判断用，不写进正文）
function probeBlockStyle(kind){
  const map = {
    h1:'<h1>x</h1>', h2:'<h2>x</h2>', h3:'<h3>x</h3>', h4:'<h4>x</h4>', h5:'<h5>x</h5>', h6:'<h6>x</h6>',
    ul:'<ul><li>x</li></ul>', ol:'<ol><li>x</li></ol>', todo:'<ul><li>x</li></ul>',
    quote:'<blockquote><p>x</p></blockquote>'
  };
  const html = map[kind]; if(!html) return null;
  const box = document.createElement('div');
  box.className = 'prose';
  box.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none';
  box.innerHTML = html;
  document.body.appendChild(box);
  const el = box.querySelector('li, p, h1, h2, h3, h4, h5, h6') || box.firstElementChild;
  const cs = getComputedStyle(el);
  const out = { fontSize:cs.fontSize, lineHeight:cs.lineHeight, fontWeight:cs.fontWeight, fontFamily:cs.fontFamily };
  box.remove();
  return out;
}
function updateBlockHint(ta){
  if(!ta || !ta.closest) return;
  const el = ta.closest('.blk');
  const hint = el && el.querySelector('.blk-hint');
  if(!hint) return;
  const hit = BLOCK_HINTS.find(([re])=>re.test(ta.value));
  if(hit){
    hint.innerHTML = `<span class="hp">${esc(hit[2])}</span><span class="ht">${esc(hit[1])}</span>`;
    hint.style.fontSize = ta.style.fontSize || '';
    hint.style.lineHeight = ta.style.lineHeight || '';
    hint.style.fontWeight = ta.style.fontWeight || '';
    hint.style.fontFamily = ta.style.fontFamily || '';
    hint.style.display = 'block';
    ta.classList.add('has-hint');
  }else{
    hint.style.display = 'none';
    hint.innerHTML = '';
    ta.classList.remove('has-hint');
  }
}

/* ---- 渲染 ---- */
function renderLive(){
  const n = noteById(S.active); const host = liveHost();
  if(!n || !host) return;
  commitAnyEditing();
  const blocks = parseBlocks(n.body);
  LIVE.raws = blocks.length ? blocks.map(b=>b.lines.join('\n')) : [''];
  // 记住块之间原本隔了几个空行，保存时原样还原，绝不擅自把单换行改成空行
  LIVE.gaps = blocks.length ? blocks.map((b,i)=> i===0 ? 0 : Math.max(0, b.start - blocks[i-1].end)) : [0];
  paintLive();
}

let SELDOWN = null;
document.addEventListener('mouseup', e=>{
  const d = SELDOWN; SELDOWN = null;
  if(!d) return;
  // 拖过（选文字）或双击（选词）都不进编辑；只有"点一下没挪"才算要改这一块
  if(Math.abs(e.clientX - d.x) > 4 || Math.abs(e.clientY - d.y) > 4) return;
  if(e.detail > 1) return;
  editBlock(d.i, d.x, d.y);
});

/* 跨块复制：给富文本 + markdown 两种格式 */
document.addEventListener('copy', e=>{
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return;
  const host = liveHost();
  if(!host || !host.contains(sel.anchorNode) || !host.contains(sel.focusNode)) return;
  const blocks = [...host.querySelectorAll('.blk')];
  const idxOf = node => blocks.findIndex(b=>b.contains(node));
  let a = idxOf(sel.anchorNode), b = idxOf(sel.focusNode);
  if(a < 0 || b < 0 || a === b) return;    // 同一块内交给浏览器默认行为
  if(a > b){ const t = a; a = b; b = t; }
  const md = LIVE.raws.slice(a, b+1).join('\n');
  const html = blocks.slice(a, b+1).map(b2=>b2.querySelector('.blk-view').innerHTML).join('');
  e.clipboardData.setData('text/plain', md);
  e.clipboardData.setData('text/html', html);
  e.preventDefault();
});

/* 预览态里的块是只读 div，原生选区按删除没反应 → 手动按 markdown 源删 */
function viewOffset(view, node, offset){
  try{
    const r = document.createRange();
    r.selectNodeContents(view);
    r.setEnd(node, offset);
    return r.toString().length;
  }catch(e){ return 0; }
}
function blockPoint(node, offset, isEnd){
  const host = liveHost(); if(!host) return null;
  const blocks = [...host.querySelectorAll('.blk')];
  if(!blocks.length) return null;
  if(node === host){
    return isEnd ? { i: blocks.length - 1, off: 1e9 } : { i: 0, off: 0 };
  }
  const i = blocks.findIndex(b=>b.contains(node));
  if(i < 0) return null;
  const view = blocks[i].querySelector('.blk-view');
  if(!view || node === blocks[i] || !view.contains(node)){
    const len = view ? view.textContent.length : 0;
    return { i, off: isEnd ? len : 0 };
  }
  return { i, off: viewOffset(view, node, offset) };
}
// 把「渲染后的文本」对齐回 markdown 源，返回应截断的源位置
function cutBefore(raw, plain){
  if(!plain) return 0;
  const at = raw.indexOf(plain);
  if(at >= 0) return at + plain.length;
  for(let k = plain.length - 1; k > 1; k--){
    const at2 = raw.indexOf(plain.slice(-k));
    if(at2 >= 0) return at2 + k;
  }
  return 0;
}
function cutAfter(raw, plain){
  if(!plain) return raw.length;
  const at = raw.lastIndexOf(plain);
  if(at >= 0) return at;
  for(let k = plain.length - 1; k > 1; k--){
    const at2 = raw.lastIndexOf(plain.slice(0, k));
    if(at2 >= 0) return at2;
  }
  return raw.length;
}
// 截断可能切坏成对的 ** == ~~ ` ，补一下
function healInline(s){
  ['**','~~','==','`'].forEach(tok=>{
    const cnt = s.split(tok).length - 1;
    if(cnt % 2 === 1){
      const at = s.lastIndexOf(tok);
      if(at >= 0) s = s.slice(0, at) + s.slice(at + tok.length);
    }
  });
  return s;
}
function deleteLiveSelection(){
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.isContentEditable)) return false;
  if((S.mode || 'live') !== 'live') return false;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const host = liveHost();
  if(!host) return false;
  const range = sel.getRangeAt(0);
  if(!host.contains(range.startContainer) || !host.contains(range.endContainer)) return false;
  const p1 = blockPoint(range.startContainer, range.startOffset, false);
  const p2 = blockPoint(range.endContainer, range.endOffset, true);
  if(!p1 || !p2) return false;
  let a = p1.i, b = p2.i, offA = p1.off, offB = p2.off;
  if(a > b || (a === b && offA > offB)){ const t = a; a = b; b = t; const u = offA; offA = offB; offB = u; }
  if(!LIVE.raws.length || LIVE.raws[a] == null || LIVE.raws[b] == null) return false;

  const viewA = host.querySelector('.blk[data-i="'+a+'"] .blk-view');
  const viewB = host.querySelector('.blk[data-i="'+b+'"] .blk-view');
  const textA = viewA ? viewA.textContent : '';
  const textB = viewB ? viewB.textContent : '';
  const headPlain = textA.slice(0, Math.min(offA, textA.length));
  const tailPlain = textB.slice(Math.min(offB, textB.length));

  const rawA = LIVE.raws[a], rawB = LIVE.raws[b];
  const cut0 = cutBefore(rawA, headPlain);
  const cut1 = cutAfter(rawB, tailPlain);
  if(a === b && cut1 < cut0) return false;

  const merged = healInline(
    a === b ? rawA.slice(0, cut0) + rawA.slice(cut1)
            : rawA.slice(0, cut0) + rawB.slice(cut1)
  );

  const restAfter = LIVE.raws.slice(b + 1);
  const gapsAfter = (LIVE.gaps || []).slice(b + 1);
  const gapA = (LIVE.gaps && LIVE.gaps[a]) || 0;
  const raws = LIVE.raws.slice(0, a);
  const gaps = (LIVE.gaps || []).slice(0, a);
  if(a === b || merged !== ''){ raws.push(merged); gaps.push(gapA); }
  else if(raws.length === 0 && restAfter.length === 0){ raws.push(''); gaps.push(0); }
  restAfter.forEach((r,k)=>{ raws.push(r); gaps.push(gapsAfter[k]); });

  LIVE.raws = raws; LIVE.gaps = gaps;
  syncBody();
  renderLive();
  const idx = Math.max(0, Math.min(a, LIVE.raws.length - 1));
  const caret = Math.min(cut0, LIVE.raws[idx] ? LIVE.raws[idx].length : 0);
  sel.removeAllRanges();
  focusBlock(idx, caret);
  return true;
}
document.addEventListener('keydown', e=>{
  if(e.key !== 'Backspace' && e.key !== 'Delete') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(deleteLiveSelection()){ e.preventDefault(); }
});

function paintLive(){
  const host = liveHost(); if(!host) return;
  host.innerHTML = '';
  LIVE.raws.forEach((raw,i)=> host.appendChild(blockEl(raw, i, LIVE.raws.length===1)));
  const tail = document.createElement('div'); tail.className = 'lv-tail'; host.appendChild(tail);
  paintHeadings(host);
  if(!host._wired){
    host._wired = true;
    host.addEventListener('click', e=>{
      const a = e.target.closest ? e.target.closest('.wikilink') : null;
      if(a){ e.preventDefault(); openWikiLink(a.dataset.wiki); return; }
      if(e.target.classList && e.target.classList.contains('lv-tail')){
        if(!String(LIVE.raws[LIVE.raws.length-1]).trim()) focusBlock(LIVE.raws.length-1, 'end');
        else { LIVE.raws.push(''); LIVE.gaps.push(0); rebuild(LIVE.raws.length-1, 0); }
      }
    });
  }
}

function rebuild(focusIdx, caret){
  paintLive();
  syncBody();
  if(focusIdx!=null && focusIdx>=0) focusBlock(focusIdx, caret);
}

function blockEl(raw, i, only){
  const el = document.createElement('div');
  el.className = 'blk'; el.dataset.i = i;
  const view = document.createElement('div');
  view.className = 'blk-view';
  if(raw.trim()) view.innerHTML = mdBlock(raw);
  else view.innerHTML = '<p class="lv-hint" style="margin:0">' + (only ? '点这里开始写 · # 加空格是标题，- 加空格是列表，回车就排版' : '&nbsp;') + '</p>';
  const ta = document.createElement('textarea');
  ta.className = 'blk-src'; ta.value = raw; ta.rows = 1;
  ta.spellcheck = false; ta.dataset.i = i;
  const hint = document.createElement('div');
  hint.className = 'blk-hint'; hint.setAttribute('aria-hidden','true');
  el.appendChild(view); el.appendChild(ta); el.appendChild(hint);

  view.addEventListener('mousedown', e=>{
    if(e.target.closest && e.target.closest('a')) return;
    if(e.target.matches && e.target.matches('input[type=checkbox]')){ e.preventDefault(); toggleTask(i, e.target); return; }
    if(e.button !== 0) return;
    // 不阻止默认行为：允许像普通网页一样拖过多个块选中文字
    SELDOWN = { i, x:e.clientX, y:e.clientY };
  });
  ta.addEventListener('input', ()=>{ LIVE.raws[i] = ta.value; growTa(ta); syncBody(); detectWiki(ta); updateBlockHint(ta); });
  ta.addEventListener('keydown', e=>onBlockKey(e, i, ta, el));
  ta.addEventListener('blur', ()=>{
    closeWikiPop();
    if(HOLD_BLUR) return;   // 正在取色，先留着这一块的编辑态
    if(el.isConnected && el.classList.contains('editing')) commitBlock(i);
    // 只是点了工具栏加了前缀、什么都没写：别把它一直留在正文里
    setTimeout(()=>dropBarePrefixBlock(i), 180);
  });
  ta.addEventListener('paste', onBlockPaste);
  ta.addEventListener('dragover', e=>e.preventDefault());
  ta.addEventListener('drop', e=>{
    e.preventDefault();
    const files = [...((e.dataTransfer && e.dataTransfer.files)||[])];
    if(files.length) insertFiles(files, ta);
  });
  return el;
}

/* ---- 进入 / 离开编辑 ---- */
function editBlock(i, x, y, caret){
  const host = liveHost(); if(!host) return;
  if(LIVE.editing>=0 && LIVE.editing!==i) closeEditing();
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  const ta = el.querySelector('.blk-src');
  // 必须先算光标位置：加了 editing 后 .blk-view 就 display:none 了，量不到
  let off;
  if(caret==='end') off = ta.value.length;
  else if(typeof caret === 'number') off = caret;
  else off = offsetFromPoint(el.querySelector('.blk-view'), ta.value, x, y);
  // 换源码态时沿用这一块渲染后的字号/行高/字重，视觉上不跳
  const ref = el.querySelector('.blk-view').firstElementChild;
  if(ref){
    try{
      const cs = getComputedStyle(ref);
      ta.style.fontSize = cs.fontSize;
      ta.style.lineHeight = cs.lineHeight;
      ta.style.fontWeight = cs.fontWeight;
      ta.style.fontFamily = cs.fontFamily;
    }catch(e){}
  }
  el.classList.add('editing');
  LIVE.editing = i; LIVE.ta = ta;
  growTa(ta);
  ta.focus();
  off = Math.max(0, Math.min(off, ta.value.length));
  try{ ta.setSelectionRange(off, off); }catch(e){}
  updateBlockHint(ta);
}

function closeEditing(){
  if(LIVE.editing<0) return;
  const i = LIVE.editing;
  LIVE.editing = -1; LIVE.ta = null;
  commitBlock(i);
}

function commitAnyEditing(){
  if(LIVE.editing>=0 && LIVE.ta && LIVE.ta.isConnected){
    LIVE.ta.value = trimRaw(LIVE.ta.value);
    LIVE.raws[LIVE.editing] = LIVE.ta.value;
    LIVE.editing = -1; LIVE.ta = null;
    syncBody();
  }
  LIVE.editing = -1; LIVE.ta = null;
}

function trimRaw(raw){
  const lines = String(raw).split('\n');
  const isEmptyItem = l => /^\s*([-*+]|\d+\.)\s*(\[[ xX]\]\s*)?$/.test(l);
  if(!lines.every(isEmptyItem)) {
    while(lines.length > 1 && isEmptyItem(lines[lines.length-1])) lines.pop();
  } else if(lines.length){
    return '';
  }
  return lines.join('\n');
}

function commitBlock(i){
  const host = liveHost(); if(!host) return;
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  if(!el) return;
  const ta = el.querySelector('.blk-src');
  ta.value = trimRaw(ta.value);
  // 只有前缀没有正文（点了标题/列表却没写）→ 当成空块，别在正文里留下 "#" 这种残渣
  if(ta.value.trim() && isBarePrefix(ta.value)) ta.value = '';
  updateBlockHint(ta);                 // 收掉「# 一级标题」这类占位文字
  LIVE.raws[i] = ta.value;
  el.classList.remove('editing');
  const view = el.querySelector('.blk-view');
  view.innerHTML = ta.value.trim()
    ? mdBlock(ta.value)
    : '<p class="lv-hint" style="margin:0">&nbsp;</p>';
  if(LIVE.editing===i){ LIVE.editing = -1; LIVE.ta = null; }
  paintHeadings(host);
  syncBody();
}

let splitTimer = null;
function livePreviewSoon(){
  clearTimeout(splitTimer);
  splitTimer = setTimeout(()=>{ if(curMode()==='split'){ renderProse(); renderOutline(); } }, 120);
}

function syncBody(){
  const n = noteById(S.active); if(!n) return;
  let body = '';
  LIVE.raws.forEach((r,i)=>{
    if(i) body += '\n'.repeat(((LIVE.gaps && LIVE.gaps[i]) || 0) + 1);
    body += r;
  });
  if(body === n.body) return;
  n.body = body; n.updatedAt = Date.now();
  renderMeta(); renderOutline(); save();
}

/* ---- 焦点与导航 ---- */
function focusBlock(i, caret){
  const host = liveHost(); if(!host) return;
  if(i < 0){ const t = document.getElementById('docTitle'); if(t) t.focus(); return; }
  if(i >= LIVE.raws.length){
    if(!String(LIVE.raws[LIVE.raws.length-1]).trim()) i = LIVE.raws.length-1;
    else { LIVE.raws.push(''); LIVE.gaps.push(0); rebuild(i, 0); return; }
  }
  editBlock(i, null, null, caret);
}
function ensureLiveInput(){
  if(LIVE.ta && LIVE.ta.isConnected) return LIVE.ta;
  const host = liveHost(); if(!host) return null;
  focusBlock(Math.max(0, LIVE.raws.length-1), 'end');
  return LIVE.ta;
}

/* ---- 按键 ---- */
/* ---- [[ 双链自动补全 ---- */
const WIKI = { open:false, idx:0, items:[], ta:null, from:0 };

function wikiPanel(){
  let el = document.getElementById('wikiPop');
  if(!el){
    el = document.createElement('div');
    el.id = 'wikiPop'; el.className = 'wiki-pop';
    document.body.appendChild(el);
  }
  return el;
}

function closeWikiPop(){
  const el = document.getElementById('wikiPop');
  if(el) el.classList.remove('open');
  WIKI.open = false; WIKI.ta = null;
}

function paintWikiPop(){
  const el = wikiPanel();
  if(!WIKI.items.length){
    el.innerHTML = '<div class="wiki-empty">没有匹配的笔记，直接回车可插入</div>';
  } else {
    el.innerHTML = WIKI.items.map((it,i)=>`<div class="wiki-item ${i===WIKI.idx?'on':''}" data-i="${i}">
      ${it.create ? '<span class="wiki-new">新建</span>' : '<span class="wiki-ico">→</span>'}
      <span class="wiki-t">${esc(it.title)}</span></div>`).join('');
  }
  const r = WIKI.ta.getBoundingClientRect();
  el.classList.add('open');
  const h = el.offsetHeight || 60;
  el.style.left = Math.round(Math.max(12, Math.min(r.left, window.innerWidth - 306))) + 'px';
  el.style.top = Math.round(r.bottom + h + 12 > window.innerHeight ? Math.max(12, r.top - h - 6) : r.bottom + 6) + 'px';
  el.querySelectorAll('.wiki-item').forEach(b=>{
    b.addEventListener('mousedown', ev2=>{ ev2.preventDefault(); WIKI.idx = +b.dataset.i; pickWiki(); });
  });
}

function openWikiPop(ta, query, from){
  const q = String(query||'').trim().toLowerCase();
  const pool = S.notes
    .filter(n=>!n.trashed && !n.deleted && n.id!==S.active && (n.title||'').trim())
    .filter(n=> !q || (n.title||'').toLowerCase().includes(q));
  // 前缀命中的排前面，其余按最近编辑
  const byRecent = (a,b)=>(b.updatedAt||0)-(a.updatedAt||0);
  const head = pool.filter(n=>(n.title||'').toLowerCase().startsWith(q)).sort(byRecent);
  const rest = pool.filter(n=>!(n.title||'').toLowerCase().startsWith(q)).sort(byRecent);
  WIKI.items = head.concat(rest).slice(0, 6).map(n=>({title:n.title, id:n.id, create:false}));
  // 「新建」永远排在最后，回车默认选已有笔记
  if(q && !WIKI.items.some(it=>it.title.toLowerCase()===q)) WIKI.items.push({title:q, create:true});
  WIKI.open = true; WIKI.idx = 0; WIKI.ta = ta; WIKI.from = from;
  paintWikiPop();
}

function detectWiki(ta){
  const caret = ta.selectionStart;
  const before = ta.value.slice(0, caret);
  const m = before.match(/\[\[([^\[\]\n]{0,40})$/);
  if(m) openWikiPop(ta, m[1], caret - m[0].length);
  else closeWikiPop();
}

function pickWiki(){
  const ta = WIKI.ta;
  if(!ta) { closeWikiPop(); return; }
  const it = WIKI.items[WIKI.idx] || {title:''};
  const title = (it.title||'').trim();
  if(!title){ closeWikiPop(); return; }
  const caret = ta.selectionStart;
  ta.setRangeText('[[' + title + ']]', WIKI.from, caret, 'end');
  const i = parseInt(ta.dataset.i, 10) || 0;
  LIVE.raws[i] = ta.value;
  closeWikiPop();
  growTa(ta); syncBody(); ta.focus();
}

function onBlockKey(e, i, ta, el){
  if(e.isComposing || e.keyCode===229) return;

  if(WIKI.open && WIKI.ta === ta){
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const n = WIKI.items.length || 1;
      WIKI.idx = (WIKI.idx + (e.key==='ArrowDown' ? 1 : n-1)) % n;
      paintWikiPop(); return;
    }
    if(e.key==='Enter' || e.key==='Tab'){
      e.preventDefault(); pickWiki(); return;
    }
    if(e.key==='Escape'){ e.preventDefault(); closeWikiPop(); return; }
  }

  if(e.key==='Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    handleEnter(i, ta);
    return;
  }
  if(e.key==='Tab'){
    e.preventDefault();
    ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');
    LIVE.raws[i] = ta.value; growTa(ta); syncBody();
    return;
  }
  if(e.key==='Escape'){ e.preventDefault(); closeEditing(); return; }

  if(e.key==='Backspace' && ta.selectionStart===0 && ta.selectionEnd===0){
    if(!ta.value){
      if(LIVE.raws.length<=1) return;
      e.preventDefault();
      LIVE.raws.splice(i,1); LIVE.gaps.splice(i,1);
      rebuild(i > 0 ? i-1 : 0, 'end');
      return;
    }
    if(i===0) return;
    e.preventDefault();
    const prev = LIVE.raws[i-1];
    LIVE.raws[i-1] = prev + (prev.endsWith('\n') ? '' : '\n') + ta.value;
    LIVE.raws.splice(i,1); LIVE.gaps.splice(i,1);
    rebuild(i-1, prev.length);
    return;
  }

  if(e.key==='ArrowDown' && !ta.value.includes('\n') && ta.selectionStart===ta.value.length){
    e.preventDefault(); closeEditing(); focusBlock(i+1, 0); return;
  }
  if(e.key==='ArrowUp' && !ta.value.includes('\n') && ta.selectionStart===0){
    e.preventDefault(); closeEditing(); focusBlock(i-1, 'end'); return;
  }
}

function handleEnter(i, ta){
  const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
  const before = v.slice(0, s), after = v.slice(en);
  const t = blockType(v);
  const lineStart = before.lastIndexOf('\n') + 1;
  const curLine = before.slice(lineStart);

  if(t==='fence' || t==='table'){
    ta.setRangeText('\n', s, en, 'end');
    LIVE.raws[i] = ta.value; growTa(ta); syncBody();
    return;
  }
  if(t==='heading'){
    LIVE.raws[i] = before.trimEnd();
    LIVE.raws.splice(i+1, 0, after.replace(/^\n+/,'')); LIVE.gaps.splice(i+1, 0, 0);
    rebuild(i+1, 0);
    return;
  }
  if(t==='list'){
    const m = curLine.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?(.*)$/);
    if(m){
      const indent = m[1], marker = m[2], task = m[4] || '', text = m[5];
      if(!text.trim()){
        const headRaw = v.slice(0, lineStart).replace(/\n$/,'');
        LIVE.raws[i] = headRaw;
        LIVE.raws.splice(i+1, 0, after.replace(/^\n/,'')); LIVE.gaps.splice(i+1, 0, 0);
        rebuild(i+1, 0);
        return;
      }
      const nextMarker = /^\d+\.$/.test(marker) ? (parseInt(marker,10)+1)+'.' : marker;
      const ins = '\n' + indent + nextMarker + ' ' + (task ? '[ ] ' : '');
      ta.setRangeText(ins, s, en, 'end');
      LIVE.raws[i] = ta.value; growTa(ta); syncBody();
      return;
    }
  }
  const headRaw = before.replace(/\n$/,'');
  let tailRaw = after.replace(/^\n/,'');
  if(t==='quote' && tailRaw) tailRaw = '> ' + tailRaw;
  LIVE.raws[i] = headRaw;
  LIVE.raws.splice(i+1, 0, tailRaw); LIVE.gaps.splice(i+1, 0, 0);
  rebuild(i+1, t==='quote' ? 2 : 0);
}

function toggleTask(i, cb){
  const host = liveHost(); if(!host) return;
  const view = host.querySelector('.blk[data-i="'+i+'"] .blk-view');
  if(!view) return;
  const boxes = [...view.querySelectorAll('li.task')];
  const li = cb.closest('li');
  const k = boxes.indexOf(li);
  if(k < 0) return;
  const lines = String(LIVE.raws[i]).split('\n');
  let n = 0;
  for(let j=0;j<lines.length;j++){
    if(/^\s*([-*+]|\d+\.)\s+\[[ xX]\]/.test(lines[j])){
      if(n===k){
        const done = /\[[xX]\]/.test(lines[j]);
        lines[j] = lines[j].replace(/\[[ xX]\]/, done ? '[ ]' : '[x]');
        break;
      }
      n++;
    }
  }
  const el = host.querySelector('.blk[data-i="'+i+'"]');
  const ta = el && el.querySelector('.blk-src');
  const next = lines.join('\n');
  LIVE.raws[i] = next;
  if(ta) ta.value = next;
  commitBlock(i);
}

function onBlockPaste(e){
  const files = [...((e.clipboardData && e.clipboardData.items)||[])]
    .filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);
  if(!files.length) return;      // 纯文本粘贴走浏览器默认
  e.preventDefault();
  insertFiles(files, e.currentTarget);
}

/* ---- 光标定位：点哪儿就从哪儿开始改 ---- */
function offsetFromPoint(view, raw, x, y){
  if(!view) return String(raw).length;
  let range = null;
  try{
    if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if(document.caretPositionFromPoint){
      const p = document.caretPositionFromPoint(x, y);
      if(p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
    }
  }catch(e){}
  if(!range || !view.contains(range.startContainer)) return String(raw).length;
  const r = document.createRange();
  r.selectNodeContents(view);
  try{ r.setEnd(range.startContainer, range.startOffset); }catch(e){ return String(raw).length; }
  return visToRaw(String(raw), r.toString().length);
}

function stripVis(s){
  return String(s)
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function(m,t,a){ return a || t; })
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/[*_~`]/g,'');
}

function rawOffsetInLine(body, vis){
  let seen = 0, i = 0;
  while(i < body.length && seen < vis){
    const ch = body[i];
    if(ch==='!' && body[i+1]==='['){ i += 2; continue; }
    if(ch==='['){ i++; continue; }
    if(ch===']'){
      i++;
      if(body[i]==='('){ while(i<body.length && body[i]!==')') i++; i++; }
      continue;
    }
    if(ch==='*'||ch==='_'||ch==='~'||ch==='`'){ i++; continue; }
    if(ch==='=' && (body[i+1]==='=' || (i>0 && body[i-1]==='='))){ i++; continue; }
    if(ch==='|' && i===0){ i++; continue; }
    seen++; i++;
  }
  return i;
}

function visToRaw(raw, vis){
  const lines = raw.split('\n');
  let left = vis, consumed = 0;
  for(let li=0; li<lines.length; li++){
    const line = lines[li];
    const p = line.match(/^(\s*)(#{1,6}\s+|[-*+]\s+(\[[ xX]\]\s+)?|\d+\.\s+|>\s?)?/);
    const prefix = p ? p[0] : '';
    const body = line.slice(prefix.length);
    const visLen = stripVis(body).length;
    if(left <= visLen || li===lines.length-1){
      return Math.min(raw.length, consumed + prefix.length + rawOffsetInLine(body, left));
    }
    left -= visLen;
    consumed += line.length + 1;
  }
  return raw.length;
}

/* ---- 模式切换 ---- */
function setMode(m){
  const doc = document.getElementById('doc'); if(!doc) return;
  commitAnyEditing();
  S.mode = m;
  doc.classList.remove('mode-live','mode-preview','mode-edit','mode-split');
  doc.classList.add(modeClass(m));
  document.body.classList.toggle('split-mode', m==='split');
  const n = noteById(S.active);
  const src = document.getElementById('source');
  if(src && n) src.value = n.body;
  if(m==='preview'){ renderProse(); renderOutline(); }
  else if(m==='live'){ renderLive(); }
  else if(m==='split'){
    if(src) src.style.height = '';      // 两栏等高，交给 CSS
    renderProse(); renderOutline();
    SPLIT_ANCH = null;
    wireSplitSync();
  }
  else if(m==='source'){
    if(src){
      src.style.height='auto';
      src.style.height = Math.max(src.scrollHeight, 360) + 'px';
      src.focus();
    }
  }
  save();
}
function enterEdit(){ setMode('source'); }
function enterPreview(){ setMode('preview'); }
/* ⌘E 在 预览 → 双栏 → Markdown 之间轮转 */
function toggleMode(){
  const m = curMode();
  setMode(m==='live' ? 'split' : (m==='split' ? 'source' : 'live'));
}

function wireEditor(n){
  const title = $('#docTitle');
  const src = $('#source');
  const doc = $('#doc');
  src.value = n.body;

  const grow = (el)=>{
    // 双栏下源码栏是固定高度、内部滚动（和右侧联动），别再按内容撑高
    if(el && el.id === 'source' && curMode() === 'split') return;
    el.style.height='auto'; el.style.height = el.scrollHeight+'px';
  };
  const growTitle = ()=>{ title.style.height='auto'; title.style.height = title.scrollHeight+'px'; };
  growTitle();

  title.addEventListener('input', ()=>{
    n.title = title.value; n.updatedAt = Date.now();
    renderTabs(); renderShelf(); save(); growTitle(); renderMeta();
  });
  title.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); src.focus(); }
  });
  title.addEventListener('blur', ()=>{ if(!n.title.trim() && n._auto){ n._auto=false; } });

  src.addEventListener('input', ()=>{
    n.body = src.value; n.updatedAt = Date.now();
    grow(src); renderMeta(); save();
    if(curMode()==='split'){ livePreviewSoon(); }
  });
  src.addEventListener('keydown', e=>{
    if(e.key==='Tab'){ e.preventDefault(); const s=src.selectionStart,en=src.selectionEnd;
      src.setRangeText('  ', s, en, 'end'); n.body = src.value; save(); }
  });
  src.addEventListener('paste', handlePaste);
  doc.addEventListener('dragover', e=>e.preventDefault());
  doc.addEventListener('drop', handleDrop);
  grow(src);

  // 预览区双击空白 → 直接开始写
  $('#prose').addEventListener('dblclick', ()=>{
    if(!n.body.trim()){ if(curMode()!=='live') setMode('live'); setTimeout(()=>focusBlock(0, 0), 20); }
  });

  // 切换编辑/预览
  doc.dataset.note = n.id;
}


/* ---- 大纲 + 右边缘刻度 ---- */
let outlineItems = [];
/* 每个标题在正文里的字符偏移，用来把刻度按文档位置铺开（笔记越长，刻度越多、铺得越开） */
function headingOffsets(body){
  const out = []; let ch = 0;
  String(body||'').split('\n').forEach(ln=>{
    if(/^#{1,6}\s+/.test(ln)) out.push(ch);
    ch += ln.length + 1;
  });
  return out;
}
function renderMiniTicks(heads, body){
  const mini = document.getElementById('olMini'); if(!mini) return;
  if(!heads.length){ mini.innerHTML = ''; mini.style.height = ''; return; }
  const total = Math.max(1, String(body||'').length);
  const H = Math.min(360, Math.max(64, heads.length * 14));
  mini.style.height = H + 'px';
  let last = -6;
  mini.innerHTML = heads.map(h=>{
    let y = Math.round(h.off / total * (H - 4));
    y = Math.max(y, last + 5); last = y;        // 相邻刻度别叠在一起
    y = Math.min(y, H - 2);
    const w = h.level === 1 ? 14 : h.level === 2 ? 10 : 7;
    return `<button class="ol-tick" style="top:${y}px;width:${w}px" data-y="${y}" data-h="${h.id}" title="${esc(h.text)}"></button>`;
  }).join('');
}
/* 当前读到哪个标题：取滚动容器里最后一个已经越过顶部的可见标题 */
function currentHeadingId(){
  const sc = document.getElementById('scroll'); if(!sc) return null;
  const box = sc.getBoundingClientRect();
  let cur = null;
  sc.querySelectorAll('h1[id],h2[id],h3[id],h4[id],h5[id],h6[id]').forEach(el=>{
    if(!el.getClientRects().length) return;    // 过滤隐藏的预览副本
    if(el.getBoundingClientRect().top - box.top <= 72) cur = el.id;
  });
  return cur;
}
function updateOutlineActive(){
  const cur = currentHeadingId();
  outlineEl.querySelectorAll('.ol-item').forEach(b=>b.classList.toggle('on', b.dataset.h === cur));
  const mini = document.getElementById('olMini');
  if(mini) mini.querySelectorAll('.ol-tick').forEach(t=>t.classList.toggle('on', t.dataset.h === cur));
}
function toggleOutlinePin(){

function renderOutline(){

  const heads = S.outlineTop ? pairs.filter(h=>h.level <= 2) : pairs;

    </div>

    + (heads.length ? heads.map(h=>`<button class="ol-item l${h.level}" data-h="${h.id}" title="${esc(h.text)}"><span class="t">${esc(h.text)}</span><span class="dash"></span></button>`).join('')
                    : `<div class="ol-empty">标题、小节会出现在这里</div>`)

/* 右边缘刻度：点某根跳到对应标题，点空白处固定/取消固定大纲 */
document.getElementById('outlineZone').addEventListener('click', e=>{
  const mini = document.getElementById('olMini'); if(!mini) return;
  const y = e.clientY - mini.getBoundingClientRect().top;
  let best = null, bd = Infinity;
  mini.querySelectorAll('.ol-tick').forEach(t=>{
    const d = Math.abs((+t.dataset.y || 0) - y);
    if(d < bd){ bd = d; best = t; }
  });
  if(best && bd <= 9){ jumpToHeading(best.dataset.h); updateOutlineActive(); }
  else toggleOutlinePin();
});
/* 鼠标移到卡片上时，刻度也让位；滚动时同步高亮当前标题 */
outlineEl.addEventListener('mouseenter', ()=>document.body.classList.add('ol-peek'));
outlineEl.addEventListener('mouseleave', ()=>document.body.classList.remove('ol-peek'));
let olScrollRaf = 0;
document.getElementById('scroll').addEventListener('scroll', ()=>{
  if(olScrollRaf) return;
  olScrollRaf = requestAnimationFrame(()=>{ olScrollRaf = 0; updateOutlineActive(); });
}, { passive:true });

/* 点大纲跳转：页面里可能有多个同名 id（即时预览副本是隐藏的），要挑真正可见的那个 */
function jumpToHeading(id){
  const all = [...document.querySelectorAll('[id="'+String(id).replace(/"/g,'\\"')+'"]')];
  const t = all.find(el=>el.getClientRects().length);
  if(!t) return;
  const sc = document.getElementById('scroll');
  if(S.mode === 'source'){
    // 源码模式没有标题元素，按行号估算位置
    const n = noteById(S.active); const src = document.getElementById('source');
    if(!n || !src) return;
    const heads = mdToHtml(n.body).headings;
    const idx = heads.findIndex(h=>h.id===id);
    if(idx < 0) return;
    const ratio = (idx + 1) / (heads.length + 1);
    src.scrollTo({ top: Math.max(0, src.scrollHeight * ratio - 80), behavior:'smooth' });
    return;
  }
  if(!sc) return;
  const top = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 28;
  sc.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
}

function purgeNote(id, quiet){

  if(!n) return;
  if(!quiet && !confirm('彻底删除「'+(n.title||'无标题')+'」？删除后不可恢复。')) return;
  // 关键：留一个墓碑并排队上传，否则服务端那条还在，下次同步会被拉回来

/* ========== Markdown ========== */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,alias)=>
    `<a href="#" class="wikilink" data-wiki="${t}">${alias||t}</a>`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=\n]+)==(?:\{(?:\.([a-z]+)|c:(#[0-9a-fA-F]{3,8}))\})?/g, (m,t,named,hex)=>{
    if(hex) return `<mark style="${hlInline(hex)}">${t}</mark>`;
    const k = String(named||'').toLowerCase();
    const cls = ['yellow','pink','blue','purple','gray'].includes(k) ? ` class="hl-${k}"` : '';
    return `<mark${cls}>${t}</mark>`;
  });
  return s;
}
function mdToHtml(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const headings = []; let hIdx = 0;
  let out = []; let i = 0;
  const isTableSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');

  while(i < lines.length){
    const line = lines[i];

    // code fence
    if(/^```/.test(line)){
      const lang = line.slice(3).trim();
      let buf = []; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code${lang?` class="lang-${esc(lang)}"`:''}>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    // heading
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lv = m[1].length; const id = 'h'+(hIdx++);
      headings.push({level:lv, text:m[2].replace(/[*_`]/g,''), id});
      out.push(`<h${lv} id="${id}">${inlineMd(m[2])}</h${lv}>`);
      i++; continue;
    }
    // hr
    if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)){ out.push('<hr>'); i++; continue; }
    // blockquote
    if(/^>\s?/.test(line)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push(`<blockquote>${buf.map(b=>`<p>${inlineMd(b)}</p>`).join('')}</blockquote>`);
      continue;
    }
    // table
    if(line.includes('|') && i+1<lines.length && isTableSep(lines[i+1])){
      const rows = []; let head = line;
      i += 2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){ rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      out.push(`<table><thead><tr>${cells(head).map(c=>`<th>${inlineMd(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${cells(r).map(c=>`<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    // lists
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      let items = [];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let l = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        let cls='';
        if(/^\[[ xX]\]\s/.test(l)){
          const chk = /^\[[xX]\]/.test(l);
          l = l.replace(/^\[[ xX]\]\s/,'');
          cls=' class="task"';
          items.push(`<li${cls}><input type="checkbox" disabled ${chk?'checked':''}>${inlineMd(l)}</li>`);
        } else {
          items.push(`<li>${inlineMd(l)}</li>`);
        }
        i++;
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      continue;
    }
    // blank
    if(!line.trim()){ i++; continue; }
    // paragraph
    let buf=[line]; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isTableSep(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push(`<p>${buf.map(inlineMd).join('<br>')}</p>`);
  }
  return {html: out.join('\n'), headings};
}

/* ========== 媒体库 ========== */
let mediaCat = 'all';
const CATS = [
  {k:'all', label:'全部'}, {k:'image', label:'图片'}, {k:'video', label:'视频'},
  {k:'audio', label:'音频'}, {k:'file', label:'文件'}, {k:'unused', label:'未引用'}, {k:'trash', label:'回收站'}
];
function kindOf(f){ if(f.type.startsWith('image')) return 'image'; if(f.type.startsWith('video')) return 'video'; if(f.type.startsWith('audio')) return 'audio'; return 'file'; }
function mediaCount(k){
  const all = allMedia();
  if(k==='all') return all.length;
  if(k==='unused') return all.filter(m=>!m.noteId).length;
  if(k==='trash') return 0;
  return all.filter(m=>kindOf(m)===k).length;
}
function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function mediaShelf(){
  let h = ``;
  h += CATS.map(c=>`<button class="shelf-row" data-media-cat="${c.k}" style="${mediaCat===c.k?'background:rgb(var(--hover));color:rgb(var(--ink))':''}">

      <span class="meta">${mediaCount(c.k)}</span></button>`).join('');

  return h;
}

/* ========== 关系图 ========== */
let graphState = null;
function graphShelf(){
  const links = [];
  S.notes.filter(n=>!n.trashed).forEach(n=>{
    (n.body.match(/\[\[([^\]|]+)/g)||[]).forEach(x=>links.push(x));
  });
  return `<div style="font-size:12px;color:rgb(var(--muted));padding:2px 8px 14px">${S.notes.filter(n=>!n.trashed).length} 篇笔记 · ${links.length} 条链接</div>
    <div class="media-search" style="margin:0 8px 14px;max-width:none">${ic('search')}
      <input id="graphFilter" placeholder="筛选" spellcheck="false"></div>
    <div class="legend"><span class="sq"></span>目录层级</div>
    <div class="legend"><span class="rd"></span>标签</div>`;
}
function renderGraph(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  scrollEl.style.display='';
  const notes = S.notes.filter(n=>!n.trashed);
  scrollEl.innerHTML = `<div id="graphWrap">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-zoom">
        <button data-z="in">${ic('plus')}</button>
        <button data-z="out">${ic('minus')||'<path d="M5 12h14"/>'}</button>
        <button data-z="fit">${ic('fit')}</button>
      </div>
    </div>`;
  const wrap = $('#graphWrap'), cv = $('#graphCanvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  let W = Math.max(wrap.clientWidth, 320), H = Math.max(wrap.clientHeight, 320);
  const resize = ()=>{
    W = Math.max(wrap.clientWidth, 320); H = Math.max(wrap.clientHeight, 320);
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  };
  const nodes = notes.map((n,i)=>{
    const a = i/notes.length*6.283 - Math.PI/2;
    return {
      id:n.id, label:n.title||'无标题',
      x: W/2 + Math.cos(a)*Math.min(190, W/3),
      y: H/2 + Math.sin(a)*Math.min(150, H/3),
      vx:0, vy:0, r: n.id===S.active?7:5.5
    };
  });
  const idx = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const edges = [];
  notes.forEach(n=>{
    (n.body.match(/\[\[([^\]|]+)\]\]/g)||[]).forEach(m=>{
      const t = m.slice(2,-2).split('|')[0];
      const target = notes.find(x=>(x.title||'')===t);
      if(target && target.id!==n.id) edges.push({a:n.id,b:target.id});
    });
  });
  graphState = {nodes, edges, idx, zoom:1, ox:0, oy:0};

  function step(){
    const {nodes, edges} = graphState;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||1;
        const f = 5200/(d*d);
        a.vx -= dx/d*f; a.vy -= dy/d*f; b.vx += dx/d*f; b.vy += dy/d*f;
      }
    }
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
      const f=(d-150)*0.012;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    });
    nodes.forEach(n=>{
      n.vx += (W/2-n.x)*0.0022; n.vy += (H/2-n.y)*0.0022;
      n.vx*=0.86; n.vy*=0.86;
      n.x+=n.vx; n.y+=n.vy;
    });
  }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function draw(){
    const dark = document.documentElement.dataset.theme==='dark';
    ctx.clearRect(0,0,W,H);
    const {nodes,edges,zoom,ox,oy} = graphState;
    ctx.save(); ctx.translate(ox,oy); ctx.scale(zoom,zoom);
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      ctx.beginPath(); ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = dark? 'rgba(255,255,255,.13)':'rgba(16,24,32,.13)';
      ctx.lineWidth = 1; ctx.stroke();
    });
    nodes.forEach(n=>{
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832);
      const active = n.id===S.active;
      ctx.fillStyle = active ? (dark?'#56b482':'#287a52') : (dark?'#8a9096':'#a0a6ac');
      ctx.fill();
      if(active){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,6.2832);
        ctx.fillStyle = dark?'rgba(86,180,130,.16)':'rgba(40,122,82,.12)'; ctx.fill(); }
      ctx.font = '12px ' + css('--font-sans').replace(/"/g,'"');
      ctx.fillStyle = dark? 'rgba(232,235,238,.72)':'rgba(28,31,34,.66)';
      ctx.textAlign='center';
      ctx.fillText(n.label.length>14? n.label.slice(0,14)+'…':n.label, n.x, n.y+n.r+16);
    });
    ctx.restore();
  }
  let raf;
  function loop(t){ let k=0; while(k<2){ step(); k++; } draw(); }
  // 静置布局
  // 静置布局
  resize();
  for(let k=0;k<260;k++) step();
  draw();
  window.onresize = resize;

  wrap.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=b.dataset.z;
    if(z==='in') graphState.zoom=Math.min(2.5,graphState.zoom*1.2);
    if(z==='out') graphState.zoom=Math.max(.35,graphState.zoom/1.2);
    if(z==='fit'){ graphState.zoom=1; graphState.ox=0; graphState.oy=0; for(let k=0;k<120;k++) step(); }
    draw();
  });
  // 拖拽 / 平移
  let drag=null;
  wrap.addEventListener('pointerdown', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-ox)/graphState.zoom, my=(e.clientY-r.top-oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+8);
    drag = hit ? {type:'node', n:hit} : {type:'pan', x:e.clientX-ox, y:e.clientY-oy};
    wrap.classList.add('dragging');
  });
  window.onpointermove = e=>{
    if(!drag) return;
    if(drag.type==='pan'){ graphState.ox = e.clientX-drag.x; graphState.oy = e.clientY-drag.y; }
    else {
      const r = cv.getBoundingClientRect();
      drag.n.x = (e.clientX-r.left-graphState.ox)/graphState.zoom;
      drag.n.y = (e.clientY-r.top-graphState.oy)/graphState.zoom;
      drag.n.vx=drag.n.vy=0;
    }
    draw();
  };
  window.onpointerup = ()=>{
    if(drag && drag.type==='node'){ for(let k=0;k<90;k++) step(); draw(); }
    drag=null; wrap.classList.remove('dragging');
  };
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const old = graphState.zoom;
    const nz = Math.max(.35, Math.min(2.5, old * (e.deltaY>0? .92 : 1.085)));
    graphState.ox = mx - (mx-graphState.ox)*(nz/old);
    graphState.oy = my - (my-graphState.oy)*(nz/old);
    graphState.zoom = nz; draw();
  }, {passive:false});
  cv.addEventListener('click', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-graphState.ox)/graphState.zoom, my=(e.clientY-r.top-graphState.oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+9);
    if(hit) openNote(hit.id);
  });
  const gf = $('#graphFilter');
  if(gf) gf.oninput = ()=>{ /* 预留 */ };
}

/* ---- HTML → Markdown（导入用，够用的子集：标题/段落/列表/引用/代码/表格/行内样式/图片） ---- */
function htmlToMd(html){
  const doc = new DOMParser().parseFromString(String(html||''),'text/html');
  const root = doc.querySelector('article') || doc.querySelector('main') || doc.body;
  if(!root) return '';
  root.querySelectorAll('script,style,noscript,link,meta,nav,header,footer,aside,form,iframe').forEach(x=>x.remove());
  root.querySelectorAll(':scope > .meta').forEach(x=>x.remove());   // 自己导出的日期行

  const norm = s => String(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim();
  const BLOCK = /^(P|DIV|SECTION|ARTICLE|UL|OL|LI|TABLE|PRE|BLOCKQUOTE|H[1-6]|HR|FIGURE)$/;

  function inline(node){
    if(node.nodeType === 3) return node.nodeValue.replace(/\u00a0/g,' ');
    if(node.nodeType !== 1) return '';
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return '';
    const inner = [...node.childNodes].map(inline).join('');
    const core = inner.trim();
    switch(t){
      case 'BR': return '\n';
      case 'STRONG': case 'B': return core ? `**${core}**` : inner;
      case 'EM': case 'I': return core ? `*${core}*` : inner;
      case 'DEL': case 'S': case 'STRIKE': return core ? `~~${core}~~` : inner;
      case 'U': return inner;
      case 'MARK': {
        const cls = (typeof node.className === 'string' ? node.className : '');
        const mcls = cls.match(/hl-(yellow|pink|blue|purple|gray)/);
        let color = mcls ? mcls[1] : '';
        if(!color){
          const bg = (node.getAttribute('style')||'').match(/background(?:-color)?\s*:\s*([^;]+)/i);
          const v = bg ? bg[1].toLowerCase() : '';
          if(/fdf0c5|253,\s*240,\s*197/.test(v)) color = 'yellow';
          else if(/fce2e5|252,\s*226,\s*229/.test(v)) color = 'pink';
          else if(/dbeafa|219,\s*234,\s*250/.test(v)) color = 'blue';
          else if(/ebe2f8|235,\s*226,\s*248/.test(v)) color = 'purple';
          else if(/e9ecef|233,\s*236,\s*239/.test(v)) color = 'gray';
        }
        return core ? `==${core}==${color ? `{.${color}}` : ''}` : inner;
      }
      case 'CODE': return core ? '`' + core + '`' : inner;
      case 'A': {
        const href = node.getAttribute('href') || '';
        const txt = core || href;
        if(!href || /^(javascript:|#)/i.test(href)) return txt;
        return `[${txt}](${href})`;
      }
      case 'IMG': {
        const src = node.getAttribute('src') || '';
        const alt = node.getAttribute('alt') || '';
        return src ? `![${alt}](${src})` : '';
      }
      default: return inner;
    }
  }
  const inlineOf = el => norm([...el.childNodes].map(inline).join(''));

  const blocks = [];
  const push = s => { const v = String(s||'').replace(/\n{3,}/g,'\n\n').trim(); if(v) blocks.push(v); };

  function listMd(el, indent){
    const ordered = el.tagName === 'OL';
    let idx = 0;
    const rows = [];
    [...el.children].filter(c=>c.tagName==='LI').forEach(li=>{
      idx++;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
      const cb = clone.querySelector('input[type=checkbox]');
      const checked = !!(cb && (cb.hasAttribute('checked') || cb.checked));
      if(cb) cb.remove();
      const body = norm([...clone.childNodes].map(inline).join(''));
      const mark = cb ? `- [${checked?'x':' '}] ` : (ordered ? `${idx}. ` : '- ');
      rows.push(' '.repeat(indent) + mark + body);
      li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub=>{
        rows.push(listMd(sub, indent + 2));
      });
    });
    return rows.join('\n');
  }
  function tableMd(el){
    const rows = [...el.querySelectorAll('tr')];
    if(!rows.length) return '';
    const cellsOf = tr => [...tr.children].map(td=>norm(inlineOf(td)).replace(/\|/g,'\\|'));
    const head = cellsOf(rows[0]);
    const body = rows.slice(1).map(cellsOf);
    const out = [`| ${head.join(' | ')} |`, `| ${head.map(()=>'---').join(' | ')} |`];
    body.forEach(r=>out.push(`| ${r.join(' | ')} |`));
    return out.join('\n');
  }

  function walk(node, indent){
    if(node.nodeType === 3){
      const v = norm(node.nodeValue);
      if(v) push(v);
      return;
    }
    if(node.nodeType !== 1) return;
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return;
    if(/^H[1-6]$/.test(t)){ push('#'.repeat(+t[1]) + ' ' + inlineOf(node)); return; }
    if(t === 'HR'){ push('---'); return; }
    if(t === 'PRE'){
      const code = node.querySelector('code');
      const cls = code ? (typeof code.className === 'string' ? code.className : '') : '';
      const lang = (cls.match(/lang-([\w-]+)/)||[])[1] || '';
      const text = (code || node).textContent.replace(/\n+$/,'');
      push('```' + lang + '\n' + text + '\n```');
      return;
    }
    if(t === 'BLOCKQUOTE'){
      const inner = [];
      const save = blocks.length;
      [...node.childNodes].forEach(c=>walk(c, indent));
      const got = blocks.splice(save);
      got.forEach(g=>inner.push(g.split('\n').map(l=>'> ' + l).join('\n')));
      push(inner.join('\n>\n'));
      return;
    }
    if(t === 'UL' || t === 'OL'){ push(listMd(node, indent)); return; }
    if(t === 'TABLE'){ const tb = tableMd(node); if(tb) push(tb); return; }
    if(t === 'IMG'){ const s = inline(node); if(s) push(s); return; }
    if(t === 'P' || t === 'DIV' || t === 'SECTION' || t === 'ARTICLE' || t === 'FIGURE' || t === 'FIGCAPTION'){
      const hasBlock = [...node.children].some(c=>BLOCK.test(c.tagName));
      if(hasBlock){ [...node.childNodes].forEach(c=>walk(c, indent)); }
      else { const v = inlineOf(node); if(v) push(v); }
      return;
    }
    if(t === 'BR'){ return; }
    if([...node.children].some(c=>BLOCK.test(c.tagName))){
      [...node.childNodes].forEach(c=>walk(c, indent));
    } else {
      const v = inlineOf(node);
      if(v) push(v);
    }
  }

  [...root.childNodes].forEach(n=>walk(n, 0));
  let md = blocks.join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
  // 正文开头的 H1 常与文件名重复，交给 importDoc 决定标题，这里先原样保留
  return md;
}

function importDoc(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.md,.markdown,.txt,.html,.htm';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const isHtml = /\.html?$/i.test(f.name);
    const r = new FileReader();
    r.onload = ()=>{
      const text = String(r.result);
      let title = f.name.replace(/\.\w+$/,'');
      let body = '';
      if(isHtml){
        const doc = new DOMParser().parseFromString(text,'text/html');
        const t = (doc.querySelector('title') && doc.querySelector('title').textContent || '').trim();
        const h1 = (doc.querySelector('h1') && doc.querySelector('h1').textContent || '').trim();
        title = t || h1 || title;
        body = htmlToMd(text);
        // 去掉和标题重复的首个 H1
        body = body.replace(/^#\s+.*\n?/, m => {
          const h = m.replace(/^#\s+/,'').trim();
          return h && h === title ? '' : m;
        }).trim();
      }else{
        const first = text.split('\n').find(l=>/^#\s+/.test(l));
        if(first) title = first.replace(/^#\s+/,'').trim();
        body = text.replace(/^#\s+.*\n/,'');
      }
      const nn = newNote();
      nn.title = title;
      nn.body = body;
      renderAll(); save();
      toast('已导入「' + title + '」');
    };
    r.readAsText(f);
  };
  inp.click();
}
function importMd(){ importDoc(); }

/* ========== 菜单 ========== */
/* 锚点可能在打开菜单的过程中被重绘掉（同步、切换笔记都会 renderAll），
   这时 getBoundingClientRect 全是 0，菜单会飞左上角 —— 依次找回：同名元素 → 上次菜单位置 → 鼠标位置 */
let LAST_POINTER = { x: window.innerWidth - 80, y: 64 };
document.addEventListener('mousedown', e=>{ LAST_POINTER = { x:e.clientX, y:e.clientY }; }, true);
function liveAnchor(anchor, id){
  if(anchor && anchor.isConnected) return anchor;
  const again = id ? document.getElementById(id) : null;
  if(again) return again;
  // 找不到就地造一个不可见的锚点，位置取上次菜单展开处
  const ghost = document.createElement('div');
  const r = $('#popover')._lastRect || { left: LAST_POINTER.x - 1, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  ghost.style.cssText = `position:fixed;left:${r.right-2}px;top:${r.bottom}px;width:2px;height:2px;pointer-events:none;opacity:0`;
  document.body.appendChild(ghost);
  setTimeout(()=>ghost.remove(), 30000);
  return ghost;
}
function popover(anchor, items, opts){
  const po = $('#popover');
  let r = null;
  if(anchor && anchor.isConnected) r = anchor.getBoundingClientRect();
  if(!r || (!r.width && !r.height)){
    const again = anchor && anchor.id ? document.getElementById(anchor.id) : null;
    if(again) r = again.getBoundingClientRect();
  }
  if((!r || (!r.width && !r.height)) && po._lastRect) r = po._lastRect;
  if(!r || (!r.width && !r.height)){
    r = { left: LAST_POINTER.x, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  }
  po._lastRect = { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
  po.innerHTML = items.map((it,idx)=>{
    if(it[0]==='-') return '<div class="po-sep"></div>';
    if(it[0]==='#') return it[1];
    return `<button class="po-item ${it[2]||''}" data-i="${idx}">${it[3]?ic(it[3]):''}<span>${esc(it[0])}</span>${it[1]?`<span class="po-key">${it[1]}</span>`:''}</button>`;
  }).join('');
  po.classList.add('open');
  const pw = po.offsetWidth, ph = po.offsetHeight;
  const wantLeft = opts && opts.align === 'left' ? r.left : r.right - pw;
  po.style.left = Math.min(Math.max(12, wantLeft), window.innerWidth-pw-12)+'px';
  po.style.top = Math.min(r.bottom+6, window.innerHeight-ph-12)+'px';
  po.querySelectorAll('[data-i]').forEach(b=>{
    b.onmousedown = ev=>ev.preventDefault();   // 别把正文的选区/焦点抢走
    b.onclick = ()=>{
      const it = items[+b.dataset.i];
      po.classList.remove('open');
      if(it[4]) it[4]();
    };
  });
  // 二级菜单会在同一个 #popover 上重绘，先把上一次的外部点击监听摘掉，避免越积越多
  if(po._off) document.removeEventListener('mousedown', po._off);
  const off = (ev)=>{
    if(!po.contains(ev.target)){

/* ========== 账号与云同步 ========== */
const SYNC_STORE = 'ivy.sync';
const SYNC = { token:'', account:'', key:'', state:'off', last:0, error:'' };
try{
  const raw = localStorage.getItem(SYNC_STORE);
  if(raw){
    const s = JSON.parse(raw);
    SYNC.token = s.token||''; SYNC.account = s.account||''; SYNC.key = s.key||''; SYNC.last = s.last||0;
    if(SYNC.token || SYNC.key) SYNC.state = 'idle';
  }
}catch(e){}
function syncSave(){
  try{
    localStorage.setItem(SYNC_STORE, JSON.stringify({
      token: SYNC.token, account: SYNC.account, key: SYNC.key, last: SYNC.last
    }));
  }catch(e){}
}
const isConnected = ()=> !!(SYNC.token || SYNC.key);
const accountLabel = ()=> SYNC.account || '默认账号';

function syncTip(){
  if(!isConnected()) return '云同步未连接 · 点击设置';
  if(SYNC.state==='busy') return '正在同步…';
  if(SYNC.state==='pending') return '有改动，正在自动保存…';
  if(SYNC.state==='error') return '同步失败：'+(SYNC.error||'网络错误')+' · 点击查看';
  if(SYNC.state==='ok') return '已同步 · '+new Date(SYNC.last).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · '+accountLabel();
  return '已连接 '+accountLabel()+' · 点击立即同步';
}
async function apiCall(path, opts){
  opts = opts || {};
  const send = ()=> fetch(path, {
    method: opts.method || 'GET',
    headers: authHeaders(!!opts.body),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let r = await send();
  let data = await r.json().catch(()=>({}));
  if(r.status === 401 && SYNC.token && SYNC.key){
    if(await relogin()){ r = await send(); data = await r.json().catch(()=>({})); }
  }
  if(!r.ok){ const e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return data;
}
function authHeaders(json){
  const h = json ? {'content-type':'application/json'} : {};
  if(SYNC.token) h.authorization = 'Bearer ' + SYNC.token;
  else if(SYNC.key) h['x-ivy-key'] = SYNC.key;
  return h;
}
let syncBusy = false, syncTimer = null, syncPanelOpen = false;

async function doAuth(account, key, create){
  const r = await fetch('/api/auth', {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({name: account || '', key, create: !!create})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(d.error || '登录失败'); e.status = r.status; throw e; }
  SYNC.token = d.token; SYNC.account = account || ''; SYNC.key = key;
  SYNC.last = 0; SYNC.state = 'idle';
  syncSave();
  return d;
}
async function relogin(){
  if(!SYNC.key) return false;
  try{ await doAuth(SYNC.account, SYNC.key, false); return true; }catch(e){ return false; }
}
async function api(method, body){
  const send = ()=> fetch('/api/sync', {
    method, headers: authHeaders(true), body: body ? JSON.stringify(body) : undefined
  });
  let r = await send();
  let data = await r.json().catch(()=>({}));
  if(r.status === 401 && SYNC.token && SYNC.key){
    if(await relogin()){ r = await send(); data = await r.json().catch(()=>({})); }
  }
  if(!r.ok){ const e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return data;
}
function localPayload(){
  const live = S.notes.map(n=>({
    id:n.id, title:n.title||'', body:n.body||'', notebookId:n.notebookId||null,
    tags:n.tags||[], trashed:!!n.trashed, deleted:!!n.deleted,
    createdAt:n.createdAt||0, updatedAt:n.updatedAt||0
  }));
  // 待删除的笔记以墓碑上传，让云端和其它设备一起消失
  const tombs = (S.pendingDeletes||[]).map(id=>({
    id, title:'', body:'', notebookId:null, tags:[], trashed:true, deleted:true,
    createdAt:0, updatedAt:Date.now()
  }));
  return {
    notes: live.concat(tombs),
    notebooks: S.notebooks.map(nb=>({
      id:nb.id, name:nb.name, open:nb.open!==false,
      deleted:!!nb.deleted, updatedAt:nb.updatedAt||0
    }))
  };
}
function applyRemote(data){
  let changed = false;
  const map = new Map(S.notes.map(n=>[n.id,n]));
  for(const r of (data.notes||[])){
    if(!Array.isArray(r.tags)) r.tags = [];       // 兼容老客户端/老数据
    const cur = map.get(r.id);
    if(!cur){ S.notes.push(r); changed = true; }
    else if((r.updatedAt||0) > (cur.updatedAt||0)){ Object.assign(cur, r); changed = true; }
  }
  const nbm = new Map(S.notebooks.map(n=>[n.id,n]));
  for(const r of (data.notebooks||[])){
    const cur = nbm.get(r.id);
    if(!cur){ S.notebooks.push(Object.assign({deleted:false, updatedAt:0}, r)); changed = true; }
    else {
      const newer = (r.updatedAt||0) > (cur.updatedAt||0);
      const same  = (r.updatedAt||0) === (cur.updatedAt||0);
      const diff  = cur.name!==r.name || cur.open!==r.open || !!cur.deleted!==!!r.deleted;
      if(newer || (same && diff)){ Object.assign(cur, r); changed = true; }
    }
  }
  // 把云端同步过来的标签也记进历史库，之后即使从笔记上摘掉也还能再选
  if(changed){
    const lib = Array.isArray(S.tagLibrary) ? S.tagLibrary : [];
    S.notes.forEach(n=>tagOf(n).forEach(t=>{ if(t && !lib.includes(t)) lib.push(t); }));
    S.tagLibrary = lib;
  }
  return changed;
}
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, S, {media: []}))); }catch(e){}
}
function renderAfterSync(changed, force){
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#doc');
  if((changed || force) && !editing) renderAll();
  else renderDock();
  if(!S.active && !S.tabs.length){
    const first = liveNotes()[0];
    if(first){ S.active = first.id; S.tabs = [first.id]; renderAll(); }
  }
}
let syncDirty = false, syncFails = 0, syncRetryTimer = null;

function scheduleRetry(){
  clearTimeout(syncRetryTimer);
  const delay = Math.min(30000, 1500 * Math.pow(2, Math.min(syncFails, 4)));
  syncRetryTimer = setTimeout(()=>{ syncRetryTimer = null; syncNow(); }, delay);
}

async function syncNow(opts={}){
  if(!isConnected() || syncBusy) return;
  syncBusy = true;
  syncDirty = false;
  const firstTime = !SYNC.last;
  SYNC.state = 'busy'; SYNC.error = ''; renderDock(); updateSyncBadge();
  try{
    if(firstTime){
      // 首次连接：云端已有数据时，丢弃本机示例笔记，避免污染服务器
      const pre = await api('GET');
      if((pre.notes||[]).filter(x=>!x.deleted).length){
        S.notes = S.notes.filter(n=>!n.seed);
        applyRemote(pre);
      }
    }
    const data = await api('POST', localPayload());
    const changed = applyRemote(data);
    S.notes = S.notes.filter(n=>!n.deleted);
    S.pendingDeletes = [];
    SYNC.last = Date.now(); SYNC.state = 'ok'; SYNC.error = '';
    syncFails = 0; clearTimeout(syncRetryTimer); syncRetryTimer = null;
    syncSave();
    renderAfterSync(changed, opts.rerender);
    persistLocal();
  }catch(e){
    SYNC.state = 'error';
    SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
    if(e.status !== 401){ syncFails++; syncDirty = true; scheduleRetry(); }
    renderDock();
  }finally{
    syncBusy = false;
    updateSyncBadge();
    if(syncPanelOpen) paintSyncPanel();
    if(syncDirty && SYNC.state !== 'error'){
      clearTimeout(syncTimer);
      syncTimer = setTimeout(()=>syncNow(), 120);
    }
  }
}
function queueSync(){
  try{ if(!isConnected()) return; }catch(e){ return; }
  syncDirty = true;
  if(SYNC.state !== 'busy'){ SYNC.state = 'pending'; renderDock(); }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 800);
  updateSyncBadge();
}
// 页面要走了：用 keepalive 兜住最后不到 1 秒的改动
function flushSync(){
  if(!isConnected() || syncBusy || !syncDirty) return;
  try{
    fetch('/api/sync', {
      method: 'POST', keepalive: true,
      headers: authHeaders(true),
      body: JSON.stringify(localPayload())
    }).then(()=>{ syncDirty = false; }).catch(()=>{});
  }catch(e){}
}
async function pullRemote(){
  if(!isConnected() || syncBusy || document.hidden) return;
  try{
    const data = await api('GET');
    const changed = applyRemote(data);
    if(changed){ S.notes = S.notes.filter(n=>!n.deleted); renderAfterSync(true, false); persistLocal(); }
    SYNC.state = 'ok'; SYNC.last = Date.now(); syncSave(); renderDock(); updateSyncBadge();
  }catch(e){
    SYNC.state = 'error'; SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
    renderDock(); updateSyncBadge();
  }
}
setInterval(pullRemote, 45000);
document.addEventListener('visibilitychange', ()=>{
  if(!isConnected()) return;
  if(document.hidden) flushSync();
  else pullRemote();
});
window.addEventListener('pagehide', flushSync);

/* ========== 云端媒体（KV / R2） ========== */
let remoteMedia = null;
let mediaLoading = false;
async function loadRemoteMedia(force){
  if(!isConnected()){ remoteMedia = []; return; }
  if(mediaLoading) return;
  if(remoteMedia && !force) return;
  mediaLoading = true;
  try{
    const r = await fetch('/api/media', {headers: authHeaders(false)});
    if(r.ok){
      const d = await r.json();
      remoteMedia = (d.items||[]).map(it=>Object.assign({remote:true}, it));
    } else if(r.status===401){
      remoteMedia = remoteMedia || [];
    }
  }catch(e){ remoteMedia = remoteMedia || []; }
  mediaLoading = false;
}
function allMedia(){
  const remote = (remoteMedia||[]).map(it=>({
    id: it.id, name: it.name, size: it.size, type: it.type,
    url: it.url, createdAt: it.createdAt, remote: true
  }));
  return remote.concat(S.media);
}
async function uploadMediaFile(file){
  if(!isConnected()) return null;
  const fd = new FormData();
  fd.append('file', file, file.name || 'file');
  const r = await fetch('/api/media', {method:'POST', headers: authHeaders(false), body: fd});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('上传失败 HTTP '+r.status));
  remoteMedia = null;
  return d;
}
function mdForFile(name, url, type){
  return (type && type.startsWith('image')) ? `\n![${name}](${url})\n` : `\n[${name}](${url})\n`;
}
// 先试云上传，失败或未登录则退回本机 blob
async function insertFiles(files, target){
  const src = target || (curMode()==='live' ? ensureLiveInput() : document.getElementById('source'));
  if(!src || !files.length) return;
  const parts = [];
  for(const f of files){
    try{
      const up = await uploadMediaFile(f);
      if(up){ parts.push(mdForFile(up.name, up.url, up.type)); continue; }
    }catch(err){
      toast('上传失败：'+(err.message||'网络错误')+'，已暂存到本机');
    }
    const m = addMedia(f);
    parts.push(mdForFile(m.name, m.url, m.type));
  }
  const text = parts.join('');
  const p = typeof src.selectionStart==='number' ? src.selectionStart : src.value.length;
  src.setRangeText(text, p, src.selectionEnd, 'end');
  src.dispatchEvent(new Event('input', {bubbles:true}));
  if(src.classList && src.classList.contains('blk-src')){
    const i = parseInt(src.dataset.i,10) || 0;
    LIVE.raws[i] = src.value;
    syncBody();
    commitBlock(i);            // 立刻渲染，图片当场可见
  } else {
    const n = noteById(S.active);
    if(n){ n.body = src.value; n.updatedAt = Date.now(); save(); renderMeta(); }
  }
  if(S.view==='media') renderMedia();
}

function updateSyncBadge(){
  const el = document.getElementById('metaSync');
  if(!el) return;
  if(!isConnected()){ el.style.display = 'none'; return; }
  el.style.display = '';
  const st = SYNC.state==='ok' ? 'ok' : (SYNC.state==='error' ? 'error' : 'busy');
  const label = st==='ok' ? '已同步' : (st==='error' ? '未保存' : '保存中');
  el.innerHTML = `<span class="sd ${st}"></span>${label}`;
  el.title = syncTip();
}

const REG_HINT_NEW = `<div class="reg-hint-t">第一次使用？填「用户名 + 自设密码」后点<b>注册新账号</b>，就能开出独立空间，别人看不到你的笔记。</div>
  <div class="reg-hint-s">密码是唯一的钥匙，服务端只存加密哈希，忘了找不回，请一定记好。</div>`;
const REG_HINT_ON = `<div class="reg-hint-t">已连接云端，编辑会自动保存到你的空间。</div>
  <div class="reg-hint-s">要换账号，改上面的用户名和密码后点「立即同步」即可切换。</div>`;

function paintSyncPanel(){
  const line = $('#syncStatusLine');
  const hint = $('#regHint');
  if(hint) hint.innerHTML = isConnected() ? REG_HINT_ON : REG_HINT_NEW;
  if(!line) return;
  const n = S.notes.filter(x=>!x.trashed).length;
  const m = allMedia().length;
  if(SYNC.state==='ok'){
    line.innerHTML = `已登录 <b>${esc(accountLabel())}</b> · 自动同步已开启<br>上次同步 <b>${new Date(SYNC.last).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b> · 本机 ${n} 篇笔记 · ${m} 个文件`;
  } else if(SYNC.state==='busy'){
    line.innerHTML = '正在同步…';
  } else if(SYNC.state==='error'){
    line.innerHTML = `<b style="color:rgb(var(--warn))">同步失败</b> · ${esc(SYNC.error)}`;
  } else if(isConnected()){
    line.innerHTML = `已保存账号 <b>${esc(accountLabel())}</b>，点「登录并同步」开始。`;
  } else {
    line.innerHTML = '尚未登录。填好用户名和密码后点「登录并同步」，之后编辑会自动上传到云端。';
  }
  const login = $('#syncLogin'); if(login) login.textContent = isConnected() ? '立即同步' : '登录并同步';
  const out = $('#syncLogout'); if(out) out.disabled = !isConnected();
}
function openSyncPanel(){
  const ov = $('#syncOverlay');
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h3>账号与云同步</h3>
      <button class="pa-btn" id="syncClose" title="关闭">${ic('x')}</button></div>
    <div class="reg-hint" id="regHint"></div>
    <label class="field"><span>用户名</span>
      <input id="syncNameInput" type="text" placeholder="给自己起个名字，例如 xiaohu" autocomplete="off" spellcheck="false" value="${esc(SYNC.account)}"></label>
    <label class="field"><span>密码</span>
      <input id="syncKeyInput" type="password" placeholder="自己设定的密码，至少 4 位" autocomplete="off" spellcheck="false" value="${esc(SYNC.key)}"></label>
    <div class="sheet-row">
      <button class="btn-primary" id="syncLogin">登录并同步</button>
      <button class="btn-ghost" id="syncRegister">注册新账号</button>
      <button class="btn-ghost" id="syncLogout">退出</button>
    </div>
    <div class="sheet-status" id="syncStatusLine"></div>
  </div>`;
  ov.classList.add('open'); syncPanelOpen = true;
  paintSyncPanel();

  const readForm = ()=>({
    name: ($('#syncNameInput').value||'').trim(),
    key: ($('#syncKeyInput').value||'').trim()
  });
  const run = async (create)=>{
    const {name, key} = readForm();
    if(!key){ toast('请先填写密码'); return; }
    if(create && !name){ toast('注册新账号需要填写用户名'); return; }
    const btn = create ? $('#syncRegister') : $('#syncLogin');
    btn.disabled = true;
    try{
      await doAuth(name, key, create);
      SYNC.state = 'busy'; paintSyncPanel(); renderDock();
      await syncNow({rerender:true});
      paintSyncPanel();
      if(SYNC.state==='ok') toast((create?'已创建账号「':'已登录「')+ (name||'默认账号') +'」');
    }catch(e){
      SYNC.state = 'off'; SYNC.error = '';
      toast(e.message || '登录失败');
      paintSyncPanel();
    }finally{ btn.disabled = false; }
  };

  $('#syncClose').onclick = closeSyncPanel;
  $('#syncLogin').onclick = ()=>run(false);
  $('#syncRegister').onclick = ()=>run(true);
  $('#syncLogout').onclick = ()=>{
    SYNC.token=''; SYNC.key=''; SYNC.account=''; SYNC.state='off'; SYNC.last=0; SYNC.error='';
    syncSave(); paintSyncPanel(); renderDock(); updateSyncBadge();
    toast('已退出账号，本机数据保留');
  };
  $('#syncKeyInput').onkeydown = e=>{ if(e.key==='Enter') $('#syncLogin').click(); };
  if(!isConnected()) setTimeout(()=>{ const i=$('#syncNameInput'); if(i) i.focus(); }, 60);
}
function closeSyncPanel(){ $('#syncOverlay').classList.remove('open'); syncPanelOpen = false; }
$('#syncOverlay').addEventListener('mousedown', e=>{ if(e.target.id==='syncOverlay') closeSyncPanel(); });

/* ========== 启动 ========== */
paintRowIcons();
const qs = new URLSearchParams(location.search);
const vParam = qs.get('view');
if(vParam && ['notes','media','graph'].includes(vParam)){ S.view = vParam; trashView=false; }
const tParam = qs.get('theme');
if(tParam==='dark' || tParam==='light'){ S.theme = tParam; }
applyTheme();
// URL 里的 n= 参数
const nParam = qs.get('n');
if(nParam && noteById(nParam) && !noteById(nParam).trashed){
  S.active = nParam; if(!S.tabs.includes(nParam)) S.tabs.push(nParam);
} else if(qs.get('new')==='1'){ newNote(); }
renderAll();
if(qs.get('mode')==='edit') setTimeout(()=>setMode('source'), 60);
if(qs.get('mode')==='preview') setTimeout(()=>setMode('preview'), 60);
if(qs.get('mode')==='live') setTimeout(()=>setMode('live'), 60);
if(qs.get('cmd')==='1') setTimeout(()=>openPalette(), 60);
if(qs.get('sync')==='1') setTimeout(()=>openSyncPanel(), 60);
// 已有密码时后台安静同步一次
if(isConnected()){
  setTimeout(async ()=>{
    if(!SYNC.token && SYNC.key){
      try{ await doAuth(SYNC.account, SYNC.key, false); }
      catch(e){ SYNC.state='error'; SYNC.error=e.message||'登录失败'; renderDock(); return; }
    }
    syncNow({rerender:true});
  }, 350);
}
</script>
</body>
</html>
