  const canvas = document.querySelector('#mmCanvas');
  if(canvas) canvas.innerHTML = mmSvgString();
  const sub = document.getElementById('mmSub');
  if(sub){
    sub.textContent = '由标题与缩进列表生成 · ' + Math.max(0, MM.byId.size - 1) + ' 个节点'
      + (MM.canEdit ? ' · 改动会写回笔记（可撤销）' : ' · 只读视图');
  }
  if(refit) mmFit(); else mmApply();
  mmSyncBar();
}
/* ---------- 编辑：树 → Markdown 写回 ---------- */
function mmNextId(){ MM.seq = (MM.seq || 0) + 1; return MM.seq; }
function mmRelevel(){
  (function walk(n, d){ n.children.forEach(c => { c.depth = d + 1; walk(c, d + 1); }); })(MM.root, 0);
}
function mmFind(idx){
  let hit = null;
  (function walk(n){
    n.children.forEach(c => { if(c.i === idx) hit = { node:c, parent:n }; walk(c); });
  })(MM.root);
  return hit;
}
/* 写回成嵌套列表：原来用标题分层的，标题那几层继续用标题，更深的用 - 缩进 */
function mmToMarkdown(){
  const st = MM.style || { kind:'list', base:1, headMax:0 };
  const out = [];
  (function walk(n){
    n.children.forEach(c => {
      const label = String((c.raw != null && c.raw !== '') ? c.raw : (c.label == null ? '' : c.label))
        .replace(/\s+/g, ' ').trim();
      if(st.kind === 'head' && c.depth <= st.headMax && c.depth <= 6){
        out.push('');
        out.push('#'.repeat(Math.min(6, st.base + c.depth - 1)) + ' ' + label);
        out.push('');
      }else{
        const lv = st.kind === 'head' ? Math.max(1, c.depth - st.headMax) : Math.max(1, c.depth);
        const bullet = c.done === true ? '- [x] ' : (c.done === false ? '- [ ] ' : '- ');
        out.push('  '.repeat(Math.max(0, lv - 1)) + bullet + label);
      }
      walk(c);
    });
  })(MM.root);
  let md = out.join('\n').replace(/\n{3,}/g, '\n\n').replace(/^\n+/, '').replace(/\s+$/, '');
  return md ? md + '\n' : '';
}
function mmCommit(){
  const note = noteById(MM.noteId);
  if(!note || !MM.canEdit) return;
  const before = note.body;
  mmRelevel();
  note.body = mmToMarkdown();
  note.updatedAt = Date.now();
  MM.undo.push({ noteId: note.id, body: before });
  if(MM.undo.length > 40) MM.undo.shift();
  save();
  try{ renderAll(); }catch(e){}
  mmRerender(false);      // 只重排现有树，保住折叠与选中状态
  mmSyncBar();
}
function mmUndo(){
  const u = MM.undo.pop();
  if(!u){ toast('没有可撤销的操作'); return; }
  const note = noteById(u.noteId);
  if(!note){ toast('找不到这篇笔记'); return; }
  note.body = u.body;
  note.updatedAt = Date.now();
  save();
  try{ renderAll(); }catch(e){}
  MM.sel = 0;
  mmRefresh(true);
  toast('已撤销上一步');
}
function mmGuardEdit(){
  if(!MM.canEdit){ mmBlockEdit(); return false; }
  return true;
}
function mmBlockEdit(){
  if(!MM.withList) toast('先打开「含列表项」，否则写回会把列表全删掉');
  else toast('这篇里有正文段落或代码块，写回会覆盖它们；请用「另存为新笔记」再编辑');
}
/* 只改选中描边，不重绘整张图——重绘会让第二次点击落到新节点上，双击就失效了 */
function mmPaintSel(idx){
  if(!idx) return;
  const n = MM.byId.get(idx);
  const g = document.querySelector('#mmCanvas [data-mm="' + idx + '"]');
  if(!n || !g) return;
  const on = MM.sel === idx;
  const shape = g.querySelector('[data-shape]');
  if(shape){
    if(on){
      shape.setAttribute('stroke', MM.c.sel);
      shape.setAttribute('stroke-width', '2.4');
    }else{
      const st = shape.getAttribute('data-st'), sw = shape.getAttribute('data-sw') || '1';
      if(st){ shape.setAttribute('stroke', st); shape.setAttribute('stroke-width', sw); }
      else { shape.removeAttribute('stroke'); shape.removeAttribute('stroke-width'); }
    }
  }
  // 极简风格没有底色，用虚线框标选中
  const old = g.querySelector('[data-sel]');
  if(old) old.remove();
  if(on && mmPreset().shape === 'plain'){
    const l = n.x, top = n.y - (n.h || MM_NH) / 2, w = n.w, h = n.h || MM_NH;
    g.insertAdjacentHTML('afterbegin', '<rect data-sel="1" x="' + (l - 5) + '" y="' + (top - 1) + '" width="' + (w + 10)
      + '" height="' + (h + 2) + '" rx="7" fill="none" stroke="' + MM.c.sel + '" stroke-width="1.4" stroke-dasharray="4 3" opacity=".85"/>');
  }
}
function mmSelect(idx){
  const prev = MM.sel;
  MM.sel = idx;
  mmPaintSel(prev);
  mmPaintSel(idx);
  mmSyncBar();
}
function mmSetCollapsed(idx){
  const n = MM.byId.get(idx);
  if(!n || !n.children.length) return;
  n.collapsed = !n.collapsed;
  mmRerender(false);
}
function mmAddChild(idx){
  if(!mmGuardEdit()) return;
  const hit = mmFind(idx);
  // 根节点的 i 是 0，mmFind 只走子节点找不到它：没选中时就从根往下长第一根枝
  const parent = hit ? hit.node : (MM.root && idx === MM.root.i ? MM.root : null);
  if(!parent) return;
  const node = { i:mmNextId(), label:'新节点', raw:'新节点', done:null, text:'', depth:0, children:[], collapsed:false, kind:'li', w:0, x:0, y:0 };
  parent.children.push(node);
  parent.collapsed = false;
  MM.sel = node.i;
  mmCommit();
  mmStartRename(node.i);
}
function mmAddSibling(idx){
  if(!mmGuardEdit()) return;
  const hit = mmFind(idx);
  if(!hit) return;
  const node = { i:mmNextId(), label:'新节点', raw:'新节点', done:null, text:'', depth:0, children:[], collapsed:false, kind:'li', w:0, x:0, y:0 };
  const arr = hit.parent.children;
  arr.splice(arr.indexOf(hit.node) + 1, 0, node);
  MM.sel = node.i;
  mmCommit();
  mmStartRename(node.i);
}
function mmDelete(idx){
  if(!mmGuardEdit()) return;
  const hit = mmFind(idx);
  if(!hit) return;
  const arr = hit.parent.children;
  arr.splice(arr.indexOf(hit.node), 1);
  MM.sel = 0;
  mmCommit();
  toast('已删除该节点及其子节点');
}
function mmMove(idx, dir){
  if(!mmGuardEdit()) return;
  const hit = mmFind(idx);
  if(!hit) return;
  const arr = hit.parent.children, i = arr.indexOf(hit.node), j = i + dir;
  if(j < 0 || j >= arr.length) return;
  arr.splice(j, 0, arr.splice(i, 1)[0]);
  mmCommit();
}
/* 节点跑到可视区外时先把图挪回来：新增节点 / 切选中后最容易出现，
   不然输入框会贴在屏幕边上，甚至整个飘到屏幕外 */
function mmRevealNode(idx, bottomBound){
  const box = document.getElementById('mmCanvas');
  if(!box || !MM.lay) return;
  const g = box.querySelector('[data-mm="' + idx + '"]');
  if(!g) return;
  const br = box.getBoundingClientRect();
  const r = g.getBoundingClientRect();
  const m = 18;
  const bottom = Math.min(br.bottom, bottomBound == null ? br.bottom : bottomBound) - m;
  let dx = 0, dy = 0;
  if(r.left < br.left + m) dx = br.left + m - r.left;
  else if(r.right > br.right - m) dx = br.right - m - r.right;
  if(r.top < br.top + m) dy = br.top + m - r.top;
  else if(r.bottom > bottom) dy = bottom - r.bottom;
  if(!dx && !dy) return;
  MM.tx += dx; MM.ty += dy; mmApply();
}
/* ---------- 手机端节点输入条 ----------
   小屏没有 Tab 键，浮在节点上的输入框还会被软键盘盖住、被挤到屏幕外。
   改成贴底的一条：回车＝落定并接着写下一个同级，旁边按钮长同级 / 子级，
   一路敲下去就行，跟桌面的 Enter / Tab 是一个意思。 */
function mmKpEl(){ return document.getElementById('mmKp'); }
function mmKpSync(){
  const kp = mmKpEl();
  if(!kp || !kp.classList.contains('open')) return;
  const vv = window.visualViewport;
  // 软键盘弹出后，把输入条顶到键盘上沿（iOS 的 fixed 不会自己往上让）
  const gap = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  kp.style.bottom = gap + 'px';
  // 键盘把可视区压短了，正在编辑的节点可能被挡住：跟着把图往上挪一点
  if(MM.kpIdx != null) mmRevealNode(MM.kpIdx, kp.getBoundingClientRect().top);
}
function mmKpBuild(){
  const ov = document.getElementById('mmOv');
  if(!ov) return null;
  let kp = mmKpEl();
  if(kp) return kp;
  kp = document.createElement('div');
  kp.className = 'mm-kp';
  kp.id = 'mmKp';
  kp.innerHTML = '<input id="mmKpIn" class="mm-kp-in" type="text" placeholder="节点文字" '
    + 'enterkeyhint="next" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'
    + '<button class="mm-kp-b" id="mmKpSib" type="button" title="落定并新建同级">＋同级</button>'
    + '<button class="mm-kp-b" id="mmKpChild" type="button" title="落定并新建子节点">＋下级</button>'
    + '<button class="mm-kp-b primary" id="mmKpDone" type="button" title="收键盘">完成</button>';
  ov.appendChild(kp);
  const inp = kp.querySelector('#mmKpIn');
  inp.addEventListener('keydown', e => {
    // 中文输入法选词时的回车不能当成「下一行」，否则会把没上屏的字直接吞掉
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === 'Enter'){ e.preventDefault(); mmKpNext('sib'); }
    else if(e.key === 'Tab'){ e.preventDefault(); mmKpNext('child'); }   // 接了外接键盘也能用
    else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); mmKpFinish(); }
  });
  inp.addEventListener('blur', () => { mmKpSave(); });    // 先落定文字，收不收条由动作决定
  kp.querySelector('#mmKpSib').addEventListener('click', () => mmKpNext('sib'));
  kp.querySelector('#mmKpChild').addEventListener('click', () => mmKpNext('child'));
  kp.querySelector('#mmKpDone').addEventListener('click', () => mmKpFinish());
  if(!window._mmKpVp && window.visualViewport){
    window._mmKpVp = true;
    window.visualViewport.addEventListener('resize', mmKpSync);
    window.visualViewport.addEventListener('scroll', mmKpSync);
  }
  return kp;
}
/* 把输入条里的文字写回节点（没改就不提交，免得白记一步撤销） */
function mmKpSave(){
  const idx = MM.kpIdx;
  if(idx == null) return;
  const inp = document.getElementById('mmKpIn');
  if(!inp) return;
  const n = MM.byId.get(idx);
  if(!n) return;
  const v = (inp.value || '').trim();
  if(v && v !== n.label){ n.label = v; n.raw = v; mmCommit(); }
}
function mmKpNext(kind){
  const idx = MM.kpIdx;
  if(idx == null) return;
  mmKpSave();
  if(kind === 'child' || !mmFind(idx)) mmAddChild(idx);   // 根节点没有同级，退成长子节点
  else mmAddSibling(idx);
  // mmAddChild / mmAddSibling 会把选中指到新节点并调 mmStartRename，
  // 手机上会重新打开这条输入条并把焦点放回来，可以接着敲
}
function mmKpFinish(){
  mmKpSave();
  mmKpClose();
}
function mmKpClose(){
  MM.kpIdx = null;
  const ov = document.getElementById('mmOv');
  if(ov) ov.classList.remove('kp');
  const kp = mmKpEl();
  if(!kp) return;
  kp.classList.remove('open');
  const inp = kp.querySelector('#mmKpIn');
  if(inp){ inp.value = ''; inp.blur(); }
}
function mmKpOpen(idx){
  const n = MM.byId.get(idx);
  if(!n) return;
  const kp = mmKpBuild();
  if(!kp) return;
  if(MM.sel !== idx) mmSelect(idx);
  MM.kpIdx = idx;
  const ov = document.getElementById('mmOv');
  if(ov) ov.classList.add('kp');
  kp.classList.add('open');
  const inp = kp.querySelector('#mmKpIn');
  inp.value = n.label || '';
  mmKpSync();
  mmRevealNode(idx, kp.getBoundingClientRect().top);
  requestAnimationFrame(() => {
    try{ inp.focus({ preventScroll:true }); }catch(e){ try{ inp.focus(); }catch(e2){} }
    inp.select();
    mmKpSync();
  });
}
/* 内联改名框可能因为关掉导图 / 又去点别的节点而留在页面上，统一收掉（先把字落定） */
function mmInlineFinish(){
  const el = document.querySelector('.mm-rename');
  if(!el) return;
  if(typeof el._mmFinish === 'function'){ try{ el._mmFinish(true); }catch(e){ el.remove(); } }
  else el.remove();
}
function mmStartRename(idx){
  if(!mmGuardEdit()) return;
  const n = MM.byId.get(idx);
  if(!n) return;
  if(mmIsPhone()){ mmKpOpen(idx); return; }   // 手机上走贴底输入条
  mmInlineFinish();                           // 上一个还没落定的先收掉，别叠两个输入框
  mmRevealNode(idx);
  const rect = document.querySelector('#mmCanvas [data-mm="' + idx + '"] rect');
  if(!rect) return;
  const r = rect.getBoundingClientRect();
  const inp = document.createElement('input');
  inp.className = 'mm-rename';
  inp.value = n.label;
  inp.setAttribute('spellcheck', 'false');
  const w = Math.max(110, r.width), h = Math.max(28, r.height);
  // 贴着节点放，但别越过窗口边界（节点靠右 / 靠下时会被挤到屏幕外）
  inp.style.left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - w - 8)) + 'px';
  inp.style.top = Math.min(Math.max(8, r.top), Math.max(8, window.innerHeight - h - 8)) + 'px';
  inp.style.width = w + 'px';
  inp.style.height = h + 'px';
  document.body.appendChild(inp);
  inp.focus();
  inp.select();
  let closed = false;
  const finish = ok => {
    if(closed) return;
    closed = true;
    const v = inp.value.trim();
    inp.remove();
    if(ok && v && v !== n.label){ n.label = v; n.raw = v; mmCommit(); }
  };
  inp._mmFinish = finish;
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    // 改完名直接 Tab：落定并长出一个子节点，新手也能一路敲下去
    else if(e.key === 'Tab'){ e.preventDefault(); finish(true); if(MM.sel) mmAddChild(MM.sel); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}
function mmSyncBar(){
  const bar = document.getElementById('mmEditBar');
  if(!bar) return;
  const n = MM.sel ? MM.byId.get(MM.sel) : null;
  bar.querySelectorAll('[data-mme]').forEach(b => {
    const k = b.dataset.mme;
    if(k === 'undo') b.disabled = !MM.undo.length;
    else if(k === 'dup') b.disabled = false;
    else b.disabled = !(n && MM.canEdit);
  });
  const tip = bar.querySelector('#mmEditTip');
  if(!tip) return;
  if(!MM.canEdit){
    tip.textContent = MM.withList
      ? '这篇含正文段落 / 代码块，写回会覆盖 · 建议「另存为新笔记」'
      : '「含列表项」关着时不能编辑（写回会丢列表）';
  }else if(!n){
    tip.textContent = '点一个节点：可直接改文字，或用右侧按钮增删移动';
  }else{
    const short = n.label.length > 16 ? n.label.slice(0, 16) + '…' : n.label;
    tip.textContent = '已选「' + short + '」' + (mmIsPhone() ? '' : ' · Tab 加子节点、Enter 加同级');
  }
}
/* 含正文段落的笔记：复制成一篇纯大纲笔记，随便改也不怕丢内容 */
function mmDupOutline(){
  const note = noteById(MM.noteId);
  if(!note) return;
  const body = mmToMarkdown();
  const id = 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const copy = {
    id, title: (note.title || '未命名') + '（大纲）',
    body: body || '- 新节点\n',
    notebookId: note.notebookId || null, tags: [],
    trashed: false, deleted: false, createdAt: Date.now(), updatedAt: Date.now()
  };
  S.notes.push(copy);
  S.active = id;
  S.tabs = [id];
  save();
  try{ renderAll(); }catch(e){}
  MM.noteId = id;
  MM.sel = 0;
  MM.undo.length = 0;
  mmRefresh(true);
  toast('已复制成新的纯大纲笔记，现在可以随便编辑');
}

function mmRefresh(refit){
  const ov = document.getElementById('mmOv');
  if(!ov) return;
  const note = noteById(MM.noteId);
  if(!note){ closeMindMap(); return; }
  if(!MM.styleId) MM.styleId = (S && S.mmStyle) || 'classic';
  if(!MM.dir) MM.dir = (S && S.mmDir) || 'right';
  MM.c = mmPalette();
  MM.bg = MM.c.bg;
  mmSyncStyleBtn();
  const built = mmBuildTree(note, MM.withList);
  MM.root = built.root;
  MM.style = built.style;
  // 有正文段落/代码块时写回会覆盖它们；关掉「含列表项」时写回会丢列表——这两种都不让编辑
  MM.canEdit = !built.extra && MM.withList;
  MM.byId.clear();
  (function w(n){ MM.byId.set(n.i, n); n.children.forEach(w); })(MM.root);
  MM.seq = MM.byId.size ? Math.max(...Array.from(MM.byId.keys())) : 0;
  if(MM.sel && !MM.byId.has(MM.sel)) MM.sel = 0;
  const empty = ov.querySelector('#mmEmpty'), canvas = ov.querySelector('#mmCanvas');
  const sub = ov.querySelector('#mmSub');
  const body = canvas && canvas.closest ? canvas.closest('.mm-body') : null;
  if(body) body.style.background = MM.c.bg;   // 霓虹这类深底样式，画布外的留白也要跟着变
  if(!built.count){
    MM.lay = null;
    canvas.innerHTML = '';
    canvas.style.display = 'none';
    empty.hidden = false;
    if(sub) sub.textContent = '这篇还没有层级可画';
    mmSyncBar();
    return;
  }
  empty.hidden = true;
  canvas.style.display = '';
  MM.lay = mmLayout(MM.root);
  canvas.innerHTML = mmSvgString();
  if(refit) mmFit(); else mmApply();
  if(sub) sub.textContent = '由标题与缩进列表生成 · ' + built.count + ' 个节点'
    + (built.cut ? ' · 已截取前 600 个' : '') + (MM.canEdit ? ' · 改动会写回笔记（可撤销）' : ' · 只读视图');
  mmSyncBar();   // 打开 / 换笔记时，底部按钮的可用状态要跟着更新
}
/* ---------- 窗口拖动：抓住标题栏把导图挪开，方便对照后面的正文 ---------- */
const MM_WIN = { dx:0, dy:0, drag:null };
function mmIsPhone(){ return window.innerWidth <= 760 || window.innerHeight <= 520; }
function mmWinSet(dx, dy, persist){
  const ov = document.getElementById('mmOv');
  const card = ov && ov.querySelector('.mm-card');
  if(!card) return;
  if(mmIsPhone()){                       // 手机上是全屏，没有可拖的余地
    MM_WIN.dx = MM_WIN.dy = 0;
    card.style.left = ''; card.style.top = '';
    return;
  }
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = card.offsetWidth, h = card.offsetHeight;
  const baseLeft = (vw - w) / 2, baseTop = (vh - h) / 2;
  // 至少留 160px 在屏内、标题栏不能被拖出屏幕上方
  const left = Math.min(vw - 160, Math.max(160 - w, baseLeft + dx));
  const top = Math.min(Math.max(6, vh - 64), Math.max(6, baseTop + dy));
  MM_WIN.dx = Math.round(left - baseLeft);
  MM_WIN.dy = Math.round(top - baseTop);
  card.style.left = MM_WIN.dx + 'px';
  card.style.top = MM_WIN.dy + 'px';
  if(persist && typeof S === 'object' && S){ S.mmWin = { x:MM_WIN.dx, y:MM_WIN.dy }; try{ save(); }catch(e){} }
}
function mmWinRestore(){
  const w = (typeof S === 'object' && S && S.mmWin) || null;
  MM_WIN.dx = w ? (w.x || 0) : 0;
  MM_WIN.dy = w ? (w.y || 0) : 0;
  mmWinSet(MM_WIN.dx, MM_WIN.dy);
}
function mmWinBind(){
  const ov = document.getElementById('mmOv');
  if(!ov) return;
  const hd = ov.querySelector('.mm-hd');
  if(!hd || hd._winBound) return;
  hd._winBound = true;
  hd.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    if(mmIsPhone()) return;
    if(e.target.closest('button, a, input, textarea, select, #mmStylePop')) return;
    // 自己判双击：pointerdown 里 preventDefault 会吃掉浏览器合成的 dblclick
    const now = Date.now();
    if(MM_WIN.lastTap && now - MM_WIN.lastTap < 340 &&
       Math.abs(e.clientX - MM_WIN.lastX) < 8 && Math.abs(e.clientY - MM_WIN.lastY) < 8){
      MM_WIN.lastTap = 0;
      mmWinSet(0, 0, true);
      toast('窗口已回到中间');
      return;
    }
    MM_WIN.lastTap = now; MM_WIN.lastX = e.clientX; MM_WIN.lastY = e.clientY;
    MM_WIN.drag = { id:e.pointerId, sx:e.clientX, sy:e.clientY, ox:MM_WIN.dx, oy:MM_WIN.dy };
    try{ hd.setPointerCapture(e.pointerId); }catch(err){}
    hd.classList.add('dragging');
    const pop = document.getElementById('mmStylePop');
    if(pop && !pop.hidden) mmToggleStyle(false);
    e.preventDefault();
  });
  hd.addEventListener('pointermove', e => {
    const d = MM_WIN.drag;
    if(!d || d.id !== e.pointerId) return;
    mmWinSet(d.ox + e.clientX - d.sx, d.oy + e.clientY - d.sy);
  });
  const endDrag = e => {
    const d = MM_WIN.drag;
    if(!d || d.id !== e.pointerId) return;
    MM_WIN.drag = null;
    hd.classList.remove('dragging');
    mmWinSet(MM_WIN.dx, MM_WIN.dy, true);   // 位置记进账号状态，下次打开还在原处
  };
  hd.addEventListener('pointerup', endDrag);
  hd.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', () => {
    if(document.getElementById('mmOv')) mmWinSet(MM_WIN.dx, MM_WIN.dy);
  });
}
function mmBind(){
  const box = $('#mmCanvas');
  if(!box || box._mmBound) return;
  box._mmBound = true;
  box.addEventListener('wheel', e => {
    if(!MM.lay) return;
    e.preventDefault();
    const r = box.getBoundingClientRect();
    mmZoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });
  box.addEventListener('pointerdown', e => {
    if(!MM.lay) return;
    // 输入条开着时先落定（点画布＝收工），但点的还是正在编辑的那个节点就别关
    const tapped = e.target.closest ? e.target.closest('[data-mm]') : null;
    if(MM.kpIdx != null && (!tapped || +tapped.dataset.mm !== MM.kpIdx)) mmKpFinish();
    MM.ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
    MM.moved = 0;
    // 指针被画布捕获后，click 的 target 会落到画布上，节点就选不中了；
    // 所以按下时先记住按在哪个节点上，抬起时按这个来判断「点的是谁」
    MM.downNode = e.target.closest ? e.target.closest('[data-mm]') : null;
    MM.downFold = e.target.closest ? e.target.closest('[data-mm-fold]') : null;
    box.classList.add('grabbing');
  });
  box.addEventListener('pointermove', e => {
    const p = MM.ptrs.get(e.pointerId);
    if(!p) return;
    const px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    if(MM.ptrs.size === 1){
      MM.tx += p.x - px; MM.ty += p.y - py;
      MM.moved += Math.abs(p.x - px) + Math.abs(p.y - py);
      mmApply();
    }else if(MM.ptrs.size === 2){
      const it = [...MM.ptrs.values()];
      const d = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      if(MM.pinch){
        const r = box.getBoundingClientRect();
        mmZoomAt(d / MM.pinch, (it[0].x + it[1].x) / 2 - r.left, (it[0].y + it[1].y) / 2 - r.top);
      }
      MM.pinch = d;
      MM.moved = 99;
    }
  });
  const end = (e, cancelled) => {
    MM.ptrs.delete(e.pointerId);
    if(MM.ptrs.size) return;
    MM.pinch = 0;
    box.classList.remove('grabbing');
    const node = MM.downNode, fold = MM.downFold;
    MM.downNode = null;
    MM.downFold = null;
    if(cancelled || MM.moved > 8) return;        // 拖动 / 缩放，不算点击
    if(fold && node) mmSetCollapsed(+node.dataset.mm);
    else if(node){
      const idx = +node.dataset.mm;
      // 手机上再点一次已选中的节点＝直接改字（不用先去够下面那排按钮）
      if(mmIsPhone() && idx === MM.sel) mmStartRename(idx);
      else mmSelect(idx);
    }
    else if(MM.sel){ const prev = MM.sel; MM.sel = 0; mmPaintSel(prev); mmSyncBar(); }
  };
  box.addEventListener('pointerup', e => end(e, false));
  box.addEventListener('pointercancel', e => end(e, true));
  box.addEventListener('dblclick', e => {
    const g = e.target.closest && e.target.closest('[data-mm]');
    const idx = g ? +g.dataset.mm : MM.sel;      // 指针捕获时 target 是画布，退回用已选节点
    if(idx) mmStartRename(idx);
  });
  /* 键盘：Tab 长一个子节点、Enter 长一个同级（跟正文编辑器的习惯一致）。
     没选节点就从根节点开始；改名框里打字、按钮上有焦点时不抢键。
     走捕获阶段：Esc 要先被导图拿走，否则会被全局「Esc 关所有浮层」先关掉整张图。 */
  if(!window._mmKeys){
    window._mmKeys = true;
    document.addEventListener('keydown', e => {
      const ov = document.getElementById('mmOv');
      if(!ov || !ov.classList.contains('open')) return;
      if(e.isComposing || e.keyCode === 229) return;
      if(e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      const ae = document.activeElement;
      if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
      const pop = document.getElementById('mmStylePop');
      if(e.key === 'Escape'){
        e.preventDefault(); e.stopPropagation();
        if(pop && !pop.hidden){ mmToggleStyle(false); return; }   // 先收样式面板
        closeMindMap();
        return;
      }
      if(ae && ae.tagName === 'BUTTON') return;                   // 按钮上的 Enter 留给按钮
      if(pop && !pop.hidden) return;
      if(e.key !== 'Tab' && e.key !== 'Enter') return;
      e.preventDefault();
      if(!MM.sel){                       // 还没选节点：从根节点开始长第一个分支
        if(MM.root) mmAddChild(MM.root.i);
        return;
      }
      if(e.key === 'Tab') mmAddChild(MM.sel);
      else mmAddSibling(MM.sel);
    }, true);
  }
}
/* ---------- 导出：图片 / 矢量 / PDF / 大纲 ---------- */
function mmExportName(){
  const n = noteById(MM.noteId);
  return String((n && n.title) || '思维导图').replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').trim().slice(0, 60) || '思维导图';
}
function mmSaveBlob(name, blob){
  const a = document.createElement('a');
  const u = URL.createObjectURL(blob);
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}
/* 导出专用：整棵树重排一次（不受屏幕视口、缩放平移、折叠状态影响）。
   屏幕上那份 SVG 被容器裁过、还带着缩放平移，直接克隆出来只能得到「一屏」，
   所以导出永远按数据重建：全部节点展开 + 完整尺寸。 */
function mmExportGraph(){
  if(!MM.root || !MM.lay) return null;
  const cp = n => ({
    i:n.i, label:n.label, raw:n.raw, done:n.done, text:n.text,
    depth:n.depth, br:n.br == null ? -1 : n.br, kind:n.kind,
    children:n.children.map(cp), collapsed:false, w:0, x:0, y:0
  });
  const root = cp(MM.root);
  const lay = mmLayout(root);
  const bak = { root: MM.root, lay: MM.lay, sel: MM.sel };
  let xml = '';
  try{
    MM.root = root; MM.lay = lay; MM.sel = 0;   // sel=0：导出不带选中虚线框
    xml = mmSvgString();
  }finally{
    MM.root = bak.root; MM.lay = bak.lay; MM.sel = bak.sel;
  }
  if(!xml) return null;
  return { xml, w: Math.max(1, Math.ceil(lay.width)), h: Math.max(1, Math.ceil(lay.height)) };
}
function mmSvgMarkup(){
  const g = mmExportGraph();
  return g ? '<?xml version="1.0" encoding="UTF-8"?>\n' + g.xml : '';
}
/* 手机 canvas 单边/总面积都有硬上限，超了会被悄悄裁掉一截。
   按设备给一个保守上限，宁可降一点分辨率也要保证整张图都在。 */
function mmCanvasCap(){
  const phone = (typeof mmIsPhone === 'function' && mmIsPhone())
    || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  return phone ? { side: 4096, area: 12e6 } : { side: 16384, area: 96e6 };
}
function mmFitScale(w, h, want){
  const cap = mmCanvasCap();
  const hard = Math.min(want, cap.side / w, cap.side / h, Math.sqrt(cap.area / (w * h)));
  return Math.max(0.15, hard);   // 宁可小一点，也不能超出上限被裁掉
}
/* 整张图 → canvas：PNG 与 PDF 共用（分带绘制，手机上一次画几千像素高会丢内容） */
function mmRasterize(k, cb){
  const g = mmExportGraph();
  if(!g){ toast('还没有可导出的内容'); return; }
  const scale = mmFitScale(g.w, g.h, k);
  const cw = Math.max(1, Math.round(g.w * scale));
  const ch = Math.max(1, Math.round(g.h * scale));
  const url = URL.createObjectURL(new Blob([g.xml], { type:'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    let cv = null, ctx = null;
    try{
      cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      ctx = cv.getContext('2d');
    }catch(e){ ctx = null; }
    if(!ctx || !cv.width || !cv.height){
      URL.revokeObjectURL(url);
      toast('图太大了，换 SVG 导出更稳');
      return;
    }
    ctx.fillStyle = MM.c.bg;
    ctx.fillRect(0, 0, cw, ch);
    const band = 1200;                        // 目标坐标里每次最多画 1200px 高
    for(let y = 0; y < ch; y += band){
      const dh = Math.min(band, ch - y);
      const sy = y / scale, sh = dh / scale;
      ctx.drawImage(img, 0, sy, g.w, sh, 0, y, cw, dh);
    }
    URL.revokeObjectURL(url);
    cb(cv, { w: g.w, h: g.h, scale });
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('导出失败，可改用 SVG'); };
  img.src = url;
}
function mmExportPng(){
  mmRasterize(2, cv => {
    cv.toBlob(b => {
      if(!b){ toast('导出失败，可改用 SVG'); return; }
      mmSaveBlob(mmExportName() + '.png', b);
      toast('已导出 PNG（完整导图）');
    }, 'image/png');
  });
}
function mmExportSvg(){
  const xml = mmSvgMarkup();
  if(!xml){ toast('还没有可导出的内容'); return; }
  mmSaveBlob(mmExportName() + '.svg', new Blob([xml], { type:'image/svg+xml;charset=utf-8' }));
  toast('已导出 SVG（完整导图），Figma / Illustrator 里还能继续编辑');
}
/* 极简 PDF：单页塞一张完整 JPEG，不依赖任何第三方库 */
function mmPdfBlob(jpegDataUrl, pxW, pxH, k){
  const bin = atob(String(jpegDataUrl).split(',')[1] || '');
  const img = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) img[i] = bin.charCodeAt(i);
  // 按实际倍率折算成 96dpi 下的 pt：px / k * 72 / 96
  const kk = k > 0 ? k : 2;
  const W = +(pxW / kk * 0.75).toFixed(2), H = +(pxH / kk * 0.75).toFixed(2);
  const parts = [];
  let len = 0;
  const put = s => {
    const b = new Uint8Array(s.length);
    for(let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255;
    parts.push(b); len += b.length;
  };
  const offs = [];
  const obj = (num, head, stream) => {
    offs[num] = len;
    put(num + ' 0 obj\n' + head + '\n');
    if(stream){ put('stream\n'); parts.push(stream); len += stream.length; put('\nendstream\n'); }
    put('endobj\n');
  };
  put('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  obj(4, '<< /Type /XObject /Subtype /Image /Width ' + pxW + ' /Height ' + pxH
        + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>', img);
  const content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
  const cb = new Uint8Array(content.length);
  for(let i = 0; i < content.length; i++) cb[i] = content.charCodeAt(i) & 255;
  obj(5, '<< /Length ' + content.length + ' >>', cb);
  const xref = len;
  put('xref\n0 6\n0000000000 65535 f \n');
  for(let i = 1; i <= 5; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  put('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type:'application/pdf' });
}
function mmExportPdf(){
  mmRasterize(2, (cv, m) => {
    mmSaveBlob(mmExportName() + '.pdf',
      mmPdfBlob(cv.toDataURL('image/jpeg', 0.92), cv.width, cv.height, m && m.scale));
    toast('已导出 PDF（完整导图，单页）');
  });
}
/* 大纲：只取文字层，行内 Markdown 记号已经清过 */
function mmOutlineLines(){
  const out = [];
  (function walk(n, lv){
    const text = String(n.label == null ? '' : n.label).trim();
    if(text) out.push({ lv, text });
    n.children.forEach(c=>walk(c, lv + 1));
  })(MM.root, 0);
  return out;
}
function mmExportMd(){
  if(!MM.root){ toast('还没有可导出的内容'); return; }
  const lines = mmOutlineLines();
  if(!lines.length){ toast('还没有可导出的内容'); return; }
  const txt = ['# ' + lines[0].text]
    .concat(lines.slice(1).map(x=>'  '.repeat(Math.max(0, x.lv - 1)) + '- ' + x.text))
    .join('\n') + '\n';
  mmSaveBlob(mmExportName() + '.md', new Blob([txt], { type:'text/markdown;charset=utf-8' }));
  toast('已导出 Markdown 大纲');
}
function mmExportOpml(){
  if(!MM.root){ toast('还没有可导出的内容'); return; }
  const node = n => '<outline text="' + mmXml(n.label || '') + '">' + n.children.map(node).join('') + '</outline>';
  const txt = '<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0"><head><title>'
    + mmXml(mmExportName()) + '</title></head><body>' + node(MM.root) + '</body></opml>\n';
  mmSaveBlob(mmExportName() + '.opml', new Blob([txt], { type:'text/x-opml;charset=utf-8' }));
  toast('已导出 OPML，XMind / 幕布 / OmniOutliner 都能导入');
}
function mmExportMm(){
  if(!MM.root){ toast('还没有可导出的内容'); return; }
  const node = n => '<node TEXT="' + mmXml(n.label || '') + '">' + n.children.map(node).join('') + '</node>';
  const txt = '<map version="1.0.1">' + node(MM.root) + '</map>\n';
  mmSaveBlob(mmExportName() + '.mm', new Blob([txt], { type:'application/x-freemind;charset=utf-8' }));
  toast('已导出 FreeMind 脑图文件');
}

      b.onclick = () => { MM.uiTab = b.dataset.mmtab; mmPaintStyleGrid(); };
    });
    if(!window._mmStyleOut){
      window._mmStyleOut = true;
      document.addEventListener('mousedown', e => {
        const pop = document.getElementById('mmStylePop');
        if(!pop || pop.hidden) return;
        if(pop.contains(e.target)) return;
        if(e.target.closest && e.target.closest('#mmStyleBtn')) return;
        mmToggleStyle(false);
      }, true);
    }
    ov.querySelector('#mmFit').onclick = () => mmFit();
    ov.querySelector('#mmExpand').onclick = () => { mmSetAll(MM.root, false); mmRerender(true); };
    ov.querySelector('#mmFold').onclick = () => {
      mmSetAll(MM.root, false);
      (function w(x){ if(x.depth >= 2 && x.children.length) x.collapsed = true; x.children.forEach(w); })(MM.root);
      mmRerender(true);
    };
    ov.querySelector('#mmList').onclick = e => {
      MM.withList = !MM.withList;
      e.currentTarget.classList.toggle('on', MM.withList);
      mmRefresh(true);
    };
    ov.querySelector('#mmExportBtn').onclick = e => { e.stopPropagation(); openMmExportMenu(e.currentTarget); };
    ov.querySelectorAll('[data-mmz]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.mmz;
        const box = $('#mmCanvas');
        if(!box || !MM.lay) return;
        if(k === 'fit') return mmFit();
        mmZoomAt(k === 'in' ? 1.2 : 1/1.2, box.clientWidth / 2, box.clientHeight / 2);
      };
    });
    ov.querySelectorAll('[data-mme]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.mme;
        if(k === 'undo') return mmUndo();
        if(k === 'dup') return mmDupOutline();
        const idx = MM.sel;
        if(!idx){ toast('先在导图里点一个节点'); return; }
        if(k === 'child') return mmAddChild(idx);
        if(k === 'sib') return mmAddSibling(idx);
        if(k === 'rename') return mmStartRename(idx);
        if(k === 'up') return mmMove(idx, -1);
        if(k === 'down') return mmMove(idx, 1);
        if(k === 'del') return mmDelete(idx);
      };
    });
    ov.querySelector('#mmDemo').onclick = () => {
      const note = noteById(MM.noteId);
      if(!note) return;
      const demo = '- 第一部分：先把要点写成条目\n  - 每条一行，越短越好\n  - 想分叉就按 Tab 缩进\n- 第二部分：结构自然会出来\n  - 缩进一级就是子节点\n  - 同一级写在同样的缩进\n- 第三部分：右键或点节点可以折叠';
      note.body = (note.body ? note.body.replace(/\s*$/, '') + '\n\n' : '') + demo;
      note.updatedAt = Date.now();
      save(); renderAll(true);
      mmRefresh(true);
      toast('已插入示例大纲，可以直接改');
    };
    mmBind();
  }
  if(MM.noteId !== n.id){ MM.sel = 0; MM.undo.length = 0; mmKpClose(); }
  MM.noteId = n.id;
  ov.classList.add('open');
  mmRefresh(true);
  mmWinBind();
  mmWinRestore();
}

(async function boot(){
  // IndexedDB 恢复：localStorage 可能因 5MB 上限写失败而停留在旧数据，两边谁新用谁
  try{
    const fromIdb = await idbGet('state');
    let lsS = null;
    try{ const raw = localStorage.getItem(LS_KEY); if(raw) lsS = JSON.parse(raw); }catch(e){}
    if(fromIdb && fromIdb.notes && (!lsS || !lsS.notes || (fromIdb._savedAt||0) >= (lsS._savedAt||0))){
      S = normalizeState(fromIdb);
      persistLocal();   // 回写 localStorage 镜像，下次冷启动还能快速同步加载
    }
  }catch(e){}
  paintRowIcons();
  const qs = new URLSearchParams(location.search);
  const vParam = qs.get('view');
  if(vParam && ['notes','media','graph'].includes(vParam)){ S.view = vParam; trashView=false; }
  const tParam = qs.get('theme');
  if(tParam==='dark' || tParam==='light'){ S.theme = tParam; }
  applyTheme();
  // URL 里的 n= 参数
  const nParam = qs.get('n');
  if(nParam && noteById(nParam) && !noteById(nParam).trashed){
    S.active = nParam; if(!S.tabs.includes(nParam)) S.tabs.push(nParam);
  } else if(qs.get('new')==='1'){ newNote(); }
  renderAll();
  if(qs.get('mode')==='edit') setTimeout(()=>setMode('source'), 60);
  if(qs.get('mode')==='preview') setTimeout(()=>setMode('preview'), 60);
  if(qs.get('mode')==='live') setTimeout(()=>setMode('live'), 60);
  if(qs.get('cmd')==='1') setTimeout(()=>openPalette(), 60);
  if(qs.get('sync')==='1') setTimeout(()=>openSyncPanel(), 60);
  // 已有密码时后台安静同步一次
  if(isConnected()){
    setTimeout(async ()=>{
      if(!SYNC.token && SYNC.key){
        try{ await doAuth(SYNC.account, SYNC.key, false); }
        catch(e){ SYNC.state='error'; SYNC.error=e.message||'登录失败'; renderDock(); return; }
      }
      syncNow({rerender:true});
      icsPullSources(true);            // 账号里的日历订阅源，换设备后自动补齐
      icsPullDone();                   // 哪些日历事件已经勾掉，也跟着账号走
    }, 350);
  }
})();

/* ---- 版本水印 ----
   常驻显示本页构建版本；正式域名下再对比 GitHub main 上的 version.js，
   若不一致说明生产部署被历史 commit 覆盖，直接给出提示与一键刷新。 */
(function(){
  const el = document.getElementById('buildTag');
  if(!el) return;
  const b = window.IVY_BUILD || { id:'?', at:'' };
  let state = '未检测';
  const paint = (html, warn)=>{ el.innerHTML = html; el.classList.toggle('warn', !!warn); };
  paint(`<span class="bd">${esc(b.id)}</span><span>·</span><span>${esc(b.at)}</span>`);
  el.title = `构建 ${b.id} · ${b.at}\n点击复制版本信息`;
  el.onclick = ()=>{
    const info = `随手笔记 · 构建 ${b.id} (${b.at}) · 线上检测：${state}`;
    if(navigator.clipboard) navigator.clipboard.writeText(info).then(()=>toast('版本信息已复制'), ()=>toast(info));
    else toast(info);
  };
  if(location.protocol !== 'https:' || !/(\.139t\.cn|\.163t\.cn|\.xhxh\.vip)$/.test(location.hostname)) return;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 4500);
  fetch('https://raw.githubusercontent.com/httcup/notes/main/public/version.js?t=' + Date.now(),
        { cache:'no-store', signal:ctrl.signal })
    .then(r=>{ if(!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(txt=>{
      clearTimeout(timer);
      const m = txt.match(/id\s*:\s*'([^']+)'/);
      if(!m) return;
      const num = s => Number(String(s).replace(/\D/g, '')) || 0;
      if(m[1] === b.id){
        state = '已是最新';
        el.title = `构建 ${b.id} · ${b.at} · 已是最新版本\n点击复制版本信息`;
        return;
      }
      // 本页比源码版本文件还新：说明只是部署时没同步 version.js，不算线上落后，别误报
      if(num(m[1]) < num(b.id)){
        state = '已是最新';
        el.title = `构建 ${b.id} · ${b.at} · 已是最新（源码版本文件为 ${m[1]}）\n点击复制版本信息`;
        return;
      }
      state = `落后（线上 ${b.id} / 最新 ${m[1]}）`;
      paint(`<span>⚠ 线上版本落后 ${esc(b.id)} → ${esc(m[1])}</span><button class="rf" id="bdRefresh" type="button">刷新</button>`, true);
      el.title = '检测到线上运行的不是最新版本，可能又被旧部署覆盖；点「刷新」重新加载。';
      const rf = document.getElementById('bdRefresh');
      if(rf) rf.onclick = e=>{
        e.stopPropagation();
        const u = new URL(location.href); u.searchParams.set('_v', Date.now());
        location.href = u.toString();
      };
    })
    .catch(()=>{ clearTimeout(timer); state = '校验不可用'; });
})();

/* ============ 番茄钟：专注 25 / 休息 5，可自调，刷新不丢 ============ */
const POMO_KEY = 'ivy.pomo.v1';
const POMO_BG_H = 92; // 红色水面：fill 矩形向下平移的距离（0=整颗红，POMO_BG_H=红全没了）
function pomoDefaults(){
  return { focus:25, rest:5, phase:'focus', running:false, endAt:0,
           remain:25 * 60000, auto:true, done:0, day:new Date().toDateString() };
}
let POMO = pomoDefaults();
try{
  const raw = JSON.parse(localStorage.getItem(POMO_KEY) || '{}');
  if(raw && typeof raw === 'object') POMO = Object.assign(POMO, raw);
}catch(e){}
if(POMO.day !== new Date().toDateString()){
  POMO.day = new Date().toDateString(); POMO.done = 0;
}
function pomoSave(){ try{ localStorage.setItem(POMO_KEY, JSON.stringify(POMO)); }catch(e){} }
function pomoTotal(){ return Math.max(1, Number(POMO[POMO.phase]) || 25) * 60000; }
function pomoLeft(){ return POMO.running ? Math.max(0, POMO.endAt - Date.now()) : Math.max(0, POMO.remain); }
const pomoPad = n => String(n).padStart(2, '0');
function pomoPaint(){
  const el = $('#pomo'); if(!el) return;
  const bg = $('#pomoBg'); if(bg) bg.style.display = POMO.running ? '' : 'none';
  const left = pomoLeft(), total = pomoTotal(), sec = Math.ceil(left / 1000);
  const txt = pomoPad(Math.floor(sec / 60)) + ':' + pomoPad(sec % 60);
  const isFocus = POMO.phase === 'focus';
  $('#pomoBgTime').textContent = txt;
  $('#pomoBgLabel').textContent = (isFocus ? '专注' : '休息') + (POMO.running ? '中' : ' · 暂停');
  const fillEl = $('#pomoBgFill');
  if(fillEl){
    /* 像沙漏：一开始整颗红，时间越走红色水位越低，倒计时归零时红全没了。
       （rect 整体往下平移，被番茄轮廓裁掉上半截，剩下的就是「剩下的红」） */
    const remain = Math.min(1, Math.max(0, left / total));
    fillEl.style.transform = 'translateY(' + ((1 - remain) * POMO_BG_H).toFixed(1) + 'px)';
    // 水位落到数字下面后，数字转深色，不然白字压在浅底上看不清
    bg.classList.toggle('filled', remain >= 0.62);
    // 顶部那颗小番茄同步一条水位，点开面板前也能看出还剩多少
    const paFill = document.getElementById('paPomoFill');
    if(paFill) paFill.style.transform = 'translateY(' + ((1 - remain) * POMO_BG_H).toFixed(1) + 'px)';
  }
  $('#pomoNow').textContent = txt;
  $('#pomoToggle').textContent = POMO.running ? '暂停'
    : (left < total ? '继续' : (isFocus ? '开始专注' : '开始休息'));
  el.classList.toggle('rest', !isFocus);
  el.classList.toggle('running', !!POMO.running);
  const pb = $('#paPomo'); if(pb) pb.classList.toggle('on', el.classList.contains('open'));
  const f = $('#pomoFocus'), r = $('#pomoRest'), a = $('#pomoAuto');
  if(f && document.activeElement !== f) f.value = POMO.focus;
  if(r && document.activeElement !== r) r.value = POMO.rest;
  if(a) a.checked = !!POMO.auto;
  el.querySelectorAll('[data-pp]').forEach(b => b.classList.toggle('on', b.dataset.pp === POMO.phase));
  $('#pomoStat').textContent = '今天完成 ' + (POMO.done || 0) + ' 个番茄 · 改时长点上面';
}
function pomoBeep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.14, ctx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .85);
    o.start(); o.stop(ctx.currentTime + .86);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){}
}
function pomoFinish(){
  const was = POMO.phase;
  if(was === 'focus') POMO.done = (POMO.done || 0) + 1;
  POMO.phase = was === 'focus' ? 'rest' : 'focus';
  POMO.remain = pomoTotal();
  POMO.running = !!POMO.auto;
  POMO.endAt = POMO.running ? Date.now() + POMO.remain : 0;
  const msg = was === 'focus' ? ('专注完成，休息 ' + POMO.rest + ' 分钟') : ('休息结束，专注 ' + POMO.focus + ' 分钟');
  toast(msg);
  try{ fireNotify('番茄钟 · ' + msg, POMO.auto ? '下一阶段已自动开始' : '点一下开始下一阶段', '', 'ivy-pomo').catch(()=>{}); }catch(e){}
  pomoBeep(); pomoSave(); pomoPaint();
}
function pomoTick(){
  if(POMO.running && pomoLeft() <= 0){ pomoFinish(); return; }
  pomoPaint();
}
function pomoStart(){ POMO.running = true; POMO.endAt = Date.now() + POMO.remain; pomoSave(); pomoPaint(); }
function pomoPause(){
  POMO.remain = Math.max(0, POMO.endAt - Date.now());
  POMO.running = false; POMO.endAt = 0; pomoSave(); pomoPaint();
}
function pomoReset(){ POMO.running = false; POMO.endAt = 0; POMO.remain = pomoTotal(); pomoSave(); pomoPaint(); }
function pomoPhase(p){ if(p === POMO.phase) return; POMO.phase = p; pomoReset(); }
function pomoSkip(){
  POMO.phase = POMO.phase === 'focus' ? 'rest' : 'focus';
  pomoReset(); toast('已跳到' + (POMO.phase === 'focus' ? '专注' : '休息'));
}
function pomoSet(k, v){
  const max = k === 'focus' ? 180 : 60;
  POMO[k] = Math.max(1, Math.min(max, Math.round(Number(v) || 1)));
  if(POMO.phase === k && !POMO.running) POMO.remain = pomoTotal();
  pomoSave(); pomoPaint();
}
(function bindPomo(){
  const el = $('#pomo'); if(!el) return;
  $('#pomoClose').onclick = e => { e.stopPropagation(); el.classList.remove('open'); pomoPaint(); };
  $('#pomoToggle').onclick = e => { e.stopPropagation(); POMO.running ? pomoPause() : pomoStart(); };
  el.querySelectorAll('[data-pp]').forEach(b => b.onclick = ()=>pomoPhase(b.dataset.pp));
  el.querySelectorAll('[data-pa]').forEach(b => b.onclick = ()=>{
    const parts = b.dataset.pa.split(':');
    pomoSet(parts[0], (Number(POMO[parts[0]]) || 1) + Number(parts[1]));
  });
  [['focus','#pomoFocus'],['rest','#pomoRest']].forEach(pair=>{
    const inp = $(pair[1]);
    if(inp){ inp.onchange = ()=>pomoSet(pair[0], inp.value); inp.onblur = ()=>pomoSet(pair[0], inp.value); }
  });
  $('#pomoAuto').onchange = e => { POMO.auto = e.target.checked; pomoSave(); };
  $('#pomoReset').onclick = ()=>{ pomoReset(); toast('本轮已重置'); };
  $('#pomoSkip').onclick = ()=>pomoSkip();
  /* 顶部番茄钟按钮每次 renderEditor 都会重建，用事件委托；点外面收起面板 */
  document.addEventListener('click', e => {
    const hit = e.target && e.target.closest && e.target.closest('#paPomo');
    if(hit){ el.classList.toggle('open'); pomoPaint(); return; }
    if(e.target && e.target.closest && e.target.closest('#pomo, #popover')) return;
    if(el.classList.contains('open')){ el.classList.remove('open'); pomoPaint(); }
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') pomoTick(); });
  pomoTick(); setInterval(pomoTick, 250);
})();

/* ===== 手机底部浮条：Home 折叠笔记本栏 / 设置 / 新建笔记 ===== */
(function(){
  const bar = document.getElementById('mBar');
  if(!bar) return;
  const home = document.getElementById('mHome');
  const setBtn = document.getElementById('mSet');
  const addBtn = document.getElementById('mNew');
  const inSet = ()=> document.body.classList.contains('set-open');
  const syncHome = ()=>{
    const so = inSet();
    if(home) home.classList.toggle('on', so ? false : !!S.shelfOpen);
    if(setBtn){
      setBtn.classList.toggle('on', so);
      const label = so ? '关闭设置' : '设置';
      setBtn.title = label; setBtn.setAttribute('aria-label', so ? '关闭设置' : '打开设置');
    }
    if(addBtn){
      const cal = (S.view === 'calendar');
      const label = cal ? '新建日程' : (so ? '新建笔记并关闭设置' : '新建笔记');
      addBtn.title = label; addBtn.setAttribute('aria-label', label);
      addBtn.classList.toggle('is-cal', cal);
    }
  };
  // 设置浮层打开 / 关闭时也要重算（openSettings / closeSettings 会调）
  window.syncMobileBar = syncHome;
  if(home) home.onclick = ()=>{
    if(inSet()) closeSettings();
    toggleShelf(); syncHome();
  };
  if(setBtn) setBtn.onclick = ()=>{
    if(inSet()){ try{ closeSettings(); }catch(e){} }
    else { try{ openSettings(); }catch(e){} }
    syncHome();
  };
  if(addBtn) addBtn.onclick = ()=>{
    if(inSet()){ try{ closeSettings(); }catch(e){} }
    // 日历页：右下角这颗加号是「新建日程」，不是新建笔记
    if((S.view || 'notes') === 'calendar'){
      try{
        const t = new Date();
        const y = CAL.y || t.getFullYear(), m = CAL.m || (t.getMonth() + 1);
        const sameMonth = (y === t.getFullYear() && m === t.getMonth() + 1);
        const day = sameMonth ? t.getDate() : 1;
        openCalEventForm(null, y * 10000 + m * 100 + day);
      }catch(e){ toast('打不开新建日程'); }
      syncHome();
      return;
    }
    try{ newNote(); }catch(e){}
    if(window.innerWidth <= 640) document.body.classList.add('m-read');
    syncHome();
  };
  // 抽屉被别处关掉（点笔记、点空白、返回列表）时，Home 的高亮也跟着变
  const sh = document.querySelector('.shelf');
  if(sh && window.MutationObserver){
    new MutationObserver(syncHome).observe(sh, { attributes:true, attributeFilter:['class'] });
  }
  // 手机上顶部的「全部笔记 15」也能当展开按钮：手指够得到，
  // 点一下就把折叠的笔记本栏（主目录）抽出来，和 Home 等价；桌面上保持原样（点了没反应）
  const openFromTitle = ()=>{
    if(window.innerWidth > 640) return;
    if(inSet()){ try{ closeSettings(); }catch(e){} }
    if(!S.shelfOpen) toggleShelf();
    syncHome();
  };
  ['nlTitle','nlCount'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onclick = openFromTitle;
  });
  syncHome();
})();
