/* ---- HTML → Markdown（导入用，够用的子集：标题/段落/列表/引用/代码/表格/行内样式/图片） ---- */
function htmlToMd(html){
  const doc = new DOMParser().parseFromString(String(html||''),'text/html');
  const root = doc.querySelector('article') || doc.querySelector('main') || doc.body;
  if(!root) return '';
  root.querySelectorAll('script,style,noscript,link,meta,nav,header,footer,aside,form,iframe').forEach(x=>x.remove());
  root.querySelectorAll(':scope > .meta').forEach(x=>x.remove());   // 自己导出的日期行

  const norm = s => String(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim();
  const BLOCK = /^(P|DIV|SECTION|ARTICLE|UL|OL|LI|TABLE|PRE|BLOCKQUOTE|H[1-6]|HR|FIGURE)$/;

  function inline(node){
    if(node.nodeType === 3) return node.nodeValue.replace(/\u00a0/g,' ');
    if(node.nodeType !== 1) return '';
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return '';
    const inner = [...node.childNodes].map(inline).join('');
    const core = inner.trim();
    switch(t){
      case 'BR': return '\n';
      case 'STRONG': case 'B': return core ? `**${core}**` : inner;
      case 'EM': case 'I': return core ? `*${core}*` : inner;
      case 'DEL': case 'S': case 'STRIKE': return core ? `~~${core}~~` : inner;
      case 'U': return inner;
      case 'MARK': {
        const cls = (typeof node.className === 'string' ? node.className : '');
        const mcls = cls.match(/hl-(yellow|pink|blue|purple|gray)/);
        let color = mcls ? mcls[1] : '';
        if(!color){
          const bg = (node.getAttribute('style')||'').match(/background(?:-color)?\s*:\s*([^;]+)/i);
          const v = bg ? bg[1].toLowerCase() : '';
          if(/fdf0c5|253,\s*240,\s*197/.test(v)) color = 'yellow';
          else if(/fce2e5|252,\s*226,\s*229/.test(v)) color = 'pink';
          else if(/dbeafa|219,\s*234,\s*250/.test(v)) color = 'blue';
          else if(/ebe2f8|235,\s*226,\s*248/.test(v)) color = 'purple';
          else if(/e9ecef|233,\s*236,\s*239/.test(v)) color = 'gray';
        }
        return core ? `==${core}==${color ? `{.${color}}` : ''}` : inner;
      }
      case 'CODE': return core ? '`' + core + '`' : inner;
      case 'A': {
        const href = node.getAttribute('href') || '';
        const txt = core || href;
        if(!href || /^(javascript:|#)/i.test(href)) return txt;
        return `[${txt}](${href})`;
      }
      case 'IMG': {
        const src = node.getAttribute('src') || '';
        const alt = node.getAttribute('alt') || '';
        return src ? `![${alt}](${src})` : '';
      }
      default: return inner;
    }
  }
  const inlineOf = el => norm([...el.childNodes].map(inline).join(''));

  const blocks = [];
  const push = s => { const v = String(s||'').replace(/\n{3,}/g,'\n\n').trim(); if(v) blocks.push(v); };

  function listMd(el, indent){
    const ordered = el.tagName === 'OL';
    let idx = 0;
    const rows = [];
    [...el.children].filter(c=>c.tagName==='LI').forEach(li=>{
      idx++;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
      const cb = clone.querySelector('input[type=checkbox]');
      const checked = !!(cb && (cb.hasAttribute('checked') || cb.checked));
      if(cb) cb.remove();
      const body = norm([...clone.childNodes].map(inline).join(''));
      const mark = cb ? `- [${checked?'x':' '}] ` : (ordered ? `${idx}. ` : '- ');
      rows.push(' '.repeat(indent) + mark + body);
      li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub=>{
        rows.push(listMd(sub, indent + 2));
      });
    });
    return rows.join('\n');
  }
  function tableMd(el){
    const rows = [...el.querySelectorAll('tr')];
    if(!rows.length) return '';
    const cellsOf = tr => [...tr.children].map(td=>norm(inlineOf(td)).replace(/\|/g,'\\|'));
    const head = cellsOf(rows[0]);
    const body = rows.slice(1).map(cellsOf);
    const out = [`| ${head.join(' | ')} |`, `| ${head.map(()=>'---').join(' | ')} |`];
    body.forEach(r=>out.push(`| ${r.join(' | ')} |`));
    return out.join('\n');
  }

  function walk(node, indent){
    if(node.nodeType === 3){
      const v = norm(node.nodeValue);
      if(v) push(v);
      return;
    }
    if(node.nodeType !== 1) return;
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return;
    if(/^H[1-6]$/.test(t)){ push('#'.repeat(+t[1]) + ' ' + inlineOf(node)); return; }
    if(t === 'HR'){ push('---'); return; }
    if(t === 'PRE'){
      const code = node.querySelector('code');
      const cls = code ? (typeof code.className === 'string' ? code.className : '') : '';
      const lang = (cls.match(/lang-([\w-]+)/)||[])[1] || '';
      const text = (code || node).textContent.replace(/\n+$/,'');
      push('```' + lang + '\n' + text + '\n```');
      return;
    }
    if(t === 'BLOCKQUOTE'){
      const inner = [];
      const save = blocks.length;
      [...node.childNodes].forEach(c=>walk(c, indent));
      const got = blocks.splice(save);
      got.forEach(g=>inner.push(g.split('\n').map(l=>'> ' + l).join('\n')));
      push(inner.join('\n>\n'));
      return;
    }
    if(t === 'UL' || t === 'OL'){ push(listMd(node, indent)); return; }
    if(t === 'TABLE'){ const tb = tableMd(node); if(tb) push(tb); return; }
    if(t === 'IMG'){ const s = inline(node); if(s) push(s); return; }
    if(t === 'P' || t === 'DIV' || t === 'SECTION' || t === 'ARTICLE' || t === 'FIGURE' || t === 'FIGCAPTION'){
      const hasBlock = [...node.children].some(c=>BLOCK.test(c.tagName));
      if(hasBlock){ [...node.childNodes].forEach(c=>walk(c, indent)); }
      else { const v = inlineOf(node); if(v) push(v); }
      return;
    }
    if(t === 'BR'){ return; }
    if([...node.children].some(c=>BLOCK.test(c.tagName))){
      [...node.childNodes].forEach(c=>walk(c, indent));
    } else {
      const v = inlineOf(node);
      if(v) push(v);
    }
  }

  [...root.childNodes].forEach(n=>walk(n, 0));
  let md = blocks.join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
  // 正文开头的 H1 常与文件名重复，交给 importDoc 决定标题，这里先原样保留
  return md;
}

function importDoc(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.md,.markdown,.txt,.html,.htm';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const isHtml = /\.html?$/i.test(f.name);
    const r = new FileReader();
    r.onload = ()=>{
      const text = String(r.result);
      let title = f.name.replace(/\.\w+$/,'');
      let body = '';
      if(isHtml){
        const doc = new DOMParser().parseFromString(text,'text/html');
        const t = (doc.querySelector('title') && doc.querySelector('title').textContent || '').trim();
        const h1 = (doc.querySelector('h1') && doc.querySelector('h1').textContent || '').trim();
        title = t || h1 || title;
        body = htmlToMd(text);
        // 去掉和标题重复的首个 H1
        body = body.replace(/^#\s+.*\n?/, m => {
          const h = m.replace(/^#\s+/,'').trim();
          return h && h === title ? '' : m;
        }).trim();
      }else{
        const first = text.split('\n').find(l=>/^#\s+/.test(l));
        if(first) title = first.replace(/^#\s+/,'').trim();
        body = text.replace(/^#\s+.*\n/,'');
      }
      const nn = newNote();
      nn.title = title;
      nn.body = body;
      renderAll(); save();
      toast('已导入「' + title + '」');
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ========== 菜单 ========== */
/* 锚点可能在打开菜单的过程中被重绘掉（同步、切换笔记都会 renderAll），
   这时 getBoundingClientRect 全是 0，菜单会飞左上角 —— 依次找回：同名元素 → 上次菜单位置 → 鼠标位置 */
let LAST_POINTER = { x: window.innerWidth - 80, y: 64 };
document.addEventListener('mousedown', e=>{ LAST_POINTER = { x:e.clientX, y:e.clientY }; }, true);
function liveAnchor(anchor, id){
  if(anchor && anchor.isConnected) return anchor;
  const again = id ? document.getElementById(id) : null;
  if(again) return again;
  // 找不到就地造一个不可见的锚点，位置取上次菜单展开处
  const ghost = document.createElement('div');
  const r = $('#popover')._lastRect || { left: LAST_POINTER.x - 1, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  ghost.style.cssText = `position:fixed;left:${r.right-2}px;top:${r.bottom}px;width:2px;height:2px;pointer-events:none;opacity:0`;
  document.body.appendChild(ghost);
  setTimeout(()=>ghost.remove(), 30000);
  return ghost;
}
function popover(anchor, items, opts){
  const po = $('#popover');
  let r = null;
  if(anchor && anchor.isConnected) r = anchor.getBoundingClientRect();
  if(!r || (!r.width && !r.height)){
    const again = anchor && anchor.id ? document.getElementById(anchor.id) : null;
    if(again) r = again.getBoundingClientRect();
  }
  if((!r || (!r.width && !r.height)) && po._lastRect) r = po._lastRect;
  if(!r || (!r.width && !r.height)){
    r = { left: LAST_POINTER.x, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  }
  po._lastRect = { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
  /* 菜单开着时，锚点按钮保持选中色（触屏上尤其需要：没有 hover，不然看不出点了哪个） */
  if(anchor && anchor.classList){
    if(po._anchor && po._anchor !== anchor) po._anchor.classList.remove('on');
    anchor.classList.add('on');
    po._anchor = anchor;
  }
  po.innerHTML = items.map((it,idx)=>{
    if(it[0]==='-') return '<div class="po-sep"></div>';
    if(it[0]==='#') return it[1];
    return `<button class="po-item ${it[2]||''}" data-i="${idx}">${it[3]?ic(it[3]):''}<span>${esc(it[0])}</span>${it[1]?`<span class="po-key">${it[1]}</span>`:''}</button>`;
  }).join('');
  po.classList.add('open');
  const pw = po.offsetWidth, ph = po.offsetHeight;
  const wantLeft = opts && opts.align === 'left' ? r.left : r.right - pw;
  po.style.left = Math.min(Math.max(12, wantLeft), window.innerWidth-pw-12)+'px';
  po.style.top = Math.min(r.bottom+6, window.innerHeight-ph-12)+'px';
  po.querySelectorAll('[data-i]').forEach(b=>{
    b.onmousedown = ev=>ev.preventDefault();   // 别把正文的选区/焦点抢走
    b.onclick = ()=>{
      const it = items[+b.dataset.i];
      po.classList.remove('open');
      if(po._anchor){ po._anchor.classList.remove('on'); po._anchor = null; }
      if(it[4]) it[4]();
    };
  });
  // 二级菜单会在同一个 #popover 上重绘，先把上一次的外部点击监听摘掉，避免越积越多
  if(po._off) document.removeEventListener('mousedown', po._off);
  const off = (ev)=>{
    if(!po.contains(ev.target)){
      po.classList.remove('open');
      document.removeEventListener('mousedown', off);
      if(po._anchor){ po._anchor.classList.remove('on'); po._anchor = null; }
      if(po._off === off) po._off = null;
    }
  };
  po._off = off;
  setTimeout(()=>{ if(po._off === off) document.addEventListener('mousedown', off); }, 0);
}

  paintPaletteSel();

document.addEventListener('keydown', e=>{
  const meta = e.metaKey || e.ctrlKey;
  const overlayOpen = $('#overlay').classList.contains('open');
  if(overlayOpen){
    if(e.key==='Escape'){ e.preventDefault(); closePalette(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel = Math.min(paletteSel+1, paletteRows.length-1); paintPaletteSel(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel = Math.max(paletteSel-1, 0); paintPaletteSel(); return; }
    if(e.key==='Enter'){ e.preventDefault(); paletteRows[paletteSel]?.f(); return; }
  }
  /* 格式化快捷键：和「Markdown 与快捷键」面板里写的保持一致 */
  if(meta && !e.altKey){
    const code = e.code || '';
    if(e.shiftKey){
      if(code === 'KeyX'){ e.preventDefault(); applyFormat('s'); return; }
      if(code === 'KeyH'){ e.preventDefault(); applyFormat('mark'); return; }
      if(code === 'KeyK'){ e.preventDefault(); applyFormat('wiki'); return; }
      if(code === 'Digit9'){ e.preventDefault(); applyFormat('todo'); return; }
      if(code === 'Digit8'){ e.preventDefault(); applyFormat('ul'); return; }
      if(code === 'Digit7'){ e.preventDefault(); applyFormat('ol'); return; }
    } else {
      if(code === 'KeyB'){ e.preventDefault(); applyFormat('b'); return; }
      if(code === 'KeyI'){ e.preventDefault(); applyFormat('i'); return; }
    }
  } else if(meta && e.altKey){
    const code = e.code || '';
    if(code === 'Digit1'){ e.preventDefault(); applyFormat('h1'); return; }
    if(code === 'Digit2'){ e.preventDefault(); applyFormat('h2'); return; }
    if(code === 'Digit3'){ e.preventDefault(); applyFormat('h3'); return; }
  }
  if(meta && e.key === '/'){ e.preventDefault(); openInsertMenu(document.querySelector('#fmtBar [data-fmt="insert"]')); return; }
  if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(meta && e.key.toLowerCase()==='n'){ e.preventDefault(); newNote(); return; }
  if(meta && e.key==='\\'){ e.preventDefault(); toggleShelf(); return; }
  if(meta && e.shiftKey && e.key.toLowerCase()==='e'){ e.preventDefault(); setMode(curMode()==='source' ? 'live' : 'source'); return; }
  if(meta && e.key.toLowerCase()==='e'){ e.preventDefault(); toggleMode(); return; }
  if(e.altKey && e.key.toLowerCase()==='w'){ e.preventDefault(); if(S.active) closeTab(S.active); return; }
  if(e.key==='Escape'){ $('#popover').classList.remove('open'); closeExportPanel(); closeSlashMenu(); hideSelBar(); if(syncPanelOpen) closeSyncPanel(); }
});

/* ========== 账号与云同步 ========== */
const SYNC_STORE = 'ivy.sync';
const SYNC = { token:'', account:'', key:'', state:'off', last:0, error:'' };
try{
  const raw = localStorage.getItem(SYNC_STORE);
  if(raw){
    const s = JSON.parse(raw);
    SYNC.token = s.token||''; SYNC.account = s.account||''; SYNC.key = s.key||''; SYNC.last = s.last||0;
    if(SYNC.token || SYNC.key) SYNC.state = 'idle';
  }
}catch(e){}
function syncSave(){
  try{
    localStorage.setItem(SYNC_STORE, JSON.stringify({
      token: SYNC.token, account: SYNC.account, key: SYNC.key, last: SYNC.last
    }));
  }catch(e){}
}
const isConnected = ()=> !!(SYNC.token || SYNC.key);
const accountLabel = ()=> SYNC.account || '默认账号';

function syncTip(){
  if(!isConnected()) return '云同步未连接 · 点击设置';
  if(SYNC.state==='busy') return '正在同步…';
  if(SYNC.state==='pending') return '有改动，正在自动保存…';
  if(SYNC.state==='error') return '同步失败：'+(SYNC.error||'网络错误')+' · 点击查看';
  if(SYNC.state==='ok') return '已同步 · '+new Date(SYNC.last).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · '+accountLabel();
  return '已连接 '+accountLabel()+' · 点击立即同步';
}
async function apiCall(path, opts){
  opts = opts || {};
  const send = ()=> fetch(path, {
    method: opts.method || 'GET',
    headers: authHeaders(!!opts.body),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let r = await send();
  let data = await r.json().catch(()=>({}));
  if(r.status === 401 && SYNC.token && SYNC.key){
    if(await relogin()){ r = await send(); data = await r.json().catch(()=>({})); }
  }
  if(!r.ok){ const e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return data;
}
function authHeaders(json){
  const h = json ? {'content-type':'application/json'} : {};
  if(SYNC.token) h.authorization = 'Bearer ' + SYNC.token;
  else if(SYNC.key) h['x-ivy-key'] = SYNC.key;
  return h;
}
let syncBusy = false, syncTimer = null, syncPanelOpen = false;

async function doAuth(account, key, create){
  const r = await fetch('/api/auth', {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({name: account || '', key, create: !!create})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(d.error || '登录失败'); e.status = r.status; throw e; }
  SYNC.token = d.token; SYNC.account = account || ''; SYNC.key = key;
  SYNC.last = 0; SYNC.state = 'idle';
  syncSave();
  return d;
}
async function relogin(){
  if(!SYNC.key) return false;
  try{ await doAuth(SYNC.account, SYNC.key, false); return true; }catch(e){ return false; }
}
async function api(method, body){
  const send = ()=> fetch('/api/sync', {
    method, headers: authHeaders(true), body: body ? JSON.stringify(body) : undefined
  });
  let r = await send();
  let data = await r.json().catch(()=>({}));
  if(r.status === 401 && SYNC.token && SYNC.key){
    if(await relogin()){ r = await send(); data = await r.json().catch(()=>({})); }
  }
  if(!r.ok){ const e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return data;
}
function localPayload(){
  const live = S.notes.map(n=>({
    id:n.id, title:n.title||'', body:n.body||'', notebookId:n.notebookId||null,
    tags:n.tags||[], trashed:!!n.trashed, deleted:!!n.deleted,
    createdAt:n.createdAt||0, updatedAt:n.updatedAt||0
  }));
  // 待删除的笔记以墓碑上传，让云端和其它设备一起消失
  const tombs = (S.pendingDeletes||[]).map(id=>({
    id, title:'', body:'', notebookId:null, tags:[], trashed:true, deleted:true,
    createdAt:0, updatedAt:Date.now()
  }));
  return {
    notes: live.concat(tombs),
    notebooks: S.notebooks.map(nb=>({
      id:nb.id, name:nb.name, open:nb.open!==false,
      deleted:!!nb.deleted, updatedAt:nb.updatedAt||0
    }))
  };
}
function applyRemote(data){
  let changed = false;
  const map = new Map(S.notes.map(n=>[n.id,n]));
  for(const r of (data.notes||[])){
    if(!Array.isArray(r.tags)) r.tags = [];       // 兼容老客户端/老数据
    const cur = map.get(r.id);
    if(!cur){ S.notes.push(r); changed = true; }
    else if((r.updatedAt||0) > (cur.updatedAt||0)){ Object.assign(cur, r); changed = true; }
  }
  const nbm = new Map(S.notebooks.map(n=>[n.id,n]));
  for(const r of (data.notebooks||[])){
    const cur = nbm.get(r.id);
    if(!cur){ S.notebooks.push(Object.assign({deleted:false, updatedAt:0}, r)); changed = true; }
    else {
      const newer = (r.updatedAt||0) > (cur.updatedAt||0);
      const same  = (r.updatedAt||0) === (cur.updatedAt||0);
      const diff  = cur.name!==r.name || cur.open!==r.open || !!cur.deleted!==!!r.deleted;
      if(newer || (same && diff)){ Object.assign(cur, r); changed = true; }
    }
  }
  // 把云端同步过来的标签也记进历史库，之后即使从笔记上摘掉也还能再选
  if(changed){
    const lib = Array.isArray(S.tagLibrary) ? S.tagLibrary : [];
    S.notes.forEach(n=>tagOf(n).forEach(t=>{ if(t && !lib.includes(t)) lib.push(t); }));
    S.tagLibrary = lib;
  }
  return changed;
}
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, S, {media: []}))); }catch(e){}
}
function renderAfterSync(changed, force){
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#doc');
  if((changed || force) && !editing) renderAll();
  else renderDock();
  if(!S.active && !S.tabs.length){
    const first = liveNotes()[0];
    if(first){ S.active = first.id; S.tabs = [first.id]; renderAll(); }
  }
}
let syncDirty = false, syncFails = 0, syncRetryTimer = null;

function scheduleRetry(){
  clearTimeout(syncRetryTimer);
  const delay = Math.min(30000, 1500 * Math.pow(2, Math.min(syncFails, 4)));
  syncRetryTimer = setTimeout(()=>{ syncRetryTimer = null; syncNow(); }, delay);
}

async function syncNow(opts={}){
  if(!isConnected() || syncBusy) return;
  syncBusy = true;
  syncDirty = false;
  const firstTime = !SYNC.last;
  SYNC.state = 'busy'; SYNC.error = ''; renderDock(); updateSyncBadge();
  try{
    if(firstTime){
      // 首次连接：云端已有数据时，丢弃本机示例笔记，避免污染服务器
      const pre = await api('GET');
      if((pre.notes||[]).filter(x=>!x.deleted).length){
        S.notes = S.notes.filter(n=>!n.seed);
        applyRemote(pre);
      }
    }
    const data = await api('POST', localPayload());
    const changed = applyRemote(data);
    S.notes = S.notes.filter(n=>!n.deleted);
    S.pendingDeletes = [];
    SYNC.last = Date.now(); SYNC.state = 'ok'; SYNC.error = '';
    syncFails = 0; clearTimeout(syncRetryTimer); syncRetryTimer = null;
    syncSave();
    renderAfterSync(changed, opts.rerender);
    persistLocal();
  }catch(e){
    SYNC.state = 'error';
    SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
    if(e.status !== 401){ syncFails++; syncDirty = true; scheduleRetry(); }
    renderDock();
  }finally{
    syncBusy = false;
    updateSyncBadge();
    if(syncPanelOpen) paintSyncPanel();
    if(syncDirty && SYNC.state !== 'error'){
      clearTimeout(syncTimer);
      syncTimer = setTimeout(()=>syncNow(), 120);
    }
  }
}
function queueSync(){
  try{ if(!isConnected()) return; }catch(e){ return; }
  syncDirty = true;
  if(SYNC.state !== 'busy'){ SYNC.state = 'pending'; renderDock(); }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 800);
  updateSyncBadge();
}
// 页面要走了：用 keepalive 兜住最后不到 1 秒的改动
function flushSync(){
  if(!isConnected() || syncBusy || !syncDirty) return;
  try{
    fetch('/api/sync', {
      method: 'POST', keepalive: true,
      headers: authHeaders(true),
      body: JSON.stringify(localPayload())
    }).then(()=>{ syncDirty = false; }).catch(()=>{});
  }catch(e){}
}
async function pullRemote(){
  if(!isConnected() || syncBusy || document.hidden) return;
  try{
    const data = await api('GET');
    const changed = applyRemote(data);
    if(changed){ S.notes = S.notes.filter(n=>!n.deleted); renderAfterSync(true, false); persistLocal(); }
    SYNC.state = 'ok'; SYNC.last = Date.now(); syncSave(); renderDock(); updateSyncBadge();
  }catch(e){
    SYNC.state = 'error'; SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
    renderDock(); updateSyncBadge();
  }
}
setInterval(pullRemote, 45000);
document.addEventListener('visibilitychange', ()=>{
  if(!isConnected()) return;
  if(document.hidden) flushSync();
  else pullRemote();
});
window.addEventListener('pagehide', flushSync);

/* ========== 云端媒体（KV / R2） ========== */
let remoteMedia = null;
let mediaLoading = false;
async function loadRemoteMedia(force){
  if(!isConnected()){ remoteMedia = []; return; }
  if(mediaLoading) return;
  if(remoteMedia && !force) return;
  mediaLoading = true;
  try{
    const r = await fetch('/api/media', {headers: authHeaders(false)});
    if(r.ok){
      const d = await r.json();
      remoteMedia = (d.items||[]).map(it=>Object.assign({remote:true}, it));
    } else if(r.status===401){
      remoteMedia = remoteMedia || [];
    }
  }catch(e){ remoteMedia = remoteMedia || []; }
  mediaLoading = false;
}
function allMedia(){
  const remote = (remoteMedia||[]).map(it=>({
    id: it.id, name: it.name, size: it.size, type: it.type,
    url: it.url, createdAt: it.createdAt, remote: true
  }));
  return remote.concat(S.media);
}
async function uploadMediaFile(file){
  if(!isConnected()) return null;
  const fd = new FormData();
  fd.append('file', file, file.name || 'file');
  const r = await fetch('/api/media', {method:'POST', headers: authHeaders(false), body: fd});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('上传失败 HTTP '+r.status));
  remoteMedia = null;
  return d;
}
function mdForFile(name, url, type){
  return (type && type.startsWith('image')) ? `\n![${name}](${url})\n` : `\n[${name}](${url})\n`;
}
// 先试云上传，失败或未登录则退回本机 blob
async function insertFiles(files, target){
  const src = target || (curMode()==='live' ? ensureLiveInput() : document.getElementById('source'));
  if(!src || !files.length) return;
  const parts = [];
  for(const f of files){
    try{
      const up = await uploadMediaFile(f);
      if(up){ parts.push(mdForFile(up.name, up.url, up.type)); continue; }
    }catch(err){
      toast('上传失败：'+(err.message||'网络错误')+'，已暂存到本机');
    }
    const m = addMedia(f);
    parts.push(mdForFile(m.name, m.url, m.type));
  }
  const text = parts.join('');
  const p = typeof src.selectionStart==='number' ? src.selectionStart : src.value.length;
  src.setRangeText(text, p, src.selectionEnd, 'end');
  src.dispatchEvent(new Event('input', {bubbles:true}));
  if(src.classList && src.classList.contains('blk-src')){
    const i = parseInt(src.dataset.i,10) || 0;
    LIVE.raws[i] = src.value;
    syncBody();
    commitBlock(i);            // 立刻渲染，图片当场可见
  } else {
    const n = noteById(S.active);
    if(n){ n.body = src.value; n.updatedAt = Date.now(); save(); renderMeta(); }
  }
  if(S.view==='media') renderMedia();
}

function updateSyncBadge(){
  const el = document.getElementById('metaSync');
  if(!el) return;
  if(!isConnected()){ el.style.display = 'none'; return; }
  el.style.display = '';
  const st = SYNC.state==='ok' ? 'ok' : (SYNC.state==='error' ? 'error' : 'busy');
  const label = st==='ok' ? '已同步' : (st==='error' ? '未保存' : '保存中');
  el.innerHTML = `<span class="sd ${st}"></span>${label}`;
  el.title = syncTip();
}

if(qs.get('mode')==='live') setTimeout(()=>setMode('live'), 60);
if(qs.get('cmd')==='1') setTimeout(()=>openPalette(), 60);
if(qs.get('sync')==='1') setTimeout(()=>openSyncPanel(), 60);
// 已有密码时后台安静同步一次
if(isConnected()){
  setTimeout(async ()=>{
    if(!SYNC.token && SYNC.key){
      try{ await doAuth(SYNC.account, SYNC.key, false); }
      catch(e){ SYNC.state='error'; SYNC.error=e.message||'登录失败'; renderDock(); return; }
    }
    syncNow({rerender:true});
    icsPullSources(true);            // 账号里的日历订阅源，换设备后自动补齐
    icsPullDone();                   // 哪些日历事件已经勾掉，也跟着账号走
  }, 350);
}

/* ---- 待办到点提醒：每分钟扫一次；回到页面时补扫一次 ---- */
setTimeout(checkTodoReminders, 2500);
setInterval(checkTodoReminders, 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') checkTodoReminders();
});
/* ---- 苹果日历订阅：进页面拉一次，之后每 20 分钟 ---- */
setTimeout(()=>{ icsSync(); }, 6000);
setInterval(()=>{ icsSync(); }, 20 * 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') icsSync();
});
/* 通知用的 Service Worker：只用来弹通知，不接管请求 */
if('serviceWorker' in navigator) setTimeout(()=>{ ensureSW(); }, 1200);
/* 页面上有提醒记录时，顺手把日历订阅源也刷新一遍（内部有节流） */
setTimeout(()=>{ if(FEED.token) maybePushFeed(); }, 12000);
setInterval(()=>{ maybePushFeed(); }, 5 * 60000);
/* 通知点开：切回页面后跳到对应笔记 */
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (e)=>{
    const d = e.data || {};
    if(d.type === 'ivy-open-note' && d.noteId && noteById(d.noteId)){
      S.view = 'notes'; openNote(d.noteId); renderAll(); save();
    }
  });
}

/* ---- 版本水印 ----
   常驻显示本页构建版本；正式域名下再对比 GitHub main 上的 version.js，
   若不一致说明生产部署被历史 commit 覆盖，直接给出提示与一键刷新。 */
(function(){
  const el = document.getElementById('buildTag');
  if(!el) return;
  const b = window.IVY_BUILD || { id:'?', at:'' };
  let state = '未检测';
  const paint = (html, warn)=>{ el.innerHTML = html; el.classList.toggle('warn', !!warn); };
  paint(`<span class="bd">${esc(b.id)}</span><span>·</span><span>${esc(b.at)}</span>`);
  el.title = `构建 ${b.id} · ${b.at}\n点击复制版本信息`;
  el.onclick = ()=>{
    const info = `小胡的笔记 · 构建 ${b.id} (${b.at}) · 线上检测：${state}`;
    if(navigator.clipboard) navigator.clipboard.writeText(info).then(()=>toast('版本信息已复制'), ()=>toast(info));
    else toast(info);
  };
  if(location.protocol !== 'https:' || !/(\.139t\.cn|\.163t\.cn|\.xhxh\.vip)$/.test(location.hostname)) return;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 4500);
  fetch('https://raw.githubusercontent.com/httcup/notes/main/public/version.js?t=' + Date.now(),
        { cache:'no-store', signal:ctrl.signal })
    .then(r=>{ if(!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(txt=>{
      clearTimeout(timer);
      const m = txt.match(/id\s*:\s*'([^']+)'/);
      if(!m) return;
      if(m[1] === b.id){
        state = '已是最新';
        el.title = `构建 ${b.id} · ${b.at} · 已是最新版本\n点击复制版本信息`;
        return;
      }
      state = `落后（线上 ${b.id} / 最新 ${m[1]}）`;
      paint(`<span>⚠ 线上版本落后 ${esc(b.id)} → ${esc(m[1])}</span><button class="rf" id="bdRefresh" type="button">刷新</button>`, true);
      el.title = '检测到线上运行的不是最新版本，可能又被旧部署覆盖；点「刷新」重新加载。';
      const rf = document.getElementById('bdRefresh');
      if(rf) rf.onclick = e=>{
        e.stopPropagation();
        const u = new URL(location.href); u.searchParams.set('_v', Date.now());
        location.href = u.toString();
      };
    })
    .catch(()=>{ clearTimeout(timer); state = '校验不可用'; });
})();
</script>
