<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>小胡小胡的笔记</title>
<style>
/* ============ tokens（取自 ivyNote 真实配色） ============ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  --shelf-w:296px;
  --spring:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-hover:31 104 69; --ivy-soft:229 243 235; --on-ivy:255 255 255; --ivy-ink:27 92 60;
  --warn:190 134 48; --warn-ink:110 78 26; --warn-soft:252 244 228;
  --danger:176 62 54; --danger-soft:252 235 233;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
  --shadow-float:0 0 0 .5px rgb(16 24 32 / .06),0 2px 6px rgb(16 24 32 / .05),0 12px 28px -10px rgb(16 24 32 / .14);
  --shadow-lift:0 0 0 .5px rgb(16 24 32 / .07),0 8px 16px -6px rgb(16 24 32 / .08),0 32px 64px -16px rgb(16 24 32 / .22);
  --tag-green-fg:#3f7a5b; --tag-blue-fg:#4f6a9a; --tag-amber-fg:#a0702c; --tag-pink-fg:#a65a7c; --tag-gray-fg:#6f767d; --tag-purple-fg:#7a62a8;
  --hl-green-bg:229 243 235; --hl-green-fg:27 92 60;
  --hl-yellow-bg:253 240 197; --hl-yellow-fg:122 88 12;
  --hl-pink-bg:252 226 229; --hl-pink-fg:154 44 60;
  --hl-blue-bg:219 234 250; --hl-blue-fg:28 78 132;
  --hl-purple-bg:235 226 248; --hl-purple-fg:94 58 148;
  --hl-gray-bg:233 236 239; --hl-gray-fg:71 78 85;
}
[data-theme=dark]{
  color-scheme:dark;
  --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
  --ink:232 235 238; --ink-2:190 195 200; --muted:138 144 150; --faint:96 101 107;
  --line:44 48 52; --hover:38 41 45;
  --ivy:86 180 130; --ivy-hover:110 196 150; --ivy-soft:28 50 39; --on-ivy:10 28 18; --ivy-ink:150 224 182;
  --warn:214 170 98; --warn-ink:232 205 158; --warn-soft:48 40 26;
  --danger:226 128 116; --danger-soft:58 33 31;
  --code-bg:31 34 38;
  --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  --shadow-float:0 0 0 .5px rgb(255 255 255 / .07),0 12px 28px -10px rgb(0 0 0 / .6);
  --shadow-lift:0 0 0 .5px rgb(255 255 255 / .08),0 32px 64px -16px rgb(0 0 0 / .7);
  --tag-green-fg:#92c4a6; --tag-blue-fg:#9db2dc; --tag-amber-fg:#d9b77e; --tag-pink-fg:#dba6bf; --tag-gray-fg:#a3a9af; --tag-purple-fg:#bcaae0;
  --hl-green-bg:28 50 39; --hl-green-fg:150 224 182;
  --hl-yellow-bg:58 47 20; --hl-yellow-fg:240 214 128;
  --hl-pink-bg:58 30 34; --hl-pink-fg:240 168 176;
  --hl-blue-bg:24 42 64; --hl-blue-fg:150 196 240;
  --hl-purple-bg:44 34 60; --hl-purple-fg:196 176 240;
  --hl-gray-bg:44 47 51; --hl-gray-fg:190 195 200;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgb(var(--ivy) / .18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgb(var(--ink) / .13);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--ink) / .22);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.shell{display:flex;height:100dvh;overflow:hidden}

/* ============ shelf ============ */
.shelf{
  width:var(--shelf-w);flex:0 0 var(--shelf-w);display:flex;flex-direction:column;
  padding:14px 12px 12px;position:relative;transition:margin-left .34s var(--spring),opacity .2s;
}
.shelf.collapsed{margin-left:calc(var(--shelf-w) * -1);opacity:0;pointer-events:none}
.shelf-open{
  position:fixed;left:12px;top:12px;z-index:40;width:32px;height:32px;display:none;place-items:center;
  border-radius:8px;color:rgb(var(--muted));background:rgb(var(--surface)/.9);
  box-shadow:var(--shadow-float);backdrop-filter:blur(8px);
}
.shelf-open:hover{color:rgb(var(--ink))}
.shelf-open.show{display:grid}
.shelf-open svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.shelf-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand-name{
  font-family:var(--font-serif);font-size:17.5px;font-weight:700;letter-spacing:0;
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.head-actions{display:flex;align-items:center;gap:0;flex:0 0 auto}
.icon-btn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--muted));transition:background .15s,color .15s;
}
.icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.shelf-body{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px 64px;scrollbar-gutter:stable}
.sec-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));
  margin:10px 8px 6px;
}
.sec-label .count{font-weight:500;color:rgb(var(--faint))}
.shelf-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));
  transition:background .14s,color .14s;position:relative;
}
.shelf-row:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.shelf-row svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.shelf-row .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.shelf-row .meta{font-size:11px;color:rgb(var(--faint));flex:0 0 auto}
.shelf-row.new-nb{color:rgb(var(--ivy));font-size:13px;padding:6px 8px}
.shelf-row.new-nb:hover{background:rgb(var(--ivy-soft))}
.shelf-row.new-nb svg{color:currentColor}

.nb-group{margin-top:2px}
.nb-row{display:flex;align-items:center;gap:0;border-radius:7px}
.nb-row:hover{background:rgb(var(--hover))}
.nb-more{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--faint));opacity:.28;transition:opacity .12s,background .12s;margin-right:4px;
}
.nb-row:hover .nb-more{opacity:1}
.nb-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.nb-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb-head{
  display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:7px;
  color:rgb(var(--muted));font-size:12px;font-weight:600;letter-spacing:.02em;
}
.nb-row:hover .nb-head{color:rgb(var(--ink-2))}
.nb-head svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb-head.open svg.chev{transform:rotate(90deg)}
.nb-head .t{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-notes{padding-left:8px}
.nb-notes.hidden{display:none}

.note-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px;color:rgb(var(--ink-2));font-size:13.5px;
  transition:background .14s,color .14s;
}
.note-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.note-item.active{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.note-item svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.note-item.active svg{color:rgb(var(--ivy))}
.note-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .tags{display:flex;gap:3px;flex:0 0 auto}
.dot-tag{width:5px;height:5px;border-radius:50%}

/* 左侧标签分类（可折叠树：标签 → 该标签下的笔记） */
.tag-sec{margin-top:12px}
.tag-sec-head{
  display:flex;align-items:center;gap:6px;width:calc(100% - 16px);text-align:left;
  margin:10px 8px 6px;padding:2px 0;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));
}
.tag-sec-head:hover{color:rgb(var(--ink-2))}
.tag-sec-head .caret,.tag-caret{
  flex:0 0 auto;width:9px;text-align:center;font-size:8px;line-height:1;
  color:rgb(var(--faint));transition:transform .18s;
}
.tag-sec-head.open .caret,.tag-row.open .tag-caret{transform:rotate(90deg)}
.tag-sec-head svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tag-sec-head .count{margin-left:auto;font-weight:500;color:rgb(var(--faint))}
.tag-group{margin:1px 0}
.tag-line{position:relative;border-radius:7px}
.tag-line:hover{background:rgb(var(--hover))}
.shelf-row.tag-row{padding:5px 8px;padding-right:30px;gap:7px;color:rgb(var(--ink-2))}
.shelf-row.tag-row:hover{background:transparent;color:rgb(var(--ink))}
.tag-row .meta{transition:opacity .12s}
.tag-line:hover .tag-row .meta{opacity:0}
.tag-more{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:rgb(var(--muted));opacity:0;pointer-events:none;
  transition:opacity .12s,background .12s,color .12s;
}
.tag-line:hover .tag-more{opacity:1;pointer-events:auto}
.tag-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.tag-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.po-note{font-size:11.5px;line-height:1.55;color:rgb(var(--faint));padding:4px 8px 6px;max-width:230px}
.tag-hash{font-size:12.5px;line-height:1;flex:0 0 auto;font-weight:500}
.tag-dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.tag-notes{margin-left:17px;padding-left:10px;border-left:1px solid rgb(var(--line))}
.tag-notes .note-item{padding:5px 8px;font-size:12.8px}
.tag-empty{font-size:11.5px;color:rgb(var(--faint));padding:4px 8px 6px;line-height:1.6}

/* 单篇笔记的标签选择器 */
.tag-pick{width:238px;padding:6px}
.tp-search{padding:0 2px 6px}
.tp-search input{
  width:100%;height:28px;border:0;border-radius:7px;outline:none;
  background:rgb(var(--ink)/.05);padding:0 9px;font-size:12.5px;color:rgb(var(--ink));
}
.tp-search input::placeholder{color:rgb(var(--faint))}
.tp-list{max-height:230px;overflow-y:auto;scrollbar-width:thin}
.tp-list::-webkit-scrollbar{width:6px}
.tp-list::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px}
.tp-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));font-size:12.5px;
}
.tp-row:hover{background:rgb(var(--hover))}
.tp-row .tp-dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.tp-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-row .n{font-size:10.5px;color:rgb(var(--faint))}
.tp-row .ck{width:14px;text-align:center;color:rgb(var(--ivy));font-size:12px}
.tp-row.on .t{color:rgb(var(--ink));font-weight:500}
.tp-row.tp-create{color:rgb(var(--ivy))}
.tp-plus{width:14px;text-align:center;font-size:15px;line-height:1}
.tp-none{font-size:11.5px;color:rgb(var(--faint));padding:10px 8px;text-align:center}
.chip{cursor:pointer}

.shelf-foot{margin-top:auto;padding-top:10px}

/* dock */
.dock{
  position:absolute;left:12px;right:12px;bottom:12px;height:46px;
  display:flex;align-items:center;gap:2px;padding:5px 6px;
  background:rgb(var(--surface)/.86);backdrop-filter:blur(14px) saturate(1.4);
  border-radius:13px;box-shadow:var(--shadow-float);
}
.dock-item{
  height:34px;min-width:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto;
  transition:background .16s,color .16s;
}
.dock-item svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.dock-item.active{background:rgb(var(--ink) / .06);color:rgb(var(--ink));font-weight:500}
.dock-item .lbl{white-space:nowrap}
.dock-spacer{flex:1}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:13px;font-weight:700;
  background:#f3ddd6;color:#8a4a34;flex:0 0 auto;transition:transform .18s var(--spring);
}
[data-theme=dark] .avatar{background:#4a3229;color:#e8c2b2}
.avatar:hover{transform:scale(1.06)}

/* ============ paper ============ */
.main-wrap{flex:1;min-width:0;display:flex;padding:8px 12px 8px 0}.paper{
  flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:rgb(var(--surface));border:1px solid #e9ecef;border-radius:14px;
  box-shadow:var(--shadow-paper);
}
[data-theme=dark] .paper{border-color:#2b3035}
.tabbar{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;flex:0 0 auto;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;max-width:180px;height:28px;padding:0 8px 0 10px;
  border-radius:7px;font-size:12.5px;color:rgb(var(--muted));white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.tab.active{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab .t{overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tab .x{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;opacity:0;transition:opacity .14s,background .14s}
.tab:hover .x,.tab.active .x{opacity:.7}
.tab .x:hover{background:rgb(var(--ink)/.08);opacity:1}
.tab .x svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.tab-new{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:rgb(var(--faint))}
.tab-new:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab-new svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

.paper-actions{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:2px;z-index:6}
.pa-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:rgb(var(--muted));transition:background .15s,color .15s}
.pa-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.pa-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pa-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

.content-row{flex:1;display:flex;min-height:0;position:relative}

/* ============ doc ============ */
.scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0}
.doc{max-width:700px;margin:0 auto;padding:52px 44px 140px}
.doc-title{
  display:block;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:34px;font-weight:600;line-height:1.28;letter-spacing:-.012em;
  color:rgb(var(--ink));padding:0;margin:0 0 2px;
}
.doc-title::placeholder{color:rgb(var(--faint));opacity:.75}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0 24px;font-size:12.5px;color:rgb(var(--faint))}
.doc-meta .sep{opacity:.6}
.meta-btn{padding:2px 4px;border-radius:5px;color:rgb(var(--faint));transition:background .14s,color .14s;font-size:12.5px}
.meta-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.meta-btn.add{color:rgb(var(--faint))}
/* 标题下的 Markdown 工具条 */
.fmt-bar{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:12px 0 0;user-select:none}
.fmt-bar button{
  height:26px;min-width:24px;padding:0 6px;border-radius:6px;font-size:12px;color:rgb(var(--muted));
  transition:background .14s,color .14s,transform .1s;
}
.fmt-bar button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.fmt-bar button:active{transform:scale(.95)}
.fmt-bar button b,.fmt-bar button i,.fmt-bar button s{font-size:13px;font-weight:700}
.fmt-bar button i{font-style:italic;font-family:var(--font-serif)}
.fmt-sep{width:1px;height:12px;background:rgb(var(--line));margin:0 5px;flex:0 0 auto}
.meta-sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgb(var(--faint))}
.meta-sync .sd{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45}
.meta-sync .sd.ok{background:rgb(var(--ivy));opacity:1}
.meta-sync .sd.busy{background:rgb(var(--ivy));opacity:1;animation:pulse 1s ease-in-out infinite}
.meta-sync .sd.error{background:rgb(var(--warn));opacity:1}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  font-size:11.5px;font-weight:500;background:rgb(var(--ink)/.05);color:rgb(var(--tag-gray-fg));
}
.chip .rm{opacity:.5;font-size:13px;line-height:1}
.chip:hover .rm{opacity:1}
.tag-input{
  height:22px;width:86px;border:0;outline:none;background:none;font-size:12.5px;
  border-bottom:1px solid rgb(var(--ivy)/.5);
}

.doc-body{position:relative}
.prose{
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));
  word-break:break-word;
}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose h1,.prose h2,.prose h3,.prose h4{font-weight:600;line-height:1.6;margin:1.7em 0 .62em;letter-spacing:-.005em;scroll-margin-top:80px}
.prose h1{font-size:1.62em}
.prose h2{font-size:1.34em}
.prose h3{font-size:1.14em}
.prose h4{font-size:1em}
.prose h5{font-size:.94em;color:rgb(var(--ink-2))}
.prose h6{font-size:.9em;color:rgb(var(--muted))}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em}
.prose li{margin:.3em 0}
.prose li::marker{color:rgb(var(--faint))}
.prose blockquote{
  margin:1.2em 0;padding:2px 0 2px 16px;border-left:2px solid rgb(var(--ivy)/.35);
  color:rgb(var(--ink-2));
}
.prose blockquote p:last-child{margin-bottom:0}
.prose code{
  font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));
  padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line));
}
.prose pre{
  background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:1.2em 0;
}
.prose pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.prose hr{border:0;border-top:1px solid rgb(var(--line));margin:2.2em 0}
.prose img{max-width:100%;border-radius:9px;display:block;margin:1.2em 0}
.prose a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.prose mark{background:rgb(var(--hl-green-bg));color:rgb(var(--hl-green-fg));padding:1px 3px;border-radius:4px}
.prose mark.hl-yellow{background:rgb(var(--hl-yellow-bg));color:rgb(var(--hl-yellow-fg))}
.prose mark.hl-pink{background:rgb(var(--hl-pink-bg));color:rgb(var(--hl-pink-fg))}
.prose mark.hl-blue{background:rgb(var(--hl-blue-bg));color:rgb(var(--hl-blue-fg))}
.prose mark.hl-purple{background:rgb(var(--hl-purple-bg));color:rgb(var(--hl-purple-fg))}
.prose mark.hl-gray{background:rgb(var(--hl-gray-bg));color:rgb(var(--hl-gray-fg))}
.prose del{color:rgb(var(--muted))}
.wiki-pop{
  position:fixed;z-index:86;width:290px;max-height:236px;overflow:auto;padding:5px;display:none;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:11px;
  box-shadow:var(--shadow-lift);
}
.wiki-pop.open{display:block}
.wiki-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:default}
.wiki-item.on{background:rgb(var(--hover));color:rgb(var(--ink))}
.wiki-ico{flex:0 0 auto;color:rgb(var(--ivy));font-size:11px;line-height:1}
.wiki-new{flex:0 0 auto;font-size:10.5px;color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));padding:1px 5px;border-radius:4px}
.wiki-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiki-empty{padding:10px;font-size:12px;color:rgb(var(--faint))}
.prose .wikilink{
  color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));text-decoration:none;
  padding:1.5px 5px;border-radius:5px;font-size:.94em;white-space:nowrap;
}
/* 统一垂直节奏：块与块之间只留一个间距，标题不再叠加 1.7em 的上边距 */
.prose > *, .blk-view > *{margin-top:0 !important;margin-bottom:0 !important}
.prose > * + *, .blk + .blk, .blk-view > * + *{margin-top:0 !important}
.prose > hr, .blk-view > hr{margin-top:1.15em !important;margin-bottom:1.15em !important}
/* 有边框/底色的块（代码块、表格、引用）留一点呼吸，否则会和相邻文字粘在一起 */
.prose > pre, .prose > table, .prose > blockquote,
.blk-view > pre, .blk-view > table, .blk-view > blockquote{margin-top:.34em !important;margin-bottom:.34em !important}
.prose > ul, .prose > ol, .blk-view > ul, .blk-view > ol{margin-top:.16em !important;margin-bottom:.16em !important}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.94em}
.prose th,.prose td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.prose th{background:rgb(var(--sunken));font-weight:600}
.prose .task{list-style:none;margin-left:-1.1em}
.prose .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.prose .empty{color:rgb(var(--faint));font-size:15px}
.source{
  display:none;width:100%;min-height:360px;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));padding:0;
}
.doc.mode-edit .prose{display:none}
.doc.mode-edit .source{display:block}
.doc.mode-preview .prose{cursor:text}
/* 双栏：左边源码，右边即时预览，两栏等高、各自滚动并联动 */
.doc.mode-split{max-width:1180px;padding-bottom:28px}
.doc.mode-split .doc-body{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;
  align-items:stretch;height:max(360px, calc(100vh - 232px));min-height:360px;
}
.doc.mode-split .source{
  display:block;grid-column:1;grid-row:1;padding-right:28px;
  border-right:1px solid #edf0f2;
  font-family:var(--font-mono);font-size:13.5px;line-height:1.8;
  height:100%;min-height:0;overflow-y:auto;
}
.doc.mode-split #live{display:none}
.doc.mode-split .prose{
  grid-column:2;grid-row:1;padding-left:28px;
  height:100%;min-height:0;max-height:none;overflow-y:auto;position:static;
}
.doc.mode-split .source::-webkit-scrollbar,
.doc.mode-split .prose::-webkit-scrollbar{width:8px}
.doc.mode-split .source::-webkit-scrollbar-thumb,
.doc.mode-split .prose::-webkit-scrollbar-thumb{background:rgb(var(--line));border-radius:8px}
[data-theme=dark] .doc.mode-split .source{border-right-color:#2b3035}
@media (max-width:900px){
  .doc.mode-split .doc-body{grid-template-columns:1fr;height:auto}
  .doc.mode-split .source{height:auto;max-height:none;border-right:0;padding-right:0;min-height:240px}
  .doc.mode-split .prose{
    height:auto;max-height:none;padding-left:0;margin-top:14px;padding-top:14px;
    border-top:1px solid #edf0f2;
  }
}

/* ===== 所见即所得（块级） ===== */
.live{display:none}
.doc.mode-live #prose{display:none}
.doc.mode-live .source{display:none}
.doc.mode-live .live{display:block;min-height:360px;cursor:text}
.blk{position:relative}
.blk-src{
  display:none;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));
  padding:0;margin:0;field-sizing:content;caret-color:rgb(var(--ivy));
}
.blk.editing .blk-src{display:block}
.blk.editing .blk-view{display:none}
/* 空块刚套上标题/列表时，用灰字提示该写什么，一输入就消失 */
.blk-hint{
  display:none;position:absolute;left:0;top:0;width:100%;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;
  color:rgb(var(--faint));pointer-events:none;white-space:pre-wrap;overflow:hidden;
}
.blk-hint .hp{color:rgb(var(--faint))}
.blk-hint .ht{color:rgb(var(--faint));opacity:.72}
.blk-src.has-hint{color:transparent}
.blk-view{min-height:1.2em}
.blk-view input[type=checkbox]{cursor:pointer}
.blk-view img{cursor:default}
.lv-tail{height:180px}
.lv-hint{color:rgb(var(--faint));font-size:15px;line-height:1.95}

/* empty state */
.blank{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgb(var(--faint));text-align:center}
.blank .kbd{font-family:var(--font-mono);font-size:11.5px;padding:3px 7px;border-radius:5px;background:rgb(var(--sunken));border:.5px solid rgb(var(--line))}
.blank p{margin:0;font-size:13.5px}

/* ============ outline（无边框透明悬浮 + 右边缘刻度） ============ */
/* 收起时：右边缘一列随笔记长度变化的短刻度，一根对应一个标题，当前位置高亮 */
.outline-zone{position:fixed;right:0;top:58px;bottom:0;width:26px;z-index:45}
.ol-mini{position:absolute;right:12px;top:34px;width:16px;transition:opacity .18s}
.ol-tick{
  position:absolute;right:0;height:1px;padding:0;border:0;border-radius:1px;
  background:rgb(var(--ink)/.22);
  transition:background .16s,height .16s,transform .16s;
}
[data-theme=dark] .ol-tick{background:rgb(255 255 255 / .22)}
.ol-tick.on{background:rgb(var(--ivy));height:2px;transform:scaleX(1.3);transform-origin:right center}
/* 卡片展开/固定时，刻度让位给卡片自己的短横线 */
.outline-zone:hover .ol-mini,
body.ol-peek .ol-mini,
body.outline-pinned .ol-mini,
body.ol-hidden .ol-mini{opacity:0;pointer-events:none}
body.ol-hidden .outline-zone{display:none}
.outline{
  position:fixed;right:4px;top:66px;z-index:56;
  width:256px;max-height:min(620px,calc(100vh - 116px));
  display:flex;flex-direction:column;
  padding:4px 5px 6px;border:0;border-radius:0;
  background:transparent;box-shadow:none;
  transform:translateX(10px);transform-origin:right top;
  opacity:0;pointer-events:none;
  transition:transform .26s var(--spring),opacity .16s;
}
[data-theme=dark] .outline{box-shadow:none}
.outline-zone:hover ~ .outline,
.outline:hover,
.outline.pinned{transform:none;opacity:1;pointer-events:auto}
.outline.hidden{display:none}
.outline-head{display:flex;align-items:center;justify-content:flex-end;gap:1px;padding:3px 3px 5px;flex:0 0 auto}
.ol-btn{
  width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--faint));transition:background .14s,color .14s;
}
.ol-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.ol-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.ol-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.outline-body{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:1px 1px 2px}
.outline-body::-webkit-scrollbar{width:7px}
.outline-body::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.12);border-radius:7px;border:2px solid transparent;background-clip:content-box}
.ol-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-size:12.8px;line-height:1.55;color:rgb(var(--ink-2));
  padding:5px 8px;border-radius:7px;margin:0;
  transition:background .14s,color .14s;
}
.ol-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .dash{flex:0 0 auto;width:9px;height:1px;border-radius:1px;background:rgb(var(--ink)/.17);transition:width .18s,background .18s,height .18s}
.ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.ol-item.l1{font-weight:500;color:rgb(var(--ink))}
.ol-item.l2{padding-left:21px}
.ol-item.l3{padding-left:34px;font-size:12.3px}
.ol-item.l4,.ol-item.l5,.ol-item.l6{padding-left:47px;font-size:12.3px;color:rgb(var(--muted))}
.ol-item.on{color:rgb(var(--ink));font-weight:600}
.ol-item.on .dash{width:18px;height:1.5px;background:rgb(var(--ivy))}
.ol-empty{font-size:12px;color:rgb(var(--faint));padding:8px 9px}

/* ============ media ============ */
.view-pad{padding:44px 32px 40px}
.media-search{
  display:flex;align-items:center;gap:8px;max-width:320px;height:32px;padding:0 10px;
  border-radius:8px;background:rgb(var(--sunken));color:rgb(var(--muted));
}
.media-search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.media-search input{flex:1;border:0;outline:none;background:none;font-size:13px}
.media-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:rgb(var(--muted));font-size:13.5px;padding-bottom:60px;
}
.media-empty svg{width:32px;height:32px;stroke:rgb(var(--faint));fill:none;stroke-width:1.4;opacity:.7}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.media-card{border-radius:10px;overflow:hidden;border:.5px solid rgb(var(--line));background:rgb(var(--sunken));transition:transform .2s var(--spring),box-shadow .2s}
.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.media-thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:11px;color:rgb(var(--faint))}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-name{padding:7px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgb(var(--surface))}

/* ============ graph ============ */
#graphWrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#graphWrap.dragging{cursor:grabbing}
#graphCanvas{width:100%;height:100%;display:block}
.graph-zoom{
  position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;
  background:rgb(var(--surface)/.9);backdrop-filter:blur(12px);border-radius:11px;
  box-shadow:var(--shadow-float);overflow:hidden;
}
.graph-zoom button{width:36px;height:34px;display:grid;place-items:center;color:rgb(var(--muted))}
.graph-zoom button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.graph-zoom svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.legend{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;color:rgb(var(--ink-2))}
.legend .sq{width:8px;height:8px;border-radius:2px;background:rgb(var(--warn))}
.legend .rd{width:8px;height:8px;border-radius:50%;background:rgb(var(--faint))}

/* ============ overlay / palette ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;
  padding-top:14vh;background:rgb(10 12 14 / .22);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.open{opacity:1;pointer-events:auto}
.palette{
  width:min(620px,90vw);background:rgb(var(--surface));border-radius:13px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  overflow:hidden;transform:translateY(-8px) scale(.985);transition:transform .22s var(--spring);
}
.overlay.open .palette{transform:none}
.palette-in{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid rgb(var(--line));color:rgb(var(--muted))}
.palette-in svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.palette-in input{flex:1;border:0;outline:none;background:none;font-size:14.5px}
.palette-list{max-height:46vh;overflow-y:auto;padding:6px}
.p-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;
  border-radius:8px;font-size:13.5px;color:rgb(var(--ink-2));
}
.p-row svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.p-row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .h{font-size:11px;color:rgb(var(--faint));font-family:var(--font-mono)}
.p-row.sel{background:rgb(var(--hover));color:rgb(var(--ink))}
.p-group{font-size:11px;font-weight:600;letter-spacing:.05em;color:rgb(var(--faint));padding:8px 10px 4px}
.p-empty{padding:18px;text-align:center;color:rgb(var(--faint));font-size:13px}

/* popover */
.popover{
  position:fixed;z-index:70;min-width:196px;max-width:300px;padding:5px;background:rgb(var(--surface));
  border-radius:10px;box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .14s,transform .16s var(--spring);
}
.popover.open{opacity:1;transform:none;pointer-events:auto}
.po-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;font-size:13px;color:rgb(var(--ink-2));text-align:left}
.po-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.po-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.po-item.danger{color:rgb(var(--danger))}
.po-item.danger svg{color:rgb(var(--danger))}
.po-item.muted{color:rgb(var(--faint));pointer-events:none}
.po-item>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.po-sep{height:1px;margin:4px 6px;background:rgb(var(--line))}
.po-key{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--faint))}
.hl-row{display:flex;align-items:center;gap:7px;padding:6px 8px 5px}
.hl-grid{display:grid;grid-template-columns:repeat(7,20px);gap:6px;padding:8px 9px 7px}
.hl-sw{width:20px;height:20px;border-radius:6px;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(var(--ink) / .10);transition:transform .12s var(--spring)}
.hl-sw:hover{transform:scale(1.14)}
.hl-sw:active{transform:scale(.96)}
.hl-add{
  display:grid;place-items:center;background:none;box-shadow:inset 0 0 0 1px rgb(var(--line));
  color:rgb(var(--muted));font-size:14px;line-height:1;
}
.hl-add:hover{color:rgb(var(--ink));box-shadow:inset 0 0 0 1px rgb(var(--ink)/.2)}
.hl-color-in{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.emoji-grid{display:grid;grid-template-columns:repeat(8,34px);gap:1px;padding:6px 4px;max-height:210px;overflow-y:auto;scrollbar-width:thin}
.emoji-grid::-webkit-scrollbar{width:6px}
.emoji-grid::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px;border:1px solid transparent;background-clip:content-box}
.emo{width:34px;height:32px;border-radius:6px;font-size:18px;line-height:1;display:grid;place-items:center;transition:background .12s}
.emo:hover{background:rgb(var(--hover))}
.emo:active{transform:scale(.92)}
.emo-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px 3px 5px;border-bottom:1px solid rgb(var(--line))}
.emo-tab{font-size:11.5px;padding:4px 2px;border-radius:5px;color:rgb(var(--muted));line-height:1.25;text-align:center;transition:background .12s,color .12s}
.emo-tab:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.emo-tab.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

/* toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;font-size:12.5px;
  background:rgb(var(--ink));color:rgb(var(--canvas));box-shadow:var(--shadow-float);
  animation:toastIn .3s var(--spring);max-width:70vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.hint{position:fixed;bottom:14px;right:16px;font-size:11px;color:rgb(var(--faint));z-index:5}
/* ============ 云同步面板 ============ */
.dock-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;margin-left:1px;transition:opacity .2s,background .2s}
.dock-item.sync-ok{color:rgb(var(--ivy))}
.dock-item.sync-ok .dot{opacity:1}
.dock-item.sync-busy .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-pending{color:rgb(var(--ivy))}
.dock-item.sync-pending .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-error{color:rgb(var(--warn))}
.dock-item.sync-error .dot{opacity:1}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.sheet{
  width:min(470px,92vw);padding:20px 22px 18px;background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  transform:translateY(-6px) scale(.99);transition:transform .22s var(--spring);
}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.sheet-sub{margin:0 0 16px;font-size:12.5px;line-height:1.75;color:rgb(var(--muted))}
.reg-hint{
  margin:0 0 16px;padding:11px 13px;border-radius:10px;
  background:rgb(var(--ivy-soft));border:1px solid rgb(var(--ivy)/.24);
}
.reg-hint-t{font-size:12.5px;line-height:1.72;color:rgb(var(--ink-2))}
.reg-hint-t b{color:rgb(var(--ivy-ink));font-weight:600}
.reg-hint-s{margin-top:6px;font-size:11.5px;line-height:1.7;color:rgb(var(--muted))}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));margin-bottom:6px}
.field input{
  width:100%;height:34px;padding:0 10px;border-radius:8px;border:.5px solid rgb(var(--line));
  background:rgb(var(--sunken));outline:none;font-size:13px;font-family:var(--font-mono);letter-spacing:.02em;
}
.field input:focus{border-color:rgb(var(--ivy)/.6);background:rgb(var(--surface))}
.sheet-row{display:flex;gap:8px;align-items:center}
.btn-primary{
  height:32px;padding:0 14px;border-radius:8px;background:rgb(var(--ivy));color:rgb(var(--on-ivy));

}
.btn-primary:hover{background:rgb(var(--ivy-hover))}

.btn-ghost{height:32px;padding:0 12px;border-radius:8px;color:rgb(var(--muted));font-size:12.5px;border:.5px solid rgb(var(--line))}
.btn-ghost:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.sheet-status{margin-top:14px;padding-top:11px;border-top:1px solid rgb(var(--line));font-size:11.5px;line-height:1.75;color:rgb(var(--faint))}
.sheet-status b{color:rgb(var(--ink-2));font-weight:600}

/* ============ 导出面板 ============ */
.export-pop{
  position:fixed;z-index:75;padding:15px 17px 17px;width:430px;max-width:calc(100vw - 24px);
  background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  opacity:0;pointer-events:none;transform:translateY(-4px) scale(.985);
  transition:opacity .16s,transform .2s var(--spring);
}
.export-pop.open{opacity:1;pointer-events:auto;transform:none}
.ex-head{font-size:13.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:6px}
.ex-desc{font-size:12px;line-height:1.65;color:rgb(var(--faint));margin:0 0 13px}
.ex-row{display:flex;gap:8px}
.ex-row button{
  height:34px;padding:0 15px;border-radius:17px;background:rgb(var(--hover));
  font-size:13px;font-weight:600;color:rgb(var(--ink));white-space:nowrap;
  transition:background .15s,transform .12s;
}
.ex-row button:hover{background:rgb(var(--sunken))}
.ex-row button:active{transform:scale(.97)}

@media (max-width:900px){
  .outline,.outline-zone{display:none}
  .doc{padding:40px 20px 120px}
}

<body>
<div class="shell">
  <aside class="shelf" id="shelf">
    <header class="shelf-head">
      <div class="brand">

</div>

<script>
/* ========== 图标 ========== */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',

  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M19 18v3H6.5A2.5 2.5 0 0 1 4 18.5"/>',
  trash:'<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/>',
  graph:'<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M8.2 16.4 15.8 7.7M8.5 18h6"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 17.4 9.5A3.75 3.75 0 0 1 17 18z"/>',
  cloudCheck:'<path d="M7 18a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 17.4 9.5A3.75 3.75 0 0 1 17 18z"/>',
  paperclip:'<path d="M20 11.5 12.3 19a4.6 4.6 0 0 1-6.5-6.5l8-8a3.1 3.1 0 0 1 4.4 4.4l-7.9 7.9a1.6 1.6 0 0 1-2.2-2.2l7.2-7.2"/>',
  share:'<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  pencil:'<path d="M4 20h4L20 8a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12"/><circle cx="12" cy="12" r="3"/>',
  outline:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  pin:'<path d="M9.5 3.2h5l-.55 5.1 3.05 3.2H7l3.05-3.2z"/><path d="M12 11.5V20.8"/>',
  bookOpen:'<path d="M12 6.5C10.5 5 8.4 4.4 4 4.5v14c4.4-.1 6.5.5 8 2 1.5-1.5 3.6-2.1 8-2v-14c-4.4-.1-6.5.5-8 2z"/><path d="M12 6.5v14"/>',
  sort:'<path d="M7 20V4M7 4 3.5 7.5M7 4l3.5 3.5M17 4v16M17 20l3.5-3.5M17 20l-3.5-3.5"/>',
  filter:'<path d="M4 5h16l-6.2 7.4V19l-3.6-2v-4.6z"/>',
  download:'<path d="M12 4v11M8 11.5l4 4 4-4"/><path d="M5 19h14"/>',
  upload:'<path d="M12 19V8M8 11.5l4-4 4 4"/><path d="M5 5h14"/>',
  check:'<path d="m5 13 4.5 4.5L19 7"/>',
  plusCircle:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/>',
  fit:'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  tag:'<path d="M4 11V5.5A1.5 1.5 0 0 1 5.5 4H11l8.5 8.5a1.6 1.6 0 0 1 0 2.3l-4.7 4.7a1.6 1.6 0 0 1-2.3 0z"/><circle cx="8" cy="8" r="1.2"/>',
  restore:'<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  columns:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M12 4v16"/>',
  code:'<path d="m9 8-4 4 4 4M15 8l4 4-4 4"/>',
  link:'<path d="M10.5 13.5a4.5 4.5 0 0 0 6.4 0l2.1-2.1a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M13.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.1 2.1a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>'
};
function ic(name, cls){
  const p = ICONS[name] || '';
  return `<svg viewBox="0 0 24 24" class="${cls||''}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ========== 状态 ========== */
const LS_KEY = 'ivynote.replica.v1';
const D = 864e5;
let S;

function seed(){
  // 全新安装从空白开始，不带任何示例笔记
  return {
    notes: [],
    notebooks: [],
    tabs: [],
    active: null,
    view: 'notes',
    theme: 'light',
    shelfOpen: true,
    outlineOpen: false,
    outlineTop: false,
    mode: 'live',
    tagFilter: '',
    tagLibrary: [],
    tagSectionClosed: false,
    tagClosed: {},
    media: []
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    if(!s.notes) return seed();
    s.media = []; // 本地文件的 blob url 无法持久化
    if(typeof s.shelfOpen!=='boolean') s.shelfOpen = true;
    if(typeof s.outlineOpen!=='boolean') s.outlineOpen = false;
    // 大纲改成「鼠标靠近右边缘滑出」，老数据默认不再常驻展开
    if(!s.outlineHoverV1){ s.outlineOpen = false; s.outlineHoverV1 = true; }
    if(!['live','preview','source','split'].includes(s.mode)) s.mode = 'live';
    if(typeof s.tagFilter !== 'string') s.tagFilter = '';
    if(!Array.isArray(s.tagLibrary)) s.tagLibrary = [];
    if(typeof s.tagSectionClosed !== 'boolean') s.tagSectionClosed = false;
    if(!s.tagClosed || typeof s.tagClosed !== 'object' || Array.isArray(s.tagClosed)) s.tagClosed = {};
    // 老数据 / 云端数据可能没有 tags 字段，统一补成数组
    s.notes.forEach(n=>{ if(!Array.isArray(n.tags)) n.tags = []; });
    if(!Array.isArray(s.tabs) || !s.tabs.length) s.tabs = s.notes.length? [s.notes[0].id] : [];
    if(!s.active || !s.notes.find(x=>x.id===s.active)) s.active = s.tabs[0] || null;
    return s;
  }catch(e){ return seed(); }
}
function save(){
  try{
    const copy = Object.assign({}, S, {media: []});
    localStorage.setItem(LS_KEY, JSON.stringify(copy));
  }catch(e){}
  if(typeof queueSync === 'function') queueSync();
}
S = load();

/* 把「块级语法前的多余空行」收掉（不动代码块内部、不动普通段落之间） */
function normalizeBlockSpacing(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  let inFence = false;
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^\s*```/.test(ln)){ inFence = !inFence; out.push(ln); continue; }
    if(!inFence && !ln.trim()){
      let j = i+1;
      while(j < lines.length && !lines[j].trim()) j++;
      const nxt = j < lines.length ? lines[j] : '';
      const isSep = /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(nxt) && nxt.includes('-');
      const startsBlock = /^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s|\|)/.test(nxt) || isSep;
      if(nxt && startsBlock) continue;   // 这些空行纯粹是块分隔，去掉不影响排版
    }
    out.push(ln);
  }
  return out.join('\n');
}

// 一次性修复：旧版本保存时把块之间的单换行写成了空行，导致源码看着很空
try{
  if(!localStorage.getItem('ivy.spacingFix1')){
    let changed = false;
    (S.notes||[]).forEach(n=>{
      const fixed = normalizeBlockSpacing(n.body||'');
      if(fixed !== n.body){ n.body = fixed; n.updatedAt = Date.now(); changed = true; }
    });
    if(changed) persistLocal();
    localStorage.setItem('ivy.spacingFix1','1');
  }
}catch(e){}

// 一次性改名：使用说明示例里的「常青笔记」统一改成「小胡的笔记」
try{
  if(!localStorage.getItem('ivy.renameV1')){
    let changed = false;
    (S.notes||[]).forEach(n=>{
      if(typeof n.body === 'string' && n.body.includes('常青笔记')){
        n.body = n.body.split('常青笔记').join('小胡的笔记');
        n.updatedAt = Date.now(); changed = true;
      }
      if(n.title === '常青笔记'){ n.title = '小胡的笔记'; changed = true; }
    });
    if(changed) persistLocal();
    localStorage.setItem('ivy.renameV1','1');
  }
}catch(e){}

/* 视图是全局偏好，所有笔记一视同仁，默认「预览」(live 模式)；
   旧版本曾把「使用说明」强制成双栏，这里一次性把遗留的 split 重置回来 */
try{
  if(!localStorage.getItem('ivy.guideLiveV1')){
    if(S.mode === 'split'){ S.mode = 'live'; persistLocal(); }
    localStorage.setItem('ivy.guideLiveV1','1');
  }
}catch(e){}

const noteById = id => S.notes.find(n=>n.id===id);
const liveNotes = () => S.notes.filter(n=>!n.trashed).sort((a,b)=>b.updatedAt-a.updatedAt);

// 一次性清理旧版内置的示例笔记（只删带 seed 标记的，不动自己写的）
try{
  if(!localStorage.getItem('ivy.purgedSeeds')){
    const seeds = S.notes.filter(n=>n.seed);
    if(seeds.length){
      // 生成墓碑，让云端和其他设备也一起删掉
      S.pendingDeletes = (S.pendingDeletes||[]).concat(seeds.map(n=>n.id));
      S.notes = S.notes.filter(n=>!n.seed);
      S.notebooks = S.notebooks.filter(nb=>nb.id!=='nb1');
      S.tabs = S.tabs.filter(id=>S.notes.some(n=>n.id===id));
      if(!S.notes.some(n=>n.id===S.active)){
        const first = S.notes.filter(n=>!n.trashed).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
        S.active = first ? first.id : null;
        if(first && !S.tabs.length) S.tabs = [first.id];
      }
      try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, S, {media:[]}))); }catch(e){}
    }
    localStorage.setItem('ivy.purgedSeeds','1');
  }
}catch(e){}
S.pendingDeletes = Array.isArray(S.pendingDeletes) ? S.pendingDeletes : [];

/* ========== 主题 ========== */
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
}
applyTheme();

/* ========== 渲染：书架 ========== */
const $ = s => document.querySelector(s);
const shelfBody = $('#shelfBody');
const brandName = $('#brandName');

function paintRowIcons(){
  $('#btnSearch').innerHTML = ic('search');
  $('#btnNew').innerHTML = ic('plus');
  $('#btnShelf').innerHTML = ic('panelLeft');
  $('#shelfOpen').innerHTML = ic('panelLeft');
}

/* ========== 标签：历史库 / 颜色 / 计数 ========== */
/* 颜色按标签名取，保证同一个标签在书架、笔记胶囊、选择器里颜色一致 */
function tagColor(t){
  let h = 0;
  for(const c of String(t||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return TAG_COLORS[h % TAG_COLORS.length];
}
function tagOf(n){ return Array.isArray(n.tags) ? n.tags : []; }
/* 历史标签 = 所有笔记（含回收站）用过的 + 本机记住的新建标签。
   笔记本身的 tags 会随云同步走，所以其它设备建过的标签也会出现在这里。 */
function allTags(){
  const set = new Set();
  (S.tagLibrary||[]).forEach(t=>{ if(t) set.add(t); });
  S.notes.forEach(n=>{ if(!n.deleted) tagOf(n).forEach(t=>{ if(t) set.add(t); }); });
  return [...set];
}
function tagCount(t){
  return S.notes.filter(n=>!n.trashed && !n.deleted && tagOf(n).includes(t)).length;
}
/* 左侧标签树只列「当前确实有笔记在用」的标签；
   单篇笔记的选择器仍用 allTags()，能翻出摘掉过的历史标签 */
function usedTags(notes){
  const set = new Set();
  notes.forEach(n=>tagOf(n).forEach(t=>{ if(t) set.add(t); }));
  return [...set];
}
/* 删除标签 = 把它从所有笔记上摘掉，笔记本身保留 */
function deleteTag(t){
  if(!t || t === NO_TAG) return;
  const affected = S.notes.filter(n=>tagOf(n).includes(t));
  if(!confirm('删除标签「'+t+'」？\n\n会从 '+affected.length+' 篇笔记上移除这个标签，笔记本身不会删除。')) return;
  const now = Date.now();
  affected.forEach(n=>{ n.tags = tagOf(n).filter(x=>x!==t); n.updatedAt = now; });
  S.tagLibrary = (S.tagLibrary||[]).filter(x=>x!==t);
  if(S.tagClosed) delete S.tagClosed[t];
  renderAll(); save();
  toast('已删除标签「'+t+'」，'+affected.length+' 篇笔记已更新');
}
function openTagMenu(anchor, t){
  if(!t || t === NO_TAG) return;
  popover(anchor, [
    ['#', `<div class="po-note">会从 ${tagCount(t)} 篇笔记上移除「${esc(t)}」，笔记本身保留。</div>`],
    ['删除标签', '', 'danger', 'trash', ()=>deleteTag(t)]
  ]);
}
/* 「没有标签」是一个虚拟分组，用内部 key，避免和真实标签重名 */
const NO_TAG = '__no_tag__';
let NO_TAG_LABEL = '没有标签';
const tagGroupName = k => k === NO_TAG ? NO_TAG_LABEL : k;
function tagGroupNotes(k, notes){
  return k === NO_TAG ? notes.filter(n=>!tagOf(n).length) : notes.filter(n=>tagOf(n).includes(k));
}
function isTagGroupOpen(k){
  return !(S.tagClosed && S.tagClosed[k]);      // 默认展开，收起过的记在 S.tagClosed 里
}
function tagNoteRow(n){
  return `<button class="note-item ${n.id===S.active?'active':''}" data-open="${n.id}">
    ${ic('file')}<span class="t">${esc(n.title||'无标题')}</span>
  </button>`;
}
function rememberTag(t){
  if(!t) return;
  if(!Array.isArray(S.tagLibrary)) S.tagLibrary = [];
  if(!S.tagLibrary.includes(t)) S.tagLibrary.push(t);
}
function toggleNoteTag(t){
  const n = noteById(S.active); if(!n || !t) return;
  const arr = tagOf(n); n.tags = arr.slice();
  const i = n.tags.indexOf(t);
  if(i >= 0) n.tags.splice(i, 1);
  else { n.tags.push(t); rememberTag(t); }
  n.updatedAt = Date.now();
  renderMeta(); renderShelf(); save();
}

function renderShelf(){
  brandName.textContent = S.view==='notes' ? '小胡小胡的笔记' : (S.view==='media' ? '媒体库' : '关系图');

  if(S.view==='media'){ shelfBody.innerHTML = mediaShelf(); bindShelf(); return; }
  if(S.view==='graph'){ shelfBody.innerHTML = graphShelf(); bindShelf(); return; }

  const notes = liveNotes();
  const trash = S.notes.filter(n=>n.trashed);
  let html = `<div class="sec-label"><span>笔记</span><span class="count">${notes.length}</span></div>`;
  html += `<button class="shelf-row new-nb" data-act="new-nb">${ic('plus')}<span class="t">新建笔记本</span></button>`;

  const byNb = {};
  notes.filter(n=>n.notebookId).forEach(n=>{ (byNb[n.notebookId] = byNb[n.notebookId]||[]).push(n); });
  const loose = notes.filter(n=>!n.notebookId);

  function noteRow(n){
    const dots = tagOf(n).slice(0,3).map(t=>`<span class="dot-tag" style="background:${tagColor(t)}"></span>`).join('');
    return `<button class="note-item ${n.id===S.active?'active':''}" data-open="${n.id}">
      ${ic('file')}<span class="t">${esc(n.title||'无标题')}</span>
      ${dots?`<span class="tags">${dots}</span>`:''}
    </button>`;
  }

  S.notebooks.filter(nb=>!nb.deleted).forEach(nb=>{
    const list = byNb[nb.id]||[];
    html += `<div class="nb-group">
      <div class="nb-row">
        <button class="nb-head ${nb.open?'open':''}" data-nb="${nb.id}">
          <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
          <span class="t">${esc(nb.name)}</span><span class="meta">${list.length}</span>
        </button>
        <button class="nb-more" data-nbmenu="${nb.id}" title="重命名 / 删除">${ic('more')}</button>
      </div>
      <div class="nb-notes ${nb.open?'':'hidden'}">${list.map(noteRow).join('')}</div>
    </div>`;
  });

  if(loose.length) html += `<div class="nb-notes" style="padding-left:0">${loose.map(noteRow).join('')}</div>`;

  // 笔记本下面：标签分类（每个标签可展开，列出打了该标签的笔记）
  const keys = usedTags(notes);
  // 万一真有标签名叫「没有标签」，虚拟分组临时改名，避免左侧出现两行同名
  NO_TAG_LABEL = keys.includes('没有标签') ? '未添加标签' : '没有标签';
  keys.push(NO_TAG);                                   // 固定分组
  keys.sort((a,b)=> tagGroupName(a).localeCompare(tagGroupName(b), 'zh-CN'));
  const secOpen = !S.tagSectionClosed;
  const tagTree = keys.map(k=>{
    const list = tagGroupNotes(k, notes);
    const open = isTagGroupOpen(k);
    const virtual = k === NO_TAG;
    return `<div class="tag-group">
      <div class="tag-line">
        <button class="shelf-row tag-row ${open?'open':''}" data-tagfold="${esc(k)}">
          <span class="tag-caret">&#9654;</span>
          <span class="tag-hash" style="color:${virtual?'rgb(var(--faint))':tagColor(k)}">#</span>
          <span class="t">${esc(tagGroupName(k))}</span><span class="meta">${list.length}</span>
        </button>
        ${virtual ? '' : `<button class="tag-more" data-tagmenu="${esc(k)}" title="标签操作">${ic('more')}</button>`}
      </div>
      ${open ? `<div class="tag-notes">${list.length
        ? list.map(tagNoteRow).join('')
        : `<div class="tag-empty">这个标签下还没有笔记</div>`}</div>` : ''}
    </div>`;
  }).join('');
  html += `<div class="tag-sec">
    <button class="tag-sec-head ${secOpen?'open':''}" data-act="toggle-tag-sec">
      <span class="caret">&#9654;</span>${ic('tag')}<span>标签</span>
    </button>
    ${secOpen ? `<div class="tag-groups">${tagTree}</div>` : ''}
  </div>`;

  html += `<div style="height:6px"></div>
    <button class="shelf-row" data-act="trash">${ic('trash')}<span class="t">回收站</span><span class="meta">${trash.length}</span></button>`;
  shelfBody.innerHTML = html;
  bindShelf();
}

function bindShelf(){
  shelfBody.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openNote(b.dataset.open));
  shelfBody.querySelectorAll('[data-tagfold]').forEach(b=>{
    b.onclick=()=>{
      const k = b.dataset.tagfold;
      if(!S.tagClosed || typeof S.tagClosed !== 'object') S.tagClosed = {};
      if(S.tagClosed[k]) delete S.tagClosed[k]; else S.tagClosed[k] = true;
      renderShelf(); save();
    };
    b.oncontextmenu = e=>{ e.preventDefault(); openTagMenu(b, b.dataset.tagfold); };
  });
  shelfBody.querySelectorAll('[data-tagmenu]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); openTagMenu(b, b.dataset.tagmenu); };
  });
  shelfBody.querySelectorAll('[data-nb]').forEach(b=>{
    const nb = S.notebooks.find(x=>x.id===b.dataset.nb);
    if(!nb) return;
    b.onclick = ()=>{ nb.open = !nb.open; nb.updatedAt = Date.now(); renderShelf(); save(); };
    b.oncontextmenu = e=>{ e.preventDefault(); openNotebookMenu(b, nb.id); };

  shelfBody.querySelectorAll('[data-nbmenu]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); openNotebookMenu(b, b.dataset.nbmenu); };
  });
  shelfBody.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{

/* ========== 笔记操作 ========== */
function newNote(notebookId){
  const now = Date.now();
  const n = {id:'n'+now.toString(36), title:'', body:'', notebookId:notebookId||null,
    tags:[], trashed:false, createdAt:now, updatedAt:now};
  S.notes.unshift(n); S.active = n.id;
  if(!S.tabs.includes(n.id)) S.tabs.push(n.id);
  S.view = 'notes';
  renderAll(); save();
  setTimeout(()=>{ const t=$('#docTitle'); if(t) t.focus(); }, 30);
  return n;
}
function openNote(id){
  const n = noteById(id); if(!n) return;
  if(n.trashed){ toast('该笔记在回收站中'); return; }
  trashView = false;
  S.active = id; S.view='notes';
  if(!S.tabs.includes(id)) S.tabs.push(id);
  renderAll(); save();
}
function closeTab(id){
  const i = S.tabs.indexOf(id); if(i<0) return;
  S.tabs.splice(i,1);
  if(S.active===id) S.active = S.tabs[Math.max(0,i-1)] || null;
  renderAll(); save();
}
function newNotebook(){
  const name = prompt('笔记本名称', '新笔记本');
  if(!name || !name.trim()) return;
  const now = Date.now();
  const nb = {id:'nb'+now.toString(36), name:name.trim(), open:true, deleted:false, updatedAt:now};
  S.notebooks.push(nb);
  renderAll(); save(); toast('已创建笔记本「'+nb.name+'」');
}
function renameNotebook(id){
  const nb = S.notebooks.find(x=>x.id===id); if(!nb) return;
  const name = prompt('重命名笔记本', nb.name);
  if(name==null) return;
  const v = name.trim(); if(!v || v===nb.name) return;
  nb.name = v; nb.updatedAt = Date.now();
  renderAll(); save(); toast('已重命名');
}
function delNotebook(id){
  const nb = S.notebooks.find(x=>x.id===id); if(!nb || nb.deleted) return;
  const count = S.notes.filter(n=>n.notebookId===id && !n.trashed).length;
  const msg = count
    ? '删除笔记本「'+nb.name+'」？\n里面的 '+count+' 篇笔记会移到「未归类」，不会丢失。'
    : '删除笔记本「'+nb.name+'」？';
  if(!confirm(msg)) return;
  const now = Date.now();
  S.notes.forEach(n=>{ if(n.notebookId===id){ n.notebookId = null; n.updatedAt = now; } });
  nb.deleted = true; nb.open = false; nb.updatedAt = now;
  renderAll(); save();
  toast(count ? '已删除笔记本，'+count+' 篇笔记移到未归类' : '已删除笔记本「'+nb.name+'」');
}
function openNotebookMenu(anchor, id){
  const nb = S.notebooks.find(x=>x.id===id); if(!nb) return;
  popover(anchor, [
    ['重命名', '', '', 'pencil', ()=>renameNotebook(id)],
    ['在这建一篇笔记', '', '', 'plus', ()=>{
      if(!nb.open){ nb.open = true; nb.updatedAt = Date.now(); }
      newNote(id);
    }],
    '-',
    ['删除笔记本', '', 'danger', 'trash', ()=>delNotebook(id)]
  ]);
}
function toggleTrash(id){
  const n = noteById(id); if(!n) return;
  n.trashed = !n.trashed; n.updatedAt = Date.now();

    S.tabs = S.tabs.filter(t=>t!==id);

/* 双栏：以标题为锚点对齐左右，段内按比例插值。
   纯比例联动会让两边越滚越偏（源码一行 = 渲染后一段带间距），锚点法每个标题处严格对齐。*/
let SPLIT_ANCH = null;
function invalidateSplitAnchors(){ SPLIT_ANCH = null; }
function buildSplitAnchors(){
  const n = noteById(S.active);
  const src = document.getElementById('source');
  const prose = document.getElementById('prose');
  if(!n || !src || !prose) return null;
  const body = n.body || '';
  // 左栏是 textarea，它的滚动是按「折行后的行数」走的，所以要先估算每行能放几个字符
  const cs = getComputedStyle(src);
  let perLine = 60;
  try{
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const chW = ctx.measureText('0123456789').width / 10 || (parseFloat(cs.fontSize)*0.6);
    const usable = Math.max(40, src.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0));
    perLine = Math.max(8, Math.floor(usable / chW));
  }catch(e){}
  const headRows = [];
  let row = 0;
  body.split('\n').forEach(ln=>{
    if(/^#{1,6}\s+/.test(ln)) headRows.push(row);
    row += Math.max(1, Math.ceil(ln.length / perLine));
  });
  const totalRows = Math.max(1, row);
  const els = [...prose.querySelectorAll('h1,h2,h3,h4,h5,h6')];
  const m = Math.min(headRows.length, els.length);
  // 右栏用「可滚动范围」做分母：scrollTop=0 时标题正好在顶部
  const maxTo = Math.max(1, prose.scrollHeight - prose.clientHeight);
  const base = prose.getBoundingClientRect().top - prose.scrollTop;
  const out = [{ lf:0, rf:0 }];
  for(let i=0;i<m;i++){
    const top = els[i].getBoundingClientRect().top - base;
    out.push({ lf: headRows[i] / totalRows, rf: Math.min(1, Math.max(0, top / maxTo)) });
  }
  out.push({ lf:1, rf:1 });
  out.sort((a,b)=>a.lf-b.lf);
  // 保证 rf 单调不减，避免个别错位把映射拽回去
  for(let i=1;i<out.length;i++) out[i].rf = Math.max(out[i].rf, out[i-1].rf);
  return out;
}
function mapSplitPos(fromEl, toEl, anchors, reverse){
  const maxFrom = Math.max(1, fromEl.scrollHeight - fromEl.clientHeight);
  const maxTo = Math.max(1, toEl.scrollHeight - toEl.clientHeight);
  const f = Math.min(1, Math.max(0, fromEl.scrollTop / maxFrom));
  const A = reverse ? anchors.map(a=>({f:a.rf, t:a.lf})) : anchors.map(a=>({f:a.lf, t:a.rf}));
  let i = 0;
  while(i < A.length-1 && A[i+1].f <= f) i++;
  const a = A[i], b = A[Math.min(i+1, A.length-1)];
  const span = (b.f - a.f) || 1;
  const k = Math.min(1, Math.max(0, (f - a.f) / span));
  return Math.min(maxTo, Math.max(0, (a.t + (b.t - a.t) * k) * maxTo));
}
function wireSplitSync(){
  const src = document.getElementById('source');
  const prose = document.getElementById('prose');
  if(!src || !prose) return;
  let lock = 0;
  const bind = (a, b, reverse)=>{
    a.addEventListener('scroll', ()=>{
      const now = (window.performance || Date).now();
      if(now - lock < 22) return;          // 22ms 内不再响应，挡掉自己触发的回声
      const maxA = a.scrollHeight - a.clientHeight;
      const maxB = b.scrollHeight - b.clientHeight;
      if(maxA <= 4 || maxB <= 4) return;
      if(!SPLIT_ANCH) SPLIT_ANCH = buildSplitAnchors();
      if(!SPLIT_ANCH) return;
      lock = now;
      b.scrollTop = mapSplitPos(a, b, SPLIT_ANCH, reverse);
    }, { passive:true });
  };
  bind(src, prose, false);
  bind(prose, src, true);
}
window.addEventListener('resize', ()=>{ SPLIT_ANCH = null; }, { passive:true });

/* 标题下的标签选择器：列出所有历史标签，勾选即加上/去掉；也能直接新建 */
function openTagPicker(anchor){
  const n = noteById(S.active); if(!n) return;
  popover(anchor, [
    ['#', `<div class="tag-pick">
      <div class="tp-search"><input id="tpIn" placeholder="搜索或新建标签…" autocomplete="off" spellcheck="false"></div>
      <div class="tp-list" id="tpList"></div>
    </div>`]
  ], { align:'left' });
  const po = $('#popover');
  const inp = po.querySelector('#tpIn');
  const list = po.querySelector('#tpList');
  if(!inp || !list) return;

  const createTag = t=>{
    t = String(t||'').trim().slice(0, 60); if(!t) return;
    const cur = noteById(S.active); if(!cur) return;
    const arr = tagOf(cur); cur.tags = arr.slice();
    if(!cur.tags.includes(t)){
      cur.tags.push(t); rememberTag(t); cur.updatedAt = Date.now();
      renderMeta(); renderShelf(); save();
    }
    inp.value = ''; paint(); inp.focus();
  };

  function paint(){
    const q = (inp.value||'').trim();
    const ql = q.toLowerCase();
    const mine = tagOf(noteById(S.active) || {});
    const all = allTags().sort((a,b)=> tagCount(b)-tagCount(a) || a.localeCompare(b,'zh-CN'));
    const shown = ql ? all.filter(t=>t.toLowerCase().includes(ql)) : all;
    const exact = all.some(t=>t.toLowerCase() === ql);
    let html = shown.map(t=>`
      <button class="tp-row ${mine.includes(t)?'on':''}" data-tag="${esc(t)}">
        <span class="tp-dot" style="background:${tagColor(t)}"></span>
        <span class="t">${esc(t)}</span><span class="n">${tagCount(t)}</span>
        <span class="ck">${mine.includes(t)?'✓':''}</span>
      </button>`).join('');
    if(q && !exact) html += `<button class="tp-row tp-create" data-new="${esc(q)}">
        <span class="tp-plus">+</span><span class="t">新建「${esc(q)}」</span></button>`;
    if(!html) html = `<div class="tp-none">${q ? '没有匹配的标签，回车可新建' : '还没有标签，输入名称后回车新建'}</div>`;
    list.innerHTML = html;
    list.querySelectorAll('[data-tag]').forEach(b=>{
      b.onmousedown = e=>e.preventDefault();
      b.onclick = ()=>{ toggleNoteTag(b.dataset.tag); paint(); inp.focus(); };
    });
    list.querySelectorAll('[data-new]').forEach(b=>{
      b.onmousedown = e=>e.preventDefault();
      b.onclick = ()=>createTag(b.dataset.new);
    });
  }

  inp.oninput = paint;
  inp.onkeydown = e=>{
    if(e.key === 'Escape'){ e.preventDefault(); po.classList.remove('open'); return; }
    if(e.key === 'Enter'){
      e.preventDefault();
      const q = (inp.value||'').trim(); if(!q) return;
      const all = allTags();
      const hit = all.find(t=>t.toLowerCase() === q.toLowerCase());
      if(hit){ toggleNoteTag(hit); inp.value = ''; paint(); inp.focus(); }
      else createTag(q);
    }
  };
  paint();
  setTimeout(()=>{ if(po.classList.contains('open')) inp.focus(); }, 30);
}

function countWords(md){
  const t = md.replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\-\|\[\]()!]/g,'').replace(/\s+/g,'');

}

function hex2rgb(h){
  let s = String(h||'').replace('#','').trim();
  if(s.length === 3) s = s.split('').map(c=>c+c).join('');
  const n = parseInt(s, 16);
  if(isNaN(n) || s.length !== 6) return [128,128,128];
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function hlInline(hex){
  const [r,g,b] = hex2rgb(hex);
  const dark = (S && S.theme === 'dark');
  const a = dark ? .30 : .20;
  const t = dark ? 255 : 0, p = dark ? .60 : .42;
  const fg = `rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`;
  return `background:rgba(${r},${g},${b},${a});color:${fg}`;
}

/* 选区落在哪一段 ==高亮== 里？返回整段区间，否则 null。
   用整篇扫描而不是看相邻字符，才能正确处理「整段连标记一起选中」的情况。 */
function markSpan(v, s, e){
  const re = /==([^=\n]+)==(?:\{(?:\.[a-z]+|c:#[0-9a-fA-F]{3,8})\})?/g;
  let m;
  while((m = re.exec(v))){
    const st = m.index, en = m.index + m[0].length;
    if(s >= st && e <= en) return { start: st, end: en, text: m[1] };
  }
  return null;
}

function applyFormat(kind, opt){
  const n = S.active ? noteById(S.active) : null;
  if(!n) return;
  const doc = document.getElementById('doc');
  if(!doc) return;

  let src = document.activeElement;
  if(!(src && src.classList && src.classList.contains('blk-src'))){
    src = curMode()==='live' ? ensureLiveInput() : document.getElementById('source');
  }
  if(!src) return;
  const inLive = src.classList.contains('blk-src');
  const prevMode = curMode();
  if(!inLive && prevMode!=='source'){ /* 源码气泡里本来就能插 */ }

  let v = src.value;
  let s = src.selectionStart, e = src.selectionEnd;
  if(typeof s !== 'number'){ s = e = v.length; }
  // 只有「文本框没被聚焦」时才插到末尾；双栏/源码里要尊重光标位置
  if(!inLive && document.activeElement !== src){ s = e = v.length; }
  const sel = v.slice(s, e);
  let wantWiki = false;
  let ns = s, ne = e;
  const setRange = (a,b)=>{ ns = a; ne = b; };
  const wrapSel = (before, after, ph)=>{
    const text = sel || ph || '';
    v = v.slice(0,s) + before + text + after + v.slice(e);
    setRange(s + before.length, s + before.length + text.length);
  };
  const prefixLines = (prefix)=>{
    const lineStart = v.lastIndexOf('\n', s-1) + 1;
    const tail = Math.max(s, e);
    let blockEnd = v.indexOf('\n', tail);
    if(blockEnd === -1) blockEnd = v.length;
    const block = v.slice(lineStart, blockEnd);
    const nb = block.split('\n').map(line=>{
      const bare = line.replace(/^\s*(#{1,6}\s+|-\s\[[ xX]\]\s+|[-*+]\s+|\d+\.\s+|>\s+)?/, '');
      return prefix + bare;
    }).join('\n');
    v = v.slice(0, lineStart) + nb + v.slice(blockEnd);
    // 空块只加了前缀：光标停在标记后面（别把前缀一起选中，否则一打字就被覆盖）
    if(!block.trim()) setRange(lineStart + nb.length, lineStart + nb.length);
    else setRange(lineStart, lineStart + nb.length);
  };

  switch(kind){
    case 'h1': prefixLines('# '); break;
    case 'h2': prefixLines('## '); break;
    case 'h3': prefixLines('### '); break;
    case 'h4': prefixLines('#### '); break;
    case 'h5': prefixLines('##### '); break;
    case 'h6': prefixLines('###### '); break;
    case 'b': wrapSel('**','**','加粗文字'); break;
    case 'i': wrapSel('*','*','斜体文字'); break;
    case 's': wrapSel('~~','~~','删除线'); break;
    case 'mark': {
      const c = opt || '';
      const tail = c ? (c.charAt(0) === '#' ? `=={c:${c}}` : `=={.${c}}`) : '==';
      const sp = markSpan(v, s, e);
      if(sp){
        // 已经在高亮里（选区包含标记 / 标记紧贴选区两端）→ 只换颜色或去色，绝不再套一层
        v = v.slice(0, sp.start) + '==' + sp.text + tail + v.slice(sp.end);
        setRange(sp.start + 2, sp.start + 2 + sp.text.length);
      } else {
        wrapSel('==', tail, '高亮文字');
      }
      break;
    }
    case 'mark-clear': {
      const sp = markSpan(v, s, e);
      if(sp){
        v = v.slice(0, sp.start) + sp.text + v.slice(sp.end);
        setRange(sp.start, sp.start + sp.text.length);
      } else {
        const cleaned = sel.replace(/==([^=]+)==(?:\{(?:\.[a-z]+|c:#[0-9a-fA-F]{3,8})\})?/g, '$1');
        v = v.slice(0,s) + cleaned + v.slice(e);
        setRange(s, s + cleaned.length);
      }
      break;
    }
    case 'code': wrapSel('`','`','代码'); break;
    case 'ul': prefixLines('- '); break;
    case 'ol': prefixLines('1. '); break;
    case 'todo': prefixLines('- [ ] '); break;
    case 'quote': prefixLines('> '); break;
    case 'wiki': {
      if(sel){
        // 选中了文字 → 直接包成 [[文字]]，不弹面板
        v = v.slice(0,s) + '[[' + sel + ']]' + v.slice(e);
        setRange(s + 2, s + 2 + sel.length);
      } else {
        v = v.slice(0,s) + '[[' + v.slice(e);
        setRange(s + 2, s + 2);
        wantWiki = true;
      }
      break;
    }
    case 'link': {
      const text = sel || '链接文字';
      const url = 'https://';
      const ins = '[' + text + '](' + url + ')';
      v = v.slice(0,s) + ins + v.slice(e);
      const a = s + 1 + text.length + 2;
      setRange(a, a + url.length);
      break;
    }
    case 'table': {
      const tpl = '\n| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n';
      v = v.slice(0,s) + tpl + v.slice(e);
      setRange(s + tpl.length, s + tpl.length);
      break;
    }
    case 'pre': {
      const body = sel || '代码';
      const head = '\n```\n';
      v = v.slice(0,s) + head + body + '\n```\n' + v.slice(e);
      const a = s + head.length;
      setRange(a, a + body.length);
      break;
    }
    case 'hr': {
      const ins = '\n\n---\n\n';
      v = v.slice(0,s) + ins + v.slice(e);
      setRange(s + ins.length, s + ins.length);
      break;
    }
    default: return;
  }

  src.value = v;
  try{ src.setSelectionRange(ns, ne); }catch(e2){}
  src.focus();
  if(wantWiki && inLive) detectWiki(src);

  if(inLive){
    const i = parseInt(src.dataset.i, 10) || 0;
    LIVE.raws[i] = v;
    growTa(src);
    syncBody();
    // 只加了前缀、还没写正文 → 留在编辑态，用灰字提示该写什么；写过了就立刻渲染
    const barePrefix = /^(?:#{1,6}|- \[ \]|[-*+]|\d+\.|>)\s*$/.test(v);
    if(barePrefix){
      // 让输入框（和提示）直接用这类块渲染后的字号，写起来所见即所得
      const st = probeBlockStyle(kind);
      if(st){
        src.style.fontSize = st.fontSize;
        src.style.lineHeight = st.lineHeight;
        src.style.fontWeight = st.fontWeight;
        src.style.fontFamily = st.fontFamily;
        growTa(src);
      }
      updateBlockHint(src);
    }else if(['h1','h2','h3','h4','h5','h6','ul','ol','todo','quote','table','hr','pre'].includes(kind)){
      commitBlock(i);
    }
  } else {
    src.style.height = 'auto';
    src.style.height = Math.max(src.scrollHeight, 240) + 'px';
    n.body = v; n.updatedAt = Date.now();
    renderMeta(); renderOutline(); save();
    if(curMode()==='split') livePreviewSoon();
  }
}
