async function ensureCalData(force){
  if(!isConnected()){
    CAL.err = '还没登录账号';
    CAL.loading = false;
    paintCalendar();
    return;
  }
  const from = new Date(CAL.y, CAL.m-2, 1).getTime();
  const to = new Date(CAL.y, CAL.m+1, 1).getTime();
  const key = from + '~' + to;
  if(!force && CAL.key === key){ paintCalendar(); return; }
  CAL.loading = true; CAL.err = '';
  paintCalendar();
  try{
    const d = await apiCall('/api/calevents?from=' + from + '&to=' + to);
    CAL.events = d.events || [];
    CAL.key = key;
    CAL.loading = false;
    apiCall('/api/calevents?meta=1').then(mm=>{ CAL.meta = mm; paintCalShell(); }).catch(()=>{});
  }catch(e){
    CAL.loading = false;
    CAL.err = e.status === 401 ? '登录后才有日历' : (e.message || '读取失败');
  }
  paintCalendar();
}

function renderCalendar(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  scrollEl.style.display = '';
  if(!CAL.y){ const t = new Date(); CAL.y = t.getFullYear(); CAL.m = t.getMonth()+1; }
  // 先按本机快照画：换设备登录同一个笔记账号时，这里已经是「已连接」，
  // 不用等接口回来才变，也不会闪一下「同步苹果日历」的登录按钮
  if(CAL.dav === null){ const c = calCacheLoad(); if(c){ CAL.dav = c; CAL.davAt = 0; } }
  paintCalendar();
  paintCalShell();          // 中栏的迷你月历跟着换月 / 换选中日
  ensureCalData(false);
  // 一分钟内不重复问；刚登录 / 刚断开时 CAL.dav 会被置空，下次进来自动重取
  if(CAL.dav === null || Date.now() - (CAL.davAt || 0) > 60000){
    loadCalDav().then(()=>{
      if(S.view !== 'calendar') return;
      paintCalShell(); paintCalendar();
      // 进日历页顺手拉一次 iCloud（3 分钟内刚同步过就跳过），
      // 这样在苹果日历里改完，回到网页不用专门点「同步」
      const dav = CAL.dav || {};
      if(dav.connected && !CAL.authBad && !CAL.autoSyncing && Date.now() - (dav.lastSync||0) > 180000){
        CAL.autoSyncing = true;
        calSync(null, true).finally(()=>{ CAL.autoSyncing = false; });
      }
    });
  }
}

function renderGraph(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  scrollEl.style.display='';
  const notes = S.notes.filter(n=>!n.trashed);
  scrollEl.innerHTML = `<div id="graphWrap">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-zoom">
        <button data-z="in">${ic('plus')}</button>
        <button data-z="out">${ic('minus')||'<path d="M5 12h14"/>'}</button>
        <button data-z="fit">${ic('fit')}</button>
      </div>
    </div>`;
  const wrap = $('#graphWrap'), cv = $('#graphCanvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  let W = Math.max(wrap.clientWidth, 320), H = Math.max(wrap.clientHeight, 320);
  const resize = ()=>{
    W = Math.max(wrap.clientWidth, 320); H = Math.max(wrap.clientHeight, 320);
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  };
  const nodes = notes.map((n,i)=>{
    const a = i/notes.length*6.283 - Math.PI/2;
    return {
      id:n.id, label:n.title||'无标题',
      x: W/2 + Math.cos(a)*Math.min(190, W/3),
      y: H/2 + Math.sin(a)*Math.min(150, H/3),
      vx:0, vy:0, r: n.id===S.active?7:5.5
    };
  });
  const idx = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const edges = [];
  notes.forEach(n=>{
    (n.body.match(/\[\[([^\]|]+)\]\]/g)||[]).forEach(m=>{
      const t = m.slice(2,-2).split('|')[0];
      const target = notes.find(x=>(x.title||'')===t);
      if(target && target.id!==n.id) edges.push({a:n.id,b:target.id});
    });
  });
  graphState = {nodes, edges, idx, zoom:1, ox:0, oy:0};

  function step(){
    const {nodes, edges} = graphState;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||1;
        const f = 5200/(d*d);
        a.vx -= dx/d*f; a.vy -= dy/d*f; b.vx += dx/d*f; b.vy += dy/d*f;
      }
    }
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
      const f=(d-150)*0.012;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    });
    nodes.forEach(n=>{
      n.vx += (W/2-n.x)*0.0022; n.vy += (H/2-n.y)*0.0022;
      n.vx*=0.86; n.vy*=0.86;
      n.x+=n.vx; n.y+=n.vy;
    });
  }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function draw(){
    const dark = document.documentElement.dataset.theme==='dark';
    ctx.clearRect(0,0,W,H);
    const {nodes,edges,zoom,ox,oy} = graphState;
    ctx.save(); ctx.translate(ox,oy); ctx.scale(zoom,zoom);
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      ctx.beginPath(); ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = dark? 'rgba(255,255,255,.13)':'rgba(16,24,32,.13)';
      ctx.lineWidth = 1; ctx.stroke();
    });
    nodes.forEach(n=>{
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832);
      const active = n.id===S.active;
      ctx.fillStyle = active ? (dark?'#56b482':'#287a52') : (dark?'#8a9096':'#a0a6ac');
      ctx.fill();
      if(active){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,6.2832);
        ctx.fillStyle = dark?'rgba(86,180,130,.16)':'rgba(40,122,82,.12)'; ctx.fill(); }
      ctx.font = '12px ' + css('--font-sans').replace(/"/g,'"');
      ctx.fillStyle = dark? 'rgba(232,235,238,.72)':'rgba(28,31,34,.66)';
      ctx.textAlign='center';
      ctx.fillText(n.label.length>14? n.label.slice(0,14)+'…':n.label, n.x, n.y+n.r+16);
    });
    ctx.restore();
  }
  let raf;
  function loop(t){ let k=0; while(k<2){ step(); k++; } draw(); }
  // 静置布局
  // 静置布局
  resize();
  for(let k=0;k<260;k++) step();
  draw();
  window.onresize = resize;

  wrap.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=b.dataset.z;
    if(z==='in') graphState.zoom=Math.min(2.5,graphState.zoom*1.2);
    if(z==='out') graphState.zoom=Math.max(.35,graphState.zoom/1.2);
    if(z==='fit'){ graphState.zoom=1; graphState.ox=0; graphState.oy=0; for(let k=0;k<120;k++) step(); }
    draw();
  });
  // 拖拽 / 平移
  let drag=null;
  wrap.addEventListener('pointerdown', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-ox)/graphState.zoom, my=(e.clientY-r.top-oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+8);
    drag = hit ? {type:'node', n:hit} : {type:'pan', x:e.clientX-ox, y:e.clientY-oy};
    wrap.classList.add('dragging');
  });
  window.onpointermove = e=>{
    if(!drag) return;
    if(drag.type==='pan'){ graphState.ox = e.clientX-drag.x; graphState.oy = e.clientY-drag.y; }
    else {
      const r = cv.getBoundingClientRect();
      drag.n.x = (e.clientX-r.left-graphState.ox)/graphState.zoom;
      drag.n.y = (e.clientY-r.top-graphState.oy)/graphState.zoom;
      drag.n.vx=drag.n.vy=0;
    }
    draw();
  };
  window.onpointerup = ()=>{
    if(drag && drag.type==='node'){ for(let k=0;k<90;k++) step(); draw(); }
    drag=null; wrap.classList.remove('dragging');
  };
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const old = graphState.zoom;
    const nz = Math.max(.35, Math.min(2.5, old * (e.deltaY>0? .92 : 1.085)));
    graphState.ox = mx - (mx-graphState.ox)*(nz/old);
    graphState.oy = my - (my-graphState.oy)*(nz/old);
    graphState.zoom = nz; draw();
  }, {passive:false});
  cv.addEventListener('click', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-graphState.ox)/graphState.zoom, my=(e.clientY-r.top-graphState.oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+9);
    if(hit) openNote(hit.id);
  });
  const gf = $('#graphFilter');
  if(gf) gf.oninput = ()=>{ /* 预留 */ };
}

/* ========== 视图切换 ========== */
/* 手机上从笔记视图切到别的视图时，记住当时是不是在「笔记页」，
   切回来按原样恢复，别把正在读的笔记换成列表 */
let M_READ_BACK = false;
function switchView(v){
  // 日程不再是独立视图：它就是「中栏显示待办列表」的笔记视图
  if(v === 'todo'){ openTodoList(); return; }
  if(v === 'notes' && ['todo','tags'].includes(S.scope || 'all')) S.scope = 'all';   // 从日程 / 标签列表切回笔记
  if(trashView) dropTrashedActive();
  S.view = v; trashView=false; S.listQuery = '';
  // 媒体库 / 关系图的左栏就是它们的导航（分类、筛选）。之前左栏要是被收起来了，
  // 进去就只剩一屏缩略图、连返回笔记的入口都没有 —— 这里强制展开
  if((v === 'media' || v === 'graph' || v === 'calendar') && window.innerWidth > 640) S.shelfOpen = true;
  hideSelBar();
  if(window.innerWidth <= 640){
    if(v === 'notes'){
      // 从媒体库 / 关系图点「‹ 返回笔记」时，抽屉可能还开着（刚在里面切过分类）：
      // 不收起的话回来看到的是一层菜单盖在笔记上，还得再点一下才能看正文
      shelfCloseIfDrawer();
      document.body.classList.toggle('m-read', M_READ_BACK);
      renderAll(); save();
      return;
    }
    // 待办 / 媒体库 / 关系图 / 日历在手机上也是整屏页：先开 m-read 再画，否则主区是 display:none
    // 从抽屉里点进来的（比如点「日历」），抽屉得一起收掉，否则整屏页被菜单盖着
    shelfCloseIfDrawer();
    M_READ_BACK = document.body.classList.contains('m-read');
    document.body.classList.add('m-read');
    renderAll(); save();
    return;
  }
  renderAll(); save();
}

/* ========== 主题 / 分享 / 导出 ========== */
function toggleTheme(){
  S.themeMode = (S.theme === 'dark') ? 'light' : 'dark';   // 手动切过一次就不再跟随系统
  S.theme = S.themeMode;
  // 图表是按主题画死的 SVG，换主题要清缓存重画（renderMain 里会重新渲染）
  MB_CACHE.clear();
  if(window.mermaid && MB_INITED){
    try{ window.mermaid.initialize(mbConfig()); }catch(e){}
  }
  applyTheme(); save(); renderMain();
  toast(S.theme==='dark'?'已切换到深色':'已切换到浅色');
}
/* 设置里选主题：auto / light / dark。切完把图表缓存清掉，正文重画一次 */
function setThemeMode(mode){
  S.themeMode = ['auto','light','dark'].includes(mode) ? mode : 'light';
  applyTheme();
  try{ MB_CACHE.clear(); }catch(e){}
  try{ if(window.mermaid && MB_INITED) window.mermaid.initialize(mbConfig()); }catch(e){}
  save();
  try{ renderMain(); }catch(e){}
}
/* 分享二维码悬浮卡片：扫码打开 + 链接地址 + 复制 / 取消分享 */
function showShareCard(url){
  const old = document.getElementById('shareOv'); if(old) old.remove();
  let qrImg = '';
  try{
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    qrImg = `<img class="sc-qr" src="${q.createDataURL(5, 8)}" alt="分享二维码">`;
  }catch(_){ qrImg = ''; }
  const n = noteById(S.active);
  const ov = document.createElement('div');
  ov.id = 'shareOv'; ov.className = 'share-ov';
  ov.innerHTML = `<div class="share-card" role="dialog" aria-label="分享笔记">
      <div class="sc-head"><span>分享笔记</span><span class="sc-x" id="scClose" title="关闭">×</span></div>
      ${qrImg}
      <p class="sc-hint">手机扫码打开，或复制链接发给朋友 · 对方可切换预览 / Markdown / 思维导图</p>
      <div class="sc-url" id="scUrl">${esc(url)}</div>
      <div class="sc-btns">
        <button class="sc-copy" id="scCopy">复制链接</button>
        ${n && n.shareSlug ? '<button class="sc-refresh" id="scRefresh">更新内容</button>' : ''}
        ${n && n.shareSlug ? '<button class="sc-unshare" id="scUnshare">取消分享</button>' : ''}
      </div>
      ${n && n.shareSlug ? '<p class="sc-note">链接会跟着笔记自动更新（同步到云端后生效）；想马上生效可以点「更新内容」。</p>' : ''}
    </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('show'));
  const close = ()=>{ ov.classList.remove('show'); setTimeout(()=>ov.remove(), 200); };
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.addEventListener('keydown', function esc1(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc1); } });
  ov.querySelector('#scClose').onclick = close;
  ov.querySelector('#scCopy').onclick = ()=>{
    navigator.clipboard.writeText(url).then(()=>toast('链接已复制'), ()=>toast(url));
    ov.querySelector('#scCopy').textContent = '已复制';
    setTimeout(()=>{ const b=document.getElementById('scCopy'); if(b) b.textContent='复制链接'; }, 1600);
  };
  const us = ov.querySelector('#scUnshare');
  if(us) us.onclick = async ()=>{ close(); await unshareNote(); };
  const rf = ov.querySelector('#scRefresh');
  if(rf) rf.onclick = async ()=>{
    rf.disabled = true; rf.textContent = '正在更新…';
    try{
      await pushShareSnapshot(noteById(S.active));
      rf.textContent = '已更新';
      setTimeout(()=>{ const b=document.getElementById('scRefresh'); if(b){ b.textContent='更新内容'; b.disabled=false; } }, 1600);
    }catch(e){
      rf.disabled = false; rf.textContent = '更新内容';
      toast('更新失败：' + (e.message || '网络错误'));
    }
  };
}
/* 把当前笔记内容写回分享快照（同一个 slug，链接不变） */
async function pushShareSnapshot(n){
  if(!n){ throw new Error('笔记不见了'); }
  const d = await apiCall('/api/share', {method:'POST', body:{noteId:n.id, title:n.title||'', body:n.body||''}});
  if(d && d.slug){ n.shareSlug = d.slug; save(); }
  return d;
}
async function shareNote(){
  const n = noteById(S.active); if(!n) return;
  if(!isConnected()){ toast('先连接账号，才能生成公开分享链接'); openSyncPanel(); return; }
  // 已经分享过：先把最新内容写回快照（否则链接里一直是第一次分享时的旧内容），链接地址不变
  if(n.shareSlug){
    toast('正在更新分享内容…');
    try{ await pushShareSnapshot(n); toast('分享内容已更新'); }
    catch(e){ toast('更新失败：' + (e.message || '网络错误')); }
    showShareCard(location.origin + '/s/' + n.shareSlug);
    return;
  }
  toast('正在生成分享链接…');
  try{
    const d = await apiCall('/api/share', {method:'POST', body:{noteId:n.id, title:n.title||'', body:n.body||''}});
    const url = location.origin + '/s/' + d.slug;
    n.shareSlug = d.slug; save();
    showShareCard(url);
    try{ await navigator.clipboard.writeText(url); }catch(e){}
  }catch(e){
    toast('分享失败：' + (e.message || '网络错误'));
  }
}
async function unshareNote(){
  const n = noteById(S.active); if(!n) return;
  if(!n.shareSlug){ toast('这篇笔记还没有分享链接'); return; }
  try{
    await apiCall('/api/share?noteId=' + encodeURIComponent(n.id), {method:'DELETE'});
    delete n.shareSlug; save(); toast('已取消分享，原链接已失效');
  }catch(e){
    toast('取消失败：' + (e.message || '网络错误'));
  }
}
function dateStamp(d){
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}

function noteDocHtml(n, extraHead){
  const title = esc(n.title || '无标题');
  const d = new Date(n.updatedAt || Date.now());
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<style>${EXPORT_CSS}</style>
${extraHead||''}
</head><body><article>
<h1 class="t">${title}</h1>
<div class="meta">${stamp}</div>
<div class="body">${(mdToHtml(n.body||'')||{}).html || ''}</div>
</article></body></html>`;
}
function safeName(n){
  const base = (n.title||'无标题').replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim() || '无标题';
  return base + ' ' + dateStamp();
}
function downloadBlob(html, name, mime){
  const blob = new Blob(['\ufeff' + html], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportHtml(){
  const n = noteById(S.active); if(!n) return;
  downloadBlob(noteDocHtml(n), safeName(n) + '.html', 'text/html;charset=utf-8');
  toast('已导出 ' + safeName(n) + '.html');
}
function exportWord(){
  const n = noteById(S.active); if(!n) return;
  const head = `<meta name="ProgId" content="Word.Document">
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->`;
  const html = noteDocHtml(n, head).replace('<html lang="zh-CN">','<html lang="zh-CN" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">');
  downloadBlob(html, safeName(n) + '.doc', 'application/msword');
  toast('已导出 ' + safeName(n) + '.doc（Word 可直接打开）');
}
function exportPdf(){
  const n = noteById(S.active); if(!n) return;
  const old = document.getElementById('printFrame'); if(old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'printFrame';
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  const doc = f.contentWindow.document;
  doc.open(); doc.write(noteDocHtml(n)); doc.close();
  const run = ()=>{
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('打印窗口打不开，请换个浏览器试试'); }
    setTimeout(()=>{ try{ f.remove(); }catch(e){} }, 60000);
  };
  const imgs = [...doc.images];
  let left = imgs.length;
  if(!left){ setTimeout(run, 350); return; }
  const tick = ()=>{ if(--left <= 0) setTimeout(run, 250); };
  imgs.forEach(im=>{ if(im.complete) tick(); else { im.onload = tick; im.onerror = tick; } });
  setTimeout(()=>{ if(left > 0) run(); }, 3500);
}
/* ========== 导出为长图（PNG） ==========
   不用截图库：自己拿 canvas 2D 排一遍版，iOS Safari 也能出图、不会被跨域图片污染。
   支持：标题 1–6、段落、有序 / 无序 / 嵌套列表、勾选框、引用、代码块、表格、分割线、
   本站上传的图片（data: 内嵌）；行内加粗 / 斜体 / 代码 / 高亮 / 链接 / 删除线 / 待办时间胶囊。
   太长的笔记自动按段落边界切成几张，文件名带 -1 / -2。 */
const LP_W = 750, LP_PAD = 52, LP_MAX_H = 9000, LP_MAX_AREA = 16.7e6;
const LP_SERIF = '"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif';
const LP_MONO = '"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC",monospace';
const LP_CV = document.createElement('canvas');
const LP_C = LP_CV.getContext('2d');

function lpPal(){
  return resolvedTheme() === 'dark'
    ? { bg:'#191b1e', ink:'#e8ebee', ink2:'#c3c8cd', muted:'#98a0a6', faint:'#70767c',
        line:'#2e3338', code:'#23272b', codeInk:'#dfe3e7', ivy:'#56b482', chip:'#22382c', quote:'#3b444b' }
    : { bg:'#ffffff', ink:'#1c1f22', ink2:'#3f444a', muted:'#6b7177', faint:'#9aa0a6',
        line:'#e6e9ec', code:'#f4f6f8', codeInk:'#33383d', ivy:'#287a52', chip:'#eef4f0', quote:'#cbd8d1' };
}
function lpFont(size, bold, mono, italic){
  return (italic ? 'italic ' : '') + (bold ? 700 : 400) + ' ' + size + 'px ' + (mono ? LP_MONO : LP_SERIF);
}
function lpRR(c, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr, y);
  c.arcTo(x+w, y, x+w, y+h, rr);
  c.arcTo(x+w, y+h, x, y+h, rr);
  c.arcTo(x, y+h, x, y, rr);
  c.arcTo(x, y, x+w, y, rr);
  c.closePath();
}
/* DOM → 行内片段（加粗 / 代码 / 高亮 / 链接 / 时间胶囊…） */
function lpRuns(node){
  const out = [];
  (function walk(el, st){
    el.childNodes.forEach(k=>{
      if(k.nodeType === 3){
        const t = k.nodeValue.replace(/\u00a0/g, ' ');
        if(t) out.push(Object.assign({}, st, {text:t}));
        return;
      }
      if(k.nodeType !== 1) return;
      const tag = k.tagName.toLowerCase();
      if(tag === 'svg' || tag === 'input' || tag === 'button' || tag === 'img') return;
      if(tag === 'br'){ out.push(Object.assign({}, st, {text:'\n'})); return; }
      if(k.classList && k.classList.contains('due-chip')){
        const label = (k.textContent || '').replace(/\s+/g, ' ').trim();
        if(label) out.push(Object.assign({}, st, {chip:true, text:label}));
        return;
      }
      const ns = Object.assign({}, st);
      if(tag === 'b' || tag === 'strong') ns.bold = true;
      if(tag === 'i' || tag === 'em') ns.italic = true;
      if(tag === 'del' || tag === 's') ns.strike = true;
      if(tag === 'code') ns.code = true;
      if(tag === 'a') ns.link = true;
      if(tag === 'mark') ns.mark = (k.className || '').replace('hl-', '') || 'green';
      walk(k, ns);
    });
  })(node, {});
  return out;
}
/* 断行用的最小单位：拉丁词整块、中文按字、空格可吞 */
function lpTokens(runs){
  const out = [];
  runs.forEach(r=>{
    if(r.chip){ out.push(Object.assign({}, r)); return; }
    if(r.text === '\n'){ out.push(Object.assign({}, r, {br:true, text:''})); return; }
    String(r.text).split(/(\s+)/).forEach(part=>{
      if(!part) return;
      if(/^\s+$/.test(part)){ out.push(Object.assign({}, r, {text:' ', space:true})); return; }
      (part.match(/[A-Za-z0-9@#_.\/%:+\-]+|[\s\S]/g) || []).forEach(s=>{
        out.push(Object.assign({}, r, {text:s}));
      });
    });
  });
  return out;
}
function lpW(tok, size){
  if(tok.chip){
    LP_C.font = '500 12.5px ' + LP_SERIF;
    return LP_C.measureText(tok.text).width + 16;
  }
  const s = tok.code ? size * 0.9 : size;
  LP_C.font = lpFont(s, tok.bold, tok.code, tok.italic);
  return LP_C.measureText(tok.text).width;
}
function lpWrap(toks, maxW, size){
  const lines = [];
  let cur = {items:[], w:0};
  toks.forEach(t=>{
    if(t.br){ if(cur.items.length) lines.push(cur); cur = {items:[], w:0}; return; }
    if(t.space && !cur.items.length) return;
    const w = lpW(t, size);
    if(cur.w + w > maxW && cur.items.length){
      lines.push(cur); cur = {items:[], w:0};
      if(t.space) return;
    }
    cur.items.push({tok:t, w:w});
    cur.w += w;
  });
  if(cur.items.length) lines.push(cur);
  return lines;
}
function lpPalMark(kind, pal){
  if(kind === 'yellow') return ['#fdf0c5', '#7a580c'];
  if(kind === 'pink')   return ['#fce2e5', '#9a2c3c'];
  if(kind === 'blue')   return ['#dbeafa', '#1c4e84'];
  if(kind === 'purple') return ['#ebe2f8', '#5e3a94'];
  if(kind === 'gray')   return ['#e9ecef', '#474e55'];
  if(kind === 'none')   return [null, pal.ink];
  return [pal.ivySoft, pal.ivy];
}
function lpDrawLine(c, line, x, baseline, size, pal, color, strikeAll){
  let cx = x;
  line.items.forEach(it=>{
    const t = it.tok;
    if(t.chip){
      const h = 21;
      c.fillStyle = pal.chip;
      lpRR(c, cx, baseline - 15.5, it.w, h, 10.5); c.fill();
      c.font = '500 12.5px ' + LP_SERIF;
      c.fillStyle = pal.ivy;
      c.textBaseline = 'alphabetic';
      c.fillText(t.text, cx + 8, baseline - 1.5);
      cx += it.w;
      return;
    }
    const s = t.code ? size * 0.9 : size;
    c.font = lpFont(s, t.bold, t.code, t.italic);
    if(t.mark){
      const mc = lpPalMark(t.mark, pal);
      if(mc[0]){ c.fillStyle = mc[0]; lpRR(c, cx - 2, baseline - size * 0.95, it.w + 4, size * 1.28, 3); c.fill(); }
    } else if(t.code){
      c.fillStyle = pal.code;
      lpRR(c, cx - 3, baseline - size * 0.92, it.w + 6, size * 1.26, 4); c.fill();
    }
    let col = pal.ink;
    if(t.link) col = pal.ivy;
    else if(t.code) col = pal.codeInk;
    else if(t.mark){ const mc = lpPalMark(t.mark, pal); if(mc[1]) col = mc[1]; }
    if(color) col = color;
    c.fillStyle = col;
    c.fillText(t.text, cx, baseline);
    if(t.link){
      c.strokeStyle = col; c.globalAlpha = .5; c.lineWidth = 1;
      c.beginPath(); c.moveTo(cx, baseline + 2.5); c.lineTo(cx + it.w, baseline + 2.5); c.stroke();
      c.globalAlpha = 1;
    }
    if(t.strike || strikeAll){
      c.strokeStyle = col; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(cx, baseline - size * 0.3); c.lineTo(cx + it.w, baseline - size * 0.3); c.stroke();
    }
    cx += it.w;
  });
}
/* 预加载内嵌图片：只有 data: 的才画，远程图会污染 canvas 导致导出失败 */
function lpPreload(host){
  const list = [...host.querySelectorAll('img')];
  return Promise.all(list.map(im=>new Promise(res=>{
    const src = im.getAttribute('src') || '';
    const out = {src:src, img:null};
    // 图床图片也要画进长图：data: 直接读，http(s) 走 CORS（R2 桶已放行本站域名）
    if(!/^(data:image\/|https?:\/\/)/i.test(src)){ res(out); return; }
    const el = new Image();
    if(!/^data:/i.test(src)) el.crossOrigin = 'anonymous';
    el.onload = ()=>{ out.img = el; res(out); };
    el.onerror = ()=>res(out);
    el.src = src;
  }))).then(arr=>{
    const map = new Map();
    arr.forEach(o=>map.set(o.src, o.img));
    return map;
  });
}
/* 排版：算出每个绘制块的位置，返回 ops（带 y）+ 总高 + 段落断点 */
function lpLayout(host, note, imgMap){
  const pal = lpPal();
  const W = LP_W, PAD = LP_PAD, innerW = W - PAD * 2;
  const ops = [], marks = [];
  let y = PAD;
  // 注意：绘制闭包会在排版全部算完之后才执行，所以每个闭包里只能用 const 捕获的坐标，
  // 不能直接引用会继续变化的 y（否则会画到最后一行去）
  const push = (fn, at)=>ops.push({y:at, fn:fn});

  // ---- 标题 ----
  {
    const size = 31;
    const lines = lpWrap(lpTokens([{text:note.title || '无标题', bold:true}]), innerW, size);
    lines.forEach(ln=>{
      const top = y, base = top + size;
      push(c=>{
        c.textBaseline = 'alphabetic';
        lpDrawLine(c, ln, PAD, base, size, pal, pal.ink);
      }, top);
      y += size * 1.4;
    });
  }
  // ---- 日期 / 字数 ----
  {
    const d = new Date(note.updatedAt || note.createdAt || Date.now());
    const stamp = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
    const meta = stamp + '　·　' + countWords(note.body || '') + ' 字';
    const top = y + 6, base = top + 15;
    push(c=>{
      c.font = lpFont(13.5, false); c.fillStyle = pal.faint; c.textBaseline = 'alphabetic';
      c.fillText(meta, PAD, base);
    }, top);
    y = top + 22;
  }
  // ---- 分隔线 ----
  {
    const top = y;
    push(c=>{
      c.strokeStyle = pal.line; c.lineWidth = 1;
      c.beginPath(); c.moveTo(PAD, top + 0.5); c.lineTo(W - PAD, top + 0.5); c.stroke();
    }, top);
    y += 30;
  }

  const flowText = (runs, opt)=>{
    const size = opt.size || 17;
    const lh = (opt.lh || 1.82) * size;
    const maxW = innerW - (opt.indent || 0);
    const x = PAD + (opt.indent || 0);
    if(opt.mt) y += opt.mt;
    if(opt.bold) runs = runs.map(r=>Object.assign({}, r, {bold:true}));
    const lines = lpWrap(lpTokens(runs), maxW, size);
    if(!lines.length){ y += lh * 0.4 + (opt.mb || 0); return; }
    marks.push(y);
    lines.forEach(ln=>{
      const top = y, base = top + size * 1.12;
      push(c=>{
        c.textBaseline = 'alphabetic';
        lpDrawLine(c, ln, x, base, size, pal, opt.color);
      }, top);
      y += lh;
    });
    if(opt.mb) y += opt.mb;
  };

  const addList = (listEl, depth)=>{
    const ordered = listEl.tagName.toLowerCase() === 'ol';
    let idx = 0;
    [...listEl.children].forEach(li=>{
      if(li.tagName.toLowerCase() !== 'li') return;
      idx++;
      const isTask = li.classList.contains('task');
      const box = isTask ? li.querySelector('input[type=checkbox]') : null;
      const done = !!(box && box.checked);
      const indent = 24 + depth * 26;
      const markW = isTask ? 26 : 24;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
      const runs = lpRuns(clone);
      const size = 17, lh = size * 1.78;
      const firstTop = y;
      y += 3;
      const baseY = y + 24;              // 首行基线
      // 勾选框 / 列表符号
      if(isTask){
        const bx = PAD + depth * 26, by = y + 5;
        push(c=>{
          if(done){
            c.fillStyle = pal.ivy; lpRR(c, bx, by, 15, 15, 4.5); c.fill();
            c.strokeStyle = (resolvedTheme() === 'dark' ? '#0f1a13' : '#ffffff');
            c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round';
            c.beginPath();
            c.moveTo(bx + 3.9, by + 7.9); c.lineTo(bx + 6.5, by + 10.5); c.lineTo(bx + 11.1, by + 5);
            c.stroke();
          }else{
            c.strokeStyle = pal.faint; c.lineWidth = 1.5;
            lpRR(c, bx + .75, by + .75, 13.5, 13.5, 4); c.stroke();
          }
        }, y);
      }else if((clone.textContent || '').trim()){
        const lx = PAD + depth * 26;
        const label = ordered ? (idx + '.') : '•';
        push(c=>{
          c.textBaseline = 'alphabetic';
          if(ordered){
            c.font = lpFont(15, false); c.fillStyle = pal.faint; c.textAlign = 'right';
            c.fillText(label, lx + 18, baseY);
            c.textAlign = 'left';
          }else{
            c.font = lpFont(17, false); c.fillStyle = pal.faint;
            c.fillText(label, lx + 5, baseY);
          }
        }, y);
      }
      const lines = lpWrap(lpTokens(runs), innerW - indent - markW, size);
      lines.forEach(ln=>{
        const base = y + 24;
        push(c=>{
          c.textBaseline = 'alphabetic';
          lpDrawLine(c, ln, PAD + indent + markW, base, size, pal, done ? pal.muted : pal.ink, done);
        }, y);
        y += lh;
      });
      y += 5;
      [...li.children].forEach(sub=>{
        const t = sub.tagName.toLowerCase();
        if(t === 'ul' || t === 'ol') addList(sub, depth + 1);
      });
      marks.push(firstTop);
    });
    y += 8;
  };

  const addTable = (tbl)=>{
    const rows = [...tbl.querySelectorAll('tr')];
    if(!rows.length) return;
    const ncol = Math.max(1, ...rows.map(r=>r.children.length));
    const colW = innerW / ncol, cs = 14.5, lh = cs * 1.58, cpad = 10;
    const grid = rows.map(r=>[...r.children].map(td=>{
      const bold = td.tagName.toLowerCase() === 'th';
      return {bold:bold, lines:lpWrap(lpTokens(lpRuns(td)), colW - cpad * 2, cs)};
    }));
    marks.push(y);
    y += 8;
    const top = y;
    const boxes = [];
    grid.forEach((row, ri)=>{
      const nlines = Math.max(1, ...row.map(c=>c.lines.length));
      const h = nlines * lh + cpad * 2;
      const rowTop = y;
      if(ri === 0){
        push(c=>{ c.fillStyle = pal.code; c.fillRect(PAD, rowTop, innerW, h); }, rowTop);
      }
      row.forEach((cell, ci)=>{
        const cx = PAD + ci * colW;
        cell.lines.forEach((ln, li)=>{
          const base = rowTop + cpad + lh * 0.78 + li * lh;
          push(c=>{
            c.textBaseline = 'alphabetic';
            lpDrawLine(c, ln, cx + cpad, base, cs, pal, cell.bold ? pal.ink : pal.ink2);
          }, rowTop);
        });
      });
      boxes.push([rowTop, h]);
      y += h;
    });
    // 最后统一画格线，避免压在文字上（bottom 必须固定下来，闭包执行时 y 已经跑到页脚了）
    const bottom = y;
    push(c=>{
      c.strokeStyle = pal.line; c.lineWidth = 1;
      for(let ci = 0; ci <= ncol; ci++){
        const cx = PAD + ci * colW;
        c.beginPath(); c.moveTo(cx + .5, top); c.lineTo(cx + .5, bottom); c.stroke();
      }
      boxes.forEach(([rt, h])=>{
        c.beginPath(); c.moveTo(PAD, rt + .5); c.lineTo(PAD + innerW, rt + .5); c.stroke();
        c.beginPath(); c.moveTo(PAD, rt + h - .5); c.lineTo(PAD + innerW, rt + h - .5); c.stroke();
      });
    }, top);
    y += 18;
  };

  const addImage = (im)=>{
    const src = im.getAttribute('src') || '';
    const el = imgMap.get(src);
    marks.push(y);
    y += 8;
    const top = y;
    if(el && el.naturalWidth){
      const w = Math.min(innerW, el.naturalWidth);
      const h = el.naturalHeight * (w / el.naturalWidth);
      push(c=>{
        c.save(); lpRR(c, PAD, top, w, h, 10); c.clip();
        c.drawImage(el, PAD, top, w, h); c.restore();
      }, top);
      y += h + 16;
    }else{
      push(c=>{
        c.fillStyle = pal.code; lpRR(c, PAD, top, innerW, 56, 10); c.fill();
        c.font = '400 13px ' + LP_MONO; c.fillStyle = pal.faint; c.textBaseline = 'alphabetic';
        c.fillText('图片（长图里省略）', PAD + 18, top + 33);
      }, top);
      y += 56 + 16;
    }
  };

  [...host.children].forEach(el=>{
    const tag = el.tagName.toLowerCase();
    if(el.classList.contains('md-blank')) return;
    if(/^h[1-6]$/.test(tag)){
      const lv = +tag[1];
      const size = lv === 1 ? 27 : lv === 2 ? 22 : lv === 3 ? 19 : 17;
      flowText(lpRuns(el), {size:size, lh:lv <= 2 ? 1.45 : 1.5, mt:lv === 1 ? 26 : 20, mb:8, color:pal.ink, bold:true});
      return;
    }
    if(tag === 'p'){
      const only = el.querySelector('img');
      if(only && !(el.textContent || '').trim()){ addImage(only); return; }
      flowText(lpRuns(el), {size:17, lh:1.86, mb:14});
      return;
    }
    if(tag === 'ul' || tag === 'ol'){ addList(el, 0); return; }
    if(tag === 'blockquote'){
      const top = y;
      y += 12;
      const inner = [...el.children].find(x=>x.tagName.toLowerCase() === 'p') || el;
      const lines = lpWrap(lpTokens(lpRuns(inner)), innerW - 36, 16.5);
      const bodyTop = y;
      lines.forEach(ln=>{
        const base = y + 22;
        push(c=>{ c.textBaseline = 'alphabetic'; lpDrawLine(c, ln, PAD + 20, base, 16.5, pal, pal.muted); }, y);
        y += 16.5 * 1.8;
      });
      const barH = Math.max(18, y - bodyTop - 2);
      push(c=>{
        c.fillStyle = pal.quote; lpRR(c, PAD + 3, bodyTop - 4, 3, barH, 2); c.fill();
      }, top);
      y += 16;
      return;
    }
    if(tag === 'pre'){
      const code = el.querySelector('code') || el;
      const text = (code.textContent || '').replace(/\t/g, '  ').replace(/\s+$/, '');
      const cs = 13.5, lh = cs * 1.68, cpad = 15;
      const lines = [];
      LP_C.font = '400 ' + cs + 'px ' + LP_MONO;
      text.split('\n').forEach(raw=>{
        if(!raw){ lines.push(''); return; }
        let rest = raw;
        while(rest.length){
          let cut = rest.length;
          while(cut > 1 && LP_C.measureText(rest.slice(0, cut)).width > innerW - cpad * 2) cut--;
          lines.push(rest.slice(0, cut));
          rest = rest.slice(cut);
        }
      });
      const h = Math.max(1, lines.length) * lh + cpad * 2;
      marks.push(y);
      y += 12;
      const top = y;
      push(c=>{ c.fillStyle = pal.code; lpRR(c, PAD, top, innerW, h, 10); c.fill(); }, top);
      lines.forEach((ln, i)=>{
        const base = top + cpad + lh * 0.78 + i * lh;
        push(c=>{
          c.font = '400 ' + cs + 'px ' + LP_MONO; c.fillStyle = pal.codeInk; c.textBaseline = 'alphabetic';
          c.fillText(ln, PAD + cpad, base);
        }, top);
      });
      y += h + 18;
      return;
    }
    if(tag === 'table'){ addTable(el); return; }
    if(tag === 'hr'){
      const top = y;
      marks.push(y);
      push(c=>{
        c.strokeStyle = pal.line; c.lineWidth = 1;
        c.beginPath(); c.moveTo(PAD + 1, top + 12.5); c.lineTo(PAD + innerW - 1, top + 12.5); c.stroke();
      }, top);
      y += 26;
      return;
    }
    if(tag === 'img'){ addImage(el); return; }
    flowText(lpRuns(el), {size:17, lh:1.86, mb:14});
  });

  // 页脚（品牌水印）已去掉：长图里只保留笔记正文
  y += PAD;

  return {ops:ops, height:y, marks:marks, pal:pal};
}

/* 按段落断点切片，太长的笔记分成几张，避免撞到浏览器的 canvas 上限 */
function lpSlices(height, marks){
  if(height <= LP_MAX_H) return [[0, height]];
  const cuts = marks.filter(v=>v > 0).sort((a,b)=>a-b);
  const out = [];
  let s = 0;
  while(s < height){
    let e = Math.min(height, s + LP_MAX_H);
    if(e < height){
      const cand = cuts.filter(v=>v > s + 300 && v <= e);
      if(cand.length) e = cand[cand.length-1];
    }
    out.push([s, e]);
    s = e;
  }
  return out;
}
function lpBuildCanvas(L, a, b, scale){
  const w = LP_W, h = b - a;
  if(!scale){
    scale = Math.min(2, Math.sqrt(LP_MAX_AREA / (w * h)), 16000 / h);
    scale = Math.max(1, Math.min(2, scale));
  }
  const topPad = a > 0 ? 26 : 0;      // 切片时给下一张留点顶部呼吸位，别顶着边开始
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * scale);
  cv.height = Math.round((h + topPad) * scale);
  const c = cv.getContext('2d');
  c.scale(scale, scale);
  c.fillStyle = L.pal.bg;
  c.fillRect(0, 0, w, h + topPad);
  c.translate(0, -a + topPad);
  L.ops.forEach(op=>{ if(op.y >= a - 4 && op.y <= b + 4) op.fn(c); });
  return cv;
}
async function lpRender(note){
  const host = document.createElement('div');
  host.innerHTML = (mdToHtml(note.body || '') || {}).html || '';
  const imgMap = await lpPreload(host);
  const L = lpLayout(host, note, imgMap);
  const slices = lpSlices(L.height, L.marks);
  // 多张时统一用同一个缩放，几张拼起来宽度才一致
  const maxH = Math.max(...slices.map(s=>s[1] - s[0]));
  let scale = Math.min(2, Math.sqrt(LP_MAX_AREA / (LP_W * maxH)), 16000 / maxH);
  scale = Math.max(1, Math.min(2, scale));
  const canvases = slices.map(s=>lpBuildCanvas(L, s[0], s[1], scale));
  return {canvases:canvases, title:note.title || '无标题'};
}
function lpSave(res){
  const base = (res.title || '无标题').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim() || '无标题';
  const multi = res.canvases.length > 1;
  res.canvases.forEach((cv, i)=>{
    cv.toBlob(b=>{
      if(!b){ toast('图片生成失败，换浏览器再试'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = base + ' ' + dateStamp() + (multi ? '-' + (i+1) : '') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    }, 'image/png');
  });
  toast(multi ? ('已保存 ' + res.canvases.length + ' 张长图') : '长图已保存');
}

/* ---- HTML → Markdown（导入用，够用的子集：标题/段落/列表/引用/代码/表格/行内样式/图片） ---- */
function htmlToMd(html){
  const doc = new DOMParser().parseFromString(String(html||''),'text/html');
  const root = doc.querySelector('article') || doc.querySelector('main') || doc.body;
  if(!root) return '';
  root.querySelectorAll('script,style,noscript,link,meta,nav,header,footer,aside,form,iframe').forEach(x=>x.remove());
  root.querySelectorAll(':scope > .meta').forEach(x=>x.remove());   // 自己导出的日期行

  const norm = s => String(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim();
  const BLOCK = /^(P|DIV|SECTION|ARTICLE|UL|OL|LI|TABLE|PRE|BLOCKQUOTE|H[1-6]|HR|FIGURE)$/;

  function inline(node){
    if(node.nodeType === 3) return node.nodeValue.replace(/\u00a0/g,' ');
    if(node.nodeType !== 1) return '';
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return '';
    const inner = [...node.childNodes].map(inline).join('');
    const core = inner.trim();
    switch(t){
      case 'BR': return '\n';
      case 'STRONG': case 'B': return core ? `**${core}**` : inner;
      case 'EM': case 'I': return core ? `*${core}*` : inner;
      case 'DEL': case 'S': case 'STRIKE': return core ? `~~${core}~~` : inner;
      case 'U': return inner;
      case 'MARK': {
        const cls = (typeof node.className === 'string' ? node.className : '');
        const mcls = cls.match(/hl-(yellow|pink|blue|purple|gray)/);
        let color = mcls ? mcls[1] : '';
        if(!color){
          const bg = (node.getAttribute('style')||'').match(/background(?:-color)?\s*:\s*([^;]+)/i);
          const v = bg ? bg[1].toLowerCase() : '';
          if(/fdf0c5|253,\s*240,\s*197/.test(v)) color = 'yellow';
          else if(/fce2e5|252,\s*226,\s*229/.test(v)) color = 'pink';
          else if(/dbeafa|219,\s*234,\s*250/.test(v)) color = 'blue';
          else if(/ebe2f8|235,\s*226,\s*248/.test(v)) color = 'purple';
          else if(/e9ecef|233,\s*236,\s*239/.test(v)) color = 'gray';
        }
        return core ? `==${core}==${color ? `{.${color}}` : ''}` : inner;
      }
      case 'CODE': return core ? '`' + core + '`' : inner;
      case 'A': {
        const href = node.getAttribute('href') || '';
        const txt = core || href;
        if(!href || /^(javascript:|#)/i.test(href)) return txt;
        return `[${txt}](${href})`;
      }
      case 'IMG': {
        const src = node.getAttribute('src') || '';
        const alt = node.getAttribute('alt') || '';
        return src ? `![${alt}](${src})` : '';
      }
      default: return inner;
    }
  }
  const inlineOf = el => norm([...el.childNodes].map(inline).join(''));

  const blocks = [];
  const push = s => { const v = String(s||'').replace(/\n{3,}/g,'\n\n').trim(); if(v) blocks.push(v); };

  function listMd(el, indent){
    const ordered = el.tagName === 'OL';
    let idx = 0;
    const rows = [];
    [...el.children].filter(c=>c.tagName==='LI').forEach(li=>{
      idx++;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
      const cb = clone.querySelector('input[type=checkbox]');
      const checked = !!(cb && (cb.hasAttribute('checked') || cb.checked));
      if(cb) cb.remove();
      const body = norm([...clone.childNodes].map(inline).join(''));
      const mark = cb ? `- [${checked?'x':' '}] ` : (ordered ? `${idx}. ` : '- ');
      rows.push(' '.repeat(indent) + mark + body);
      li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub=>{
        rows.push(listMd(sub, indent + 2));
      });
    });
    return rows.join('\n');
  }
  function tableMd(el){
    const rows = [...el.querySelectorAll('tr')];
    if(!rows.length) return '';
    const cellsOf = tr => [...tr.children].map(td=>norm(inlineOf(td)).replace(/\|/g,'\\|'));
    const head = cellsOf(rows[0]);
    const body = rows.slice(1).map(cellsOf);
    const out = [`| ${head.join(' | ')} |`, `| ${head.map(()=>'---').join(' | ')} |`];
    body.forEach(r=>out.push(`| ${r.join(' | ')} |`));
    return out.join('\n');
  }

  function walk(node, indent){
    if(node.nodeType === 3){
      const v = norm(node.nodeValue);
      if(v) push(v);
      return;
    }
    if(node.nodeType !== 1) return;
    const t = node.tagName;
    if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(t)) return;
    if(/^H[1-6]$/.test(t)){ push('#'.repeat(+t[1]) + ' ' + inlineOf(node)); return; }
    if(t === 'HR'){ push('---'); return; }
    if(t === 'PRE'){
      const code = node.querySelector('code');
      const cls = code ? (typeof code.className === 'string' ? code.className : '') : '';
      const lang = (cls.match(/lang-([\w-]+)/)||[])[1] || '';
      const text = (code || node).textContent.replace(/\n+$/,'');
      push('```' + lang + '\n' + text + '\n```');
      return;
    }
    if(t === 'BLOCKQUOTE'){
      const inner = [];
      const save = blocks.length;
      [...node.childNodes].forEach(c=>walk(c, indent));
      const got = blocks.splice(save);
      got.forEach(g=>inner.push(g.split('\n').map(l=>'> ' + l).join('\n')));
      push(inner.join('\n>\n'));
      return;
    }
    if(t === 'UL' || t === 'OL'){ push(listMd(node, indent)); return; }
    if(t === 'TABLE'){ const tb = tableMd(node); if(tb) push(tb); return; }
    if(t === 'IMG'){ const s = inline(node); if(s) push(s); return; }
    if(t === 'P' || t === 'DIV' || t === 'SECTION' || t === 'ARTICLE' || t === 'FIGURE' || t === 'FIGCAPTION'){
      const hasBlock = [...node.children].some(c=>BLOCK.test(c.tagName));
      if(hasBlock){ [...node.childNodes].forEach(c=>walk(c, indent)); }
      else { const v = inlineOf(node); if(v) push(v); }
      return;
    }
    if(t === 'BR'){ return; }
    if([...node.children].some(c=>BLOCK.test(c.tagName))){
      [...node.childNodes].forEach(c=>walk(c, indent));
    } else {
      const v = inlineOf(node);
      if(v) push(v);
    }
  }

  [...root.childNodes].forEach(n=>walk(n, 0));
  let md = blocks.join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
  // 正文开头的 H1 常与文件名重复，交给 importDoc 决定标题，这里先原样保留
  return md;
}

/* 以前点图片会进编辑态，源码里若是内嵌 base64，整张图的编码就铺满一屏（看着像乱码）。

/* ---- 导入：把内嵌图片搬上云 ----
   导入的 HTML 里图片常常直接内嵌（<img src="data:image/png;base64,...">）。
   原样留在 markdown 里会有两个后果：点一下块就看到几十万字符的编码，
   并且整篇正文很容易撞上 /api/sync 的 40 万字符上限，被从中间截断。
   所以导入后统一走 uploadMediaFile()，正文里只留 /api/media/... 短链接。 */
const IMG_EXT = {'image/png':'png','image/jpeg':'jpg','image/gif':'gif','image/webp':'webp',
  'image/svg+xml':'svg','image/bmp':'bmp','image/avif':'avif'};

/* 中文 HTML 常写 charset=gb2312/gbk，按 UTF-8 硬读会把整篇读成乱码 —— 先嗅一眼前 2KB */
function decodeImportBuffer(buf){
  let label = 'utf-8';
  try{
    const head = new TextDecoder('latin1').decode(new Uint8Array(buf, 0, Math.min(buf.byteLength, 2048))).toLowerCase();
    const m = /charset\s*=\s*["']?\s*([\w-]+)/.exec(head);
    if(m && m[1]) label = m[1];
  }catch(e){}
  if(/^(gb2312|gbk|gb18030)$/.test(label)) label = 'gb18030';
  try{ return new TextDecoder(label).decode(buf); }
  catch(e){ return new TextDecoder('utf-8').decode(buf); }
}

function dataUriToBlob(src){
  const m = /^data:([^;,]*)?(;base64)?,([\s\S]*)$/.exec(src);
  if(!m) return null;
  const type = m[1] || 'application/octet-stream';
  try{
    if(m[2]){
      const bin = atob(m[3].replace(/\s+/g,''));
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], {type});
    }
    return new Blob([new TextEncoder().encode(decodeURIComponent(m[3]))], {type});
  }catch(e){ return null; }
}

async function uploadIntakeBlob(blob, i){
  const type = blob.type || 'image/png';
  const ext = IMG_EXT[type] || (String(type).split('/')[1] || 'png').replace(/[^a-z0-9]/gi,'') || 'png';
  const up = await uploadMediaFile(new File([blob], 'import-' + (i+1) + '.' + ext, {type}));
  if(!up || !up.url) throw new Error('上传没有返回地址');
  return up.url;
}

/* 把 note.body 里的 data: / http(s) 图片换成上传后的短链接 */
async function absorbInlineImages(note){
  const md = String(note.body || '');
  const re = /!\[([^\]]*)\]\((data:[^)\s]+|https?:\/\/[^)\s]+)\)/g;
  const hits = [];
  let m;
  while((m = re.exec(md))) hits.push({ start:m.index, end:m.index + m[0].length, alt:m[1], src:m[2] });
  const res = { total:hits.length, uploaded:0, kept:0, failed:0 };
  if(!hits.length) return res;
  if(!isConnected()){ res.kept = hits.length; return res; }

  toast('正在搬运 ' + hits.length + ' 张图…');
  let out = '', last = 0;
  for(let k=0;k<hits.length;k++){
    const h = hits[k];
    let url = h.src;
    try{
      if(/^data:/i.test(h.src)){
        const blob = dataUriToBlob(h.src);
        if(!blob) throw new Error('解码失败');
        url = await uploadIntakeBlob(blob, k);
        res.uploaded++;
      }else{
        // 远程图也抓一份存到自己家，免得原站防盗链或删图后一片空白
        const resp = await fetch(h.src, {mode:'cors', credentials:'omit'});
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        if(!/^image\//.test(blob.type || '')) throw new Error('不是图片');
        url = await uploadIntakeBlob(blob, k);
        res.uploaded++;
      }
    }catch(err){
      res.failed++;   // 抓不到就保留原地址，至少还有机会显示
    }
    out += md.slice(last, h.start) + '![' + h.alt + '](' + url + ')';
    last = h.end;
  }
  out += md.slice(last);
  if(out !== md) note.body = out;
  return res;
}

function importDoc(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.md,.markdown,.txt,.html,.htm,.json';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    const isHtml = /\.html?$/i.test(f.name);
    let text = '';
    try{
      text = decodeImportBuffer(await f.arrayBuffer());
    }catch(e){
      text = await new Promise(res=>{
        const fr = new FileReader();
        fr.onload = ()=>res(String(fr.result || ''));
        fr.onerror = ()=>res('');
        fr.readAsText(f);
      });
    }
    if(!isHtml && importBackup(text)) return;   // JSON 全量备份走还原通道
    let title = f.name.replace(/\.\w+$/,'');
    let body = '';
    if(isHtml){
      const doc = new DOMParser().parseFromString(text,'text/html');
      const t = (doc.querySelector('title') && doc.querySelector('title').textContent || '').trim();
      const h1 = (doc.querySelector('h1') && doc.querySelector('h1').textContent || '').trim();
      title = t || h1 || title;
      body = htmlToMd(text);
      // 去掉和标题重复的首个 H1
      body = body.replace(/^#\s+.*\n?/, m => {
        const h = m.replace(/^#\s+/,'').trim();
        return h && h === title ? '' : m;
      }).trim();
    }else{
      // 先按分篇线拆开：导出的是「# 标题 + 正文」，篇与篇之间用 --- 隔开
      const chunks = splitMdNotes(text);
      if(chunks.length > 1){ await importMdChunks(chunks); return; }
      const only = chunks[0] || { title:'', body:text };
      title = only.title || title;
      body = only.body;
    }
    const nn = newNote();
    nn.title = title;
    nn.body = body;
    renderAll(); save();
    const moved = await absorbInlineImages(nn);
    if(moved.uploaded || moved.failed){
      nn.updatedAt = Date.now();
      save();
      if(LIVE.editing < 0) renderAll();   // 别打断正在打字的人，下次重绘自然就是短链接了
    }
    let tail = '';
    if(moved.uploaded) tail += ' · ' + moved.uploaded + ' 张图已转存';
    if(moved.failed) tail += ' · ' + moved.failed + ' 张没取到';
    if(moved.kept) tail += ' · ' + moved.kept + ' 张仍是内嵌（未登录）';
    toast('已导入「' + title + '」' + tail);
  };
  inp.click();
}
function importMd(){ importDoc(); }

/* ---- Markdown 分篇：只在「---」后面紧跟 # 标题时才算分篇线，
   这样笔记正文里自己写的分割线不会被误拆 ---- */
function splitMdNotes(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const chunks = [];
  let cur = [];
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if(/^\s*-{3,}\s*$/.test(ln)){
      let j = i + 1;
      while(j < lines.length && !lines[j].trim()) j++;
      if(j < lines.length && /^#\s+/.test(lines[j])){   // 分篇线
        chunks.push(cur); cur = []; i = j - 1; continue;
      }
    }
    cur.push(ln);
  }
  chunks.push(cur);
  return chunks.map(c=>{
    const buf = c.slice();
    while(buf.length && !buf[0].trim()) buf.shift();
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    let title = '';
    if(buf.length && /^#\s+/.test(buf[0])){ title = buf.shift().replace(/^#\s+/, '').trim(); }
    while(buf.length && !buf[0].trim()) buf.shift();
    return { title, body: buf.join('\n').trim() };
  }).filter(x=>x.title || x.body);
}
/* 多篇一起导入：一次建好、一次存盘，避免逐篇重绘 */
async function importMdChunks(chunks){
  const base = Date.now();
  const made = [];
  chunks.forEach((c, i)=>{
    // 时间戳倒着给：第一篇最新，书架按更新时间排时仍是原文顺序
    const now = base + (chunks.length - i);
    const n = { id:'n' + now.toString(36) + Math.random().toString(36).slice(2, 5),
      title: c.title || ('导入笔记 ' + (i + 1)), body: c.body || '',
      notebookId:null, tags:[], trashed:false, createdAt:now, updatedAt:now };
    made.push(n);
  });
  S.notes = made.concat(S.notes);
  S.view = 'notes'; trashView = false;
  S.active = made[0].id;
  if(!S.tabs.includes(S.active)) S.tabs.push(S.active);
  renderAll(); save();
  let up = 0, fail = 0;
  for(const n of made){
    if(n.body.indexOf('data:image') < 0) continue;
    const r = await absorbInlineImages(n);
    up += r.uploaded || 0; fail += r.failed || 0;
  }
  if(up || fail){ save(); renderAll(); }
  let tail = '';
  if(up) tail += ' · ' + up + ' 张图已转存';
  if(fail) tail += ' · ' + fail + ' 张没取到';
  toast('已导入 ' + made.length + ' 篇笔记' + tail);
}

function importBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ return false; }
  if(!d || d.app!=='ivynote' || !Array.isArray(d.notes)) return false;
  const now = Date.now();
  let nbAdded = 0, noteAdded = 0, skipped = 0;
  (d.notebooks||[]).forEach(nb=>{
    if(!nb || !nb.id || !nb.name) return;
    if(S.notebooks.find(x=>x.id===nb.id || (x.name===nb.name && !x.deleted))) return;
    S.notebooks.push(Object.assign({color:'', open:true, deleted:false, updatedAt:now}, nb));
    nbAdded++;
  });
  d.notes.forEach(n=>{
    if(!n || !n.id) return;
    if(S.notes.find(x=>x.id===n.id)){ skipped++; return; }
    S.notes.unshift({
      id:n.id, title:n.title||'', body:n.body||'', notebookId:n.notebookId||null,
      tags:Array.isArray(n.tags)?n.tags.slice():[], trashed:!!n.trashed,
      pinned:!!n.pinned, pinnedAt:n.pinnedAt||0,
      devices:Array.isArray(n.devices)?n.devices.slice():[],
      createdAt:n.createdAt||now, updatedAt:n.updatedAt||now });
    noteAdded++;
  });
  if(noteAdded || nbAdded){
    const lib = Array.isArray(S.tagLibrary) ? S.tagLibrary : [];
    S.notes.forEach(n=>{ if(!Array.isArray(n.tags)) n.tags=[]; (n.tags||[]).forEach(t=>{ if(t && !lib.includes(t)) lib.push(t); }); });
    S.tagLibrary = lib;
    renderAll(); save();
  }
  let msg = '已导入 '+noteAdded+' 篇笔记';
  if(nbAdded) msg += '、'+nbAdded+' 个笔记本';
  if(skipped) msg += ' · 跳过 '+skipped+' 篇已存在的';
  toast(msg);
  return true;
}

/* 锚点可能在打开菜单的过程中被重绘掉（同步、切换笔记都会 renderAll），
   这时 getBoundingClientRect 全是 0，菜单会飞左上角 —— 依次找回：同名元素 → 上次菜单位置 → 鼠标位置 */
let LAST_POINTER = { x: window.innerWidth - 80, y: 64 };
document.addEventListener('mousedown', e=>{ LAST_POINTER = { x:e.clientX, y:e.clientY }; }, true);
function liveAnchor(anchor, id){
  if(anchor && anchor.isConnected) return anchor;
  const again = id ? document.getElementById(id) : null;
  if(again) return again;
  // 找不到就地造一个不可见的锚点，位置取上次菜单展开处
  const ghost = document.createElement('div');
  const r = $('#popover')._lastRect || { left: LAST_POINTER.x - 1, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  ghost.style.cssText = `position:fixed;left:${r.right-2}px;top:${r.bottom}px;width:2px;height:2px;pointer-events:none;opacity:0`;
  document.body.appendChild(ghost);
  setTimeout(()=>ghost.remove(), 30000);
  return ghost;
}
/* 菜单必须压在所有东西上面。支持 Popover API 的浏览器直接把它塞进「顶层」（top layer），
   任何层叠上下文都盖不住它；不支持的老浏览器退回普通 fixed + 高 z-index（9000）。
   顺带解决 WKWebView 里浮层被正文文字压住、看着像「半透明」的问题。 */
function poIsOpen(po){ try{ return po.matches(':popover-open'); }catch(e){ return false; } }
function poOpen(po){
  if(!po) return;
  if(typeof po.showPopover === 'function' && !poIsOpen(po)){
    try{ po.showPopover(); }catch(e){}
  }
  po.classList.add('open');
}
function poClose(po){
  if(!po) return;
  po.classList.remove('open');
  if(typeof po.hidePopover === 'function' && poIsOpen(po)){
    try{ po.hidePopover(); }catch(e){}
  }
}
function popover(anchor, items, opts){
  const po = $('#popover');
  /* 同一个按钮上再点一次就是「收起」：否则点 mousedown 关掉、click 又开一遍，看着像收不回去 */
  if(anchor && po.classList.contains('open') && po._anchor === anchor && !(opts && opts.toggle === false)){
    poClose(po);
    anchor.classList.remove('on');
    po._anchor = null;
    if(po._off){ document.removeEventListener('mousedown', po._off); po._off = null; }
    return;
  }
  let r = null;
  if(anchor && anchor.isConnected) r = anchor.getBoundingClientRect();
  if(!r || (!r.width && !r.height)){
    const again = anchor && anchor.id ? document.getElementById(anchor.id) : null;
    if(again) r = again.getBoundingClientRect();
  }
  if((!r || (!r.width && !r.height)) && po._lastRect) r = po._lastRect;
  if(!r || (!r.width && !r.height)){
    r = { left: LAST_POINTER.x, right: LAST_POINTER.x, top: LAST_POINTER.y, bottom: LAST_POINTER.y };
  }
  po._lastRect = { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
  /* 菜单开着时，锚点按钮保持选中色（触屏上尤其需要：没有 hover，不然看不出点了哪个） */
  if(anchor && anchor.classList){
    if(po._anchor && po._anchor !== anchor) po._anchor.classList.remove('on');
    anchor.classList.add('on');
    po._anchor = anchor;
  }
  po.innerHTML = items.map((it,idx)=>{
    if(it[0]==='-') return '<div class="po-sep"></div>';
    if(it[0]==='#') return it[1];
    return `<button class="po-item ${it[2]||''}" data-i="${idx}">${it[3]?ic(it[3]):''}<span>${esc(it[0])}</span>${it[1]?`<span class="po-key">${it[1]}</span>`:''}</button>`;
  }).join('');
  poOpen(po);
  const pw = po.offsetWidth, ph = po.offsetHeight;
  const wantLeft = opts && opts.align === 'left' ? r.left : r.right - pw;
  po.style.left = Math.min(Math.max(12, wantLeft), window.innerWidth-pw-12)+'px';
  po.style.top = Math.min(r.bottom+6, window.innerHeight-ph-12)+'px';
  po.querySelectorAll('[data-i]').forEach(b=>{
    b.onmousedown = ev=>ev.preventDefault();   // 别把正文的选区/焦点抢走
    b.onclick = ()=>{
      const it = items[+b.dataset.i];
      poClose(po);
      if(po._anchor){ po._anchor.classList.remove('on'); po._anchor = null; }
      if(it[4]) it[4]();
    };
  });
  // 二级菜单会在同一个 #popover 上重绘，先把上一次的外部点击监听摘掉，避免越积越多
  if(po._off) document.removeEventListener('mousedown', po._off);
  const off = (ev)=>{
    if(po.contains(ev.target)) return;
    // 点在开菜单的那个按钮上：交给它自己的 click 去 toggle，别先关再开
    if(po._anchor && po._anchor.contains(ev.target)) return;
    {
      poClose(po);
      document.removeEventListener('mousedown', off);
      if(po._anchor){ po._anchor.classList.remove('on'); po._anchor = null; }
      if(po._off === off) po._off = null;
    }
  };
  po._off = off;
  setTimeout(()=>{ if(po._off === off) document.addEventListener('mousedown', off); }, 0);
}

function noteStats(n){

    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_`~|]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  const chars = plain.replace(/\s/g, '').length;
  const blocks = String(body).trim() ? parseBlocks(body).length : 0;
  const imgs = (body.match(/!\[[^\]]*\]\([^)]*\)/g) || []).length
             + (body.match(/\[\[file:[^\]]+\]\]/g) || []).length;

/* ========== 命令面板 ========== */
let paletteSel = 0, paletteRows = [];
function openPalette(){
  $('#overlay').classList.add('open');
  const inp = $('#paletteInput');
  inp.value=''; renderPalette(''); setTimeout(()=>inp.focus(),40);
}
function closePalette(){ $('#overlay').classList.remove('open'); }
function renderPalette(q){
  const query = q.trim().toLowerCase();
  const cmds = [
    {t:'新建笔记', h:'⌘N', icon:'plus', f:()=>{ closePalette(); newNote(); }},
    {t:'新建笔记本', h:'', icon:'book', f:()=>{ closePalette(); newNotebook(); }},
    {t:'切换明暗主题', h:'', icon:'moon', f:()=>{ closePalette(); toggleTheme(); }},
    {t:'打开媒体库', h:'', icon:'image', f:()=>{ closePalette(); switchView('media'); }},
    {t:'打开关系图', h:'', icon:'graph', f:()=>{ closePalette(); switchView('graph'); }},
    {t:'导入 Markdown', h:'', icon:'upload', f:()=>{ closePalette(); importMd(); }},
    {t:'导出当前笔记', h:'', icon:'download', f:()=>{ closePalette(); exportMd(); }},
    {t:'收起 / 展开书架', h:'⌘\\', icon:'panelLeft', f:()=>{ closePalette(); toggleShelf(); }}
  ].filter(c=>!query || c.t.toLowerCase().includes(query));
  const notes = liveNotes().filter(n=>!query || (n.title||'无标题').toLowerCase().includes(query) || n.body.toLowerCase().includes(query)).slice(0,8);

  // 待办 / 日程 / 标签 也一起搜（只有输入了关键字才列，空搜索还是只看笔记和命令）
  let todos = [], evs = [], tags = [];
  if(query){
    try{
      todos = collectTodos().filter(t => !t.done &&
        ((t.text||'').toLowerCase().includes(query) || (t.noteTitle||'').toLowerCase().includes(query))).slice(0, 6);
    }catch(e){}
    try{
      evs = ((CAL && CAL.events) || []).filter(ev => ev && (ev.title||'').toLowerCase().includes(query))
        .sort((a,b)=> (a.start||0) - (b.start||0)).slice(0, 6);
    }catch(e){}
    try{
      tags = tagPillKeys(liveNotes()).filter(k => k && k.toLowerCase().includes(query) && k !== NO_TAG_LABEL).slice(0, 6);
    }catch(e){}
  }

  paletteRows = [];
  let html='';
  if(notes.length){
    html += `<div class="p-group">笔记</div>`;
    notes.forEach(n=>{
      paletteRows.push({f:()=>{ closePalette(); openNote(n.id); }});
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic('file')}<span class="t">${esc(n.title||'无标题')}</span>
        <span class="h">${n.body.replace(/\s+/g,' ').slice(0,28)}</span></button>`;
    });
  }
  if(todos.length){
    html += `<div class="p-group">待办</div>`;
    todos.forEach(t=>{
      paletteRows.push({f:()=>{ closePalette(); jumpToTodo(t); }});
      const when = t.due ? dueChipLabel(t.due) : '无日期';
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic('todo')}<span class="t">${esc(t.text||'（空）')}</span>
        <span class="h">${esc(t.noteTitle||'')} · ${esc(when)}</span></button>`;
    });
  }
  if(evs.length){
    html += `<div class="p-group">日程</div>`;
    evs.forEach(ev=>{
      paletteRows.push({f:()=>{ closePalette(); gotoCalEvent(ev); }});
      const d = new Date(Number(ev.start)||Date.now());
      const when = (d.getMonth()+1) + '月' + d.getDate() + '日' + (ev.allDay ? ' 全天' : ' ' + calHm(ev.start));
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic('calendar')}<span class="t">${esc(ev.title||'（无标题）')}</span>
        <span class="h">${esc(when)}${ev.cal?' · '+esc(ev.cal):''}</span></button>`;
    });
  }
  if(tags.length){
    html += `<div class="p-group">标签</div>`;
    tags.forEach(k=>{
      paletteRows.push({f:()=>{ closePalette(); setScope('tag:' + k); }});
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic('tag')}<span class="t">#${esc(k)}</span></button>`;
    });
  }
  if(cmds.length){
    html += `<div class="p-group">命令</div>`;
    cmds.forEach(c=>{
      paletteRows.push({f:c.f});
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic(c.icon)}<span class="t">${c.t}</span>${c.h?`<span class="h">${c.h}</span>`:''}</button>`;
    });
  }
  if(!html) html = `<div class="p-empty">没有匹配结果</div>`;
  $('#paletteList').innerHTML = html;
  paletteSel = 0;
  paintPaletteSel();
  $('#paletteList').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>paletteRows[+b.dataset.p].f());
}
/* 搜索里点中一条日程：跳到日历页对应月份，并打开同样的详情卡片 */
function gotoCalEvent(ev){
  if(!ev) return;
  const d = new Date(Number(ev.start) || Date.now());
  CAL.y = d.getFullYear(); CAL.m = d.getMonth() + 1;
  try{ switchView('calendar'); }catch(e){ return; }
  setTimeout(()=>{
    try{
      const uid = String(ev.uid).replace(/"/g, '\\"');
      const el = document.querySelector('.cal-ev[data-calev="' + uid + '"]');
      if(el){ el.scrollIntoView({ block:'center' }); calShowEvent(ev.uid, el); }
    }catch(e){}
  }, 300);
}
function paintPaletteSel(){
  $('#paletteList').querySelectorAll('.p-row').forEach((r,i)=>r.classList.toggle('sel', i===paletteSel));
  const cur = $('#paletteList').querySelectorAll('.p-row')[paletteSel];
  if(cur) cur.scrollIntoView({block:'nearest'});
}

/* 侧栏收起后，侧栏头里那颗「主目录」也跟着没了：在别的视图（日历/媒体库/关系图）里
   补一颗浮动的，桌面上才有（手机/平板本来就有展开键或返回键）。
   位置直接复用折叠前那颗按钮的坐标，收起 / 展开不会跳位置 */
let HOME_FLOAT_POS = null;
function syncHomeFloat(){
  const f = $('#homeFloat');
  if(!f) return;
  // 侧栏展开时记下头部那颗按钮的位置（收起后它已经滑到屏幕外，量不准了）
  if(S.shelfOpen){
    const b = $('#btnHome');
    if(b && b.offsetParent !== null){
      const r = b.getBoundingClientRect();
      if(r.width && r.left > 0) HOME_FLOAT_POS = { left: Math.round(r.left), top: Math.round(r.top) };
    }
  }
  // 只在「没有中栏」的视图里需要它（媒体库 / 关系图）；日程待办有了中栏，
  // 中栏头上本来就有展开侧栏的按钮，再摆一颗浮动的会正好压在那排图标上
  const noList = (S.view === 'media' || S.view === 'graph');
  const show = !S.shelfOpen && noList && window.innerWidth > 900;
  f.classList.toggle('show', show);
  if(show){
    // 没有记录时（一打开就是收起状态）按侧栏宽度算：右侧四个 36 的图标贴着侧栏右边
    let p = HOME_FLOAT_POS;
    if(!p){
      const sw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--shelf-w')) || 296;
      p = { left: Math.max(8, Math.round(sw - 148)), top: 16 };
    }
    f.style.left = p.left + 'px';
    f.style.top = p.top + 'px';
  }
}
/* 直接把左边的书架收起来（不看屏幕宽度），手机抽屉和桌面并排都走这一条 */
function closeShelfNow(){
  if(!S.shelfOpen) return false;
  S.shelfOpen = false;
  const sh = document.querySelector('.shelf');
  if(sh) sh.classList.add('collapsed');
  document.body.classList.add('shelf-collapsed');
  const btn = $('#shelfOpen'); if(btn) btn.classList.add('show');
  syncHomeFloat();
  save();
  return true;
}
/* 窄屏（手机 / 手机横屏 / 小平板）上，手指一碰笔记区就把左边的笔记栏收起来：
   竖屏是盖在正文上的抽屉，收起不重排；横屏是并排的栏，收起等于把宽度还给正文。
   桌面上这一条不生效，桌面改由「点正文区」收起（见下面的 pointerup）。 */
function shelfCloseIfDrawer(){
  if(document.documentElement.clientWidth > 900) return false;   // 桌面不收
  return closeShelfNow();
}
// 等这一下点击（放光标、点链接、勾待办）走完再收起，避免侧栏一收、布局一变把点击吃掉
document.addEventListener('pointerup', e=>{
  const t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('.shelf')) return;                                 // 点抽屉自己不算
  if(t.closest('#nlOpen, #shelfOpen, #btnShelf, .nl-open')) return;  // 这几个按钮自己管开合
  if(!t.closest('.main-wrap, .notelist')) return;                 // 只认笔记区与笔记列表
  setTimeout(()=>{
    if(shelfCloseIfDrawer()) return;
    // 桌面：只有点在右边正文区才收起左边菜单（点中栏列表不动）。
    // 顶部标签栏和右上角那排按钮不算：它们会弹浮层，浮层定位在按钮上，
    // 收侧栏会让按钮位移、浮层飘到别处。正在拖选文字时也不动，免得选区被重排打散。
    if(!t.closest('.paper')) return;
    // 只在笔记页生效：媒体库、关系图的左栏是导航（分类 / 筛选），点图就把它收掉会卡在那儿出不来
    if((S.view || 'notes') !== 'notes') return;
    if(t.closest('.paper-actions')) return;                       // 右上那排按钮会弹浮层，别让浮层跟着漂
    if(t.closest('.tabbar') && t.closest('button')) return;       // 页签 / 新建 / 更多都不算「点正文」
    try{ if(String(window.getSelection() || '')) return; }catch(err){}
    closeShelfNow();
  }, 0);
}, true);
document.addEventListener('keydown', e=>{
  const meta = e.metaKey || e.ctrlKey;
  const overlayOpen = $('#overlay').classList.contains('open');
  if(overlayOpen){
    if(e.key==='Escape'){ e.preventDefault(); closePalette(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel = Math.min(paletteSel+1, paletteRows.length-1); paintPaletteSel(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel = Math.max(paletteSel-1, 0); paintPaletteSel(); return; }
    if(e.key==='Enter'){ e.preventDefault(); paletteRows[paletteSel]?.f(); return; }
  }
  /* 格式化快捷键：和「Markdown 与快捷键」面板里写的保持一致 */
  if(meta && !e.altKey){
    const code = e.code || '';
    if(e.shiftKey){
      if(code === 'KeyX'){ e.preventDefault(); applyFormat('s'); return; }
      if(code === 'KeyH'){ e.preventDefault(); applyFormat('mark'); return; }
      if(code === 'KeyK'){ e.preventDefault(); applyFormat('wiki'); return; }
      if(code === 'Digit9'){ e.preventDefault(); applyFormat('todo'); return; }
      if(code === 'Digit8'){ e.preventDefault(); applyFormat('ul'); return; }
      if(code === 'Digit7'){ e.preventDefault(); applyFormat('ol'); return; }
    } else {
      if(code === 'KeyB'){ e.preventDefault(); applyFormat('b'); return; }
      if(code === 'KeyI'){ e.preventDefault(); applyFormat('i'); return; }
    }
  } else if(meta && e.altKey){
    const code = e.code || '';
    if(code === 'Digit1'){ e.preventDefault(); applyFormat('h1'); return; }
    if(code === 'Digit2'){ e.preventDefault(); applyFormat('h2'); return; }
    if(code === 'Digit3'){ e.preventDefault(); applyFormat('h3'); return; }
  }
  if(meta && e.key === '/'){ e.preventDefault(); openInsertMenu($('#nlNew') || $('#tabbar')); return; }
  if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(meta && e.key.toLowerCase()==='n'){ e.preventDefault(); newNote(); return; }
  if(meta && e.key==='\\'){ e.preventDefault(); toggleShelf(); return; }
  if(meta && e.shiftKey && e.key.toLowerCase()==='e'){ e.preventDefault(); setMode(curMode()==='source' ? 'live' : 'source'); return; }
  if(meta && e.key.toLowerCase()==='e'){ e.preventDefault(); toggleMode(); return; }
  if(e.altKey && e.key.toLowerCase()==='w'){ e.preventDefault(); if(S.active) closeTab(S.active); return; }
  if(e.key==='Escape'){ poClose($('#popover')); closeExportPanel(); closeSlashMenu(); closeMindMap(); hideSelBar(); if(syncPanelOpen) closeSyncPanel(); if(typeof closeNoteInfo==='function') closeNoteInfo(); if(typeof closeSettings==='function') closeSettings(); if(typeof closeTokenPanel==='function') closeTokenPanel(); if(typeof closeLogoutSheet==='function') closeLogoutSheet(); }
});

/* ========== 账号与云同步 ========== */
const SYNC_STORE = 'ivy.sync';
const SYNC = { token:'', account:'', key:'', state:'off', last:0, error:'', vip:false, vipUntil:0 };
try{
  const raw = localStorage.getItem(SYNC_STORE);
  if(raw){
    const s = JSON.parse(raw);
    SYNC.token = s.token||''; SYNC.account = s.account||''; SYNC.key = s.key||''; SYNC.last = s.last||0;
    SYNC.vip = !!s.vip; SYNC.vipUntil = s.vipUntil||0;
    if(SYNC.token || SYNC.key) SYNC.state = 'idle';
  }
}catch(e){}
function syncSave(){

    }))

function mergeDevices(a, b){
  const m = new Map();
  [...(a || []), ...(b || [])].forEach(d=>{
    if(!d || !d.id) return;
    const cur = m.get(d.id);
    if(!cur || (d.at || 0) > (cur.at || 0)) m.set(d.id, { id:d.id, label:d.label || (cur && cur.label) || '', at:d.at || 0 });
  });
  return [...m.values()].sort((x,y)=>(y.at || 0) - (x.at || 0)).slice(0, 5);
}
function applyRemote(data){
  let changed = false;
  // 刚在本地「彻底删除」、墓碑还没推到服务端的笔记：这一轮拉取必须无视它，
  // 否则云端那条旧的（还在回收站里的）记录会被原样塞回来，看起来就是清空失败
  const pending = new Set(S.pendingDeletes || []);
  const map = new Map(S.notes.map(n=>[n.id,n]));
  for(const r of (data.notes||[])){
    if(pending.has(r.id)) continue;
    if(!Array.isArray(r.tags)) r.tags = [];       // 兼容老客户端/老数据
    const cur = map.get(r.id);
    // 云端说这篇已经彻底删了：本地立刻移除（包括还躺在回收站里的那份），
    // 不能只是打个 deleted 标记等后面过滤，回收站列表是按 trashed 列的
    if(r.deleted){
      if(cur){ S.notes = S.notes.filter(n=>n.id!==r.id); map.delete(r.id); changed = true; }
      continue;
    }
    if(!cur){
      S.notes.push(r); changed = true;
    }
    else if((r.updatedAt||0) > (cur.updatedAt||0)){
      const oldDevs = Array.isArray(cur.devices) ? cur.devices : [];
      Object.assign(cur, r);
      cur.devices = mergeDevices(oldDevs, Array.isArray(r.devices) ? r.devices : []);
      changed = true;
    }
  }
  const nbm = new Map(S.notebooks.map(n=>[n.id,n]));
  for(const r of (data.notebooks||[])){
    const cur = nbm.get(r.id);
    if(!cur){
      S.notebooks.push(Object.assign({deleted:false, updatedAt:0, parentId:null, order:0}, r));
      changed = true;
    }
    else {
      const newer = (r.updatedAt||0) > (cur.updatedAt||0);
      const same  = (r.updatedAt||0) === (cur.updatedAt||0);
      const diff  = cur.name!==r.name || cur.open!==r.open || !!cur.deleted!==!!r.deleted
                    || (cur.color||'')!==(r.color||'')
                    || (cur.parentId||null)!==(r.parentId||null) || (cur.order||0)!==(cur.order||0);
      if(newer || (same && diff)){
        /* 层级只认云端「明确给出」的值：老服务端不带 parentId、或那一行还是 NULL 时，
           不能把本机已经收好的二级关系抹平，否则同步一次笔记本就全跑回一级 */
        const cP = cur.parentId || null, cO = cur.order || 0;
        const curLock = cur.lock || null;
        const hasLock = Object.prototype.hasOwnProperty.call(r, 'lock');
        const hasP = Object.prototype.hasOwnProperty.call(r, 'parentId');
        const rP = hasP ? (r.parentId || null) : null;
        Object.assign(cur, r);
        if(!hasP || (rP === null && !newer)){ cur.parentId = cP; cur.order = cO; }
        else { cur.parentId = rP; cur.order = Number(r.order) || 0; }
        if(!hasLock) cur.lock = curLock;        // 云端没这个字段，别把本机密码锁抹掉
        changed = true;
      }
    }
  }
  // 待办归档：整块按 archiveAt 后写覆盖（以前只存本机，换设备就变成 0）
  const remotePrefs = data && data.prefs;
  if(remotePrefs && Array.isArray(remotePrefs.todoArchived)){
    const remoteAt = Number(remotePrefs.archiveAt) || 0;
    if(remoteAt > Number(S.todoArchivedAt || 0)){
      S.todoArchived = remotePrefs.todoArchived;
      S.todoArchivedAt = remoteAt;
      changed = true;
    }
  }
  // 把云端同步过来的标签也记进历史库，之后即使从笔记上摘掉也还能再选
  if(changed){
    const lib = Array.isArray(S.tagLibrary) ? S.tagLibrary : [];
    S.notes.forEach(n=>tagOf(n).forEach(t=>{ if(t && !lib.includes(t)) lib.push(t); }));
    S.tagLibrary = lib;
  }
  return changed;
}

let syncDirty = false, syncFails = 0, syncRetryTimer = null;

function scheduleRetry(){
  clearTimeout(syncRetryTimer);
  const delay = Math.min(30000, 1500 * Math.pow(2, Math.min(syncFails, 4)));
  syncRetryTimer = setTimeout(()=>{ syncRetryTimer = null; syncNow(); }, delay);
}

async function syncNow(opts={}){
  if(!isConnected() || syncBusy) return;
  syncBusy = true;
  syncDirty = false;
  const firstTime = !SYNC.last;
  SYNC.state = 'busy'; SYNC.error = ''; renderDock(); updateSyncBadge();
  try{
    // 本机内嵌的图片先补传到图床，别把几十兆的 base64 一股脑推给服务器
    try{ await migrateInlineImages(); }catch(e){}
    if(firstTime){
      // 首次连接：云端已有数据时，丢弃本机示例笔记，避免污染服务器
      const pre = await api('GET');
      if((pre.notes||[]).filter(x=>!x.deleted).length){
        S.notes = S.notes.filter(n=>!n.seed);
        applyRemote(pre);
      }
    }
    const payload = localPayload();
    // 这次请求真正带上去的墓碑。清空回收站时如果刚好有一次同步在路上，
    // 之前会把「请求发出后才删的」也一起清掉，墓碑就永远送不出去 → 下一篇拉取又回来了
    const sentTombs = new Set(S.pendingDeletes || []);
    const data = await api('POST', payload);
    const changed = applyRemote(data);
    S.notes = S.notes.filter(n=>!n.deleted);
    S.pendingDeletes = (S.pendingDeletes || []).filter(id => !sentTombs.has(id));
    SYNC.last = Date.now(); SYNC.state = 'ok'; SYNC.error = '';
    syncFails = 0; clearTimeout(syncRetryTimer); syncRetryTimer = null;
    syncSave();
    renderAfterSync(changed, opts.rerender);
    persistLocal();
    refreshVip(false);
  }catch(e){
    SYNC.state = 'error';
    SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
    if(e.status !== 401){ syncFails++; syncDirty = true; scheduleRetry(); }
    renderDock();
  }finally{
    syncBusy = false;
    updateSyncBadge();
    if(syncPanelOpen) paintSyncPanel();
    if(syncDirty && SYNC.state !== 'error'){
      clearTimeout(syncTimer);
      syncTimer = setTimeout(()=>syncNow(), 120);
    }
  }
}
function queueSync(){
  try{ if(!isConnected()) return; }catch(e){ return; }
  syncDirty = true;
  if(SYNC.state !== 'busy'){ SYNC.state = 'pending'; renderDock(); }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 800);
  updateSyncBadge();
}

function flushSync(){
  if(!isConnected() || syncBusy || !syncDirty) return;
  try{
    fetch('/api/sync', {
      method: 'POST', keepalive: true,
      headers: authHeaders(true),
      body: JSON.stringify(localPayload())
    }).then(()=>{ syncDirty = false; }).catch(()=>{});
  }catch(e){}
}

  if(!isConnected() || syncBusy || document.hidden) return;

    // 桌面端/手机上定时器都可能被挂起，把还没送出去的墓碑补发一次

  }catch(e){
    SYNC.state = 'error'; SYNC.error = e.status===401 ? '登录已过期，请重新输入密码' : (e.message||'网络错误');
