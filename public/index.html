<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>随手笔记</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#287a52" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="随手笔记" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23287A52'/%3E%3Crect x='9.6' y='6.4' width='12.8' height='19.2' rx='2.6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M13.1 12.4h5.8M13.1 16h5.8M13.1 19.6h3.4' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
/* ============ tokens（取自 ivyNote 真实配色） ============ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  --shelf-w:296px;
  --shelf-w-drawer:min(72vw,280px);   /* 手机抽屉：别占满整屏，右边留一截正文能看见 */
  --spring:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-hover:31 104 69; --ivy-soft:229 243 235; --on-ivy:255 255 255; --ivy-ink:27 92 60;
  --warn:190 134 48; --warn-ink:110 78 26; --warn-soft:252 244 228;
  --danger:176 62 54; --danger-soft:252 235 233;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
  --shadow-float:0 0 0 .5px rgb(16 24 32 / .06),0 2px 6px rgb(16 24 32 / .05),0 12px 28px -10px rgb(16 24 32 / .14);
  --shadow-lift:0 0 0 .5px rgb(16 24 32 / .07),0 8px 16px -6px rgb(16 24 32 / .08),0 32px 64px -16px rgb(16 24 32 / .22);
  --tag-green-fg:#3f7a5b; --tag-blue-fg:#4f6a9a; --tag-amber-fg:#a0702c; --tag-pink-fg:#a65a7c; --tag-gray-fg:#6f767d; --tag-purple-fg:#7a62a8;
  --hl-green-bg:229 243 235; --hl-green-fg:27 92 60;
  --hl-yellow-bg:253 240 197; --hl-yellow-fg:122 88 12;
  --hl-pink-bg:252 226 229; --hl-pink-fg:154 44 60;
  --hl-blue-bg:219 234 250; --hl-blue-fg:28 78 132;
  --hl-purple-bg:235 226 248; --hl-purple-fg:94 58 148;
  --hl-gray-bg:233 236 239; --hl-gray-fg:71 78 85;
}
[data-theme=dark]{
  color-scheme:dark;
  --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
  --ink:232 235 238; --ink-2:190 195 200; --muted:142 148 154; --faint:114 120 126;
  --line:44 48 52; --hover:38 41 45;
  --ivy:86 180 130; --ivy-hover:110 196 150; --ivy-soft:28 50 39; --on-ivy:10 28 18; --ivy-ink:150 224 182;
  --warn:214 170 98; --warn-ink:232 205 158; --warn-soft:48 40 26;
  --danger:226 128 116; --danger-soft:58 33 31;
  --code-bg:31 34 38;
  --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  --shadow-float:0 0 0 .5px rgb(255 255 255 / .07),0 12px 28px -10px rgb(0 0 0 / .6);
  --shadow-lift:0 0 0 .5px rgb(255 255 255 / .08),0 32px 64px -16px rgb(0 0 0 / .7);
  --tag-green-fg:#92c4a6; --tag-blue-fg:#9db2dc; --tag-amber-fg:#d9b77e; --tag-pink-fg:#dba6bf; --tag-gray-fg:#a3a9af; --tag-purple-fg:#bcaae0;
  --hl-green-bg:28 50 39; --hl-green-fg:150 224 182;
  --hl-yellow-bg:58 47 20; --hl-yellow-fg:240 214 128;
  --hl-pink-bg:58 30 34; --hl-pink-fg:240 168 176;
  --hl-blue-bg:24 42 64; --hl-blue-fg:150 196 240;
  --hl-purple-bg:44 34 60; --hl-purple-fg:196 176 240;
  --hl-gray-bg:44 47 51; --hl-gray-fg:190 195 200;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgb(var(--ivy) / .18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgb(var(--ink) / .13);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--ink) / .22);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.shell{display:flex;height:100dvh;overflow:hidden}

/* ============ shelf ============ */
.shelf{
  width:var(--shelf-w);flex:0 0 var(--shelf-w);display:flex;flex-direction:column;
  padding:8px 12px 12px;position:relative;transition:margin-left .34s var(--spring),opacity .2s;
}
/* 桌面：左栏也做成一张卡片，和列表、正文同一高度、同样的上下留白 */
@media (min-width:901px){
  .shelf{
    margin:8px 0 8px 8px;padding:0 8px 8px;border-radius:12px;
    background:rgb(var(--sunken));
  }
  .shelf.collapsed{margin-left:calc(var(--shelf-w) * -1 - 16px)}
}
.shelf.collapsed{margin-left:calc(var(--shelf-w) * -1);opacity:0;pointer-events:none}
.shelf-open{
  position:fixed;left:12px;top:12px;z-index:40;width:32px;height:32px;display:none;place-items:center;
  border-radius:8px;color:rgb(var(--muted));background:rgb(var(--surface)/.9);
  box-shadow:var(--shadow-float);backdrop-filter:blur(8px);
}
.shelf-open:hover{color:rgb(var(--ink))}
.shelf-open.show{display:grid}
/* 桌面收起侧栏后，列表头自带一枚展开按钮，别再叠一个浮动的 */
@media (min-width:901px){ .shelf-open.show{display:none} }
.shelf-open svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* 侧栏收起后，侧栏头里那颗「主目录」跟着没了：在别的视图里补一颗浮动的，
   位置就在日历 / 媒体库页面左上角那块空白（手机上有返回键，不用它） */
.home-float{
  position:fixed;left:12px;top:12px;z-index:41;width:36px;height:36px;display:none;place-items:center;
  border-radius:9px;color:rgb(var(--muted));background:rgb(var(--surface)/.9);
  box-shadow:var(--shadow-float);backdrop-filter:blur(8px);
}
.home-float:hover{color:rgb(var(--ink))}
.home-float:active{transform:scale(.94)}
.home-float.show{display:grid}
.home-float svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.shelf-head{display:flex;align-items:center;gap:8px;height:52px;padding:0 4px}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand-name{
  font-family:var(--font-serif);font-size:17.5px;font-weight:700;letter-spacing:0;
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.head-actions{display:flex;align-items:center;gap:0;flex:0 0 auto}
/* 日程已并进笔记侧栏，「显示今天已完成」这个开关挪到日程分区里了（见 .tsh-sw），
   顶栏不再按视图换按钮，品牌名也就不会被挤成「随…」 */
.head-sw{align-items:center;gap:5px;margin-left:6px;font-size:10.5px;color:rgb(var(--faint));cursor:pointer;user-select:none}
.head-sw input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.head-sw i{width:22px;height:13px;border-radius:8px;background:rgb(var(--line));position:relative;transition:background .18s;flex:0 0 auto}
.head-sw i::after{content:'';position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.head-sw input:checked + i{background:rgb(var(--ivy))}
.head-sw input:checked + i::after{transform:translateX(9px)}
.head-sw span{white-space:nowrap}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:9px;
  color:rgb(var(--muted));transition:background .15s,color .15s;
}
.icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.shelf-body{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:6px 6px 16px;scrollbar-gutter:stable}
/* 当前选中的笔记本 / 分组：底色 + 更深文字，和中栏标题对应 */
.nb-head.on{background:rgb(var(--ink)/.05);color:rgb(var(--ink))}
.nb-head.on .meta{color:rgb(var(--ink-2))}
.sec-fold.on{color:rgb(var(--ink))}

/* ============ 中间：笔记列表（侧栏只放工作区，笔记在这里列） ============ */
.notelist{
  width:288px;flex:0 0 288px;display:flex;flex-direction:column;min-width:0;
  border-left:1px solid rgb(var(--line));background:rgb(var(--sunken));
}
/* 桌面：列表也是一张卡片，和左栏 / 正文三块上下齐平、缝宽一致 */
@media (min-width:901px){
  .notelist{
    margin:8px;border:1px solid rgb(var(--line));border-radius:12px;
    overflow:hidden;background:rgb(var(--sunken));
  }
  /* 卡片多了 1px 边框，表头收 1px 才能和左右两列同一条中线 */
  .notelist .nl-hd{height:50px}
}
.notelist.hidden{display:none}
.nl-hd{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:0 10px 0 12px}
.nl-new{
  width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;
  color:rgb(var(--ink-2));transition:background .14s,color .14s;
}
.nl-new:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.nl-new svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nl-hd b{font-size:13.5px;font-weight:600;color:rgb(var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nl-hd em{font-style:normal;font-size:11.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums;flex:0 0 auto}
.nl-hd .nl-r{margin-left:auto;display:flex;gap:2px;flex:0 0 auto}
/* 手机上从某个笔记本 / 标签的列表回「全部笔记」：只有窄屏的中栏是整页，才需要这枚返回 */
.nl-back{
  display:none;align-items:center;gap:1px;flex:0 0 auto;
  height:26px;padding:0 8px 0 3px;border-radius:8px;
  color:rgb(var(--muted));font-size:12.5px;line-height:1;
  transition:background .14s,color .14s;
}
.nl-back .nb-ar{font-size:17px;line-height:1;margin-top:-2px}
.nl-back:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.nl-open{display:none}
body.shelf-collapsed .nl-open{display:grid}
.nl-rows{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 20px;overscroll-behavior:contain}
.nl-row{
  position:relative;display:block;width:100%;text-align:left;padding:7px 10px 8px;border-radius:8px;
  color:rgb(var(--ink-2));transition:background .12s;
}
.nl-row:hover{background:rgb(var(--hover))}
.nl-row.on{background:rgb(var(--surface));box-shadow:0 0 0 .5px rgb(var(--line)),0 1px 2px rgb(16 24 32/.04)}
.nl-row .nl-t1{display:flex;align-items:baseline;gap:6px;padding-right:62px}
.nl-row .nl-t{font-size:13px;font-weight:500;color:rgb(var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
/* 时间与「删除 / ⋯」同一行并排：时间在左，两个按钮依次靠右，一直可见不跳动 */
.nl-row .nl-d{
  font-size:11px;color:rgb(var(--faint));flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.nl-row .nl-more{
  position:absolute;right:6px;top:4px;
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:rgb(var(--muted));opacity:.38;transition:opacity .12s,background .12s;
}
.nl-row:hover .nl-more{opacity:1}
.nl-row .nl-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.nl-row .nl-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nl-row .nl-del{
  position:absolute;right:32px;top:4px;
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:rgb(var(--muted));opacity:.38;transition:opacity .12s,background .12s,color .12s;
}
.nl-row:hover .nl-del{opacity:1}
.nl-row .nl-del:hover{background:rgb(var(--danger)/.12);color:rgb(var(--danger))}
.nl-row .nl-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 第一次点下的「待确认」态：红底红图标，第二次点才真删 */
.nl-row .nl-del,.note-item .note-del{touch-action:manipulation}
.nl-row .nl-del.del-armed{opacity:1;background:rgb(var(--danger)/.14);color:rgb(var(--danger))}
.note-item .note-del.del-armed{opacity:1;background:rgb(var(--danger)/.14);color:rgb(var(--danger))}
body.ol-touch .nl-row .nl-more,body.ol-touch .nl-row .nl-del{opacity:.5}
/* 手机上行内两颗图标视觉只有 22px，热区往下扩到 40px（宽度刚好相接、不互相盖住） */
@media (max-width:900px){
  .nl-row .nl-more::after,.nl-row .nl-del::after{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26px;height:40px;
  }
}
.nl-row .nl-s{display:block;margin-top:3px;font-size:12px;color:rgb(var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-row .nl-pin{position:absolute;left:2px;top:13px;width:4px;height:4px;border-radius:50%;background:rgb(var(--ivy))}
.nl-row .nl-t{white-space:nowrap}
.nl-empty{padding:20px 12px;font-size:12px;color:rgb(var(--faint));line-height:1.8}
.nl-empty-first{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;min-height:min(430px,56vh);padding:24px 16px 40px}
.nl-empty-search{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:26px 16px}
.nl-empty .ne-ico{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  background:rgb(var(--hover));color:rgb(var(--muted));margin-bottom:3px;
}
.nl-empty .ne-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nl-empty .ne-t{font-size:13.5px;font-weight:600;color:rgb(var(--ink-2));letter-spacing:.1px}
.nl-empty .ne-d{font-size:12px;color:rgb(var(--faint));max-width:100%;line-height:1.72}
.nl-empty .ne-btn{height:33px;margin-top:5px;padding:0 15px;font-size:12.5px;border-radius:9px}
.nl-empty .ne-btn + .ne-btn{margin-top:0}
@media (max-width:1180px) and (min-width:901px){ .notelist{width:250px;flex-basis:250px} }
@media (max-width:900px){ .notelist{display:none!important} }

.sec-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:14.5px;font-weight:600;letter-spacing:0;color:rgb(var(--ink-2));
  margin:12px 0 6px;padding:0 52px 0 8px;
}
.sec-label .count{font-size:11px;font-weight:500;color:rgb(var(--faint))}
/* 「笔记」总开关：点标题把下面一整块（笔记本 / 标签 / 回收站）收起来 */
.sec-fold{
  width:100%;background:none;border:0;font-family:inherit;text-align:left;cursor:pointer;
  border-radius:7px;padding:2px 38px 2px 0;transition:color .12s;   /* 右侧留出「⋯」和数字那一列 */
}
.sec-fold:hover{color:rgb(var(--ink))}
.sec-fold .lb{display:flex;align-items:center;gap:6px}
.sec-fold .caret{
  width:15px;text-align:center;
  font-size:8px;font-style:normal;color:rgb(var(--faint));display:inline-block;
  transform:rotate(90deg);transition:transform .18s var(--spring),background .14s,color .14s;
  /* 热区撑到约 25×20：padding 与负 margin 相互抵消，排版位置不变，纯放大可点区域 */
  padding:6px 5px;margin:-6px -5px;border-radius:6px;
}
.sec-fold .caret:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.sec-fold.closed .caret{transform:rotate(0)}
/* 窄屏：手指点得到才算数，再放大一档 */
@media (max-width:900px){
  .sec-fold .caret{padding:8px 7px;margin:-8px -5px -8px -7px}
  .sec-fold .caret:active{background:rgb(var(--hover))}
}
.sec-body.hidden{display:none}
/* 侧栏各分区之间的细线 */
.shelf-sep{height:1px;background:rgb(var(--line));margin:12px 8px 10px}
/* ===== 侧栏四个一级标题：全部笔记 / 日程 / 标签 / 回收站 =====
   以前各写各的（14.5 / 11.5 / 13 三种字号），现在共用一套：字号、字重、颜色、缩进、数字位置全对齐 */
.side-hd{
  display:flex;align-items:center;gap:6px;width:100%;position:relative;text-align:left;
  padding:7px 40px 7px 8px;border-radius:7px;
  font-size:14.5px;font-weight:600;letter-spacing:0;color:rgb(var(--ink-2));
  transition:background .14s,color .14s;
}
.side-hd:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.side-hd .lb{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.side-hd .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.side-hd .ico{width:15px;height:15px;flex:0 0 auto;display:grid;place-items:center;color:rgb(var(--faint))}
.side-hd .ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* 小三角：和图标同宽（15px），四种标题的文字起点因此完全对齐；
   上下各撑 6px 热区（配合负 margin，行高不受影响） */
.side-hd .caret{
  width:15px;height:15px;line-height:15px;text-align:center;
  font-size:8px;font-style:normal;color:rgb(var(--faint));
  display:inline-block;flex:0 0 auto;transform:rotate(90deg);border-radius:5px;
  padding:6px 0;margin:-6px 0;
  transition:transform .18s var(--spring),background .14s,color .14s;
}
.side-hd .caret:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.side-hd.closed .caret{transform:rotate(0)}
.side-hd .n{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:11px;font-weight:500;color:rgb(var(--faint));font-variant-numeric:tabular-nums;
}
.side-hd.on{color:rgb(var(--ink));background:rgb(var(--ink)/.055)}
.side-hd.on .n{color:rgb(var(--ink-2))}
/* 「全部笔记」行尾的新建笔记本：数字让出位置，加号贴着右边缘（以前在窗口右上角） */
.side-hd.has-new .n{right:38px}
.side-new{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  color:rgb(var(--faint));cursor:pointer;
  transition:background .14s,color .14s,opacity .14s;opacity:0;
}
.side-hd:hover .side-new,.side-hd.on .side-new{opacity:1}
.side-new:hover{background:rgb(var(--ivy-soft));color:rgb(var(--ivy))}
.side-new svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 触屏没有 hover，直接常显 */
@media (hover:none){ .side-new{opacity:1} }
@media (max-width:900px){ .side-hd{padding-top:9px;padding-bottom:9px} }
/* 侧栏「日程」入口：四个标题里它单独一条分隔线 */
.sched-nav .t{flex:1}
/* 四个一级标题之间的分隔线：日程 / 标签 / 回收站各来一条，视觉上是同一套 */
.side-hd.sep{margin-top:8px;padding-top:13px;border-top:1px solid rgb(var(--line));border-radius:7px}
/* 平板竖屏：日程列表就地铺在侧栏里 */
.sec-body.sched-inline{padding:2px 0 0}
.shelf-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));
  transition:background .14s,color .14s;position:relative;
}
.shelf-row:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.shelf-row svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.shelf-row .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.shelf-row{padding-right:52px}
.shelf-row .meta{position:absolute;right:38px;top:50%;transform:translateY(-50%);font-size:11px;color:rgb(var(--faint))}
/* 回收站和「笔记 / 标签」同属大类：字号、字重、颜色都对齐，只是它带图标 */
.shelf-row[data-act="trash"]{margin-top:2px;gap:6px;padding-left:8px}
.shelf-row[data-act="trash"] .t{font-size:14.5px;font-weight:600;color:rgb(var(--ink-2))}
.shelf-row.new-nb{color:rgb(var(--ivy));font-size:12.5px;padding:6px 8px}
.shelf-row.new-nb:hover{background:rgb(var(--ivy-soft))}
.shelf-row.new-nb svg{color:currentColor}

.nb-group{margin-top:2px}
.nb-row{display:flex;align-items:center;gap:0;border-radius:7px;position:relative}
.nb-row:hover{background:rgb(var(--hover))}
.nb-more{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--faint));opacity:0;pointer-events:none;
  transition:opacity .12s,background .12s,color .12s;
}
.nb-row:hover .nb-more,.nb-row:focus-within .nb-more{opacity:1;pointer-events:auto}
/* 悬停时数字让位给「⋯」，两者不会叠在一起；没有「⋯」的行（置顶 / 未归类）不受影响 */

/* 有「⋯」的行：右侧留出它的位置（长名字不会被压到），数字再拉回对齐列 */
.nb-row .nb-head{padding-right:56px;position:relative}
.nb-row .nb-head .meta{position:absolute;right:38px;top:50%;transform:translateY(-50%);margin-left:0}
.nb-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.nb-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 每行的锁按钮：落在数字左边、⋯ 的右边，点一下锁上 / 解锁 */
.nb-lockbtn{
  position:absolute;right:56px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--faint));opacity:0;pointer-events:none;
  transition:opacity .12s,background .12s,color .12s;
}
.nb-lockbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb-lockbtn.has-lock{opacity:.5;pointer-events:auto}     /* 设过密码：常驻，暗一点不抢眼 */
.nb-lockbtn.has-lock.open{opacity:.36}                   /* 已解锁：更淡 */
.nb-lockbtn.shut{color:rgb(var(--ivy))}                  /* 锁着：用主题色点出来 */
.nb-row:hover .nb-lockbtn,.nb-row:focus-within .nb-lockbtn{opacity:.85;pointer-events:auto}
.nb-lockbtn:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink));opacity:1}
body.ol-touch .nb-lockbtn.has-lock{opacity:.62;width:26px;height:26px;right:53px}
.nb-head{
  display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:7px;
  color:rgb(var(--ink-2));font-size:13.5px;font-weight:500;letter-spacing:0;
}
.nb-row:hover .nb-head{color:rgb(var(--ink))}
.nb-head .meta{font-size:11px;font-weight:400;color:rgb(var(--faint));margin-left:auto;flex:0 0 auto}
.nb-head .nb-fold{width:12px;height:12px;flex:0 0 auto;display:grid;place-items:center;border-radius:3px}
.nb-head .nb-fold:hover{background:rgb(var(--ink)/.09)}
.nb-head svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb-head.open svg.chev{transform:rotate(90deg)}
.nb-head .t{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-notes{padding-left:8px}
.nb-notes.hidden{display:none}
/* 二级（及更深）笔记本：缩进 + 一条很淡的层级导引线 */
.nb-body{padding-left:9px;margin-left:7px;border-left:1px solid rgb(var(--line))}
.nb-body.hidden{display:none}
.nb-body .nb-notes{padding-left:5px}
/* 三级：子笔记本比父级再小半档，用字号而不是加粗来表达层级 */
.nb-sub .nb-head{font-size:12.5px;font-weight:500;color:rgb(var(--muted))}
.nb-kids:not(:empty){margin-bottom:3px}
/* 父笔记本自己的笔记紧跟在子笔记本下面，加一条很淡的分隔，避免看成子笔记本的内容 */
.nb-kids + .nb-notes:not(:empty){border-top:1px solid rgb(var(--line)/.7);margin-top:3px;padding-top:3px}
.nb-kids .nb-dot{width:6px;height:6px}

.note-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px;color:rgb(var(--ink-2));font-size:12.5px;
  transition:background .14s,color .14s;
}
.note-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.note-item.active{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.note-item svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.note-item.active svg{color:rgb(var(--ivy))}
.note-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .tags{display:flex;gap:3px;flex:0 0 auto}
/* 单篇笔记行右侧的删除：占位常留（不抖动），hover / 当前笔记才显出，触屏常显淡一点 */
.note-item .note-del{
  width:19px;height:19px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
  color:rgb(var(--faint));opacity:0;transition:opacity .12s,background .12s,color .12s;
}
.note-item .note-del svg{width:13px;height:13px;stroke-width:1.8;color:inherit}
.note-item:hover .note-del,.note-item.active .note-del{opacity:1}
.note-item .note-del:hover{background:rgb(var(--danger) / .13);color:rgb(var(--danger))}
body.ol-touch .note-item .note-del{opacity:.45}
body.ol-touch .note-item:hover .note-del,body.ol-touch .note-item.active .note-del{opacity:1}
/* 置顶：行首图标变成图钉，hover 出现快捷开关 */
.note-item .note-move,.note-item .note-pin{
  width:19px;height:19px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
  color:rgb(var(--faint));opacity:0;transition:opacity .12s,background .12s,color .12s;
}
.note-item .note-move svg{width:13px;height:13px;stroke-width:1.8;color:inherit}
.note-item:hover .note-move,.note-item.active .note-move{opacity:1}
.note-item .note-move:hover{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
body.ol-touch .note-item .note-move{opacity:.45}
body.ol-touch .note-item:hover .note-move,body.ol-touch .note-item.active .note-move{opacity:1}
.note-item .note-pin svg{width:13px;height:13px;stroke-width:1.8;color:inherit}
.note-item:hover .note-pin,.note-item.active .note-pin{opacity:1}
.note-item .note-pin:hover{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.note-item .note-pin.on{color:rgb(var(--ivy));opacity:0}   /* 已置顶：行首已是图钉，hover 才露出「取消置顶」，免得一行两个图钉 */
.note-item:hover .note-pin.on,.note-item.active .note-pin.on{opacity:1}
.note-item.pinned>svg{color:rgb(var(--ivy))}
body.ol-touch .note-item .note-pin{opacity:.45}
body.ol-touch .note-item:hover .note-pin,body.ol-touch .note-item.active .note-pin{opacity:1}
.pin-ico{width:13px;height:13px;flex:0 0 auto;display:grid;place-items:center;color:rgb(var(--ivy))}
.pin-ico svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.9}
.pin-group .pin-notes{padding-left:8px}
/* 触屏 / 窄屏兜底：没有可靠 hover，删除按钮常显淡一点，不然根本点不到 */
@media (hover:none),(pointer:coarse),(max-width:900px){
  .note-item .note-del{opacity:.5}
  .note-item:hover .note-del,.note-item.active .note-del{opacity:1}
  .note-item .note-pin,.note-item .note-move{opacity:.5}
  .note-item:hover .note-pin,.note-item.active .note-pin,
  .note-item:hover .note-move,.note-item.active .note-move{opacity:1}
}
/* 触屏没有 hover：置顶笔记也留一个淡一点的取消按钮，否则取消不掉 */
@media (hover:none),(pointer:coarse){
  .note-item .note-pin.on{opacity:.55}
}
.dot-tag{width:5px;height:5px;border-radius:50%}

/* 左侧标签分类（可折叠树：标签 → 该标签下的笔记） */
.tag-sec{margin-top:12px}
.tag-sec-head{
  display:flex;align-items:center;gap:6px;width:calc(100% - 16px);text-align:left;
  margin:12px 8px 6px;padding:2px 0;   /* 数字自己带 8px 外边距，和「笔记 / 回收站」那一列齐平 */
  font-size:14.5px;font-weight:600;letter-spacing:0;color:rgb(var(--ink-2));
}
.tag-sec-head:hover{color:rgb(var(--ink))}
.tag-sec-head .caret{flex:0 0 auto;width:15px;text-align:center;font-size:8px;line-height:1;color:rgb(var(--faint));transition:transform .18s}
.tag-caret{flex:0 0 auto;width:9px;text-align:center;font-size:8px;line-height:1;color:rgb(var(--faint));transition:transform .18s}
.tag-sec-head.open .caret,.tag-row.open .tag-caret{transform:rotate(90deg)}
.tag-sec-head svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tag-sec-head .count{margin-left:auto;font-size:11px;font-weight:500;color:rgb(var(--faint))}
.tag-group{margin:1px 0}
.tag-line{position:relative;border-radius:7px}
.tag-line:hover{background:rgb(var(--hover))}
.shelf-row.tag-row{padding:5px 8px;padding-right:30px;gap:7px;color:rgb(var(--ink-2))}
/* 数字脱离流、钉在统一那一列（距右侧 8px），文字因此仍能截断在「⋯」前面 */
.shelf-row.tag-row .meta{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.shelf-row.tag-row .t{font-size:13.5px;font-weight:500}
.shelf-row.tag-row:hover{background:transparent;color:rgb(var(--ink))}
.tag-row .meta{transition:opacity .12s}
.tag-line:hover .tag-row .meta{opacity:0}
.tag-line.no-menu:hover .tag-row .meta{opacity:1}
.tag-more{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:rgb(var(--muted));opacity:0;pointer-events:none;
  transition:opacity .12s,background .12s,color .12s;
}
.tag-line:hover .tag-more{opacity:1;pointer-events:auto}
.tag-more:hover{background:rgb(var(--ink)/.08);color:rgb(var(--ink))}
.tag-more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.po-note{font-size:11.5px;line-height:1.55;color:rgb(var(--faint));padding:4px 8px 6px;max-width:230px}
.tag-hash{font-size:12.5px;line-height:1;flex:0 0 auto;font-weight:500}
.tag-dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.tag-notes{margin-left:17px;padding-left:10px;border-left:1px solid rgb(var(--line))}
.tag-notes .note-item{padding:5px 8px;font-size:12.5px}
.tag-empty{font-size:11.5px;color:rgb(var(--faint));padding:4px 8px 6px;line-height:1.6}

/* 标签胶囊（苹果备忘录式）：侧栏最底部一排可换行的标签，点一下即筛选 */
.tag-pills-sec{margin:12px 0 2px;padding-top:12px;border-top:1px solid rgb(var(--line))}
.tag-pills-sec.closed{margin-bottom:0}
/* 标题（「标签」）走 .side-hd 那一套，这里只留标签区自己的间距 */
.tag-pills-title{margin:0 0 8px;padding-right:40px}
.tag-pills-sec.closed .tag-pills-title{margin-bottom:0}
.tag-pills-title .tp-total{display:none}
.tag-pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px}
.tag-pill{
  display:inline-flex;align-items:center;gap:4px;max-width:100%;height:26px;padding:0 9px;
  border-radius:99px;background:rgb(var(--ink)/.055);color:rgb(var(--ink-2));
  font-size:12.5px;line-height:1;white-space:nowrap;
  transition:background .14s,color .14s,transform .1s;
}
.tag-pill:hover{background:rgb(var(--ink)/.1);color:rgb(var(--ink))}
.tag-pill:active{transform:scale(.97)}
.tag-pill .tp-h{font-size:12px;color:rgb(var(--faint));flex:0 0 auto}
.tag-pill .tp-n{font-size:10.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums;margin-left:1px}
.tag-pill .tp-t{overflow:hidden;text-overflow:ellipsis}
.tag-pill.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.tag-pill.on .tp-h,.tag-pill.on .tp-n{color:inherit;opacity:.65}
.tag-pill.more{color:rgb(var(--muted));background:transparent;box-shadow:inset 0 0 0 1px rgb(var(--line))}
.tag-pill.more:hover{background:rgb(var(--ink)/.06)}
/* 筛选态：顶部返回行 */
.shelf-back{
  display:flex;align-items:center;gap:5px;width:calc(100% - 16px);margin:2px 8px 8px;
  font-size:12.5px;color:rgb(var(--muted));padding:4px 0;text-align:left;
}
.shelf-back:hover{color:rgb(var(--ink))}
.shelf-back .arw{font-size:15px;line-height:1;color:rgb(var(--faint))}
.shelf-filter-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:0 8px 8px;padding-bottom:8px;border-bottom:1px solid rgb(var(--line));
}
.shelf-filter-hd .t{font-size:15px;font-weight:600;color:rgb(var(--ink));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-filter-hd .c{font-size:11px;color:rgb(var(--faint));flex:0 0 auto}
.shelf-empty{font-size:12px;color:rgb(var(--faint));padding:10px;line-height:1.7}

/* 单篇笔记的标签选择器 */
.tag-pick{width:238px;padding:6px}
.tp-search{padding:0 2px 6px}
.tp-search input{
  width:100%;height:28px;border:0;border-radius:7px;outline:none;
  background:rgb(var(--ink)/.05);padding:0 9px;font-size:12.5px;color:rgb(var(--ink));
}
.tp-search input::placeholder{color:rgb(var(--faint))}
.tp-list{max-height:230px;overflow-y:auto;scrollbar-width:thin}
.tp-list::-webkit-scrollbar{width:6px}
.tp-list::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px}
.tp-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));font-size:12.5px;
}
.tp-row:hover{background:rgb(var(--hover))}
.tp-row .tp-dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.tp-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-row .n{font-size:10.5px;color:rgb(var(--faint))}
.tp-row .ck{width:14px;text-align:center;color:rgb(var(--ivy));font-size:12px}
.tp-row.on .t{color:rgb(var(--ink));font-weight:500}
.tp-row.tp-create{color:rgb(var(--ivy))}
.tp-plus{width:14px;text-align:center;font-size:15px;line-height:1}
.tp-none{font-size:11.5px;color:rgb(var(--faint));padding:10px 8px;text-align:center}
.chip{cursor:pointer}

.shelf-foot{margin-top:auto;margin-left:-7px;padding:6px 2px 2px;display:flex;align-items:center;gap:6px}
/* 左下角同步指示：云 + 状态灯，纯展示不可点，悬停看最近一次同步时间 */
.sync-pip{
  display:inline-flex;align-items:center;gap:3.5px;flex:0 0 auto;padding:1px 2px 1px 0;
  color:rgb(var(--faint)/.65);cursor:default;user-select:none;
  transition:color .15s;
}
.sync-pip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sync-pip .sp-dot{
  width:6px;height:6px;border-radius:50%;background:rgb(var(--faint)/.45);
  transition:background .15s;
}
.sync-pip.ok{color:rgb(var(--ivy)/.85)}
.sync-pip.ok .sp-dot{background:rgb(var(--ivy));box-shadow:0 0 0 2px rgb(var(--ivy)/.15)}
.sync-pip.busy{color:rgb(var(--ivy)/.85)}
.sync-pip.busy .sp-dot{background:rgb(var(--ivy));animation:spPulse 1.15s ease-in-out infinite}
.sync-pip.error{color:rgb(var(--danger)/.85)}
.sync-pip.error .sp-dot{background:rgb(var(--danger));box-shadow:0 0 0 2px rgb(var(--danger)/.14)}
@keyframes spPulse{0%,100%{opacity:.22;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .sync-pip.busy .sp-dot{animation:none;opacity:.85} }
/* 版本水印：平时是书架底部一行极淡小字，只有检测到线上版本落后才变色提示 */
.build-tag{
  display:flex;align-items:center;gap:6px;
  font-size:9.5px;line-height:1.35;letter-spacing:.02em;
  color:rgb(var(--faint) / .34);cursor:pointer;user-select:none;
  transition:color .15s;
}
.build-tag:hover{color:rgb(var(--muted))}
.build-tag .bd{font-variant-numeric:tabular-nums}
.build-tag.warn{color:#c2611b}
[data-theme=dark] .build-tag.warn{color:#e8a15c}
.build-tag .rf{font-size:10px;padding:1px 6px;border-radius:5px;background:rgb(var(--hover));color:inherit;white-space:nowrap}
.build-tag .rf:hover{background:rgb(var(--ivy-soft))}

/* dock */
.dock{
  position:absolute;left:12px;right:12px;bottom:12px;height:46px;
  display:flex;align-items:center;gap:2px;padding:5px 6px;
  background:rgb(var(--surface)/.86);backdrop-filter:blur(14px) saturate(1.4);
  border-radius:13px;box-shadow:var(--shadow-float);
}
/* 主侧栏的底部图标排已收进顶部「视图 / 设置」菜单，设置页里的 #dockSet2 不受影响 */
#dock{display:none}
.dock-item{
  height:34px;min-width:34px;width:34px;padding:0;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto;position:relative;
  transition:background .16s,color .16s;
}
.dock-item svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.dock-item.active{background:rgb(var(--ink) / .06);color:rgb(var(--ink));font-weight:500}
/* 底部只剩 5 个图标：等分整条 dock，图标各自居中 */
.dock{justify-content:space-between;gap:0}
.dock-item{flex:1 1 0;min-width:0;width:auto}
@media (max-width:420px){
  .dock{gap:0;padding:4px}
  .dock-item{width:auto;min-width:0;height:32px}
  .dock-item svg{width:16px;height:16px}
}
/* 待办逾期红点：贴在图标右上角，不再把整个按钮撑宽 */
/* 待办逾期红点：贴在图标右上角，不再把整个按钮撑宽 */
.dock-item .todo-dot{
  position:absolute;top:1px;left:50%;margin-left:5px;
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:rgb(var(--danger));
  color:#fff;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;flex:0 0 auto;
  box-shadow:0 0 0 2px rgb(var(--surface));
}
/* 从待办跳过去时，闪一下那一块 */
@keyframes todoFlash{0%{background:rgb(var(--ivy)/.16)}100%{background:transparent}}
.blk.todo-flash{animation:todoFlash 1.3s ease-out;border-radius:8px}
/* 点大纲跳过去时，目标位置短暂铺一层灰底（飞书那种），一眼知道落在了哪 */
@keyframes jumpFlash{
  0%{background-color:rgb(var(--ink)/ .13);box-shadow:0 0 0 7px rgb(var(--ink)/ .13)}
  55%{background-color:rgb(var(--ink)/ .085);box-shadow:0 0 0 7px rgb(var(--ink)/ .085)}
  100%{background-color:transparent;box-shadow:0 0 0 7px transparent}
}
.jump-flash{animation:jumpFlash 1.6s ease-out forwards;border-radius:7px}
[data-theme=dark] .jump-flash{animation-name:jumpFlashDark}
@keyframes jumpFlashDark{
  0%{background-color:rgb(255 255 255 / .12);box-shadow:0 0 0 7px rgb(255 255 255 / .12)}
  55%{background-color:rgb(255 255 255 / .08);box-shadow:0 0 0 7px rgb(255 255 255 / .08)}
  100%{background-color:transparent;box-shadow:0 0 0 7px transparent}
}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:13px;font-weight:700;
  background:#f3ddd6;color:#8a4a34;flex:0 0 auto;transition:transform .18s var(--spring);
}
[data-theme=dark] .avatar{background:#4a3229;color:#e8c2b2}
.avatar:hover{transform:scale(1.06)}

/* ============ paper ============ */
.main-wrap{flex:1;min-width:0;display:flex;padding:8px 8px 8px 0}.paper{
  flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:rgb(var(--surface));border:1px solid #e9ecef;border-radius:14px;
  box-shadow:var(--shadow-paper);
}
[data-theme=dark] .paper{border-color:#2b3035}
.tabbar{display:flex;align-items:center;gap:4px;height:50px;padding:0 88px 0 10px;flex:0 0 auto;overflow:hidden}
.tabs{display:flex;flex:1 1 auto;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* 右边还有标签没露出来时，右缘渐隐一下，别让文字被硬切；滚到中间时左边也渐隐 */
.tabs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}
.tabs.ovf-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 20px);
  mask-image:linear-gradient(90deg,transparent,#000 20px)}
.tabs.ovf.ovf-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
.tab{
  display:flex;flex:0 0 auto;align-items:center;gap:6px;max-width:180px;height:28px;padding:0 8px 0 10px;
  border-radius:7px;font-size:12.5px;color:rgb(var(--muted));white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.tab.active{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab .t{overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tab .x{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;opacity:0;transition:opacity .14s,background .14s}
.tab:hover .x,.tab.active .x{opacity:.7}
.tab .x:hover{background:rgb(var(--ink)/.08);opacity:1}
.tab .x svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
/* 标签里的锁标记：没写宽高时 SVG 会撑到行高那么大，这里钉死成 12px，跟文字同高 */
.tab .t svg{width:12px;height:12px;margin:0 4px 0 0;vertical-align:-2px;stroke-width:2;flex:0 0 auto}
/* 正文顶部搜索框：搜全部笔记，输入即筛中栏 */
.tb-search{
  margin-left:auto;margin-right:78px;flex:0 0 auto;display:flex;align-items:center;gap:6px;
  width:212px;height:28px;padding:0 9px;border-radius:8px;background:rgb(var(--ink)/.05);color:rgb(var(--muted));
  transition:background .14s,box-shadow .14s;
}
.tb-search:focus-within{background:rgb(var(--surface));box-shadow:0 0 0 .5px rgb(var(--ivy)/.55),0 1px 3px rgb(16 24 32/.07)}
.tb-search svg{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.tb-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:inherit;font-size:12.5px;color:rgb(var(--ink))}
.tb-search input::placeholder{color:rgb(var(--faint))}
.tb-search kbd{font:500 10px/1 var(--font-mono);color:rgb(var(--faint));border:1px solid rgb(var(--line));border-radius:4px;padding:2px 4px;flex:0 0 auto}
@media (max-width:1240px){ .tb-search{width:150px} .tb-search kbd{display:none} }
@media (max-width:900px){ .tb-search{display:none} }
.tab-new{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:rgb(var(--faint))}
.tab-new:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab-new svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

/* 右上角操作图标与标题栏（标签 + 新建）同一行、垂直居中：44px 行高里对称留白 */
.paper-actions{position:absolute;top:7px;right:12px;display:flex;align-items:center;gap:2px;z-index:6}
/* 顶部「大纲」按钮：桌面 / 窄屏 / 触屏全部显示（.pa-btn 有 display:grid，用双类名保持一致权重） */
.pa-btn.pa-ol{display:grid}
body.ol-open .pa-ol{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
/* 所有触屏设备（含 iPad Safari 桌面模式）放大关闭按钮与条目点击区 */
/* 触屏没有悬停：笔记本行的「⋯」常驻，数字往左让出 30px（不然两个会重叠） */
/* 触屏没有悬停：「⋯」常驻在行的右侧留白里（不占数字那一列），数字因此仍与其它行对齐 */
body.ol-touch .nb-more{opacity:.45;pointer-events:auto}
body.ol-touch .ol-close{display:grid}
body.ol-touch .ol-item{padding-top:6px;padding-bottom:6px}
/* 书架收起时左上角有折叠按钮，标签栏让出它的位置，避免压住第一个标签 */
@media (min-width:641px){ .shelf-open.show ~ .paper .tabbar{padding-left:48px} }
.pa-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:rgb(var(--muted));transition:background .15s,color .15s}
.pa-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
/* 触屏（iPad/手机）没有 hover：按下的瞬间给同样的颜色反馈 */
.pa-btn:active{background:rgb(var(--hover));color:rgb(var(--ink))}
.pa-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pa-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
/* 顶部番茄按钮：和右下角那只同一套配色（红番茄 + 绿叶），不做描边 */
.pa-btn.pa-pomo svg{overflow:visible}
.pa-btn.pa-pomo .pi-body{fill:rgb(224 69 58 / .18);stroke:none}
.pa-btn.pa-pomo .pi-fill{fill:#e0453a;stroke:none;transition:transform .5s linear}
.pa-btn.pa-pomo .pi-stem{fill:none;stroke:#2f8f43;stroke-width:7;stroke-linecap:round}
.pa-btn.pa-pomo .pi-leaf{fill:#3ea152;stroke:none}
[data-theme=dark] .pa-btn.pa-pomo .pi-body{fill:rgb(224 69 58 / .22)}
[data-theme=dark] .pa-btn.pa-pomo .pi-fill{fill:#cf3b30}

.content-row{flex:1;display:flex;min-height:0;position:relative}

/* ============ doc ============ */
.scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0}
/* 正文居中排布：宽度按可用空间的百分比自适应（留白随屏幕缩放） */
.doc{
  /* v37: 留白不再写死像素，改成百分比——正文恒占可用宽度的 93%，两侧各留 3.5%，
     窗口一变宽度就按比例跟着缩放（大屏留白略宽、小屏略窄，观感一致）；
     - 840px 保底：iPad 横屏这类中等宽度不会比之前更窄；
     - 1500px 上限：超宽屏（2K/4K）挡住行长，否则一行会拉到 80+ 字难以阅读 */
  max-width:min(1500px, max(93%, 840px));
  margin:0 auto;
  /* 上下留白由「设置 → 外观」里的两个滑块控制：
     --doc-pad-t 顶部（正文离窗口顶端多远）、--doc-pad-b 底部（写到最后还能继续下滑的空白）。
     底部这段空白很关键：没有它，#scroll 到底就滑不动了，光标只能贴着窗口下沿打字 */
  padding:var(--doc-pad-t, 52px) clamp(16px, 2.4vw, 40px) var(--doc-pad-b, 30vh);
}
/* 宽屏：右侧常驻一条 250px 的「大纲通道」，正文宽度固定不变。
   卡片展开时正好落在这条空位里 —— 既压不到字，也不会让正文突然变窄 */
@media (min-width:1200px){
  .doc{
    max-width:min(1340px, calc(100% - 264px));
    margin:0 auto 0 clamp(20px, 2.6vw, 48px);
  }
}
.doc-title{
  display:block;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:34px;font-weight:600;line-height:1.28;letter-spacing:-.012em;
  color:rgb(var(--ink));padding:0;margin:0 0 2px;
}
.doc-title::placeholder{color:rgb(var(--faint));opacity:.75}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0 24px;font-size:12.5px;color:rgb(var(--faint))}
.doc-meta .sep{opacity:.6}
.meta-btn{padding:2px 4px;border-radius:5px;color:rgb(var(--faint));transition:background .14s,color .14s;font-size:12.5px}
.meta-resume{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 7px;border-radius:6px;
  background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-size:11.5px;font-weight:500;
  transition:filter .14s;
}
.meta-resume:hover{filter:brightness(.97)}
.meta-resume .rx{
  width:14px;height:14px;border-radius:4px;display:grid;place-items:center;
  color:rgb(var(--ivy-ink)/.55);font-size:12px;line-height:1;
}
.meta-resume .rx:hover{background:rgb(var(--ivy-ink)/.1);color:rgb(var(--ivy-ink))}
.dev-list{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.dev-item{display:flex;align-items:center;gap:6px;font-size:12px;color:rgb(var(--ink))}
.dev-item em{font-style:normal;color:rgb(var(--faint));font-size:11px}
.dev-item b{font-weight:500;font-size:10px;padding:1px 5px;border-radius:4px;background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.meta-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.meta-btn.add{color:rgb(var(--faint))}
/* 回收站头部：窄屏要能换行，否则「清空回收站」会被挤出屏幕 */
.trash-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.trash-hint{color:rgb(var(--faint));font-size:12.5px;margin:0;flex:1 1 auto;min-width:0}
.trash-head #trashEmpty{margin-left:auto;flex:0 0 auto}
@media (max-width:560px){
  .trash-head{gap:4px;margin-bottom:16px}
  .trash-hint{flex:1 1 100%}
  .trash-head #trashEmpty{margin-left:0;padding:4px 0}
  /* 手机上「恢复 / 彻底删除」太细，手指点不准：把热区撑到能点，行高也放宽一点 */
  .view-pad .note-item{padding:10px 6px;gap:6px}
  .view-pad .note-item .meta-btn{padding:7px 9px;border-radius:7px;font-size:13px}
  .view-pad .note-item .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
/* 标题下的 Markdown 工具条：和右上角「+」菜单并存，两个入口都能用。
   长文往下翻时吸在正文区顶部，工具条一直够得着；背景要不透明，否则会透出下面的字 */
.fmt-bar{
  display:flex;align-items:center;flex-wrap:wrap;gap:0;
  position:sticky;top:0;z-index:7;
  margin:12px 0 0;padding:6px 0 7px;user-select:none;
  background:rgb(var(--surface));
  border-bottom:1px solid transparent;
  transition:border-color .16s,box-shadow .16s;
}
.fmt-bar.stuck{border-bottom-color:rgb(var(--line));box-shadow:0 8px 14px -12px rgb(16 24 32 / .45)}
/* 手机上被「钉」到标签栏下面：不参与滚动，所以不用 sticky，自己一条底边线 */
.fmt-bar.fmt-docked{
  position:static;top:auto;z-index:auto;flex:0 0 auto;min-width:0;max-width:100%;
  margin:0;padding:5px 10px 6px;
  border-bottom:1px solid rgb(var(--line));
  background:rgb(var(--surface));
}
.fmt-ital{font-family:Georgia,'Times New Roman',Times,serif;font-style:italic;font-weight:500;font-size:13.5px;line-height:1}
.fmt-bar button[data-fmt="i"]{padding:0 5px}
.fmt-bar button[data-fmt="ai"]{color:rgb(var(--ivy-ink))}
.fmt-bar button[data-fmt="ai"]:hover{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.fmt-bar button[data-fmt="ai"] svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fmt-bar button{
  height:26px;min-width:23px;padding:0 5px;border-radius:6px;font-size:12px;color:rgb(var(--muted));
  transition:background .14s,color .14s,transform .1s;
}
.fmt-bar button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.fmt-bar button:active{transform:scale(.95)}
.fmt-bar button b,.fmt-bar button i,.fmt-bar button s{font-size:13px;font-weight:700}
.fmt-bar button i{font-style:italic;font-family:var(--font-serif)}
.fmt-sep{width:1px;height:12px;background:rgb(var(--line));margin:0 4px;flex:0 0 auto}
/* 窄屏：工具条不换行（换行会叠成好几行，吸顶后挡住半屏正文），改成横向滑动 */
@media (max-width:900px){
  .fmt-bar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .fmt-bar::-webkit-scrollbar{display:none}
  .fmt-bar button,.fmt-bar .fmt-sep{flex:0 0 auto}
}

/* ---- 斜杠插入菜单（正文里输入 /） ---- */
.slash{
  position:fixed;z-index:78;width:256px;max-height:312px;overflow:auto;padding:5px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:11px;
  box-shadow:var(--shadow-lift);opacity:0;transform:translateY(-4px) scale(.985);
  pointer-events:none;transition:opacity .13s,transform .16s var(--spring);
  overscroll-behavior:contain;
}
.slash.open{opacity:1;transform:none;pointer-events:auto}
.slash-hd{padding:5px 8px 6px;font-size:11px;color:rgb(var(--faint));line-height:1.4}
.slash-hd b{font-weight:600;color:rgb(var(--muted))}
.sl-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;border-radius:7px;text-align:left}
.sl-item.on,.sl-item:hover{background:rgb(var(--hover))}
.sl-ic{
  width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;border-radius:6px;
  background:rgb(var(--sunken));color:rgb(var(--muted));
  font-size:11px;font-weight:600;font-family:var(--font-mono);line-height:1;
}
.sl-item.on .sl-ic,.sl-item:hover .sl-ic{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.sl-ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sl-tx{min-width:0;flex:1}
.sl-tx b{display:block;font-size:13px;font-weight:450;color:rgb(var(--ink-2))}
.sl-tx i{display:block;font-size:10.5px;font-style:normal;color:rgb(var(--faint));margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-key{font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--faint))}
.sl-key em{font-style:normal;margin-left:5px;color:rgb(var(--ivy-ink))}
.sl-date{margin-left:auto;font-size:10.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---- 编辑中把「- [ ] 」显示成真勾选框：一块不透明小牌子盖住原文，文本本身不动 ---- */
.blk-tchk{
  display:none;position:absolute;left:0;top:0;z-index:2;pointer-events:none;
  background:rgb(var(--surface));border-radius:3px;align-items:center;
}
.blk.show-tchk .blk-tchk{display:flex}
.blk-tchk i{
  display:block;width:14px;height:14px;margin-left:1px;box-sizing:border-box;
  border:1.5px solid rgb(var(--faint));border-radius:4px;background:rgb(var(--surface));position:relative;
}
.blk-tchk.on i{background:rgb(var(--ivy));border-color:rgb(var(--ivy))}
.blk-tchk.on i::after{
  content:'';position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border:1.6px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
}

/* ---- 新建 / 重命名笔记本：应用内对话框 ---- */
.nb-ov{
  position:fixed;inset:0;z-index:140;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgb(16 24 32 / .34);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
}
.nb-ov.open{display:flex;animation:nbFade .18s ease}
@keyframes nbFade{from{opacity:0}to{opacity:1}}
/* ---- 笔记本密码锁 ---- */
.lk-ov{
  position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgb(16 24 32 / .34);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
}
.lk-ov.open{display:flex;animation:nbFade .18s ease}
.lk-dlg{
  width:min(360px,100%);background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  border-radius:18px;box-shadow:var(--shadow-lift);padding:20px 20px 16px;
  animation:nbIn .24s var(--spring);
}
.lk-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgb(var(--ivy)/.12);color:rgb(var(--ivy));margin-bottom:12px}
.lk-ico svg{width:19px;height:19px}
.lk-dlg h3{margin:0 0 6px;font-size:16.5px;font-weight:600;color:rgb(var(--ink))}
.lk-desc{margin:0 0 14px;font-size:12.5px;line-height:1.7;color:rgb(var(--muted))}
.lk-field{margin-bottom:8px}
.lk-field[hidden]{display:none!important}
.lk-field input{
  width:100%;height:40px;border-radius:10px;border:.5px solid rgb(var(--line));
  background:rgb(var(--canvas));padding:0 12px;font-size:14px;color:rgb(var(--ink));outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.lk-field input:focus{border-color:rgb(var(--ivy)/.55);box-shadow:0 0 0 3px rgb(var(--ivy)/.1)}
.lk-field textarea{
  width:100%;min-height:96px;border-radius:10px;border:.5px solid rgb(var(--line));
  background:rgb(var(--canvas));padding:10px 12px;font-size:13.5px;line-height:1.65;
  color:rgb(var(--ink));outline:none;resize:vertical;font-family:inherit;
}
.lk-field textarea:focus{border-color:rgb(var(--ivy)/.55);box-shadow:0 0 0 3px rgb(var(--ivy)/.1)}
.lk-err{min-height:18px;font-size:12px;color:rgb(var(--danger));line-height:1.5}
.lk-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.lk-btn{height:36px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:500;transition:filter .15s}
.lk-btn.ghost{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.lk-btn.go{background:rgb(var(--ivy));color:#fff}
.lk-btn.go:hover{filter:brightness(1.06)}
.lk-btn:disabled{opacity:.55}
.lk-btn.armed{background:rgb(var(--danger));color:#fff}
.lk-forgot{margin:12px 0 0;text-align:center;font-size:12px;line-height:1.6;color:rgb(var(--faint));
  cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgb(var(--faint))}
.lk-forgot[hidden]{display:none!important}
.lk-forgot:hover{color:rgb(var(--ivy))}
/* 侧栏里的锁标记 */
.nb-lock{display:inline-grid;place-items:center;width:13px;height:13px;margin-right:4px;color:rgb(var(--faint));flex:0 0 auto}
.nb-lock svg{width:12px;height:12px}
/* 文档区的锁屏 / 列表里的锁卡片 */
.lock-screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:64px 24px}
.lock-screen .ls-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
  background:rgb(var(--ivy)/.1);color:rgb(var(--ivy))}
.lock-screen .ls-ico svg{width:24px;height:24px}
.lock-screen h3{margin:6px 0 0;font-size:17px;font-weight:600;color:rgb(var(--ink))}
.lock-screen p{margin:0;font-size:13px;line-height:1.75;color:rgb(var(--muted));max-width:300px}
.lock-screen .ls-btn{margin-top:8px;height:38px;padding:0 18px;border-radius:10px;
  background:rgb(var(--ivy));color:#fff;font-size:13.5px;font-weight:500}
.lock-screen .ls-forgot{margin-top:2px;font-size:12px;color:rgb(var(--faint));cursor:pointer;
  text-decoration:underline;text-underline-offset:2px}
.lock-screen .ls-forgot:hover{color:rgb(var(--ivy))}
.lock-mini{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 16px}
.lock-mini .ls-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:rgb(var(--ivy)/.1);color:rgb(var(--ivy))}
.lock-mini .ls-ico svg{width:20px;height:20px}
.lock-mini .lm-t{font-size:13.5px;font-weight:600;color:rgb(var(--ink))}
.lock-mini .lm-d{font-size:12px;line-height:1.7;color:rgb(var(--faint));max-width:230px}
.lock-mini .lm-btn{margin-top:2px;height:32px;padding:0 14px;border-radius:9px;
  background:rgb(var(--ivy));color:#fff;font-size:12.5px}
.lock-mini .lm-forgot{font-size:11.5px;color:rgb(var(--faint));cursor:pointer;
  text-decoration:underline;text-underline-offset:2px}
.lock-mini .lm-forgot:hover{color:rgb(var(--ivy))}
.nb-dlg{
  width:min(400px,100%);background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  border-radius:18px;box-shadow:var(--shadow-lift);padding:20px 20px 16px;
  animation:nbIn .24s var(--spring);
}
@keyframes nbIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.nb-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:17px}
.nb-ico{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));
}
.nb-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb-tt{flex:1;min-width:0;padding-top:1px}
.nb-tt h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:rgb(var(--ink))}
.nb-tt p{margin:4px 0 0;font-size:11.5px;line-height:1.5;color:rgb(var(--muted))}
.nb-x{width:26px;height:26px;border-radius:8px;color:rgb(var(--faint));font-size:19px;line-height:1;flex:0 0 auto}
.nb-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.nb-preview{
  display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:16px;
  border-radius:12px;background:rgb(var(--sunken));border:.5px solid rgb(var(--line));
}
.nb-pv-cover{
  width:38px;height:44px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;
  color:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .12);transition:background .18s;
}
.nb-pv-cover svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb-pv-name{font-size:13.5px;font-weight:600;color:rgb(var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-pv-sub{font-size:11px;color:rgb(var(--muted));margin-top:3px}
.nb-lbl{display:block;font-size:11.5px;font-weight:600;color:rgb(var(--ink-2));margin-bottom:7px}
.nb-field{
  display:flex;align-items:center;height:40px;border-radius:10px;padding:0 11px;
  background:rgb(var(--surface));border:1.5px solid rgb(var(--line));transition:border-color .15s,box-shadow .15s;
}
.nb-field:focus-within{border-color:rgb(var(--ivy));box-shadow:0 0 0 3px rgb(var(--ivy) / .12)}
.nb-field.bad{border-color:rgb(var(--danger));box-shadow:0 0 0 3px rgb(var(--danger) / .1)}
.nb-field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;font-size:13.5px;color:rgb(var(--ink))}
.nb-field input::placeholder{color:rgb(var(--faint))}
.nb-count{font-size:10.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums;flex:0 0 auto;margin-left:8px}
.nb-err{font-size:11.5px;color:rgb(var(--danger));margin:6px 1px 0;min-height:15px}
.nb-sec{display:flex;align-items:center;gap:8px;margin:2px 0 7px}
.nb-sec span{font-size:11.5px;font-weight:600;color:rgb(var(--ink-2));flex:0 0 auto}
.nb-sec i{flex:1;height:1px;background:rgb(var(--line))}
.nb-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.nb-quick button{height:27px;padding:0 11px;border-radius:8px;background:rgb(var(--sunken));font-size:12px;color:rgb(var(--ink-2));transition:background .12s,color .12s}
.nb-quick button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.nb-quick button.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-weight:500}
.nb-sw{display:flex;gap:9px;margin:3px 0 18px;align-items:center}
.nb-sw button{width:20px;height:20px;border-radius:50%;padding:0;position:relative;transition:transform .14s var(--spring)}
.nb-sw button:hover{transform:scale(1.14)}
.nb-sw button.on::after{content:'';position:absolute;inset:-4px;border:1.5px solid currentColor;border-radius:50%}
.nb-foot{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:.5px solid rgb(var(--line))}
.nb-tip{font-size:10.5px;color:rgb(var(--faint));flex:1}
.nb-btn{height:34px;padding:0 15px;border-radius:9px;font-size:12.5px;font-weight:500;transition:background .14s,transform .1s;flex:0 0 auto}
.nb-btn:active{transform:scale(.97)}
.nb-btn.ghost{background:rgb(var(--sunken));color:rgb(var(--ink-2))}
.nb-btn.ghost:hover{background:rgb(var(--hover))}
.nb-btn.go{background:rgb(var(--ivy));color:#fff;display:flex;align-items:center;gap:6px}
.nb-btn.go:hover{background:rgb(var(--ivy-hover))}
.nb-btn.go svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;opacity:.9}
/* 删除确认模式：隐藏输入相关区块，只留预览 + 危险按钮 */
.nb-dlg.del .nb-lbl,.nb-dlg.del .nb-field,.nb-dlg.del .nb-err,
.nb-dlg.del .nb-sec,.nb-dlg.del .nb-quick,.nb-dlg.del .nb-sw{display:none}
.nb-dlg.del .nb-preview{margin-bottom:6px}
.nb-ico.danger{background:rgb(var(--danger) / .12);color:rgb(var(--danger))}
.nb-btn.go.danger{background:rgb(var(--danger))}
.nb-btn.go.danger:hover{filter:brightness(.9)}
@media (max-width:480px){
  .nb-dlg{padding:17px 16px 14px;border-radius:16px}
  .nb-tip{display:none}
  .nb-foot .nb-btn{flex:1}
}

/* ---- 提醒设置卡片 ---- */
.due-ov{
  position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;
  background:rgb(16 24 32 / .16);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.due-ov.open{display:flex}
.due-card{
  width:min(372px,92vw);background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  border-radius:14px;box-shadow:var(--shadow-lift);padding:15px 16px 13px;
  animation:dueIn .18s var(--spring);
}
@keyframes dueIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.due-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.due-cb{
  height:27px;padding:0 11px;border-radius:8px;background:rgb(var(--sunken));
  font-size:12.5px;color:rgb(var(--ink-2));transition:background .12s,color .12s;
}
.due-cb:hover{background:rgb(var(--hover))}
.due-cb.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-weight:500}
.due-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.due-row>label{width:34px;flex:0 0 auto;font-size:12.5px;color:rgb(var(--muted))}
.due-row input[type=date],.due-row input[type=time],.due-row select{
  flex:1;min-width:0;height:33px;padding:0 10px;border:1px solid rgb(var(--line));border-radius:8px;
  background:rgb(var(--surface));font-size:13px;color:rgb(var(--ink));font-family:inherit;
}
.due-row input:focus,.due-row select:focus{
  outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09);
}
.due-tip{font-size:11.5px;line-height:1.6;color:rgb(var(--faint));margin:3px 0 13px;padding-left:44px}
.due-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:pointer;user-select:none}
/* .due-row>label 只给左边那个 34px 的标签，勾选框这行要占满 */
.due-row>label.due-chk{width:auto;flex:1 1 auto;font-size:12.5px;color:rgb(var(--ink-2))}
.due-chk input{width:15px;height:15px;margin:0;accent-color:rgb(var(--ivy));cursor:pointer}
.due-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.due-del{margin-right:auto;font-size:12.5px;color:rgb(var(--danger));padding:5px 9px;border-radius:7px;transition:background .12s,color .12s}
.due-del:hover{background:rgb(var(--danger-soft))}
.due-del[disabled]{color:rgb(var(--faint));opacity:.62;cursor:default}
.due-del[disabled]:hover{background:none}
.due-ok{height:33px;padding:0 18px;border-radius:9px;background:rgb(var(--ivy));color:#fff;font-size:13px;font-weight:500}
.due-ok:hover{background:rgb(var(--ivy-hover))}

/* ---- 提醒中心：浏览器通知 + 日历订阅 ---- */
.rc-card{
  width:min(432px,93vw);max-height:86vh;overflow:auto;background:rgb(var(--surface));
  border:.5px solid rgb(var(--line));border-radius:14px;box-shadow:var(--shadow-lift);
  padding:16px 17px 14px;animation:dueIn .18s var(--spring);
}
.rc-title{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:3px}
.rc-title svg{width:16px;height:16px;stroke:rgb(var(--ivy));fill:none;stroke-width:1.7}
.rc-sub{font-size:11.5px;line-height:1.65;color:rgb(var(--faint));margin-bottom:13px}
.rc-box{
  border:.5px solid rgb(var(--line));border-radius:11px;padding:11px 12px;margin-bottom:10px;
  background:rgb(var(--sunken)/.55);
}
.rc-box-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.rc-box-h svg{width:14px;height:14px;flex:0 0 auto;stroke:rgb(var(--ivy));fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rc-box-h b{font-size:12.5px;font-weight:600;color:rgb(var(--ink))}
.rc-badge{
  margin-left:auto;font-size:11px;padding:1.5px 7px;border-radius:20px;
  background:rgb(var(--hover));color:rgb(var(--muted));
}
.rc-badge.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.rc-badge.no{background:rgb(var(--warn-soft));color:rgb(var(--warn-ink))}
.rc-p{font-size:11.5px;line-height:1.7;color:rgb(var(--muted));margin-bottom:8px}
.rc-link{
  display:block;font-family:var(--font-mono);font-size:11px;line-height:1.55;color:rgb(var(--ink-2));
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:8px;
  padding:7px 8px;margin-bottom:8px;word-break:break-all;user-select:all;
}
.rc-acts{display:flex;flex-wrap:wrap;gap:6px}
.rc-btn{
  height:29px;padding:0 11px;border-radius:8px;background:rgb(var(--surface));
  border:.5px solid rgb(var(--line));font-size:12.5px;color:rgb(var(--ink-2));
  display:inline-flex;align-items:center;gap:5px;
}
.rc-btn:hover{background:rgb(var(--hover))}
.rc-btn.primary{background:rgb(var(--ivy));border-color:transparent;color:#fff;font-weight:500}
.rc-btn.primary:hover{background:rgb(var(--ivy-hover))}
.rc-btn.danger{color:rgb(var(--danger))}
.rc-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.rc-foot{display:flex;justify-content:flex-end;margin-top:11px}
.rc-close{height:31px;padding:0 15px;border-radius:9px;background:rgb(var(--sunken));font-size:13px;color:rgb(var(--ink-2))}
.rc-close:hover{background:rgb(var(--hover))}
.rc-switch{
  margin-left:auto;width:38px;height:22px;border-radius:12px;background:rgb(var(--hover));
  position:relative;transition:background .16s var(--spring);flex:0 0 auto;
}
.rc-switch i{
  position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgb(16 24 32 / .22);transition:transform .18s var(--spring);
}
.rc-switch.on{background:rgb(var(--ivy))}
.rc-switch.on i{transform:translateX(16px)}
.rc-perm{display:flex;align-items:center;gap:8px;font-size:12px;color:rgb(var(--muted))}
.rc-perm b{font-weight:600}
.rc-ok{color:rgb(var(--ivy-ink))}
.rc-no{color:rgb(var(--warn-ink))}
.rc-mini{
  margin-left:auto;font-size:11.5px;color:rgb(var(--ivy-ink));padding:3px 8px;border-radius:7px;
  background:rgb(var(--ivy-soft));
}
.rc-mini:hover{background:rgb(var(--ivy-soft)/.7)}
.rc-select{
  width:100%;height:33px;padding:0 10px;border:1px solid rgb(var(--line));border-radius:8px;
  background:rgb(var(--surface));font-size:13px;color:rgb(var(--ink));font-family:inherit;
}
.rc-select:focus{outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09)}
.rc-note{font-size:11px;line-height:1.6;color:rgb(var(--faint));margin-top:7px}
.rc-note a{color:rgb(var(--ivy-ink));cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rc-steps{margin:0 0 10px;padding-left:17px;font-size:11.5px;line-height:1.75;color:rgb(var(--muted))}
.rc-steps li{margin-bottom:3px}
.rc-steps b{font-weight:600;color:rgb(var(--ink-2))}
.rc-steps a{color:rgb(var(--ivy-ink));text-decoration:underline;text-underline-offset:2px}
.rc-sub{font-size:10.5px;color:rgb(var(--faint));margin-top:12px;padding-top:9px;border-top:.5px solid rgb(var(--line))}
.rc-legacy .rc-src{margin-top:6px}
.rc-src{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;background:rgb(var(--sunken));margin-top:7px}
.rc-src-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc-src-m b{font-size:12px;font-weight:500;color:rgb(var(--ink))}
.rc-src-m span{font-size:10.5px;color:rgb(var(--faint));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-add{display:flex;gap:6px;margin-top:8px}
.rc-input{
  flex:1;min-width:0;height:33px;padding:0 10px;border-radius:9px;font-size:12px;
  border:.5px solid rgb(var(--line));background:rgb(var(--sunken));color:rgb(var(--ink));
}
.rc-input:focus{outline:none;border-color:rgb(var(--ivy)/.5);box-shadow:0 0 0 3px rgb(var(--ivy)/.09)}
.rc-link{position:relative;padding-right:30px}
.rc-copy{
  position:absolute;right:5px;top:6px;width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:rgb(var(--muted));
}
.rc-copy:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.rc-copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.rc-card .rc-box-h svg{width:14px;height:14px;stroke:rgb(var(--muted));fill:none;stroke-width:1.8;flex:0 0 auto}

.sl-empty{padding:11px 9px;font-size:12px;color:rgb(var(--faint));line-height:1.6}

/* ---- 选中文字后的浮动工具条 ---- */
.selbar{
  position:fixed;z-index:82;display:flex;align-items:center;gap:1px;padding:3px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:9px;
  box-shadow:var(--shadow-lift);opacity:0;transform:translateY(4px) scale(.97);
  pointer-events:none;transition:opacity .12s,transform .14s var(--spring);
}
.selbar.open{opacity:1;transform:none;pointer-events:auto}
.selbar button{
  height:26px;min-width:26px;padding:0 7px;border-radius:6px;font-size:12px;color:rgb(var(--muted));
  display:flex;align-items:center;gap:4px;transition:background .12s,color .12s;
}
.selbar button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.selbar button b{font-size:13px;font-weight:700}
.selbar button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.selbar button b.sb-sl{font-size:15px;font-weight:600;line-height:1}
.selbar button b.sb-br{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:-.5px}
.selbar .sb-sep{width:1px;height:14px;background:rgb(var(--line));margin:0 3px;flex:0 0 auto}
/* 跨段落选区：格式类按钮没法同时作用在多块上，只留复制 / 剪切 / 粘贴 */
.selbar.cross [data-sb="h"],.selbar.cross [data-sb="b"],.selbar.cross [data-sb="i"],
.selbar.cross [data-sb="s"],.selbar.cross [data-sb="mark"],.selbar.cross [data-sb="todo"],
.selbar.cross [data-sb="wiki"],.selbar.cross [data-sb="link"],.selbar.cross [data-sb="ai"],
.selbar.cross .sb-sep{display:none!important}
@media (max-width:640px){
  .selbar button{height:30px;min-width:30px;padding:0 9px;font-size:13px}
  .slash{width:min(258px,86vw)}
  /* 格式工具条收进 + 之后，手机上必须保留右上角这个插入入口 */
  .paper .tabbar{padding-right:84px}
  /* 兜底：若某次高度没量准，源码框自己也能滚，不至于把正文永远藏起来 */
  .source{overflow-y:auto}
}

/* ---- 表格尺寸选择器（工具栏「表格」下拉） ---- */
.tbl-pick{padding:5px 3px 0;user-select:none;touch-action:none}
.tbl-grid{display:grid;grid-template-columns:repeat(10,17px);gap:3px}
.tbl-grid i{width:17px;height:17px;border-radius:4px;background:rgb(var(--hover));transition:background .1s,box-shadow .1s}
.tbl-grid i.on{background:rgb(var(--ivy)/.2);box-shadow:inset 0 0 0 1px rgb(var(--ivy)/.55)}
.tbl-info{margin-top:10px;text-align:center;font-size:11.5px;color:rgb(var(--muted));font-variant-numeric:tabular-nums}

/* ---- 待办提醒时间小标签 ---- */
.prose .due-chip{
  display:inline-flex;align-items:center;gap:4px;font-size:.8em;line-height:1.55;
  padding:0 8px 0 5px;border-radius:20px;background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));
  vertical-align:1px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background .12s,color .12s;
}
.prose .due-chip:hover{background:rgb(var(--ivy)/.16)}
.prose .due-chip.late{background:rgb(var(--danger-soft));color:rgb(var(--danger))}
.prose .due-chip .dc-ic{
  width:13px;height:13px;border-radius:3px;background:rgb(var(--ivy));color:#fff;
  display:grid;place-items:center;flex:0 0 auto;
}
.prose .due-chip.late .dc-ic{background:rgb(var(--danger))}
.prose .rep-chip{
  display:inline-flex;align-items:center;gap:3px;font-size:.78em;line-height:1.55;
  padding:0 7px;border-radius:20px;background:rgb(var(--sunken));color:rgb(var(--muted));
  vertical-align:1px;white-space:nowrap;margin-left:3px;
}
.prose .due-chip .dc-ic svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- Mermaid 图表块 ---- */
.mb{margin:1.35em 0;padding:16px 10px;border-radius:12px;background:rgb(var(--sunken));text-align:center;overflow:auto;min-height:44px}
.mb svg{max-width:100%;height:auto;display:inline-block}
.mb-hint{font-size:12.5px;color:rgb(var(--faint));padding:8px 0}
.mb-err{font-size:12.5px;color:rgb(var(--danger));padding:4px;text-align:left}
.mb-src{margin:8px 0 0;padding:10px 12px;border-radius:8px;background:rgb(var(--hover));font-family:var(--font-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:rgb(var(--muted));text-align:left}
.blk .mb{margin:.2em 0}

/* ---- Markdown / 快捷键帮助面板 ---- */
.help-ov{
  position:fixed;inset:0;z-index:130;background:rgb(16 24 32 / .34);
  display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.help-ov.open{opacity:1;pointer-events:auto}
.help-card{
  width:min(720px,100%);max-height:min(82vh,780px);display:flex;flex-direction:column;
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-lift);overflow:hidden;
  transform:translateY(10px) scale(.995);transition:transform .22s var(--spring);
}
.help-ov.open .help-card{transform:none}
.help-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px}
.help-hd h3{font-family:var(--font-serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.help-hd p{font-size:12.5px;color:rgb(var(--faint));margin-top:5px}
.help-x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:rgb(var(--faint));flex:0 0 auto}
.help-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.help-x svg{width:15px;height:15px}
.help-tabs{display:flex;gap:4px;padding:0 18px 10px;border-bottom:1px solid rgb(var(--line))}
.help-tab{padding:6px 11px;border-radius:8px;font-size:13px;color:rgb(var(--muted))}
.help-tab.on{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.help-hd .jump-key{margin-left:auto;margin-right:8px;white-space:nowrap;background:rgb(var(--hover));color:rgb(var(--ink))}

/* ---- 客户端下载 ---- */
.dl-body{padding:8px 22px 22px;overflow:auto}
.dl-row{display:flex;align-items:center;gap:14px;padding:14px 15px;border:1px solid rgb(var(--line));border-radius:12px;margin-top:12px}
.dl-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:rgb(var(--hover));color:rgb(var(--ink))}
.dl-ic svg{width:20px;height:20px}
.dl-info{flex:1;min-width:0}
.dl-info b{display:block;font-size:14px;font-weight:600}
.dl-info span{display:block;font-size:12.5px;line-height:1.6;color:rgb(var(--faint));margin-top:3px}
.dl-btn{flex:0 0 auto;padding:8px 16px;border-radius:9px;background:rgb(var(--ink));color:rgb(var(--surface));font-size:13px;font-weight:500;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.dl-btn:hover{opacity:.88}
.dl-btn:disabled{opacity:.45;cursor:default}
.dl-btn.ghost{background:transparent;color:rgb(var(--ink-2));border:1px solid rgb(var(--line))}
.dl-btn.ghost:hover{background:rgb(var(--hover));opacity:1}
@media (max-width:520px){
  .dl-row{flex-wrap:wrap;row-gap:10px}
  /* 文字占满「图标右边」整行，两个按钮一起换到第二行并左对齐，避免一个在右一个在左 */
  .dl-row .dl-info{flex:1 1 calc(100% - 54px)}
  .dl-row .dl-btn{margin-left:54px}
  .dl-row .dl-btn + .dl-btn{margin-left:8px}
}
.dl-tip{margin-top:16px;padding-top:14px;border-top:1px solid rgb(var(--line));font-size:12.5px;line-height:1.85;color:rgb(var(--muted))}
.dl-tip b{color:rgb(var(--ink-2));font-weight:600}
.dl-tip code{font-size:11.5px;background:rgb(var(--hover));padding:1px 5px;border-radius:5px}
/* 设置页「使用说明」：正文按笔记排版（窄栏、衬线小标题），右侧一条悬浮大纲 */
.help-wrap{display:flex;align-items:flex-start;gap:26px}
.help-main{flex:1;min-width:0}
.set-help-tabs{margin:4px 0 6px}
.help-doc{max-width:760px;margin:0 auto;padding:2px 0 48px}
.help-doc .help-sec{margin-top:32px}
.help-doc .help-sec:first-child{margin-top:12px}
.help-doc .help-sec>h4{
  font-family:var(--font-serif);font-size:18px;font-weight:600;letter-spacing:-.01em;
  color:rgb(var(--ink));margin:0 0 8px;
}
.help-doc .help-p{font-size:14.5px;line-height:1.85;color:rgb(var(--ink-2));padding:0 0 10px}
.help-doc .help-p code{font-size:12px;padding:2px 6px;border-radius:5px}
.help-doc .help-code{font-size:12.5px;line-height:1.9;border-radius:10px;margin-top:6px}
.help-doc .help-row{font-size:14px;padding:9px 2px}
.help-doc .help-table{margin-top:8px}
.help-doc .help-hero{padding:10px 0 4px}
.help-ol{
  position:sticky;top:6px;flex:0 0 212px;width:212px;
  padding:10px 8px 12px;border-radius:12px;
  background:rgb(var(--surface)/.72);border:.5px solid rgb(var(--line));
  box-shadow:0 10px 24px -18px rgb(16 24 32/.35);
  opacity:.62;transition:opacity .16s;
  max-height:calc(100vh - 128px);overflow:auto;scrollbar-width:none;
}
.help-ol::-webkit-scrollbar{display:none}
.help-ol:hover{opacity:1}
.help-ol .ol-t{font-size:10.5px;font-weight:500;letter-spacing:.04em;color:rgb(var(--faint));padding:2px 7px 6px}
.help-ol button{
  display:block;width:100%;text-align:left;padding:5px 7px;border-radius:6px;
  font-size:12px;line-height:1.45;color:rgb(var(--muted));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.help-ol button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.help-ol button.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
/* 一级：栏目（手风琴） */
.help-ol .ol-l1{
  display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;
  color:rgb(var(--ink));padding:6px 7px;
}
.help-ol .ol-l1 .ol-caret{
  width:11px;flex:0 0 11px;font-style:normal;font-size:9px;line-height:1;
  color:rgb(var(--faint));text-align:left;
}
.help-ol .ol-l1 span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.help-ol .ol-l1.on{color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft)/.55)}
/* 二级：章节 */
.help-ol .ol-l2{
  padding-left:19px;font-size:11.5px;color:rgb(var(--ink-2));
  border-left:1px solid rgb(var(--line));border-radius:0 6px 6px 0;margin-left:9px;
}
.help-ol .ol-l2.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-weight:600;border-left-color:rgb(var(--ivy)/.5)}
/* 三级：要点 */
.help-ol .ol-l3{
  position:relative;padding-left:30px;font-size:11.5px;color:rgb(var(--faint));
  border-left:1px solid rgb(var(--line));border-radius:0 6px 6px 0;margin-left:19px;
}
.help-ol .ol-l3::before{
  content:'';position:absolute;left:5px;top:50%;width:4px;height:1px;background:rgb(var(--faint)/.7);
}
.help-ol .ol-l3:hover{color:rgb(var(--ink-2))}
@media (max-width:1180px){ .help-ol{display:none!important} }
.help-body{overflow:auto;padding:6px 22px 24px;overscroll-behavior:contain}
.help-p{font-size:13px;line-height:1.9;color:rgb(var(--ink-2));padding:6px 2px 2px}
.help-p code{font-family:var(--font-mono);font-size:11.5px;padding:1px 5px;border-radius:4px;background:rgb(var(--code-bg));color:rgb(var(--ivy-ink))}
.help-code{margin:8px 0 0;padding:12px 14px;border-radius:9px;background:rgb(var(--code-bg));font-family:var(--font-mono);font-size:12px;line-height:1.95;color:rgb(var(--ink-2));white-space:pre-wrap;overflow:auto}
.help-sec{margin-top:20px}
.help-sec>h4{font-size:11.5px;font-weight:600;color:rgb(var(--faint));letter-spacing:.06em;margin-bottom:4px}
.help-row{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid rgb(var(--line)/.55);font-size:13.5px;color:rgb(var(--ink-2))}
.help-row:last-child{border-bottom:0}
.help-row .syn{
  font-family:var(--font-mono);font-size:11.5px;line-height:1.5;padding:3px 7px;border-radius:6px;
  background:rgb(var(--code-bg));color:rgb(var(--ivy-ink));flex:0 0 auto;max-width:210px;
  white-space:pre-wrap;word-break:break-all;
}
.help-row .di{margin-left:auto;text-align:right;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto}
.help-row .kbd{margin-left:auto;flex:0 0 auto}

/* 帮助面板第一页：上面三张「怎么用」，下面一张四列速查表 */
.help-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 0 2px}
.hh{background:rgb(var(--sunken));border-radius:11px;padding:11px 12px}
.hh.hl{background:rgb(var(--ivy-soft))}
.hh-t{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:rgb(var(--ink));margin-bottom:5px}
.hh-t i{
  font-style:normal;font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 6px;border-radius:5px;
  background:rgb(var(--surface));color:rgb(var(--ivy-ink));box-shadow:0 0 0 .5px rgb(var(--line));
}
.hh.hl .hh-t{color:rgb(var(--ivy-ink))}
.hh-p{font-size:11.5px;line-height:1.72;color:rgb(var(--muted))}
.hh.hl .hh-p{color:rgb(var(--ink-2))}
.help-table{width:100%;border-collapse:collapse;margin-top:14px;table-layout:fixed}
.help-table th{
  font-size:11px;font-weight:600;color:rgb(var(--faint));text-align:left;
  padding:0 8px 7px;border-bottom:1px solid rgb(var(--line));letter-spacing:.02em;
}
.help-table td{
  padding:9px 8px;border-bottom:1px solid rgb(var(--line)/.55);
  font-size:12.5px;color:rgb(var(--ink-2));vertical-align:middle;
}
.help-table tr:last-child td{border-bottom:0}
.help-table th:nth-child(1),.help-table td:nth-child(1){width:23%}
.help-table th:nth-child(2),.help-table td:nth-child(2){width:36%}
.help-table th:nth-child(3),.help-table td:nth-child(3){width:19%}
.help-table th:nth-child(4),.help-table td:nth-child(4){width:22%}
.help-table td.ht-n{color:rgb(var(--ink));font-weight:500;white-space:nowrap}
.help-table code{
  font-family:var(--font-mono);font-size:11px;padding:1.5px 5px;border-radius:4px;
  background:rgb(var(--code-bg));color:rgb(var(--ivy-ink));white-space:nowrap;
}
.help-table .ht-k span{
  display:inline-block;font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--muted));
  background:rgb(var(--sunken));padding:2px 6px;border-radius:5px;margin-right:2px;white-space:nowrap;
}
.help-table .ht-eff{color:rgb(var(--muted));font-size:12px}
