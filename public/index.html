  color:rgb(var(--ink-2));
}
.prose blockquote p:last-child{margin-bottom:0}
.prose code{
  font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));
  padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line));
}
.prose pre{
  background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:1.2em 0;
}
.prose pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.prose hr{border:0;border-top:1px solid rgb(var(--line));margin:2.2em 0}
.prose img{max-width:100%;border-radius:9px;display:block;margin:1.2em 0}
.prose a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.prose mark{background:rgb(var(--hl-green-bg));color:rgb(var(--hl-green-fg));padding:1px 3px;border-radius:4px}
.prose mark.hl-yellow{background:rgb(var(--hl-yellow-bg));color:rgb(var(--hl-yellow-fg))}
.prose mark.hl-pink{background:rgb(var(--hl-pink-bg));color:rgb(var(--hl-pink-fg))}
.prose mark.hl-blue{background:rgb(var(--hl-blue-bg));color:rgb(var(--hl-blue-fg))}
.prose mark.hl-purple{background:rgb(var(--hl-purple-bg));color:rgb(var(--hl-purple-fg))}
.prose mark.hl-gray{background:rgb(var(--hl-gray-bg));color:rgb(var(--hl-gray-fg))}
.prose del{color:rgb(var(--muted))}
.wiki-pop{
  position:fixed;z-index:86;width:290px;max-height:236px;overflow:auto;padding:5px;display:none;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:11px;
  box-shadow:var(--shadow-lift);
}
.wiki-pop.open{display:block}
.wiki-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:default}
.wiki-item.on{background:rgb(var(--hover));color:rgb(var(--ink))}
.wiki-ico{flex:0 0 auto;color:rgb(var(--ivy));font-size:11px;line-height:1}
.wiki-new{flex:0 0 auto;font-size:10.5px;color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));padding:1px 5px;border-radius:4px}
.wiki-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiki-empty{padding:10px;font-size:12px;color:rgb(var(--faint))}
.prose .wikilink{
  color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));text-decoration:none;
  padding:1.5px 5px;border-radius:5px;font-size:.94em;white-space:nowrap;
}
/* 统一垂直节奏：块与块之间只留一个间距（用相邻兄弟的 margin-top，避免外边距叠加）。
   注意别把这条的间距调成 0——那会让预览里的段落全糊成一整片（源码有换行、预览没段距）。 */
.prose > *, .blk-view > *{margin-top:0 !important;margin-bottom:0 !important}
.prose > * + *, .blk + .blk, .blk-view > * + *{margin-top:.78em !important}
/* 标题前后留白比正文段落更大，读起来才有层级 */
.prose > h1, .prose > h2, .prose > h3, .prose > h4, .prose > h5, .prose > h6{margin-top:1.55em !important}
.prose > h1 + *, .prose > h2 + *, .prose > h3 + *,
.prose > h4 + *, .prose > h5 + *, .prose > h6 + *{margin-top:.42em !important}
.prose > :first-child{margin-top:0 !important}
/* 源码里的连续空行：用一个定高占位撑开，段距仍由上面的相邻块规则负责 */
.prose > .md-blank{margin:0 !important;padding:0}
/* 块编辑里同样按空行数撑开，两边看到的留白一致 */
.blk.blk-gap{margin-top:calc(var(--gap-n) * 1.2em) !important}
.prose > hr, .blk-view > hr{margin-top:1.15em !important;margin-bottom:1.15em !important}
/* 有边框/底色的块（代码块、表格、引用）留一点呼吸，否则会和相邻文字粘在一起 */
.prose > pre, .prose > table, .prose > blockquote,
.blk-view > pre, .blk-view > table, .blk-view > blockquote{margin-top:.34em !important;margin-bottom:.34em !important}
.prose > ul, .prose > ol, .blk-view > ul, .blk-view > ol{margin-top:.16em !important;margin-bottom:.16em !important}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.94em}
.prose th,.prose td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.prose th{background:rgb(var(--sunken));font-weight:600}
.prose .task{list-style:none;margin-left:-1.1em}
.prose .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.prose .empty{color:rgb(var(--faint));font-size:15px}
.source{
  display:none;width:100%;min-height:360px;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));padding:0;
}
.doc.mode-edit .prose{display:none}
.doc.mode-edit .source{display:block}
.doc.mode-preview .prose{cursor:text}
/* 双栏：左边源码，右边即时预览，两栏等高、各自滚动并联动 */
.doc.mode-split{max-width:1180px;padding-bottom:28px}
.doc.mode-split .doc-body{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;
  align-items:stretch;height:max(360px, calc(100vh - 232px));min-height:360px;
}
/* 双栏左栏外面套一层 .src-wrap 当滚动容器，textarea 只按内容撑高。
   底部留白必须加在这层上：直接给 textarea 加 padding 会挤掉它的内容盒
   （border-box 下 padding 一大，能显示的行数就没了），而块级容器的底部内边距
   只是滚动区最后的一段空白，留多大都不影响正文可见区域 */
.doc.mode-split .src-wrap{
  grid-column:1;grid-row:1;height:100%;min-height:0;
  overflow-y:auto;padding-right:28px;
  /* 关掉滚动锚定：textarea 按内容长高时，Chrome 会「为了保持锚点不动」自己改 scrollTop，
     打字打到一半页面往上跳就是这么来的 */
  overflow-anchor:none;
  padding-bottom:var(--doc-pad-b, 30vh);
  border-right:1px solid #edf0f2;
}
.doc.mode-split .source{
  display:block;width:100%;padding:0;border:0;height:auto;min-height:0;overflow:hidden;
  font-family:var(--font-mono);font-size:13.5px;line-height:1.8;
}
.doc.mode-split #live{display:none}
.doc.mode-split .prose{
  grid-column:2;grid-row:1;padding-left:28px;
  padding-bottom:var(--doc-pad-b, 30vh);
  height:100%;min-height:0;max-height:none;overflow-y:auto;position:static;
}
.doc.mode-split .src-wrap::-webkit-scrollbar,
.doc.mode-split .prose::-webkit-scrollbar{width:8px}
.doc.mode-split .src-wrap::-webkit-scrollbar-thumb,
.doc.mode-split .prose::-webkit-scrollbar-thumb{background:rgb(var(--line));border-radius:8px}
[data-theme=dark] .doc.mode-split .src-wrap{border-right-color:#2b3035}
@media (max-width:900px){
  /* 窄屏「双栏」改成上下堆叠：源码在上、预览在下。
     原来只把 grid 改成单列，prose 还挂在 grid-column:2 上 → 被挤成一条 60 多像素宽，预览没法看 */
  .doc.mode-split .doc-body{grid-template-columns:1fr;height:auto}
  /* 堆叠时不再有「两栏内部滚动」，整页交给 #scroll，底部留空得还给页面 */
  .doc.mode-split{padding-bottom:var(--doc-pad-b, 30vh)}
  .doc.mode-split .src-wrap{grid-column:1;grid-row:1;height:auto;overflow:visible;border-right:0;padding-right:0;padding-bottom:0}
  .doc.mode-split .source{min-height:240px;overflow:visible}
  .doc.mode-split .prose{
    grid-column:1;grid-row:2;
    height:auto;max-height:none;padding-left:0;margin-top:14px;padding-top:14px;
    border-top:1px solid #edf0f2;
  }
}

/* ===== 所见即所得（块级） ===== */
.live{display:none}
.doc.mode-live #prose{display:none}
.doc.mode-live .source{display:none}
.doc.mode-live .live{display:block;min-height:360px;cursor:text}
.blk{position:relative}
.blk-src{
  display:none;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;color:rgb(var(--ink));
  padding:0;margin:0;field-sizing:content;caret-color:rgb(var(--ivy));
}
.blk.editing .blk-src{display:block}
.blk.editing .blk-view{display:none}
/* 空块刚套上标题/列表时，用灰字提示该写什么，一输入就消失 */
.blk-hint{
  display:none;position:absolute;left:0;top:0;width:100%;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.8;
  color:rgb(var(--faint));pointer-events:none;white-space:pre-wrap;overflow:hidden;
}
.blk-hint .hp{color:rgb(var(--faint))}
.blk-hint .ht{color:rgb(var(--faint));opacity:.72}
/* 有占位提示时正文透明、由 .blk-hint 显示灰字；
   但 color:transparent 会让 caret 一起变透明（光标看不见），所以单独把光标颜色要回来 */
.blk-src.has-hint{color:transparent;caret-color:rgb(var(--ink))}
.blk-view{min-height:1.2em}
.blk-view input[type=checkbox]{cursor:pointer}
.blk-view img{cursor:default}
.lv-tail{height:180px}
.lv-hint{color:rgb(var(--faint));font-size:15px;line-height:1.95}

/* empty state */
.blank{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgb(var(--faint));text-align:center}
.blank .kbd{font-family:var(--font-mono);font-size:11.5px;padding:3px 7px;border-radius:5px;background:rgb(var(--sunken));border:.5px solid rgb(var(--line))}
.blank p{margin:0;font-size:13.5px}

/* ============ outline（无边框透明悬浮 + 右边缘刻度） ============ */
/* 收起时：右边缘一列随笔记长度变化的短刻度，一根对应一个标题，当前位置高亮 */
.outline-zone{position:fixed;right:0;top:58px;bottom:0;width:26px;z-index:45}
.ol-mini{position:absolute;right:12px;top:34px;width:16px;transition:opacity .18s}
/* 手机专属的右边缘悬浮条（桌面用不上，桌面靠刻度 + hover） */
.ol-handle{display:none}
.ol-tick{
  position:absolute;right:0;height:1px;padding:0;border:0;border-radius:1px;
  background:rgb(var(--ink)/.28);
  transition:background .16s,height .16s,transform .16s;
}
[data-theme=dark] .ol-tick{background:rgb(255 255 255 / .3)}
.ol-tick.on{background:rgb(var(--ivy));height:2px;transform:scaleX(1.25);transform-origin:right center}
/* 列表项（二级）的刻度：更短更淡，标题才是主角 */
.ol-tick.li{background:rgb(var(--ink)/.18);height:1px}
[data-theme=dark] .ol-tick.li{background:rgb(255 255 255/.2)}
.ol-tick.li.on{background:rgb(var(--ivy)/.85);height:2px}
/* 卡片展开/固定时，刻度让位给卡片自己的短横线 */
.outline-zone:hover .ol-mini,
body.ol-peek .ol-mini,
body.outline-pinned .ol-mini,
body.ol-hidden .ol-mini{opacity:0;pointer-events:none}
body.ol-hidden .outline-zone{display:none}
.outline{
  /* right 仍是 4px：保持和右边缘刻度连续的鼠标热区，否则鼠标从边缘移进卡片会闪回去；
     视觉上的间距靠 padding-right 让内容左移实现 */
  position:fixed;right:4px;top:66px;z-index:56;
  width:210px;max-height:min(620px,calc(100vh - 116px));
  display:flex;flex-direction:column;
  padding:5px 17px 7px 9px;border:0;border-radius:14px;
  /* 底色与笔记纸面一致（--surface），浮在正文上时加一层柔和阴影分离 */
  background:rgb(var(--surface));
  box-shadow:0 10px 34px rgb(var(--ink)/.13),0 2px 8px rgb(var(--ink)/.07);
  transform:translateX(10px);transform-origin:right top;
  opacity:0;pointer-events:none;
  transition:transform .26s var(--spring),opacity .16s;
}
[data-theme=dark] .outline{box-shadow:0 10px 34px rgb(0 0 0/.5),0 2px 8px rgb(0 0 0/.35)}
/* 靠边整条热区不再直接把卡片叫出来：只有鼠标真的移到那串刻度上（JS 打 ol-hover）才展开 */
.outline:hover,
.outline.pinned,
body.ol-hover .outline,
body.ol-flash .outline{transform:none;opacity:1;pointer-events:auto}
/* 点了 × 之后强制收起：鼠标还压在卡片上时 :hover 会继续把它点亮，必须压过那条规则 */
body.ol-force-close .outline,
body.ol-force-close .outline:hover,
body.ol-force-close .outline.pinned{transform:translateX(10px);opacity:0;pointer-events:none}
body.ol-force-close .ol-mini{opacity:1;pointer-events:auto}
body.ol-flash .ol-mini{opacity:0;pointer-events:none}
.outline.hidden{display:none}
/* Chrome 会把「可滚动/可聚焦」的浮层当成可聚焦控件，画一圈原生焦点环（黑框），Safari 不画。
   大纲是纯浮层，不需要这圈；键盘焦点改用下面的内描边，仍然可见。 */
.outline,.outline-body{outline:none!important}
.outline-body:focus-visible,.ol-item:focus-visible{outline:none!important;box-shadow:inset 0 0 0 1.5px rgb(var(--ivy)/.55);border-radius:6px}
.outline-head{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:1px;padding:3px 3px 5px;flex:0 0 auto}
.ol-btn{
  width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--faint));transition:background .14s,color .14s;
}
.ol-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.ol-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
.ol-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* AI 大纲：生成时按钮转圈，结果是不可点的条目 */
.ol-btn.busy{color:rgb(var(--ivy-ink))}
.ol-btn.busy svg{animation:olspin .9s linear infinite}
@keyframes olspin{to{transform:rotate(360deg)}}
.ol-ai-tag{display:flex;align-items:center;gap:5px;padding:1px 8px 7px;font-size:10.5px;color:rgb(var(--ivy-ink))}
.ol-ai-tag svg{width:11px;height:11px}
.ol-ai-tag .ol-ai-ins{
  margin-left:auto;height:20px;padding:0 8px;border:0;border-radius:6px;cursor:pointer;
  background:rgb(var(--ivy)/.1);color:rgb(var(--ivy-ink));font-family:inherit;font-size:10.5px;font-weight:600;
}
.ol-ai-tag .ol-ai-ins:hover{background:rgb(var(--ivy)/.18)}
.ol-ai-item{cursor:default}
.ol-ai-item:hover{background:none}
.ol-ai-load{display:flex;align-items:center;gap:8px;padding:12px 8px;font-size:12px;line-height:1.6;color:rgb(var(--muted))}
.ol-ai-load i{width:11px;height:11px;flex:0 0 auto;border-radius:50%;border:1.6px solid rgb(var(--line));border-top-color:rgb(var(--ivy));animation:olspin .85s linear infinite}
/* 悬停说明：原生 title 要等一秒多才弹，这里自己画一枚小气泡——
   位置由 JS 按按钮中心算，超出卡片就贴到卡片内侧，永远不会被裁。 */
.ol-tip{
  position:absolute;top:calc(100% + 3px);left:0;z-index:6;
  padding:4px 9px;border-radius:7px;white-space:nowrap;
  font-size:11.5px;font-weight:500;line-height:1.5;letter-spacing:0;
  background:rgb(var(--ink)/.92);color:rgb(var(--surface));
  box-shadow:0 8px 20px rgb(var(--ink)/.2);
  opacity:0;transform:translateY(-3px);pointer-events:none;
  transition:opacity .1s ease,transform .1s ease;
}
.ol-tip.show{opacity:1;transform:translateY(0);transition-delay:.16s}
/* 触屏没有悬停，别让气泡在点按后残留 */
@media (hover:none){ .ol-tip{display:none} }
.outline-body{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:1px 1px 2px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.outline-body::-webkit-scrollbar{width:7px}
.outline-body::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.12);border-radius:7px;border:2px solid transparent;background-clip:content-box}
.ol-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-size:12.8px;line-height:1.55;color:rgb(var(--ink-2));
  padding:5px 8px;border-radius:7px;margin:0;
  transition:background .16s,color .16s,transform .2s var(--spring),padding-left .2s var(--spring);
}
.ol-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .dash{flex:0 0 auto;width:9px;height:1px;border-radius:1px;background:rgb(var(--ink)/.17);transition:width .18s,background .18s,height .18s}
/* 悬停：加粗加黑 + 轻微右移动效，松手回弹（选择器要压过 .ol-item.l1~l6 的字重/颜色） */
.outline .ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:600;transform:translateX(3px)}
.ol-item.l1{font-weight:500;color:rgb(var(--ink))}
.ol-item.l2{padding-left:21px}
.ol-item.l3{padding-left:34px;font-size:12.3px}
.ol-item.l4,.ol-item.l5,.ol-item.l6{padding-left:47px;font-size:12.3px;color:rgb(var(--muted))}
/* 大纲里的列表项（- 分支）：比标题弱一档，前面一个小圆点，按缩进层层往里退 */
.ol-item.ol-li{gap:7px;font-size:12.2px;color:rgb(var(--muted));font-weight:400}
.ol-item.ol-li .ol-bullet{flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:rgb(var(--ink)/.24)}
.ol-item.ol-li .t{opacity:.95}
.ol-item.ol-li:hover{color:rgb(var(--ink));font-weight:500}
.ol-item.ol-li.ol-done .t{text-decoration:line-through;opacity:.55}
.ol-item.ol-li.ol-done .ol-bullet{background:rgb(var(--ivy)/.6)}
.ol-item.on{color:rgb(var(--ink));font-weight:600}
.ol-item.on .dash{width:18px;height:1.5px;background:rgb(var(--ivy))}
.ol-empty{font-size:12px;color:rgb(var(--faint));padding:8px 9px}

/* ============ calendar（苹果日历镜像的月视图） ============ */
.cal-wrap{padding:32px 28px 26px;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.cal-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-month{font-size:21px;font-weight:650;color:rgb(var(--ink));letter-spacing:.3px}
.cal-month i{font-style:normal;font-size:12.5px;font-weight:500;color:rgb(var(--faint));margin-left:8px;letter-spacing:0}
.cal-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.cal-seg{display:flex;padding:2px;border-radius:9px;background:rgb(var(--sunken))}
.cal-seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:rgb(var(--muted));background:transparent;font-family:inherit}
.cal-seg button.on{background:rgb(var(--surface));color:rgb(var(--ink));box-shadow:0 1px 2px rgb(16 24 32/.13)}
.cal-step{display:flex;align-items:center;gap:1px}
.cal-step button{height:28px;min-width:28px;padding:0 6px;border-radius:7px;display:grid;place-items:center;color:rgb(var(--ink-2));background:transparent;font-family:inherit;font-size:12.5px}
.cal-step button:hover{background:rgb(var(--hover))}
.cal-step svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid rgb(var(--line))}
.cal-dow{padding:0 0 7px 9px;font-size:12px;color:rgb(var(--faint));font-weight:500}
.cal-body{
  flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));
  min-height:0;border-left:1px solid rgb(var(--line));border-top:1px solid rgb(var(--line));
}
.cal-cell{
  position:relative;border-right:1px solid rgb(var(--line));border-bottom:1px solid rgb(var(--line));
  padding:5px 6px 4px;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:0;
  cursor:pointer;transition:background .12s;
}
.cal-cell:hover{background:rgb(var(--hover))}
.cal-cell.out{background:rgb(var(--sunken)/.4)}
.cal-cell.out .cal-d{color:rgb(var(--faint));font-weight:500}
.cal-cl{display:flex;align-items:baseline;gap:5px;flex:0 0 auto;min-height:22px}
.cal-d{font-size:13px;font-weight:600;color:rgb(var(--ink));font-variant-numeric:tabular-nums;line-height:1.6}
.cal-cell.today .cal-d{
  min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:rgb(224 69 58);color:#fff;
  display:inline-grid;place-items:center;font-size:12.5px;font-weight:600;line-height:1;
}
.cal-l{font-size:10.5px;color:rgb(var(--faint));line-height:1.5;white-space:nowrap}
.cal-l.fest{color:rgb(var(--ivy));font-weight:600}
[data-theme=dark] .cal-l.fest{color:rgb(var(--ivy-ink))}
.cal-cell.today .cal-l{color:rgb(224 69 58)}
.cal-evs{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.cal-ev{
  display:flex;align-items:center;gap:4px;width:100%;text-align:left;font-family:inherit;
  font-size:11px;line-height:1.6;padding:1px 5px;border-radius:4px;color:rgb(var(--ink));
  background:var(--evbg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cal-ev b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.cal-ev .dot{width:5px;height:5px;border-radius:50%;background:var(--evc);flex:0 0 auto}
/* 笔记里的待办：小方点，做完的划掉变淡 */
.cal-ev.todo .dot{border-radius:1.5px}
.cal-ev.done{opacity:.5}
.cal-ev.done b{text-decoration:line-through}
.cal-more{font-size:10px;color:rgb(var(--faint));padding-left:5px;line-height:1.4}
/* 连接 / 编辑弹窗（CalDAV） */
.cal-mask{position:fixed;inset:0;z-index:9500;background:rgb(10 14 20/.32);display:grid;place-items:center;padding:18px;backdrop-filter:blur(2px)}
.cal-set{
  width:min(430px,100%);max-height:86vh;overflow:auto;background:rgb(var(--surface));border-radius:15px;
  padding:18px 18px 14px;box-shadow:0 24px 64px rgb(10 14 20/.3);
}
.cal-set-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.cal-set-hd h3{font-size:15.5px;font-weight:650;color:rgb(var(--ink));flex:1;line-height:1.5}
.cal-set-hd button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:rgb(var(--faint));background:transparent;flex:0 0 auto}
.cal-set-hd button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.cal-set-hd svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.cal-set-p{font-size:12px;color:rgb(var(--muted));line-height:1.7;margin:2px 0 14px}
.cal-set-p a{color:rgb(var(--ivy));text-decoration:none}
.cal-set-warn{background:rgb(var(--danger)/.08);color:rgb(var(--danger));border-radius:9px;padding:9px 11px;margin-top:2px}
.cal-warn{display:block;width:100%;text-align:left;font-family:inherit;font-size:12px;font-weight:600;line-height:1.5;
  color:rgb(var(--danger));background:rgb(var(--danger)/.08);border-radius:8px;padding:8px 10px;margin:6px 0 2px}
.cal-fld{margin-bottom:11px}
.cal-fld label{display:block;font-size:11.5px;font-weight:600;color:rgb(var(--ink-2));margin-bottom:5px}
.cal-fld input[type=text],.cal-fld input[type=password],.cal-fld input[type=date],.cal-fld input[type=time],.cal-fld textarea,.cal-fld select{
  width:100%;box-sizing:border-box;height:34px;padding:0 10px;border-radius:8px;font-family:inherit;font-size:13px;
  border:.5px solid rgb(var(--line));background:rgb(var(--sunken));color:rgb(var(--ink));outline:none;
}
.cal-fld textarea{height:64px;padding:8px 10px;resize:vertical;line-height:1.6}
.cal-fld input:focus,.cal-fld textarea:focus{border-color:rgb(var(--ivy)/.55);background:rgb(var(--surface))}
.cal-row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cal-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:pointer}
.cal-chk input{width:15px;height:15px;accent-color:rgb(var(--ivy))}
.cal-btns{display:flex;gap:8px;margin-top:14px}
.cal-btns button{flex:1;height:36px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600}
.cal-btns .primary{background:rgb(var(--ivy));color:rgb(var(--on-ivy))}
.cal-btns .primary:disabled{opacity:.6}
.cal-btns .ghost{background:rgb(var(--sunken));color:rgb(var(--ink-2));flex:0 0 auto;padding:0 16px}
.cal-btns .danger{background:transparent;color:rgb(var(--danger));box-shadow:inset 0 0 0 .5px rgb(var(--danger)/.35);flex:0 0 auto;padding:0 16px}
.cal-err{font-size:12px;color:rgb(var(--danger));line-height:1.6;margin-top:9px;min-height:0;white-space:pre-wrap;word-break:break-all}
.cal-dbg{margin-top:9px}
.cal-dbg-t{font-size:11px;color:rgb(var(--faint));margin-bottom:4px}
.cal-dbg textarea{width:100%;box-sizing:border-box;height:96px;padding:7px 8px;border-radius:7px;font-family:var(--font-mono);font-size:10.5px;line-height:1.5;border:.5px solid rgb(var(--line));background:rgb(var(--sunken));color:rgb(var(--ink-2));resize:vertical}
.cal-ok{font-size:12px;color:rgb(var(--ivy-ink));line-height:1.6;margin-top:9px}
.cal-cals{display:flex;flex-direction:column;gap:2px;margin:4px 0 12px;max-height:180px;overflow:auto}
.cal-cals label{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:7px;font-size:12.5px;color:rgb(var(--ink-2));cursor:pointer}
.cal-cals label:hover{background:rgb(var(--hover))}
.cal-cals i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.cal-cals .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cals input{width:15px;height:15px;accent-color:rgb(var(--ivy))}
.cal-pop-btns{display:flex;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid rgb(var(--line))}
.cal-pop-btns button{flex:1;height:30px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:500}
.cal-pop-btns .ed{background:rgb(var(--sunken));color:rgb(var(--ink-2))}
.cal-pop-btns .dl{background:transparent;color:rgb(var(--danger))}
/* 卡片里的二次确认条：替代系统 confirm，直接长在卡片里 */
.cal-pop-cf{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid rgb(var(--line))}
.cal-pop-cf[hidden]{display:none}
.cal-pop-cf span{flex:1;min-width:0;font-size:11.5px;line-height:1.5;color:rgb(var(--faint))}
.cal-pop-cf button{height:28px;padding:0 12px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600}
.cal-pop-cf .cf-no{background:rgb(var(--sunken));color:rgb(var(--ink-2))}
.cal-pop-cf .cf-yes{background:rgb(var(--danger));color:#fff}
.cal-pop-cf .cf-yes:disabled{opacity:.7}
.cal-pop-wait{margin-top:10px;padding-top:9px;border-top:1px solid rgb(var(--line));font-size:11.5px;color:rgb(var(--faint))}
.cal-pop-t.done{text-decoration:line-through;opacity:.6}
.cal-syncbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;font-family:inherit;font-size:12.5px;color:rgb(var(--ink-2));background:rgb(var(--sunken))}
.cal-syncbtn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.cal-syncbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cal-syncbtn.on svg{animation:calspin .9s linear infinite}
.cal-syncbtn b{font-weight:500;font-size:12px}
.cal-syncbtn.busy svg{animation:calspin 1.4s linear infinite}
/* 还没连 iCloud：这个按钮就是登录入口，做得像主按钮 */
.cal-syncbtn.login{background:rgb(var(--ivy));color:rgb(var(--on-ivy));font-weight:600}
.cal-syncbtn.login:hover{background:rgb(var(--ivy));color:rgb(var(--on-ivy));opacity:.88}
.cal-syncbtn.bad{color:rgb(var(--danger));background:rgb(var(--danger)/.1)}
@media(max-width:640px){
  .cal-syncbtn.login{padding:0 9px;font-size:11.5px;gap:4px}
  .cal-syncbtn.login svg{width:12px;height:12px}
}
@keyframes calspin{to{transform:rotate(360deg)}}
.cal-note a{color:rgb(var(--ivy));text-decoration:none;cursor:pointer}

.cal-note{font-size:12px;color:rgb(var(--faint));line-height:1.7;margin:-6px 0 10px}
.cal-empty{flex:1;display:grid;place-items:center;text-align:center;color:rgb(var(--faint));font-size:13px;line-height:2;padding:40px 20px}
.cal-empty b{display:block;font-size:14px;font-weight:600;color:rgb(var(--ink-2));margin-bottom:4px}
/* 事件详情：跟着格子走的小卡片 */
.cal-pop{
  position:fixed;z-index:9000;width:min(280px,86vw);padding:13px 14px;border-radius:12px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  box-shadow:0 16px 40px rgb(16 24 32/.18),0 2px 6px rgb(16 24 32/.1);
}
.cal-pop-t{font-size:14px;font-weight:600;color:rgb(var(--ink));line-height:1.5;word-break:break-word}
.cal-pop-r{display:flex;align-items:flex-start;gap:6px;margin-top:7px;font-size:12px;color:rgb(var(--muted));line-height:1.6}
.cal-pop-r svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 auto;margin-top:3px}
.cal-pop-cal{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11.5px;color:rgb(var(--faint))}
.cal-pop-cal i{width:8px;height:8px;border-radius:3px;display:block}
.cal-day-item{display:flex;align-items:flex-start;gap:7px;padding:7px 0;border-top:1px solid rgb(var(--line))}
.cal-day-item:first-of-type{border-top:0;padding-top:2px}
.cal-day-item i{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.cal-day-item .t{font-size:12.5px;color:rgb(var(--ink));line-height:1.5;word-break:break-word}
.cal-day-item .m{font-size:11px;color:rgb(var(--faint));margin-top:1px}
.cal-pop-n{margin-top:9px;padding-top:8px;border-top:1px solid rgb(var(--line));font-size:12px;color:rgb(var(--ink-2));line-height:1.7;white-space:pre-wrap;word-break:break-word}
/* 左栏：日历列表 + 迷你月历 */
.cal-shelf-hd{display:flex;align-items:center;gap:5px;width:100%;padding:4px 9px;border-radius:7px;
  background:transparent;font-family:inherit;cursor:pointer;text-align:left}
.cal-shelf-hd:hover{background:rgb(var(--hover))}
.cal-shelf-hd .chev{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;color:rgb(var(--faint));flex:0 0 auto;transform:rotate(-90deg);transition:transform .14s}
.cal-shelf-hd .chev.open{transform:rotate(0)}
.cal-shelf-hd .t{flex:1;font-size:11.5px;font-weight:600;color:rgb(var(--faint));letter-spacing:.4px}
.cal-shelf-hd .n{font-size:10.5px;color:rgb(var(--faint));font-variant-numeric:tabular-nums}

/* 左栏底部：没写日期的待办 / 归档 */
.cal-todos{margin:10px 6px 10px;padding-top:10px;border-top:1px solid rgb(var(--line)/.7)}
.cal-tabs{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgb(var(--hover))}
.cal-tab{flex:1;height:24px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:6px;
  background:transparent;font-family:inherit;font-size:11.5px;font-weight:600;color:rgb(var(--faint))}
.cal-tab i{font-style:normal;font-size:10px;font-variant-numeric:tabular-nums;opacity:.85}
.cal-tab.on{background:rgb(var(--surface));color:rgb(var(--ink));box-shadow:0 1px 2px rgb(16 24 32/.1)}
.cal-todo-body{display:flex;flex-direction:column;gap:1px;margin-top:5px}
.cal-todo-empty{padding:7px 4px;font-size:11px;line-height:1.7;color:rgb(var(--faint))}
.cal-src{display:flex;align-items:center;gap:7px;width:100%;padding:4px 9px;border-radius:7px;font-family:inherit;background:transparent;text-align:left}
.cal-src:hover{background:rgb(var(--hover))}
.cal-src i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.cal-src .t{flex:1;font-size:12.5px;color:rgb(var(--ink-2));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-src .n{font-size:11px;color:rgb(var(--faint));font-variant-numeric:tabular-nums}
.cal-src.off i{opacity:.28}
.cal-src.off .t{color:rgb(var(--faint))}
.cal-mini{margin:10px 6px 4px;padding-top:10px;border-top:1px solid rgb(var(--line)/.7)}
.cal-mini-hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 5px}
.cal-mini-hd b{font-size:12px;font-weight:600;color:rgb(var(--ink-2))}
.cal-mini-hd button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:rgb(var(--faint));background:transparent}
.cal-mini-hd button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.cal-mini-hd svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.cal-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-mini-grid span{height:19px;display:grid;place-items:center;font-size:10.5px;color:rgb(var(--ink-2));border-radius:4px;font-variant-numeric:tabular-nums}
.cal-mini-grid span.h{font-size:9.5px;color:rgb(var(--faint))}
.cal-mini-grid span.o{color:rgb(var(--faint)/.7)}
.cal-mini-grid span.t{background:rgb(224 69 58);color:#fff;font-weight:600}
.cal-mini-grid span.s{box-shadow:inset 0 -2px 0 rgb(var(--ivy)/.55)}
[data-theme=dark] .cal-ev{color:rgb(var(--ink))}
@media (max-width:640px){
  .cal-wrap{padding:10px 8px 0;height:100%;min-height:0}
  .cal-month{font-size:17px}
  .cal-seg{display:none}
  .cal-body{grid-template-rows:repeat(6,minmax(50px,1fr));min-height:0}
  .cal-cell{padding:3px 4px;gap:1px}
  .cal-d{font-size:11.5px}
  .cal-cell.today .cal-d{min-width:18px;height:18px;font-size:11px}
  .cal-l{font-size:9px}
  .cal-cl{gap:3px;min-height:19px}
  /* 手机格子窄，事件只留「圆点 + 截断标题」，比纯圆点有用 */
  .cal-ev{font-size:9px;padding:0 2px;gap:2px;line-height:1.5}
  .cal-ev b{display:block;font-size:9px}
  .cal-ev .dot{width:3px;height:3px}
  .cal-cell .cal-evs{gap:1px}
  .cal-shelf-hd,.cal-mini{display:none}
}

/* ============ media ============ */
.view-pad{padding:44px 32px 40px}

.media-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.media-danger{
  height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:500;font-family:inherit;
  border:.5px solid rgb(var(--danger)/.38);background:transparent;color:rgb(var(--danger));
  transition:background .14s,border-color .14s;
}
.media-danger:hover{background:rgb(var(--danger)/.08);border-color:rgb(var(--danger)/.55)}
.media-danger:disabled{opacity:.55;cursor:default;background:transparent}
.media-search{
  display:flex;align-items:center;gap:8px;max-width:320px;flex:1 1 200px;height:32px;padding:0 10px;
  border-radius:8px;background:rgb(var(--sunken));color:rgb(var(--muted));
}
.media-search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.media-search input{flex:1;border:0;outline:none;background:none;font-size:13px}
.media-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:rgb(var(--muted));font-size:13.5px;padding-bottom:60px;
}
.media-empty svg{width:32px;height:32px;stroke:rgb(var(--faint));fill:none;stroke-width:1.4;opacity:.7}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.media-card{position:relative;border-radius:10px;overflow:hidden;border:.5px solid rgb(var(--line));background:rgb(var(--sunken));transition:transform .2s var(--spring),box-shadow .2s;cursor:pointer}
.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.media-thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:11px;color:rgb(var(--faint))}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-name{padding:7px 26px 7px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgb(var(--surface))}
.media-del{
  position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;background:rgb(var(--surface)/.92);color:rgb(var(--muted));
  box-shadow:0 1px 4px rgb(0 0 0 / .16);opacity:0;transform:scale(.9);
  transition:opacity .14s,transform .14s var(--spring),background .14s,color .14s;
}
.media-del svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.media-card:hover .media-del,.media-card:focus-within .media-del{opacity:1;transform:none}
.media-del:hover{background:rgb(var(--danger));color:#fff}
@media (hover:none){ .media-del{opacity:1;transform:none} }

/* ============ graph ============ */
#graphWrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#graphWrap.dragging{cursor:grabbing}
#graphCanvas{width:100%;height:100%;display:block}
.graph-zoom{
  position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;
  background:rgb(var(--surface)/.9);backdrop-filter:blur(12px);border-radius:11px;
  box-shadow:var(--shadow-float);overflow:hidden;
}
.graph-zoom button{width:36px;height:34px;display:grid;place-items:center;color:rgb(var(--muted))}
.graph-zoom button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.graph-zoom svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.legend{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;color:rgb(var(--ink-2))}
.legend .sq{width:8px;height:8px;border-radius:2px;background:rgb(var(--warn))}
.legend .rd{width:8px;height:8px;border-radius:50%;background:rgb(var(--faint))}

/* ============ 思维导图（由 Markdown 大纲渲染，只读，不改笔记） ============ */
.mm-ov{position:fixed;inset:0;z-index:145;background:rgb(16 24 32 / .34);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .18s ease}
.mm-ov.open{opacity:1;pointer-events:auto}
.mm-card{position:relative;width:min(1180px,100%);height:min(780px,92vh);display:flex;flex-direction:column;background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-lift);overflow:hidden;transform:translateY(10px) scale(.995);transition:transform .22s var(--spring)}
.mm-ov.open .mm-card{transform:none}
.mm-hd{display:flex;align-items:flex-start;gap:10px;padding:18px 16px 14px 20px;flex-wrap:wrap;cursor:move;user-select:none}
.mm-hd.dragging{cursor:grabbing}
.mm-hd-t{flex:1 1 auto;min-width:0}
/* 工具栏按钮里的图标只在手机上出现；桌面仍用文字标签 */
.mm-ic{display:none}
.mm-lb{display:inline;white-space:nowrap}
.mm-lb-m{display:none}
.mm-hd button,.mm-hd a,.mm-hd input{cursor:pointer}
.mm-hd h3{font-family:var(--font-serif);font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mm-hd h3 svg{width:17px;height:17px;stroke:rgb(var(--ivy));fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mm-hd p{margin-top:6px;font-size:12px;line-height:1.7;color:rgb(var(--faint));max-width:600px}
.mm-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mm-btn{height:28px;padding:0 10px;border-radius:7px;font-size:12px;color:rgb(var(--muted));background:rgb(var(--sunken));transition:background .14s,color .14s}
.mm-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.mm-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
/* 外观样式面板 */
.mm-style-btn{display:inline-flex;align-items:center;gap:6px}
.mm-swatch{width:10px;height:10px;border-radius:50%;background:rgb(var(--ivy));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .14);flex:0 0 auto}
.mm-style-pop{position:absolute;top:56px;right:16px;z-index:30;width:min(394px,calc(100% - 32px));padding:12px;border-radius:13px;background:rgb(var(--surface));border:.5px solid rgb(var(--line));box-shadow:var(--shadow-lift);animation:mmPop .16s ease}
@keyframes mmPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mm-style-pop[hidden]{display:none}
.mm-sp-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mm-sp-hd b{font-size:12.5px;color:rgb(var(--ink))}
.mm-sp-hd span{font-size:10.5px;color:rgb(var(--faint));margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-sp-x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:rgb(var(--muted));flex:0 0 auto}
.mm-sp-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.mm-sp-x svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mm-sp-tabs{display:flex;gap:4px;padding:3px;border-radius:9px;background:rgb(var(--sunken));margin-bottom:10px}
.mm-sp-tabs button{flex:1;height:26px;border-radius:7px;font-size:11.5px;color:rgb(var(--muted));transition:background .14s,color .14s}
.mm-sp-tabs button:hover{color:rgb(var(--ink))}
.mm-sp-tabs button.on{background:rgb(var(--surface));color:rgb(var(--ivy-ink));font-weight:600;box-shadow:var(--shadow-float)}
.mm-sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mm-sp-item{display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:9px;border:1.5px solid transparent;background:rgb(var(--sunken));text-align:left;transition:border-color .14s,background .14s,transform .14s}
.mm-sp-item:hover{border-color:rgb(var(--line));transform:translateY(-1px)}
.mm-sp-item.on{border-color:rgb(var(--ivy));background:rgb(var(--ivy-soft))}
.mm-sp-thumb{display:block;border-radius:6px;overflow:hidden;line-height:0;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .07)}
.mm-sp-thumb svg{display:block;width:100%;height:auto}
.mm-sp-nm{font-size:11.5px;font-weight:600;color:rgb(var(--ink));padding-left:1px;white-space:nowrap}
.mm-sp-hint{font-size:10px;line-height:1.35;color:rgb(var(--faint));padding-left:1px}
.mm-body{flex:1;position:relative;min-height:0;border-top:1px solid rgb(var(--line));background:rgb(var(--surface));overflow:hidden}
.mm-canvas{position:absolute;inset:0;cursor:grab;touch-action:none;overscroll-behavior:contain}
.mm-canvas.grabbing{cursor:grabbing}
/* 不要用 width:100% 撑满：SVG 自身按导图尺寸（px）排版，缩放只由 <g> 的 transform 控制，
   否则 viewBox 会再缩一次，位置和缩放全都对不上 */
.mm-canvas svg{display:block;width:auto;height:auto;max-width:none;max-height:none;overflow:visible}
.mm-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:9px;box-shadow:var(--shadow-float);overflow:hidden}
.mm-zoom button{width:30px;height:28px;display:grid;place-items:center;font-size:14px;color:rgb(var(--muted))}
.mm-zoom button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.mm-pill{position:absolute;left:12px;bottom:12px;font-size:11px;color:rgb(var(--faint));background:rgb(var(--surface)/.88);padding:4px 8px;border-radius:6px;pointer-events:none}
.mm-empty{position:absolute;inset:0;display:grid;place-items:center;padding:26px;text-align:center}
.mm-empty[hidden]{display:none}
.mm-empty-in{max-width:430px}
.mm-empty b{font-size:14px}
.mm-empty p{margin-top:8px;font-size:12.5px;line-height:1.85;color:rgb(var(--faint))}
.mm-empty code{font-family:var(--font-mono);font-size:11.5px;background:rgb(var(--sunken));padding:1px 5px;border-radius:4px}
.mm-empty .mm-btn{margin-top:14px;height:30px;padding:0 14px}
.mm-editbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid rgb(var(--line));background:rgb(var(--surface));flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.mm-editbar::-webkit-scrollbar{display:none}
.mm-eb-tip{font-size:11.5px;color:rgb(var(--faint));margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mm-eb{height:26px;padding:0 9px;border-radius:7px;font-size:12px;color:rgb(var(--muted));background:rgb(var(--sunken));white-space:nowrap;flex:0 0 auto;transition:background .14s,color .14s}
.mm-eb:hover:not(:disabled){background:rgb(var(--hover));color:rgb(var(--ink))}
.mm-eb:disabled{opacity:.4;cursor:default}
.mm-eb.danger:hover:not(:disabled){background:rgb(var(--danger)/.1);color:rgb(var(--danger))}
.mm-rename{position:fixed;z-index:9500;font:inherit;font-size:13px;padding:0 8px;border:1.5px solid rgb(var(--ivy));border-radius:8px;background:rgb(var(--surface));color:rgb(var(--ink));outline:none;box-shadow:var(--shadow-float)}
/* 手机上的节点输入条：贴着软键盘上沿，不跟着节点跑出屏幕 */
.mm-kp{
  position:fixed;left:0;right:0;bottom:0;z-index:9600;
  display:none;align-items:center;gap:7px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgb(var(--surface));border-top:1px solid rgb(var(--line));
  box-shadow:0 -8px 22px rgb(15 20 25 / .10);
}
.mm-kp.open{display:flex}
.mm-kp-in{
  flex:1 1 auto;min-width:0;height:40px;padding:0 11px;
  border:1.5px solid rgb(var(--ivy));border-radius:10px;
  background:rgb(var(--surface));color:rgb(var(--ink));
  font-family:inherit;font-size:16px;   /* 小于 16px iOS 会自动把整页放大 */
  outline:none;
}
.mm-kp-b{
  flex:0 0 auto;height:40px;padding:0 11px;border-radius:10px;
  font-size:13px;color:rgb(var(--ink-2));background:rgb(var(--sunken));white-space:nowrap;
}
.mm-kp-b:active{background:rgb(var(--hover))}
.mm-kp-b.primary{background:rgb(var(--ivy));color:#fff}
@media (max-width:760px), (max-height:520px){
  /* 输入条顶上来时，底部那排 8 格先让位，别两排按钮叠在一起 */
  .mm-ov.kp .mm-editbar{display:none}
  /* 右下角缩放块跟着抬高，别被输入条压住半截 */
  .mm-ov.kp .mm-zoom{bottom:calc(66px + env(safe-area-inset-bottom))}
  /* ---------- 手机端：整屏卡片，全部按安全区收边，任何按钮都不被裁掉 ---------- */
  .mm-ov{
    padding:0;overflow:hidden;
    /* iOS 上 position:fixed 按「地址栏收起后」的大视口算，底部会被工具栏吃掉一截 */
    height:100vh;
  }
  @supports (height:100dvh){ .mm-ov{height:100dvh} }
  .mm-card{width:100%;height:100%;border-radius:0}

  /* 第一行：标题 + 关闭（关闭按钮不再浮在右上角、也不跟着工具条一起横滑） */
  .mm-hd{
    display:flex;flex-wrap:wrap;align-items:center;gap:0;
    padding:calc(8px + env(safe-area-inset-top)) 8px 0 14px;
    cursor:default;
  }
  .mm-hd-t{flex:1 1 auto;min-width:0;padding:0}
  .mm-hd h3{font-size:16px;gap:7px}
  .mm-hd h3 svg{width:16px;height:16px}
  .mm-hd p{display:none}
  .mm-close{
    flex:0 0 auto;width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;color:rgb(var(--muted));background:rgb(var(--sunken));
  }
  .mm-close svg{width:15px;height:15px}
  .mm-close:active{background:rgb(var(--hover))}

  /* 第二行：6 个等分工具格（图标 + 短标签），不横滑、不换行 */
  .mm-tools{
    order:5;flex:0 0 100%;width:100%;display:flex;flex-wrap:nowrap;gap:2px;
    padding:6px 0 4px;margin:0;overflow:visible;
  }
  .mm-tools .mm-btn{
    flex:1 1 0;min-width:0;height:44px;padding:2px 1px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10px;line-height:1;background:transparent;color:rgb(var(--ink-2));
  }
  .mm-tools .mm-btn:active{background:rgb(var(--hover))}
  .mm-tools .mm-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}
  .mm-style-btn{gap:3px!important}
  .mm-ic{display:block;line-height:0}
  .mm-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mm-lb{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10px;white-space:nowrap}
  .mm-lb-d{display:none}
  .mm-lb-m{display:inline}
  .mm-swatch{width:16px;height:16px;border-radius:50%}

  .mm-body{border-top:1px solid rgb(var(--line))}
  .mm-zoom{right:8px;bottom:8px}
  .mm-pill{display:none}

  /* 第三行（贴底）：节点操作 8 格等分，同样不滚动 */
  .mm-editbar{
    display:grid;grid-template-columns:repeat(8,1fr);gap:1px;
    padding:4px 5px calc(5px + env(safe-area-inset-bottom));
    overflow:visible;
  }
  .mm-eb-tip{display:none}
  .mm-eb{
    height:44px;padding:2px 1px;border-radius:10px;background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10px;line-height:1;color:rgb(var(--ink-2));white-space:nowrap;
  }
  .mm-eb:active:not(:disabled){background:rgb(var(--hover))}
  .mm-eb .mm-ic svg{width:17px;height:17px}
  .mm-eb.danger:active:not(:disabled){background:rgb(var(--danger)/.1);color:rgb(var(--danger))}

  /* 样式面板：贴底抽屉，避开底部安全区，别把整张图盖死 */
  .mm-style-pop{
    top:auto;bottom:0;left:0;right:0;width:auto;height:auto;
    max-height:min(60%,calc(100% - 140px));overflow:auto;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;
  }
  .mm-sp-grid{grid-template-columns:repeat(2,1fr);gap:7px}
  .mm-sp-hd span{display:none}
  .mm-sp-hint{display:none}
  .mm-sp-item{padding:5px;gap:4px}
}

/* ============ overlay / palette ============ */
/* z-index 必须高于手机侧栏抽屉（.shelf 在 <=640px 时是 z-index:80 的浮层），
   否则手机上打开云同步面板会被抽屉整个盖住（v85 修复） */
.overlay{
  position:fixed;inset:0;z-index:150;display:flex;justify-content:center;align-items:flex-start;
  padding-top:14vh;background:rgb(10 12 14 / .22);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.open{opacity:1;pointer-events:auto}
.palette{
  width:min(620px,90vw);background:rgb(var(--surface));border-radius:13px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  overflow:hidden;transform:translateY(-8px) scale(.985);transition:transform .22s var(--spring);
}
.overlay.open .palette{transform:none}
.palette-in{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid rgb(var(--line));color:rgb(var(--muted))}
.palette-in svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.palette-in input{flex:1;border:0;outline:none;background:none;font-size:14.5px}
.palette-list{max-height:46vh;overflow-y:auto;padding:6px}
.p-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;
  border-radius:8px;font-size:13.5px;color:rgb(var(--ink-2));
}
.p-row svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.p-row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .h{font-size:11px;color:rgb(var(--faint));font-family:var(--font-mono)}
.p-row.sel{background:rgb(var(--hover));color:rgb(var(--ink))}
.p-group{font-size:11px;font-weight:600;letter-spacing:.05em;color:rgb(var(--faint));padding:8px 10px 4px}
.p-empty{padding:18px;text-align:center;color:rgb(var(--faint));font-size:13px}

/* popover */
/* 同样要盖住手机抽屉（80）：坞栏在抽屉里，点齿轮弹出的菜单不能躲到抽屉后面 */
.popover{
  position:fixed;z-index:9000;min-width:196px;max-width:300px;padding:5px;background:rgb(var(--surface));
  isolation:isolate;force-color-profile:srgb;
  /* 顶层模式（popover 属性）下 UA 会给 inset:0 / margin:auto，这里显式清掉，位置只由 JS 的 left/top 决定 */
  inset:auto;margin:0;
  border-radius:10px;box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  max-height:min(72vh, 580px);overflow-y:auto;overscroll-behavior:contain;
  opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .14s,transform .16s var(--spring);
}
.popover.open{opacity:1;transform:translateZ(0);pointer-events:auto}  /* 常驻合成层：老 WebKit 上避免文字被画到浮层之上 */
.popover::backdrop{background:transparent}   /* 顶层模式下的背景板：不遮不压 */
.po-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;font-size:13px;color:rgb(var(--ink-2));text-align:left}
.po-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.po-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.po-item.danger{color:rgb(var(--danger))}
.po-item.danger svg{color:rgb(var(--danger))}
.po-item.muted{color:rgb(var(--faint));pointer-events:none}
.po-item>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.po-sep{height:1px;margin:4px 6px;background:rgb(var(--line))}
.po-key{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:rgb(var(--faint))}
.hl-row{display:flex;align-items:center;gap:7px;padding:6px 8px 5px}
.hl-grid{display:grid;grid-template-columns:repeat(7,20px);gap:6px;padding:8px 9px 7px}
.hl-sw{width:20px;height:20px;border-radius:6px;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(var(--ink) / .10);transition:transform .12s var(--spring)}
.hl-sw:hover{transform:scale(1.14)}
.hl-sw:active{transform:scale(.96)}
.hl-add{
  display:grid;place-items:center;background:none;box-shadow:inset 0 0 0 1px rgb(var(--line));
  color:rgb(var(--muted));font-size:14px;line-height:1;
}
.hl-add:hover{color:rgb(var(--ink));box-shadow:inset 0 0 0 1px rgb(var(--ink)/.2)}
.hl-color-in{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.emoji-grid{display:grid;grid-template-columns:repeat(8,34px);gap:1px;padding:6px 4px;max-height:210px;overflow-y:auto;scrollbar-width:thin}
.emoji-grid::-webkit-scrollbar{width:6px}
.emoji-grid::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.16);border-radius:6px;border:1px solid transparent;background-clip:content-box}
.emo{width:34px;height:32px;border-radius:6px;font-size:18px;line-height:1;display:grid;place-items:center;transition:background .12s}
.emo:hover{background:rgb(var(--hover))}
.emo:active{transform:scale(.92)}
.emo-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px 3px 5px;border-bottom:1px solid rgb(var(--line))}
.emo-tab{font-size:11.5px;padding:4px 2px;border-radius:5px;color:rgb(var(--muted));line-height:1.25;text-align:center;transition:background .12s,color .12s}
.emo-tab:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.emo-tab.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

/* toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;font-size:12.5px;
  background:rgb(var(--ink));color:rgb(var(--canvas));box-shadow:var(--shadow-float);
  animation:toastIn .3s var(--spring);max-width:70vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}

/* 图片上传浮层：只在真要等一会儿时出现 */
.upload-pill{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;z-index:120;
  font-size:12.5px;line-height:1;color:rgb(var(--canvas));background:rgb(var(--ink));
  box-shadow:var(--shadow-float);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.upload-pill.on{opacity:1;transform:translate(-50%,0)}
.upload-pill svg{width:14px;height:14px;flex:0 0 auto}
.upload-pill.on svg{animation:upPulse 1.1s ease-in-out infinite}
@keyframes upPulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (max-width:640px){.upload-pill{bottom:calc(78px + env(safe-area-inset-bottom))}}
.hint{position:fixed;bottom:14px;right:16px;font-size:11px;color:rgb(var(--faint));z-index:5}

/* ---- 番茄钟：顶部图标开设置，倒计时作右下角背景水印 ---- */
.pomo{--pc:rgb(var(--ivy))}
.pomo.rest{--pc:#e2924c}
.pomo-bg{
  position:fixed;right:8px;bottom:8px;width:92px;height:92px;z-index:3;
  display:grid;place-items:center;pointer-events:none;user-select:none;
  color:rgb(var(--ink) / .34);
}
[data-theme=dark] .pomo-bg{color:rgb(var(--ink) / .48)}
/* 番茄本体：不要外圈描边，红色就是「水位」；叶子固定在最上面不变 */
.pomo-bg-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pomo-bg-body{fill:rgb(224 69 58 / .1);stroke:none}
.pomo-bg-stem{fill:none;stroke:#2f8f43;stroke-width:6;stroke-linecap:round}
.pomo-bg-leaf{fill:#3ea152;stroke:none}
.pomo-bg-fill{fill:#e0453a;transition:transform .5s linear}
[data-theme=dark] .pomo-bg-fill{fill:#cf3b30}
.pomo-bg-time{font-size:18px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:.01em;position:relative;transform:translateY(3px);color:rgb(var(--ink) / .62);
  transition:color .3s}
.pomo-bg-label{position:absolute;bottom:13px;font-size:7.5px;letter-spacing:.14em;
  color:rgb(var(--ink) / .52);transition:color .3s}
.pomo-bg.filled .pomo-bg-time,.pomo-bg.filled .pomo-bg-label{
  color:#fff;text-shadow:0 1px 3px rgb(120 30 10 / .3)}
.pomo-panel{
  position:fixed;right:12px;top:44px;width:250px;z-index:86;padding:13px 14px 12px;display:none;
  border-radius:15px;border:.5px solid rgb(var(--line));background:rgb(var(--surface));
  box-shadow:var(--shadow-lift);animation:pomoIn .2s var(--spring);
}
.pomo.open .pomo-panel{display:block}
@keyframes pomoIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.pomo-ph{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:rgb(var(--ink));margin-bottom:10px}
.pomo-ph b{font-weight:600;color:var(--pc);font-variant-numeric:tabular-nums}
.pomo-x{width:22px;height:22px;border-radius:6px;color:rgb(var(--faint));font-size:16px;line-height:1}
.pomo-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.pomo-tabs{display:flex;gap:3px;padding:3px;background:rgb(var(--sunken));border-radius:9px;margin-bottom:11px}
.pomo-tabs button{flex:1;height:27px;border-radius:7px;font-size:12px;color:rgb(var(--muted))}
.pomo-tabs button.on{background:rgb(var(--surface));color:var(--pc);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0/.08)}
.pomo-set{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:rgb(var(--ink-2))}
.pomo-set>span{flex:1}
.pomo-step{display:flex;align-items:center;gap:2px;border:.5px solid rgb(var(--line));border-radius:8px;overflow:hidden}
.pomo-step button{width:24px;height:25px;font-size:14px;color:rgb(var(--muted));background:rgb(var(--sunken))}
.pomo-step button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.pomo-step input{width:36px;height:25px;border:0;background:transparent;text-align:center;font-size:12.5px;
  color:rgb(var(--ink));font-variant-numeric:tabular-nums;appearance:textfield}
.pomo-step input::-webkit-inner-spin-button,.pomo-step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pomo-unit{font-size:10.5px;color:rgb(var(--faint));width:24px;font-style:normal}
.pomo-auto{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgb(var(--muted));margin:10px 0;cursor:pointer}
.pomo-auto input{accent-color:rgb(var(--ivy));width:13px;height:13px}
.pomo-main{width:100%;height:34px;border-radius:9px;background:var(--pc);color:#fff;
  font-size:12.5px;font-weight:600;transition:filter .15s,transform .1s}
.pomo-main:hover{filter:brightness(1.08)}
.pomo-main:active{transform:scale(.98)}
.pomo-acts{display:flex;gap:6px;margin-top:7px}
.pomo-acts button{flex:1;height:29px;border-radius:8px;background:rgb(var(--sunken));font-size:11.5px;color:rgb(var(--ink-2))}
.pomo-acts button:hover{background:rgb(var(--hover))}
.pomo-stat{margin-top:10px;padding-top:9px;border-top:.5px solid rgb(var(--line));font-size:11px;color:rgb(var(--faint));text-align:center}
@media (max-width:640px){
  /* 让开底部浮条，别贴在 ＋ 上面 */
  .pomo-bg{right:8px;bottom:calc(104px + env(safe-area-inset-bottom));width:78px;height:78px;z-index:86}
  .pomo-bg-time{font-size:14.5px;transform:translateY(2px)}
  .pomo-bg-label{bottom:10px;font-size:6.5px;letter-spacing:.1em}
  .pomo-panel{right:10px;top:42px;width:min(250px,86vw)}
}
/* ============ 云同步面板 ============ */
.dock-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;margin-left:1px;transition:opacity .2s,background .2s}
.dock-item.sync-ok{color:rgb(var(--ivy))}
.dock-item.sync-ok .dot{opacity:1}
.dock-item.sync-busy .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-pending{color:rgb(var(--ivy))}
.dock-item.sync-pending .dot{opacity:1;animation:pulse 1s ease-in-out infinite}
.dock-item.sync-error{color:rgb(var(--warn))}
.dock-item.sync-error .dot{opacity:1}
.dock-item.sync-off .dot{opacity:0}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.sheet{
  width:min(470px,92vw);max-height:86vh;overflow:auto;padding:20px 22px 18px;background:rgb(var(--surface));border-radius:14px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  transform:translateY(-6px) scale(.99);transition:transform .22s var(--spring);
}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.sheet-sub{margin:0 0 16px;font-size:12.5px;line-height:1.75;color:rgb(var(--muted))}
.reg-hint{
  margin:0 0 16px;padding:11px 13px;border-radius:10px;
  background:rgb(var(--ivy-soft));border:1px solid rgb(var(--ivy)/.24);
}
.reg-hint-t{font-size:12.5px;line-height:1.72;color:rgb(var(--ink-2))}
.reg-hint-t b{color:rgb(var(--ivy-ink));font-weight:600}
.reg-hint-s{margin-top:6px;font-size:11.5px;line-height:1.7;color:rgb(var(--muted))}
.field{display:block;margin-bottom:14px}
/* 修改密码 */
.pw-toggle{
  display:block;width:100%;text-align:left;margin:12px 0 4px;font-size:12.5px;color:rgb(var(--muted));
  text-decoration:underline;text-underline-offset:2.5px;
}
.pw-toggle:hover{color:rgb(var(--ink))}
.pw-box{margin-top:6px;padding-top:12px;border-top:1px dashed rgb(var(--line))}
.pw-box[hidden]{display:none}
/* 注销账号：危险操作用红色系，和普通设置区分开 */
.pw-toggle.danger{color:rgb(var(--danger))}
.acct-warn{
  margin-bottom:12px;padding:10px 12px;border-radius:9px;
  background:rgb(var(--danger-soft));color:rgb(var(--danger));
  font-size:12px;line-height:1.72;word-break:break-word;
}
.acct-warn b{font-weight:600}
.acct-tip{margin-top:10px;font-size:11.5px;line-height:1.7;color:rgb(var(--faint))}
.acct-tip b{color:rgb(var(--danger));font-weight:600}
.btn-danger{
  height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;
  background:rgb(var(--danger) / .12);color:rgb(var(--danger));
  transition:background .15s,color .15s,opacity .15s;
}
.btn-danger:hover{background:rgb(var(--danger));color:rgb(var(--surface))}
.btn-danger.armed{background:rgb(var(--danger));color:rgb(var(--surface))}
.btn-danger:disabled{opacity:.45;cursor:default;background:rgb(var(--danger) / .12);color:rgb(var(--danger))}
.field span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));margin-bottom:6px}
.field input{
  width:100%;height:34px;padding:0 10px;border-radius:8px;border:.5px solid rgb(var(--line));
  background:rgb(var(--sunken));outline:none;font-size:13px;font-family:var(--font-mono);letter-spacing:.02em;
}
.field input:focus{border-color:rgb(var(--ivy)/.6);background:rgb(var(--surface))}
.sheet-row{display:flex;gap:8px;align-items:center}
.btn-primary{
  height:32px;padding:0 14px;border-radius:8px;background:rgb(var(--ivy));color:rgb(var(--on-ivy));
  font-size:12.5px;font-weight:600;transition:background .15s,opacity .15s;
}
.btn-primary:hover{background:rgb(var(--ivy-hover))}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{height:32px;padding:0 12px;border-radius:8px;color:rgb(var(--muted));font-size:12.5px;border:.5px solid rgb(var(--line))}
.btn-ghost:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.btn-ghost:disabled{opacity:.4;cursor:default;background:transparent;color:rgb(var(--muted))}
.sheet-status{margin-top:14px;padding-top:11px;border-top:1px solid rgb(var(--line));font-size:11.5px;line-height:1.75;color:rgb(var(--faint))}
.sheet-status b{color:rgb(var(--ink-2));font-weight:600}
/* ---- 设置（整页） ---- */
/* 设置页直接铺满整个应用：左栏就是书架的位置（同宽同底色），右边是那块纸 */
.set-ov{
  position:fixed;inset:0;height:100%;z-index:150;background:rgb(var(--canvas));
  display:grid;place-items:stretch;padding:0;opacity:0;pointer-events:none;
  overflow:hidden;transition:opacity .16s ease;
}
/* iOS Safari 里 position:fixed 默认按「地址栏收起后」的大视口算高度，
   底部一截会藏在工具栏后面且滚不到；用动态视口高度 dVH 才对得上肉眼可见区域 */
@supports (height:100dvh){
  .set-ov{height:100dvh}
}
.set-ov.open{opacity:1;pointer-events:auto}
.set-wrap{
  width:100%;height:100%;min-height:0;display:grid;
  grid-template-columns:var(--shelf-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  background:transparent;overflow:hidden;
}
/* 左栏：标题 + 关闭 + 分类。整块作为一列，手机上变成吸顶的一条 */
.set-side{
  grid-column:1;grid-row:1;display:flex;flex-direction:column;min-height:0;
  background:rgb(var(--sunken));border-right:.5px solid rgb(var(--line));
}
/* 设置页里也放一条底部导航：整屏浮层会把书架那条盖住，这里补一份，位置/样式跟书架里的一致 */
.set-dock{
  position:relative;left:auto;right:auto;bottom:auto;
  margin:0 12px 12px;flex:0 0 auto;
}
@media (max-width:760px){
  /* 手机上浮层铺满，导航贴屏幕底，别跟着侧栏那一小块走 */
  .set-dock{
    position:fixed;left:12px;right:12px;margin:0;z-index:7;
    bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .set-body{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
.set-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;
  padding:16px 10px 8px 16px;
}
.set-title{font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
.set-acts{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.set-x{
  display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;
  height:32px;min-width:32px;padding:0 7px;border-radius:8px;color:rgb(var(--muted));
  background:transparent;transition:background .13s,color .13s;
}
.set-x:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.set-x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.set-x i{display:none;font-style:normal;font-size:12.5px}
.set-nav{
  flex:1;min-height:0;padding:0 8px 14px;background:transparent;
  display:flex;flex-direction:column;gap:1px;overflow:auto;scrollbar-width:thin;
}
.set-nav nav{display:flex;flex-direction:column;gap:1px}
/* 「更多」只在手机上出现：桌面左栏本来就一直列着全部分类 */
.set-more{display:none}
.set-nav-grp{
  padding:15px 9px 5px;font-size:11px;font-weight:600;letter-spacing:.05em;color:rgb(var(--faint));
}
.set-nav-grp:first-child{padding-top:4px}
.set-nav button{
  display:flex;align-items:center;gap:9px;
  text-align:left;height:auto;min-height:33px;padding:5px 9px;border-radius:8px;font-size:13px;line-height:1.35;
  color:rgb(var(--ink-2));transition:background .13s,color .13s;white-space:normal;
}
.set-nav button .sn-ico{
  width:20px;height:20px;flex:0 0 auto;border-radius:5px;display:grid;place-items:center;
  background:rgb(var(--surface));color:rgb(var(--muted));box-shadow:0 1px 2px rgb(16 24 32/.07);
  transition:background .13s,color .13s;
}
.set-nav button .sn-ico svg{width:12.5px;height:12.5px}
.set-nav button .sn-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 「媒体库 / 关系图」是跳出去的入口，不是当前页：右上一个斜箭头 */
.set-nav button .sn-go{margin-left:auto;font-size:12px;line-height:1;color:rgb(var(--faint));transform:translateY(-1px)}
.set-nav button:hover .sn-go{color:rgb(var(--ink-2))}
.set-nav button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.set-nav button.on{background:rgb(var(--ivy));color:rgb(var(--on-ivy));font-weight:600}
.set-nav button.on .sn-ico{background:rgb(255 255 255/.22);color:rgb(var(--on-ivy));box-shadow:none}
[data-theme=dark] .set-nav button.on .sn-ico{background:rgb(0 0 0/.13);color:rgb(var(--on-ivy))}
.set-main{
  grid-column:2;grid-row:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  margin:10px 12px 10px 0;background:rgb(var(--surface));border:.5px solid rgb(var(--line));border-radius:14px;
  box-shadow:var(--shadow-paper);overflow:hidden;
}
[data-theme=dark] .set-main{border-color:#2b3035}
.set-head{flex:0 0 auto;padding:0 clamp(18px,3vw,40px)}
.set-head-in{max-width:760px;margin:0 auto;padding:22px 0 2px}
.set-head h2{font-size:23px;font-weight:700;letter-spacing:-.02em;color:rgb(var(--ink))}
.set-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 clamp(18px,3vw,40px) 36px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.set-inner{max-width:760px;margin:0 auto}
.set-sec{margin:24px 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.045em;color:rgb(var(--faint))}
.set-sec:first-child{margin-top:12px}
.set-sec-row{
  display:flex;align-items:baseline;justify-content:flex-start;gap:9px;
  margin:24px 0 8px;font-size:13.5px;font-weight:600;letter-spacing:0;color:rgb(var(--ink));
}
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 14px;border:0;border-radius:11px;background:rgb(var(--sunken));
  margin:0 0 8px;transition:background .13s;
}
.set-row:hover{background:rgb(var(--hover))}
.set-row:last-child{margin-bottom:0}
.set-row>div{min-width:0}
.set-row .t{font-size:13.5px;font-weight:500;color:rgb(var(--ink))}
.set-row .d{font-size:12px;color:rgb(var(--faint));margin-top:3px;line-height:1.62}
/* 帮助 / 下载 / 提醒这些本来是弹窗里的内容，铺进设置页时把内边距去掉，和别的设置项左对齐 */
.set-body .help-tabs{padding:0 0 10px;flex-wrap:wrap}
.set-body .help-body{padding:0 0 10px;overflow:visible}
.set-body .help-p{padding-left:0;padding-right:0}
.set-body .dl-body{padding:0 0 4px;overflow:visible}
.set-body .dl-row{margin-top:10px}
.set-body .rc-box{margin-bottom:9px}
.set-body .ai-cfg-tip{margin-bottom:14px}
.set-card{background:rgb(var(--sunken));border-radius:12px;padding:14px 16px;margin:10px 0}
.set-card .field{margin-bottom:10px}
.set-note{font-size:11.5px;line-height:1.75;color:rgb(var(--faint));margin:10px 0 0}
.set-btn{
  height:30px;padding:0 13px;border-radius:8px;font-size:12.5px;flex:0 0 auto;
  background:rgb(var(--surface));color:rgb(var(--ink));
  border:.5px solid rgb(var(--line));box-shadow:0 1px 1px rgb(16 24 32/.04);
  transition:background .13s,border-color .13s;
}
.set-btn:hover{background:rgb(var(--hover));border-color:rgb(var(--line))}
[data-theme=dark] .set-btn{background:rgb(var(--hover))}
[data-theme=dark] .set-btn:hover{background:rgb(var(--line))}
.set-btn.primary{background:rgb(var(--ivy));color:#fff}
.set-btn.primary:hover{filter:brightness(1.05)}
.vip-chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:600;
  background:linear-gradient(135deg,#f7e3a8,#e9c86a);color:#7a5a12;border:.5px solid #e3c46f}
.vip-chip.off{background:rgb(var(--hover));color:rgb(var(--faint));border-color:transparent;font-weight:400}
.set-btn.danger{background:rgb(var(--warn)/.1);color:rgb(var(--warn))}
.set-btn.danger:hover{background:rgb(var(--warn)/.16)}
.set-chips{
  display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;border-radius:10px;
  background:rgb(var(--sunken));max-width:100%;
}
.set-chip{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:8px;
  font-size:12.5px;background:transparent;color:rgb(var(--muted));transition:background .13s,color .13s,box-shadow .13s;
}
.set-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set-chip:hover{color:rgb(var(--ink))}
.set-chip.on{background:rgb(var(--surface));color:rgb(var(--ink));font-weight:600;box-shadow:0 1px 3px rgb(16 24 32/.15)}
[data-theme=dark] .set-chip.on{background:rgb(var(--hover))}
.set-sec-row .fs-val{font-size:12.5px;font-weight:600;color:rgb(var(--ivy-ink));font-variant-numeric:tabular-nums}
.fs-slider{padding:2px 2px 0;max-width:460px}
.fs-slider input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
  --p:25%;
}
.fs-slider input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:99px;
  background:linear-gradient(to right, rgb(var(--ivy)) 0 var(--p), rgb(var(--ink)/.10) var(--p) 100%);
}
.fs-slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;
  background:rgb(var(--ivy));border:2.5px solid rgb(var(--surface));
  box-shadow:0 1px 4px rgb(16 24 32/.28);transition:transform .12s;
}
.fs-slider input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.fs-slider input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgb(var(--ink)/.10)}
.fs-slider input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:rgb(var(--ivy))}
.fs-slider input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;background:rgb(var(--ivy));
  border:2.5px solid rgb(var(--surface));box-shadow:0 1px 4px rgb(16 24 32/.28);
}
.fs-slider .fs-ends{display:flex;justify-content:space-between;font-size:10.5px;color:rgb(var(--faint));margin-top:-1px}
.fs-slider input[type=range]:focus-visible{outline:none}
.fs-slider input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgb(var(--ivy)/.18)}
/* ---- 关于：应用名片 + 联系入口 ---- */
.about-wrap{max-width:560px;margin:0 auto;padding:6px 0 18px}
.about-hero{text-align:center;padding:12px 0 22px}
.ab-name{
  display:flex;align-items:center;justify-content:center;gap:8px;

.ab-ver{

.ab-sub{margin-top:8px;font-size:12.5px;color:rgb(var(--muted))}

.ab-row{

/* 二维码弹窗 */
.qr-card{width:min(352px,100%)}
.qr-close{
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:rgb(var(--muted));flex:0 0 auto;
}
.qr-close:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.qr-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.qr-body{display:flex;flex-direction:column;align-items:center;padding:10px 20px 24px}
.qr-img{
  width:236px;max-width:100%;height:auto;display:block;border-radius:12px;
  background:#fff;padding:0;box-shadow:0 8px 22px -14px rgb(16 24 32/.4);
}
.qr-tip{margin:14px 0 0;font-size:12px;line-height:1.75;color:rgb(var(--muted));text-align:center}
/* ---- iPhone：添加到主屏幕（底部提示条 + 三步卡片） ---- */
.ios-hint{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:70;
  display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-radius:14px;
  background:rgb(var(--surface));border:.5px solid rgb(var(--line));
  box-shadow:0 14px 34px -14px rgb(16 24 32/.45);
  transform:translateY(140%);opacity:0;transition:transform .32s var(--spring),opacity .2s;
}
.ios-hint.show{transform:none;opacity:1}
.ios-hint .ih-ic{color:rgb(var(--ivy));flex:0 0 auto;display:grid;place-items:center}
.ios-hint .ih-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ios-hint .ih-tx{flex:1;min-width:0}
.ios-hint .ih-tx b{display:block;font-size:13px;font-weight:600;color:rgb(var(--ink))}
.ios-hint .ih-tx i{display:block;font-style:normal;font-size:11.5px;color:rgb(var(--faint));margin-top:1px}
.ios-hint .ih-go{
  flex:0 0 auto;height:32px;padding:0 14px;border-radius:9px;
  background:rgb(var(--ivy));color:rgb(var(--on-ivy));font-size:12.5px;font-weight:600;
}
.ios-hint .ih-go:active{background:rgb(var(--ivy-hover))}
.ios-hint .ih-x{
  width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;color:rgb(var(--faint));
}
.ios-hint .ih-x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.ios-card{width:min(400px,100%)}
.ios-body{padding:6px 20px 22px}
.ios-step{display:flex;gap:12px;padding:11px 0;border-bottom:.5px solid rgb(var(--line))}
.ios-step:last-of-type{border-bottom:0}
.ios-step>i{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));font-style:normal;font-size:11.5px;font-weight:700;
}
.ios-step b{display:block;font-size:13px;font-weight:600;color:rgb(var(--ink))}
.ios-step p{margin:4px 0 0;font-size:12px;line-height:1.7;color:rgb(var(--muted))}
.ios-share{
  display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;
  background:rgb(var(--hover));color:rgb(var(--ink-2));vertical-align:-4px;
}
.ios-share svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ios-note{
  margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgb(var(--sunken));
  font-size:11.5px;line-height:1.75;color:rgb(var(--muted));
}
.set-empty{font-size:12px;color:rgb(var(--faint));padding:14px 0}
@media (max-width:760px){
  /* 手机上让浮层自己整页滚（比「固定层里再套一个滚动容器」稳得多），
     标题和分类条吸顶，内容随页面自然滚动到底 */
  .set-ov{
    display:block;overflow-y:auto;overflow-x:hidden;background:rgb(var(--surface));
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  .set-wrap{display:block;height:auto;min-height:100%;overflow:visible;background:rgb(var(--surface))}
  .set-side{
    position:sticky;top:0;z-index:6;display:block;background:rgb(var(--canvas));
    box-shadow:0 .5px 0 rgb(16 24 32/.06);
  }
  .set-top{padding:calc(10px + env(safe-area-inset-top)) 12px 6px 16px}
  .set-title{font-size:18px}
  .set-acts{gap:6px}
  .set-x{
    height:32px;padding:0 10px 0 8px;color:rgb(var(--ink-2));
    background:rgb(var(--surface));box-shadow:0 1px 2px rgb(16 24 32/.08);
  }
  .set-x i{display:inline}
  /* 「更多」就在关闭旁边；点它弹出和笔记列表「⋯」同一套的卡片菜单（popover） */
  .set-more{display:flex;gap:4px;padding:0 10px 0 7px}
  .set-more svg{width:17px;height:17px;fill:currentColor;stroke:none}
  .set-more.on{background:rgb(var(--ink) / .1);color:rgb(var(--ink));box-shadow:inset 0 0 0 1px rgb(var(--ink) / .08)}
  #setMenu{display:none}
  /* 手机上分类只在「更多」的卡片菜单里出现，侧栏那份导航整块不显示 */
  .set-nav{display:none}
  .set-main{
    display:block;margin:0;border:0;border-radius:0;box-shadow:none;
    background:rgb(var(--surface));
  }
  .set-head{display:block;padding:0 16px}
  .set-head-in{padding:14px 0 2px}
  .set-head h2{font-size:20px}
  .set-body{
    flex:0 0 auto;height:auto;overflow:visible;
    /* 底部三键浮在浮层之上，留出它们的高度 + 渐隐区 */
    padding:0 16px calc(124px + env(safe-area-inset-bottom));
  }
}
}
