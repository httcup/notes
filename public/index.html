<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>常青笔记</title>
<style>
/* ============ tokens（取自 ivyNote 真实配色） ============ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  --shelf-w:296px;
  --spring:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-hover:31 104 69; --ivy-soft:229 243 235; --on-ivy:255 255 255; --ivy-ink:27 92 60;
  --warn:190 134 48; --warn-ink:110 78 26; --warn-soft:252 244 228;
  --danger:176 62 54; --danger-soft:252 235 233;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
  --shadow-float:0 0 0 .5px rgb(16 24 32 / .06),0 2px 6px rgb(16 24 32 / .05),0 12px 28px -10px rgb(16 24 32 / .14);
  --shadow-lift:0 0 0 .5px rgb(16 24 32 / .07),0 8px 16px -6px rgb(16 24 32 / .08),0 32px 64px -16px rgb(16 24 32 / .22);
  --tag-green-fg:#3f7a5b; --tag-blue-fg:#4f6a9a; --tag-amber-fg:#a0702c; --tag-pink-fg:#a65a7c; --tag-gray-fg:#6f767d; --tag-purple-fg:#7a62a8;
}
[data-theme=dark]{
  color-scheme:dark;
  --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
  --ink:232 235 238; --ink-2:190 195 200; --muted:138 144 150; --faint:96 101 107;
  --line:44 48 52; --hover:38 41 45;
  --ivy:86 180 130; --ivy-hover:110 196 150; --ivy-soft:28 50 39; --on-ivy:10 28 18; --ivy-ink:150 224 182;
  --warn:214 170 98; --warn-ink:232 205 158; --warn-soft:48 40 26;
  --danger:226 128 116; --danger-soft:58 33 31;
  --code-bg:31 34 38;
  --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  --shadow-float:0 0 0 .5px rgb(255 255 255 / .07),0 12px 28px -10px rgb(0 0 0 / .6);
  --shadow-lift:0 0 0 .5px rgb(255 255 255 / .08),0 32px 64px -16px rgb(0 0 0 / .7);
  --tag-green-fg:#92c4a6; --tag-blue-fg:#9db2dc; --tag-amber-fg:#d9b77e; --tag-pink-fg:#dba6bf; --tag-gray-fg:#a3a9af; --tag-purple-fg:#bcaae0;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgb(var(--ivy) / .18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgb(var(--ink) / .13);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--ink) / .22);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.shell{display:flex;height:100dvh;overflow:hidden}

/* ============ shelf ============ */
.shelf{
  width:var(--shelf-w);flex:0 0 var(--shelf-w);display:flex;flex-direction:column;
  padding:14px 12px 12px;position:relative;transition:margin-left .34s var(--spring),opacity .2s;
}
.shelf.collapsed{margin-left:calc(var(--shelf-w) * -1);opacity:0;pointer-events:none}
.shelf-open{
  position:fixed;left:12px;top:12px;z-index:40;width:32px;height:32px;display:none;place-items:center;
  border-radius:8px;color:rgb(var(--muted));background:rgb(var(--surface)/.9);
  box-shadow:var(--shadow-float);backdrop-filter:blur(8px);
}
.shelf-open:hover{color:rgb(var(--ink))}
.shelf-open.show{display:grid}
.shelf-open svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.shelf-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand-name{
  font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:.01em;
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ver{
  font-size:10px;font-weight:600;letter-spacing:.02em;color:rgb(var(--ivy-ink));
  background:rgb(var(--ivy-soft));border-radius:5px;padding:2px 5px;flex:0 0 auto;
}
.head-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.icon-btn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:7px;
  color:rgb(var(--muted));transition:background .15s,color .15s;
}
.icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.shelf-body{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px 64px;scrollbar-gutter:stable}
.sec-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgb(var(--muted));
  margin:10px 8px 6px;
}
.sec-label .count{font-weight:500;color:rgb(var(--faint))}
.shelf-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:rgb(var(--ink-2));
  transition:background .14s,color .14s;position:relative;
}
.shelf-row:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.shelf-row svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.shelf-row .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.shelf-row .meta{font-size:11px;color:rgb(var(--faint));flex:0 0 auto}
.shelf-row.new-nb{color:rgb(var(--ivy));font-size:13px;padding:6px 8px}
.shelf-row.new-nb:hover{background:rgb(var(--ivy-soft))}
.shelf-row.new-nb svg{color:currentColor}

.nb-group{margin-top:2px}
.nb-head{
  display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:7px;
  color:rgb(var(--muted));font-size:12px;font-weight:600;letter-spacing:.02em;
}
.nb-head:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.nb-head svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb-head.open svg.chev{transform:rotate(90deg)}
.nb-head .t{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-notes{padding-left:8px}
.nb-notes.hidden{display:none}

.note-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px;color:rgb(var(--ink-2));font-size:13.5px;
  transition:background .14s,color .14s;
}
.note-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.note-item.active{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:500}
.note-item svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:rgb(var(--faint))}
.note-item.active svg{color:rgb(var(--ivy))}
.note-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .tags{display:flex;gap:3px;flex:0 0 auto}
.dot-tag{width:5px;height:5px;border-radius:50%}

.shelf-foot{margin-top:auto;padding-top:10px}

/* dock */
.dock{
  position:absolute;left:12px;right:12px;bottom:12px;height:46px;
  display:flex;align-items:center;gap:2px;padding:5px 6px;
  background:rgb(var(--surface)/.86);backdrop-filter:blur(14px) saturate(1.4);
  border-radius:13px;box-shadow:var(--shadow-float);
}
.dock-item{
  height:34px;min-width:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;color:rgb(var(--muted));font-size:12.5px;flex:0 0 auto;
  transition:background .16s,color .16s;
}
.dock-item svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.dock-item.active{background:rgb(var(--ink) / .06);color:rgb(var(--ink));font-weight:500}
.dock-item .lbl{white-space:nowrap}
.dock-spacer{flex:1}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:13px;font-weight:700;
  background:#f3ddd6;color:#8a4a34;flex:0 0 auto;transition:transform .18s var(--spring);
}
[data-theme=dark] .avatar{background:#4a3229;color:#e8c2b2}
.avatar:hover{transform:scale(1.06)}

/* ============ paper ============ */
.main-wrap{flex:1;min-width:0;display:flex;padding:8px 12px 8px 0}.paper{
  flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:rgb(var(--surface));border:1px solid rgb(var(--line));border-radius:14px;
  box-shadow:var(--shadow-paper);
}
.tabbar{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;flex:0 0 auto;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;max-width:180px;height:28px;padding:0 8px 0 10px;
  border-radius:7px;font-size:12.5px;color:rgb(var(--muted));white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.tab.active{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab .t{overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tab .x{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;opacity:0;transition:opacity .14s,background .14s}
.tab:hover .x,.tab.active .x{opacity:.7}
.tab .x:hover{background:rgb(var(--ink)/.08);opacity:1}
.tab .x svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.tab-new{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:rgb(var(--faint))}
.tab-new:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.tab-new svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

.paper-actions{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:2px;z-index:6}
.pa-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:rgb(var(--muted));transition:background .15s,color .15s}
.pa-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.pa-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pa-btn.on{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink))}

.content-row{flex:1;display:flex;min-height:0;position:relative}

/* ============ doc ============ */
.scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0}
.doc{max-width:700px;margin:0 auto;padding:52px 44px 140px}
.doc-title{
  display:block;width:100%;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:34px;font-weight:600;line-height:1.28;letter-spacing:-.012em;
  color:rgb(var(--ink));padding:0;margin:0 0 2px;
}
.doc-title::placeholder{color:rgb(var(--faint));opacity:.75}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0 34px;font-size:12.5px;color:rgb(var(--faint))}
.doc-meta .sep{opacity:.6}
.meta-btn{padding:2px 4px;border-radius:5px;color:rgb(var(--faint));transition:background .14s,color .14s;font-size:12.5px}
.meta-btn:hover{background:rgb(var(--hover));color:rgb(var(--ink-2))}
.meta-btn.add{color:rgb(var(--faint))}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  font-size:11.5px;font-weight:500;background:rgb(var(--ink)/.05);color:rgb(var(--tag-gray-fg));
}
.chip .rm{opacity:.5;font-size:13px;line-height:1}
.chip:hover .rm{opacity:1}
.tag-input{
  height:22px;width:86px;border:0;outline:none;background:none;font-size:12.5px;
  border-bottom:1px solid rgb(var(--ivy)/.5);
}

.doc-body{position:relative}
.prose{
  font-family:var(--font-serif);font-size:17.5px;line-height:1.95;color:rgb(var(--ink));
  word-break:break-word;
}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose h1,.prose h2,.prose h3,.prose h4{font-weight:600;line-height:1.4;margin:1.7em 0 .62em;letter-spacing:-.005em;scroll-margin-top:80px}
.prose h1{font-size:1.62em}
.prose h2{font-size:1.34em}
.prose h3{font-size:1.14em}
.prose h4{font-size:1em}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em}
.prose li{margin:.3em 0}
.prose li::marker{color:rgb(var(--faint))}
.prose blockquote{
  margin:1.2em 0;padding:2px 0 2px 16px;border-left:2px solid rgb(var(--ivy)/.35);
  color:rgb(var(--ink-2));
}
.prose blockquote p:last-child{margin-bottom:0}
.prose code{
  font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));
  padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line));
}
.prose pre{
  background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:1.2em 0;
}
.prose pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.prose hr{border:0;border-top:1px solid rgb(var(--line));margin:2.2em 0}
.prose img{max-width:100%;border-radius:9px;display:block;margin:1.2em 0}
.prose a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.prose mark{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));padding:1px 3px;border-radius:4px}
.prose del{color:rgb(var(--muted))}
.prose .wikilink{
  color:rgb(var(--ivy-ink));background:rgb(var(--ivy-soft));text-decoration:none;
  padding:1.5px 5px;border-radius:5px;font-size:.94em;white-space:nowrap;
}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.94em}
.prose th,.prose td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.prose th{background:rgb(var(--sunken));font-weight:600}
.prose .task{list-style:none;margin-left:-1.1em}
.prose .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.prose .empty{color:rgb(var(--faint));font-size:15px}
.source{
  display:none;width:100%;min-height:360px;border:0;outline:none;background:none;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:17.5px;line-height:1.95;color:rgb(var(--ink));padding:0;
}
.doc.mode-edit .prose{display:none}
.doc.mode-edit .source{display:block}
.doc.mode-preview .prose{cursor:text}

/* empty state */
.blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgb(var(--faint))}
.blank .kbd{font-family:var(--font-mono);font-size:11.5px;padding:3px 7px;border-radius:5px;background:rgb(var(--sunken));border:.5px solid rgb(var(--line))}
.blank p{margin:0;font-size:13.5px}

/* ============ outline ============ */
.outline{
  width:236px;flex:0 0 236px;border-left:1px solid rgb(var(--line));
  padding:52px 14px 20px;overflow-y:auto;scrollbar-width:none;
  transition:width .26s var(--spring),opacity .18s,padding .26s;
}
.outline::-webkit-scrollbar{width:0}
.outline.hidden{width:0;flex-basis:0;opacity:0;padding-left:0;padding-right:0;border-left:0;overflow:hidden}
.outline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.outline-head span{font-size:12px;font-weight:600;letter-spacing:.03em;color:rgb(var(--muted))}
.ol-item{
  display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.5;color:rgb(var(--muted));
  padding:4px 6px;border-radius:6px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .14s,color .14s;
}
.ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.ol-item.l2{padding-left:16px}
.ol-item.l3{padding-left:26px;font-size:12px}
.ol-item.l4,.ol-item.l5,.ol-item.l6{padding-left:34px;font-size:12px;color:rgb(var(--faint))}
.ol-empty{font-size:12px;color:rgb(var(--faint));padding:4px 6px}

/* ============ media ============ */
.view-pad{padding:44px 32px 40px}
.media-search{
  display:flex;align-items:center;gap:8px;max-width:320px;height:32px;padding:0 10px;
  border-radius:8px;background:rgb(var(--sunken));color:rgb(var(--muted));
}
.media-search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.media-search input{flex:1;border:0;outline:none;background:none;font-size:13px}
.media-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:rgb(var(--muted));font-size:13.5px;padding-bottom:60px;
}
.media-empty svg{width:32px;height:32px;stroke:rgb(var(--faint));fill:none;stroke-width:1.4;opacity:.7}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.media-card{border-radius:10px;overflow:hidden;border:.5px solid rgb(var(--line));background:rgb(var(--sunken));transition:transform .2s var(--spring),box-shadow .2s}
.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.media-thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:11px;color:rgb(var(--faint))}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-name{padding:7px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgb(var(--surface))}

/* ============ graph ============ */
#graphWrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#graphWrap.dragging{cursor:grabbing}
#graphCanvas{width:100%;height:100%;display:block}
.graph-zoom{
  position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;
  background:rgb(var(--surface)/.9);backdrop-filter:blur(12px);border-radius:11px;
  box-shadow:var(--shadow-float);overflow:hidden;
}
.graph-zoom button{width:36px;height:34px;display:grid;place-items:center;color:rgb(var(--muted))}
.graph-zoom button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.graph-zoom svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.legend{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;color:rgb(var(--ink-2))}
.legend .sq{width:8px;height:8px;border-radius:2px;background:rgb(var(--warn))}
.legend .rd{width:8px;height:8px;border-radius:50%;background:rgb(var(--faint))}

/* ============ overlay / palette ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;
  padding-top:14vh;background:rgb(10 12 14 / .22);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.open{opacity:1;pointer-events:auto}
.palette{
  width:min(620px,90vw);background:rgb(var(--surface));border-radius:13px;
  box-shadow:var(--shadow-lift);border:.5px solid rgb(var(--line));
  overflow:hidden;transform:translateY(-8px) scale(.985);transition:transform .22s var(--spring);
}

      body:`这是一款**本地优先**的 Markdown 笔记应用。所有内容先写进浏览器里的数据库，再在后台安静地同步。

## 三个核心习惯

1. **原子化** —— 一条笔记只讲一件事，方便被反复引用
2. **双向链接** —— 用 [[常青笔记方法论]] 这样的写法把想法连成网
3. **持续迭代** —— 笔记会旧，但可以被修剪、被重写

> 常青笔记不是「收集」，而是「培育」。写下来不是为了存起来，是为了让它下次长出新的东西。

## 常用语法

- 行内代码 \`npm run dev\`、加粗、*斜体*、~~删除线~~
- 任务清单
  - [x] 建一个笔记本
  - [ ] 写下今天的第一条想法

右侧的**大纲**会跟着滚动高亮，左下的 Dock 可以切到媒体库和关系图。`}),

      body:`# 什么是常青笔记

Andy Matuschak 提出的概念：笔记应该像常青植物一样，被持续修改、链接、复用，而不是一次性写完就沉底。

## 判断标准

| 维度 | 临时笔记 | 常青笔记 |
| --- | --- | --- |
| 生命周期 | 一次性 | 长期迭代 |
| 粒度 | 混杂 | 单一主题 |
| 链接 | 少 | 密度高 |

## 落地方式

先写**论点式标题**，再写正文解释这个论点为什么成立。标题本身就是一句判断句，而不是「关于 XX 的想法」。

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);

    s.media = []; // 本地文件的 blob url 无法持久化
    if(typeof s.shelfOpen!=='boolean') s.shelfOpen = true;
    if(typeof s.outlineOpen!=='boolean') s.outlineOpen = true;
    if(!Array.isArray(s.tabs) || !s.tabs.length) s.tabs = s.notes.length? [s.notes[0].id] : [];
    if(!s.active || !s.notes.find(x=>x.id===s.active)) s.active = s.tabs[0] || null;
    return s;
  }catch(e){ return seed(); }
}

}

  html += `<button class="shelf-row new-nb" data-act="new-nb">${ic('plus')}<span class="t">新建笔记本</span></button>`;

  const byNb = {};

  const loose = notes.filter(n=>!n.notebookId);

  function noteRow(n){
    const dots = n.tags.slice(0,3).map((t,i)=>`<span class="dot-tag" style="background:${TAG_COLORS[i%TAG_COLORS.length]}"></span>`).join('');
    return `<button class="note-item ${n.id===S.active?'active':''}" data-open="${n.id}">

      ${dots?`<span class="tags">${dots}</span>`:''}
    </button>`;
  }

  S.notebooks.forEach(nb=>{

/* ========== 笔记操作 ========== */
function newNote(notebookId){
  const now = Date.now();
  const n = {id:'n'+now.toString(36), title:'', body:'', notebookId:notebookId||null,
    tags:[], trashed:false, createdAt:now, updatedAt:now};
  S.notes.unshift(n); S.active = n.id;
  if(!S.tabs.includes(n.id)) S.tabs.push(n.id);
  S.view = 'notes';
  renderAll(); save();
  setTimeout(()=>{ const t=$('#docTitle'); if(t) t.focus(); }, 30);
  return n;
}
function openNote(id){
  const n = noteById(id); if(!n) return;
  if(n.trashed){ toast('该笔记在回收站中'); return; }
  trashView = false;
  S.active = id; S.view='notes';
  if(!S.tabs.includes(id)) S.tabs.push(id);
  renderAll(); save();
}
function closeTab(id){
  const i = S.tabs.indexOf(id); if(i<0) return;
  S.tabs.splice(i,1);
  if(S.active===id) S.active = S.tabs[Math.max(0,i-1)] || null;
  renderAll(); save();
}
function newNotebook(){
  const name = prompt('笔记本名称', '新笔记本');
  if(!name) return;
  S.notebooks.push({id:'nb'+Date.now().toString(36), name:name.trim(), open:true});
  renderAll(); save(); toast('已创建笔记本「'+name.trim()+'」');
}
function toggleTrash(id){
  const n = noteById(id); if(!n) return;
  n.trashed = !n.trashed; n.updatedAt = Date.now();
  if(n.trashed && S.active===id){
    S.tabs = S.tabs.filter(t=>t!==id);
    S.active = S.tabs[0] || null;
  }
  renderAll(); save(); toast(n.trashed?'已移到回收站':'已恢复');
}
let trashView = false;
function openTrashView(){ trashView = true; S.view='notes'; S.active=null; S.tabs=[]; renderAll(); }

function renderMeta(){
  const n = noteById(S.active); if(!n) return;

  const d = new Date(n.updatedAt);
  const stamp = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const wc = countWords(n.body);
  meta.innerHTML = `<button class="meta-btn" id="metaTime">${stamp}</button>
    <span class="sep">·</span><span>${wc} 字</span>
    ${n.tags.map((t,i)=>`<span class="chip" style="color:${TAG_COLORS[i%TAG_COLORS.length]}">${esc(t)}<span class="rm" data-rmtag="${esc(t)}">×</span></span>`).join('')}
    <button class="meta-btn add" id="addTag">+ 标签</button>`;
  const add = meta.querySelector('#addTag');
  add.onclick=()=>{
    const inp = document.createElement('input');
    inp.className='tag-input'; inp.placeholder='标签名';
    add.replaceWith(inp); inp.focus();
    const commit = ()=>{
      const v = inp.value.trim();
      if(v && !n.tags.includes(v)){ n.tags.push(v); }
      renderMeta(); renderShelf(); save();
    };
    inp.onblur = commit;
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ inp.value=''; commit(); } };
  };
  meta.querySelectorAll('[data-rmtag]').forEach(x=>x.onclick=()=>{
    n.tags = n.tags.filter(t=>t!==x.dataset.rmtag); renderMeta(); renderShelf(); save();
  });
  meta.querySelector('#metaTime').onclick=(e)=>popover(e.currentTarget,[
    ['创建于 '+new Date(n.createdAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}), null],
    ['最后编辑 '+new Date(n.updatedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}), null]
  ]);
}

function countWords(md){
  const t = md.replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\-\|\[\]()!]/g,'').replace(/\s+/g,'');
  return t.length;
}

function wireEditor(n){
  const title = $('#docTitle');
  const src = $('#source');
  const doc = $('#doc');
  src.value = n.body;

  const grow = (el)=>{ el.style.height='auto'; el.style.height = el.scrollHeight+'px'; };
  const growTitle = ()=>{ title.style.height='auto'; title.style.height = title.scrollHeight+'px'; };
  growTitle();

  title.addEventListener('input', ()=>{
    n.title = title.value; n.updatedAt = Date.now();
    renderTabs(); renderShelf(); save(); growTitle(); renderMeta();
  });
  title.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); src.focus(); }
  });
  title.addEventListener('blur', ()=>{ if(!n.title.trim() && n._auto){ n._auto=false; } });

  src.addEventListener('input', ()=>{
    n.body = src.value; n.updatedAt = Date.now();
    grow(src); renderMeta(); save();
    if(doc.classList.contains('mode-edit')) { /* live outline */ }
  });
  src.addEventListener('keydown', e=>{
    if(e.key==='Tab'){ e.preventDefault(); const s=src.selectionStart,en=src.selectionEnd;
      src.setRangeText('  ', s, en, 'end'); n.body = src.value; save(); }
  });
  src.addEventListener('paste', handlePaste);
  doc.addEventListener('dragover', e=>e.preventDefault());
  doc.addEventListener('drop', handleDrop);
  grow(src);

  // 预览双击 → 编辑
  $('#prose').addEventListener('dblclick', ()=>{ if(!n.body.trim()) enterEdit(); });

  // 切换编辑/预览
  doc.dataset.note = n.id;
}

function enterEdit(){

/* ========== Markdown ========== */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,alias)=>
    `<a href="#" class="wikilink" data-wiki="${t}">${alias||t}</a>`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  return s;
}
function mdToHtml(md){
  const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const headings = []; let hIdx = 0;
  let out = []; let i = 0;
  const isTableSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');

  while(i < lines.length){
    const line = lines[i];

    // code fence
    if(/^```/.test(line)){
      const lang = line.slice(3).trim();
      let buf = []; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code${lang?` class="lang-${esc(lang)}"`:''}>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    // heading
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lv = m[1].length; const id = 'h'+(hIdx++);
      headings.push({level:lv, text:m[2].replace(/[*_`]/g,''), id});
      out.push(`<h${lv} id="${id}">${inlineMd(m[2])}</h${lv}>`);
      i++; continue;
    }
    // hr
    if(/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)){ out.push('<hr>'); i++; continue; }
    // blockquote
    if(/^>\s?/.test(line)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push(`<blockquote>${buf.map(b=>`<p>${inlineMd(b)}</p>`).join('')}</blockquote>`);
      continue;
    }
    // table
    if(line.includes('|') && i+1<lines.length && isTableSep(lines[i+1])){
      const rows = []; let head = line;
      i += 2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){ rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      out.push(`<table><thead><tr>${cells(head).map(c=>`<th>${inlineMd(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${cells(r).map(c=>`<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    // lists
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      let items = [];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let l = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        let cls='';
        if(/^\[[ xX]\]\s/.test(l)){
          const chk = /^\[[xX]\]/.test(l);
          l = l.replace(/^\[[ xX]\]\s/,'');
          cls=' class="task"';
          items.push(`<li${cls}><input type="checkbox" disabled ${chk?'checked':''}>${inlineMd(l)}</li>`);
        } else {
          items.push(`<li>${inlineMd(l)}</li>`);
        }
        i++;
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      continue;
    }
    // blank
    if(!line.trim()){ i++; continue; }
    // paragraph
    let buf=[line]; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isTableSep(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push(`<p>${buf.map(inlineMd).join('<br>')}</p>`);
  }
  return {html: out.join('\n'), headings};
}

/* ========== 媒体库 ========== */
let mediaCat = 'all';
const CATS = [
  {k:'all', label:'全部'}, {k:'image', label:'图片'}, {k:'video', label:'视频'},
  {k:'audio', label:'音频'}, {k:'file', label:'文件'}, {k:'unused', label:'未引用'}, {k:'trash', label:'回收站'}
];
function kindOf(f){ if(f.type.startsWith('image')) return 'image'; if(f.type.startsWith('video')) return 'video'; if(f.type.startsWith('audio')) return 'audio'; return 'file'; }
function mediaCount(k){
  if(k==='all') return S.media.length;
  if(k==='unused') return S.media.filter(m=>!m.noteId).length;
  if(k==='trash') return 0;
  return S.media.filter(m=>kindOf(m)===k).length;
}
function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function mediaShelf(){
  let h = ``;
  h += CATS.map(c=>`<button class="shelf-row" data-media-cat="${c.k}" style="${mediaCat===c.k?'background:rgb(var(--hover));color:rgb(var(--ink))':''}">
      <span class="t" style="font-weight:${mediaCat===c.k?500:400}">${c.label}</span>
      <span class="meta">${mediaCount(c.k)}</span></button>`).join('');
  const used = S.media.filter(m=>m.noteId).length;
  const bytes = S.media.reduce((a,m)=>a+m.size,0);
  h += `<div style="position:absolute;left:20px;right:20px;bottom:78px;font-size:11px;line-height:1.7;color:rgb(var(--faint))">
      ${S.media.length} 个文件 · ${fmtSize(bytes)} · 被 ${used} 篇笔记引用<br>S3 存储 + CDN · 自动去重 · 加密存储</div>`;
  return h;
}

function renderMedia(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  const list = S.media.filter(m=>{
    if(mediaCat==='all') return true;
    if(mediaCat==='unused') return !m.noteId;
    return kindOf(m)===mediaCat;
  });
  scrollEl.style.display='';
  scrollEl.innerHTML = `<div class="view-pad" style="position:relative;height:100%">
      <div class="media-search">${ic('search')}
        <input id="mediaSearch" placeholder="搜索文件名" spellcheck="false"></div>
      ${list.length? `<div class="media-grid" id="mediaGrid">${list.map(m=>`
        <div class="media-card" data-name="${esc(m.name.toLowerCase())}">
          <div class="media-thumb">${m.type.startsWith('image')?`<img src="${m.url}" alt="">`:kindOf(m).toUpperCase()}</div>
          <div class="media-name" title="${esc(m.name)}">${esc(m.name)}</div>
        </div>`).join('')}</div>`
      : `<div class="media-empty">
          ${ic('image')}<span>还没有文件。在笔记中粘贴或拖入图片即可自动加入媒体库。</span>
        </div>`}
    </div>`;
  const ms = $('#mediaSearch');
  if(ms) ms.oninput = ()=>{
    const q = ms.value.trim().toLowerCase();
    document.querySelectorAll('#mediaGrid .media-card').forEach(c=>{
      c.style.display = !q || c.dataset.name.includes(q) ? '' : 'none';
    });
  };
  scrollEl.querySelectorAll('[data-media-cat]').forEach(b=>b.onclick=()=>{ mediaCat=b.dataset.mediaCat; renderShelf(); renderMain(); });
}

function pickFiles(){
  const inp = document.createElement('input');
  inp.type='file'; inp.multiple = true;
  inp.onchange = ()=>{ [...inp.files].forEach(f=>addMedia(f)); renderMain(); };
  inp.click();
}
function addMedia(file){
  const m = {id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name:file.name, size:file.size, type:file.type||'application/octet-stream',
    url:URL.createObjectURL(file), noteId:S.active, createdAt:Date.now()};
  S.media.unshift(m); return m;
}
function handlePaste(e){
  const items = [...(e.clipboardData?.items||[])];
  const files = items.filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);
  if(!files.length) return;
  e.preventDefault();
  const src = e.currentTarget;
  files.forEach(f=>{
    const m = addMedia(f);
    const md = m.type.startsWith('image') ? `\n![${m.name}](${m.url})\n` : `\n[${m.name}](${m.url})\n`;
    const p = src.selectionStart;
    src.setRangeText(md, p, src.selectionEnd, 'end');
  });
  const n = noteById(S.active); if(n){ n.body = src.value; n.updatedAt=Date.now(); save(); }
  toast(files.length+' 个文件已加入媒体库');
}
function handleDrop(e){

/* ========== 关系图 ========== */
let graphState = null;
function graphShelf(){
  const links = [];
  S.notes.filter(n=>!n.trashed).forEach(n=>{
    (n.body.match(/\[\[([^\]|]+)/g)||[]).forEach(x=>links.push(x));
  });
  return `<div style="font-size:12px;color:rgb(var(--muted));padding:2px 8px 14px">${S.notes.filter(n=>!n.trashed).length} 篇笔记 · ${links.length} 条链接</div>
    <div class="media-search" style="margin:0 8px 14px;max-width:none">${ic('search')}
      <input id="graphFilter" placeholder="筛选" spellcheck="false"></div>
    <div class="legend"><span class="sq"></span>目录层级</div>
    <div class="legend"><span class="rd"></span>标签</div>`;
}
function renderGraph(){
  outlineEl.classList.add('hidden');
  paperActions.innerHTML = '';
  scrollEl.style.display='';
  const notes = S.notes.filter(n=>!n.trashed);
  scrollEl.innerHTML = `<div id="graphWrap">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-zoom">
        <button data-z="in">${ic('plus')}</button>
        <button data-z="out">${ic('minus')||'<path d="M5 12h14"/>'}</button>
        <button data-z="fit">${ic('fit')}</button>
      </div>
    </div>`;
  const wrap = $('#graphWrap'), cv = $('#graphCanvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  let W = Math.max(wrap.clientWidth, 320), H = Math.max(wrap.clientHeight, 320);
  const resize = ()=>{
    W = Math.max(wrap.clientWidth, 320); H = Math.max(wrap.clientHeight, 320);
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  };
  const nodes = notes.map((n,i)=>{
    const a = i/notes.length*6.283 - Math.PI/2;
    return {
      id:n.id, label:n.title||'无标题',
      x: W/2 + Math.cos(a)*Math.min(190, W/3),
      y: H/2 + Math.sin(a)*Math.min(150, H/3),
      vx:0, vy:0, r: n.id===S.active?7:5.5
    };
  });
  const idx = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const edges = [];
  notes.forEach(n=>{
    (n.body.match(/\[\[([^\]|]+)\]\]/g)||[]).forEach(m=>{
      const t = m.slice(2,-2).split('|')[0];
      const target = notes.find(x=>(x.title||'')===t);
      if(target && target.id!==n.id) edges.push({a:n.id,b:target.id});
    });
  });
  graphState = {nodes, edges, idx, zoom:1, ox:0, oy:0};

  function step(){
    const {nodes, edges} = graphState;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||1;
        const f = 5200/(d*d);
        a.vx -= dx/d*f; a.vy -= dy/d*f; b.vx += dx/d*f; b.vy += dy/d*f;
      }
    }
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
      const f=(d-150)*0.012;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    });
    nodes.forEach(n=>{
      n.vx += (W/2-n.x)*0.0022; n.vy += (H/2-n.y)*0.0022;
      n.vx*=0.86; n.vy*=0.86;
      n.x+=n.vx; n.y+=n.vy;
    });
  }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function draw(){
    const dark = document.documentElement.dataset.theme==='dark';
    ctx.clearRect(0,0,W,H);
    const {nodes,edges,zoom,ox,oy} = graphState;
    ctx.save(); ctx.translate(ox,oy); ctx.scale(zoom,zoom);
    edges.forEach(e=>{
      const a=graphState.idx[e.a], b=graphState.idx[e.b];
      ctx.beginPath(); ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = dark? 'rgba(255,255,255,.13)':'rgba(16,24,32,.13)';
      ctx.lineWidth = 1; ctx.stroke();
    });
    nodes.forEach(n=>{
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832);
      const active = n.id===S.active;
      ctx.fillStyle = active ? (dark?'#56b482':'#287a52') : (dark?'#8a9096':'#a0a6ac');
      ctx.fill();
      if(active){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,6.2832);
        ctx.fillStyle = dark?'rgba(86,180,130,.16)':'rgba(40,122,82,.12)'; ctx.fill(); }
      ctx.font = '12px ' + css('--font-sans').replace(/"/g,'"');
      ctx.fillStyle = dark? 'rgba(232,235,238,.72)':'rgba(28,31,34,.66)';
      ctx.textAlign='center';
      ctx.fillText(n.label.length>14? n.label.slice(0,14)+'…':n.label, n.x, n.y+n.r+16);
    });
    ctx.restore();
  }
  let raf;
  function loop(t){ let k=0; while(k<2){ step(); k++; } draw(); }
  // 静置布局
  // 静置布局
  resize();
  for(let k=0;k<260;k++) step();
  draw();
  window.onresize = resize;

  wrap.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=b.dataset.z;
    if(z==='in') graphState.zoom=Math.min(2.5,graphState.zoom*1.2);
    if(z==='out') graphState.zoom=Math.max(.35,graphState.zoom/1.2);
    if(z==='fit'){ graphState.zoom=1; graphState.ox=0; graphState.oy=0; for(let k=0;k<120;k++) step(); }
    draw();
  });
  // 拖拽 / 平移
  let drag=null;
  wrap.addEventListener('pointerdown', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-ox)/graphState.zoom, my=(e.clientY-r.top-oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+8);
    drag = hit ? {type:'node', n:hit} : {type:'pan', x:e.clientX-ox, y:e.clientY-oy};
    wrap.classList.add('dragging');
  });
  window.onpointermove = e=>{
    if(!drag) return;
    if(drag.type==='pan'){ graphState.ox = e.clientX-drag.x; graphState.oy = e.clientY-drag.y; }
    else {
      const r = cv.getBoundingClientRect();
      drag.n.x = (e.clientX-r.left-graphState.ox)/graphState.zoom;
      drag.n.y = (e.clientY-r.top-graphState.oy)/graphState.zoom;
      drag.n.vx=drag.n.vy=0;
    }
    draw();
  };
  window.onpointerup = ()=>{
    if(drag && drag.type==='node'){ for(let k=0;k<90;k++) step(); draw(); }
    drag=null; wrap.classList.remove('dragging');
  };
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const old = graphState.zoom;
    const nz = Math.max(.35, Math.min(2.5, old * (e.deltaY>0? .92 : 1.085)));
    graphState.ox = mx - (mx-graphState.ox)*(nz/old);
    graphState.oy = my - (my-graphState.oy)*(nz/old);
    graphState.zoom = nz; draw();
  }, {passive:false});
  cv.addEventListener('click', e=>{
    const r = cv.getBoundingClientRect();
    const mx=(e.clientX-r.left-graphState.ox)/graphState.zoom, my=(e.clientY-r.top-graphState.oy)/graphState.zoom;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+9);
    if(hit) openNote(hit.id);
  });
  const gf = $('#graphFilter');
  if(gf) gf.oninput = ()=>{ /* 预留 */ };
}

    r.onload = ()=>{
      const text = String(r.result);
      const first = text.split('\n').find(l=>/^#\s+/.test(l));
      const nn = newNote();
      nn.title = first ? first.replace(/^#\s+/,'').trim() : f.name.replace(/\.\w+$/,'');

  ].filter(c=>!query || c.t.toLowerCase().includes(query));

      paletteRows.push({f:()=>{ closePalette(); openNote(n.id); }});

        <span class="h">${n.body.replace(/\s+/g,' ').slice(0,28)}</span></button>`;
    });
  }
  if(cmds.length){
    html += `<div class="p-group">命令</div>`;
    cmds.forEach(c=>{
      paletteRows.push({f:c.f});
      html += `<button class="p-row" data-p="${paletteRows.length-1}">${ic(c.icon)}<span class="t">${c.t}</span>${c.h?`<span class="h">${c.h}</span>`:''}</button>`;
    });

  if(!html) html = `<div class="p-empty">没有匹配结果</div>`;

/* ========== 云同步 ========== */
const SYNC_STORE = 'ivy.sync';
const SYNC = { key:'', state:'off', last:0, error:'' };
try{
  const raw = localStorage.getItem(SYNC_STORE);
  if(raw){ const s = JSON.parse(raw); SYNC.key = s.key||''; SYNC.last = s.last||0; if(SYNC.key) SYNC.state='idle'; }
}catch(e){}
function syncSave(){ try{ localStorage.setItem(SYNC_STORE, JSON.stringify({key:SYNC.key,last:SYNC.last})); }catch(e){} }
function syncTip(){
  if(!SYNC.key) return '云同步未连接 · 点击设置';
  if(SYNC.state==='busy') return '正在同步…';
  if(SYNC.state==='error') return '同步失败：'+(SYNC.error||'网络错误')+' · 点击查看';
  if(SYNC.state==='ok') return '已同步 · '+new Date(SYNC.last).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · 点击管理';
  return '云同步已就绪 · 点击立即同步';
}
let syncBusy = false, syncTimer = null, syncPanelOpen = false;

async function api(method, body){
  const r = await fetch('/api/sync', {
    method,
    headers: {'content-type':'application/json','x-ivy-key':SYNC.key},
    body: body? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return data;
}
function localPayload(){
  return {
    notes: S.notes.map(n=>({
      id:n.id, title:n.title||'', body:n.body||'', notebookId:n.notebookId||null,
      tags:n.tags||[], trashed:!!n.trashed, deleted:!!n.deleted,
      createdAt:n.createdAt||0, updatedAt:n.updatedAt||0
    })),
    notebooks: S.notebooks.map(nb=>({id:nb.id, name:nb.name, open:nb.open!==false}))
  };
}
function applyRemote(data){
  let changed = false;
  const map = new Map(S.notes.map(n=>[n.id,n]));
  for(const r of (data.notes||[])){
    const cur = map.get(r.id);
    if(!cur){ S.notes.push(r); changed = true; }
    else if((r.updatedAt||0) > (cur.updatedAt||0)){ Object.assign(cur, r); changed = true; }
  }
  const nbm = new Map(S.notebooks.map(n=>[n.id,n]));
  for(const r of (data.notebooks||[])){
    const cur = nbm.get(r.id);
    if(!cur){ S.notebooks.push(r); changed = true; }
    else if(cur.name!==r.name || cur.open!==r.open){ Object.assign(cur, r); changed = true; }
  }
  return changed;
}
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, S, {media: []}))); }catch(e){}
}
function renderAfterSync(changed, force){
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#doc');
  if((changed || force) && !editing) renderAll();
  else renderDock();
  if(!S.active && !S.tabs.length){
    const first = liveNotes()[0];
    if(first){ S.active = first.id; S.tabs = [first.id]; renderAll(); }
  }
}
async function syncNow(opts={}){
  if(!SYNC.key || syncBusy) return;
  syncBusy = true;
  const firstTime = !SYNC.last;
  SYNC.state = 'busy'; SYNC.error = ''; renderDock();
  try{
    if(firstTime){
      // 首次连接：云端已有数据时，丢弃本机示例笔记，避免污染服务器
      const pre = await api('GET');
      if((pre.notes||[]).filter(x=>!x.deleted).length){
        S.notes = S.notes.filter(n=>!n.seed);
        applyRemote(pre);
      }
    }
    const data = await api('POST', localPayload());
    const changed = applyRemote(data);
    S.notes = S.notes.filter(n=>!n.deleted);
    SYNC.last = Date.now(); SYNC.state = 'ok'; syncSave();
    renderAfterSync(changed, opts.rerender);
    persistLocal();
  }catch(e){
    SYNC.state = 'error';
    SYNC.error = e.status===401 ? '口令不正确' : (e.message||'网络错误');
    renderDock();
  }finally{
    syncBusy = false;
    if(syncPanelOpen) paintSyncPanel();
  }
}
function queueSync(){
  try{ if(!SYNC.key || syncBusy) return; }catch(e){ return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 1200);
}
async function pullRemote(){
  if(!SYNC.key || syncBusy || document.hidden) return;
  try{
    const data = await api('GET');
    const changed = applyRemote(data);
    if(changed){ S.notes = S.notes.filter(n=>!n.deleted); renderAfterSync(true, false); persistLocal(); }
    SYNC.state = 'ok'; SYNC.last = Date.now(); syncSave(); renderDock();
  }catch(e){
    SYNC.state = 'error'; SYNC.error = e.status===401 ? '口令不正确' : (e.message||'网络错误');
    renderDock();
  }
}
setInterval(pullRemote, 45000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SYNC.key) pullRemote(); });

function paintSyncPanel(){
  const line = $('#syncStatusLine'); if(!line) return;
  const btn = $('#syncConnect');
  const n = S.notes.filter(x=>!x.trashed).length;
  if(SYNC.state==='ok'){
    line.innerHTML = `已连接 · 上次同步 <b>${new Date(SYNC.last).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b><br>本机 ${n} 篇笔记 · 多端按编辑时间后写覆盖`;
  } else if(SYNC.state==='busy'){
    line.innerHTML = '正在同步…';
  } else if(SYNC.state==='error'){
    line.innerHTML = `<b style="color:rgb(var(--warn))">同步失败</b> · ${esc(SYNC.error)}`;
  } else if(SYNC.key){
    line.innerHTML = '口令已保存，点「立即同步」开始。';
  } else {
    line.innerHTML = '尚未连接。口令只保存在本机浏览器，不会写进代码库。';
  }
  if(btn){
    btn.textContent = SYNC.key ? (SYNC.state==='busy' ? '同步中…' : '立即同步') : '连接并同步';
    btn.disabled = SYNC.state==='busy';
  }
  const dis = $('#syncDisconnect'); if(dis) dis.disabled = !SYNC.key;
}
function openSyncPanel(){
  const ov = $('#syncOverlay');
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h3>云同步</h3>
      <button class="pa-btn" id="syncClose" title="关闭">${ic('x')}</button></div>
    <p class="sheet-sub">笔记存在 Cloudflare D1 数据库里，换台设备输入同一口令就能读写。口令只留在本机浏览器。</p>
    <label class="field"><span>访问口令</span>
      <input id="syncKeyInput" type="password" placeholder="粘贴你的口令" autocomplete="off" spellcheck="false" value="${esc(SYNC.key)}"></label>
    <div class="sheet-row">
      <button class="btn-primary" id="syncConnect">连接并同步</button>
      <button class="btn-ghost" id="syncDisconnect">断开</button>
    </div>
    <div class="sheet-status" id="syncStatusLine"></div>
  </div>`;
  ov.classList.add('open'); syncPanelOpen = true;
  paintSyncPanel();
  $('#syncClose').onclick = closeSyncPanel;
  $('#syncDisconnect').onclick = ()=>{
    SYNC.key=''; SYNC.state='off'; SYNC.last=0; SYNC.error=''; syncSave();
    paintSyncPanel(); renderDock(); toast('已断开云同步，数据仍在本机');
  };
  $('#syncConnect').onclick = async ()=>{
    const v = $('#syncKeyInput').value.trim();
    if(!v){ toast('请先填写口令'); return; }
    SYNC.key = v; SYNC.state = 'busy'; syncSave(); paintSyncPanel(); renderDock();
    await syncNow({rerender:true});
    paintSyncPanel();
    if(SYNC.state==='ok') toast('已同步 · '+S.notes.filter(x=>!x.trashed).length+' 篇笔记');
  };
  $('#syncKeyInput').onkeydown = e=>{ if(e.key==='Enter') $('#syncConnect').click(); };
  if(!SYNC.key) setTimeout(()=>{ const i=$('#syncKeyInput'); if(i) i.focus(); }, 60);
}
function closeSyncPanel(){ $('#syncOverlay').classList.remove('open'); syncPanelOpen = false; }
$('#syncOverlay').addEventListener('mousedown', e=>{ if(e.target.id==='syncOverlay') closeSyncPanel(); });

/* ========== 启动 ========== */
paintRowIcons();
const qs = new URLSearchParams(location.search);
const vParam = qs.get('view');
if(vParam && ['notes','media','graph'].includes(vParam)){ S.view = vParam; trashView=false; }
const tParam = qs.get('theme');
if(tParam==='dark' || tParam==='light'){ S.theme = tParam; }
applyTheme();
// URL 里的 n= 参数
const nParam = qs.get('n');
if(nParam && noteById(nParam) && !noteById(nParam).trashed){
  S.active = nParam; if(!S.tabs.includes(nParam)) S.tabs.push(nParam);
} else if(qs.get('new')==='1'){ newNote(); }
renderAll();
if(qs.get('mode')==='edit') setTimeout(()=>enterEdit(), 60);
if(qs.get('cmd')==='1') setTimeout(()=>openPalette(), 60);
if(qs.get('sync')==='1') setTimeout(()=>openSyncPanel(), 60);
// 已有口令时后台安静同步一次
if(SYNC.key) setTimeout(()=>syncNow({rerender:true}), 350);
</script>
</body>
</html>
