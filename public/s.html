<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分享的笔记</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23287A52'/%3E%3Crect x='9.6' y='6.4' width='12.8' height='19.2' rx='2.6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M13.1 12.4h5.8M13.1 16h5.8M13.1 19.6h3.4' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-soft:229 243 235; --ivy-ink:27 92 60;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
    --ink:232 235 238; --ink-2:190 195 200; --muted:138 144 150; --faint:96 101 107;
    --line:44 48 52; --hover:38 41 45;
    --ivy:86 180 130; --ivy-soft:28 50 39; --ivy-ink:150 224 182;
    --code-bg:31 34 38;
    --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:rgb(var(--canvas));color:rgb(var(--ink));font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:720px;margin:0 auto;padding:48px 20px 96px}
.paper{
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-paper);
  padding:52px 56px 60px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:26px;font-size:12.5px;color:rgb(var(--faint))}
.brand .dot{width:6px;height:6px;border-radius:50%;background:rgb(var(--ivy))}
h1.title{
  font-family:var(--font-serif);font-size:29px;line-height:1.35;font-weight:700;
  margin:0 0 10px;letter-spacing:-.01em;
}
.meta{font-size:12.5px;color:rgb(var(--faint));margin-bottom:30px}
.body{font-family:var(--font-serif);font-size:17.5px;line-height:1.95;word-break:break-word}
.body>*{margin-top:0;margin-bottom:0}
.body>*+*{margin-top:.62em}
.body h1,.body h2,.body h3,.body h4{font-weight:600;line-height:1.4;margin:.9em 0 .3em}
.body h1{font-size:1.5em}
.body h2{font-size:1.3em}
.body h3{font-size:1.12em}
.body p{margin:0}
.body ul,.body ol{padding-left:1.35em;margin:.3em 0}
.body li{margin:.24em 0}
.body li>ul,.body li>ol{margin:.12em 0 .1em;padding-left:1.1em}
.body li>ul li,.body li>ol li{margin:.16em 0;font-size:.97em}
.body li>ul li::marker{color:rgb(var(--faint)/.75)}
.body li::marker{color:rgb(var(--faint))}
.body blockquote{margin:.7em 0;padding:2px 0 2px 15px;border-left:2px solid rgb(var(--ivy) / .35);color:rgb(var(--ink-2))}
.body code{font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line))}
.body mark{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));padding:1px 3px;border-radius:4px}
.body mark.hl-yellow{background:#fdf0c5;color:#7a580c}
.body mark.hl-pink{background:#fce2e5;color:#9a2c3c}
.body mark.hl-blue{background:#dbeafa;color:#1c4e84}
.body mark.hl-purple{background:#ebe2f8;color:#5e3a94}
.body mark.hl-gray{background:#e9ecef;color:#474e55}
@media (prefers-color-scheme: dark){
  .body mark.hl-yellow{background:#4a3c14;color:#f5dc94}
  .body mark.hl-pink{background:#4a222c;color:#f4b9c3}
  .body mark.hl-blue{background:#1b3552;color:#b3d4f7}
  .body mark.hl-purple{background:#33254d;color:#d6bcfa}
  .body mark.hl-gray{background:#34383d;color:#d2d7dc}
}
.body pre{background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;padding:14px 16px;overflow-x:auto;margin:.9em 0}
.body pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.body hr{border:0;border-top:1px solid rgb(var(--line));margin:1.2em 0}
.body img{max-width:100%;border-radius:9px;display:block;margin:1em 0}
.body a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94em}
.body th,.body td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.body th{background:rgb(var(--sunken));font-weight:600}
.body .task{list-style:none;margin-left:-1.1em}
.body .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:38px;padding-top:18px;border-top:1px solid rgb(var(--line));
  font-size:12px;color:rgb(var(--faint));flex-wrap:wrap;
}
.foot a{color:rgb(var(--muted));text-decoration:none}
.foot a:hover{color:rgb(var(--ink))}
.copy{
  height:30px;padding:0 13px;border-radius:15px;border:0;cursor:pointer;
  background:rgb(var(--hover));color:rgb(var(--ink));font-size:12px;font-weight:600;font-family:inherit;
}
.copy:hover{background:rgb(var(--sunken))}
.state{text-align:center;padding:70px 10px;color:rgb(var(--faint));font-size:14px;line-height:2}
.state .big{font-family:var(--font-serif);font-size:19px;color:rgb(var(--muted));display:block;margin-bottom:6px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgb(var(--line));border-top-color:rgb(var(--ivy));display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .shell{padding:20px 12px 60px}
  .paper{padding:32px 22px 40px;border-radius:13px}
  h1.title{font-size:24px}
  .body{font-size:16.5px}
}

/* ===== 右侧悬浮大纲（与主应用同一套视觉：刻度 → 悬停滑出卡片） ===== */
.ol-zone{
  position:fixed;right:14px;top:50%;margin-top:-70px;z-index:40;
  width:32px;height:140px;display:none;
  flex-direction:column;align-items:flex-end;justify-content:center;gap:11px;
  padding:6px 0;cursor:pointer;
}
body.has-ol .ol-zone{display:flex}
.ol-zone i{display:block;width:18px;height:2px;border-radius:2px;background:rgb(var(--ink)/.26);transition:background .16s,width .16s}
.ol-zone:hover i{width:24px;background:rgb(var(--ink)/.5)}
.ol-card{
  position:fixed;right:16px;top:66px;z-index:41;
  width:210px;max-height:min(66vh,calc(100vh - 130px));
  display:flex;flex-direction:column;outline:none;
  padding:6px 8px 8px;border-radius:14px;
  background:rgb(var(--surface));
  box-shadow:0 10px 34px rgb(var(--ink)/.13),0 2px 8px rgb(var(--ink)/.07);
  opacity:0;transform:translateX(12px);pointer-events:none;
  transition:transform .26s cubic-bezier(.34,1.25,.64,1),opacity .16s;
}
/* 鼠标在右侧刻度上、或移进卡片后保持展开 */
.ol-zone:hover ~ .ol-card,
.ol-card:hover,
.ol-card.open{opacity:1;transform:none;pointer-events:auto}
.ol-head{
  flex:0 0 auto;padding:6px 8px 7px;
  font-size:11px;font-weight:700;letter-spacing:.09em;color:rgb(var(--faint));
}
.ol-list{position:relative;overflow-y:auto;overscroll-behavior:contain;padding:0 1px 2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.ol-list::-webkit-scrollbar{width:7px}
.ol-list::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.12);border-radius:7px;border:2px solid transparent;background-clip:content-box}
.ol-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:12.8px;line-height:1.55;color:rgb(var(--ink-2));
  padding:5px 8px;border-radius:7px;margin:0;
  transition:background .16s,color .16s,transform .2s,padding-left .2s;
}
.ol-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .dash{flex:0 0 auto;width:9px;height:1px;border-radius:1px;background:rgb(var(--ink)/.17);transition:width .18s,background .18s,height .18s}
.ol-card .ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:600;transform:translateX(3px)}
.ol-item.l1{font-weight:500;color:rgb(var(--ink))}
.ol-item.l2{padding-left:21px}
.ol-item.l3{padding-left:34px;font-size:12.3px}
.ol-item.l4{padding-left:47px;font-size:12.3px;color:rgb(var(--muted))}
/* 列表项（分支）：比标题轻一点，但仍要能读清 */
.ol-item.li{font-size:12.4px;color:rgb(var(--muted))}
.ol-item.li .dash{width:7px;background:rgb(var(--ink)/.12)}
.ol-item.li.on{color:rgb(var(--ink))}
.ol-item.on{color:rgb(var(--ink));font-weight:600}
.ol-item.on .dash{width:18px;height:1.5px;background:rgb(var(--ivy))}
/* 点大纲跳过去时，目标位置短暂铺一层灰底（飞书那种），一眼看到落在了哪 */
@keyframes jumpFlash{
  0%{background-color:rgb(var(--ink)/ .13);box-shadow:0 0 0 7px rgb(var(--ink)/ .13)}
  55%{background-color:rgb(var(--ink)/ .085);box-shadow:0 0 0 7px rgb(var(--ink)/ .085)}
  100%{background-color:transparent;box-shadow:0 0 0 7px transparent}
}
@keyframes jumpFlashDark{
  0%{background-color:rgb(255 255 255 / .12);box-shadow:0 0 0 7px rgb(255 255 255 / .12)}
  55%{background-color:rgb(255 255 255 / .08);box-shadow:0 0 0 7px rgb(255 255 255 / .08)}
  100%{background-color:transparent;box-shadow:0 0 0 7px transparent}
}
.jump-flash{animation:jumpFlash 1.6s ease-out forwards;border-radius:7px}
@media (prefers-color-scheme: dark){
  .jump-flash{animation-name:jumpFlashDark}
}
@media (max-width:900px){
  .ol-card{width:min(206px,62vw);right:8px;top:60px;max-height:min(64vh,calc(100vh - 140px))}
}
/* 宽屏：刻度和大纲卡片贴着正文右边缘，别漂在窗口最右边（正文最宽 680，半边 340）。
   窗口不够宽时退回贴右边缘，否则卡片会压住刻度、点到就闪 */
@media (min-width:1300px){
  .ol-zone{ left:calc(50% + 352px); right:auto }
  .ol-card{ left:calc(50% + 392px); right:auto }
}
@media (prefers-color-scheme: dark){
  .ol-card{box-shadow:0 10px 34px rgb(0 0 0/.5),0 2px 8px rgb(0 0 0/.35)}
}
/* 触屏没有 hover，只认点开的 .open。
   注意 tap 结束后元素会残留 :hover 状态，那条「悬停即展开」的规则特异性比 .ol-card.open 高，
   所以这里要用同样带兄弟组合器的写法把它压回去，否则点了也打不开 */
@media (hover:none){
  .ol-zone{width:30px}
  .ol-zone:hover ~ .ol-card,
  .ol-card:hover{opacity:0;transform:translateX(12px);pointer-events:none}
  .ol-zone:hover ~ .ol-card.open,
  .ol-card.open{opacity:1;transform:none;pointer-events:auto}
}


/* ===== 阅读模式切换：预览 / Markdown / 思维导图（被分享者自己选） ===== */
.modes{display:flex;gap:1px;padding:2px;border-radius:9px;background:rgb(var(--sunken));margin-left:6px;flex:0 0 auto}
.modes button{
  width:30px;height:26px;display:grid;place-items:center;border:0;border-radius:7px;background:none;cursor:pointer;
  color:rgb(var(--muted));transition:background .14s,color .14s;padding:0;
}
.modes button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.modes button:hover{color:rgb(var(--ink))}
.modes button.on{background:rgb(var(--surface));color:rgb(var(--ivy-ink));box-shadow:0 1px 2px rgb(16 24 32/.07)}
.pane[hidden]{display:none}
.md-bar{display:flex;justify-content:flex-end;margin-bottom:10px}
.src{
  font-family:var(--font-mono);font-size:12.8px;line-height:1.8;
  white-space:pre-wrap;word-break:break-word;margin:0;
  background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:11px;
  padding:16px 18px;max-height:72vh;overflow:auto;
}
body.mode-map .shell{max-width:1120px}
body.mode-map .ol-zone,body.mode-map .ol-card,
body.mode-src .ol-zone,body.mode-src .ol-card{display:none}
.mm-tools{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.mm-tools button{
  height:26px;min-width:30px;padding:0 9px;border:0;border-radius:7px;cursor:pointer;
  background:rgb(var(--sunken));color:rgb(var(--muted));font-family:inherit;font-size:12px;
}
.mm-tools button:hover{background:rgb(var(--hover));color:rgb(var(--ink))}
.mm-wrap{
  overflow:auto;border:.5px solid rgb(var(--line));border-radius:12px;
  background:rgb(var(--surface));padding:8px;max-height:min(74vh,760px);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.mm-wrap svg{display:block;margin:0 auto}
.mm-tip{margin-top:10px;font-size:12px;color:rgb(var(--faint));text-align:center}
@media (max-width:640px){
  .brand{font-size:12px}
  .modes button{width:28px;height:25px}
}

/* 长图预览浮层 */
.lp-ov{position:fixed;inset:0;z-index:142;background:rgb(16 24 32 / .48);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease}
.lp-ov.open{opacity:1;pointer-events:auto}
.lp-card{width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-paper);overflow:hidden;transform:translateY(8px);transition:transform .2s ease}
.lp-ov.open .lp-card{transform:none}
.lp-hd{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid rgb(var(--line))}
.lp-hd-t{flex:1;min-width:0}
.lp-hd h3{font-size:14.5px;font-weight:600;color:rgb(var(--ink));margin:0}
.lp-hd p{font-size:11.5px;color:rgb(var(--faint));margin:4px 0 0;line-height:1.6}
.lp-hd .help-x{width:26px;height:26px;border:0;border-radius:8px;background:rgb(var(--hover));color:rgb(var(--ink));font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.lp-body{flex:1;min-height:0;overflow:auto;background:rgb(var(--sunken));padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;overscroll-behavior:contain}
.lp-body img{max-width:100%;border-radius:10px;box-shadow:0 2px 12px rgb(16 24 32 / .14);display:block}
.lp-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid rgb(var(--line))}
.lp-btn{height:33px;padding:0 15px;border-radius:9px;border:0;cursor:pointer;background:rgb(var(--hover));font-size:12.5px;color:rgb(var(--ink-2));font-family:inherit}
.lp-btn.primary{background:rgb(var(--ivy));color:#fff}
.lp-btn:disabled{opacity:.6;cursor:default}

</style>
</head>
<body>
<div class="shell">
  <div class="paper" id="paper">
    <div class="state" id="state"><span class="spin"></span>正在打开笔记…</div>
  </div>
</div>
<!-- 右侧悬浮大纲：平时是一列细刻度，鼠标靠过去滑出卡片（触屏点一下切换） -->
<div class="ol-zone" id="olZone" role="button" tabindex="-1" aria-label="展开大纲"></div>
<aside class="ol-card" id="olCard" aria-label="大纲">
  <div class="ol-head">大纲</div>
  <nav class="ol-list" id="olList"></nav>
</aside>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,a) => '<a href="#">' + (a || t) + '</a>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=]+)==(?:\{(?:\.([a-z]+)|c:(#[0-9a-fA-F]{3,8}))\})?/g, (m,t,named,hex)=>{
    if(hex){
      const h = String(hex).replace('#','');
      const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
      const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
      return '<mark style="background:rgba('+r+','+g+','+b+',.24);color:color-mix(in srgb, '+hex+' 60%, CanvasText)">'+t+'</mark>';
    }
    const k = String(named||'').toLowerCase();
    const cls = ['yellow','pink','blue','purple','gray'].includes(k) ? ' class="hl-'+k+'"' : '';
    return '<mark'+cls+'>'+t+'</mark>';
  });
  return s;
}

/* 连续列表项按缩进拼成真正嵌套的 ul/ol（插进来的分支大纲才有层级） */
function sNestedList(items, ordered){
  if (!items.length) return '';
  const tag = ordered ? 'ol' : 'ul';
  let html = '', depth = -1;
  items.forEach(it => {
    // 一次最多往下走一层，跳级的缩进按下一层算，结构不会错
    const d = Math.max(0, Math.min(it.d || 0, 3, depth < 0 ? 0 : depth + 1));
    if (depth < 0) { html += '<' + tag + '><li' + it.attrs + '>' + it.inner; depth = d; return; }
    if (d === depth) { html += '</li><li' + it.attrs + '>' + it.inner; return; }
    if (d > depth) { html += '<' + tag + '><li' + it.attrs + '>' + it.inner; depth = d; return; }
    for (let k = depth; k > d; k--) html += '</li></' + tag + '>';
    html += '</li><li' + it.attrs + '>' + it.inner;
    depth = d;
  });
  for (let k = depth; k >= 0; k--) html += '</li></' + tag + '>';
  return html;
}

function mdToHtml(md){
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const lang = line.slice(3).trim();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') + '>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m) { const lv = m[1].length; out.push('<h' + lv + '>' + inlineMd(m[2]) + '</h' + lv + '>'); i++; continue; }
    if (/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote><p>' + buf.map(inlineMd).join('<br>') + '</p></blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = line; const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      out.push('<table><thead><tr>' + cells(head).map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + cells(r).map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      const stack = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        const rawLine = lines[i];
        const ind = (rawLine.match(/^\s*/)[0] || '').replace(/\t/g, '  ').length;
        let l = rawLine.replace(/^\s*([-*+]|\d+\.)\s+/, '');
        let attrs = '', inner = '';
        if (/^\[[ xX]\]\s/.test(l)) {
          const chk = /^\[[xX]\]/.test(l);
          l = l.replace(/^\[[ xX]\]\s/, '');
          attrs = ' class="task"';
          inner = '<input type="checkbox" disabled ' + (chk ? 'checked' : '') + '>' + inlineMd(l);
        } else {
          inner = inlineMd(l);
        }
        // 缩进栈：同级进栈、退回上一级出栈，得到这一项在第几层
        while (stack.length && ind <= stack[stack.length - 1]) stack.pop();
        if (!stack.length || ind > stack[stack.length - 1]) stack.push(ind);
        items.push({ d: Math.min(stack.length - 1, 3), attrs, inner });
        i++;
      }
      out.push(sNestedList(items, ordered));
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isSep(lines[i])) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + buf.map(inlineMd).join('<br>') + '</p>');
  }
  return out.join('\n');
}

function getSlug(){
  const q = new URLSearchParams(location.search);
  if (q.get('slug')) return q.get('slug');
  if (q.get('s')) return q.get('s');
  const m = location.pathname.match(/\/s\/([A-Za-z0-9]+)/);
  if (m) return m[1];
  const h = (location.hash || '').replace(/^#/, '');
  return /^[A-Za-z0-9]+$/.test(h) ? h : '';
}

function stamp(t){
  const d = new Date(t || Date.now());
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fail(msg){
  document.getElementById('paper').innerHTML =
    '<div class="state"><span class="big">' + esc(msg) + '</span>这个链接可能已经失效，或者作者取消了分享。</div>';
}

/* ===== 悬浮大纲 ===== */
const olTouch = () => matchMedia('(hover:none)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches);
const OL = { entries: [], items: [], offs: [], active: -1 };

/* 列表项只取它自己的文字，别把嵌套在里面的子列表也算进来 */
function olItemLabel(li){
  let s = '';
  for (const n of li.childNodes) {
    if (n.nodeType === 3) s += n.nodeValue;
    else if (n.nodeType === 1 && !/^(UL|OL)$/.test(n.tagName)) s += n.textContent;
  }
  return s.replace(/\s+/g, ' ').trim();
}
/* 大纲条目 = 所有标题 + 所有列表项（含嵌套），按正文顺序；层级最多铺到第四级 */
function collectEntries(){
  const bodyEl = document.querySelector('.body');
  if (!bodyEl) return [];
  const out = [];
  const heads = [...bodyEl.querySelectorAll('h1,h2,h3,h4,h5,h6')];
  let baseLv = 7;
  heads.forEach(h => { baseLv = Math.min(baseLv, +h.tagName[1]); });
  if (baseLv > 6) baseLv = 1;
  let headDepth = 1;
  const walkList = (list, parentDepth) => {
    const d = Math.min(4, parentDepth + 1);
    for (const li of [...list.children]) {
      if (li.tagName !== 'LI') continue;
      const label = olItemLabel(li);
      if (label) out.push({ el: li, label, depth: d, kind: 'li' });
      for (const c of [...li.children]) {
        if (c.tagName === 'UL' || c.tagName === 'OL') walkList(c, d);
      }
      if (out.length > 400) return;
    }
  };
  // 只从「最外层列表」开始走，嵌套列表交给递归，避免同一项进两次
  const topLists = host => [...host.querySelectorAll('ul,ol')]
    .filter(l => !l.parentElement || !l.parentElement.closest('ul,ol'));
  for (const el of [...bodyEl.children]) {
    if (/^H[1-6]$/.test(el.tagName)) {
      headDepth = Math.min(4, Math.max(1, +el.tagName[1] - baseLv + 1));
      const label = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (label) out.push({ el, label, depth: headDepth, kind: 'h' });
    } else if (el.tagName === 'UL' || el.tagName === 'OL') {
      walkList(el, headDepth);
    } else {
      topLists(el).forEach(l => walkList(l, headDepth));
    }
    if (out.length > 400) break;
  }
  return out;
}

function buildOutline(){
  const entries = collectEntries();
  // 只有一个条目时大纲没意义，入口也不出现
  if (entries.length < 2) return;
  const list = document.getElementById('olList');
  list.innerHTML = '';
  OL.entries = entries; OL.items = []; OL.active = -1;
  entries.forEach((e, i) => {
    if (!e.el.id) e.el.id = 'ol-' + i;
    e.el.style.scrollMarginTop = '28px';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ol-item l' + e.depth + (e.kind === 'li' ? ' li' : '');
    const t = document.createElement('span'); t.className = 't';
    t.textContent = e.label || '（无标题）';
    t.title = e.label || '';
    const d = document.createElement('span'); d.className = 'dash';
    b.append(t, d);
    b.addEventListener('click', () => {
      jumpTo(e.el);
      if (olTouch()) document.getElementById('olCard').classList.remove('open');
    });
    list.appendChild(b);
    OL.items.push(b);
  });
  // 右侧刻度条数量跟条目数走（3~6 条）
  const z = document.getElementById('olZone');
  const n = Math.max(3, Math.min(6, Math.ceil(entries.length / 2)));
  z.innerHTML = '';
  for (let i = 0; i < n; i++) z.appendChild(document.createElement('i'));
  document.body.classList.add('has-ol');
  refreshOffsets();
}

/* 条目在文档里的绝对位置：缓存下来，滚动时只比数字，不必逐条读布局 */
function refreshOffsets(){
  if (!OL.entries.length) return;
  OL.offs = OL.entries.map(e => {
    try { return e.el.getBoundingClientRect().top + window.scrollY; } catch (err) { return 0; }
  });
  OL.active = -1;
  updateActive();
}
let OLR_T = 0;
function olRefreshSoon(){
  if (OLR_T) return;
  OLR_T = setTimeout(() => { OLR_T = 0; refreshOffsets(); }, 140);
}
window.addEventListener('resize', olRefreshSoon, { passive: true });
window.addEventListener('load', olRefreshSoon);
try { document.fonts.ready.then(olRefreshSoon); } catch (e) {}

/* 跳过去之后闪一下目标：短暂灰底，和主应用一致 */
function flashJump(el){
  if (!el || !el.classList) return;
  el.classList.remove('jump-flash');
  void el.offsetWidth;                       // 强制重排，动画才会重放
  el.classList.add('jump-flash');
  clearTimeout(el._jfT);
  el._jfT = setTimeout(() => el.classList.remove('jump-flash'), 1700);
}

function jumpTo(el){
  const y = Math.max(0, el.getBoundingClientRect().top + window.scrollY - 28);
  flashJump(el);
  if (olTouch()) {
    // iOS Safari 在触摸事件里会静默丢弃 smooth，这里瞬时到位
    const de = document.documentElement;
    const prev = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, y);
    setTimeout(() => { de.style.scrollBehavior = prev; }, 60);
    return;
  }
  try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, y); }
}

function updateActive(){
  if (!OL.entries.length) return;
  if (OL.offs.length !== OL.entries.length) refreshOffsets();
  const y = window.scrollY + 150;
  let cur = 0;
  for (let i = 0; i < OL.offs.length; i++) { if (OL.offs[i] <= y) cur = i; }
  // 滚到底时选最后一条：末个条目可能永远到不了 150px 那条线
  // 但内容不满一屏（根本滚不动）时不能这么干，否则一打开就高亮最后一条
  const docH = document.documentElement.scrollHeight;
  if (docH > window.innerHeight + 40 && window.innerHeight + window.scrollY >= docH - 4) cur = OL.entries.length - 1;
  if (cur === OL.active) return;
  OL.active = cur;
  OL.items.forEach((b, i) => b.classList.toggle('on', i === cur));
  const card = document.getElementById('olCard');
  if (!card.classList.contains('open') && getComputedStyle(card).opacity === '0') return;
  const list = document.getElementById('olList'), b = OL.items[cur];
  if (!b) return;
  const lr = list.getBoundingClientRect(), br = b.getBoundingClientRect();
  if (br.top < lr.top) list.scrollTop -= (lr.top - br.top) + 6;
  else if (br.bottom > lr.bottom) list.scrollTop += (br.bottom - lr.bottom) + 6;
}

let olTick = 0;
window.addEventListener('scroll', () => {
  if (olTick) return;
  olTick = requestAnimationFrame(() => { olTick = 0; updateActive(); });
}, { passive: true });
// 触屏：点右侧刻度切换展开，点卡片外收起
document.getElementById('olZone').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('olCard').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  const card = document.getElementById('olCard');
  if (!card.classList.contains('open')) return;
  if (card.contains(e.target) || document.getElementById('olZone').contains(e.target)) return;
  card.classList.remove('open');
});

/* ===== 阅读模式：预览 / Markdown / 思维导图（被分享者自己切） ===== */
let TITLE = '', BODY = '';
const MAP = { built: false, root: null, W: 0, H: 0, k: 0, auto: true };
const M_NH = 28, M_VGAP = 12, M_HGAP = 52, M_PAD = 22;
/* 节点文字：13px 行高 18；一行最多 248px 就折行。
   宁可把节点撑高，也不让字跑出边界（以前是 42 字硬截断 + 宽度 260 封顶，中文直接溢出去） */
const M_LH = 18, M_TXT_MAX = 248, M_NW_MAX = 274, M_NW_MIN = 58, M_TXT_PAD = 30;
const M_FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
let _mCtx = null;
function mCtx(){
  if (!_mCtx) _mCtx = document.createElement('canvas').getContext('2d');
  _mCtx.font = '13px ' + M_FONT;
  return _mCtx;
}
function vv(name, fb){
  const t = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return t ? 'rgb(' + t.split(/[\s,]+/).filter(Boolean).join(',') + ')' : fb;
}
function mXml(t){
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/* 去掉行内 Markdown 记号，只留可读文字 */
function mClean(t){
  return String(t || '')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/~~(.*?)~~/g, '$1')
    .replace(/<[^>]+>/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
/* 按可用宽度折行：中文逐字断，英文尽量按词断，单个超长词才硬切 */
function mWrap(label, maxW){
  const ctx = mCtx();
  const s = String(label == null ? '' : label);
  if (!s) return [''];
  if (ctx.measureText(s).width <= maxW) return [s];
  const out = [];
  let line = '';
  const flush = () => { if (line) out.push(line.replace(/\s+$/, '')); line = ''; };
  const tokens = s.match(/[A-Za-z0-9]+[’'\-]?[A-Za-z0-9]*|\s+|[\s\S]/g) || [];
  for (const tk of tokens) {
    if (line && ctx.measureText(line + tk).width > maxW) {
      if (ctx.measureText(tk).width > maxW) {
        flush();
        for (const ch of tk) {
          if (line && ctx.measureText(line + ch).width > maxW) flush();
          line += ch;
        }
        continue;
      }
      flush();
      line = /^\s+$/.test(tk) ? '' : tk;
    } else {
      line += tk;
    }
  }
  flush();
  return out.length ? out : [s];
}
function buildMap(){
  const root = { label: TITLE || '未命名', text: '', depth: 0, children: [], w: 0, x: 0, y: 0 };
  const parents = [root], indents = [];
  let base = 0, minH = 0, firstHead = true, fence = false, count = 0;
  const lines = String(BODY || '').replace(/\r/g, '').split('\n');
  for (const raw of lines) {
    if (count > 400) break;
    if (/^\s*(```|~~~)/.test(raw)) { fence = !fence; continue; }
    if (fence) continue;
    if (!raw.trim()) continue;
    const h = raw.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (h) {
      const lv = Math.min(6, h[1].length);
      const label = mClean(h[2]);
      if (!label) continue;
      // 开头的一级标题如果就是笔记标题，别重复画一层
      if (firstHead && lv === 1 && label === mClean(TITLE)) {
        firstHead = false; parents.length = 1; base = 0; indents.length = 0; continue;
      }
      firstHead = false;
      if (!minH || lv < minH) minH = lv;
      const depth = Math.max(1, Math.min(lv - minH + 1, parents.length));
      const node = { label, text: '', depth, children: [], w: 0, x: 0, y: 0 };
      parents[depth - 1].children.push(node);
      parents.length = depth + 1;
      parents[depth] = node;
      base = depth;
      indents.length = 0;
      count++;
      continue;
    }
    const li = raw.match(/^(\s*)(?:[-*+]|\d{1,3}[.)])\s+(.+)$/);
    if (!li) continue;
    const indent = li[1].replace(/\t/g, '  ').length;
    const label = mClean(li[2].replace(/^\[[ xX]\]\s*/, ''));
    if (!label) continue;
    while (indents.length && indent < indents[indents.length - 1]) indents.pop();
    if (!indents.length || indent > indents[indents.length - 1]) indents.push(indent);
    const k = Math.min(indents.length, 8);
    const depth = Math.min(base + k, parents.length);
    const parent = parents[depth - 1] || parents[parents.length - 1] || root;
    const node = { label, text: '', depth, children: [], w: 0, x: 0, y: 0 };
    parent.children.push(node);
    parents.length = depth + 1;
    parents[depth] = node;
    count++;
  }
  // 量宽 + 排版（向右展开，和笔记里默认的逻辑图一致）
  const ctx = mCtx();
  const colW = [];
  let maxD = 0;
  (function walk(n, d) {
    // 先按宽度折行，行数决定节点高度：宽高都比文字大，字就永远在框内
    n.lines = mWrap(n.label, M_TXT_MAX);
    n.text = n.lines.join(' ');
    let tw = 0;
    for (const ln of n.lines) tw = Math.max(tw, ctx.measureText(ln).width);
    n.w = Math.max(d === 0 ? 104 : M_NW_MIN, Math.min(M_NW_MAX, Math.ceil(tw) + M_TXT_PAD));
    n.h = Math.max(M_NH, n.lines.length * M_LH + 10);
    colW[d] = Math.max(colW[d] || 0, n.w);
    maxD = Math.max(maxD, d);
    n.children.forEach(c => walk(c, d + 1));
  })(root, 0);
  const xs = [M_PAD];
  for (let d = 1; d <= maxD; d++) xs[d] = xs[d - 1] + colW[d - 1] + M_HGAP;
  let cursor = M_PAD;
  (function place(n) {
    n.x = xs[n.depth];
    const nh = n.h || M_NH;
    if (!n.children.length) { n.y = cursor + nh / 2; cursor += nh + M_VGAP; return; }
    const start = cursor;
    n.children.forEach(place);
    n.y = (start + cursor - M_VGAP) / 2;
  })(root);
  MAP.root = root;
  MAP.W = xs[maxD] + colW[maxD] + M_PAD;
  MAP.H = Math.max(cursor - M_VGAP, M_NH) + M_PAD;
}
function mmSvg(){
  const root = MAP.root, W = MAP.W, H = MAP.H;
  const c = {
    bg: vv('--surface', '#fff'), line: vv('--line', '#e6e9ec'),
    ink: vv('--ink', '#1c1f22'), ivy: vv('--ivy', '#287a52'),
    soft: vv('--ivy-soft', '#e5f3eb'), softInk: vv('--ivy-ink', '#1b5c3c')
  };
  const out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">'];
  out.push('<rect width="' + W + '" height="' + H + '" fill="' + c.bg + '"/>');
  (function links(n) {
    n.children.forEach(k => {
      const x1 = n.x + n.w, y1 = n.y, x2 = k.x, y2 = k.y, dx = Math.max(18, (x2 - x1) * 0.45);
      // 连线保持极简：主干略深，往里走的一条淡细线
      const stroke = n.depth === 0 ? c.ivy : c.ink;
      const op = n.depth === 0 ? '.45' : '.14';
      out.push('<path d="M' + x1 + ' ' + y1 + 'C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2
        + '" fill="none" stroke="' + stroke + '" stroke-opacity="' + op + '" stroke-width="1.2"/>');
      links(k);
    });
  })(root);
  // 节点：保留原来的圆角框，框高跟着行数走——文字一律折行放框内，不再溢出
  (function nodes(n) {
    const h = n.h || M_NH;
    const top = n.y - h / 2;
    const lines = (n.lines && n.lines.length) ? n.lines : [n.text || n.label || ''];
    const tTop = n.y - (lines.length - 1) * M_LH / 2;
    const tx = n.x + 13;
    const fill = n.depth === 0 ? c.ivy : (n.depth === 1 ? c.soft : c.bg);
    const txt = n.depth === 0 ? '#ffffff' : (n.depth === 1 ? c.softInk : c.ink);
    const spans = lines.map((ln, i) =>
      '<tspan x="' + tx + '"' + (i ? ' dy="' + M_LH + '"' : '') + '>' + mXml(ln) + '</tspan>').join('');
    out.push('<g><title>' + mXml(n.label) + '</title>');
    out.push('<rect x="' + n.x + '" y="' + top + '" width="' + n.w + '" height="' + h + '" rx="8" fill="' + fill + '"'
      + (n.depth >= 2 ? ' stroke="' + c.line + '" stroke-width="1"' : '') + '/>');
    out.push('<text x="' + tx + '" y="' + tTop + '" dy="0.34em" font-family="' + M_FONT
      + '" font-size="13" font-weight="' + (n.depth === 0 ? 600 : 400) + '" fill="' + txt + '">' + spans + '</text>');
    out.push('</g>');
    n.children.forEach(nodes);
  })(root);
  out.push('</svg>');
  return out.join('');
}
function paintMap(){
  const wrap = document.getElementById('mmWrap');
  if (!wrap) return;
  if (!MAP.built) { buildMap(); MAP.built = true; }
  if (!MAP.root) return;
  const cw = Math.max(280, wrap.clientWidth - 18);
  if (MAP.auto) MAP.k = Math.min(1, cw / MAP.W);
  if (!MAP.k) MAP.k = 1;
  MAP.k = Math.max(0.35, Math.min(2.2, MAP.k));
  wrap.innerHTML = mmSvg();
  const svg = wrap.querySelector('svg');
  if (svg) {
    svg.setAttribute('width', Math.round(MAP.W * MAP.k));
    svg.setAttribute('height', Math.round(MAP.H * MAP.k));
  }
}
function setMode(m){
  const panes = { preview: 'panePreview', src: 'paneSrc', map: 'paneMap' };
  if (!panes[m]) m = 'preview';
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  Object.keys(panes).forEach(k => {
    const el = document.getElementById(panes[k]);
    if (el) el.hidden = k !== m;
  });
  document.body.classList.toggle('mode-map', m === 'map');
  document.body.classList.toggle('mode-src', m === 'src');
  document.body.dataset.mode = m;
  if (m === 'src') {
    const box = document.getElementById('srcBox');
    if (box && !box.textContent) box.textContent = (BODY || '').trim() ? BODY : '（这篇笔记没有正文）';
  }
  if (m === 'map') paintMap();
  if (m !== 'preview') {
    const card = document.getElementById('olCard');
    if (card) card.classList.remove('open');
  }
  try { localStorage.setItem('share.view', m); } catch (e) {}   // 记住这位读者上次看的模式
}
window.addEventListener('resize', () => {
  if (document.body.dataset.mode !== 'map') return;
  if (MAP.auto) { MAP.k = 0; paintMap(); }
});
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (document.body.dataset.mode === 'map') paintMap();
  });
} catch (e) {}
// 字体真正加载完后字宽会变：重新量一次再画，免得折行位置按估算走
try {
  document.fonts.ready.then(() => {
    if (document.body.dataset.mode === 'map') {
      MAP.built = false;
      if (MAP.auto) MAP.k = 0;
      paintMap();
    }
    if (OL.entries.length) refreshOffsets();
  });
} catch (e) {}

/* ===== 长图导出（与主站同一套 canvas 排版，分享页自带依赖 shim） ===== */
function resolvedTheme(){ try{ return document.documentElement.dataset.theme === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }catch(e){ return 'light'; } }
function dateStamp(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function countWords(md){
  const t = String(md || '')
    .replace(/!\[[^\]]*\]\(data:[^)]*\)/g, '')
    .replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\-\|\[\]()!]/g,'').replace(/\s+/g,'');
  return t.length;
}
function toast(msg){
  let el=document.getElementById('lpToast');
  if(!el){ el=document.createElement('div'); el.id='lpToast';
    el.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;padding:9px 16px;border-radius:20px;background:rgb(var(--ink)/.88);color:rgb(var(--surface));font:12px var(--font-sans);pointer-events:none;opacity:0;transition:opacity .18s';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity='0'; },2200);
}
/* ========== 导出为长图（PNG） ==========
   不用截图库：自己拿 canvas 2D 排一遍版，iOS Safari 也能出图、不会被跨域图片污染。
   支持：标题 1–6、段落、有序 / 无序 / 嵌套列表、勾选框、引用、代码块、表格、分割线、
   本站上传的图片（data: 内嵌）；行内加粗 / 斜体 / 代码 / 高亮 / 链接 / 删除线 / 待办时间胶囊。
   太长的笔记自动按段落边界切成几张，文件名带 -1 / -2。 */
const LP_W = 750, LP_PAD = 52, LP_MAX_H = 9000, LP_MAX_AREA = 16.7e6;
const LP_SERIF = '"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif';
const LP_MONO = '"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC",monospace';
const LP_CV = document.createElement('canvas');
const LP_C = LP_CV.getContext('2d');

function lpPal(){
  return resolvedTheme() === 'dark'
    ? { bg:'#191b1e', ink:'#e8ebee', ink2:'#c3c8cd', muted:'#98a0a6', faint:'#70767c',
        line:'#2e3338', code:'#23272b', codeInk:'#dfe3e7', ivy:'#56b482', chip:'#22382c', quote:'#3b444b' }
    : { bg:'#ffffff', ink:'#1c1f22', ink2:'#3f444a', muted:'#6b7177', faint:'#9aa0a6',
        line:'#e6e9ec', code:'#f4f6f8', codeInk:'#33383d', ivy:'#287a52', chip:'#eef4f0', quote:'#cbd8d1' };
}
function lpFont(size, bold, mono, italic){
  return (italic ? 'italic ' : '') + (bold ? 700 : 400) + ' ' + size + 'px ' + (mono ? LP_MONO : LP_SERIF);
}
function lpRR(c, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr, y);
  c.arcTo(x+w, y, x+w, y+h, rr);
  c.arcTo(x+w, y+h, x, y+h, rr);
  c.arcTo(x, y+h, x, y, rr);
  c.arcTo(x, y, x+w, y, rr);
  c.closePath();
}
/* DOM → 行内片段（加粗 / 代码 / 高亮 / 链接 / 时间胶囊…） */
function lpRuns(node){
  const out = [];
  (function walk(el, st){
    el.childNodes.forEach(k=>{
      if(k.nodeType === 3){
        const t = k.nodeValue.replace(/\u00a0/g, ' ');
        if(t) out.push(Object.assign({}, st, {text:t}));
        return;
      }
      if(k.nodeType !== 1) return;
      const tag = k.tagName.toLowerCase();
      if(tag === 'svg' || tag === 'input' || tag === 'button' || tag === 'img') return;
      if(tag === 'br'){ out.push(Object.assign({}, st, {text:'\n'})); return; }
      if(k.classList && k.classList.contains('due-chip')){
        const label = (k.textContent || '').replace(/\s+/g, ' ').trim();
        if(label) out.push(Object.assign({}, st, {chip:true, text:label}));
        return;
      }
      const ns = Object.assign({}, st);
      if(tag === 'b' || tag === 'strong') ns.bold = true;
      if(tag === 'i' || tag === 'em') ns.italic = true;
      if(tag === 'del' || tag === 's') ns.strike = true;
      if(tag === 'code') ns.code = true;
      if(tag === 'a') ns.link = true;
      if(tag === 'mark') ns.mark = (k.className || '').replace('hl-', '') || 'green';
      walk(k, ns);
    });
  })(node, {});
  return out;
}
/* 断行用的最小单位：拉丁词整块、中文按字、空格可吞 */
function lpTokens(runs){
  const out = [];
  runs.forEach(r=>{
    if(r.chip){ out.push(Object.assign({}, r)); return; }
    if(r.text === '\n'){ out.push(Object.assign({}, r, {br:true, text:''})); return; }
    String(r.text).split(/(\s+)/).forEach(part=>{
      if(!part) return;
      if(/^\s+$/.test(part)){ out.push(Object.assign({}, r, {text:' ', space:true})); return; }
      (part.match(/[A-Za-z0-9@#_.\/%:+\-]+|[\s\S]/g) || []).forEach(s=>{
        out.push(Object.assign({}, r, {text:s}));
      });
    });
  });
  return out;
}
function lpW(tok, size){
  if(tok.chip){
    LP_C.font = '500 12.5px ' + LP_SERIF;
    return LP_C.measureText(tok.text).width + 16;
  }
  const s = tok.code ? size * 0.9 : size;
  LP_C.font = lpFont(s, tok.bold, tok.code, tok.italic);
  return LP_C.measureText(tok.text).width;
}
function lpWrap(toks, maxW, size){
  const lines = [];
  let cur = {items:[], w:0};
  toks.forEach(t=>{
    if(t.br){ if(cur.items.length) lines.push(cur); cur = {items:[], w:0}; return; }
    if(t.space && !cur.items.length) return;
    const w = lpW(t, size);
    if(cur.w + w > maxW && cur.items.length){
      lines.push(cur); cur = {items:[], w:0};
      if(t.space) return;
    }
    cur.items.push({tok:t, w:w});
    cur.w += w;
  });
  if(cur.items.length) lines.push(cur);
  return lines;
}
function lpPalMark(kind, pal){
  if(kind === 'yellow') return ['#fdf0c5', '#7a580c'];
  if(kind === 'pink')   return ['#fce2e5', '#9a2c3c'];
  if(kind === 'blue')   return ['#dbeafa', '#1c4e84'];
  if(kind === 'purple') return ['#ebe2f8', '#5e3a94'];
  if(kind === 'gray')   return ['#e9ecef', '#474e55'];
  if(kind === 'none')   return [null, pal.ink];
  return [pal.ivySoft, pal.ivy];
}
function lpDrawLine(c, line, x, baseline, size, pal, color, strikeAll){
  let cx = x;
  line.items.forEach(it=>{
    const t = it.tok;
    if(t.chip){
      const h = 21;
      c.fillStyle = pal.chip;
      lpRR(c, cx, baseline - 15.5, it.w, h, 10.5); c.fill();
      c.font = '500 12.5px ' + LP_SERIF;
      c.fillStyle = pal.ivy;
      c.textBaseline = 'alphabetic';
      c.fillText(t.text, cx + 8, baseline - 1.5);
      cx += it.w;
      return;
    }
    const s = t.code ? size * 0.9 : size;
    c.font = lpFont(s, t.bold, t.code, t.italic);
    if(t.mark){
      const mc = lpPalMark(t.mark, pal);
      if(mc[0]){ c.fillStyle = mc[0]; lpRR(c, cx - 2, baseline - size * 0.95, it.w + 4, size * 1.28, 3); c.fill(); }
    } else if(t.code){
      c.fillStyle = pal.code;
      lpRR(c, cx - 3, baseline - size * 0.92, it.w + 6, size * 1.26, 4); c.fill();
    }
    let col = pal.ink;
    if(t.link) col = pal.ivy;
    else if(t.code) col = pal.codeInk;
    else if(t.mark){ const mc = lpPalMark(t.mark, pal); if(mc[1]) col = mc[1]; }
    if(color) col = color;
    c.fillStyle = col;
    c.fillText(t.text, cx, baseline);
    if(t.link){
      c.strokeStyle = col; c.globalAlpha = .5; c.lineWidth = 1;
      c.beginPath(); c.moveTo(cx, baseline + 2.5); c.lineTo(cx + it.w, baseline + 2.5); c.stroke();
      c.globalAlpha = 1;
    }
    if(t.strike || strikeAll){
      c.strokeStyle = col; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(cx, baseline - size * 0.3); c.lineTo(cx + it.w, baseline - size * 0.3); c.stroke();
    }
    cx += it.w;
  });
}
/* 预加载内嵌图片：只有 data: 的才画，远程图会污染 canvas 导致导出失败 */
function lpPreload(host){
  const list = [...host.querySelectorAll('img')];
  return Promise.all(list.map(im=>new Promise(res=>{
    const src = im.getAttribute('src') || '';
    const out = {src:src, img:null};
    // 图床图片也要画进长图：data: 直接读，http(s) 走 CORS（R2 桶已放行本站域名）
    if(!/^(data:image\/|https?:\/\/)/i.test(src)){ res(out); return; }
    const el = new Image();
    if(!/^data:/i.test(src)) el.crossOrigin = 'anonymous';
    el.onload = ()=>{ out.img = el; res(out); };
    el.onerror = ()=>res(out);
    el.src = src;
  }))).then(arr=>{
    const map = new Map();
    arr.forEach(o=>map.set(o.src, o.img));
    return map;
  });
}
/* 排版：算出每个绘制块的位置，返回 ops（带 y）+ 总高 + 段落断点 */
function lpLayout(host, note, imgMap){
  const pal = lpPal();
  const W = LP_W, PAD = LP_PAD, innerW = W - PAD * 2;
  const ops = [], marks = [];
  let y = PAD;
  // 注意：绘制闭包会在排版全部算完之后才执行，所以每个闭包里只能用 const 捕获的坐标，
  // 不能直接引用会继续变化的 y（否则会画到最后一行去）
  const push = (fn, at)=>ops.push({y:at, fn:fn});

  // ---- 标题 ----
  {
    const size = 31;
    const lines = lpWrap(lpTokens([{text:note.title || '无标题', bold:true}]), innerW, size);
    lines.forEach(ln=>{
      const top = y, base = top + size;
      push(c=>{
        c.textBaseline = 'alphabetic';
        lpDrawLine(c, ln, PAD, base, size, pal, pal.ink);
      }, top);
      y += size * 1.4;
    });
  }
  // ---- 日期 / 字数 ----
  {
    const d = new Date(note.updatedAt || note.createdAt || Date.now());
    const stamp = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
    const meta = stamp + '　·　' + countWords(note.body || '') + ' 字';
    const top = y + 6, base = top + 15;
    push(c=>{
      c.font = lpFont(13.5, false); c.fillStyle = pal.faint; c.textBaseline = 'alphabetic';
      c.fillText(meta, PAD, base);
    }, top);
    y = top + 22;
  }
  // ---- 分隔线 ----
  {
    const top = y;
    push(c=>{
      c.strokeStyle = pal.line; c.lineWidth = 1;
      c.beginPath(); c.moveTo(PAD, top + 0.5); c.lineTo(W - PAD, top + 0.5); c.stroke();
    }, top);
    y += 30;
  }

  const flowText = (runs, opt)=>{
    const size = opt.size || 17;
    const lh = (opt.lh || 1.82) * size;
    const maxW = innerW - (opt.indent || 0);
    const x = PAD + (opt.indent || 0);
    if(opt.mt) y += opt.mt;
    if(opt.bold) runs = runs.map(r=>Object.assign({}, r, {bold:true}));
    const lines = lpWrap(lpTokens(runs), maxW, size);
    if(!lines.length){ y += lh * 0.4 + (opt.mb || 0); return; }
    marks.push(y);
    lines.forEach(ln=>{
      const top = y, base = top + size * 1.12;
      push(c=>{
        c.textBaseline = 'alphabetic';
        lpDrawLine(c, ln, x, base, size, pal, opt.color);
      }, top);
      y += lh;
    });
    if(opt.mb) y += opt.mb;
  };

  const addList = (listEl, depth)=>{
    const ordered = listEl.tagName.toLowerCase() === 'ol';
    let idx = 0;
    [...listEl.children].forEach(li=>{
      if(li.tagName.toLowerCase() !== 'li') return;
      idx++;
      const isTask = li.classList.contains('task');
      const box = isTask ? li.querySelector('input[type=checkbox]') : null;
      const done = !!(box && box.checked);
      const indent = 24 + depth * 26;
      const markW = isTask ? 26 : 24;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
      const runs = lpRuns(clone);
      const size = 17, lh = size * 1.78;
      const firstTop = y;
      y += 3;
      const baseY = y + 24;              // 首行基线
      // 勾选框 / 列表符号
      if(isTask){
        const bx = PAD + depth * 26, by = y + 5;
        push(c=>{
          if(done){
            c.fillStyle = pal.ivy; lpRR(c, bx, by, 15, 15, 4.5); c.fill();
            c.strokeStyle = (resolvedTheme() === 'dark' ? '#0f1a13' : '#ffffff');
            c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round';
            c.beginPath();
            c.moveTo(bx + 3.9, by + 7.9); c.lineTo(bx + 6.5, by + 10.5); c.lineTo(bx + 11.1, by + 5);
            c.stroke();
          }else{
            c.strokeStyle = pal.faint; c.lineWidth = 1.5;
            lpRR(c, bx + .75, by + .75, 13.5, 13.5, 4); c.stroke();
          }
        }, y);
      }else if((clone.textContent || '').trim()){
        const lx = PAD + depth * 26;
        const label = ordered ? (idx + '.') : '•';
        push(c=>{
          c.textBaseline = 'alphabetic';
          if(ordered){
            c.font = lpFont(15, false); c.fillStyle = pal.faint; c.textAlign = 'right';
            c.fillText(label, lx + 18, baseY);
            c.textAlign = 'left';
          }else{
            c.font = lpFont(17, false); c.fillStyle = pal.faint;
            c.fillText(label, lx + 5, baseY);
          }
        }, y);
      }
      const lines = lpWrap(lpTokens(runs), innerW - indent - markW, size);
      lines.forEach(ln=>{
        const base = y + 24;
        push(c=>{
          c.textBaseline = 'alphabetic';
          lpDrawLine(c, ln, PAD + indent + markW, base, size, pal, done ? pal.muted : pal.ink, done);
        }, y);
        y += lh;
      });
      y += 5;
      [...li.children].forEach(sub=>{
        const t = sub.tagName.toLowerCase();
        if(t === 'ul' || t === 'ol') addList(sub, depth + 1);
      });
      marks.push(firstTop);
    });
    y += 8;
  };

  const addTable = (tbl)=>{
    const rows = [...tbl.querySelectorAll('tr')];
    if(!rows.length) return;
    const ncol = Math.max(1, ...rows.map(r=>r.children.length));
    const colW = innerW / ncol, cs = 14.5, lh = cs * 1.58, cpad = 10;
    const grid = rows.map(r=>[...r.children].map(td=>{
      const bold = td.tagName.toLowerCase() === 'th';
      return {bold:bold, lines:lpWrap(lpTokens(lpRuns(td)), colW - cpad * 2, cs)};
    }));
    marks.push(y);
    y += 8;
    const top = y;
    const boxes = [];
    grid.forEach((row, ri)=>{
      const nlines = Math.max(1, ...row.map(c=>c.lines.length));
      const h = nlines * lh + cpad * 2;
      const rowTop = y;
      if(ri === 0){
        push(c=>{ c.fillStyle = pal.code; c.fillRect(PAD, rowTop, innerW, h); }, rowTop);
      }
      row.forEach((cell, ci)=>{
        const cx = PAD + ci * colW;
        cell.lines.forEach((ln, li)=>{
          const base = rowTop + cpad + lh * 0.78 + li * lh;
          push(c=>{
            c.textBaseline = 'alphabetic';
            lpDrawLine(c, ln, cx + cpad, base, cs, pal, cell.bold ? pal.ink : pal.ink2);
          }, rowTop);
        });
      });
      boxes.push([rowTop, h]);
      y += h;
    });
    // 最后统一画格线，避免压在文字上（bottom 必须固定下来，闭包执行时 y 已经跑到页脚了）
    const bottom = y;
    push(c=>{
      c.strokeStyle = pal.line; c.lineWidth = 1;
      for(let ci = 0; ci <= ncol; ci++){
        const cx = PAD + ci * colW;
        c.beginPath(); c.moveTo(cx + .5, top); c.lineTo(cx + .5, bottom); c.stroke();
      }
      boxes.forEach(([rt, h])=>{
        c.beginPath(); c.moveTo(PAD, rt + .5); c.lineTo(PAD + innerW, rt + .5); c.stroke();
        c.beginPath(); c.moveTo(PAD, rt + h - .5); c.lineTo(PAD + innerW, rt + h - .5); c.stroke();
      });
    }, top);
    y += 18;
  };

  const addImage = (im)=>{
    const src = im.getAttribute('src') || '';
    const el = imgMap.get(src);
    marks.push(y);
    y += 8;
    const top = y;
    if(el && el.naturalWidth){
      const w = Math.min(innerW, el.naturalWidth);
      const h = el.naturalHeight * (w / el.naturalWidth);
      push(c=>{
        c.save(); lpRR(c, PAD, top, w, h, 10); c.clip();
        c.drawImage(el, PAD, top, w, h); c.restore();
      }, top);
      y += h + 16;
    }else{
      push(c=>{
        c.fillStyle = pal.code; lpRR(c, PAD, top, innerW, 56, 10); c.fill();
        c.font = '400 13px ' + LP_MONO; c.fillStyle = pal.faint; c.textBaseline = 'alphabetic';
        c.fillText('图片（长图里省略）', PAD + 18, top + 33);
      }, top);
      y += 56 + 16;
    }
  };

  [...host.children].forEach(el=>{
    const tag = el.tagName.toLowerCase();
    if(el.classList.contains('md-blank')) return;
    if(/^h[1-6]$/.test(tag)){
      const lv = +tag[1];
      const size = lv === 1 ? 27 : lv === 2 ? 22 : lv === 3 ? 19 : 17;
      flowText(lpRuns(el), {size:size, lh:lv <= 2 ? 1.45 : 1.5, mt:lv === 1 ? 26 : 20, mb:8, color:pal.ink, bold:true});
      return;
    }
    if(tag === 'p'){
      const only = el.querySelector('img');
      if(only && !(el.textContent || '').trim()){ addImage(only); return; }
      flowText(lpRuns(el), {size:17, lh:1.86, mb:14});
      return;
    }
    if(tag === 'ul' || tag === 'ol'){ addList(el, 0); return; }
    if(tag === 'blockquote'){
      const top = y;
      y += 12;
      const inner = [...el.children].find(x=>x.tagName.toLowerCase() === 'p') || el;
      const lines = lpWrap(lpTokens(lpRuns(inner)), innerW - 36, 16.5);
      const bodyTop = y;
      lines.forEach(ln=>{
        const base = y + 22;
        push(c=>{ c.textBaseline = 'alphabetic'; lpDrawLine(c, ln, PAD + 20, base, 16.5, pal, pal.muted); }, y);
        y += 16.5 * 1.8;
      });
      const barH = Math.max(18, y - bodyTop - 2);
      push(c=>{
        c.fillStyle = pal.quote; lpRR(c, PAD + 3, bodyTop - 4, 3, barH, 2); c.fill();
      }, top);
      y += 16;
      return;
    }
    if(tag === 'pre'){
      const code = el.querySelector('code') || el;
      const text = (code.textContent || '').replace(/\t/g, '  ').replace(/\s+$/, '');
      const cs = 13.5, lh = cs * 1.68, cpad = 15;
      const lines = [];
      LP_C.font = '400 ' + cs + 'px ' + LP_MONO;
      text.split('\n').forEach(raw=>{
        if(!raw){ lines.push(''); return; }
        let rest = raw;
        while(rest.length){
          let cut = rest.length;
          while(cut > 1 && LP_C.measureText(rest.slice(0, cut)).width > innerW - cpad * 2) cut--;
          lines.push(rest.slice(0, cut));
          rest = rest.slice(cut);
        }
      });
      const h = Math.max(1, lines.length) * lh + cpad * 2;
      marks.push(y);
      y += 12;
      const top = y;
      push(c=>{ c.fillStyle = pal.code; lpRR(c, PAD, top, innerW, h, 10); c.fill(); }, top);
      lines.forEach((ln, i)=>{
        const base = top + cpad + lh * 0.78 + i * lh;
        push(c=>{
          c.font = '400 ' + cs + 'px ' + LP_MONO; c.fillStyle = pal.codeInk; c.textBaseline = 'alphabetic';
          c.fillText(ln, PAD + cpad, base);
        }, top);
      });
      y += h + 18;
      return;
    }
    if(tag === 'table'){ addTable(el); return; }
    if(tag === 'hr'){
      const top = y;
      marks.push(y);
      push(c=>{
        c.strokeStyle = pal.line; c.lineWidth = 1;
        c.beginPath(); c.moveTo(PAD + 1, top + 12.5); c.lineTo(PAD + innerW - 1, top + 12.5); c.stroke();
      }, top);
      y += 26;
      return;
    }
    if(tag === 'img'){ addImage(el); return; }
    flowText(lpRuns(el), {size:17, lh:1.86, mb:14});
  });

  // 页脚（品牌水印）已去掉：长图里只保留笔记正文
  y += PAD;

  return {ops:ops, height:y, marks:marks, pal:pal};
}

/* 按段落断点切片，太长的笔记分成几张，避免撞到浏览器的 canvas 上限 */
function lpSlices(height, marks){
  if(height <= LP_MAX_H) return [[0, height]];
  const cuts = marks.filter(v=>v > 0).sort((a,b)=>a-b);
  const out = [];
  let s = 0;
  while(s < height){
    let e = Math.min(height, s + LP_MAX_H);
    if(e < height){
      const cand = cuts.filter(v=>v > s + 300 && v <= e);
      if(cand.length) e = cand[cand.length-1];
    }
    out.push([s, e]);
    s = e;
  }
  return out;
}
function lpBuildCanvas(L, a, b, scale){
  const w = LP_W, h = b - a;
  if(!scale){
    scale = Math.min(2, Math.sqrt(LP_MAX_AREA / (w * h)), 16000 / h);
    scale = Math.max(1, Math.min(2, scale));
  }
  const topPad = a > 0 ? 26 : 0;      // 切片时给下一张留点顶部呼吸位，别顶着边开始
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * scale);
  cv.height = Math.round((h + topPad) * scale);
  const c = cv.getContext('2d');
  c.scale(scale, scale);
  c.fillStyle = L.pal.bg;
  c.fillRect(0, 0, w, h + topPad);
  c.translate(0, -a + topPad);
  L.ops.forEach(op=>{ if(op.y >= a - 4 && op.y <= b + 4) op.fn(c); });
  return cv;
}
async function lpRender(note){
  const host = document.createElement('div');
  const _md = mdToHtml(note.body || '');
  host.innerHTML = typeof _md === 'string' ? _md : ((_md && _md.html) || '');
  const imgMap = await lpPreload(host);
  const L = lpLayout(host, note, imgMap);
  const slices = lpSlices(L.height, L.marks);
  // 多张时统一用同一个缩放，几张拼起来宽度才一致
  const maxH = Math.max(...slices.map(s=>s[1] - s[0]));
  let scale = Math.min(2, Math.sqrt(LP_MAX_AREA / (LP_W * maxH)), 16000 / maxH);
  scale = Math.max(1, Math.min(2, scale));
  const canvases = slices.map(s=>lpBuildCanvas(L, s[0], s[1], scale));
  return {canvases:canvases, title:note.title || '无标题'};
}
function lpSave(res){
  const base = (res.title || '无标题').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim() || '无标题';
  const multi = res.canvases.length > 1;
  res.canvases.forEach((cv, i)=>{
    cv.toBlob(b=>{
      if(!b){ toast('图片生成失败，换浏览器再试'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = base + ' ' + dateStamp() + (multi ? '-' + (i+1) : '') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    }, 'image/png');
  });
  toast(multi ? ('已保存 ' + res.canvases.length + ' 张长图') : '长图已保存');
}
function lpShow(res){
  let ov = document.getElementById('lpOv');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'lpOv'; ov.className = 'lp-ov';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="lp-card" role="dialog" aria-label="导出长图">
      <div class="lp-hd">
        <div class="lp-hd-t">
          <h3>长图预览${res.canvases.length > 1 ? '（' + res.canvases.length + ' 张）' : ''}</h3>
          <p>手机上长按图片可以存到相册</p>
        </div>
        <button class="help-x" id="lpClose" title="关闭">×</button>
      </div>
      <div class="lp-body" id="lpBody"></div>
      <div class="lp-foot">
        <button class="lp-btn" id="lpCancel">关闭</button>
        <button class="lp-btn primary" id="lpSave">保存图片</button>
      </div>
    </div>`;
  const body = ov.querySelector('#lpBody');
  body.innerHTML = '';
  res.canvases.forEach(cv=>{
    const im = document.createElement('img');
    im.src = cv.toDataURL('image/png');
    im.alt = '长图';
    body.appendChild(im);
  });
  ov.classList.add('open');
  const close = ()=>ov.classList.remove('open');
  ov.querySelector('#lpClose').onclick = close;
  ov.querySelector('#lpCancel').onclick = close;
  ov.querySelector('#lpSave').onclick = ()=>{ lpSave(res); };
  ov.onclick = e=>{ if(e.target === ov) close(); };
}

async function boot(){
  const slug = getSlug();
  if (!slug) return fail('链接不完整');
  try {
    const r = await fetch('/api/share?slug=' + encodeURIComponent(slug), { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok) return fail(d.error || '打不开这篇笔记');
    document.title = (d.title || '分享的笔记') + ' · 随手笔记';
    TITLE = d.title || '无标题';
    BODY = d.body || '';
    document.getElementById('paper').innerHTML = `
      <div class="brand"><span class="dot"></span>公开分享 · 只读
        <div class="modes" id="modes" role="tablist" aria-label="阅读模式">
          <button type="button" data-mode="preview" class="on" role="tab" title="预览" aria-label="预览">
            <svg viewBox="0 0 24 24"><path d="M1.8 12S5.6 5.5 12 5.5 22.2 12 22.2 12 18.4 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/></svg>
          </button>
          <button type="button" data-mode="src" role="tab" title="Markdown 源码" aria-label="Markdown">
            <svg viewBox="0 0 24 24"><path d="m9 7-5 5 5 5"/><path d="m15 7 5 5-5 5"/></svg>
          </button>
          <button type="button" data-mode="map" role="tab" title="思维导图" aria-label="思维导图">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="9.5" width="5.5" height="5" rx="1.6"/><rect x="16" y="3" width="5.5" height="5" rx="1.6"/><rect x="16" y="16" width="5.5" height="5" rx="1.6"/><path d="M8 12h4v-6.5h4M12 12v6.5h4"/></svg>
          </button>
        </div>
      </div>
      <h1 class="title">${esc(TITLE)}</h1>
      <div class="meta">${esc(stamp(d.updatedAt || d.createdAt))}</div>
      <div class="pane" id="panePreview">
        <div class="body">${BODY.trim() ? mdToHtml(BODY) : '<p style="color:rgb(var(--faint))">（这篇笔记没有正文）</p>'}</div>
      </div>
      <div class="pane" id="paneSrc" hidden>
        <div class="md-bar"><button class="copy" id="copyMd">复制 Markdown</button></div>
        <pre class="src" id="srcBox"></pre>
      </div>
      <div class="pane" id="paneMap" hidden>
        <div class="mm-tools">
          <button type="button" data-mmz="out" title="缩小">－</button>
          <button type="button" data-mmz="in" title="放大">＋</button>
          <button type="button" data-mmz="fit">适应宽度</button>
        </div>
        <div class="mm-wrap" id="mmWrap"></div>
        <div class="mm-tip">由标题与缩进列表自动生成 · 只读视图</div>
      </div>
      <div class="foot">
        <button class="copy" id="imgBtn">保存长图</button>
        <button class="copy" id="copyBtn">复制链接</button>
      </div>`;
    document.body.dataset.mode = 'preview';
    const imgBtn = document.getElementById('imgBtn');
    imgBtn.onclick = async () => {
      imgBtn.disabled = true; imgBtn.textContent = '生成中…';
      try {
        const res = await lpRender({ title: TITLE, body: BODY });
        lpShow(res);
      } catch (e) {
        console.error(e);
        toast('生成长图失败：' + ((e && e.message) || '未知错误'));
      } finally {
        imgBtn.disabled = false; imgBtn.textContent = '保存长图';
      }
    };
    const btn = document.getElementById('copyBtn');
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); btn.textContent = '已复制'; }
      catch (e) { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制链接'; }, 1600);
    };
    document.querySelectorAll('#modes button').forEach(b => {
      b.onclick = () => setMode(b.dataset.mode);
    });
    const cm = document.getElementById('copyMd');
    if (cm) cm.onclick = async () => {
      try { await navigator.clipboard.writeText(BODY || ''); cm.textContent = '已复制'; }
      catch (e) { cm.textContent = '复制失败'; }
      setTimeout(() => { cm.textContent = '复制 Markdown'; }, 1600);
    };
    document.querySelectorAll('#paneMap [data-mmz]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.mmz;
        if (k === 'fit') { MAP.auto = true; MAP.k = 0; return paintMap(); }
        MAP.auto = false;
        MAP.k = Math.min(2.2, Math.max(0.35, (MAP.k || 1) * (k === 'in' ? 1.2 : 1 / 1.2)));
        paintMap();
      };
    });
    buildOutline();
    // 正文里的图片撑开高度会改动每个条目的位置，加载完重算一次
    document.querySelectorAll('.body img').forEach(im => {
      if (im.complete) return;
      im.addEventListener('load', olRefreshSoon);
      im.addEventListener('error', olRefreshSoon);
    });
    // 支持 ?view=map / ?view=src 直接以某种模式打开，也记住读者上次的选择
    let want = '';
    try { want = new URLSearchParams(location.search).get('view') || ''; } catch (e) {}
    if (!want) { try { want = localStorage.getItem('share.view') || ''; } catch (e) {} }
    setMode(want === 'map' || want === 'src' ? want : 'preview');
  } catch (e) {
    fail('网络错误');
  }
}
boot();
</script>
