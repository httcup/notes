<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分享的笔记</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style",Charter,"Source Serif 4","Songti SC","Noto Serif SC","Source Han Serif SC",STSong,Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  color-scheme:light;
  --canvas:247 248 249; --surface:255 255 255; --sunken:241 243 245;
  --ink:28 31 34; --ink-2:70 75 80; --muted:112 118 124; --faint:160 166 172;
  --line:230 233 236; --hover:234 237 240;
  --ivy:40 122 82; --ivy-soft:229 243 235; --ivy-ink:27 92 60;
  --code-bg:244 246 248;
  --shadow-paper:0 0 0 .5px rgb(16 24 32 / .05),0 1px 2px rgb(16 24 32 / .03),0 12px 32px -12px rgb(16 24 32 / .08);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --canvas:16 18 20; --surface:25 27 30; --sunken:34 37 41;
    --ink:232 235 238; --ink-2:190 195 200; --muted:138 144 150; --faint:96 101 107;
    --line:44 48 52; --hover:38 41 45;
    --ivy:86 180 130; --ivy-soft:28 50 39; --ivy-ink:150 224 182;
    --code-bg:31 34 38;
    --shadow-paper:0 0 0 .5px rgb(255 255 255 / .05),0 12px 32px -12px rgb(0 0 0 / .5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:rgb(var(--canvas));color:rgb(var(--ink));font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:720px;margin:0 auto;padding:48px 20px 96px}
.paper{
  background:rgb(var(--surface));border-radius:16px;box-shadow:var(--shadow-paper);
  padding:52px 56px 60px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:26px;font-size:12.5px;color:rgb(var(--faint))}
.brand .dot{width:6px;height:6px;border-radius:50%;background:rgb(var(--ivy))}
h1.title{
  font-family:var(--font-serif);font-size:29px;line-height:1.35;font-weight:700;
  margin:0 0 10px;letter-spacing:-.01em;
}
.meta{font-size:12.5px;color:rgb(var(--faint));margin-bottom:30px}
.body{font-family:var(--font-serif);font-size:17.5px;line-height:1.95;word-break:break-word}
.body>*{margin-top:0;margin-bottom:0}
.body>*+*{margin-top:.62em}
.body h1,.body h2,.body h3,.body h4{font-weight:600;line-height:1.4;margin:.9em 0 .3em}
.body h1{font-size:1.5em}
.body h2{font-size:1.3em}
.body h3{font-size:1.12em}
.body p{margin:0}
.body ul,.body ol{padding-left:1.35em;margin:.3em 0}
.body li{margin:.24em 0}
.body li::marker{color:rgb(var(--faint))}
.body blockquote{margin:.7em 0;padding:2px 0 2px 15px;border-left:2px solid rgb(var(--ivy) / .35);color:rgb(var(--ink-2))}
.body code{font-family:var(--font-mono);font-size:.86em;background:rgb(var(--code-bg));padding:2px 5px;border-radius:5px;border:.5px solid rgb(var(--line))}
.body mark{background:rgb(var(--ivy-soft));color:rgb(var(--ivy-ink));padding:1px 3px;border-radius:4px}
.body mark.hl-yellow{background:#fdf0c5;color:#7a580c}
.body mark.hl-pink{background:#fce2e5;color:#9a2c3c}
.body mark.hl-blue{background:#dbeafa;color:#1c4e84}
.body mark.hl-purple{background:#ebe2f8;color:#5e3a94}
.body mark.hl-gray{background:#e9ecef;color:#474e55}
@media (prefers-color-scheme: dark){
  .body mark.hl-yellow{background:#4a3c14;color:#f5dc94}
  .body mark.hl-pink{background:#4a222c;color:#f4b9c3}
  .body mark.hl-blue{background:#1b3552;color:#b3d4f7}
  .body mark.hl-purple{background:#33254d;color:#d6bcfa}
  .body mark.hl-gray{background:#34383d;color:#d2d7dc}
}
.body pre{background:rgb(var(--code-bg));border:.5px solid rgb(var(--line));border-radius:10px;padding:14px 16px;overflow-x:auto;margin:.9em 0}
.body pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.72;display:block}
.body hr{border:0;border-top:1px solid rgb(var(--line));margin:1.2em 0}
.body img{max-width:100%;border-radius:9px;display:block;margin:1em 0}
.body a{color:rgb(var(--ivy));text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px}
.body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94em}
.body th,.body td{border:1px solid rgb(var(--line));padding:7px 10px;text-align:left}
.body th{background:rgb(var(--sunken));font-weight:600}
.body .task{list-style:none;margin-left:-1.1em}
.body .task input{margin-right:7px;accent-color:rgb(var(--ivy))}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:38px;padding-top:18px;border-top:1px solid rgb(var(--line));
  font-size:12px;color:rgb(var(--faint));flex-wrap:wrap;
}
.foot a{color:rgb(var(--muted));text-decoration:none}
.foot a:hover{color:rgb(var(--ink))}
.copy{
  height:30px;padding:0 13px;border-radius:15px;border:0;cursor:pointer;
  background:rgb(var(--hover));color:rgb(var(--ink));font-size:12px;font-weight:600;font-family:inherit;
}
.copy:hover{background:rgb(var(--sunken))}
.state{text-align:center;padding:70px 10px;color:rgb(var(--faint));font-size:14px;line-height:2}
.state .big{font-family:var(--font-serif);font-size:19px;color:rgb(var(--muted));display:block;margin-bottom:6px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgb(var(--line));border-top-color:rgb(var(--ivy));display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .shell{padding:20px 12px 60px}
  .paper{padding:32px 22px 40px;border-radius:13px}
  h1.title{font-size:24px}
  .body{font-size:16.5px}
}

/* ===== 右侧悬浮大纲（与主应用同一套视觉：刻度 → 悬停滑出卡片） ===== */
.ol-zone{
  position:fixed;right:0;top:50%;margin-top:-66px;z-index:40;
  width:26px;height:132px;display:none;
  flex-direction:column;align-items:flex-end;justify-content:center;gap:10px;
  padding:6px 9px 6px 0;cursor:pointer;
}
body.has-ol .ol-zone{display:flex}
.ol-zone i{display:block;width:15px;height:1.5px;border-radius:2px;background:rgb(var(--ink)/.2);transition:background .16s,width .16s}
.ol-zone:hover i{width:18px;background:rgb(var(--ink)/.4)}
.ol-card{
  position:fixed;right:4px;top:66px;z-index:41;
  width:210px;max-height:min(66vh,calc(100vh - 130px));
  display:flex;flex-direction:column;outline:none;
  padding:6px 8px 8px;border-radius:14px;
  background:rgb(var(--surface));
  box-shadow:0 10px 34px rgb(var(--ink)/.13),0 2px 8px rgb(var(--ink)/.07);
  opacity:0;transform:translateX(12px);pointer-events:none;
  transition:transform .26s cubic-bezier(.34,1.25,.64,1),opacity .16s;
}
/* 鼠标在右侧刻度上、或移进卡片后保持展开 */
.ol-zone:hover ~ .ol-card,
.ol-card:hover,
.ol-card.open{opacity:1;transform:none;pointer-events:auto}
.ol-head{
  flex:0 0 auto;padding:6px 8px 7px;
  font-size:11px;font-weight:700;letter-spacing:.09em;color:rgb(var(--faint));
}
.ol-list{position:relative;overflow-y:auto;overscroll-behavior:contain;padding:0 1px 2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.ol-list::-webkit-scrollbar{width:7px}
.ol-list::-webkit-scrollbar-thumb{background:rgb(var(--ink)/.12);border-radius:7px;border:2px solid transparent;background-clip:content-box}
.ol-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:12.8px;line-height:1.55;color:rgb(var(--ink-2));
  padding:5px 8px;border-radius:7px;margin:0;
  transition:background .16s,color .16s,transform .2s,padding-left .2s;
}
.ol-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .dash{flex:0 0 auto;width:9px;height:1px;border-radius:1px;background:rgb(var(--ink)/.17);transition:width .18s,background .18s,height .18s}
.ol-card .ol-item:hover{background:rgb(var(--hover));color:rgb(var(--ink));font-weight:600;transform:translateX(3px)}
.ol-item.l1{font-weight:500;color:rgb(var(--ink))}
.ol-item.l2{padding-left:21px}
.ol-item.l3{padding-left:34px;font-size:12.3px}
.ol-item.l4{padding-left:47px;font-size:12.3px;color:rgb(var(--muted))}
.ol-item.on{color:rgb(var(--ink));font-weight:600}
.ol-item.on .dash{width:18px;height:1.5px;background:rgb(var(--ivy))}
@media (max-width:900px){
  .ol-card{width:min(206px,62vw);right:8px;top:60px;max-height:min(64vh,calc(100vh - 140px))}
}
@media (prefers-color-scheme: dark){
  .ol-card{box-shadow:0 10px 34px rgb(0 0 0/.5),0 2px 8px rgb(0 0 0/.35)}
}
/* 触屏没有 hover，只认点开的 .open。
   注意 tap 结束后元素会残留 :hover 状态，那条「悬停即展开」的规则特异性比 .ol-card.open 高，
   所以这里要用同样带兄弟组合器的写法把它压回去，否则点了也打不开 */
@media (hover:none){
  .ol-zone{width:30px}
  .ol-zone:hover ~ .ol-card,
  .ol-card:hover{opacity:0;transform:translateX(12px);pointer-events:none}
  .ol-zone:hover ~ .ol-card.open,
  .ol-card.open{opacity:1;transform:none;pointer-events:auto}
}

</style>
</head>
<body>
<div class="shell">
  <div class="paper" id="paper">
    <div class="state" id="state"><span class="spin"></span>正在打开笔记…</div>
  </div>
</div>
<!-- 右侧悬浮大纲：平时是一列细刻度，鼠标靠过去滑出卡片（触屏点一下切换） -->
<div class="ol-zone" id="olZone" role="button" tabindex="-1" aria-label="展开大纲"></div>
<aside class="ol-card" id="olCard" aria-label="大纲">
  <div class="ol-head">大纲</div>
  <nav class="ol-list" id="olList"></nav>
</aside>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,a) => '<a href="#">' + (a || t) + '</a>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=]+)==(?:\{(?:\.([a-z]+)|c:(#[0-9a-fA-F]{3,8}))\})?/g, (m,t,named,hex)=>{
    if(hex){
      const h = String(hex).replace('#','');
      const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
      const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
      return '<mark style="background:rgba('+r+','+g+','+b+',.24);color:color-mix(in srgb, '+hex+' 60%, CanvasText)">'+t+'</mark>';
    }
    const k = String(named||'').toLowerCase();
    const cls = ['yellow','pink','blue','purple','gray'].includes(k) ? ' class="hl-'+k+'"' : '';
    return '<mark'+cls+'>'+t+'</mark>';
  });
  return s;
}

function mdToHtml(md){
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  const isSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes('-');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const lang = line.slice(3).trim();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') + '>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m) { const lv = m[1].length; out.push('<h' + lv + '>' + inlineMd(m[2]) + '</h' + lv + '>'); i++; continue; }
    if (/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$|^\s*(_\s*){3,}$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote><p>' + buf.map(inlineMd).join('<br>') + '</p></blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = line; const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      out.push('<table><thead><tr>' + cells(head).map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + cells(r).map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        let l = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, '');
        if (/^\[[ xX]\]\s/.test(l)) {
          const chk = /^\[[xX]\]/.test(l);
          l = l.replace(/^\[[ xX]\]\s/, '');
          items.push('<li class="task"><input type="checkbox" disabled ' + (chk ? 'checked' : '') + '>' + inlineMd(l) + '</li>');
        } else {
          items.push('<li>' + inlineMd(l) + '</li>');
        }
        i++;
      }
      out.push(ordered ? '<ol>' + items.join('') + '</ol>' : '<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i]) && !isSep(lines[i])) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + buf.map(inlineMd).join('<br>') + '</p>');
  }
  return out.join('\n');
}

function getSlug(){
  const q = new URLSearchParams(location.search);
  if (q.get('slug')) return q.get('slug');
  if (q.get('s')) return q.get('s');
  const m = location.pathname.match(/\/s\/([A-Za-z0-9]+)/);
  if (m) return m[1];
  const h = (location.hash || '').replace(/^#/, '');
  return /^[A-Za-z0-9]+$/.test(h) ? h : '';
}

function stamp(t){
  const d = new Date(t || Date.now());
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fail(msg){
  document.getElementById('paper').innerHTML =
    '<div class="state"><span class="big">' + esc(msg) + '</span>这个链接可能已经失效，或者作者取消了分享。</div>';
}

/* ===== 悬浮大纲 ===== */
const olTouch = () => matchMedia('(hover:none)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches);
const OL = { heads: [], items: [], active: -1 };

function buildOutline(){
  const heads = [...document.querySelectorAll('.body h1,.body h2,.body h3,.body h4,.body h5,.body h6')];
  // 只有一个标题的话大纲没意义，入口也不出现
  if (heads.length < 2) return;
  const lv = heads.map(h => +h.tagName[1]);
  const base = Math.min(...lv);
  const list = document.getElementById('olList');
  OL.items = [];
  heads.forEach((h, i) => {
    if (!h.id) h.id = 'sec-' + i;
    h.style.scrollMarginTop = '28px';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ol-item l' + Math.min(4, lv[i] - base + 1);
    const t = document.createElement('span'); t.className = 't';
    t.textContent = (h.textContent || '').trim() || '（无标题）';
    const d = document.createElement('span'); d.className = 'dash';
    b.append(t, d);
    b.addEventListener('click', () => {
      jumpTo(h);
      if (olTouch()) document.getElementById('olCard').classList.remove('open');
    });
    list.appendChild(b);
    OL.items.push(b);
  });
  OL.heads = heads;
  // 右侧刻度条数量跟标题数走（3~6 条）
  const z = document.getElementById('olZone');
  const n = Math.max(3, Math.min(6, heads.length));
  z.innerHTML = '';
  for (let i = 0; i < n; i++) z.appendChild(document.createElement('i'));
  document.body.classList.add('has-ol');
  updateActive();
}

function jumpTo(el){
  const y = Math.max(0, el.getBoundingClientRect().top + window.scrollY - 28);
  if (olTouch()) {
    // iOS Safari 在触摸事件里会静默丢弃 smooth，这里瞬时到位
    const de = document.documentElement;
    const prev = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, y);
    setTimeout(() => { de.style.scrollBehavior = prev; }, 60);
    return;
  }
  try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, y); }
}

function updateActive(){
  if (!OL.heads.length) return;
  const y = window.scrollY + 150;
  let cur = 0;
  OL.heads.forEach((h, i) => { if (h.getBoundingClientRect().top + window.scrollY <= y) cur = i; });
  // 滚到底时选最后一条：末个标题可能永远到不了 150px 那条线
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = OL.heads.length - 1;
  if (cur === OL.active) return;
  OL.active = cur;
  OL.items.forEach((b, i) => b.classList.toggle('on', i === cur));
  const card = document.getElementById('olCard');
  if (!card.classList.contains('open') && getComputedStyle(card).opacity === '0') return;
  const list = document.getElementById('olList'), b = OL.items[cur];
  if (!b) return;
  const lr = list.getBoundingClientRect(), br = b.getBoundingClientRect();
  if (br.top < lr.top) list.scrollTop -= (lr.top - br.top) + 6;
  else if (br.bottom > lr.bottom) list.scrollTop += (br.bottom - lr.bottom) + 6;
}

let olTick = 0;
window.addEventListener('scroll', () => {
  if (olTick) return;
  olTick = requestAnimationFrame(() => { olTick = 0; updateActive(); });
}, { passive: true });
window.addEventListener('resize', updateActive);
// 触屏：点右侧刻度切换展开，点卡片外收起
document.getElementById('olZone').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('olCard').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  const card = document.getElementById('olCard');
  if (!card.classList.contains('open')) return;
  if (card.contains(e.target) || document.getElementById('olZone').contains(e.target)) return;
  card.classList.remove('open');
});

async function boot(){
  const slug = getSlug();
  if (!slug) return fail('链接不完整');
  try {
    const r = await fetch('/api/share?slug=' + encodeURIComponent(slug), { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok) return fail(d.error || '打不开这篇笔记');
    document.title = (d.title || '分享的笔记') + ' · 小胡小胡的笔记';
    document.getElementById('paper').innerHTML = `
      <div class="brand"><span class="dot"></span>公开分享 · 只读</div>
      <h1 class="title">${esc(d.title || '无标题')}</h1>
      <div class="meta">${esc(stamp(d.updatedAt || d.createdAt))}${d.updatedAt && d.createdAt && stamp(d.updatedAt) !== stamp(d.createdAt) ? '' : ''}</div>
      <div class="body">${d.body && d.body.trim() ? mdToHtml(d.body) : '<p style="color:rgb(var(--faint))">（这篇笔记没有正文）</p>'}</div>
      <div class="foot">
        <span>由「小胡小胡的笔记」分享</span>
        <button class="copy" id="copyBtn">复制链接</button>
      </div>`;
    const btn = document.getElementById('copyBtn');
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); btn.textContent = '已复制'; }
      catch (e) { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制链接'; }, 1600);
    };
    buildOutline();
  } catch (e) {
    fail('网络错误');
  }
}
boot();
</script>
</body>
